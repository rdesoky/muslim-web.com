name: Deploy to GitHub Pages

# Builds the static site and force-publishes it to the `gh-pages` branch.
# GitHub Pages serves that branch as https://rdesoky.github.io/muslim-web.com/

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build tools are plain Node.js (.mjs) — no Deno/TypeScript runtime needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp cache-busting versions
        run: node tools/build/build_static.mjs

      - name: Smoke-test the client-side CGI shim
        run: node tools/build/test_local_cgi.mjs

      - name: Assemble publishable tree
        run: node tools/gh-pages/build_site.mjs --out _site

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          # Every run rebuilds the whole tree, so a forced push keeps the branch small.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Deployed commit $(git rev-parse --short HEAD) to gh-pages"
