<SCRIPT LANGUAGE="JavaScript">
	function UpdateSuraPreview()
	{
		idSuraPreview.innerHTML = "تحميل....";
		document.body.startDownload("cgi-bin/get_sura_text.pl" + 
				"?s=" + (suraNo-1).toString(10) + 
				"&f=" + idFromAya.value + 
				"&t=" + idToAya.value
				, onGetSuraTextResponse);
		//idAyaImage.src = gsAyatImageURL + "" + suraNo.toString(10) + "_" + toStringEx(ayaNo,3) + ".gif";
	}
	
	function onGetSuraTextResponse(data)
	{
	idSuraPreview.innerHTML = data;
	}

	UpdateSuraPreview();

</SCRIPT>


<table width=100% border cellspacing=1>
<tr>
	<td colspan=2 align=center>
		نسبة الحفظ
	</tr>
<tr>
	<td id=idMemSura width=50%></td>
	<td id=idMemQuran width=50%></td>
</tr>
</table>

<script language="JavaScript">
	function UpdateStatus()
	{
		idMemSura.innerHTML  = suraMemPercent(suraNo) + "% من السورة " 
		idMemQuran.innerHTML = quranMemPercent() + "% من القرآن";
	}

	UpdateStatus();

	////////////////////////////////////////////////////////////////////////////
	function AddMemorize()
	{
		memorizeRange (suraNo, ayaNo, parseInt(idToAya.value) );

		UpdateStatus();

		if (window.opener) {
			window.opener.top.location.reload();
		}
	}

	////////////////////////////////////////////////////////////////////////////
	function memorizeSura() // called from withen Control Panel
	{
		memorizeSuraNo(suraNo);
		
		UpdateStatus();
		
		if (window.opener){
			window.opener.top.location.reload();
		}

	}
	////////////////////////////////////////////////////////////////////////////
	function memorizeSuraFromStart() // called from withen Control Panel
	{
		memorizeRange (suraNo, 1, parseInt(idToAya.value,10) );
		
		UpdateStatus();

		if (window.opener){
			window.opener.top.location.reload();
		}
	}
	////////////////////////////////////////////////////////////////////////////
	function unmemorize()
	{
		unMemorizeRange (suraNo, ayaNo, idToAya.value );

			UpdateStatus();
		if (window.opener){
			window.opener.top.location.reload();
		}
	}

	
	idSelectSura.focus();

</script>
