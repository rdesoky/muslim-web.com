<HTML><HEAD><META HTTP-EQUIV="PRAGMA" CONTENT="NO-CACHE"><META content="text/html;charset=windows-1256" http-equiv="Content-Type"><TITLE>The Holy Quran - القرآن الكريم - Koran Kareem</TITLE></HEAD><script>var gCheckLive=false;window.name="quran";function go_live(){if(!gCheckLive){return;}if(document.domain=="quran.muslim-web.com" || document.domain=="dev.muslim-web.com" || document.domain=="new.muslim-web.com" ){}else {document.location.replace('http://quran.muslim-web.com');}}function updateFrames(){if(document.domain !="quran.muslim-web.com" &&document.domain !="dev.muslim-web.com" &&document.domain !="new.muslim-web.com" ){gCheckLive=true;window.frames("live").location="http://quran.muslim-web.com/go_live.htm?"+((new Date()).getTime()).toString();}window.frames("qindex").location="home.htm?"+((new Date()).getTime()).toString();}function getCookie(name,default_value){var mycookies=document.cookie.split(";"+" ");for(var i=0;i<mycookies.length;i++){var mycookie=mycookies[i].split("=");if(mycookie[0]==name){var stub="_"+name;var retVal="";if(mycookie.length>1){var stub_index=retVal.indexOf(stub);retVal=mycookie[1];if(stub_index>-1&&stub_index==(retVal.length-stub.length)){retVal=retVal.substring(0,retVal.length-stub.length);}}return retVal;}}if(default_value){return default_value;}return "";}</script><frameset rows="*,0" onload="updateFrames()" border="0"><frame name="qindex" xsrc="home.htm"></frame><frame name="live" xsrc="http://quran.muslim-web.com/go_live.htm" scrolling=no onload="go_live()"></frame></frameset></HTML>
