<script language=JavaScript>
var gSura = 0;
function HoverIn(myElement){
	myElement.style.color="red";
	myElement.style.background="white";
}
function HoverOut(myElement){
	myElement.style.color="";
	myElement.style.background="";
}
function ClickOption(index){
	idReciteOptions[index].focus();
	idReciteOptions[index].checked=true;
	ApplyOptions();	
}
function onBodyLoad()
{
	idAudioTitle.innerHTML = "العرض الصوتي للقرآن" + " <img src=images/speaker.gif width=16 height=15>";

	var spinEdit = new McDhtmlSpin(1, 100, 1, null, "idLoopCount");

	idPlayCount.innerHTML = spinEdit;
	
	spinEdit.setValue(parseInt(getCookie("lpc","2")));
	idReciteOptions[parseInt(getCookie("lp","0"))].checked=true;

	idLoopCount.onchange = ApplyOptions;
	ApplyOptions();

	var sura_index = parseInt(parameter("sura",-1), 10);
	if(sura_index>=0)	{
		gSura = sura_index;
		idSuraTag.innerHTML = "سورة: ";
		idSuraName.innerHTML    = "<a href=sura.htm?aya=" + toStringEx(sura_index,3) + " target=quran>" + gSuraNames[sura_index] + "</a>";
	}

	var reciter_index = parameter("reciter", -1);
	if(reciter_index>=0){
		idReciterTag.innerHTML = "تلاوة: ";
		idReciterName.innerHTML = gReciterNames[reciter_index];
		document.title = idReciterTag.innerText + idReciterName.innerText + " - " + document.title;
	}

	//alert(window.location.href);
	var sAudioURL = unescape(parameter("url"));
	//alert(unescape(sAudioURL));
	if( sAudioURL.indexOf(".rm") == -1 )
	{
		idPlayer.SetSource( sAudioURL );
	}
	else
	{
		idPlayer.SetSource( "http://cgi.muslim-web.com/cgi-bin/ram.pl?rm=" + escape( sAudioURL ) );
	}

	//window.setTimeout("idPlayer.DoPlay();", 500);
	idPlayer.DoPlay();
}
////////////////////////////////////////////////////////////////////
function ApplyOptions()
{
	if( idReciteOptions[0].checked ){
		idPlayer.SetLoop(0);
		idPlayer.SetNumLoop(1);
		setCookie("lp",0);
	}else if( idReciteOptions[1].checked ) {
		idPlayer.SetLoop(1);
		idPlayer.SetNumLoop(idLoopCount.value);
		setCookie("lp",1);
		setCookie("lpc",idLoopCount.value);
	}else{
		idPlayer.SetLoop(1);
		idPlayer.SetNumLoop(-1);
		setCookie("lp",2);
	}
}

var gCurrPosition=-1;
var gCurrLength=-1;

function ResumeSound(position)
{
	idPlayer.DoStop();
	idPlayer.DoPlay();
	var pos = position-10000;
	idPlayer.SetPosition( pos > 0 ? pos : 0 );
}

function Backward10Secs()
{
	var pos = gCurrPosition-10000;
	idPlayer.SetPosition( pos > 0 ? pos : 0 );
}

function SetStatus( nStatus, sStatus )
{
	if( PlayerStatus.status == nStatus ){
		return;
	}
	if( sStatus ){
		PlayerStatus.innerHTML = sStatus;
	}
	PlayerStatus.status = nStatus;
}
