<HTML>
<head>
<meta http-equiv=Content-Type content="text/html; charset=utf-8">
<title>تسجيل بيانات االحفظ</title>
<STYLE type="text/css">
	body{	    BORDER: none; }
	A           { TEXT-DECORATION:none }
	A:link		{ color:#003399; }
	A:visited	{ color:#003399; }
	A:hover		{ color:blue; text-decoration:underline;}
	td          {FONT-SIZE=11px;FONT-FAMILY=tahoma}
	body        {FONT-SIZE=9pt;FONT-FAMILY=tahoma}
	input       {FONT-FAMILY:Tahoma;FONT-SIZE:9px; HEIGHT=20;}
	select      {FONT-FAMILY:Tahoma;FONT-SIZE:11px; HEIGHT=25;FONT-WEIGHT:bold}
	.smallBtn	{width:70}
	.largBtn	{width:106}
</STYLE>

<script language="JavaScript" src="lib.js?v=20080812"></script>
<script language="JavaScript" src="qlib.js?v=20080813"></script>
<script language="JavaScript" src="tlib.js?v=20080817"></script>
<script src="http://stats.muslim-web.com/cgi-bin/counter.pl" language="vbscript"></script>

<script language="JavaScript">
var quranWindow;
var suraNo = parseInt(parameter("s"));
var ayaNo  = parseInt(parameter("a"));

function onResize()
{
	window.resizeTo(200,240);
}

function changeAya()
{
	ayaNo = idFromAya.value;
	
	//UpdateSuraPreview();
	window.location.replace( "a.htm?s=" + suraNo + "&a=" + idFromAya.value );
}

function changeSura()
{
	window.location.replace(  "a.htm?s=" + idSelectSura.value + "&a=1" );
}

function activateQuran()
{
	quranWindow.focus();
	window.focus();
}

function showTahfeez()
{
	quranWindow = window.open("memtable.htm" , "quran");
	setTimeout(activateQuran,1000);
}

window.focus();
function onBodyLoad()
{
	UpdateSuraPreview();
	FitWindow();
}
</script>
</head>

<body onload="onBodyLoad()" 
	dir=rtl 
	bgcolor=#dcdcb6 
	leftmargin=4 
	topmargin=3 
	style="behavior:url('#default#download');">
&lt;<a href="javascript:showText();">إضغط هنا</a>&gt;&nbsp;لتعديل بيانات التحفيظ بتحديد الآيات مباشرة من النص
<table width=100% >
<tr>
<td>
سورة
<select id=idSelectSura onchange=changeSura()>
	<script language="JavaScript">
	for (a=1;a<=114;a++){
		if(a==suraNo)
			document.write("<option selected value=" + a + ">" + a.toString() + "&nbsp;" + gSuraNames[a]);
		else
			document.write("<option value=" + a + ">" + a.toString() + "&nbsp;" + gSuraNames[a]);
	}
	</script>
</select>
</td>
<td align=left>

من الآية
<select id=idFromAya onchange=changeAya()>
	<script language="JavaScript">

	for (a=1;a<=VerseNoInSoura[suraNo];a++){
		if(a==ayaNo)
			document.write("<option selected value=" + a + ">" + a);
		else
			document.write("<option value=" + a + ">" + a);
	}

	</script>
</select>

إلى الآية
<select id=idToAya  onchange=UpdateSuraPreview()>
	<script language="JavaScript">

	for (a=ayaNo;a<=VerseNoInSoura[suraNo];a++){
		document.write("<option value=" + a + ">" + a);
	}
	</script>
</select></td>
</tr>
</form>

</table>

<table width=100% >
<tr>
	<td width=100% valign=top>
		<div id=idSuraPreview 
			align=right 
			style="height:163px;overflow-y:scroll;background:white;border:solid 1px gray;padding:3px;color:green;"></div>
			
			<table width=100% border cellspacing=0 xcellpadding=0>
			<tr>
				<td colspan=2 align=center><a href="javascript:showTahfeez()">
					بيانات التحفيظ (انقر هنا للعرض)
				</a>
				</td>
			</tr>
			<tr>
				<td width=50%>
					<span id=idMemSuraChart style='position:absolute;padding:0;border:solid 1px silver;background:#FFFFCC;width:0%'></span><span 	id=idMemSura style="position:absolute;"></span>&nbsp;
				</td>
				<td width=50%>
					<span id=idMemQuranChart  style='position:absolute;padding:0;border:solid 1px silver;background:#FFFFCC;width:0%'></span><span 	id=idMemQuran style="position:absolute;"></span>&nbsp;
				</td>
			</tr>
			</table>
	</td>
	<td valign=top>
		<input type=button class=largBtn value="حفظت السورة بالكامل" onclick="memorizeSura()" id=button1 name=button1><br>
		<input type=button class=largBtn value="لا تحفظ هذه السورة" onclick="unMemorizeAllSura()" id=button1 name=button1><br>
		<input type=button class=largBtn value="حفظت الآيات المختارة" onclick="AddMemorize()" id=button1 name=button1><br>
		<input type=button class=largBtn value="لا تحفظ هذه الآيات" onclick="unmemorize()" id=button3 name=button3><br>
		<input type=button class=largBtn value="الآيات المختارة تحت الحفظ" onclick="memorizeBending()" id=button3 name=button3><br>
		<input type=button class=largBtn value="حفظت من بداية السورة" onclick="memorizeSuraFromStart()" ><br>
		<input type=button class=largBtn value="حفظت الى نهاية السورة" onclick="memorizeSuraFromStart()" ><br>

		<input type=button class=largBtn value="تلاوة الحصري" onclick="recite(0)" ><br>
		<input type=button class=largBtn value="تلاوة الحذيفي" onclick="recite(1)" ><br>
		<input type=button class=largBtn value="عرض النص" onclick="showText()" ><br>
	</td>
</tr>
</table>

<SCRIPT LANGUAGE="JavaScript">
	function recite(nReciter)
	{
		var reciters = Array(33,19);
		openReciter("http://cgi.muslim-web.com/cgi-bin/recite.pl?s=" + suraNo + "&f=" + idFromAya.value + "&t=" + idToAya.value + "&r=" + nReciter, suraNo, reciters[nReciter]);
	}

	function UpdateSuraPreview()
	{
		idSuraPreview.innerHTML = "تحميل....";
		
		var sURL = "http://cgi.muslim-web.com/cgi-bin/get_sura_text.pl?" + 
					"s=" + (suraNo-1).toString(10) + 
					"&f=" + idFromAya.value + 
					"&t=" + idToAya.value;
		
		LoadData( sURL, "onGetSuraTextResponse( gDataResponse )", true );
		//idAyaImage.src = gsAyatImageURL + "" + suraNo.toString(10) + "_" + toStringEx(ayaNo,3) + ".gif";
	}
	
	function onGetSuraTextResponse(data)
	{
		idSuraPreview.innerHTML = ConvertCP1256ToUnicode(data);
	}

</SCRIPT>



<script language="JavaScript">
	
	var gOpener = window.opener;

	function showText()
	{
		try
		{
			quranWindow = window.opener.open( "sura.htm?aya=" + toStringEx(suraNo,3) + toStringEx(ayaNo,3), "_self" );
		}
		catch(e)
		{
			quranWindow = window.open("sura.htm?aya=" + toStringEx(suraNo,3) + toStringEx(ayaNo,3), "quran");
		}

		window.close();
	}

	function UpdateStatus()
	{
		var quran_percent = quranMemPercent().toString(10);
		var sura_percent  = suraMemPercent(suraNo).toString(10);

		idMemSuraChart.style.width = sura_percent + "%";
		idMemQuranChart.style.width = quran_percent + "%";
		idMemSura.innerHTML  = sura_percent + "% من السورة ";
		idMemQuran.innerHTML = quran_percent + "% من القرآن";
	}

	UpdateStatus();

	////////////////////////////////////////////////////////////////////////////
	function AddMemorize()
	{
		memorizeRange (suraNo, ayaNo, parseInt(idToAya.value) );

		UpdateStatus();

		if (gOpener) {
			//gOpener.top.location.reload();
			gOpener.UpdateSuraMem(suraNo);
		}
	}

	////////////////////////////////////////////////////////////////////////////
	function memorizeSura() // called from withen Control Panel
	{
		memorizeSuraNo(suraNo);
		
		UpdateStatus();
		
		if (gOpener){
			//gOpener.top.location.reload();
			gOpener.UpdateSuraMem(suraNo);
		}
		
		if (idSelectSura.selectedIndex < 113) {
			idSelectSura.selectedIndex ++;
			changeSura();
		}
	}
	////////////////////////////////////////////////////////////////////////////
	function unMemorizeAllSura() // called from withen Control Panel
	{
		unMemorizeSura(suraNo);
		
		UpdateStatus();
		
		if (gOpener){
			//gOpener.top.location.reload();
			gOpener.UpdateSuraMem(suraNo);
		}

		if (idSelectSura.selectedIndex < 113) {
			idSelectSura.selectedIndex ++;
			changeSura();
		}
	}
	////////////////////////////////////////////////////////////////////////////
	function memorizeSuraFromStart() // called from withen Control Panel
	{
		memorizeRange (suraNo, 1, parseInt(idToAya.value,10) );
		
		UpdateStatus();

		if (gOpener){
			//gOpener.top.location.reload();
			gOpener.UpdateSuraMem(suraNo);
		}
	}
	////////////////////////////////////////////////////////////////////////////
	function unmemorize()
	{
		unMemorizeRange (suraNo, ayaNo, idToAya.value );

		UpdateStatus();
		if (gOpener){
			//gOpener.top.location.reload();
			gOpener.UpdateSuraMem(suraNo);
		}
	}

	////////////////////////////////////////////////////////////////////////////
	function memorizeBending()
	{
		memorizeBendingRange(suraNo, ayaNo, idToAya.value);
		UpdateStatus();
	}

	idSelectSura.focus();

	var user = getCookie("user");

	if (user.length)
		document.title = "تسجيل بيانات الحفظ للمستخدم (" + user + ")";

	function FitWindow()
	{
		window.resizeTo(350, document.body.scrollHeight + 55);
	}

</script>

</body>
</html>
