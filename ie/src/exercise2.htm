<script language=JavaScript >
if (! window.dialogArguments )
	window.dialogArguments = "sura=0&aya=0&toaya=0&text=بسم الله الرحمن الرحيم";

////////////////////////////////////////////////////////////////////
//
////////////////////////////////////////////////////////////////////
var gTrTotal, gScore, gDlgArgs;
////////////////////////////////////////////////////////////////////
//
////////////////////////////////////////////////////////////////////
function InitPage()
{
	gDlgArgs = new CDialogArgs();

	idAyaDisplay.style.display = "";
	idAyaDisplay.innerHTML = gDlgArgs.text;

	gTrTotal=0;
	gScore=0;

	gTrTotal	= parseInt(readCookie("tt"),10);
	gScore		= parseInt(readCookie("ts"),10);

	UpdateScore();

	window.setTimeout("FitWindow()",1000);

	StartExercise();

	idHelpPanel.innerText = 4 + parseInt( idHelpPanel.innerText );
}

function FitWindow()
{
	window.dialogHeight = (document.body.scrollHeight + 55).toString() + "px";
}
////////////////////////////////////////////////////////////////////
//
////////////////////////////////////////////////////////////////////
function StartExercise()
{
	idUserAnswer.style.display = "none";


	DoExercise( gDlgArgs.sura, 
				gDlgArgs.aya, 
				gDlgArgs.toaya,
				gDlgArgs.text, 
				RemoveTashkeel(gDlgArgs.text) );//ConvertCP1256ToUnicode(aInfo[2]), ConvertCP1256ToUnicode(aInfo[3]) );

	idAction.style.display = "none";
}
////////////////////////////////////////////////////////////////////
//
////////////////////////////////////////////////////////////////////
function UpdateScore()
{
	if (false ==(gTrTotal > 0) )
		gTrTotal = 0;

	if (false == (gScore > 0) )
		gScore = 0;

	idTotal.innerText = gTrTotal.toString();
	
	idScore.innerText = gScore.toString();

}

////////////////////////////////////////////////////////////////////
//
////////////////////////////////////////////////////////////////////
function OpenAya()
{
	window.close();
}

</script>

<script language="JavaScript" src="exercise.js?v=1"></script>

<link rel="StyleSheet" href="exercise.css">

</HEAD>

<BODY dir=RTL bgColor="#efefe7" onload="javascript:InitPage()" style="padding:5px;behavior:url('#default#download');">

<div id=idAyaHeader style=""></div>
<div id=idAyaDisplay style="behavior:url('#default#download');display:none"></div>

<table id=idUserAnswer style="display:none" width="100%">
<tr>
	<td>
اكتب النص من ذاكرتك في المساحة التالية:
		<textarea type=edit id=idAnswer rows=5 style="width:100%;font-family:Traditional Arabic;font-size:24px"></textarea>
				
		<div align=left>
			<input type=button value='تــــم' onclick='CheckAnswer()'>
			<input type=button id=idGiveUp value='الغـــاء' onclick='CancelExercise()' >
		</div>
	</td>
</tr>
</table>
<div id=idScoreBoard align=center>
<input type=button id=idAction value='اضغط هنا لبدء التدريب' onclick='StartExercise()'>
&nbsp;
عدد المحاولات  الناجحة (
<span id=idScore style="font-weight:bold"></span> )
	من
(<span id=idTotal style="font-weight:bold"></span>)

</div>

<div id=idHelpPanel align=center></div>

	</li>
</ul>
</div>
