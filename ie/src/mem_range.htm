<html>

<head>
<meta http-equiv=Content-Type content="text/html; charset=utf-8">
<META content="text/html; charset=windows-1256" http-equiv="Content-Type">
<link rel="StyleSheet" href="defaultstyle.css">

<script language="JavaScript" src="lib.js"></script>
<script language="JavaScript" src="qlib.js"></script>
<script language="JavaScript" src="tlib.js"></script>

</head>

<body dir=rtl bgcolor=#D4D0C8>

<table width=100% height=100% cellpadding=10 ID="Table1">
<tr>
	<td>
		<div id=idDlgDesc></div>
	</td>
</tr>
<form name=myForm>
<tr>
	<td height=100%>
		<p><span id=idFromAya></span></p>
		<p>إلى الآية&nbsp;<span id=idToAyaSpan></span></p>
	</td>
</tr>	
<tr>
	<td align=center>
	<input type=button value=' تنفيذ ' onclick="applyChanges()" ID="Button1" NAME="Button1">&nbsp;&nbsp;
	<input type=button value=' تراجع ' onclick="window.close()" ID="Button2" NAME="Button2">
	</td>
</tr>

</form>
</body>

<script language=JavaScript>

	var myArgs = DialogArgs();
	var ayaNo  = myArgs.aya;
	var suraNo = myArgs.sura;

	switch (parseInt(myArgs.func,10))
	{
		case 1:
			document.title = "تسجيل حفظ";
			idDlgDesc.innerHTML = "<p>حدد نهاية المجال الذي انتهى عنده الحفظ";
			break;
		case 2:
			idDlgDesc.innerHTML = "<p>حدد نهاية المجال الذي تقوم بحفظه";
			document.title = "تسجيل تحت الحفظ";
			break;
		case 3:
			idDlgDesc.innerHTML = "<p>حدد نهاية المجال المراد الغاءه من الحفظ";
			document.title = "إلغاء حفظ";
			break;
	}

	idFromAya.innerText = "سورة " + gSuraNames[suraNo] + " - من آيه رقم " + ayaNo.toString() ;

	var sAyaSelect;
	sAyaSelect = "<select name=toAya>";

	for (a=ayaNo;a<=VerseNoInSoura[suraNo];a++)
	{
		sAyaSelect += "<option value=" + a + ">" + a + "</option>";
	}
	sAyaSelect += "</select>";

	idToAyaSpan.innerHTML = sAyaSelect ;

////////////////////////////////////////////////////////////
	function applyChanges()
	{
		switch (parseInt(myArgs.func,10))
		{
			case 1:
				memorizeRange(myArgs.sura, myArgs.aya, myForm.toAya.value);
				break;
			case 2:
				memorizeBendingRange(myArgs.sura, myArgs.aya, myForm.toAya.value);
				break;
			case 3:
				unMemorizeRange(myArgs.sura, myArgs.aya, myForm.toAya.value);
				break;
		}

		window.close();
	}
////////////////////////////////////////////////////////////
	function DialogArgs()
	{
		var myArgs = window.dialogArguments.split("&");
		
		for (i = 0 ; i<myArgs.length; i++)
		{
			var myParamPair = myArgs[i].split("=");
			eval ("this." + myParamPair[0] + "=\"" + myParamPair[1] + "\"");
		}
		
		return this;
	}
</script>

</html>
