<HTML>

<HEAD>

<STYLE type="text/css">
	A           { TEXT-DECORATION:none }
	A:link		{ color:#003399; }
	A:visited	{ color:#003399; }
	A:hover		{ color:blue; FONT-WEIGHT:bolder; xbackground:yellow}

	.suraLink   {cursor:hand;border-bottom:solid 1px silver;padding-top:1px;padding-bottom:1px;font-size:10px;color:#003399}

<script language="JavaScript" src=tlib.js?v=20080817></script>
<script language="JavaScript">

var gSortValue = getCookie("sort");

function changeSort()
{
	if (gSortValue == "1")
		gSortValue = "0";
	else
		gSortValue = "1";

	setCookie ("sort",gSortValue);

	idIndex.innerHTML=GetIndex();
}
</script>
</HEAD>
<body bgColor=#dcdcb6 leftmargin=5 topmargin=0 onload="idIndex.innerHTML=GetIndex()">
<BASEFONT face="Tahoma" size=1>
<base target="_top">
<div dir=rtl NOWRAP>

<div align=center class="listItem" onclick="window.top.location.href='/ie.php'">الفهرس</div>
<div align=center class="listItem" onclick="changeSort()" id=idSort></div>
<div id=idIndex style="padding-top:5px"></div>
<script>
function GetIndex()
{
	var sHTML = "";
	var n,i;

	var MemPercent = AllSuraMemPercent();

	for (n=1; n<115; n++)
	{
		if( gSortValue == "1" ){
			i = gSortedSura[n-1];
		}
		else{
			i = n;
		}

		var suraPercent = MemPercent[i-1];
		var sHREF = "sura.htm?aya=" + toStringEx(i,3) ;
		
		sHTML += "<div NOWRAP class=suraLink onclick=\"window.open('" + sHREF + "', '_top')\" onmouseover=\"this.style.background='#efefde';this.style.fontWeight='bold'\" onmouseout=\"this.style.background='';this.style.fontWeight=''\">" ;

		if (suraPercent > 0)
		{
			sHTML += "<span style='position:absolute;'>" + toStringEx(i,3) + "&nbsp;" + gSuraNames[i] + "</span>" +
					"<span id=idSMemChart style='padding:0;border:solid 1px silver;background:#FFFFCC;width:" + suraPercent.toString(10) + "%'></span>";
		}
		else
		{
			sHTML += toStringEx(i,3) + "&nbsp;" + gSuraNames[i] ;
		}

		sHTML += "</div>";
	}

	if (gSortValue == "1"){
		idSort.innerText = "ترتيب أبجدي";
	}else{
		idSort.innerText = "ترتيب المصحف";
	}

	return sHTML;
}
</script>
</div>
&nbsp;
</BODY>
</HTML>
