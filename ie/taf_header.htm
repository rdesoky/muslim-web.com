<html><head><meta http-equiv=Content-Type content="text/html;charset=utf-8"><STYLE type="text/css">select,input{FONT-FAMILY:Tahoma;FONT-SIZE:10px;}</STYLE></head><body leftmargin="2" rightmargin="2" topmargin="0" bottommargin="0" dir=RTL style="background:#dcdcb6" style="font-size:9px;font-family:tahoma">تفسير<select onchange="onChangeTafseer()" id=idSelectTafseer><option value=KATHEER>إبن كثير</option><option value=GALALEEN>الجلالين</option><option value=TABARY>الطبري</option><option value=KORTOBY>القرطبي</option></select><span style="cursor:hand" onclick="GoPrev()">&nbsp;<img src=images/prev.gif>&nbsp;</span><a href="javascript:ShowAya()">آية رقم:<span id=idAyaNo>1</span></a><span style="cursor:hand" onclick="GoNext()">&nbsp;<img src=images/next.gif>&nbsp;</span><input type=button value="اغلاق" onclick="window.parent.HideTafseer()"></body></html><script>var gAya=1,gSura=1;function ShowAya(){window.open("qtext/sura_"+toStringEx(gSura,3)+".shtml#"+gAya,"main");}function toStringEx(value,length){var theString;theString=value.toString(10);while(theString.length<length){theString="0"+theString;}return theString;}function SetAyaNo(sura,aya){gSura=sura;idAyaNo.innerText=gAya=aya;}function onChangeTafseer(){window.parent.ShowTafseer(gSura,gAya,idSelectTafseer.value);}function SetTafseer(sValue){idSelectTafseer.value=sValue;}function GoNext(){SetAyaNo(gSura,gAya+1);onChangeTafseer();}function GoPrev(){if(gAya>1){SetAyaNo(gSura,gAya - 1);onChangeTafseer();}}</script>
