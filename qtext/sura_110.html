<p>(110 - سورة النصر)</p>
 
		<p><span class='pageButton'>
				<span class='upBtn'>&nbsp;</span
					><span pageNo="603">(ص 603)</span
				><span class='dnBtn'>&nbsp;</span>
			</span>
			<span class='basm'>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
		</p>

		<p aya="1">
			 إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ&nbsp;
			<span akey="1">(1)</span>
		</p>

			
		<p aya="2">
			وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا&nbsp;
			<span akey="2">(2)</span>
		</p>

			
		<p aya="3">
			فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ <span class=ps>ۚ</span> إِنَّهُ كَانَ تَوَّابًا&nbsp;
			<span akey="3">(3)</span>
		</p>
