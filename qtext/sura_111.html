<p>(111 - سورة المسد)</p>
 
		<p><span class='pageButton'>
				<span class='upBtn'>&nbsp;</span
					><span pageNo="603">(ص 603)</span
				><span class='dnBtn'>&nbsp;</span>
			</span>
			<span class='basm'>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
		</p>

		<p aya="1">
			 تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ&nbsp;
			<span akey="1">(1)</span>
		</p>

			
		<p aya="2">
			مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ&nbsp;
			<span akey="2">(2)</span>
		</p>

			
		<p aya="3">
			سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ&nbsp;
			<span akey="3">(3)</span>
		</p>

			
		<p aya="4">
			وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ&nbsp;
			<span akey="4">(4)</span>
		</p>

			
		<p aya="5">
			فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ&nbsp;
			<span akey="5">(5)</span>
		</p>
