<p>(113 - سورة الفلق)</p>
 
		<p><span class='pageButton'>
				<span class='upBtn'>&nbsp;</span
					><span pageNo="604">(ص 604)</span
				><span class='dnBtn'>&nbsp;</span>
			</span>
			<span class='basm'>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
		</p>

		<p aya="1">
			 قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ&nbsp;
			<span akey="1">(1)</span>
		</p>

			
		<p aya="2">
			مِنْ شَرِّ مَا خَلَقَ&nbsp;
			<span akey="2">(2)</span>
		</p>

			
		<p aya="3">
			وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ&nbsp;
			<span akey="3">(3)</span>
		</p>

			
		<p aya="4">
			وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ&nbsp;
			<span akey="4">(4)</span>
		</p>

			
		<p aya="5">
			وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ&nbsp;
			<span akey="5">(5)</span>
		</p>
