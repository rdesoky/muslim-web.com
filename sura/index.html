		<script type="text/javascript">
			// bootstrap: resolve language before any other script runs
			window.gBuildVer = "20261027.181403";
			(function () {
				var lang = "";
				var qm = window.location.search.match(/[?&]lang=(ar|en)/i);
				if (qm) {
					lang = qm[1].toLowerCase();
					var exp = new Date(Date.now() + 3600 * 24 * 365 * 5 * 1000);
					document.cookie = "lang=" + lang + "; path=/; expires=" + exp.toGMTString();
				} else {
					var cookie = document.cookie.split(";");
					for (var i = 0; i < cookie.length; i++) {
						var pair = cookie[i].split("=");
						if (pair[0].trim() == "lang") {
							var v = decodeURIComponent(pair[1]).trim();
							if (v == "ar" || v == "en") lang = v;
							break;
						}
					}
				}
				if (lang != "ar" && lang != "en") lang = "ar";
				window.gLang = lang;
				document.documentElement.lang = lang;
				document.documentElement.dir = lang == "ar" ? "rtl" : "ltr";
				document.write(
					'<scr' + 'ipt type="text/javascript" src="../js_strings_' + lang +
					'.js?v=' + window.gBuildVer + '"></scr' + 'ipt>'
				);
			})();
		</script>

		<script type="text/javascript">
			// theme bootstrap: apply saved/effective theme before first paint
			(function () {
				var KEY = "theme";
				function getCookie(name) {
					var m = ("; " + document.cookie).split("; " + name + "=");
					return m.length === 2 ? m[1].split(";")[0] : "";
				}
				function resolve(pref) {
					if (pref !== "dark" && pref !== "light" && pref !== "system") pref = "system";
					if (pref === "system") {
						pref = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
							? "dark" : "light";
					}
					return pref;
				}
				document.documentElement.setAttribute("data-theme", resolve(getCookie(KEY)));
			})();
		</script>

		<script type="text/javascript">
			function populateStrings() {
				var S = window.gStrings;
				if (typeof S == "undefined") return;
				var els = document.querySelectorAll("[data-str]");
				for (var i = 0; i < els.length; i++) {
					var el = els[i];
					var key = el.getAttribute("data-str");
					if (typeof S[key] == "undefined") continue;
					if (el.tagName == "INPUT" || el.tagName == "TEXTAREA") {
						el.value = S[key];
					} else {
						el.textContent = S[key];
					}
				}
				var titles = document.querySelectorAll("[data-str-title]");
				for (i = 0; i < titles.length; i++) {
					el = titles[i];
					key = el.getAttribute("data-str-title");
					if (typeof S[key] == "undefined") continue;
					el.title = S[key];
				}
				if (typeof S.page_title == "string") document.title = S.page_title;
				document.body.lang = window.gLang;
			}
		</script>
