<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إيَّاكَ نَعْبُد وَإِيَّاكَ نَسْتَعِين" </quran>أَيْ نَخُصّك بِالْعِبَادَةِ مِنْ تَوْحِيد وَغَيْره وَنَطْلُب الْمَعُونَة عَلَى الْعِبَاد وَغَيْرهَا .</p></td></tr></table></body></html>
