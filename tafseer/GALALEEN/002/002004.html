<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إلَيْك" </quran>أَيْ الْقُرْآن <quran>"وَمَا أُنْزِلَ مِنْ قَبْلك" </quran>أَيْ التَّوْرَاة وَالْإِنْجِيل وَغَيْرهمَا <quran>"وَبِالْآخِرَةِ هُمْ يُوقِنُونَ" </quran>يَعْلَمُونَ</p></td></tr></table></body></html>
