<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ وَلَكِنْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَا" </quran>لِلتَّنْبِيهِ <quran>"إنَّهُمْ هُمْ الْمُفْسِدُونَ وَلَكِنْ لَا يَشْعُرُونَ" </quran>بِذَلِكَ .</p></td></tr></table></body></html>
