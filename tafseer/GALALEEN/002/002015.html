<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه يَسْتَهْزِئ بِهِمْ" </quran>يُجَازِيهِمْ بِاسْتِهْزَائِهِمْ <quran>"وَيَمُدّهُمْ" </quran>يُمْهِلهُمْ <quran>"فِي طُغْيَانهمْ" </quran>بِتَجَاوُزِهِمْ الْحَدّ فِي الْكُفْر <quran>"يَعْمَهُونَ" </quran>يَتَرَدَّدُونَ تَحَيُّرًا حَال</p></td></tr></table></body></html>
