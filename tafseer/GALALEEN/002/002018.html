<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ</font></td></tr><tr><td align=right dir=rtl><p>هُمْ <quran>"صُمّ" </quran>عَنْ الْحَقّ فَلَا يَسْمَعُونَهُ سَمَاع قَبُول <quran>"بُكْم" </quran>خُرْس عَنْ الْخَيْر فَلَا يَقُولُونَهُ <quran>"عُمْي" </quran>عَنْ طَرِيق الْهُدَى فَلَا يَرَوْنَهُ <quran>"فَهُمْ لَا يَرْجِعُونَ" </quran>عَنْ الضَّلَالَة</p></td></tr></table></body></html>
