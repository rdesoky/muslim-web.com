<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ النَّارِ هُمْ فِيهَا خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا" </quran>كُتُبنَا <quran>"أُولَئِكَ أَصْحَاب النَّار هُمْ فِيهَا خَالِدُونَ" </quran>مَاكِثُونَ أَبَدًا لَا يَفْنَوْنَ وَلَا يَخْرُجُونَ</p></td></tr></table></body></html>
