<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَاجِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يَظُنُّونَ" </quran>يُوقِنُونَ <quran>"أَنَّهُمْ مُلَاقُو رَبّهمْ" </quran>بِالْبَعْثِ <quran>"وَأَنَّهُمْ إلَيْهِ رَاجِعُونَ" </quran>فِي الْآخِرَة فَيُجَازِيهِمْ</p></td></tr></table></body></html>
