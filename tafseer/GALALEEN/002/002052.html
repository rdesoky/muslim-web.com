<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ عَفَوْنَا عَنْكُمْ مِنْ بَعْدِ ذَلِكَ لَعَلَّكُمْ تَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ عَفَوْنَا عَنْكُمْ" </quran>مَحَوْنَا ذُنُوبكُمْ <quran>"مِنْ بَعْد ذَلِكَ" </quran>الِاتِّخَاذ <quran>"لَعَلَّكُمْ تَشْكُرُونَ" </quran>نِعْمَتنَا عَلَيْكُمْ</p></td></tr></table></body></html>
