<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ بَعَثْنَاكُمْ مِنْ بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ بَعَثْنَاكُمْ" </quran>أَحْيَيْنَاكُمْ <quran>"مِنْ بَعْد مَوْتكُمْ لَعَلَّكُمْ تَشْكُرُونَ" </quran>لَعَلَّكُمْ تَشْكُرُونَ نِعْمَتنَا بِذَلِكَ .</p></td></tr></table></body></html>
