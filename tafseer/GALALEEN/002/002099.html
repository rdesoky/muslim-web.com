<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَنْزَلْنَا إِلَيْكَ آيَاتٍ بَيِّنَاتٍ وَمَا يَكْفُرُ بِهَا إِلَّا الْفَاسِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَنْزَلْنَا إلَيْك" </quran>يَا مُحَمَّد <quran>"آيَات بَيِّنَات" </quran>أَيْ وَاضِحَات حَال رَدّ لِقَوْلِ ابْن صُورِيَّا لِلنَّبِيِّ مَا جِئْتنَا بِشَيْءٍ <quran>"وَمَا يَكْفُر بِهَا إلَّا الْفَاسِقُونَ" </quran>كَفَرُوا بِهَا</p></td></tr></table></body></html>
