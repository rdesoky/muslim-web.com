<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُ رَبُّهُ أَسْلِمْ قَالَ أَسْلَمْتُ لِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَاذْكُرْ <quran>"إذْ قَالَ لَهُ رَبّه أَسْلِمْ" </quran>انْقَدْ لِلَّهِ وَأَخْلِصْ لَهُ دِينك <quran>"قال أسلمت لرب العالمين"</quran></p></td></tr></table></body></html>
