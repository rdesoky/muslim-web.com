<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْحَقُّ مِنْ رَبِّكَ فَلَا تَكُونَنَّ مِنَ الْمُمْتَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الْحَقّ" </quran>كَائِنًا <quran>"مِنْ رَبّك فَلَا تَكُونَن مِنْ الْمُمْتَرِينَ" </quran>الشَّاكِّينَ فِيهِ أَيْ مِنْ هَذَا النَّوْع فَهُوَ أَبْلَغ مِنْ أَنْ لَا تَمْتَرِ</p></td></tr></table></body></html>
