<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا" </quran>عَلَى الْآخِرَة <quran>"بِالصَّبْرِ" </quran>عَلَى الطَّاعَة وَالْبَلَاء <quran>"وَالصَّلَاة" </quran>خَصَّهَا بِالذِّكْرِ لِتَكَرُّرِهَا وَعِظَمهَا <quran>"إنَّ اللَّه مَعَ الصَّابِرِينَ" </quran>بِالْعَوْنِ</p></td></tr></table></body></html>
