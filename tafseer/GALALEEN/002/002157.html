<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ عَلَيْهِمْ صَلَوَاتٌ مِنْ رَبِّهِمْ وَرَحْمَةٌ وَأُولَئِكَ هُمُ الْمُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ عَلَيْهِمْ صَلَوَات" </quran>مَغْفِرَة <quran>"مِنْ رَبّهمْ وَرَحْمَة" </quran>نِعْمَة <quran>"وَأُولَئِكَ هُمْ الْمُهْتَدُونَ" </quran>إلَى الصَّوَاب</p></td></tr></table></body></html>
