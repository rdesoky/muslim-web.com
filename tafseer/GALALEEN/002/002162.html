<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْظَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَالِدِينَ فِيهَا" </quran>أَيْ اللَّعْنَة وَالنَّار الْمَدْلُول بِهَا عَلَيْهَا <quran>"لَا يُخَفَّف عَنْهُمْ الْعَذَاب" </quran>طَرْفَة عَيْن <quran>"وَلَا هُمْ يُنْظَرُونَ" </quran>يُمْهَلُونَ لِتَوْبَةٍ أَوْ لِمَعْذِرَةٍ</p></td></tr></table></body></html>
