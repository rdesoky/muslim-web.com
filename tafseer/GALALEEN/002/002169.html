<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا يَأْمُرُكُمْ بِالسُّوءِ وَالْفَحْشَاءِ وَأَنْ تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا يَأْمُركُمْ بِالسُّوءِ" </quran>الْإِثْم <quran>"وَالْفَحْشَاء" </quran>الْقَبِيح شَرْعًا <quran>"وَأَنْ تَقُولُوا عَلَى اللَّه مَا لَا تَعْلَمُونَ" </quran>مِنْ تَحْرِيم مَا لَمْ يُحَرِّم وَغَيْره</p></td></tr></table></body></html>
