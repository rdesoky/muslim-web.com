<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ لَهُمْ نَصِيبٌ مِمَّا كَسَبُوا وَاللَّهُ سَرِيعُ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ لَهُمْ نَصِيب" </quran>ثَوَاب "مـِ" مِنْ أَجْل <quran>"مَا كَسَبُوا" </quran>عَمِلُوا فِي الْحَجّ وَالدُّعَاء <quran>"وَاَللَّه سَرِيع الْحِسَاب" </quran>يُحَاسِب الْخَلْق كُلّهمْ فِي قَدْر نِصْف نَهَار مِنْ أَيَّام الدُّنْيَا لِحَدِيثٍ بِذَلِكَ</p></td></tr></table></body></html>
