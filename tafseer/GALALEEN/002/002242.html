<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ" </quran>كَمَا يُبَيِّن لَكُمْ مَا ذُكِرَ <quran>"يُبَيِّن اللَّه لَكُمْ آيَاته لَعَلَّكُمْ تَعْقِلُونَ" </quran>تَتَدَبَّرُونَ</p></td></tr></table></body></html>
