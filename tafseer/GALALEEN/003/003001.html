<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الم</font></td></tr><tr><td align=right dir=rtl><p>سُورَة آل عِمْرَان [ مَدَنِيَّة وَآيَاتهَا مِائَتَانِ أَوْ إلَّا آيَة نَزَلَتْ بَعْد الْأَنْفَال ]</p><p><quran>"الم" </quran>اللَّه أَعْلَم بِمُرَادِهِ بِذَلِكَ .</p></td></tr></table></body></html>
