<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ لَا يَخْفَى عَلَيْهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه لَا يَخْفَى عَلَيْهِ شَيْء" </quran>كَائِن <quran>"فِي الْأَرْض وَلَا فِي السَّمَاء" </quran>لِعِلْمِهِ بِمَا يَقَع فِي الْعَالَم مِنْ كُلِّيّ وَجُزْئِيّ وَخَصَّهُمَا بِالذِّكْرِ لِأَنَّ الْحِسّ لَا يَتَجَاوَزهُمَا</p></td></tr></table></body></html>
