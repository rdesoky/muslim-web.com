<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ لَا إِلَهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُوَ الَّذِي يُصَوِّركُمْ فِي الْأَرْحَام كَيْف يَشَاء" </quran>مِنْ ذُكُورَة وَأُنُوثَة وَبَيَاض وَسَوَاد وَغَيْر ذَلِكَ <quran>"لَا إلَه إلَّا هُوَ الْعَزِيز" </quran>فِي مُلْكه <quran>"الْحَكِيم" </quran>فِي صُنْعه .</p></td></tr></table></body></html>
