<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ اصْطَفَى آدَمَ وَنُوحًا وَآلَ إِبْرَاهِيمَ وَآلَ عِمْرَانَ عَلَى الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه اصْطَفَى" </quran>اخْتَارَ <quran>"آدَم وَنُوحًا وَآل إبْرَاهِيم وَآل عِمْرَان" </quran>بِمَعْنَى أَنْفُسهمَا <quran>"عَلَى الْعَالَمِينَ" </quran>بِجَعْلِ الْأَنْبِيَاء مِنْ نَسْلهمْ .</p></td></tr></table></body></html>
