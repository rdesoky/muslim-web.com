<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذُرِّيَّةً بَعْضُهَا مِنْ بَعْضٍ وَاللَّهُ سَمِيعٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذُرِّيَّة بَعْضهَا مِنْ" </quran>وَلَد <quran>"بَعْض" </quran>مِنْهُمْ</p></td></tr></table></body></html>
