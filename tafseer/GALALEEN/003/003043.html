<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا مَرْيَمُ اقْنُتِي لِرَبِّكِ وَاسْجُدِي وَارْكَعِي مَعَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا مَرْيَم اُقْنُتِي لِرَبِّك" </quran>أَطِيعِيهِ <quran>"وَاسْجُدِي وَارْكَعِي مَعَ الرَّاكِعِينَ" </quran>أَيْ صَلِّي مَعَ الْمُصَلِّينَ .</p></td></tr></table></body></html>
