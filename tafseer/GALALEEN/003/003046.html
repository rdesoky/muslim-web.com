<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُكَلِّمُ النَّاسَ فِي الْمَهْدِ وَكَهْلًا وَمِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُكَلِّم النَّاس فِي الْمَهْد" </quran>أَيْ طِفْلًا قَبْل وَقْت الْكَلَام <quran>"وكهلا ومن الصالحين"</quran></p></td></tr></table></body></html>
