<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ رَبِّي وَرَبُّكُمْ فَاعْبُدُوهُ هَذَا صِرَاطٌ مُسْتَقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه رَبِّي وَرَبّكُمْ فَاعْبُدُوهُ هَذَا" </quran>الَّذِي آمُركُمْ بِهِ <quran>"صِرَاط" </quran>طَرِيق <quran>"مُسْتَقِيم" </quran>فَكَذَّبُوهُ وَلَمْ يُؤْمِنُوا بِهِ</p></td></tr></table></body></html>
