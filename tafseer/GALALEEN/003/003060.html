<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْحَقُّ مِنْ رَبِّكَ فَلَا تَكُنْ مِنَ الْمُمْتَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الْحَقّ مِنْ رَبّك" </quran>خَبَر مُبْتَدَأ مَحْذُوف أَيْ أَمْر عِيسَى <quran>"فَلَا تَكُنْ مِنْ الْمُمْتَرِينَ" </quran>الشَّاكِّينَ فِيهِ</p></td></tr></table></body></html>
