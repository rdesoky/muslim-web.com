<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ تَوَلَّوْا فَإِنَّ اللَّهَ عَلِيمٌ بِالْمُفْسِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنْ تَوَلَّوْا" </quran>أَعْرَضُوا عَنْ الْإِيمَان <quran>"فَإِنَّ اللَّه عَلِيم بِالْمُفْسِدِينَ" </quran>فَيُجَازِيهِمْ وَفِيهِ وَضْع الظَّاهِر مَوْضِع الْمُضْمَر</p></td></tr></table></body></html>
