<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَهْلَ الْكِتَابِ لِمَ تَكْفُرُونَ بِآيَاتِ اللَّهِ وَأَنْتُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَهْل الْكِتَاب لِمَ تَكْفُرُونَ بِآيَاتِ اللَّه" </quran>الْقُرْآن الْمُشْتَمِل عَلَى نَعْت مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَأَنْتُمْ تَشْهَدُونَ" </quran>تَعْلَمُونَ أَنَّهُ الْحَقّ</p></td></tr></table></body></html>
