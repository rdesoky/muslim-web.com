<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَهْلَ الْكِتَابِ لِمَ تَلْبِسُونَ الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُونَ الْحَقَّ وَأَنْتُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَهْل الْكِتَاب لِمَ تُلْبِسُونَ" </quran>تَخْلِطُونَ <quran>"الْحَقّ بِالْبَاطِلِ" </quran>بِالتَّحْرِيفِ وَالتَّزْوِير <quran>"وَتَكْتُمُونَ الْحَقّ" </quran>أَيْ نَعْت النَّبِيّ <quran>"وَأَنْتُمْ تَعْلَمُونَ" </quran>أَنَّهُ الْحَقّ</p></td></tr></table></body></html>
