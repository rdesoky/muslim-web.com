<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ تَوَلَّى بَعْدَ ذَلِكَ فَأُولَئِكَ هُمُ الْفَاسِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَنْ تَوَلَّى" </quran>أَعْرَض <quran>"بَعْد ذَلِكَ" </quran>الْمِيثَاق <quran>"فأولئك هم الفاسقون"</quran></p></td></tr></table></body></html>
