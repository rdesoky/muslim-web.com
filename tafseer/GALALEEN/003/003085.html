<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ يَبْتَغِ غَيْر الْإِسْلَام دِينًا فَلَنْ يُقْبَل مِنْهُ وَهُوَ فِي الْآخِرَة مِنْ الْخَاسِرِينَ" </quran>لِمَصِيرِهِ إلَى النَّار الْمُؤَبَّدَة عَلَيْهِ</p></td></tr></table></body></html>
