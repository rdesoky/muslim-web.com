<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا الَّذِينَ تَابُوا مِنْ بَعْدِ ذَلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا الَّذِينَ تَابُوا مِنْ بَعْد ذَلِكَ وَأَصْلَحُوا" </quran>عَمَلهمْ <quran>"فَإِنَّ اللَّه غَفُور" </quran>لَهُمْ <quran>"رَحِيم" </quran>بِهِمْ</p></td></tr></table></body></html>
