<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَا أَهْلَ الْكِتَابِ لِمَ تَكْفُرُونَ بِآيَاتِ اللَّهِ وَاللَّهُ شَهِيدٌ عَلَى مَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ يَا أَهْل الْكِتَاب لِمَ تَكْفُرُونَ بِآيَاتِ اللَّه" </quran>الْقُرْآن <quran>"وَاَللَّه شَهِيد عَلَى مَا تَعْمَلُونَ" </quran>فَيُجَازِيكُمْ عَلَيْهِ</p></td></tr></table></body></html>
