<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الَّذِينَ ابْيَضَّتْ وُجُوهُهُمْ فَفِي رَحْمَةِ اللَّهِ هُمْ فِيهَا خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمَّا الَّذِينَ ابْيَضَّتْ وُجُوههمْ" </quran>وَهُمْ الْمُؤْمِنُونَ <quran>"فَفِي رَحْمَة اللَّه" </quran>أَيْ جَنَّته</p></td></tr></table></body></html>
