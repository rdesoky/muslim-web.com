<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِلَّهِ مَا فِي السَّمَاوَات وَمَا فِي الْأَرْض" </quran>مُلْكًا وَخَلْقًا وَعَبِيدًا <quran>"وَإِلَى اللَّه تَرْجِع" </quran>تَصِير</p></td></tr></table></body></html>
