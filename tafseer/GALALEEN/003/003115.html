<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَفْعَلُوا مِنْ خَيْرٍ فَلَنْ يُكْفَرُوهُ وَاللَّهُ عَلِيمٌ بِالْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا تَفْعَلُوا" </quran>بِالتَّاءِ أَيَّتهَا الْأُمَّة وَالْيَاء أَيْ الْأُمَّة الْقَائِمَة <quran>"مِنْ خَيْر فَلَنْ يُكْفَرُوهُ" </quran>بِالْوَجْهَيْنِ أَيْ تَعْدَمُوا ثَوَابه بَلْ تُجَازَوْنَ عَلَيْهِ</p></td></tr></table></body></html>
