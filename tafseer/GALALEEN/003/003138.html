<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا بَيَانٌ لِلنَّاسِ وَهُدًى وَمَوْعِظَةٌ لِلْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا" </quran>الْقُرْآن <quran>"بَيَان لِلنَّاسِ" </quran>كُلّهمْ <quran>"وَهُدًى" </quran>مِنْ الضَّلَالَة <quran>"وَمَوْعِظَة لِلْمُتَّقِينَ" </quran>مِنْهُمْ</p></td></tr></table></body></html>
