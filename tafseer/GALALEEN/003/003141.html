<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِيُمَحِّصَ اللَّهُ الَّذِينَ آمَنُوا وَيَمْحَقَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِيُمَحِّص اللَّه الَّذِينَ آمَنُوا" </quran>يُطَهِّرهُمْ مِنْ الذُّنُوب بِمَا يُصِيبهُمْ <quran>"وَيَمْحَق" </quran>يُهْلِك</p></td></tr></table></body></html>
