<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَآتَاهُمُ اللَّهُ ثَوَابَ الدُّنْيَا وَحُسْنَ ثَوَابِ الْآخِرَةِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَآتَاهُمْ اللَّه ثَوَاب الدُّنْيَا" </quran>النَّصْر وَالْغَنِيمَة <quran>"وَحُسْن ثَوَاب الْآخِرَة" </quran>أَيْ الْجَنَّة وَحُسْنه : التَّفَضُّل فَوْق الِاسْتِحْقَاق</p></td></tr></table></body></html>
