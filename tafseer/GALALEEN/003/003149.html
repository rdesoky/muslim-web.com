<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تُطِيعُوا الَّذِينَ كَفَرُوا يَرُدُّوكُمْ عَلَى أَعْقَابِكُمْ فَتَنْقَلِبُوا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ آمَنُوا إنْ تُطِيعُوا الَّذِينَ كَفَرُوا" </quran>فِيمَا يَأْمُرُونَكُمْ بِهِ <quran>"يَرُدُّوكُمْ" </quran>إلَى الْكُفْر</p></td></tr></table></body></html>
