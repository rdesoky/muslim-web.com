<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَئِنْ مُتُّمْ أَوْ قُتِلْتُمْ لَإِلَى اللَّهِ تُحْشَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَئِنْ" </quran>لَام قَسَم <quran>"مُتُّمْ" </quran>بِالْوَجْهَيْنِ <quran>"أَوْ قُتِلْتُمْ" </quran>فِي الْجِهَاد وَغَيْره <quran>"لَإِلَى اللَّه" </quran>لَا إلَى غَيْره <quran>"تُحْشَرُونَ" </quran>فِي الْآخِرَة فَيُجَازِيكُمْ</p></td></tr></table></body></html>
