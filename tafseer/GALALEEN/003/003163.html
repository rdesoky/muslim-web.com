<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُمْ دَرَجَاتٌ عِنْدَ اللَّهِ وَاللَّهُ بَصِيرٌ بِمَا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُمْ دَرَجَات" </quran>أَيْ أَصْحَاب دَرَجَات <quran>"عِنْد اللَّه" </quran>أَيْ مُخْتَلِفُو الْمَنَازِل فَلِمَنْ اتَّبَعَ رِضْوَانه الثَّوَاب وَلِمَنْ بَاءَ بِسَخَطِهِ الْعِقَاب <quran>"وَاَللَّه بَصِير بِمَا يَعْمَلُونَ" </quran>فَيُجَازِيهِمْ بِهِ</p></td></tr></table></body></html>
