<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ اشْتَرَوُا الْكُفْرَ بِالْإِيمَانِ لَنْ يَضُرُّوا اللَّهَ شَيْئًا وَلَهُمْ عَذَابٌ أَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ اشْتَرَوْا الْكُفْر بِالْإِيمَانِ" </quran>أَيْ أَخَذُوهُ بَدَله <quran>"لَنْ يَضُرُّوا اللَّه" </quran>بِكُفْرِهِمْ <quran>"شَيْئًا وَلَهُمْ عَذَاب أَلِيم" </quran>مُؤْلِم</p></td></tr></table></body></html>
