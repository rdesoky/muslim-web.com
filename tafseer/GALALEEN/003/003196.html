<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُوا فِي الْبِلَادِ</font></td></tr><tr><td align=right dir=rtl><p>وَنَزَلَ لَمَّا قَالَ الْمُسْلِمُونَ : أَعْدَاء اللَّه فِيمَا نَرَى مِنْ الْخَيْر وَنَحْنُ فِي الْجَهْد : <quran>"لَا يَغُرَّنك تَقَلُّب الَّذِينَ كَفَرُوا" </quran>تَصَرُّفهمْ . <quran>"فِي الْبِلَاد" </quran>بِالتِّجَارَةِ وَالْكَسْب</p></td></tr></table></body></html>
