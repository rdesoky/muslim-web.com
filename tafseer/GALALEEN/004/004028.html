<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُرِيدُ اللَّهُ أَنْ يُخَفِّفَ عَنْكُمْ وَخُلِقَ الْإِنْسَانُ ضَعِيفًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُرِيد اللَّه أَنْ يُخَفِّف عَنْكُمْ" </quran>يُسَهِّل عَلَيْكُمْ أَحْكَام الشَّرْع <quran>"وَخُلِقَ الْإِنْسَان ضَعِيفًا" </quran>لَا يَصْبِر عَنْ النِّسَاء وَالشَّهَوَات</p></td></tr></table></body></html>
