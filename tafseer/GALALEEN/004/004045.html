<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ أَعْلَمُ بِأَعْدَائِكُمْ وَكَفَى بِاللَّهِ وَلِيًّا وَكَفَى بِاللَّهِ نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَللَّه أَعْلَم بِأَعْدَائِكُمْ" </quran>مِنْكُمْ فَيُخْبِركُمْ بِهِمْ لِتَجْتَنِبُوهُمْ <quran>"وَكَفَى بِاَللَّهِ وَلِيًّا" </quran>حَافِظًا لَكُمْ مِنْهُمْ <quran>"وَكَفَى بِاَللَّهِ نَصِيرًا" </quran>مَانِعًا لَكُمْ مِنْ كَيْدهمْ</p></td></tr></table></body></html>
