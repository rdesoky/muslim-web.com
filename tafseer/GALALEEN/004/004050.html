<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْظُرْ كَيْفَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ وَكَفَى بِهِ إِثْمًا مُبِينًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُنْظُرْ" </quran>مُتَعَجِّبًا <quran>"كَيْفَ يَفْتَرُونَ عَلَى اللَّه الْكَذِب" </quran>بِذَلِكَ <quran>"وَكَفَى بِهِ إثْمًا مُبِينًا" </quran>بَيِّنًا</p></td></tr></table></body></html>
