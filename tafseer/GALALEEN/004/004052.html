<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ وَمَنْ يَلْعَنِ اللَّهُ فَلَنْ تَجِدَ لَهُ نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ الَّذِينَ لَعَنَهُمْ اللَّه وَمَنْ يَلْعَن" </quran>ـه <quran>"اللَّه فَلَنْ تَجِد لَهُ نَصِيرًا" </quran>مَانِعًا مِنْ عَذَابه</p></td></tr></table></body></html>
