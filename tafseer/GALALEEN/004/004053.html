<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَهُمْ نَصِيبٌ مِنَ الْمُلْكِ فَإِذًا لَا يُؤْتُونَ النَّاسَ نَقِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ" </quran>بَلْ <quran>"لَهُمْ نَصِيب مِنْ الْمُلْك" </quran>أَيْ لَيْسَ لَهُمْ شَيْء مِنْهُ وَلَوْ كَانَ <quran>"فَإِذًا لَا يُؤْتُونَ النَّاس نَقِيرًا" </quran>أَيْ شَيْئًا تَافِهًا قَدْر النَّقْرَة فِي ظَهْر النَّوَاة لِفَرْطِ بُخْلهمْ</p></td></tr></table></body></html>
