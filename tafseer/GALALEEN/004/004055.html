<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمِنْهُمْ مَنْ آمَنَ بِهِ وَمِنْهُمْ مَنْ صَدَّ عَنْهُ وَكَفَى بِجَهَنَّمَ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمِنْهُمْ مَنْ آمَنَ بِهِ" </quran>بِمُحَمَّدٍ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَمِنْهُمْ مَنْ صَدَّ" </quran>أَعْرَضَ <quran>"عَنْهُ" </quran>فَلَمْ يُؤْمِن <quran>"وَكَفَى بِجَهَنَّم سَعِيرًا" </quran>عَذَابًا لِمَنْ لَا يُؤْمِن</p></td></tr></table></body></html>
