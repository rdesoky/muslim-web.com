<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذًا لَآتَيْنَاهُمْ مِنْ لَدُنَّا أَجْرًا عَظِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذًا" </quran>أَيْ لَوْ تَثَبَّتُوا <quran>"لَآتَيْنَاهُمْ مِنْ لَدُنَّا" </quran>مِنْ عِنْدنَا <quran>"أَجْرًا عَظِيمًا" </quran>هُوَ الْجَنَّة</p></td></tr></table></body></html>
