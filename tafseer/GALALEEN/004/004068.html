<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهَدَيْنَاهُمْ صِرَاطًا مُسْتَقِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَهَدَيْنَاهُمْ صِرَاطًا مُسْتَقِيمًا" </quran>قَالَ بَعْض الصَّحَابَة لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : كَيْفَ نَرَاك فِي الْجَنَّة وَأَنْت فِي الدَّرَجَات الْعُلَى وَنَحْنُ أَسْفَل مِنْك ؟ فَنَزَلَ</p></td></tr></table></body></html>
