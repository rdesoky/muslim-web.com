<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ يَشَأْ يُذْهِبْكُمْ أَيُّهَا النَّاسُ وَيَأْتِ بِآخَرِينَ وَكَانَ اللَّهُ عَلَى ذَلِكَ قَدِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إِنْ يَشَأْ يُذْهِبْكُمْ" </quran>يَا <quran>"أَيُّهَا النَّاسُ وَيَأْتِ بِآخَرِينَ" </quran>بَدَلَكُم</p></td></tr></table></body></html>
