<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَشِّرِ الْمُنَافِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَشِّرْ" </quran>أَخْبِرْ يَا مُحَمَّد <quran>"الْمُنَافِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا" </quran>مُؤْلِمًا هُوَ عَذَاب النَّار</p></td></tr></table></body></html>
