<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ وَلَنْ تَجِدَ لَهُمْ نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الْمُنَافِقِينَ فِي الدَّرْك" </quran>الْمَكَان <quran>"الْأَسْفَل مِنْ النَّار" </quran>وَهُوَ قَعْرهَا <quran>"وَلَنْ تَجِد لَهُمْ نَصِيرًا" </quran>مَانِعًا مِنْ الْعَذَاب</p></td></tr></table></body></html>
