<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ تُبْدُوا خَيْرًا أَوْ تُخْفُوهُ أَوْ تَعْفُوا عَنْ سُوءٍ فَإِنَّ اللَّهَ كَانَ عَفُوًّا قَدِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ تُبْدُوا" </quran>تُظْهِرُوا. <quran>"خَيْرًا" </quran>مِنْ أَعْمَال الْبِرّ <quran>"أَوْ تُخْفُوهُ" </quran>تَعْمَلُوهُ سِرًّا <quran>"أَوْ تَعْفُوا عَنْ سُوء" </quran>ظُلْم</p></td></tr></table></body></html>
