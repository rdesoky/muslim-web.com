<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ هُمُ الْكَافِرُونَ حَقًّا وَأَعْتَدْنَا لِلْكَافِرِينَ عَذَابًا مُهِينًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ هُمْ الْكَافِرُونَ حَقًّا" </quran>مَصْدَر مُؤَكِّد لِمَضْمُونِ الْجُمْلَة قَبْله <quran>"وَأَعْتَدْنَا لِلْكَافِرِينَ عَذَابًا مُهِينًا" </quran>ذَا إهَانَة وَهُوَ عَذَاب النَّار</p></td></tr></table></body></html>
