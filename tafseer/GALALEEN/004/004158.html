<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ رَفَعَهُ اللَّهُ إِلَيْهِ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ رَفَعَهُ اللَّه إلَيْهِ وَكَانَ اللَّه عَزِيزًا" </quran>فِي مُلْكه <quran>"حَكِيمًا" </quran>فِي صُنْعه</p></td></tr></table></body></html>
