<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُمْ بُرْهَانٌ مِنْ رَبِّكُمْ وَأَنْزَلْنَا إِلَيْكُمْ نُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا النَّاس قَدْ جَاءَكُمْ بُرْهَان" </quran>حُجَّة <quran>"مِنْ رَبّكُمْ" </quran>عَلَيْكُمْ وَهُوَ النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَأَنْزَلْنَا إلَيْكُمْ نُورًا مُبِينًا" </quran>بَيِّنًا وَهُوَ الْقُرْآن</p></td></tr></table></body></html>
