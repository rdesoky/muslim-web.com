<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعَدَ اللَّهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَعَدَ اللَّه الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَات" </quran>وَعْدًا حَسَنًا <quran>"لَهُمْ مَغْفِرَة وَأَجْر عَظِيم" </quran>هُوَ الْجَنَّة</p></td></tr></table></body></html>
