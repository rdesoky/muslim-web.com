<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا مُوسَى إِنَّا لَنْ نَدْخُلَهَا أَبَدًا مَا دَامُوا فِيهَا فَاذْهَبْ أَنْتَ وَرَبُّكَ فَقَاتِلَا إِنَّا هَا هُنَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا يَا مُوسَى إنَّا لَنْ نَدْخُلهَا أَبَدًا مَا دَامُوا فِيهَا فَاذْهَبْ أَنْت وَرَبّك فَقَاتِلَا" </quran>هُمْ <quran>"إنَّا هَاهُنَا قَاعِدُونَ" </quran>عَنْ الْقِتَال</p></td></tr></table></body></html>
