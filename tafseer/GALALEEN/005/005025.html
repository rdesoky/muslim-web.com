<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي فَافْرُقْ بَيْنَنَا وَبَيْنَ الْقَوْمِ الْفَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى حِينَئِذٍ <quran>"رَبّ إنِّي لَا أَمْلِك إلَّا نَفْسِي وَأَخِي" </quran>وَلَا أَمْلِك غَيْرهمَا فَأُجْبِرهُمْ عَلَى الطَّاعَة <quran>"فَافْرُقْ" </quran>فَافْصِلْ</p></td></tr></table></body></html>
