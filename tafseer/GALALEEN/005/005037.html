<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُرِيدُونَ أَنْ يَخْرُجُوا مِنَ النَّارِ وَمَا هُمْ بِخَارِجِينَ مِنْهَا وَلَهُمْ عَذَابٌ مُقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُرِيدُونَ" </quran>يَتَمَنَّوْنَ <quran>"أَنْ يَخْرُجُوا مِنْ النَّار وَمَا هُمْ بِخَارِجِينَ مِنْهَا وَلَهُمْ عَذَاب مُقِيم" </quran>دَائِم</p></td></tr></table></body></html>
