<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَتُوبُونَ إِلَى اللَّهِ وَيَسْتَغْفِرُونَهُ وَاللَّهُ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَلَا يَتُوبُونَ إلَى اللَّه ويَسْتَغْفِرُونَه" </quran>مِمَّا قَالُوا اسْتِفْهَام تَوْبِيخ <quran>"وَاَللَّه غَفُور" </quran>لِمَنْ تَابَ <quran>"رَحِيم" </quran>بِهِ</p></td></tr></table></body></html>
