<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَثَابَهُمُ اللَّهُ بِمَا قَالُوا جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَذَلِكَ جَزَاءُ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَثَابَهُمْ اللَّه بِمَا قَالُوا جَنَّات تَجْرِي مِنْ تَحْتهَا الْأَنْهَار خَالِدِينَ فِيهَا وَذَلِك جَزَاء الْمُحْسِنِينَ" </quran>بِالْإِيمَانِ</p></td></tr></table></body></html>
