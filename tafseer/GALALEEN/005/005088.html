<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاتَّقُوا اللَّهَ الَّذِي أَنْتُمْ بِهِ مُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكُلُوا مِمَّا رَزَقَكُمْ اللَّه حَلَالًا طَيِّبًا" </quran>مَفْعُول وَالْجَارّ وَالْمَجْرُور قَبْله حَال مُتَعَلِّق بِهِ</p></td></tr></table></body></html>
