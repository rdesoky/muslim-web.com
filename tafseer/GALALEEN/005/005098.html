<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ وَأَنَّ اللَّهَ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اعْلَمُوا أَنَّ اللَّه شَدِيد الْعِقَاب" </quran>لِأَعْدَائِهِ <quran>"وَأَنَّ اللَّه غَفُور" </quran>لِأَوْلِيَائِهِ <quran>"رَحِيم" </quran>بِهِمْ</p></td></tr></table></body></html>
