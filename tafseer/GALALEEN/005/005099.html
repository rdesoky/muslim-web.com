<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا عَلَى الرَّسُولِ إِلَّا الْبَلَاغُ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا عَلَى الرَّسُول إلَّا الْبَلَاغ" </quran>لَكُمْ <quran>"وَاَللَّه يَعْلَم مَا تُبْدُونَ" </quran>تُظْهِرُونَ مِنْ الْعَمَل <quran>"وَمَا تَكْتُمُونَ" </quran>تُخْفُونَ مِنْهُ فَيُجَازِيكُمْ بِهِ</p></td></tr></table></body></html>
