<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَدْ سَأَلَهَا قَوْمٌ مِنْ قَبْلِكُمْ ثُمَّ أَصْبَحُوا بِهَا كَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَدْ سَأَلَهَا" </quran>أَيْ الْأَشْيَاء <quran>"قَوْم مِنْ قَبْلكُمْ" </quran>أَنْبِيَاءَهُمْ فَأَجِيبُوا بِبَيَانِ أَحْكَامهَا <quran>"ثُمَّ أَصْبَحُوا" </quran>صَارُوا <quran>"بِهَا كَافِرِينَ" </quran>بِتَرْكِهِمْ الْعَمَل بِهَا</p></td></tr></table></body></html>
