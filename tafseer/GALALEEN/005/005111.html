<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ أَوْحَيْتُ إِلَى الْحَوَارِيِّينَ أَنْ آمِنُوا بِي وَبِرَسُولِي قَالُوا آمَنَّا وَاشْهَدْ بِأَنَّنَا مُسْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذْ أَوْحَيْت إلَى الْحَوَارِيِّينَ" </quran>أَمَرْتهمْ عَلَى لِسَانه <quran>"أَنْ" </quran>أَيْ بِأَنْ <quran>"آمِنُوا بِي وَبِرَسُولِي" </quran>عِيسَى <quran>"قَالُوا آمَنَّا" </quran>بِهِمَا</p></td></tr></table></body></html>
