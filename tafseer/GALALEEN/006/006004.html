<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا تَأْتِيهِمْ مِنْ آيَةٍ مِنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا تَأْتِيهِمْ" </quran>أَيْ أَهْل مَكَّة <quran>"مِنْ" </quran>صِلَة <quran>"آيَة مِنْ آيَات رَبّهمْ" </quran>مِنْ الْقُرْآن</p></td></tr></table></body></html>
