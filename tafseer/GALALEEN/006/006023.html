<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ لَمْ تَكُنْ فِتْنَتُهُمْ إِلَّا أَنْ قَالُوا وَاللَّهِ رَبِّنَا مَا كُنَّا مُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ لَمْ تَكُنْ" </quran>بِالتَّاءِ وَالْيَاء <quran>"فِتْنَتهمْ" </quran>بِالنَّصْبِ وَالرَّفْع أَيْ مَعْذِرَتهمْ <quran>"إلَّا أَنْ قَالُوا" </quran>أَيْ قَوْلهمْ <quran>"وَاَللَّه رَبّنَا" </quran>بِالْجَرِّ نَعْت وَالنَّصْب نِدَاء</p></td></tr></table></body></html>
