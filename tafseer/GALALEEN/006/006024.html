<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْظُرْ كَيْفَ كَذَبُوا عَلَى أَنْفُسِهِمْ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُنْظُرْ" </quran>يَا مُحَمَّد <quran>"كَيْفَ كَذَبُوا عَلَى أَنْفُسهمْ" </quran>بِنَفْيِ الشِّرْك عَنْهُمْ <quran>"وَضَلَّ" </quran>غَابَ <quran>"عَنْهُمْ مَا كَانُوا يَفْتَرُونَ" </quran>يَفْتَرُونَهُ عَلَى اللَّه مِنْ شُرَكَاء</p></td></tr></table></body></html>
