<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا إِنْ هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا وَمَا نَحْنُ بِمَبْعُوثِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>أَيْ مُنْكِرُو الْبَعْث <quran>"إنْ" </quran>مَا <quran>"هِيَ" </quran>أَيْ الْحَيَاة</p></td></tr></table></body></html>
