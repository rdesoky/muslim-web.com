<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقُطِعَ دَابِرُ الْقَوْمِ الَّذِينَ ظَلَمُوا وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقُطِعَ دَابِر الْقَوْم الَّذِينَ ظَلَمُوا" </quran>أَيْ آخِرهمْ بِأَنْ اُسْتُؤْصِلُوا <quran>"وَالْحَمْد لِلَّهِ رَبّ الْعَالَمِينَ" </quran>عَلَى نَصْر الرُّسُل وَإِهْلَاك الْكَافِرِينَ</p></td></tr></table></body></html>
