<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلِ اللَّهُ يُنَجِّيكُمْ مِنْهَا وَمِنْ كُلِّ كَرْبٍ ثُمَّ أَنْتُمْ تُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"اللَّه يُنَجِّيكُمْ" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>"مِنْهَا وَمِنْ كُلّ كَرْب" </quran>غَمّ سِوَاهَا <quran>"ثُمَّ أَنْتُمْ تُشْرِكُونَ" </quran>بِهِ</p></td></tr></table></body></html>
