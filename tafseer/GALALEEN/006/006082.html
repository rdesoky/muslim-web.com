<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ آمَنُوا وَلَمْ يَلْبِسُوا إِيمَانَهُمْ بِظُلْمٍ أُولَئِكَ لَهُمُ الْأَمْنُ وَهُمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ آمَنُوا وَلَمْ يَلْبِسُوا" </quran>يَخْلِطُوا <quran>"إيمَانهمْ بِظُلْمٍ" </quran>أَيْ شِرْك كَمَا فُسِّرَ بِذَلِكَ فِي حَدِيث الصَّحِيحَيْنِ <quran>"أُولَئِكَ لَهُمْ الْأَمْن" </quran>مِنْ الْعَذَاب</p></td></tr></table></body></html>
