<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَزَكَرِيَّا وَيَحْيَى وَعِيسَى وَإِلْيَاسَ كُلٌّ مِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَزَكَرِيَّا وَيَحْيَى" </quran>ابْنه <quran>"وَعِيسَى" </quran>ابْن مَرْيَم يُفِيد أَنَّ الذُّرِّيَّة تَتَنَاوَل أَوْلَاد الْبِنْت <quran>"وَإِلْيَاس" </quran>ابْن أَخِي هَارُونَ أَخِي مُوسَى <quran>"كُلّ" </quran>مِنْهُمْ</p></td></tr></table></body></html>
