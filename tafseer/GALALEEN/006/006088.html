<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ وَلَوْ أَشْرَكُوا لَحَبِطَ عَنْهُمْ مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>الدِّين الَّذِي هُدُوا إلَيْهِ <quran>"هُدَى اللَّه يَهْدِي بِهِ مَنْ يَشَاء مِنْ عِبَاده وَلَوْ أَشْرَكُوا" </quran>فَرْضًا</p></td></tr></table></body></html>
