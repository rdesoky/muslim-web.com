<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اتَّبِعْ مَا أُوحِيَ إِلَيْكَ مِنْ رَبِّكَ لَا إِلَهَ إِلَّا هُوَ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اتَّبِعْ مَا أُوحِيَ إلَيْك مِنْ رَبّك" </quran>أَيْ الْقُرْآن</p></td></tr></table></body></html>
