<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ أَعْلَمُ مَنْ يَضِلُّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ رَبّك هُوَ أَعْلَم" </quran>أَيْ عَالِم <quran>"مَنْ يَضِلّ عَنْ سَبِيله وَهُوَ أَعْلَم بِالْمُهْتَدِينَ" </quran>فَيُجَازِي كُلًّا مِنْهُمْ</p></td></tr></table></body></html>
