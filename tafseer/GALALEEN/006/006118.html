<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكُلُوا مِمَّا ذُكِرَ اسْمُ اللَّهِ عَلَيْهِ إِنْ كُنْتُمْ بِآيَاتِهِ مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكُلُوا مِمَّا ذُكِرَ اسْم اللَّه عَلَيْهِ" </quran>أَيْ ذُبِحَ عَلَى اسْمه</p></td></tr></table></body></html>
