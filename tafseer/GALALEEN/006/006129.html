<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَذَلِكَ نُوَلِّي بَعْضَ الظَّالِمِينَ بَعْضًا بِمَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَذَلِكَ" </quran>كَمَا مَتَّعْنَا عُصَاة الْإِنْس وَالْجِنّ بَعْضهمْ بِبَعْضٍ <quran>"نُولِي" </quran>مِنْ الْوِلَايَة <quran>"بَعْض الظَّالِمِينَ بَعْضًا" </quran>أَيْ عَلَى بَعْض <quran>"بِمَا كَانُوا يَكْسِبُونَ" </quran>مِنْ الْمَعَاصِي</p></td></tr></table></body></html>
