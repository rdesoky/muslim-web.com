<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِكُلٍّ دَرَجَاتٌ مِمَّا عَمِلُوا وَمَا رَبُّكَ بِغَافِلٍ عَمَّا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِكُلٍّ" </quran>مِنْ الْعَامِلِينَ <quran>"دَرَجَات" </quran>جَزَاء <quran>"مِمَّا عَمِلُوا" </quran>مِنْ خَيْر وَشَرّ <quran>"وَمَا رَبّك بِغَافِلٍ عَمَّا يَعْمَلُونَ" </quran>بِالْيَاءِ وَالتَّاء</p></td></tr></table></body></html>
