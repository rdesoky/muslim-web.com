<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ مَا تُوعَدُونَ لَآتٍ وَمَا أَنْتُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ مَا تُوعَدُونَ" </quran>مِنْ السَّاعَة وَالْعَذَاب <quran>"لَآتٍ" </quran>لَا مَحَالَة <quran>"وَمَا أَنْتُمْ بِمُعْجِزِينَ" </quran>فَائِتِينَ عَذَابنَا</p></td></tr></table></body></html>
