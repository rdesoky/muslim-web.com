<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ فَلِلَّهِ الْحُجَّةُ الْبَالِغَةُ فَلَوْ شَاءَ لَهَدَاكُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>إنْ لَمْ يَكُنْ لَكُمْ حُجَّة <quran>"فَلِلَّهِ الْحُجَّة الْبَالِغَة" </quran>التَّامَّة <quran>"فَلَوْ شَاءَ" </quran>هِدَايَتكُمْ</p></td></tr></table></body></html>
