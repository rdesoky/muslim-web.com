<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهَذَا كِتَابٌ أَنْزَلْنَاهُ مُبَارَكٌ فَاتَّبِعُوهُ وَاتَّقُوا لَعَلَّكُمْ تُرْحَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَهَذَا" </quran>الْقُرْآن <quran>"كِتَاب أَنْزَلْنَاهُ مُبَارَك فَاتَّبِعُوهُ" </quran>يَا أَهْل مَكَّة بِالْعَمَلِ بِمَا فِيهِ <quran>"وَاتَّقُوا" </quran>الْكُفْر</p></td></tr></table></body></html>
