<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّنِي هَدَانِي رَبِّي إِلَى صِرَاطٍ مُسْتَقِيمٍ دِينًا قِيَمًا مِلَّةَ إِبْرَاهِيمَ حَنِيفًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنَّنِي هَدَانِي رَبِّي إلَى صِرَاط مُسْتَقِيم" </quran><quran>"دِينًا قِيَمًا" </quran>مُسْتَقِيمًا</p></td></tr></table></body></html>
