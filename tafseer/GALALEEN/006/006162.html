<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنَّ صَلَاتِي وَنُسُكِي" </quran>عِبَادَتِي مِنْ حَجّ وَغَيْره <quran>"وَمَحْيَايَ" </quran>حَيَاتِي <quran>"وَمَمَاتِي" </quran>مَوْتِي</p></td></tr></table></body></html>
