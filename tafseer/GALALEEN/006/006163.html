<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا شَرِيك لَهُ" </quran>فِي ذَلِكَ <quran>"وَبِذَلِكَ" </quran>أَيْ التَّوْحِيد <quran>"أُمِرْت وَأَنَا أَوَّل الْمُسْلِمِينَ" </quran>مِنْ هَذِهِ الْأُمَّة</p></td></tr></table></body></html>
