<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا كَانَ دَعْوَاهُمْ إِذْ جَاءَهُمْ بَأْسُنَا إِلَّا أَنْ قَالُوا إِنَّا كُنَّا ظَالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا كَانَ دَعْوَاهُمْ" </quran>قَوْلهمْ</p></td></tr></table></body></html>
