<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَنَسْأَلَنَّ الَّذِينَ أُرْسِلَ إِلَيْهِمْ وَلَنَسْأَلَنَّ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَنَسْأَلَنَّ الَّذِينَ أُرْسِلَ إلَيْهِمْ" </quran>أَيْ الْأُمَم عَنْ إجَابَتهمْ الرُّسُل وَعَمَلهمْ فِيمَا بَلَغَهُمْ <quran>"وَلَنَسْأَلَنَّ الْمُرْسَلِينَ" </quran>عَنْ الْإِبْلَاغ</p></td></tr></table></body></html>
