<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ خَفَّتْ مَوَازِينُهُ فَأُولَئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ بِمَا كَانُوا بِآيَاتِنَا يَظْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ خَفَّتْ مَوَازِينه" </quran>بِالسَّيِّئَاتِ <quran>"فَأُولَئِكَ الَّذِينَ خَسِرُوا أَنْفُسهمْ" </quran>بِتَصْيِيرِهَا إلَى النَّار <quran>"بِمَا كَانُوا بِآيَاتِنَا يَظْلِمُونَ" </quran>يَجْحَدُونَ</p></td></tr></table></body></html>
