<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ مَا مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ قَالَ أَنَا خَيْرٌ مِنْهُ خَلَقْتَنِي مِنْ نَارٍ وَخَلَقْتَهُ مِنْ طِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى <quran>"مَا مَنَعَك أَلَّا" </quran>أَنْ لَا : لَا زَائِدَة <quran>"تَسْجُد إذْ" </quran>حِين</p></td></tr></table></body></html>
