<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّكَ مِنَ الْمُنْظَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ إنَّك مِنْ الْمُنْظَرِينَ" </quran>وَفِي آيَة أُخْرَى <quran>"إلَى يَوْم الْوَقْت الْمَعْلُوم" </quran>أَيْ يَوْم النَّفْخَة الْأُولَى</p></td></tr></table></body></html>
