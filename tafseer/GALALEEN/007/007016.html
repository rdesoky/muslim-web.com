<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَبِمَا أَغْوَيْتَنِي لَأَقْعُدَنَّ لَهُمْ صِرَاطَكَ الْمُسْتَقِيمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ فَبِمَا أَغْوَيْتنِي" </quran>أَيْ بِإِغْوَائِك لِي وَالْبَاء لِلْقَسَمِ وَجَوَابه <quran>"لَأَقْعُدَنّ لَهُمْ" </quran>أَيْ لِبَنِي آدَم <quran>"صِرَاطك الْمُسْتَقِيم" </quran>أَيْ عَلَى الطَّرِيق الْمُوصِل إلَيْك</p></td></tr></table></body></html>
