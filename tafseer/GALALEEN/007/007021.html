<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَاسَمَهُمَا إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَاسَمَهُمَا" </quran>أَيْ أَقْسَمَ لَهُمَا بِاَللَّهِ <quran>"إنِّي لَكُمَا لَمِنْ النَّاصِحِينَ" </quran>فِي ذَلِكَ</p></td></tr></table></body></html>
