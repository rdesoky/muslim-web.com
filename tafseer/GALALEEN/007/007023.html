<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَا رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَا رَبّنَا ظَلَمْنَا أَنْفُسنَا" </quran>بِمَعْصِيَتِنَا</p></td></tr></table></body></html>
