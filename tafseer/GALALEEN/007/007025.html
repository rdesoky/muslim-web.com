<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فِيهَا تَحْيَوْنَ وَفِيهَا تَمُوتُونَ وَمِنْهَا تُخْرَجُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ فِيهَا" </quran>أَيْ الْأَرْض . <quran>"تَحْيَوْنَ وَفِيهَا تَمُوتُونَ وَمِنْهَا تُخْرَجُونَ" </quran>بِالْبَعْثِ بِالْبِنَاءِ لِلْفَاعِلِ وَالْمَفْعُول</p></td></tr></table></body></html>
