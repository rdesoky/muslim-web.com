<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا بَنِي آدَم خُذُوا زِينَتكُمْ" </quran>مَا يَسْتُر عَوْرَتكُمْ <quran>"عِنْد كُلّ مَسْجِد" </quran>عِنْد الصَّلَاة وَالطَّوَاف <quran>"وَكُلُوا وَاشْرَبُوا" </quran>مَا شِئْتُمْ</p></td></tr></table></body></html>
