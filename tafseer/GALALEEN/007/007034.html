<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِكُلِّ أُمَّةٍ أَجَلٌ فَإِذَا جَاءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً وَلَا يَسْتَقْدِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِكُلِّ أُمَّة أَجَل" </quran>مُدَّة <quran>"فَإِذَا جَاءَ أَجَلهمْ لَا يَسْتَأْخِرُونَ" </quran>عَنْهُ <quran>"سَاعَة وَلَا يَسْتَقْدِمُونَ" </quran>عَلَيْهِ</p></td></tr></table></body></html>
