<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا وَاسْتَكْبَرُوا عَنْهَا أُولَئِكَ أَصْحَابُ النَّارِ هُمْ فِيهَا خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ كَذَّبُوا بِآيَاتِنَا وَاسْتَكْبَرُوا" </quran>تَكَبَّرُوا <quran>"عَنْهَا" </quran>فَلَمْ يُؤْمِنُوا بِهَا</p></td></tr></table></body></html>
