<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُمْ مِنْ جَهَنَّمَ مِهَادٌ وَمِنْ فَوْقِهِمْ غَوَاشٍ وَكَذَلِكَ نَجْزِي الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُمْ مِنْ جَهَنَّم مِهَاد" </quran>فِرَاش <quran>"وَمِنْ فَوْقهمْ غَوَاشٍ" </quran>أَغْطِيَة مِنْ النَّار جَمْع غَاشِيَة وَتَنْوِينه عِوَض مِنْ الْيَاء الْمَحْذُوفَة</p></td></tr></table></body></html>
