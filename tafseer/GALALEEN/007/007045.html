<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يَصُدُّونَ عَنْ سَبِيلِ اللَّهِ وَيَبْغُونَهَا عِوَجًا وَهُمْ بِالْآخِرَةِ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يَصُدُّونَ" </quran>النَّاس <quran>"عَنْ سَبِيل اللَّه" </quran>دِينه <quran>"وَيَبْغُونَهَا" </quran>أَيْ يَطْلُبُونَ السَّبِيل <quran>"عِوَجًا" </quran>مُعْوَجَّة</p></td></tr></table></body></html>
