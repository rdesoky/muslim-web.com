<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا صُرِفَتْ أَبْصَارُهُمْ تِلْقَاءَ أَصْحَابِ النَّارِ قَالُوا رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا صُرِفَتْ أَبْصَارهمْ" </quran>أَيْ أَصْحَاب الْأَعْرَاف <quran>"تِلْقَاء" </quran>جِهَة <quran>"أَصْحَاب النَّار قَالُوا رَبّنَا لَا تَجْعَلنَا" </quran>فِي النَّار</p></td></tr></table></body></html>
