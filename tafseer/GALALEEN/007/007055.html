<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُدْعُوا رَبّكُمْ تَضَرُّعًا" </quran>حَال تَذَلُّلًا <quran>"وَخُفْيَة" </quran>سِرًّا <quran>"إنَّهُ لَا يُحِبّ الْمُعْتَدِينَ" </quran>فِي الدُّعَاء بِالتَّشَدُّقِ وَرَفْع الصَّوْت</p></td></tr></table></body></html>
