<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ الْمَلَأُ مِنْ قَوْمِهِ إِنَّا لَنَرَاكَ فِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ الْمَلَأ" </quran>الْأَشْرَاف <quran>"مِنْ قَوْمه إنَّا لَنَرَاك فِي ضَلَال مُبِين" </quran>بَيِّن</p></td></tr></table></body></html>
