<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُبَلِّغُكُمْ رِسَالَاتِ رَبِّي وَأَنْصَحُ لَكُمْ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُبَلِّغكُمْ" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>"رِسَالَات رَبِّي وَأَنْصَح" </quran>أُرِيد الْخَيْر</p></td></tr></table></body></html>
