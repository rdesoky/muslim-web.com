<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ إِنَّا لَنَرَاكَ فِي سَفَاهَةٍ وَإِنَّا لَنَظُنُّكَ مِنَ الْكَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ الْمَلَأ الَّذِينَ كَفَرُوا مِنْ قَوْمه إنَّا لَنَرَاك فِي سَفَاهَة" </quran>جَهَالَة <quran>"وَإِنَّا لِنَظُنّك مِنْ الْكَاذِبِينَ" </quran>فِي رِسَالَتك</p></td></tr></table></body></html>
