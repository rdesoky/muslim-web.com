<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُبَلِّغُكُمْ رِسَالَاتِ رَبِّي وَأَنَا لَكُمْ نَاصِحٌ أَمِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُبَلِّغكُمْ رِسَالَات رَبِّي وَأَنَا لَكُمْ نَاصِح أَمِين" </quran>مَأْمُون عَلَى الرِّسَالَة</p></td></tr></table></body></html>
