<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَةَ مَا سَبَقَكُمْ بِهَا مِنْ أَحَدٍ مِنَ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"و" </quran>اُذْكُرْ <quran>"لُوطًا" </quran>وَيُبَدَّل مِنْهُ <quran>"إذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَة" </quran>أَيْ أَدْبَار الرِّجَال <quran>"مَا سَبَقَكُمْ بِهَا مِنْ أَحَد مِنْ الْعَالَمِينَ" </quran>الْإِنْس وَالْجِنّ</p></td></tr></table></body></html>
