<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا أَخْرِجُوهُمْ مِنْ قَرْيَتِكُمْ إِنَّهُمْ أُنَاسٌ يَتَطَهَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا كَانَ جَوَاب قَوْمه إلَّا أَنْ قَالُوا أَخْرِجُوهُمْ" </quran>أَيْ لُوطًا وَأَتْبَاعه <quran>"مِنْ قَرْيَتكُمْ إنَّهُمْ أُنَاس يَتَطَهَّرُونَ" </quran>مِنْ أَدْبَار الرِّجَال</p></td></tr></table></body></html>
