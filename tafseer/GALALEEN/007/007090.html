<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ لَئِنِ اتَّبَعْتُمْ شُعَيْبًا إِنَّكُمْ إِذًا لَخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الْمَلَأ الَّذِينَ كَفَرُوا مِنْ قَوْمه" </quran>أَيْ قَالَ بَعْضهمْ لِبَعْضٍ <quran>"لَئِنْ" </quran>لَام قَسَم</p></td></tr></table></body></html>
