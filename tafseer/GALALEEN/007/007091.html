<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَخَذَتْهُمْ الرَّجْفَة" </quran>الزَّلْزَلَة الشَّدِيدَة <quran>"فَأَصْبَحُوا فِي دَارهمْ جَاثِمِينَ" </quran>بَارِكِينِ عَلَى الرُّكَب مَيِّتِينَ</p></td></tr></table></body></html>
