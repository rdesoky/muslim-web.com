<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوَأَمِنَ أَهْلُ الْقُرَى أَنْ يَأْتِيَهُمْ بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوَأَمِنَ أَهْل الْقُرَى أَنْ يَأْتِيهِمْ بَأْسنَا ضُحًى" </quran>نَهَارًا</p></td></tr></table></body></html>
