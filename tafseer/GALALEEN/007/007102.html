<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا وَجَدْنَا لِأَكْثَرِهِمْ مِنْ عَهْدٍ وَإِنْ وَجَدْنَا أَكْثَرَهُمْ لَفَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا وَجَدْنَا لِأَكْثَرِهِمْ" </quran>أَيْ النَّاس <quran>"مِنْ عَهْد" </quran>أَيْ وَفَاء بِعَهْدِهِمْ يَوْم أُخِذَ الْمِيثَاق <quran>"وَإِنْ" </quran>مُخَفَّفَة</p></td></tr></table></body></html>
