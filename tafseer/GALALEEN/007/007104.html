<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِنْ رَبِّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ مُوسَى يَا فِرْعَوْن إنِّي رَسُول مِنْ رَبّ الْعَالَمِينَ" </quran>إلَيْك فَكَذَّبَهُ</p></td></tr></table></body></html>
