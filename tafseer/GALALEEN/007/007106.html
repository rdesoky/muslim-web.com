<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنْ كُنْتَ جِئْتَ بِآيَةٍ فَأْتِ بِهَا إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>فِرْعَوْن لَهُ <quran>"إنْ كُنْت جِئْت بِآيَةٍ" </quran>عَلَى دَعْوَاك <quran>"فَأْتِ بِهَا إنْ كُنْت مِنْ الصَّادِقِينَ" </quran>فِيهَا</p></td></tr></table></body></html>
