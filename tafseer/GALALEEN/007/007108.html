<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَزَعَ يَدَهُ فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَزَعَ يَده" </quran>أَخْرَجَهَا مِنْ جَيْبه <quran>"فَإِذَا هِيَ بَيْضَاء" </quran>ذَات شُعَاع <quran>"لِلنَّاظِرِينَ" </quran>خِلَاف مَا كَانَتْ عَلَيْهِ مِنْ الْأُدْمَة</p></td></tr></table></body></html>
