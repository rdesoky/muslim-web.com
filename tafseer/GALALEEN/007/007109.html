<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ الْمَلَأُ مِنْ قَوْمِ فِرْعَوْنَ إِنَّ هَذَا لَسَاحِرٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ الْمَلَأ مِنْ قَوْم فِرْعَوْن إنَّ هَذَا لَسَاحِر عَلِيم" </quran>فَائِق فِي عِلْم السِّحْر وَفِي الشُّعَرَاء أَنَّهُ مِنْ قَوْل فِرْعَوْن نَفْسه فَكَأَنَّهُمْ قَالُوهُ مَعَهُ عَلَى سَبِيل التَّشَاوُر</p></td></tr></table></body></html>
