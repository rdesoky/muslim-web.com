<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَأْتُوكَ بِكُلِّ سَاحِرٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَأْتُوك بِكُلِّ سَاحِر" </quran>وَفِي قِرَاءَة سَحَّار <quran>"عَلِيم" </quran>يَفْضُل مُوسَى فِي عِلْم السِّحْر فَجَمَعُوا</p></td></tr></table></body></html>
