<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَ السَّحَرَةُ فِرْعَوْنَ قَالُوا إِنَّ لَنَا لَأَجْرًا إِنْ كُنَّا نَحْنُ الْغَالِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَاءَ السَّحَرَة فِرْعَوْن قَالُوا أَإِنَّ" </quran>بِتَحْقِيقِ الْهَمْزَتَيْنِ وَتَسْهِيل الثَّانِيَة وَإِدْخَال أَلِف بَيْنهمَا عَلَى الْوَجْهَيْنِ</p></td></tr></table></body></html>
