<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا مُوسَى إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ نَحْنُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا يَا مُوسَى إمَّا أَنْ تُلْقِي" </quran>عَصَاك <quran>"وَإِمَّا أَنْ نَكُون نَحْنُ الْمُلْقِينَ" </quran>مَا مَعَنَا</p></td></tr></table></body></html>
