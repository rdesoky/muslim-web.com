<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَوْحَيْنَا إِلَى مُوسَى أَنْ أَلْقِ عَصَاكَ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَوْحَيْنَا إلَى مُوسَى أَنْ أَلْقِ عَصَاك فَإِذَا هِيَ تَلْقَف" </quran>بِحَذْفِ إحْدَى التَّاءَيْنِ فِي الْأَصْل تَبْتَلِع <quran>"مَا يَأْفِكُونَ" </quran>يُقَلِّبُونَ بِتَمْوِيهِهِمْ</p></td></tr></table></body></html>
