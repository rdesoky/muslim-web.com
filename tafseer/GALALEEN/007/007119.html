<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَغُلِبُوا هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَغَلَبُوا" </quran>أَيْ فِرْعَوْن وَقَوْمه <quran>"هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ" </quran>صَارُوا ذَلِيلِينَ</p></td></tr></table></body></html>
