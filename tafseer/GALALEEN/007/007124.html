<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُمْ مِنْ خِلَافٍ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَأُقَطِّعَن أَيْدِيكُمْ وَأَرْجُلكُمْ مِنْ خِلَاف" </quran>أَيْ يَد كُلّ وَاحِد الْيُمْنَى وَرِجْله الْيُسْرَى</p></td></tr></table></body></html>
