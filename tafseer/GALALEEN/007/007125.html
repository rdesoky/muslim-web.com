<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّا إِلَى رَبِّنَا مُنْقَلِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا إنَّا إلَى رَبّنَا" </quran>بَعْد مَوْتنَا بِأَيِّ وَجْه كَانَ <quran>"مُنْقَلِبُونَ" </quran>رَاجِعُونَ فِي الْآخِرَة</p></td></tr></table></body></html>
