<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَخَذْنَا آلَ فِرْعَوْنَ بِالسِّنِينَ وَنَقْصٍ مِنَ الثَّمَرَاتِ لَعَلَّهُمْ يَذَّكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَخَذْنَا آل فِرْعَوْن بِالسِّنِينَ" </quran>بِالْقَحْطِ <quran>"وَنَقْص مِنْ الثَّمَرَات لَعَلَّهُمْ يَذَّكَّرُونَ" </quran>يَتَّعِظُونَ فَيُؤْمِنُونَ</p></td></tr></table></body></html>
