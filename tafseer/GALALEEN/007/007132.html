<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا مَهْمَا تَأْتِنَا بِهِ مِنْ آيَةٍ لِتَسْحَرَنَا بِهَا فَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>لِمُوسَى <quran>"مَهْمَا تَأْتِنَا بِهِ مِنْ آيَة لِتَسْحَرنَا بِهَا فَمَا نَحْنُ لَك بِمُؤْمِنِينَ" </quran>فَدَعَا عَلَيْهِمْ</p></td></tr></table></body></html>
