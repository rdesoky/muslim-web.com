<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَغَيْرَ اللَّهِ أَبْغِيكُمْ إِلَهًا وَهُوَ فَضَّلَكُمْ عَلَى الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَغَيْر اللَّه أَبْغِيكُمْ إلَهًا" </quran>مَعْبُودًا وَأَصْله أَبْغِي لَكُمْ <quran>"وَهُوَ فَضَّلَكُمْ عَلَى الْعَالَمِينَ" </quran>فِي زَمَانكُمْ بِمَا ذَكَرَهُ فِي قَوْله</p></td></tr></table></body></html>
