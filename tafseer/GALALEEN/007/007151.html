<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ اغْفِرْ لِي" </quran>مَا صَنَعْت بِأَخِي <quran>"وَلِأَخِي" </quran>أُشْرِكهُ فِي الدُّعَاء إرْضَاء لَهُ وَدَفْعًا لِلشَّمَاتَةِ بِهِ</p></td></tr></table></body></html>
