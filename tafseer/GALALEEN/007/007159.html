<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنْ قَوْمِ مُوسَى أُمَّةٌ يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْ قَوْم مُوسَى أُمَّة" </quran>جَمَاعَة <quran>"يَهْدُونَ" </quran>النَّاس <quran>"بِالْحَقِّ وَبِهِ يَعْدِلُونَ" </quran>فِي الْحُكْم</p></td></tr></table></body></html>
