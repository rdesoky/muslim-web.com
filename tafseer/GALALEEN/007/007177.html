<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَاءَ مَثَلًا الْقَوْمُ الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَأَنْفُسَهُمْ كَانُوا يَظْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَاءَ" </quran>بِئْسَ <quran>"مَثَلًا الْقَوْم" </quran>أَيْ مَثَل الْقَوْم <quran>"الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَأَنْفُسهمْ كَانُوا يَظْلِمُونَ" </quran>بِالتَّكْذِيبِ</p></td></tr></table></body></html>
