<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِمَّنْ خَلَقْنَا أُمَّةٌ يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِمَّنْ خَلَقْنَا أُمَّة يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ" </quran>هُمْ أُمَّة مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ كَمَا فِي حَدِيثٍ .</p></td></tr></table></body></html>
