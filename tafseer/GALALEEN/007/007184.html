<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوَلَمْ يَتَفَكَّرُوا مَا بِصَاحِبِهِمْ مِنْ جِنَّةٍ إِنْ هُوَ إِلَّا نَذِيرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوَلَمْ يَتَفَكَّرُوا" </quran>فَيَعْلَمُوا <quran>"مَا بِصَاحِبِهِمْ" </quran>مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"مِنْ جِنَّة" </quran>جُنُون <quran>"إنْ" </quran>مَا <quran>"هُوَ إلَّا نَذِير مُبِين" </quran>بَيِّن الْإِنْذَار</p></td></tr></table></body></html>
