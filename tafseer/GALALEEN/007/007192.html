<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَسْتَطِيعُونَ لَهُمْ نَصْرًا وَلَا أَنْفُسَهُمْ يَنْصُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا يَسْتَطِيعُونَ لَهُمْ" </quran>أَيْ لِعَابِدِيهِمْ <quran>"نَصْرًا وَلَا أَنْفُسهمْ يَنْصُرُونَ" </quran>بِمَنْعِهَا مِمَّنْ أَرَادَ بِهِمْ سُوءًا مِنْ كَسْر أَوْ غَيْره وَالِاسْتِفْهَام لِلتَّوْبِيخِ</p></td></tr></table></body></html>
