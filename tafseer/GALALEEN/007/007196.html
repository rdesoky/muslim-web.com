<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ وَلِيِّيَ اللَّهُ الَّذِي نَزَّلَ الْكِتَابَ وَهُوَ يَتَوَلَّى الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ وَلِيّ اللَّه" </quran>مُتَوَلِّي أُمُورِي <quran>"الَّذِي نَزَّلَ الْكِتَاب" </quran>الْقُرْآن <quran>"وَهُوَ يَتَوَلَّى الصَّالِحِينَ" </quran>بِحِفْظِهِ</p></td></tr></table></body></html>
