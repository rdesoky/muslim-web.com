<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ تَدْعُوهُمْ إِلَى الْهُدَى لَا يَسْمَعُوا وَتَرَاهُمْ يَنْظُرُونَ إِلَيْكَ وَهُمْ لَا يُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ تَدْعُوهُمْ" </quran>أَيْ الْأَصْنَام <quran>"إلَى الْهُدَى لَا يَسْمَعُوا وَتَرَاهُمْ" </quran>أَيْ الْأَصْنَام يَا مُحَمَّد <quran>"يَنْظُرُونَ إلَيْك" </quran>أَيْ يُقَابِلُونَك كَالنَّاظِرِ</p></td></tr></table></body></html>
