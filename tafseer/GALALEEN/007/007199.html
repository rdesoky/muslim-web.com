<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خُذْ الْعَفْو" </quran>الْيُسْر مِنْ أَخْلَاق النَّاس وَلَا تَبْحَث عَنْهَا <quran>"وَأْمُرْ بِالْعُرْفِ" </quran>بِالْمَعْرُوفِ <quran>"وَأَعْرِض عَنْ الْجَاهِلِينَ" </quran>فَلَا تَقَابُلهمْ بِسَفَهِهِمْ</p></td></tr></table></body></html>
