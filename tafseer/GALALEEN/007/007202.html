<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِخْوَانُهُمْ يَمُدُّونَهُمْ فِي الْغَيِّ ثُمَّ لَا يُقْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِخْوَانهمْ" </quran>أَيْ إخْوَان الشَّيَاطِين مِنْ الْكُفَّار <quran>"يُمِدُّونَهُمْ" </quran>أَيْ الشَّيَاطِين <quran>"فِي الْغَيّ ثُمَّ" </quran>هُمْ <quran>"لَا يُقْصِرُونَ" </quran>يَكُفُّونَ عَنْهُ بِالتَّبَصُّرِ كَمَا تَبَصَّرَ الْمُتَّقُونَ</p></td></tr></table></body></html>
