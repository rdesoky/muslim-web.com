<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يُقِيمُونَ الصَّلَاة" </quran>يَأْتُونَ بِهَا بِحُقُوقِهَا <quran>"وَمِمَّا رَزَقْنَاهُمْ" </quran>أَعْطَيْنَاهُمْ <quran>"يُنْفِقُونَ" </quran>فِي طَاعَة اللَّه</p></td></tr></table></body></html>
