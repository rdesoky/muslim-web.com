<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُجَادِلُونَكَ فِي الْحَقِّ بَعْدَ مَا تَبَيَّنَ كَأَنَّمَا يُسَاقُونَ إِلَى الْمَوْتِ وَهُمْ يَنظُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُجَادِلُونَكَ فِي الْحَقِّ" </quran>القتال <quran>"بَعْدَ مَا تَبَيَّنَ" </quran>ظهر لهم <quran>"كَأَنَّمَا يُسَاقُونَ إِلَى الْمَوْتِ وَهُمْ يَنظُرُونَ" </quran>إليه عيانا في كراهتم له</p></td></tr></table></body></html>
