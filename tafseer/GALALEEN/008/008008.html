<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيُحِقَّ الْحَقَّ وَيُبْطِلَ الْبَاطِلَ وَلَوْ كَرِهَ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيُحِقّ الْحَقّ وَيُبْطِل" </quran>يَمْحَق <quran>"الْبَاطِل" </quran>الْكُفْر <quran>"وَلَوْ كَرِهَ الْمُجْرِمُونَ" </quran>الْمُشْرِكُونَ ذَلِكَ</p></td></tr></table></body></html>
