<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ بِأَنَّهُمْ شَاقُّوا اللَّهَ وَرَسُولَهُ وَمَنْ يُشَاقِقِ اللَّهَ وَرَسُولَهُ فَإِنَّ اللَّهَ شَدِيدُ الْعِقَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>الْعَذَاب الْوَاقِع بِهِمْ <quran>"بِأَنَّهُمْ شَاقُّوا" </quran>خَالَفُوا <quran>"اللَّه وَرَسُوله وَمَنْ يُشَاقِقْ اللَّه وَرَسُوله فَإِنَّ اللَّه شَدِيد الْعِقَاب" </quran>لَهُ</p></td></tr></table></body></html>
