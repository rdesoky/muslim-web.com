<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكُمْ فَذُوقُوهُ وَأَنَّ لِلْكَافِرِينَ عَذَابَ النَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكُمْ" </quran>الْعَذَاب <quran>"فَذُوقُوهُ" </quran>أَيّهَا الْكُفَّار فِي الدُّنْيَا <quran>"وَأَنَّ لِلْكَافِرِينَ" </quran>فِي الْآخِرَة</p></td></tr></table></body></html>
