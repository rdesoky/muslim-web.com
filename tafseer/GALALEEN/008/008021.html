<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَكُونُوا كَالَّذِينَ قَالُوا سَمِعْنَا وَهُمْ لَا يَسْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَكُونُوا كَاَلَّذِينَ قَالُوا سَمِعْنَا وَهُمْ لَا يَسْمَعُونَ" </quran>سَمَاع تَدَبُّر وَاتِّعَاظ وَهُمْ الْمُنَافِقُونَ أَوْ الْمُشْرِكُونَ</p></td></tr></table></body></html>
