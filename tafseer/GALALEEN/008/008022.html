<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ شَرَّ الدَّوَابِّ عِنْدَ اللَّهِ الصُّمُّ الْبُكْمُ الَّذِينَ لَا يَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ شَرّ الدَّوَابّ عِنْد اللَّه الصُّمّ" </quran>عَنْ سَمَاع الْحَقّ <quran>"الْبُكْم" </quran>عَنْ النُّطْق بِهِ <quran>"الَّذِينَ لَا يَعْقِلُونَ" </quran>الَّذِينَ لَا يَعْقِلُونَهُ</p></td></tr></table></body></html>
