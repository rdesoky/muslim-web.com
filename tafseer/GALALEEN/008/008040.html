<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ تَوَلَّوْا فَاعْلَمُوا أَنَّ اللَّهَ مَوْلَاكُمْ نِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ تَوَلَّوْا" </quran>عَنْ الْإِيمَان <quran>"فَاعْلَمُوا أَنَّ اللَّه مَوْلَاكُمْ" </quran>نَاصِركُمْ وَمُتَوَلِّي أُمُوركُمْ <quran>"نِعْمَ الْمَوْلَى" </quran>هُوَ <quran>"وَنِعْمَ النَّصِير" </quran>أَيْ النَّاصِر لَكُمْ</p></td></tr></table></body></html>
