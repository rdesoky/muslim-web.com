<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ شَرَّ الدَّوَابِّ عِنْدَ اللَّهِ الَّذِينَ كَفَرُوا فَهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَنَزَلَ فِي قُرَيْظَة <quran>"إنَّ شَرّ الدَّوَابّ عِنْد اللَّه الَّذِينَ كَفَرُوا فَهُمْ لَا يُؤْمِنُونَ"</quran></p></td></tr></table></body></html>
