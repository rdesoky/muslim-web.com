<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ عَاهَدْتَ مِنْهُمْ ثُمَّ يَنْقُضُونَ عَهْدَهُمْ فِي كُلِّ مَرَّةٍ وَهُمْ لَا يَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ عَاهَدْت مِنْهُمْ" </quran>أَنْ لَا يُعِينُوا الْمُشْرِكِينَ <quran>"ثُمَّ يَنْقُضُونَ عَهْدهمْ فِي كُلّ مَرَّة" </quran>عَاهَدُوا فِيهَا <quran>"وَهُمْ لَا يَتَّقُونَ" </quran>اللَّه فِي غَدْرهمْ</p></td></tr></table></body></html>
