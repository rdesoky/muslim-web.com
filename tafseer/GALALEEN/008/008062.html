<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ يُرِيدُوا أَنْ يَخْدَعُوكَ فَإِنَّ حَسْبَكَ اللَّهُ هُوَ الَّذِي أَيَّدَكَ بِنَصْرِهِ وَبِالْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ يُرِيدُوا أَنْ يَخْدَعُوك" </quran>بِالصُّلْحِ لِيَسْتَعِدُّوا لَك <quran>"فَإِنَّ حَسْبك" </quran>كَافِيك <quran>"اللَّهُ هُوَ الَّذِي أَيَّدَكَ بِنَصْرِهِ وَبِالْمُؤْمِنِينَ"</quran></p></td></tr></table></body></html>
