<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا النَّبِيُّ حَسْبُكَ اللَّهُ وَمَنِ اتَّبَعَكَ مِنَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا النَّبِيّ حَسْبك اللَّه وَ" </quran>حَسْبك <quran>"مَنْ اتَّبَعَك مِنْ الْمُؤْمِنِينَ"</quran></p></td></tr></table></body></html>
