<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَوْلَا كِتَابٌ مِنَ اللَّهِ سَبَقَ لَمَسَّكُمْ فِيمَا أَخَذْتُمْ عَذَابٌ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَوْلَا كِتَاب مِنْ اللَّه سَبَقَ" </quran>بِإِحْلَالِ الْغَنَائِم وَالْأَسْرَى لَكُمْ <quran>"لَمَسَّكُمْ فِيمَا أَخَذْتُمْ" </quran>مِنْ الْفِدَاء</p></td></tr></table></body></html>
