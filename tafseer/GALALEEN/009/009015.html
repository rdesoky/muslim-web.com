<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ وَيَتُوبُ اللَّهُ عَلَى مَنْ يَشَاءُ وَاللَّهُ عَلِيمٌ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُذْهِب غَيْظ قُلُوبهمْ" </quran>كَرْبهَا <quran>"وَيَتُوب اللَّه عَلَى مَنْ يَشَاء" </quran>بِالرُّجُوعِ إلَى الْإِسْلَام كَأَبِي سُفْيَان</p></td></tr></table></body></html>
