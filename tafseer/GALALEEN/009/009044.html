<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْتَأْذِنُكَ الَّذِينَ يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ أَنْ يُجَاهِدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ وَاللَّهُ عَلِيمٌ بِالْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَسْتَأْذِنك الَّذِينَ يُؤْمِنُونَ بِاَللَّهِ وَالْيَوْم الْآخِر" </quran>فِي التَّخَلُّف عَنْ <quran>"أَنْ يُجَاهِدُوا بِأَمْوَالِهِمْ وَأَنْفُسهمْ "</quran></p></td></tr></table></body></html>
