<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لَنْ يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"لَنْ يُصِيبنَا إلَّا مَا كَتَبَ اللَّه لَنَا" </quran>إصَابَته <quran>"هُوَ مَوْلَانَا" </quran>نَاصِرنَا وَمُتَوَلِّي أُمُورنَا</p></td></tr></table></body></html>
