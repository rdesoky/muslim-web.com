<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَنْفِقُوا طَوْعًا أَوْ كَرْهًا لَنْ يُتَقَبَّلَ مِنْكُمْ إِنَّكُمْ كُنْتُمْ قَوْمًا فَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ أَنْفِقُوا" </quran>فِي طَاعَة اللَّه <quran>"طَوْعًا أَوْ كَرْهًا لَنْ يُتَقَبَّل مِنْكُمْ" </quran>مَا أَنْفَقْتُمُوهُ وَالْأَمْر هُنَا بِمَعْنَى الْخَبَر</p></td></tr></table></body></html>
