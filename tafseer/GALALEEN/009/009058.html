<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنْهُمْ مَنْ يَلْمِزُكَ فِي الصَّدَقَاتِ فَإِنْ أُعْطُوا مِنْهَا رَضُوا وَإِنْ لَمْ يُعْطَوْا مِنْهَا إِذَا هُمْ يَسْخَطُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْهُمْ مَنْ يَلْمِزك" </quran>يَعِيبك <quran>"فِي" </quran>قَسْم</p></td></tr></table></body></html>
