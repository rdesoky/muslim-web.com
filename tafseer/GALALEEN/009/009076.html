<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا آتَاهُمْ مِنْ فَضْلِهِ بَخِلُوا بِهِ وَتَوَلَّوْا وَهُمْ مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا آتَاهُمْ مِنْ فَضْله بَخِلُوا بِهِ وَتَوَلَّوْا" </quran>عَنْ طَاعَة اللَّه</p></td></tr></table></body></html>
