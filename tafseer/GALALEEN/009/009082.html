<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا جَزَاءً بِمَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلْيَضْحَكُوا قَلِيلًا" </quran>فِي الدُّنْيَا <quran>"وَلْيَبْكُوا" </quran>فِي الْآخِرَة وَهُوَ خَبَر عَنْ حَالهمْ بِصِيغَةِ الْأَمْر</p></td></tr></table></body></html>
