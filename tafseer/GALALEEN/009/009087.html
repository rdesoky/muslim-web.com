<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَضُوا بِأَنْ يَكُونُوا مَعَ الْخَوَالِفِ وَطُبِعَ عَلَى قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَضُوا بِأَنْ يَكُونُوا مَعَ الْخَوَالِف" </quran>جَمْع خَالِفَة أَيْ النِّسَاء اللَّاتِي تَخَلَّفْنَ فِي الْبُيُوت <quran>"وَطُبِعَ عَلَى قُلُوبهمْ فَهُمْ لَا يَفْقَهُونَ" </quran>الْخَيْر</p></td></tr></table></body></html>
