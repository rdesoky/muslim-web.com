<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ فَزَادَتْهُمْ رِجْسًا إِلَى رِجْسِهِمْ وَمَاتُوا وَهُمْ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمَّا الَّذِينَ فِي قُلُوبهمْ مَرَض" </quran>ضَعْف اعْتِقَاد <quran>"فَزَادَتْهُمْ رِجْسًا إلَى رِجْسهمْ" </quran>كُفْرًا إلَى كُفْرهمْ لِكُفْرِهِمْ بِهَا</p></td></tr></table></body></html>
