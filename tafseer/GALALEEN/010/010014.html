<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَعَلْنَاكُمْ خَلَائِفَ فِي الْأَرْضِ مِنْ بَعْدِهِمْ لِنَنْظُرَ كَيْفَ تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ جَعَلْنَاكُمْ" </quran>يَا أَهْل مَكَّة <quran>"خَلَائِف" </quran>جَمْع خَلِيفَة <quran>"فِي الْأَرْض مِنْ بَعْدهمْ لِنَنْظُر كَيْفَ تَعْمَلُونَ" </quran>فِيهَا وَهَلْ تَعْتَبِرُونَ بِهِمْ فَتُصَدِّقُوا رُسُلنَا</p></td></tr></table></body></html>
