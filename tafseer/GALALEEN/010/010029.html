<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَفَى بِاللَّهِ شَهِيدًا بَيْنَنَا وَبَيْنَكُمْ إِنْ كُنَّا عَنْ عِبَادَتِكُمْ لَغَافِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكَفَى بِاَللَّهِ شَهِيدًا بَيْننَا وَبَيْنكُمْ إنْ" </quran>مُخَفَّفَة أَيْ إنَّا</p></td></tr></table></body></html>
