<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ حَقَّتْ كَلِمَةُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ" </quran>كَمَا صَرَفَ هَؤُلَاءِ عَنْ الْإِيمَان <quran>"حَقَّتْ كَلِمَة رَبّك عَلَى الَّذِينَ فَسَقُوا" </quran>كَفَرُوا وَهِيَ <quran>"لَأَمْلَأَن جَهَنَّم" </quran>الْآيَة أَوْ هِيَ <quran>"أَنَّهُمْ لَا يُؤْمِنُونَ"</quran></p></td></tr></table></body></html>
