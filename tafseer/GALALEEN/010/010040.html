<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنْهُمْ مَنْ يُؤْمِنُ بِهِ وَمِنْهُمْ مَنْ لَا يُؤْمِنُ بِهِ وَرَبُّكَ أَعْلَمُ بِالْمُفْسِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْهُمْ" </quran>أَيْ أَهْل مَكَّة <quran>"مَنْ يُؤْمِن بِهِ" </quran>لِعِلْمِ اللَّه ذَلِكَ مِنْهُمْ <quran>"وَمِنْهُمْ مَنْ لَا يُؤْمِن بِهِ" </quran>أَبَدًا <quran>"وَرَبّك أَعْلَم بِالْمُفْسِدِينَ" </quran>تَهْدِيد لَهُم</p></td></tr></table></body></html>
