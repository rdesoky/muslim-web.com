<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ قِيلَ لِلَّذِينَ ظَلَمُوا ذُوقُوا عَذَابَ الْخُلْدِ هَلْ تُجْزَوْنَ إِلَّا بِمَا كُنْتُمْ تَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ قِيلَ لِلَّذِينَ ظَلَمُوا ذُوقُوا عَذَاب الْخُلْد" </quran>أَيْ الَّذِي تَخْلُدُونَ فِيهِ <quran>"هَلْ" </quran>مَا <quran>"تُجْزَوْنَ إلَّا" </quran>جَزَاء</p></td></tr></table></body></html>
