<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسْتَنْبِئُونَكَ أَحَقٌّ هُوَ قُلْ إِي وَرَبِّي إِنَّهُ لَحَقٌّ وَمَا أَنْتُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَسْتَنْبِئُونَك" </quran>يَسْتَخْبِرُونَك <quran>"أَحَقّ هُوَ" </quran>أَيْ مَا وَعَدْتنَا بِهِ مِنْ الْعَذَاب وَالْبَعْث <quran>"قُلْ إي" </quran>نَعَمْ <quran>"وَرَبِّي إنَّهُ لَحَقّ وَمَا أَنْتُمْ بِمُعْجِزِينَ" </quran>بِفَائِتِينَ الْعَذَاب</p></td></tr></table></body></html>
