<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ بِفَضْلِ اللَّه" </quran>الْإِسْلَام <quran>"وَبِرَحْمَتِهِ" </quran>الْقُرْآن <quran>"فَبِذَلِكَ" </quran>الْفَضْل وَالرَّحْمَة <quran>"فَلْيَفْرَحُوا هُوَ خَيْر مِمَّا يَجْمَعُونَ" </quran>مِنْ الدُّنْيَا بِالْيَاءِ وَالتَّاء</p></td></tr></table></body></html>
