<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَا إنَّ أَوْلِيَاء اللَّه لَا خَوْف عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ" </quran>فِي الْآخِرَة</p></td></tr></table></body></html>
