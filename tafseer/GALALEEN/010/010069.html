<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّه الْكَذِب" </quran>بِنَسَبِهِ الْوَلَد إلَيْهِ <quran>"لَا يُفْلِحُونَ" </quran>لَا يَسْعَدُونَ</p></td></tr></table></body></html>
