<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَتَاعٌ فِي الدُّنْيَا ثُمَّ إِلَيْنَا مَرْجِعُهُمْ ثُمَّ نُذِيقُهُمُ الْعَذَابَ الشَّدِيدَ بِمَا كَانُوا يَكْفُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>لَهُمْ <quran>"مَتَاع" </quran>قَلِيل <quran>"فِي الدُّنْيَا" </quran>يَتَمَتَّعُونَ بِهِ مُدَّة حَيَاتهمْ <quran>"ثُمَّ إلَيْنَا مَرْجِعهمْ" </quran>بِالْمَوْتِ <quran>"ثُمَّ نُذِيقهُمْ الْعَذَاب الشَّدِيد" </quran>بَعْد الْمَوْت</p></td></tr></table></body></html>
