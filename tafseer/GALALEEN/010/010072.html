<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ تَوَلَّيْتُمْ فَمَا سَأَلْتُكُمْ مِنْ أَجْرٍ إِنْ أَجْرِيَ إِلَّا عَلَى اللَّهِ وَأُمِرْتُ أَنْ أَكُونَ مِنَ الْمُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنْ تَوَلَّيْتُمْ" </quran>عَنْ تَذْكِيرِي <quran>"فَمَا سَأَلْتُكُمْ مِنْ أَجْر" </quran>ثَوَاب عَلَيْهِ فَتَوَلَّوْا <quran>"إنْ" </quran>مَا <quran>"أَجْرِيَ" </quran>ثَوَابِي</p></td></tr></table></body></html>
