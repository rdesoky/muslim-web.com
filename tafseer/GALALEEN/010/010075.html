<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ بَعَثْنَا مِنْ بَعْدِهِمْ مُوسَى وَهَارُونَ إِلَى فِرْعَوْنَ وَمَلَئِهِ بِآيَاتِنَا فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ بَعَثْنَا مِنْ بَعْده مُوسَى وَهَارُونَ إلَى فِرْعَوْن وَمَلَئِهِ" </quran>قَوْمه <quran>"بِآيَاتِنَا" </quran>التِّسْع <quran>"فَاسْتَكْبَرُوا" </quran>عَنْ الْإِيمَان بِهَا</p></td></tr></table></body></html>
