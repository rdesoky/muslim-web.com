<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ مُوسَى أَتَقُولُونَ لِلْحَقِّ لَمَّا جَاءَكُمْ أَسِحْرٌ هَذَا وَلَا يُفْلِحُ السَّاحِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ مُوسَى أَتَقُولُونَ لِلْحَقِّ لَمَّا جَاءَكُمْ أَسِحْر هَذَا" </quran>إنَّهُ لَسِحْر وَقَدْ أَفْلَحَ مَنْ أَتَى بِهِ وَأَبْطَلَ سِحْر السَّحَرَة وَالِاسْتِفْهَام فِي الْمَوْضِعَيْنِ لِلْإِنْكَارِ</p></td></tr></table></body></html>
