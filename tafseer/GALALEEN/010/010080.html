<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَ السَّحَرَةُ قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا جَاءَ السَّحَرَة قَالَ لَهُمْ مُوسَى" </quran>بَعْد مَا قَالُوا لَهُ <quran>"إمَّا أَنْ تُلْقِي وَإِمَّا أَنْ نَكُون نَحْنُ الْمُلْقِينَ" </quran>:</p></td></tr></table></body></html>
