<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُحِقّ" </quran>يُثْبِت وَيُظْهِر <quran>"اللَّه الْحَقّ بِكَلِمَاتِهِ" </quran>بِمَوَاعِيدِهِ</p></td></tr></table></body></html>
