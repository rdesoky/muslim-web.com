<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَالُوا عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقَالُوا عَلَى اللَّه تَوَكَّلْنَا رَبّنَا لَا تَجْعَلنَا فِتْنَة لِلْقَوْمِ الظَّالِمِينَ" </quran>أَيْ لَا تُظْهِرهُمْ عَلَيْنَا فَيَظُنُّوا أَنَّهُمْ عَلَى الْحَقّ فَيَفْتَتِنُوا بِنَا</p></td></tr></table></body></html>
