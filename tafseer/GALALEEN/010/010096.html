<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ حَقَّتْ عَلَيْهِمْ كَلِمَةُ رَبِّكَ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ حَقَّتْ" </quran>وَجَبَتْ <quran>"عَلَيْهِمْ كَلِمَة رَبّك" </quran>بِالْعَذَابِ</p></td></tr></table></body></html>
