<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ شَاءَ رَبُّكَ لَآمَنَ مَنْ فِي الْأَرْضِ كُلُّهُمْ جَمِيعًا أَفَأَنْتَ تُكْرِهُ النَّاسَ حَتَّى يَكُونُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ شَاءَ رَبّك لَآمَنَ مَنْ فِي الْأَرْض كُلّهمْ جَمِيعًا أَفَأَنْتَ تُكْرِه النَّاس" </quran>بِمَا لَمْ يَشَأْهُ اللَّه مِنْهُمْ <quran>"حَتَّى يَكُونُوا مُؤْمِنِينَ" </quran>لَا</p></td></tr></table></body></html>
