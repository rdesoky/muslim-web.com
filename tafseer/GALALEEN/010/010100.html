<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ لِنَفْسٍ أَنْ تُؤْمِنَ إِلَّا بِإِذْنِ اللَّهِ وَيَجْعَلُ الرِّجْسَ عَلَى الَّذِينَ لَا يَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا كَانَ لِنَفْسٍ أَنْ تُؤْمِن إلَّا بِإِذْنِ اللَّه" </quran>بِإِرَادَتِهِ <quran>"وَيَجْعَل الرِّجْس" </quran>الْعَذَاب <quran>"عَلَى الَّذِينَ لَا يَعْقِلُونَ" </quran>يَتَدَبَّرُونَ آيَات اللَّه</p></td></tr></table></body></html>
