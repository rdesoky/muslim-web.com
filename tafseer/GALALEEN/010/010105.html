<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْ أَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا وَلَا تَكُونَنَّ مِنَ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"و" </quran>قِيلَ لِي <quran>"أَنْ أَقِمْ وَجْهك لِلدِّينِ حَنِيفًا" </quran>مَائِلًا إلَيْهِ</p></td></tr></table></body></html>
