<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَدْعُ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكَ وَلَا يَضُرُّكَ فَإِنْ فَعَلْتَ فَإِنَّكَ إِذًا مِنَ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَدْعُ" </quran>تَعْبُد <quran>"مِنْ دُون اللَّه مَا لَا يَنْفَعك" </quran>إنْ عَبَدْته <quran>"وَلَا يَضُرّك" </quran>إنْ لَمْ تَعْبُدهُ <quran>"فَإِنْ فَعَلْت" </quran>ذَلِكَ فَرْضًا</p></td></tr></table></body></html>
