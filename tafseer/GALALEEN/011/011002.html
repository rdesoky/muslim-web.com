<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَّا تَعْبُدُوا إِلَّا اللَّهَ إِنَّنِي لَكُمْ مِنْهُ نَذِيرٌ وَبَشِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَ" </quran>أَيْ بِأَنْ <quran>"لَا تَعْبُدُوا إلَّا اللَّه إنَّنِي لَكُمْ مِنْهُ نَذِير" </quran>بِالْعَذَابِ إنْ كَفَرْتُمْ <quran>"وَبَشِير" </quran>بِالثَّوَابِ إنْ آمَنْتُمْ</p></td></tr></table></body></html>
