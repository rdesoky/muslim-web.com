<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى اللَّهِ مَرْجِعُكُمْ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَى اللَّه مَرْجِعكُمْ وَهُوَ عَلَى كُلّ شَيْء قَدِير" </quran>وَمِنْهُ الثَّوَاب وَالْعَذَاب</p></td></tr></table></body></html>
