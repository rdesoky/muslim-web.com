<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا الَّذِينَ صَبَرُوا وَعَمِلُوا الصَّالِحَاتِ أُولَئِكَ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ كَبِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا" </quran>لَكِنْ <quran>"الَّذِينَ صَبَرُوا" </quran>عَلَى الضَّرَّاء <quran>"وَعَمِلُوا الصَّالِحَات" </quran>فِي النَّعْمَاء <quran>"أُولَئِكَ لَهُمْ مَغْفِرَة وَأَجْر كَبِير" </quran>هُوَ الْجَنَّة</p></td></tr></table></body></html>
