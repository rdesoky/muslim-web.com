<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ الَّذِينَ خَسِرُوا أَنْفُسهمْ" </quran>لِمَصِيرِهِمْ إلَى النَّار الْمُؤَبَّدَة عَلَيْهِمْ <quran>"وَضَلَّ" </quran>غَابَ <quran>"عَنْهُمْ مَا كَانُوا يَفْتَرُونَ" </quran>عَلَى اللَّه مِنْ دَعْوَى الشَّرِيك</p></td></tr></table></body></html>
