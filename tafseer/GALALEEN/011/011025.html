<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَى قَوْمِهِ إِنِّي لَكُمْ نَذِيرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَرْسَلْنَا نُوحًا إلَى قَوْمه إِنِّي" </quran>أَيْ بِأَنِّي وَفِي قِرَاءَة بِالْكَسْرِ عَلَى حَذْف الْقَوْل <quran>"لَكُمْ نَذِير مُبِين" </quran>بَيِّن الْإِنْذَار</p></td></tr></table></body></html>
