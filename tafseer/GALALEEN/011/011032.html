<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا نُوحُ قَدْ جَادَلْتَنَا فَأَكْثَرْتَ جِدَالَنَا فَأْتِنَا بِمَا تَعِدُنَا إِنْ كُنْتَ مِنَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا يَا نُوح قَدْ جَادَلْتنَا" </quran>خَاصَمْتنَا <quran>"فَأَكْثَرْت جِدَالنَا فَأْتِنَا بِمَا تَعِدنَا" </quran>بِهِ مِنْ الْعَذَاب <quran>"إنْ كُنْت مِنْ الصَّادِقِينَ" </quran>فِيهِ</p></td></tr></table></body></html>
