<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّمَا يَأْتِيكُمْ بِهِ اللَّهُ إِنْ شَاءَ وَمَا أَنْتُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ إنَّمَا يَأْتِيكُمْ بِهِ اللَّه إنْ شَاءَ" </quran>تَعْجِيله لَكُمْ فَإِنَّ أَمْره إلَيْهِ لَا إلَيَّ <quran>"وَمَا أَنْتُمْ بِمُعْجِزِينَ" </quran>بِفَائَتِينَ اللَّه</p></td></tr></table></body></html>
