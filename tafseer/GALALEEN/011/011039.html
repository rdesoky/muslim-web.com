<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَوْفَ تَعْلَمُونَ مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسَوْفَ تَعْلَمُونَ مَنْ" </quran>مَوْصُولَة مَفْعُول الْعِلْم <quran>"يَأْتِيه عَذَاب يُخْزِيه وَيَحِلّ" </quran>يَنْزِل</p></td></tr></table></body></html>
