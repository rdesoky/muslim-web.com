<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهِيَ تَجْرِي بِهِمْ فِي مَوْجٍ كَالْجِبَالِ وَنَادَى نُوحٌ ابْنَهُ وَكَانَ فِي مَعْزِلٍ يَا بُنَيَّ ارْكَبْ مَعَنَا وَلَا تَكُنْ مَعَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَهِيَ تَجْرِي بِهِمْ فِي مَوْج كَالْجِبَالِ" </quran>فِي الِارْتِفَاع وَالْعِظَم <quran>"وَنَادَى نُوح ابْنه" </quran>كَنْعَان <quran>"وَكَانَ فِي مَعْزِل" </quran>عَنْ السَّفِينَة</p></td></tr></table></body></html>
