<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُنْ مِنَ الْخَاسِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ إنِّي أَعُوذ بِك" </quran>مِنْ <quran>"أَنْ أَسْأَلك مَا لَيْسَ لِي بِهِ عِلْم وَإِلَّا تَغْفِر لِي" </quran>مَا فَرَطَ مِنِّي</p></td></tr></table></body></html>
