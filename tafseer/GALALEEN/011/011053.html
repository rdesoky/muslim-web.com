<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا هُودُ مَا جِئْتَنَا بِبَيِّنَةٍ وَمَا نَحْنُ بِتَارِكِي آلِهَتِنَا عَنْ قَوْلِكَ وَمَا نَحْنُ لَكَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا يَا هُود مَا جِئْتنَا بِبَيِّنَةٍ" </quran>بُرْهَان عَلَى قَوْلك <quran>"وَمَا نَحْنُ بِتَارِكِي آلِهَتنَا عَنْ قَوْلك" </quran>أَيْ لِقَوْلِك</p></td></tr></table></body></html>
