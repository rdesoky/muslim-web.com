<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ دُونِهِ فَكِيدُونِي جَمِيعًا ثُمَّ لَا تُنْظِرُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مِنْ دُونه فَكِيدُونِي" </quran>احْتَالُوا فِي هَلَاكِي <quran>"جَمِيعًا" </quran>أَنْتُمْ وَأَوْثَانكُمْ <quran>"ثُمَّ لَا تُنْظِرُونِي" </quran>تُمْهِلُونِ</p></td></tr></table></body></html>
