<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَقَرُوهَا فَقَالَ تَمَتَّعُوا فِي دَارِكُمْ ثَلَاثَةَ أَيَّامٍ ذَلِكَ وَعْدٌ غَيْرُ مَكْذُوبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَعَقَرُوهَا" </quran>عَقَرَهَا قِدَار بِأَمْرِهِمْ <quran>"فَقَالَ" </quran>صَالِح <quran>"تَمَتَّعُوا" </quran>عِيشُوا <quran>"فِي دَاركُمْ ثَلَاثَة أَيَّام" </quran>ثُمَّ تَهْلَكُونَ <quran>"ذَلِكَ وَعْد غَيْر مَكْذُوب" </quran>فِيهِ</p></td></tr></table></body></html>
