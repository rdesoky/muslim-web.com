<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ رَحْمَةُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ إِنَّهُ حَمِيدٌ مَجِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا أَتَعْجَبِينَ مِنْ أَمْر اللَّه" </quran>قُدْرَته <quran>"رَحْمَة اللَّه وَبَرَكَاته عَلَيْكُمْ" </quran>يَا <quran>"أَهْل الْبَيْت" </quran>بَيْت إبْرَاهِيم <quran>"إنَّهُ حَمِيد" </quran>مَحْمُود <quran>"مَجِيد" </quran>كَرِيم</p></td></tr></table></body></html>
