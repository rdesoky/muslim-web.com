<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا ذَهَبَ عَنْ إِبْرَاهِيمَ الرَّوْعُ وَجَاءَتْهُ الْبُشْرَى يُجَادِلُنَا فِي قَوْمِ لُوطٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا ذَهَبَ عَنْ إبْرَاهِيم الرَّوْع" </quran>الْخَوْف <quran>"وَجَاءَتْهُ الْبُشْرَى" </quran>بِالْوَلَدِ أَخَذَ <quran>"يُجَادِلنَا" </quran>يُجَادِل رُسُلنَا <quran>"فِي" </quran>شَأْن</p></td></tr></table></body></html>
