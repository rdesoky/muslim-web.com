<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا إِبْرَاهِيمُ أَعْرِضْ عَنْ هَذَا إِنَّهُ قَدْ جَاءَ أَمْرُ رَبِّكَ وَإِنَّهُمْ آتِيهِمْ عَذَابٌ غَيْرُ</font></td></tr><tr><td align=right dir=rtl><p>فَلَمَّا أَطَالَ مُجَادَلَتهمْ قَالُوا : <quran>"يَا إبْرَاهِيم أَعْرِض عَنْ هَذَا" </quran>الْجِدَال <quran>"إنَّهُ قَدْ جَاءَ أَمْر رَبّك" </quran>بِهَلَاكِهِمْ</p></td></tr></table></body></html>
