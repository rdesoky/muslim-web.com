<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَقَدْ عَلِمْتَ مَا لَنَا فِي بَنَاتِكَ مِنْ حَقٍّ وَإِنَّكَ لَتَعْلَمُ مَا نُرِيدُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَقَدْ عَلِمْت مَا لَنَا فِي بَنَاتك مِنْ حَقّ" </quran>حَاجَة <quran>"وَإِنَّك لَتَعْلَم مَا نُرِيد" </quran>مِنْ إتْيَان الرِّجَال</p></td></tr></table></body></html>
