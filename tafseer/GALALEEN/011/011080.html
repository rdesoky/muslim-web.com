<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَوْ أَنَّ لِي بِكُمْ قُوَّةً أَوْ آوِي إِلَى رُكْنٍ شَدِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ لَوْ أَنَّ لِي بِكُمْ قُوَّة" </quran>طَاقَة <quran>"أَوْ آوِي إلَى رُكْن شَدِيد" </quran>عَشِيرَة تَنْصُرنِي لَبَطَشْت بِكُمْ فَلَمَّا رَأَتْ الْمَلَائِكَة ذَلِكَ</p></td></tr></table></body></html>
