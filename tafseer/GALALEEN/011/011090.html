<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاسْتَغْفِرُوا رَبّكُمْ ثُمَّ تُوبُوا إلَيْهِ إنَّ رَبِّي رَحِيم" </quran>بِالْمُؤْمِنِينَ <quran>"وَدُود" </quran>مُحِبّ لَهُمْ</p></td></tr></table></body></html>
