<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَأَنْ لَمْ يَغْنَوْا فِيهَا أَلَا بُعْدًا لِمَدْيَنَ كَمَا بَعِدَتْ ثَمُودُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَأَنْ" </quran>مُخَفَّفَة : أَيْ كَأَنَّهُمْ <quran>"لَمْ يَغْنَوْا" </quran>يُقِيمُوا</p></td></tr></table></body></html>
