<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَقْدُمُ قَوْمَهُ يَوْمَ الْقِيَامَةِ فَأَوْرَدَهُمُ النَّارَ وَبِئْسَ الْوِرْدُ الْمَوْرُودُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَقْدُم" </quran>يَتَقَدَّم <quran>"قَوْمه يَوْم الْقِيَامَة" </quran>فَيَتَّبِعُونَهُ كَمَا اتَّبَعُوهُ فِي الدُّنْيَا <quran>"فَأَوْرَدَهُمْ" </quran>أَدْخَلَهُمْ <quran>"النَّار وَبِئْسَ الْوِرْد الْمَوْرُود" </quran>هِيَ</p></td></tr></table></body></html>
