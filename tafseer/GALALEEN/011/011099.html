<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُتْبِعُوا فِي هَذِهِ لَعْنَةً وَيَوْمَ الْقِيَامَةِ بِئْسَ الرِّفْدُ الْمَرْفُودُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأُتْبِعُوا فِي هَذِهِ" </quran>أَيْ الدُّنْيَا <quran>"لَعْنَة وَيَوْم الْقِيَامَة" </quran>لَعْنَة <quran>"بِئْسَ الرِّفْد" </quran>الْعَوْن <quran>"الْمَرْفُود" </quran>رِفْدهمْ</p></td></tr></table></body></html>
