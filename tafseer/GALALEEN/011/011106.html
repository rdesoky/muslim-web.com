<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا الَّذِينَ شَقُوا فَفِي النَّارِ لَهُمْ فِيهَا زَفِيرٌ وَشَهِيقٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَمَّا الَّذِينَ شَقُوا" </quran>فِي عِلْمه تَعَالَى <quran>"فَفِي النَّار لَهُمْ فِيهَا زَفِير" </quran>صَوْت شَدِيد <quran>"وَشَهِيق" </quran>صَوْت ضَعِيف</p></td></tr></table></body></html>
