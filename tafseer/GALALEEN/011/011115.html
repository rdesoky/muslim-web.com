<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاصْبِرْ" </quran>يَا مُحَمَّد عَلَى أَذَى قَوْمك أَوْ عَلَى الصَّلَاة <quran>"فَإِنَّ اللَّه لَا يُضِيع أَجْر الْمُحْسِنِينَ" </quran>بِالصَّبْرِ عَلَى الطَّاعَة</p></td></tr></table></body></html>
