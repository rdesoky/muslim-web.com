<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ رَبُّكَ لِيُهْلِكَ الْقُرَى بِظُلْمٍ وَأَهْلُهَا مُصْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا كَانَ رَبّك لِيُهْلِك الْقُرَى بِظُلْمٍ" </quran>مِنْهُ لَهُمْ <quran>"وَأَهْلهَا مُصْلِحُونَ" </quran>مُؤْمِنُونَ</p></td></tr></table></body></html>
