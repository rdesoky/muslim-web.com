<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ شَاءَ رَبُّكَ لَجَعَلَ النَّاسَ أُمَّةً وَاحِدَةً وَلَا يَزَالُونَ مُخْتَلِفِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ شَاءَ رَبّك لَجَعَلَ النَّاس أُمَّة وَاحِدَة" </quran>أَهْل دِين وَاحِد <quran>"وَلَا يَزَالُونَ مُخْتَلِفِينَ" </quran>فِيالدِّين</p></td></tr></table></body></html>
