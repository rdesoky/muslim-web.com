<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقُلْ لِلَّذِينَ لَا يُؤْمِنُونَ اعْمَلُوا عَلَى مَكَانَتِكُمْ إِنَّا عَامِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقُلْ لِلَّذِينَ لَا يُؤْمِنُونَ اعْمَلُوا عَلَى مَكَانَتكُمْ" </quran>حَالَتكُمْ <quran>"إنَّا عَامِلُونَ" </quran>عَلَى حَالَتنَا تَهْدِيد لَهُمْ</p></td></tr></table></body></html>
