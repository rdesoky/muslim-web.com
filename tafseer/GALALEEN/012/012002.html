<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا" </quran>بِلُغَةِ الْعَرَب <quran>"لَعَلَّكُمْ" </quran>يَا أَهْل مَكَّة <quran>"تَعْقِلُونَ" </quran>تَفْقَهُونَ مَعَانِيه</p></td></tr></table></body></html>
