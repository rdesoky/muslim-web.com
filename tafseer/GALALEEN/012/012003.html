<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ الْقَصَصِ بِمَا أَوْحَيْنَا إِلَيْكَ هَذَا الْقُرْآنَ وَإِنْ كُنْتَ مِنْ قَبْلِهِ لَمِنَ الْغَافِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نَحْنُ نَقُصّ عَلَيْك أَحْسَن الْقَصَص بِمَا أَوْحَيْنَا" </quran>بِإِيحَائِنَا <quran>"إلَيْك هَذَا الْقُرْآن وَإِنْ" </quran>مُخَفَّفَة أَيْ وَإِنَّهُ</p></td></tr></table></body></html>
