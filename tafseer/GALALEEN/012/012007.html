<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ كَانَ فِي يُوسُفَ وَإِخْوَتِهِ آيَاتٌ لِلسَّائِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ كَانَ فِي" </quran>خَبَر <quran>"يُوسُف وَإِخْوَته" </quran>وَهُمْ أَحَد عَشَر <quran>"آيَات" </quran>عِبَر <quran>"لِلسَّائِلِينَ" </quran>عَنْ خَبَرهمْ</p></td></tr></table></body></html>
