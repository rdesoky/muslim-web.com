<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا أَبَانَا مَا لَكَ لَا تَأْمَنَّا عَلَى يُوسُفَ وَإِنَّا لَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا يَا أَبَانَا مَا لَك لَا تَأْمَنَّا عَلَى يُوسُف وَإِنَّا لَهُ لَنَاصِحُونَ" </quran>لَقَائِمُونَ بِمَصَالِحِهِ</p></td></tr></table></body></html>
