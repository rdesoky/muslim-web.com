<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَئِنْ أَكَلَهُ الذِّئْبُ وَنَحْنُ عُصْبَةٌ إِنَّا إِذًا لَخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَئِنْ" </quran>لَام قَسَم <quran>"أَكَلَهُ الذِّئْب وَنَحْنُ عُصْبَة" </quran>جَمَاعَة <quran>"إنَّا إذًا لَخَاسِرُونَ" </quran>عَاجِزُونَ فَأَرْسَلَهُ مَعَهُمْ</p></td></tr></table></body></html>
