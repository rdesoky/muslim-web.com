<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ كَانَ قَمِيصُهُ قُدَّ مِنْ دُبُرٍ فَكَذَبَتْ وَهُوَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ كَانَ قَمِيصه قُدَّ مِنْ دُبُر" </quran>خَلْف</p></td></tr></table></body></html>
