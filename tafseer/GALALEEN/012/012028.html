<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا رَأَى قَمِيصَهُ قُدَّ مِنْ دُبُرٍ قَالَ إِنَّهُ مِنْ كَيْدِكُنَّ إِنَّ كَيْدَكُنَّ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا رَأَى" </quran>زَوْجهَا <quran>"قَمِيصه قُدَّ مِنْ دُبُر قَالَ إنَّهُ" </quran>أَيْ قَوْلك <quran>"مَا جَزَاء مَنْ أَرَادَ" </quran>إلَخْ <quran>"مِنْ كَيْدكُنَّ" </quran>أَيّهَا النِّسَاء</p></td></tr></table></body></html>
