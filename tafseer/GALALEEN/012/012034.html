<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْتَجَابَ لَهُ رَبُّهُ فَصَرَفَ عَنْهُ كَيْدَهُنَّ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاسْتَجَابَ لَهُ رَبّه" </quran>دُعَاءَهُ <quran>"فَصَرَفَ عَنْهُ كَيْدهنَّ إنَّهُ هُوَ السَّمِيع" </quran>لِلْقَوْلِ <quran>"الْعَلِيم" </quran>بِالْفِعْلِ</p></td></tr></table></body></html>
