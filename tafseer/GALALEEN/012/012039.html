<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا صَاحِبَيِ السِّجْنِ أَأَرْبَابٌ مُتَفَرِّقُونَ خَيْرٌ أَمِ اللَّهُ الْوَاحِدُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا صَاحِبَيِ" </quran>سَاكِنِي <quran>"السِّجْن أَأَرْبَاب مُتَفَرِّقُونَ خَيْر أَمِ اللَّه الْوَاحِد الْقَهَّار" </quran>خَيْر ؟ اسْتِفْهَام تَقْرِير</p></td></tr></table></body></html>
