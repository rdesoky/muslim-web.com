<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يَأْتِي مِنْ بَعْدِ ذَلِكَ عَامٌ فِيهِ يُغَاثُ النَّاسُ وَفِيهِ يَعْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ يَأْتِي مِنْ بَعْد ذَلِكَ" </quran>أَيْ السَّبْع الْمُجْدِبَات <quran>"عَام فِيهِ يُغَاث النَّاس" </quran>بِالْمَطَرِ <quran>"وَفِيهِ يَعْصِرُونَ" </quran>الْأَعْنَاب وَغَيْرهَا لِخِصْبِهِ</p></td></tr></table></body></html>
