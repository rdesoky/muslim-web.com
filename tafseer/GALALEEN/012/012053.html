<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أُبَرِّئ نَفْسِي" </quran>مِنْ الزَّلَل <quran>"إِنَّ النَّفْس" </quran>الْجِنْس <quran>"لَأَمَّارَة" </quran>كَثِيرَة الْأَمْر <quran>"بِالسُّوءِ إلَّا مَا" </quran>بِمَعْنَى مَنْ <quran>"رَحِمَ رَبِّي" </quran>فَعَصَمَهُ</p></td></tr></table></body></html>
