<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ اجْعَلْنِي عَلَى خَزَائِنِ الْأَرْضِ إِنِّي حَفِيظٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>يُوسُف <quran>"اجْعَلْنِي عَلَى خَزَائِن الْأَرْض" </quran>أَرْض مِصْر <quran>"إنِّي حَفِيظ عَلِيم" </quran>ذُو حِفْظ وَعِلْم بِأَمْرِهَا وَقِيلَ كَاتِب حَاسِب</p></td></tr></table></body></html>
