<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَأَجْرُ الْآخِرَةِ خَيْرٌ لِلَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَأَجْر الْآخِرَة خَيْر" </quran>مِنْ أَجْر الدُّنْيَا وَدَخَلَتْ سُنُو الْقَحْط وَأَصَابَ أَرْض كَنْعَان وَالشَّام</p></td></tr></table></body></html>
