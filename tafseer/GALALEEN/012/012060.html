<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ لَمْ تَأْتُونِي بِهِ فَلَا كَيْلَ لَكُمْ عِنْدِي وَلَا تَقْرَبُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنْ لَمْ تَأْتُونِي بِهِ فَلَا كَيْل لَكُمْ عِنْدِي" </quran>أَيْ مِيرَة <quran>"وَلَا تَقْرَبُونِي" </quran>نَهْي أَوْ عَطْف عَلَى مَحَلّ فَلَا كَيْل أَيْ تُحْرَمُوا وَلَا تَقْرَبُوا</p></td></tr></table></body></html>
