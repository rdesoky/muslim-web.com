<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا سَنُرَاوِدُ عَنْهُ أَبَاهُ وَإِنَّا لَفَاعِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا سَنُرَاوِدُ عَنْهُ أَبَاهُ" </quran>سَنَجْتَهِدُ فِي طَلَبه مِنْهُ <quran>"وَإِنَّا لَفَاعِلُونَ" </quran>ذَلِكَ</p></td></tr></table></body></html>
