<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا وَأَقْبَلُوا عَلَيْهِمْ مَاذَا تَفْقِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا وَ" </quran>قَدْ <quran>"أَقْبَلُوا عَلَيْهِمْ" </quran>مَا الَّذِي <quran>"تَفْقِدُونَ" </quran>ـهُ</p></td></tr></table></body></html>
