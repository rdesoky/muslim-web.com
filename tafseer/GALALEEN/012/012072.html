<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا نَفْقِدُ صُوَاعَ الْمَلِكِ وَلِمَنْ جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَا بِهِ زَعِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا نَفْقِد صُوَاع" </quran>صَاع <quran>"الْمَلِك وَلِمَنْ جَاءَ بِهِ حِمْل بَعِير" </quran>مِنْ الطَّعَام <quran>"وَأَنَا بِهِ" </quran>بِالْحَمْلِ <quran>"زَعِيم" </quran>كَفِيل</p></td></tr></table></body></html>
