<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا تَاللَّهِ لَقَدْ عَلِمْتُمْ مَا جِئْنَا لِنُفْسِدَ فِي الْأَرْضِ وَمَا كُنَّا سَارِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا تَاللَّهِ" </quran>قَسَم فِيهِ مَعْنَى التَّعَجُّب <quran>"لَقَدْ عَلِمْتُمْ مَا جِئْنَا لِنُفْسِد فِي الْأَرْض وَمَا كُنَّا سَارِقِينَ" </quran>مَا سَرَقْنَا قَطُّ</p></td></tr></table></body></html>
