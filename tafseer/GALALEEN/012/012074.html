<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا فَمَا جَزَاؤُهُ إِنْ كُنْتُمْ كَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>أَيْ الْمُؤَذِّن وَأَصْحَابه <quran>"فَمَا جَزَاؤُهُ" </quran>أَيْ السَّارِق <quran>"إنْ كُنْتُمْ كَاذِبِينَ" </quran>فِي قَوْلكُمْ مَا كُنَّا سَارِقِينَ وَوُجِدَ فِيكُمْ</p></td></tr></table></body></html>
