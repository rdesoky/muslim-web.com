<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ لَا تَثْرِيب" </quran>عَتْب <quran>"عَلَيْكُمْ الْيَوْم" </quran>خَصَّهُ بِالذِّكْرِ لِأَنَّهُ مَظِنَّة التَّثْرِيب فَغَيْره أَوْلَى وَسَأَلَهُمْ عَنْ أَبِيهِ فَقَالُوا ذَهَبَتْ عَيْنَاهُ فَقَالَ :</p></td></tr></table></body></html>
