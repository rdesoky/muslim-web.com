<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا تَاللَّهِ إِنَّكَ لَفِي ضَلَالِكَ الْقَدِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>لَهُ <quran>"تَاللَّهِ إنَّك فِي ضَلَالك" </quran>خَطَئِك <quran>"الْقَدِيم" </quran>مِنْ إفْرَاطك فِي مَحَبَّته وَرَجَاء لِقَائِهِ عَلَى بُعْد الْعَهْد</p></td></tr></table></body></html>
