<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَأَيِّنْ مِنْ آيَةٍ فِي السَّمَاوَاتِ وَالْأَرْضِ يَمُرُّونَ عَلَيْهَا وَهُمْ عَنْهَا مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَأَيِّنْ" </quran>وَكَمْ <quran>"مِنْ آيَة" </quran>دَالَّة عَلَى وَحْدَانِيَّة اللَّه <quran>"فِي السَّمَوَات وَالْأَرْض يَمُرُّونَ عَلَيْهَا" </quran>يُشَاهِدُونَهَا <quran>"وَهُمْ عَنْهَا مُعْرِضُونَ" </quran>لَا يَتَفَكَّرُونَ بِهَا</p></td></tr></table></body></html>
