<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُوفُونَ بِعَهْدِ اللَّهِ وَلَا يَنْقُضُونَ الْمِيثَاقَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يُوفُونَ بِعَهْدِ اللَّه" </quran>الْمَأْخُوذ عَلَيْهِمْ وَهُمْ فِي عَالَم الذَّرّ أَوْ كُلّ عَهْد <quran>"وَلَا يَنْقُضُونَ الْمِيثَاق" </quran>بِتَرْكِ الْإِيمَان أَوْ الْفَرَائِض</p></td></tr></table></body></html>
