<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يَصِلُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ وَيَخْشَوْنَ رَبَّهُمْ وَيَخَافُونَ سُوءَ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ يَصِلُونَ مَا أَمَرَ اللَّه بِهِ أَنْ يُوصَل" </quran>مِنْ الْإِيمَان وَالرَّحِم وَغَيْر ذَلِك <quran>"وَيَخْشَوْنَ رَبّهمْ" </quran>أَيْ وَعِيده <quran>"وَيَخَافُونَ سُوء الْحِسَاب" </quran>تَقَدَّمَ مِثْله</p></td></tr></table></body></html>
