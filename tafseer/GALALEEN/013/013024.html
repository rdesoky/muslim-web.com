<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلَامٌ عَلَيْكُمْ بِمَا صَبَرْتُمْ فَنِعْمَ عُقْبَى الدَّارِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُولُونَ <quran>"سَلَام عَلَيْكُمْ" </quran>هَذَا الثَّوَاب <quran>"بِمَا صَبَرْتُمْ" </quran>بِصَبْرِكُمْ فِي الدُّنْيَا <quran>"فَنِعْمَ عُقْبَى الدَّار" </quran>عُقْبَاكُمْ</p></td></tr></table></body></html>
