<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُمْ بِذِكْرِ اللَّهِ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ آمَنُوا وَتَطْمَئِنّ" </quran>تَسْكُنُ <quran>"قُلُوبهمْ بِذِكْرِ اللَّه" </quran>أَيْ وَعْده <quran>"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوب" </quran>أَيْ قُلُوب الْمُؤْمِنِينَ</p></td></tr></table></body></html>
