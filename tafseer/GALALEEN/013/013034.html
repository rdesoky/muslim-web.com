<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُمْ عَذَابٌ فِي الْحَيَاةِ الدُّنْيَا وَلَعَذَابُ الْآخِرَةِ أَشَقُّ وَمَا لَهُمْ مِنَ اللَّهِ مِنْ وَاقٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُمْ عَذَاب فِي الْحَيَاة الدُّنْيَا" </quran>بِالْقَتْلِ وَالْأَسْر <quran>"وَلَعَذَاب الْآخِرَة أَشَقّ" </quran>أَشَدّ مِنْهُ <quran>"وَمَا لَهُمْ مِنْ اللَّه" </quran>أَيْ عَذَابه <quran>"مِنْ وَاقٍ" </quran>مَانِع</p></td></tr></table></body></html>
