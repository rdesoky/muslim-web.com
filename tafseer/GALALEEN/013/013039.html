<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَمْحُوا اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَمْحُو اللَّه" </quran>مِنْهُ <quran>"مَا يَشَاء وَيُثْبِت" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد فِيهِ مَا يَشَاء مِنْ الْأَحْكَام وَغَيْرهَا <quran>"وَعِنْده أُمّ الْكِتَاب" </quran>أَصْله الَّذِي لَا يَتَغَيَّر مِنْهُ شَيْء وَهُوَ مَا كَتَبَهُ فِي الْأَزَل</p></td></tr></table></body></html>
