<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهِ الَّذِي لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَوَيْلٌ لِلْكَافِرِينَ مِنْ عَذَابٍ شَدِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه" </quran>بِالْجَرِّ بَدَل أَوْ عَطْف بَيَان وَمَا بَعْده صِفَة وَالرَّفْع مُبْتَدَأ خَبَره <quran>"الَّذِي لَهُ مَا فِي السَّمَاوَات وَمَا فِي الْأَرْض" </quran>مُلْكًا وَخَلْقًا وَعَبِيدًا</p></td></tr></table></body></html>
