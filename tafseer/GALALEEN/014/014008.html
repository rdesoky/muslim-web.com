<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى إِنْ تَكْفُرُوا أَنْتُمْ وَمَنْ فِي الْأَرْضِ جَمِيعًا فَإِنَّ اللَّهَ لَغَنِيٌّ حَمِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ مُوسَى" </quran>لِقَوْمِهِ <quran>"إنْ تَكْفُرُوا أَنْتُمْ وَمَنْ فِي الْأَرْض جَمِيعًا فَإِنَّ اللَّه لَغَنِيّ" </quran>عَنْ خَلْقه <quran>"حَمِيد" </quran>مَحْمُود فِي صُنْعه بِهِمْ</p></td></tr></table></body></html>
