<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>جَهَنَّمَ يَصْلَوْنَهَا وَبِئْسَ الْقَرَارُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"جَهَنَّم" </quran>عَطْف بَيَان <quran>"يَصْلَوْنَهَا" </quran>يَدْخُلُونَهَا <quran>"وَبِئْسَ الْقَرَار" </quran>الْمَقَرّ هِيَ</p></td></tr></table></body></html>
