<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دَائِبَيْنِ وَسَخَّرَ لَكُمُ اللَّيْلَ وَالنَّهَارَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَسَخَّرَ لَكُمُ الشَّمْس وَالْقَمَر دَائِبَيْنِ" </quran>جَارِيَيْنِ فِي فَلَكهمَا لَا يَفْتُرَانِ <quran>"وَسَخَّرَ لَكُمُ الليل" </quran>لِتَسْكُنُوا فِيهِ <quran>"وَالنَّهَار" </quran>لِتَبْتَغُوا فِيهِ مِنْ فَضْله</p></td></tr></table></body></html>
