<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَبّ اجْعَلْنِي مُقِيم الصَّلَاة وَ" </quran>اجْعَلْ <quran>"مِنْ ذُرِّيَّتِي" </quran>مِنْ يُقِيمهَا وَأَتَى بِمَنْ لِإِعْلَامِ اللَّه تَعَالَى لَهُ أَنَّ مِنْهُمْ كُفَّارًا <quran>"رَبّنَا وَتَقَبَّلْ دُعَاء" </quran>الْمَذْكُور</p></td></tr></table></body></html>
