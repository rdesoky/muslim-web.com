<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَبّنَا اغْفِرْ لِي وَلِوَالِدِيَّ" </quran>هَذَا قَبْل أَنْ يَتَبَيَّن لَهُ عَدَاوَتهمَا لِلَّهِ عَزَّ وَجَلَّ وَقِيلَ أَسْلَمَتْ أُمّه وَقُرِئَ وَالِدِي مُفْرَدًا وَوَلَدِي <quran>"وَلِلْمُؤْمِنِينَ يَوْم يَقُوم" </quran>يَثْبُت</p></td></tr></table></body></html>
