<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تَحْسَبَنَّ اللَّهَ مُخْلِفَ وَعْدِهِ رُسُلَهُ إِنَّ اللَّهَ عَزِيزٌ ذُو انْتِقَامٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا تَحْسَبَنّ اللَّهَ مُخْلِف وَعْده رُسُله" </quran>بِالنَّصْرِ <quran>"إنَّ اللَّه عَزِيز" </quran>غَالِب لَا يَعْجِزهُ شَيْء <quran>"ذُو انْتِقَام" </quran>مِمَّنْ عَصَاهُ</p></td></tr></table></body></html>
