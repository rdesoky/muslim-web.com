<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَرَابِيلُهُمْ مِنْ قَطِرَانٍ وَتَغْشَى وُجُوهَهُمُ النَّارُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَرَابِيلهمْ" </quran>قُمُصُهُمْ <quran>"مِنْ قَطِرَان" </quran>لِأَنَّهُ أَبْلَغ لِاشْتِعَالِ النَّار <quran>"وَتَغْشَى" </quran>تَعْلُو</p></td></tr></table></body></html>
