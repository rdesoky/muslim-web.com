<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا وَلَهَا كِتَابٌ مَعْلُومٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَهْلَكْنَا مِنْ" </quran>زَائِدَة <quran>"قَرْيَة" </quran>أُرِيدَ أَهْلهَا <quran>"إلَّا وَلَهَا كِتَاب" </quran>أَجَل <quran>"مَعْلُوم" </quran>مَحْدُود لِإِهْلَاكِهَا</p></td></tr></table></body></html>
