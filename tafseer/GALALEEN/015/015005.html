<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا تَسْبِقُ مِنْ أُمَّةٍ أَجَلَهَا وَمَا يَسْتَأْخِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا تَسْبِق مِنْ" </quran>زَائِدَة <quran>"أُمَّة أَجَلهَا وَمَا يَسْتَأْخِرُونَ" </quran>يَتَأَخَّرُونَ عَنْهُ</p></td></tr></table></body></html>
