<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ إِنَّكَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>أَيْ كُفَّار مَكَّة لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"يَا أَيّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْر" </quran>الْقُرْآن فِي زَعْمه</p></td></tr></table></body></html>
