<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَوْ مَا تَأْتِينَا بِالْمَلَائِكَةِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَوْ مَا" </quran>هَلَّا <quran>"تَأْتِينَا بِالْمَلَائِكَةِ إنْ كُنْت مِنَ الصَّادِقِينَ" </quran>فِي قَوْلك إنَّك نَبِيّ وَإِنَّ هَذَا الْقُرْآن مِنْ عِنْد اللَّه</p></td></tr></table></body></html>
