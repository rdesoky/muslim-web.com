<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا نُنَزِّلُ الْمَلَائِكَةَ إِلَّا بِالْحَقِّ وَمَا كَانُوا إِذًا مُنْظَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا نُنَزِّل" </quran>فِيهِ حَذْف إحْدَى التَّاءَيْنِ <quran>"الْمَلَائِكَة إلَّا بِالْحَقِّ" </quran>بِالْعَذَابِ <quran>"وَمَا كَانُوا إذًا" </quran>أَيْ حِين نُزُول الْمَلَائِكَة بِالْعَذَابِ <quran>"مُنْظَرِينَ" </quran>مُؤَخَّرِينَ</p></td></tr></table></body></html>
