<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَأْتِيهِمْ مِنْ رَسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا" </quran>كَانَ <quran>"يَأْتِيهِمْ مِنْ رَسُول إلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ" </quran>كَاسْتِهْزَاءِ قَوْمك بِك وَهَذَا تَسْلِيَة لَهُ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
