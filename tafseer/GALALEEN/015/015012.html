<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ نَسْلُكُهُ فِي قُلُوبِ الْمُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ نَسْلُكهُ" </quran>أَيْ مِثْل إدْخَالنَا التَّكْذِيب فِي قُلُوب أُولَئِكَ نُدْخِلهُ <quran>"فِي قُلُوب الْمُجْرِمِينَ" </quran>أَيْ كُفَّار مَكَّة</p></td></tr></table></body></html>
