<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ فَتَحْنَا عَلَيْهِمْ بَابًا مِنَ السَّمَاءِ فَظَلُّوا فِيهِ يَعْرُجُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ فَتَحْنَا عَلَيْهِمْ بَابًا مِنَ السَّمَاء فَظَلُّوا فِيهِ" </quran>فِي الْبَاب <quran>"يَعْرُجُونَ" </quran>يَصْعَدُونَ</p></td></tr></table></body></html>
