<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَالُوا إِنَّمَا سُكِّرَتْ أَبْصَارُنَا بَلْ نَحْنُ قَوْمٌ مَسْحُورُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَالُوا إنَّمَا سُكِّرَتْ" </quran>سُدَّتْ <quran>"أَبْصَارنَا بَلْ نَحْنُ قَوْم مَسْحُورُونَ" </quran>يُخَيَّل إلَيْنَا ذَلِكَ</p></td></tr></table></body></html>
