<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا مَنِ اسْتَرَقَ السَّمْعَ فَأَتْبَعَهُ شِهَابٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا" </quran>لَكِنْ <quran>"مَنِ اسْتَرَقَ السَّمْع" </quran>خَطَفَهُ <quran>"فَأَتْبَعَهُ شِهَاب مُبِين" </quran>كَوْكَب يُضِيء وَيُحْرِقهُ أَوْ يَثْقُبهُ أَوْ يَخْبِلهُ</p></td></tr></table></body></html>
