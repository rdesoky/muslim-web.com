<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْنَا لَكُمْ فِيهَا مَعَايِشَ وَمَنْ لَسْتُمْ لَهُ بِرَازِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَعَلْنَا لَكُمْ فِيهَا مَعَايِش" </quran>بِالْيَاءِ مِنْ الثِّمَار وَالْحُبُوب <quran>"وَ" </quran>جَعَلْنَا لَكُمْ <quran>"مَنْ لَسْتُمْ لَهُ بِرَازِقِينَ" </quran>مِنْ الْعَبِيد وَالدَّوَابّ وَالْأَنْعَام فَإِنَّمَا يَرْزُقهُمْ اللَّه</p></td></tr></table></body></html>
