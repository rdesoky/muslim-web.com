<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ مِنْ شَيْءٍ إِلَّا عِنْدَنَا خَزَائِنُهُ وَمَا نُنَزِّلُهُ إِلَّا بِقَدَرٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ" </quran>مَا <quran>"مِنْ" </quran>زَائِدَة <quran>"شَيْء إلَّا عِنْدنَا خَزَائِنه" </quran>مَفَاتِيح خَزَائِنه <quran>"وَمَا نُنَزِّلهُ إلَّا بِقَدَرٍ مَعْلُوم" </quran>عَلَى حَسَب الْمَصَالِح</p></td></tr></table></body></html>
