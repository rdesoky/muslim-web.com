<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّا لَنَحْنُ نُحْيِي وَنُمِيتُ وَنَحْنُ الْوَارِثُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّا لَنَحْنُ نُحْيِي وَنُمِيت وَنَحْنُ الْوَارِثُونَ" </quran>الْبَاقُونَ نَرِث جَمِيع الْخَلْق</p></td></tr></table></body></html>
