<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ عَلِمْنَا الْمُسْتَقْدِمِينَ مِنْكُمْ وَلَقَدْ عَلِمْنَا الْمُسْتَأْخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ عَلِمْنَا الْمُسْتَقْدِمِينَ مِنْكُمْ" </quran>أَيْ مَنْ تَقَدَّمَ مِنْ الْخَلْق مِنْ لَدُنْ آدَم <quran>"وَلَقَدْ عَلِمْنَا الْمُسْتَأْخِرِينَ" </quran>الْمُتَأَخِّرِينَ إلَى يَوْم الْقِيَامَة</p></td></tr></table></body></html>
