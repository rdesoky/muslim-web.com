<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ هُوَ يَحْشُرُهُمْ إِنَّهُ حَكِيمٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّ رَبّك هُوَ يَحْشُرهُمْ إنَّهُ حَكِيم" </quran>فِي صُنْعه <quran>"عَلِيم" </quran>بِخَلْقِهِ</p></td></tr></table></body></html>
