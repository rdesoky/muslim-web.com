<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ خَلَقْنَا الْإِنْسَانَ مِنْ صَلْصَالٍ مِنْ حَمَإٍ مَسْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ خَلَقْنَا الْإِنْسَان" </quran>آدَم <quran>"مِنْ صَلْصَال" </quran>طِين يَابِس يُسْمَع لَهُ صَلْصَلَة إذَا نُقِرَ <quran>"مِنْ حَمَإٍ" </quran>طِين أَسْوَد <quran>"مَسْنُون" </quran>مُتَغَيِّر</p></td></tr></table></body></html>
