<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا سَوَّيْته" </quran>أَتْمَمْته <quran>"وَنَفَخْت" </quran>أَجْرَيْت <quran>"فِيهِ مِنْ رُوحِي" </quran>فَصَارَ حَيًّا وَإِضَافَة الرُّوح إلَيْهِ تَشْرِيف لِآدَم <quran>"فَقَعُوا لَهُ سَاجِدِينَ" </quran>سُجُود تَحِيَّة بِالِانْحِنَاءِ</p></td></tr></table></body></html>
