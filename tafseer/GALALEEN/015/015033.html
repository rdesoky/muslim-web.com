<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَمْ أَكُنْ لِأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ صَلْصَالٍ مِنْ حَمَإٍ مَسْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ لَمْ أَكُنْ لِأَسْجُد" </quran>لَا يَنْبَغِي لِي أَنْ أَسْجُد</p></td></tr></table></body></html>
