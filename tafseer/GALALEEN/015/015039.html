<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ بِمَا أَغْوَيْتَنِي لَأُزَيِّنَنَّ لَهُمْ فِي الْأَرْضِ وَلَأُغْوِيَنَّهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ بِمَا أَغْوَيْتنِي" </quran>أَيْ بِإِغْوَائِك لِي وَالْبَاء لِلْقَسَمِ وَجَوَابه <quran>"لَأُزَيِّنَن لَهُمْ فِي الْأَرْض" </quran>الْمَعَاصِي</p></td></tr></table></body></html>
