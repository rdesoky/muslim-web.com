<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ إِلَّا مَنِ اتَّبَعَكَ مِنَ الْغَاوِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَهُو <quran>"إنَّ عِبَادِي" </quran>أَيْ الْمُؤْمِنِينَ <quran>"لَيْسَ لَك عَلَيْهِمْ سُلْطَان" </quran>قُوَّة <quran>"إلَّا" </quran>لَكِنْ <quran>"مَنِ اتَّبَعَك مِنَ الْغَاوِينَ" </quran>الْكَافِرِينَ</p></td></tr></table></body></html>
