<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهَا سَبْعَةُ أَبْوَابٍ لِكُلِّ بَابٍ مِنْهُمْ جُزْءٌ مَقْسُومٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهَا سَبْعَة أَبْوَاب" </quran>أَطْبَاق <quran>"لِكُلِّ بَاب" </quran>مِنْهَا <quran>"مِنْهُمْ جُزْء" </quran>نَصِيب</p></td></tr></table></body></html>
