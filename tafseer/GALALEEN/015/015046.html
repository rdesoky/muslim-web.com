<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ادْخُلُوهَا بِسَلَامٍ آمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>يُقَال لَهُمْ <quran>"اُدْخُلُوهَا بِسَلَامٍ" </quran>أَيْ سَالِمِينَ مِنْ كُلّ مَخُوف أَوْ مَعَ سَلَام أَيْ سَلِّمُوا وَادْخُلُوا <quran>"آمِنِينَ" </quran>مِنْ كُلّ فَزَع</p></td></tr></table></body></html>
