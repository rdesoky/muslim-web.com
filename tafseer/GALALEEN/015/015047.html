<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَزَعْنَا مَا فِي صُدُورِهِمْ مِنْ غِلٍّ إِخْوَانًا عَلَى سُرُرٍ مُتَقَابِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَزَعْنَا مَا فِي صُدُورهمْ مِنْ غِلٍّ" </quran>حِقْد <quran>"إخْوَانًا" </quran>حَال مِنْهُمْ <quran>"عَلَى سُرُر مُتَقَابِلِينَ" </quran>حَال أَيْضًا أَيْ لَا يَنْظُر بَعْضهمْ إلَى قَفَا بَعْض لِدَوَرَانِ الْأَسِرَّة بِهِمْ</p></td></tr></table></body></html>
