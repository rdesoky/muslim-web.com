<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَمَسُّهُمْ فِيهَا نَصَبٌ وَمَا هُمْ مِنْهَا بِمُخْرَجِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَمَسّهُمْ فِيهَا نَصَب" </quran>تَعَب <quran>"وَمَا هُمْ مِنْهَا بِمُخْرَجِينَ" </quran>أَبَدًا</p></td></tr></table></body></html>
