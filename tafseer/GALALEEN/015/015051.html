<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَبِّئْهُمْ عَنْ ضَيْفِ إِبْرَاهِيمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَبِّئْهُمْ عَنْ ضَيْف إبْرَاهِيم" </quran>وَهُمْ الْمَلَائِكَة اثْنَا عَشَر أَوْ عَشْرَة أَوْ ثَلَاثَة مِنْهُمْ جِبْرِيل</p></td></tr></table></body></html>
