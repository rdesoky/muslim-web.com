<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَا تَوْجَلْ إِنَّا نُبَشِّرُكَ بِغُلَامٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَا تَوْجَل" </quran>لَا تَخَفْ <quran>"إنَّا" </quran>رُسُل رَبّك <quran>"نُبَشِّرك بِغُلَامٍ عَلِيم" </quran>ذِي عِلْم كَثِير هُوَ إسْحَاق كَمَا ذَكَرْنَا فِي سُورَة هُود</p></td></tr></table></body></html>
