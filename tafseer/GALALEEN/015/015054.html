<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَبَشَّرْتُمُونِي عَلَى أَنْ مَسَّنِيَ الْكِبَرُ فَبِمَ تُبَشِّرُونَي</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَبَشَّرْتُمُونِي" </quran>بِالْوَلَدِ <quran>"عَلَى أَنْ مَسَّنِيَ الْكِبَر" </quran>حَال أَيْ مَعَ مَسّه إيَّايَ <quran>"فَبِمَ تُبَشِّرُونَ" </quran>فَبِأَيِّ شَيْء اسْتِفْهَام تَعَجُّب</p></td></tr></table></body></html>
