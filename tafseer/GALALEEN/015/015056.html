<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ وَمَنْ يَقْنَطُ مِنْ رَحْمَةِ رَبِّهِ إِلَّا الضَّالُّونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ وَمَنْ" </quran>أَيْ لَا <quran>"يَقْنَط" </quran>بِكَسْرِ النُّون وَفَتْحهَا <quran>"مِنْ رَحْمَة رَبّه إلَّا الضَّالُّونَ" </quran>الْكَافِرُونَ</p></td></tr></table></body></html>
