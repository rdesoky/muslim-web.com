<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَضَيْنَا إِلَيْهِ ذَلِكَ الْأَمْرَ أَنَّ دَابِرَ هَؤُلَاءِ مَقْطُوعٌ مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَضَيْنَا" </quran>أَوْحَيْنَا <quran>"إلَيْهِ ذَلِكَ الْأَمْر" </quran>وَهُوَ <quran>"أَنَّ دَابِر هَؤُلَاءِ مَقْطُوع مُصْبِحِينَ" </quran>حَال أَيْ يَتِمّ اسْتِئْصَالهمْ فِي الصَّبَاح</p></td></tr></table></body></html>
