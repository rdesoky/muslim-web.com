<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَ أَهْلُ الْمَدِينَةِ يَسْتَبْشِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَاءَ أَهْل الْمَدِينَة" </quran>مَدِينَة سدوم وَهُمْ قَوْم لُوط لَمَّا أُخْبِرُوا أَنَّ فِي بَيْت لُوط مُرْدًا حِسَانًا وَهُمْ الْمَلَائِكَة <quran>"يَسْتَبْشِرُونَ" </quran>حَال طَمَعًا فِي فِعْل الْفَاحِشَة بِهِمْ</p></td></tr></table></body></html>
