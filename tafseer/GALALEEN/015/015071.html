<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هَؤُلَاءِ بَنَاتِي إِنْ كُنْتُمْ فَاعِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ هَؤُلَاءِ بَنَاتِي إنْ كُنْتُمْ فَاعِلِينَ" </quran>مَا تُرِيدُونَ مِنْ قَضَاء الشَّهْوَة فَتَزَوَّجُوهُنَّ</p></td></tr></table></body></html>
