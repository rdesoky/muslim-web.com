<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَعَمْرُكَ إِنَّهُمْ لَفِي سَكْرَتِهِمْ يَعْمَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَعَمْرُك" </quran>خِطَاب لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : أَيْ وَحَيَاتك <quran>"إنَّهُمْ لَفِي سَكْرَتهمْ يَعْمَهُونَ" </quran>يَتَرَدَّدُونَ</p></td></tr></table></body></html>
