<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهَا لَبِسَبِيلٍ مُقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهَا" </quran>أَيْ قُرَى قَوْم لُوط <quran>"لَبِسَبِيلٍ مُقِيم" </quran>طَرِيق قُرَيْش إلَى الشَّام لَمْ تَنْدَرِس أَفَلَا يَعْتَبِرُونَ بِهِمْ ؟</p></td></tr></table></body></html>
