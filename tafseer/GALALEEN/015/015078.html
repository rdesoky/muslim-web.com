<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ كَانَ أَصْحَابُ الْأَيْكَةِ لَظَالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ" </quran>مُخَفَّفَة أَيْ إنَّهُ <quran>"كَانَ أَصْحَاب الْأَيْكَة" </quran>هِيَ غَيْضَة شَجَر بِقُرْبِ مَدْيَن وَهُمْ قَوْم شُعَيْب <quran>"لَظَالِمِينَ" </quran>بِتَكْذِيبِهِمْ شُعَيْبًا</p></td></tr></table></body></html>
