<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَانْتَقَمْنَا مِنْهُمْ وَإِنَّهُمَا لَبِإِمَامٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَانْتَقَمْنَا مِنْهُمْ" </quran>بِأَنْ أَهْلَكْنَاهُمْ بِشِدَّةِ الْحَرّ <quran>"وَإِنَّهُمَا" </quran>أَيْ قُرَى قَوْم لُوط وَالْأَيْكَة <quran>"لَبِإِمَامٍ" </quran>طَرِيق <quran>"مُبِين" </quran>وَاضِح أَفَلَا تَعْتَبِرُونَ بِهِمْ يَا أَهْل مَكَّة</p></td></tr></table></body></html>
