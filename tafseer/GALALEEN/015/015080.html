<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ كَذَّبَ أَصْحَابُ الْحِجْرِ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ كَذَّبَ أَصْحَاب الْحِجْر" </quran>وَادٍ بَيْن الْمَدِينَة وَالشَّام وَهُمْ ثَمُود <quran>"الْمُرْسَلِينَ" </quran>بِتَكْذِيبِهِمْ صَالِحًا لِأَنَّهُ تَكْذِيب لِبَاقِي الرُّسُل لِاشْتِرَاكِهِمْ فِي الْمَجِيء بِالتَّوْحِيدِ</p></td></tr></table></body></html>
