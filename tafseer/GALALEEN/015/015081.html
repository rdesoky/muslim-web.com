<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآتَيْنَاهُمْ آيَاتِنَا فَكَانُوا عَنْهَا مُعْرِضِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآتَيْنَاهُمْ آيَاتنَا" </quran>فِي النَّاقَة <quran>"فَكَانُوا عَنْهَا مُعْرِضِينَ" </quran>لَا يَتَفَكَّرُونَ فِيهَا</p></td></tr></table></body></html>
