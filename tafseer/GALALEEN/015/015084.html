<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا أَغْنَى عَنْهُمْ مَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا أَغْنَى" </quran>دَفَعَ <quran>"عَنْهُمْ" </quran>الْعَذَاب <quran>"مَا كَانُوا يَكْسِبُونَ" </quran>مِنْ بِنَاء الْحُصُون وَجَمْع الْأَمْوَال</p></td></tr></table></body></html>
