<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ آتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي وَالْقُرْآنَ الْعَظِيمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ آتَيْنَاك سَبْعًا مِنَ الْمَثَانِي" </quran>قَالَ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ هِيَ الْفَاتِحَة رَوَاهُ الشَّيْخَانِ لِأَنَّهَا تُثَنَّى فِي كُلّ رَكْعَة</p></td></tr></table></body></html>
