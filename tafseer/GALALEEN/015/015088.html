<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَمُدَّنَّ عَيْنَيْكَ إِلَى مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ وَلَا تَحْزَنْ عَلَيْهِمْ وَاخْفِضْ جَنَاحَكَ لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا تَمُدَّنّ عَيْنَيْك إلَى مَا مَتَّعْنَا بِهِ أَزْوَاجًا" </quran>أَصْنَافًا <quran>"مِنْهُمْ وَلَا تَحْزَن عَلَيْهِمْ" </quran>إنْ لَمْ يُؤْمِنُوا <quran>"وَاخْفِضْ جَنَاحك" </quran>أَلِنْ جَانِبك</p></td></tr></table></body></html>
