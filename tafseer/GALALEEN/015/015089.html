<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقُلْ إِنِّي أَنَا النَّذِيرُ الْمُبِينُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقُلْ إنِّي أَنَا النَّذِير" </quran>مِنْ عَذَاب اللَّه أَنْ يَنْزِل عَلَيْكُمْ <quran>"الْمُبِين" </quran>الْبَيِّن الْإِنْذَار</p></td></tr></table></body></html>
