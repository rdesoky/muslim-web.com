<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاصْدَعْ" </quran>يَا مُحَمَّد <quran>"بِمَا تُؤْمَر" </quran>بِهِ أَيْ اجْهَرْ بِهِ وَأَمْضِهِ <quran>"وَأَعْرِضْ عَنِ الْمُشْرِكِينَ" </quran>هَذَا قَبْل الْأَمْر بِالْجِهَادِ</p></td></tr></table></body></html>
