<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَفَيْنَاكَ الْمُسْتَهْزِئِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا كَفَيْنَاك الْمُسْتَهْزِئِينَ" </quran>بِك بِإِهْلَاكِنَا كُلًّا مِنْهُمْ بِآفَةٍ وَهُمْ الْوَلِيد بْن الْمُغِيرَة وَالْعَاصُ بْن وَائِل وَعَدِيّ بْن قَيْس وَالْأَسْوَد بْن الْمُطَّلِب وَالْأَسْوَد بْن عَبْد يَغُوث</p></td></tr></table></body></html>
