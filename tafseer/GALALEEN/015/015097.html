<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ" </quran>لِلتَّحْقِيقِ <quran>"نَعْلَم أَنَّك يَضِيق صَدْرك بِمَا يَقُولُونَ" </quran>مِنْ الِاسْتِهْزَاء وَالتَّكْذِيب</p></td></tr></table></body></html>
