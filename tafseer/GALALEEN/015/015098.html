<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسَبِّحْ" </quran>مُلْتَبِسًا <quran>"بِحَمْدِ رَبّك" </quran>أَيْ قُلْ سُبْحَان اللَّه وَبِحَمْدِهِ <quran>"وَكُنْ مِنَ السَّاجِدِينَ" </quran>الْمُصَلِّينَ</p></td></tr></table></body></html>
