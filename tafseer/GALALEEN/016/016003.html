<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ تَعَالَى عَمَّا يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَلَقَ السَّمَاوَات وَالْأَرْض بِالْحَقِّ" </quran>أَيْ مُحِقًّا <quran>"تَعَالَى عَمَّا يُشْرِكُونَ" </quran>بِهِ مِنْ الْأَصْنَام</p></td></tr></table></body></html>
