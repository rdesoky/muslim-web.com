<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ الْإِنْسَانَ مِنْ نُطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَلَقَ الْإِنْسَان مِنْ نُطْفَة" </quran>مَنِيّ إلَى أَنْ صَيَّرَهُ قَوِيًّا شَدِيدًا <quran>"فَإِذَا هُوَ خَصِيم" </quran>شَدِيد الْخُصُومَة <quran>"مُبِين" </quran>بَيَّنَهَا فِي نَفْي الْبَعْث قَائِلًا <quran>"مَنْ يُحْيِي الْعِظَام وَهِيَ رَمِيم"</quran></p></td></tr></table></body></html>
