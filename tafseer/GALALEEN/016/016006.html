<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَكُمْ فِيهَا جَمَال" </quran>زِينَة <quran>"حِين تُرِيحُونَ" </quran>تَرُدُّونَهَا إلَى مَرَاحهَا بِالْعَشِيِّ <quran>"وَحِين تَسْرَحُونَ" </quran>تُخْرِجُونَهَا إلَى الْمَرْعَى بِالْغَدَاةِ</p></td></tr></table></body></html>
