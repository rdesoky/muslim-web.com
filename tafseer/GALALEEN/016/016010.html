<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ الَّذِي أَنْزَلَ مِنَ السَّمَاءِ مَاءً لَكُمْ مِنْهُ شَرَابٌ وَمِنْهُ شَجَرٌ فِيهِ تُسِيمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُوَ الَّذِي أَنْزَلَ مِنْ السَّمَاء مَاء لَكُمْ مِنْهُ شَرَاب" </quran>تَشْرَبُونَهُ <quran>"وَمِنْهُ شَجَر" </quran>يَنْبُت بِسَبَبِهِ <quran>"فِيهِ تُسِيمُونَ" </quran>تَرْعَوْنَ دَوَابّكُمْ</p></td></tr></table></body></html>
