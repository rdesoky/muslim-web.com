<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَمَنْ يَخْلُقُ كَمَنْ لَا يَخْلُقُ أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَمَنْ يَخْلُق" </quran>وَهُوَ اللَّه <quran>"كَمَنْ لَا يَخْلُق" </quran>وَهُوَ الْأَصْنَام حَيْثُ تُشْرِكُونَهَا مَعَهُ فِي الْعِبَادَة ؟ لَا <quran>"أَفَلَا تَذَكَّرُونَ" </quran>هَذَا فَتُؤْمِنُونَ</p></td></tr></table></body></html>
