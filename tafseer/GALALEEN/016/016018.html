<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ تَعُدُّوا نِعْمَةَ اللَّه لَا تُحْصُوهَا" </quran>تَضْبِطُوهَا فَضْلًا أَنْ تُطِيقُوا شُكْرهَا <quran>"إنَّ اللَّه لَغَفُور رَحِيم" </quran>حَيْثُ يُنْعِم عَلَيْكُمْ مَعَ تَقْصِيركُمْ وَعِصْيَانكُمْ</p></td></tr></table></body></html>
