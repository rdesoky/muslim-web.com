<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يَدْعُونَ مِنْ دُونِ اللَّهِ لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ تَدْعُونَ" </quran>بِالتَّاءِ وَالْيَاء تَعْبُدُونَ <quran>"مِنْ دُون اللَّه" </quran>وَهُمْ الْأَصْنَام <quran>"لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ" </quran>يُصَوَّرُونَ مِنْ الْحِجَارَة وَغَيْرهَا</p></td></tr></table></body></html>
