<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قِيلَ لَهُمْ مَاذَا أَنْزَلَ رَبُّكُمْ قَالُوا أَسَاطِيرُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَنَزَلَ فِي النَّضْر بْن الْحَارِث <quran>"وَإِذَا قِيلَ لَهُمْ مَا" </quran>اسْتِفْهَامِيَّة <quran>"ذَا" </quran>مَوْصُولَة <quran>"أَنْزَلَ رَبّكُمْ" </quran>عَلَى مُحَمَّد <quran>"قَالُوا" </quran>هُوَ <quran>"أَسَاطِير" </quran>أَكَاذِيب <quran>"الْأَوَّلِينَ" </quran>إضْلَالًا لِلنَّاسِ</p></td></tr></table></body></html>
