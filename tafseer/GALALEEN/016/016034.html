<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَصَابَهُمْ سَيِّئَاتُ مَا عَمِلُوا وَحَاقَ بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَصَابَهُمْ سَيِّئَات مَا عَمِلُوا" </quran>أَيْ جَزَاؤُهَا <quran>"وَحَاقَ" </quran>نَزَلَ <quran>"بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ" </quran>أَيْ الْعَذَاب</p></td></tr></table></body></html>
