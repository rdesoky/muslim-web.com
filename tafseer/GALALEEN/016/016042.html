<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ صَبَرُوا وَعَلَى رَبِّهِمْ يَتَوَكَّلُونَ</font></td></tr><tr><td align=right dir=rtl><p>هُمْ <quran>"الَّذِينَ صَبَرُوا" </quran>عَلَى أَذَى الْمُشْرِكِينَ وَالْهِجْرَة لِإِظْهَارِ الدِّين <quran>"وَعَلَى رَبّهمْ يَتَوَكَّلُونَ" </quran>فَيَرْزُقهُمْ مِنْ حَيْثُ لَا يَحْتَسِبُونَ</p></td></tr></table></body></html>
