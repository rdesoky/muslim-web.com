<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ يَأْخُذَهُمْ فِي تَقَلُّبِهِمْ فَمَا هُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ يَأْخُذهُمْ فِي تَقَلُّبهمْ" </quran>فِي أَسْفَارهمْ لِلتِّجَارَةِ <quran>"فَمَا هُمْ بِمُعْجِزِينَ" </quran>بِفَائِتِي الْعَذَاب</p></td></tr></table></body></html>
