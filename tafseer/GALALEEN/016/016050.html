<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَخَافُونَ رَبَّهُمْ مِنْ فَوْقِهِمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَخَافُونَ" </quran>أَيْ الْمَلَائِكَة حَال مِنْ ضَمِير يَسْتَكْبِرُونَ <quran>"رَبّهمْ مِنْ فَوْقهمْ" </quran>حَال مِنْ هُمْ أَيْ عَالِيًا . عَلَيْهِمْ بِالْقَهْرِ <quran>"وَيَفْعَلُونَ مَا يُؤْمَرُونَ" </quran>بِهِ</p></td></tr></table></body></html>
