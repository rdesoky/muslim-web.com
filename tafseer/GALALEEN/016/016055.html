<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ فَتَمَتَّعُوا فَسَوْفَ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ" </quran>مِنْ النِّعْمَة <quran>"فَتَمَتَّعُوا" </quran>بِاجْتِمَاعِكُمْ عَلَى عِبَادَة الْأَصْنَام أَمْر تَهْدِيد <quran>"فَسَوْفَ تَعْلَمُونَ" </quran>عَاقِبَة ذَلِكَ</p></td></tr></table></body></html>
