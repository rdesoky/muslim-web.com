<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ إِنَّ اللَّهَ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَال" </quran>لَا تَجْعَلُوا لِلَّهِ أَشْبَاهًا تُشْرِكُونَهُمْ بِهِ <quran>"إنَّ اللَّه يَعْلَم" </quran>أَنْ لَا مِثْل لَهُ <quran>"وَأَنْتُمْ لَا تَعْلَمُونَ" </quran>ذَلِكَ</p></td></tr></table></body></html>
