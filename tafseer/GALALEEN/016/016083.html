<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْرِفُونَ نِعْمَةَ اللَّهِ ثُمَّ يُنْكِرُونَهَا وَأَكْثَرُهُمُ الْكَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَعْرِفُونَ نِعْمَة اللَّه" </quran>أَيْ يُقِرُّونَ بِأَنَّهَا مِنْ عِنْده <quran>"ثُمَّ يُنْكِرُونَهَا" </quran>بِإِشْرَاكِهِمْ</p></td></tr></table></body></html>
