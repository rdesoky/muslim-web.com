<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَى الَّذِينَ ظَلَمُوا الْعَذَابَ فَلَا يُخَفَّفُ عَنْهُمْ وَلَا هُمْ يُنْظَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا رَأَى الَّذِينَ ظَلَمُوا" </quran>كَفَرُوا <quran>"الْعَذَاب" </quran>النَّار <quran>"فَلَا يُخَفَّف عَنْهُمْ" </quran>الْعَذَاب <quran>"وَلَا هُمْ يُنْظَرُونَ" </quran>يُمْهَلُونَ عَنْهُ إذَا رَأَوْهُ</p></td></tr></table></body></html>
