<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَلْقَوْا إِلَى اللَّهِ يَوْمَئِذٍ السَّلَمَ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَلْقَوْا إلَى اللَّه يَوْمَئِذٍ السَّلَم" </quran>أَيْ اسْتَسْلَمُوا لِحُكْمِهِ <quran>"وَضَلَّ" </quran>غَابَ <quran>"عَنْهُمْ مَا كَانُوا يَفْتَرُونَ" </quran>مِنْ أَنَّ آلِهَتهمْ تَشْفَع لَهُمْ</p></td></tr></table></body></html>
