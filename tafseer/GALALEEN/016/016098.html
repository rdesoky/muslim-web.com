<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا قَرَأْت الْقُرْآن" </quran>أَيْ أَرَدْت قِرَاءَته <quran>"فَاسْتَعِذْ بِاَللَّهِ مِنْ الشَّيْطَان الرَّجِيم" </quran>أَيْ قُلْ : أَعُوذ بِاَللَّهِ مِنْ الشَّيْطَان الرَّجِيم</p></td></tr></table></body></html>
