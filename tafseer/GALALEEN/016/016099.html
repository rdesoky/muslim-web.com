<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ لَيْسَ لَهُ سُلْطَانٌ عَلَى الَّذِينَ آمَنُوا وَعَلَى رَبِّهِمْ يَتَوَكَّلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُ لَيْسَ لَهُ سُلْطَان" </quran>تَسَلُّط</p></td></tr></table></body></html>
