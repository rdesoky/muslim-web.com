<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا سُلْطَانُهُ عَلَى الَّذِينَ يَتَوَلَّوْنَهُ وَالَّذِينَ هُمْ بِهِ مُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا سُلْطَانه عَلَى الَّذِينَ يَتَوَلَّوْنَهُ" </quran>بِطَاعَتِهِ <quran>"وَاَلَّذِينَ هُمْ بِهِ" </quran>أَيْ اللَّه <quran>"مُشْرِكُونَ"</quran></p></td></tr></table></body></html>
