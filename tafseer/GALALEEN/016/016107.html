<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ بِأَنَّهُمُ اسْتَحَبُّوا الْحَيَاةَ الدُّنْيَا عَلَى الْآخِرَةِ وَأَنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>الْوَعِيد لَهُمْ <quran>"بِأَنَّهُمْ اسْتَحَبُّوا الْحَيَاة الدُّنْيَا" </quran>اخْتَارُوهَا</p></td></tr></table></body></html>
