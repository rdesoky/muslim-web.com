<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ طَبَعَ اللَّهُ عَلَى قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصَارِهِمْ وَأُولَئِكَ هُمُ الْغَافِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ الَّذِينَ طَبَعَ اللَّه عَلَى قُلُوبهمْ وَسَمْعهمْ وَأَبْصَارهمْ وَأُولَئِكَ هُمْ الْغَافِلُونَ" </quran>عَمَّا يُرَاد بِهِمْ</p></td></tr></table></body></html>
