<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ جَاءَهُمْ رَسُولٌ مِنْهُمْ فَكَذَّبُوهُ فَأَخَذَهُمُ الْعَذَابُ وَهُمْ ظَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ جَاءَهُمْ رَسُول مِنْهُمْ" </quran>مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"فَكَذَّبُوهُ فَأَخَذَهُمْ الْعَذَاب" </quran>الْجُوع وَالْخَوْف</p></td></tr></table></body></html>
