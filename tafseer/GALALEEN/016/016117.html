<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَتَاعٌ قَلِيلٌ وَلَهُمْ عَذَابٌ أَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>لَهُمْ <quran>"مَتَاع قَلِيل" </quran>فِي الدُّنْيَا <quran>"وَلَهُمْ" </quran>فِي الْآخِرَة <quran>"عَذَاب أَلِيم" </quran>مُؤْلِم</p></td></tr></table></body></html>
