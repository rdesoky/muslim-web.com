<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً قَانِتًا لِلَّهِ حَنِيفًا وَلَمْ يَكُ مِنَ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ إبْرَاهِيم كَانَ أُمَّة" </quran>إمَامًا قُدْوَة جَامِعًا لِخِصَالِ الْخَيْر <quran>"قَانِتًا" </quran>مُطِيعًا <quran>"لِلَّهِ حَنِيفًا" </quran>مَائِلًا إلَى الدِّين الْقَيِّم</p></td></tr></table></body></html>
