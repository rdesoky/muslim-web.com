<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>شَاكِرًا لِأَنْعُمِهِ اجْتَبَاهُ وَهَدَاهُ إِلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"شَاكِرًا لِأَنْعُمِهِ اجْتَبَاهُ" </quran>اصْطَفَاهُ</p></td></tr></table></body></html>
