<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآتَيْنَاهُ فِي الدُّنْيَا حَسَنَةً وَإِنَّهُ فِي الْآخِرَةِ لَمِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآتَيْنَاهُ" </quran>فِيهِ الْتِفَات عَنْ الْغَيْبَة <quran>"فِي الدُّنْيَا حَسَنَة" </quran>هِيَ الثَّنَاء الْحَسَن فِي كُلّ أَهْل الْأَدْيَان <quran>"وَإِنَّهُ فِي الْآخِرَة لَمِنْ الصَّالِحِينَ" </quran>الَّذِينَ لَهُمْ الدَّرَجَات الْعُلَى</p></td></tr></table></body></html>
