<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذُرِّيَّةَ مَنْ حَمَلْنَا مَعَ نُوحٍ إِنَّهُ كَانَ عَبْدًا شَكُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذُرِّيَّة مَنْ حَمَلْنَا مَعَ نُوح" </quran>فِي السَّفِينَة <quran>"شَكُورًا" </quran>كَثِير الشُّكْر لَنَا حَامِدًا فِي جَمِيع أَحْوَاله</p></td></tr></table></body></html>
