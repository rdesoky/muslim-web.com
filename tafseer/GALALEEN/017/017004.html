<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَضَيْنَا إِلَى بَنِي إِسْرَائِيلَ فِي الْكِتَابِ لَتُفْسِدُنَّ فِي الْأَرْضِ مَرَّتَيْنِ وَلَتَعْلُنَّ عُلُوًّا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَضَيْنَا" </quran>أَوْحَيْنَا <quran>"فِي الْكِتَاب" </quran>التَّوْرَاة <quran>"لَتُفْسِدُنَّ فِي الْأَرْض" </quran>أَرْض الشَّام بِالْمَعَاصِي <quran>"وَلَتَعْلُنَّ عُلُوًّا كَبِيرًا" </quran>تَبْغُونَ بَغْيًا عَظِيمًا</p></td></tr></table></body></html>
