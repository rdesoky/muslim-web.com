<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ رَدَدْنَا لَكُمُ الْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَاكُمْ بِأَمْوَالٍ وَبَنِينَ وَجَعَلْنَاكُمْ أَكْثَرَ نَفِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"الْكَرَّة" </quran>الدَّوْلَة وَالْغَلَبَة <quran>"عَلَيْهِمْ" </quran>بَعْد مِائَة سَنَة بِقَتْلِ جَالُوت <quran>"نَفِيرًا" </quran>عَشِيرَة</p></td></tr></table></body></html>
