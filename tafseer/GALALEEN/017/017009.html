<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِلَّتِي" </quran>أَيْ لِلطَّرِيقَةِ الَّتِي <quran>"هِيَ أَقْوَم" </quran>أَعْدَل وَأَصْوَب</p></td></tr></table></body></html>
