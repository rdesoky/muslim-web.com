<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>يُخْبِر <quran>"أَنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ أَعْتَدْنَا" </quran>أَعْدَدْنَا <quran>"لَهُمْ عَذَابًا أَلِيمًا" </quran>مُؤْلِمًا هُوَ النَّار</p></td></tr></table></body></html>
