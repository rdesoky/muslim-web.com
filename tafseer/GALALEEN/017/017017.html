<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَمْ أَهْلَكْنَا مِنَ الْقُرُونِ مِنْ بَعْدِ نُوحٍ وَكَفَى بِرَبِّكَ بِذُنُوبِ عِبَادِهِ خَبِيرًا بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَمْ" </quran>أَيْ كَثِيرًا <quran>"أَهْلَكْنَا مِنْ الْقُرُون" </quran>الْأُمَم <quran>" خَبِيرًا بَصِيرًا" </quran>عَالِمًا بِبَوَاطِنِهَا وَظَوَاهِرهَا وَبِهِ يَتَعَلَّق بِذُنُوبٍ</p></td></tr></table></body></html>
