<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَى لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ أَرَادَ الْآخِرَة وَسَعَى لَهَا سَعْيهَا" </quran>عَمِلَ عَمَلهَا اللَّائِق بِهَا <quran>"وَهُوَ مُؤْمِن" </quran>حَال <quran>"مَشْكُورًا" </quran>عِنْد اللَّه أَيْ مَقْبُولًا مُثَابًا عَلَيْهِ</p></td></tr></table></body></html>
