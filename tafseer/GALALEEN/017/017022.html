<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَجْعَلْ مَعَ اللَّهِ إِلَهًا آخَرَ فَتَقْعُدَ مَذْمُومًا مَخْذُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَخْذُولًا" </quran>لَا نَاصِر لَك</p></td></tr></table></body></html>
