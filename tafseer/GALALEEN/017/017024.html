<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاخْفِضْ لَهُمَا جَنَاح الذُّلّ" </quran>أَلِنْ لَهُمَا جَانِبك الذَّلِيل <quran>"مِنْ الرَّحْمَة" </quran>أَيْ لِرِقَّتِك عَلَيْهِمَا <quran>"كَمَا" </quran>كَمَا رَحِمَانِي حِين <quran>"رَبَّيَانِي صَغِيرًا"</quran></p></td></tr></table></body></html>
