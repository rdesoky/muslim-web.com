<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الْمُبَذِّرِينَ كَانُوا إخْوَان الشَّيَاطِين" </quran>أَيْ عَلَى طَرِيقَتهمْ <quran>"كَفُورًا" </quran>شَدِيد الْكُفْر لِنِعَمِهِ فَكَذَلِكَ أَخُوهُ الْمُبَذِّر</p></td></tr></table></body></html>
