<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ نَحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ إِنَّ قَتْلَهُمْ كَانَ خِطْئًا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَقْتُلُوا أَوْلَادكُمْ" </quran>بِالْوَأْدِ <quran>"خَشْيَة" </quran>مَخَافَة <quran>"إمْلَاق" </quran>فَقْر <quran>"خِطْئًا" </quran>إثْمًا <quran>"كَبِيرًا" </quran>عَظِيمًا</p></td></tr></table></body></html>
