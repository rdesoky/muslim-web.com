<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّى يَبْلُغَ أَشُدَّهُ وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَوْفُوا بِالْعَهْدِ" </quran>إذَا عَاهَدْتُمْ اللَّه أَوْ النَّاس <quran>"مَسْئُولًا" </quran>مَسْئُولًا عَنْهُ</p></td></tr></table></body></html>
