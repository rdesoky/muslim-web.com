<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَوْفُوا الْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ ذَلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَوْفُوا الْكَيْل" </quran>أَتِمُّوهُ <quran>"بِالْقِسْطَاسِ الْمُسْتَقِيم" </quran>الْمِيزَان السَّوِيّ <quran>"ذَلِكَ خَيْر وَأَحْسَن تَأْوِيلًا" </quran>مَآلًا</p></td></tr></table></body></html>
