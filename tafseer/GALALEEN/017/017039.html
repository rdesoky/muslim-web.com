<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ مِمَّا أَوْحَى إِلَيْكَ رَبُّكَ مِنَ الْحِكْمَةِ وَلَا تَجْعَلْ مَعَ اللَّهِ إِلَهًا آخَرَ فَتُلْقَى فِي جَهَنَّمَ مَلُومًا مَدْحُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ مِمَّا أَوْحَى إلَيْك" </quran>يَا مُحَمَّد <quran>"الْحِكْمَة" </quran>الْمَوْعِظَة <quran>"مَدْحُورًا" </quran>مَطْرُودًا عَنْ رَحْمَة اللَّه</p></td></tr></table></body></html>
