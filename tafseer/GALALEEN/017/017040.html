<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَأَصْفَاكُمْ رَبُّكُمْ بِالْبَنِينَ وَاتَّخَذَ مِنَ الْمَلَائِكَةِ إِنَاثًا إِنَّكُمْ لَتَقُولُونَ قَوْلًا عَظِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَأَصْفَاكُمْ" </quran>أَخْلَصَكُمْ يَا أَهْل مَكَّة <quran>"إنَاثًا" </quran>بَنَات لِنَفْسِهِ بِزَعْمِكُمْ <quran>"إنَّكُمْ لَتَقُولُونَ" </quran>لَتَقُولُونَ بِذَلِكَ</p></td></tr></table></body></html>
