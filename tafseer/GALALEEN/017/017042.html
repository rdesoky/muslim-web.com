<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لَوْ كَانَ مَعَهُ آلِهَةٌ كَمَا يَقُولُونَ إِذًا لَابْتَغَوْا إِلَى ذِي الْعَرْشِ سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"لَوْ كَانَ مَعَهُ" </quran>أَيْ اللَّه <quran>"لَابْتَغَوْا" </quran>طَلَبُوا <quran>"إلَى ذِي الْعَرْش" </quran>أَيْ اللَّه <quran>"سَبِيلًا" </quran>لِيُقَاتِلُوهُ</p></td></tr></table></body></html>
