<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ فَضَلُّوا فَلَا يَسْتَطِيعُونَ سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُنْظُرْ كَيْفَ ضَرَبُوا لَك الْأَمْثَال" </quran>بِالْمَسْحُورِ وَالْكَاهِن وَالشَّاعِر <quran>"فَضَلُّوا" </quran>بِذَلِكَ عَنْ الْهُدَى <quran>"فَلَا يَسْتَطِيعُونَ سَبِيلًا" </quran>طَرِيقًا إلَيْهِ</p></td></tr></table></body></html>
