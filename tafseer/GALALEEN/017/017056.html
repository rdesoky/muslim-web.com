<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلِ ادْعُوا الَّذِينَ زَعَمْتُمْ مِنْ دُونِهِ فَلَا يَمْلِكُونَ كَشْفَ الضُّرِّ عَنْكُمْ وَلَا تَحْوِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"اُدْعُوا الَّذِينَ زَعَمْتُمْ" </quran>أَنَّهُمْ آلِهَة <quran>"مِنْ دُونه" </quran>كَالْمَلَائِكَةِ وَعِيسَى وَعُزَيْر <quran>"تَحْوِيلًا" </quran>لَهُ إلَى غَيْركُمْ</p></td></tr></table></body></html>
