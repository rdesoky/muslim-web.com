<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ قَالَ أَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>اذْكُر <quran>"اُسْجُدُوا لِآدَم" </quran>سُجُود تَحِيَّة بِالِانْحِنَاءِ <quran>"طِينًا" </quran>نُصِبَ بِنَزْعِ الْخَافِض أَيْ مِنْ طِين</p></td></tr></table></body></html>
