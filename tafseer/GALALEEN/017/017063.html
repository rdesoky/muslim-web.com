<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ اذْهَبْ فَمَنْ تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَاؤُكُمْ جَزَاءً مَوْفُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى لَهُ <quran>"اذْهَبْ" </quran>مُنْظَرًا إلَى وَقْت النَّفْخَة الْأُولَى <quran>"جَزَاؤُكُمْ" </quran>أَنْتَ وَهُمْ <quran>"جَزَاء مَوْفُورًا" </quran>وَافِرًا كَامِلًا</p></td></tr></table></body></html>
