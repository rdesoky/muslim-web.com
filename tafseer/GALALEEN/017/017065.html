<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ وَكَفَى بِرَبِّكَ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ عِبَادِي" </quran>الْمُؤْمِنِينَ <quran>"سُلْطَان" </quran>تَسَلُّط وَقُوَّة <quran>"وَكَفَى بِرَبِّك وَكِيلًا" </quran>حَافِظًا لَهُمْ مِنْك</p></td></tr></table></body></html>
