<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَأَمِنْتُمْ أَنْ يَخْسِفَ بِكُمْ جَانِبَ الْبَرِّ أَوْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا ثُمَّ لَا تَجِدُوا لَكُمْ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"جَانِب الْبَرّ" </quran>أَيْ الْأَرْض كَقَارُونَ <quran>"أَوْ يُرْسِل عَلَيْكُمْ حَاصِبًا" </quran>أَيْ يَرْمِيكُمْ بِالْحَصْبَاءِ كَقَوْمِ لُوط <quran>"وَكِيلًا" </quran>حَافِظًا مِنْهُ</p></td></tr></table></body></html>
