<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ كَادُوا لَيَفْتِنُونَكَ عَنِ الَّذِي أَوْحَيْنَا إِلَيْكَ لِتَفْتَرِيَ عَلَيْنَا غَيْرَهُ وَإِذًا لَاتَّخَذُوكَ خَلِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ" </quran>مُخَفَّفَة <quran>"كَادُوا" </quran>قَارَبُوا <quran>"لَيَفْتِنُونَك" </quran>لَيَسْتَنْزِلُونَك <quran>"وَإِذًا" </quran>لَوْ فَعَلْت ذَلِكَ</p></td></tr></table></body></html>
