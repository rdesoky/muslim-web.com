<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنُنَزِّل" </quran>لِلْبَيَانِ <quran>"شِفَاء" </quran>مِنْ الضَّلَالَة <quran>"وَرَحْمَة لِلْمُؤْمِنِينَ" </quran>بِهِ <quran>"وَلَا يَزِيد الظَّالِمِينَ" </quran>الْكَافِرِينَ <quran>"إلَّا خَسَارًا" </quran>لِكُفْرِهِمْ بِهِ</p></td></tr></table></body></html>
