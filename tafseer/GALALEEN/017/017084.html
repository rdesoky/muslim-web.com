<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ كُلٌّ يَعْمَلُ عَلَى شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَى سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ كُلّ" </quran>مِنَّا وَمِنْكُمْ <quran>"يَعْمَل عَلَى شَاكِلَته" </quran>طَرِيقَته <quran>"أَهْدَى سَبِيلًا" </quran>طَرِيقًا فَيُثِيبهُ</p></td></tr></table></body></html>
