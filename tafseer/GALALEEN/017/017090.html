<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا لَنْ نُؤْمِنَ لَكَ حَتَّى تَفْجُرَ لَنَا مِنَ الْأَرْضِ يَنْبُوعًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>عَطْف عَلَى أَبَى <quran>"يَنْبُوعًا" </quran>عَيْنًا يَنْبُع مِنْهَا الْمَاء</p></td></tr></table></body></html>
