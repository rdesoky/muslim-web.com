<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ تَكُونَ لَكَ جَنَّةٌ مِنْ نَخِيلٍ وَعِنَبٍ فَتُفَجِّرَ الْأَنْهَارَ خِلَالَهَا تَفْجِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"جَنَّة" </quran>بُسْتَان <quran>"خِلَالهَا" </quran>وَسَطهَا</p></td></tr></table></body></html>
