<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ تُسْقِطَ السَّمَاءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِيَ بِاللَّهِ وَالْمَلَائِكَةِ قَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"كِسَفًا" </quran>قِطَعًا <quran>"قَبِيلًا" </quran>مُقَابَلَة وَعِيَانًا فَنَرَاهُمْ</p></td></tr></table></body></html>
