<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا مَنَعَ النَّاسَ أَنْ يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَى إِلَّا أَنْ قَالُوا أَبَعَثَ اللَّهُ بَشَرًا رَسُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا أَنْ قَالُوا" </quran>أَيْ قَوْلهمْ مُنْكِرِينَ <quran>"أَبَعَثَ اللَّه بَشَرًا رَسُولًا" </quran>وَلَمْ يَبْعَث مَلَكًا</p></td></tr></table></body></html>
