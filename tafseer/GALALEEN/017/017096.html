<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ كَفَى بِاللَّهِ شَهِيدًا بَيْنِي وَبَيْنَكُمْ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"شَهِيدًا بَيْنِي وَبَيْنكُمْ" </quran>عَلَى صِدْقِي <quran>"خَبِيرًا بَصِيرًا" </quran>عَالِمًا بِبَوَاطِنِهِمْ وَظَوَاهِرهمْ</p></td></tr></table></body></html>
