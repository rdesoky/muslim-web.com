<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرَادَ أَنْ يَسْتَفِزَّهُمْ مِنَ الْأَرْضِ فَأَغْرَقْنَاهُ وَمَنْ مَعَهُ جَمِيعًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَرَادَ" </quran>فِرْعَوْن <quran>"أَنْ يَسْتَفِزّهُمْ" </quran>يُخْرِج مُوسَى وَقَوْمه <quran>"مِنْ الْأَرْض" </quran>أَرْض مِصْر</p></td></tr></table></body></html>
