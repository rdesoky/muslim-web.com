<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرَائِيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَعْد الْآخِرَة" </quran>أَيْ السَّاعَة <quran>"جِئْنَا بِكُمْ لَفِيفًا" </quran>جَمِيعًا أَنْتُمْ وَهُمْ</p></td></tr></table></body></html>
