<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ آمِنُوا بِهِ أَوْ لَا تُؤْمِنُوا إِنَّ الَّذِينَ أُوتُوا الْعِلْمَ مِنْ قَبْلِهِ إِذَا يُتْلَى عَلَيْهِمْ يَخِرُّونَ لِلْأَذْقَانِ سُجَّدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لِكُفَّارِ مَكَّة <quran>"آمِنُوا بِهِ أَوْ لَا تُؤْمِنُوا" </quran>تَهْدِيد لَهُمْ <quran>"مِنْ قَبْله" </quran>قَبْل نُزُوله وَهُمْ مُؤْمِنُو أَهْل الْكِتَاب</p></td></tr></table></body></html>
