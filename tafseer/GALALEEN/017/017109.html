<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ" </quran>عَطْف بِزِيَادَةِ صِفَة <quran>"وَيَزِيدهُمْ" </quran>الْقُرْآن <quran>"خُشُوعًا" </quran>تَوَاضُعًا لِلَّهِ</p></td></tr></table></body></html>
