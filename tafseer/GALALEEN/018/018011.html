<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَضَرَبْنَا عَلَى آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَضَرَبْنَا عَلَى آذَانهمْ" </quran>أَيْ أَنَمْنَاهُمْ <quran>"فِي الْكَهْف سِنِينَ عَدَدًا" </quran>مَعْدُودَة</p></td></tr></table></body></html>
