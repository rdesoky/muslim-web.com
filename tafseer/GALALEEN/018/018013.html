<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُمْ بِالْحَقِّ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى</font></td></tr><tr><td align=right dir=rtl><p><quran>"نَحْنُ نَقُصّ" </quran>نَقْرَأ <quran>"عَلَيْك نَبَأَهُمْ بِالْحَقِّ" </quran>بِالصِّدْقِ</p></td></tr></table></body></html>
