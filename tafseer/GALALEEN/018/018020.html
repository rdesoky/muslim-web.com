<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ إِنْ يَظْهَرُوا عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِي مِلَّتِهِمْ وَلَنْ تُفْلِحُوا إِذًا أَبَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُمْ إنْ يَظْهَرُوا عَلَيْكُمْ يَرْجُمُوكُمْ" </quran>يَقْتُلُوكُمْ بِالرَّجْمِ <quran>"أَوْ يُعِيدُوكُمْ فِي مِلَّتهمْ وَلَنْ تُفْلِحُوا إذًا" </quran>أَيْ إنْ عُدْتُمْ فِي مِلَّتهمْ</p></td></tr></table></body></html>
