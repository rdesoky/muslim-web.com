<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَلِكَ غَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَقُولَن لِشَيْءٍ" </quran>أَيْ لِأَجْلِ شَيْء <quran>"إنِّي فَاعِل ذَلِكَ غَدًا" </quran>أَيْ فِيمَا يُسْتَقْبَل مِنْ الزَّمَان</p></td></tr></table></body></html>
