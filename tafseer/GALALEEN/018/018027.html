<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتْلُ مَا أُوحِيَ إِلَيْكَ مِنْ كِتَابِ رَبِّكَ لَا مُبَدِّلَ لِكَلِمَاتِهِ وَلَنْ تَجِدَ مِنْ دُونِهِ مُلْتَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاتْلُ مَا أُوحِيَ إلَيْك مِنْ كِتَاب رَبّك لَا مُبَدِّل لِكَلِمَاتِهِ وَلَنْ تَجِد مِنْ دُونه مُلْتَحَدًا" </quran>مَلْجَأ</p></td></tr></table></body></html>
