<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِنْ رُدِدْتُ إِلَى رَبِّي لَأَجِدَنَّ خَيْرًا مِنْهَا مُنْقَلَبًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَظُنّ السَّاعَة قَائِمَة وَلَئِنْ رُدِدْت إلَى رَبِّي" </quran>فِي الْآخِرَة عَلَى زَعْمك <quran>"لَأَجِدَن خَيْرًا مِنْهَا مُنْقَلَبًا" </quran>مَرْجِعًا</p></td></tr></table></body></html>
