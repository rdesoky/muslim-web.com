<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَكِنَّا هُوَ اللَّهُ رَبِّي وَلَا أُشْرِكُ بِرَبِّي أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَكِنَّا" </quran>أَصْله لَكِنْ أَنَا نُقِلَتْ حَرَكَة الْهَمْزَة إلَى النُّون أَوْ حُذِفَتْ الْهَمْزَة ثُمَّ أُدْغِمَتْ النُّون فِي مِثْلهَا <quran>"هُوَ" </quran>ضَمِير الشَّأْن تُفَسِّرهُ الْجُمْلَة بَعْده وَالْمَعْنَى أَنَا أَقُول</p></td></tr></table></body></html>
