<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمْ تَكُنْ لَهُ فِئَةٌ يَنْصُرُونَهُ مِنْ دُونِ اللَّهِ وَمَا كَانَ مُنْتَصِرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَمْ تَكُنْ" </quran>بِالتَّاءِ وَالْيَاء <quran>"لَهُ فِئَة" </quran>جَمَاعَة <quran>"يَنْصُرُونَهُ مِنْ دُون اللَّه" </quran>عِنْد هَلَاكهَا <quran>"وَمَا كَانَ مُنْتَصِرًا" </quran>عِنْد هَلَاكهَا بِنَفْسِهِ</p></td></tr></table></body></html>
