<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ ذَلِكَ مَا كُنَّا نَبْغِ فَارْتَدَّا عَلَى آثَارِهِمَا قَصَصًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"ذَلِكَ" </quran>أَيْ فَقَدْنَا الْحُوت <quran>"مَا" </quran>أَيْ الَّذِي <quran>"كُنَّا نَبْغِ" </quran>نَطْلُبهُ فَإِنَّهُ عَلَامَة لَنَا عَلَى وُجُود مَنْ نَطْلُبهُ <quran>"فَارْتَدَّا" </quran>رَجَعَا <quran>"عَلَى آثَارهمَا" </quran>يَقُصَّانِهَا <quran>"قَصَصًا" </quran>فَأَتَيَا الصَّخْرَة</p></td></tr></table></body></html>
