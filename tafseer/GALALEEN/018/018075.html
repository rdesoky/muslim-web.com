<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَلَمْ أَقُلْ لَكَ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَلَمْ أَقُلْ لَك إنَّك لَنْ تَسْتَطِيع مَعِي صَبْرًا" </quran>زَادَ لَك عَلَى مَا قَبْله لِعَدَمِ الْعُذْر هُنَا</p></td></tr></table></body></html>
