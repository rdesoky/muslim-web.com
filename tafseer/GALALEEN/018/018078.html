<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هَذَا فِرَاقُ بَيْنِي وَبَيْنِكَ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِعْ عَلَيْهِ صَبْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>لَهُ الْخَضِر <quran>"هَذَا فِرَاق" </quran>أَيْ وَقْت فِرَاق <quran>"بَيْنِي وَبَيْنك" </quran>فِيهِ إضَافَة بَيْن إلَى غَيْر مُتَعَدِّد سَوَّغَهَا تَكْرِيره بِالْعَطْفِ بِالْوَاوِ <quran>"سَأُنَبِّئُك" </quran>قَبْل فِرَاقِي لَك</p></td></tr></table></body></html>
