<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسْأَلُونَكَ عَنْ ذِي الْقَرْنَيْنِ قُلْ سَأَتْلُو عَلَيْكُمْ مِنْهُ ذِكْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَسْأَلُونَك" </quran>أَيْ الْيَهُود <quran>"عَنْ ذِي الْقَرْنَيْنِ" </quran>اسْمه الْإِسْكَنْدَر وَلَمْ يَكُنْ نَبِيًّا <quran>"قُلْ سَأَتْلُو" </quran>سَأَقُصُّ <quran>"عَلَيْكُمْ مِنْهُ" </quran>مِنْ حَاله <quran>"ذِكْرًا" </quran>خَبَرًا</p></td></tr></table></body></html>
