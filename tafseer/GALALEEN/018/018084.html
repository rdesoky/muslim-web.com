<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا مَكَّنَّا لَهُ فِي الْأَرْضِ وَآتَيْنَاهُ مِنْ كُلِّ شَيْءٍ سَبَبًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا مَكَّنَّا لَهُ فِي الْأَرْض" </quran>بِتَسْهِيلِ السَّيْر فِيهَا <quran>"وَآتَيْنَاهُ مِنْ كُلّ شَيْء" </quran>يَحْتَاج إلَيْهِ <quran>"سَبَبًا" </quran>طَرِيقًا يُوصِلهُ إلَى مُرَاده</p></td></tr></table></body></html>
