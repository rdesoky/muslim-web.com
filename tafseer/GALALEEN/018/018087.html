<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَمَّا مَنْ ظَلَمَ فَسَوْفَ نُعَذِّبُهُ ثُمَّ يُرَدُّ إِلَى رَبِّهِ فَيُعَذِّبُهُ عَذَابًا نُكْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَمَّا مَنْ ظَلَمَ" </quran>بِالشِّرْكِ <quran>"فَسَوْفَ نُعَذِّبهُ" </quran>نَقْتُلهُ <quran>"ثُمَّ يُرَدّ إلَى رَبّه فَيُعَذِّبهُ عَذَابًا نُكْرًا" </quran>بِسُكُونِ الْكَاف وَضَمّهَا شَدِيدًا فِي النَّار</p></td></tr></table></body></html>
