<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ" </quran>أَيْ الْأَمْر كَمَا قُلْنَا <quran>"وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ" </quran>أَيْ عِنْد ذِي الْقَرْنَيْنِ مِنْ الْآلَات وَالْجُنْد وَغَيْرهمَا <quran>"خُبْرًا" </quran>عِلْمًا</p></td></tr></table></body></html>
