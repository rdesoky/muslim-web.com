<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ ضَلَّ سَعْيهمْ فِي الْحَيَاة الدُّنْيَا" </quran>بَطَلَ عَمَلهمْ <quran>"وَهُمْ يَحْسَبُونَ" </quran>يَظُنُّونَ <quran>"أَنَّهُمْ يُحْسِنُونَ صُنْعًا" </quran>عَمَلًا يُجَازَوْنَ عَلَيْهِ .</p></td></tr></table></body></html>
