<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ جَزَاؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا وَاتَّخَذُوا آيَاتِي وَرُسُلِي هُزُوًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>أَيْ الْأَمْر الَّذِي ذَكَرْت عَنْ حُبُوط أَعْمَالهمْ وَغَيْره مُبْتَدَأ خَبَره <quran>"جَزَاؤُهُمْ جَهَنَّم بِمَا كَفَرُوا وَاِتَّخَذُوا آيَاتِي وَرُسُلِي هُزُوًا" </quran>أَيْ مَهْزُوءًا بِهِمَا</p></td></tr></table></body></html>
