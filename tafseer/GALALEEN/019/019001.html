<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كهيعص</font></td></tr><tr><td align=right dir=rtl><p>سُورَة مَرْيَم [ مَكِّيَّة إلَّا سَجْدَتهَا فَمَدَنِيَّة أَوْ إلَّا فَخَلَفَ مِنْ بَعْدهمْ خَلْف الْآيَتَيْنِ فَمَدَنِيَّتَانِ وَهِيَ ثَمَان أَوْ تِسْع وَتِسْعُونَ آيَة نَزَلَتْ بَعْد فَاطِر ]</p><p><quran>"كهيعص" </quran>اللَّه أَعْلَم بِمُرَادِهِ بِذَلِكَ</p></td></tr></table></body></html>
