<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَى لَمْ نَجْعَلْ لَهُ مِنْ قَبْلُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا زَكَرِيَّا إنَّا نُبَشِّرك بِغُلَامٍ" </quran>يَرِث كَمَا سَأَلْت <quran>"اسْمه يَحْيَى لَمْ نَجْعَل لَهُ مِنْ قَبْل سَمِيًّا" </quran>أَيْ : مُسَمًّى بِيَحْيَى</p></td></tr></table></body></html>
