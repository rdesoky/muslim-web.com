<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا يَحْيَى خُذِ الْكِتَابَ بِقُوَّةٍ وَآتَيْنَاهُ الْحُكْمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا يَحْيَى خُذْ الْكِتَاب" </quran>أَيْ : التَّوْرَاة <quran>"بِقُوَّةٍ" </quran>بِجِدٍّ <quran>"وَآتَيْنَاهُ الْحُكْم" </quran>النُّبُوَّة <quran>"صَبِيًّا" </quran>ابْن ثَلَاث سِنِينَ</p></td></tr></table></body></html>
