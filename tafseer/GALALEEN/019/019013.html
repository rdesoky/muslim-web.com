<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحَنَانًا مِنْ لَدُنَّا وَزَكَاةً وَكَانَ تَقِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحَنَانًا" </quran>رَحْمَة لِلنَّاسِ <quran>"مِنْ لَدُنَّا" </quran>مِنْ عِنْدنَا <quran>"وَزَكَاة" </quran>صَدَقَة عَلَيْهِمْ <quran>"وَكَانَ تَقِيًّا" </quran>رُوِيَ أَنَّهُ لَمْ يَعْمَل خَطِيئَة وَلَمْ يَهُمّ بِهَا</p></td></tr></table></body></html>
