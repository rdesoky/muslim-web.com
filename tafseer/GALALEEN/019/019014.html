<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَرًّا بِوَالِدَيْهِ وَلَمْ يَكُنْ جَبَّارًا عَصِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَبَرًّا بِوَالِدَيْهِ" </quran>أَيْ : مُحْسِنًا إلَيْهِمَا <quran>"وَلَمْ يَكُنْ جَبَّارًا" </quran>مُتَكَبِّرًا <quran>"عَصِيًّا" </quran>عَاصِيًا لِرَبِّهِ</p></td></tr></table></body></html>
