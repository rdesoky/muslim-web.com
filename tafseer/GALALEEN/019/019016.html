<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرْ فِي الْكِتَابِ مَرْيَمَ إِذِ انْتَبَذَتْ مِنْ أَهْلِهَا مَكَانًا شَرْقِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاذْكُرْ فِي الْكِتَاب" </quran>الْقُرْآن <quran>"مَرْيَم" </quran>أَيْ : خَبَرهَا <quran>"إذْ" </quran>حِين <quran>"انْتَبَذَتْ مِنْ أَهْلهَا مَكَانًا شَرْقِيًّا" </quran>أَيْ : اعْتَزَلَتْ فِي مَكَان نَحْو الشَّرْق مِنْ الدَّار</p></td></tr></table></body></html>
