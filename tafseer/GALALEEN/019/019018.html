<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَتْ إِنِّي أَعُوذُ بِالرَّحْمَنِ مِنْكَ إِنْ كُنْتَ تَقِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَتْ إنِّي أَعُوذ بِالرَّحْمَنِ مِنْك إنْ كُنْت تَقِيًّا" </quran>فَتَنْتَهِي عَنِّي بِتَعَوُّذِي</p></td></tr></table></body></html>
