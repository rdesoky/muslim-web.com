<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّمَا أَنَا رَسُولُ رَبِّكِ لِأَهَبَ لَكِ غُلَامًا زَكِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ إنَّمَا أَنَا رَسُول رَبّك لِأَهَب لَك غُلَامًا زَكِيًّا" </quran>بِالنُّبُوَّةِ</p></td></tr></table></body></html>
