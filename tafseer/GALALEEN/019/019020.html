<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَتْ أَنَّى يَكُونُ لِي غُلَامٌ وَلَمْ يَمْسَسْنِي بَشَرٌ وَلَمْ أَكُ بَغِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَتْ أَنَّى يَكُون لِي غُلَام وَلَمْ يَمْسَسْنِي بَشَر" </quran>بِتَزَوُّجٍ <quran>"وَلَمْ أَكُ بَغِيًّا" </quran>زَانِيَة</p></td></tr></table></body></html>
