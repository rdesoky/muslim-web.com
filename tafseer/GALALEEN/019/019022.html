<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَحَمَلَتْهُ فَانْتَبَذَتْ بِهِ مَكَانًا قَصِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَحَمَلَتْهُ فَانْتَبَذَتْ" </quran>تَنَحَّتْ <quran>"بِهِ مَكَانًا قَصِيًّا" </quran>بَعِيدًا مِنْ أَهْلهَا</p></td></tr></table></body></html>
