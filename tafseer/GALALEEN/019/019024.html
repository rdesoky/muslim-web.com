<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَنَادَاهَا مِنْ تَحْتِهَا أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَنَادَاهَا مِنْ تَحْتهَا" </quran>أَيْ : جِبْرِيل وَكَانَ أَسْفَل مِنْهَا <quran>"أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبّك تَحْتك سَرِيًّا" </quran>نَهْر مَاء كَانَ قَدْ انْقَطَعَ</p></td></tr></table></body></html>
