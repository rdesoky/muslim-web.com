<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَتَتْ بِهِ قَوْمَهَا تَحْمِلُهُ قَالُوا يَا مَرْيَمُ لَقَدْ جِئْتِ شَيْئًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَتَتْ بِهِ قَوْمهَا تَحْمِلهُ" </quran>حَال فَرَأَوْهُ <quran>"قَالُوا يَا مَرْيَم لَقَدْ جِئْت شَيْئًا فَرِيًّا" </quran>عَظِيمًا حَيْثُ أَتَيْت بِوَلَدٍ مِنْ غَيْر أَب</p></td></tr></table></body></html>
