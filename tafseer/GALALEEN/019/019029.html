<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَشَارَتْ إِلَيْهِ قَالُوا كَيْفَ نُكَلِّمُ مَنْ كَانَ فِي الْمَهْدِ صَبِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَشَارَتْ" </quran>لَهُمْ <quran>"إلَيْهِ" </quran>أَنْ كَلِّمُوهُ <quran>"قَالُوا كَيْفَ نُكَلِّم مَنْ كَانَ" </quran>أَيْ وُجِدَ</p></td></tr></table></body></html>
