<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ إنِّي عَبْد اللَّه آتَانِي الْكِتَاب" </quran>أَيْ : الْإِنْجِيل</p></td></tr></table></body></html>
