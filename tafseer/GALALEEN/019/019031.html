<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلَنِي مُبَارَكًا أَيْنَ مَا كُنْتُ ‎وَأَوْصَانِي بِالصَّلَاةِ وَالزَّكَاةِ مَا دُمْتُ حَيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَعَلَنِي مُبَارَكًا أَيْنَ مَا كُنْت" </quran>أَيْ : نَفَّاعًا لِلنَّاسِ إخْبَار بِمَا كُتِبَ لَهُ <quran>"وَأَوْصَانِي بِالصَّلَاةِ وَالزَّكَاة" </quran>أَمَرَنِي بِهِمَا</p></td></tr></table></body></html>
