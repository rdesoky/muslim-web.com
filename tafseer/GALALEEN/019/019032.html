<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَرًّا بِوَالِدَتِي وَلَمْ يَجْعَلْنِي جَبَّارًا شَقِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَبَرًّا بِوَالِدَتِي" </quran>مَنْصُوب بِجَعَلَنِي مُقَدَّر <quran>"وَلَمْ يَجْعَلنِي جَبَّارًا" </quran>مُتَعَاظِمًا <quran>"شَقِيًّا" </quran>عَاصِيًا لِرَبِّهِ</p></td></tr></table></body></html>
