<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَحْنُ نَرِثُ الْأَرْضَ وَمَنْ عَلَيْهَا وَإِلَيْنَا يُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا نَحْنُ" </quran>تَأْكِيد <quran>"نَرِث الْأَرْض وَمَنْ عَلَيْهَا" </quran>مِنْ الْعُقَلَاء وَغَيْرهمْ بِإِهْلَاكِهِمْ <quran>"وَإِلَيْنَا يُرْجَعُونَ" </quran>فِيهِ لِلْجَزَاءِ</p></td></tr></table></body></html>
