<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرْ فِي الْكِتَابِ إِبْرَاهِيمَ إِنَّهُ كَانَ صِدِّيقًا نَبِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاذْكُرْ" </quran>لَهُمْ <quran>"فِي الْكِتَاب إبْرَاهِيم" </quran>أَيْ : خَبَره <quran>"إنَّهُ كَانَ صِدِّيقًا" </quran>مُبَالِغًا فِي الصِّدْق <quran>"نَبِيًّا" </quran>وَيُبْدَل مِنْ خَبَره</p></td></tr></table></body></html>
