<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَبَتِ إِنِّي قَدْ جَاءَنِي مِنَ الْعِلْمِ مَا لَمْ يَأْتِكَ فَاتَّبِعْنِي أَهْدِكَ صِرَاطًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَبَتِ إنِّي قَدْ جَاءَنِي مِنْ الْعِلْم مَا لَمْ يَأْتِك فَاتَّبِعْنِي أَهْدِك صِرَاطًا" </quran>طَرِيقًا <quran>"سَوِيًّا" </quran>مُسْتَقِيمًا</p></td></tr></table></body></html>
