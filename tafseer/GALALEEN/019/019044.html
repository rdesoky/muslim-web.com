<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَبَتِ لَا تَعْبُدِ الشَّيْطَانَ إِنَّ الشَّيْطَانَ كَانَ لِلرَّحْمَنِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَبَتِ لَا تَعْبُد الشَّيْطَان" </quran>بِطَاعَتِك إيَّاهُ فِي عِبَادَة الْأَصْنَام <quran>"إنَّ الشَّيْطَان كَانَ لِلرَّحْمَنِ عَصِيًّا" </quran>كَثِير الْعِصْيَان</p></td></tr></table></body></html>
