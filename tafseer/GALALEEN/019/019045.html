<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَبَتِ إِنِّي أَخَافُ أَنْ يَمَسَّكَ عَذَابٌ مِنَ الرَّحْمَنِ فَتَكُونَ لِلشَّيْطَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَبَتِ إنِّي أَخَاف أَنْ يَمَسّك عَذَاب مِنْ الرَّحْمَن" </quran>إنْ لَمْ تَتُبْ <quran>"فَتَكُون لِلشَّيْطَانِ وَلِيًّا" </quran>نَاصِرًا وَقَرِينًا فِي النَّار</p></td></tr></table></body></html>
