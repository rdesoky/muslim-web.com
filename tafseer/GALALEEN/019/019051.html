<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرْ فِي الْكِتَابِ مُوسَى إِنَّهُ كَانَ مُخْلَصًا وَكَانَ رَسُولًا نَبِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاذْكُرْ فِي الْكِتَاب مُوسَى إنَّهُ كَانَ مُخْلَصًا" </quran>بِكَسْرِ اللَّام وَفَتْحهَا مِنْ أَخْلَصَ فِي عِبَادَته وَخَلَّصَهُ اللَّه مِنْ الدَّنَس</p></td></tr></table></body></html>
