<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَانَ يَأْمُرُ أَهْلَهُ بِالصَّلَاةِ وَالزَّكَاةِ وَكَانَ عِنْدَ رَبِّهِ مَرْضِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَانَ يَأْمُر أَهْله" </quran>أَيْ قَوْمه <quran>"بِالصَّلَاةِ وَالزَّكَاة وَكَانَ عِنْد رَبّه مَرْضِيًّا" </quran>أَصْله مَرْضُوّ وَقُلِبَتْ الْوَاوَانِ يَاءَيْنِ وَالضَّمَّة كَسْرَة .</p></td></tr></table></body></html>
