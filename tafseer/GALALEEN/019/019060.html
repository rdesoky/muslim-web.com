<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا فَأُولَئِكَ يَدْخُلُونَ الْجَنَّةَ وَلَا يُظْلَمُونَ شَيْئًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا" </quran>لَكِنْ <quran>"مَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا فَأُولَئِكَ يَدْخُلُونَ الْجَنَّة وَلَا يُظْلَمُونَ" </quran>يَنْقُصُونَ <quran>"شَيْئًا" </quran>مِنْ ثَوَابهمْ</p></td></tr></table></body></html>
