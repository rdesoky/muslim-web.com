<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَادَتِهِ هَلْ تَعْلَمُ لَهُ سَمِيًّا</font></td></tr><tr><td align=right dir=rtl><p>هُوَ <quran>"رَبّ" </quran>مَالِك <quran>"السَّمَوَات وَالْأَرْض وَمَا بَيْنهمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَادَتِهِ" </quran>أَيْ : اصْبِرْ عَلَيْهَا <quran>"هَلْ تَعْلَم لَهُ سَمِيًّا" </quran>مُسَمًّى بِذَلِكَ ؟ لَا</p></td></tr></table></body></html>
