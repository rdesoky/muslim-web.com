<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ لَنَنْزِعَنَّ مِنْ كُلِّ شِيعَةٍ أَيُّهُمْ أَشَدُّ عَلَى الرَّحْمَنِ عِتِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ لَنَنْزِعَنَّ مِنْ كُلّ شِيعَة" </quran>فِرْقَة مِنْهُمْ <quran>"أَيّهمْ أَشَدّ عَلَى الرَّحْمَن عِتِيًّا" </quran>جَرَاءَة</p></td></tr></table></body></html>
