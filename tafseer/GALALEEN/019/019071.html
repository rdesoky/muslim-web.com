<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ مِنْكُمْ إِلَّا وَارِدُهَا كَانَ عَلَى رَبِّكَ حَتْمًا مَقْضِيًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ" </quran>أَيْ مَا <quran>"مِنْكُمْ" </quran>أَحَد <quran>"إلَّا وَارِدهَا" </quran>أَيْ دَاخِل جَهَنَّم <quran>"كَانَ عَلَى رَبّك حَتْمًا مَقْضِيًّا" </quran>حَتَمَهُ وَقَضَى بِهِ لَا يَتْرُكهُ</p></td></tr></table></body></html>
