<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا سَنَكْتُبُ مَا يَقُولُ وَنَمُدُّ لَهُ مِنَ الْعَذَابِ مَدًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>أَيْ لَا يُؤْتَى ذَلِكَ <quran>"سَنَكْتُبُ" </quran>نَأْمُر بِكَتْبِ <quran>"مَا يَقُول وَنَمُدّ لَهُ مِنْ الْعَذَاب مَدًّا" </quran>نَزِيدهُ بِذَلِكَ عَذَابًا فَوْق عَذَاب كُفْره</p></td></tr></table></body></html>
