<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَرِثُهُ مَا يَقُولُ وَيَأْتِينَا فَرْدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَرِثهُ مَا يَقُول" </quran>مِنْ الْمَال وَالْوَلَد <quran>"وَيَأْتِينَا" </quran>يَوْم الْقِيَامَة <quran>"فَرْدًا" </quran>لَا مَال لَهُ وَلَا وَلَد</p></td></tr></table></body></html>
