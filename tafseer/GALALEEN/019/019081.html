<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّخَذُوا مِنْ دُونِ اللَّهِ آلِهَةً لِيَكُونُوا لَهُمْ عِزًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاِتَّخَذُوا" </quran>أَيْ كُفَّار مَكَّة <quran>"مِنْ دُون اللَّه" </quran>أَيْ : الْأَوْثَان <quran>"آلِهَة" </quran>يَعْبُدُونَهُمْ <quran>"لِيَكُونُوا لَهُمْ عِزًّا" </quran>شُفَعَاء عِنْد اللَّه بِأَنْ لَا يُعَذَّبُوا</p></td></tr></table></body></html>
