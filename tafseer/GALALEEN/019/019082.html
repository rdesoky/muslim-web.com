<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا سَيَكْفُرُونَ بِعِبَادَتِهِمْ وَيَكُونُونَ عَلَيْهِمْ ضِدًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>أَيْ لَا مَانِع مِنْ عَذَابهمْ <quran>"سَيَكْفُرُونَ" </quran>أَيْ الْآلِهَة <quran>"بِعِبَادَتِهِمْ" </quran>أَيْ يَنْفُونَهَا كَمَا فِي آيَة أُخْرَى <quran>"مَا كَانُوا إيَّانَا يَعْبُدُونَ" </quran><quran>"وَيَكُونُونَ عَلَيْهِمْ ضِدًّا" </quran>أَعْوَانًا وَأَعْدَاء</p></td></tr></table></body></html>
