<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تَعْجَلْ عَلَيْهِمْ إِنَّمَا نَعُدُّ لَهُمْ عَدًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا تَعْجَل عَلَيْهِمْ" </quran>بِطَلَبِ الْعَذَاب <quran>"إنَّمَا نَعُدّ لَهُمْ" </quran>الْأَيَّام وَاللَّيَالِي أَوْ الْأَنْفَاس <quran>"عَدًّا" </quran>إلَى وَقْت عَذَابهمْ</p></td></tr></table></body></html>
