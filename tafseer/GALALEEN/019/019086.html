<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَسُوقُ الْمُجْرِمِينَ إِلَى جَهَنَّمَ وِرْدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَسُوق الْمُجْرِمِينَ" </quran>بِكُفْرِهِمْ <quran>"إلَى جَهَنَّم وِرْدًا" </quran>جَمْع وَارِد بِمَعْنَى مَاشٍ عَطْشَان</p></td></tr></table></body></html>
