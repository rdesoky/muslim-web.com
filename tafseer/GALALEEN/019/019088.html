<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا اتَّخَذَ الرَّحْمَنُ وَلَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>أَيْ الْيَهُود وَالنَّصَارَى وَمَنْ زَعَمَ أَنَّ الْمَلَائِكَة بَنَات اللَّه</p></td></tr></table></body></html>
