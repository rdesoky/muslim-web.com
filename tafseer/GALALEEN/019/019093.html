<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كُلُّ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ إِلَّا آتِي الرَّحْمَنِ عَبْدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ" </quran>أَيْ مَا <quran>"كُلّ مَنْ فِي السَّمَوَات وَالْأَرْض إلَّا آتِي الرَّحْمَن عَبْدًا" </quran>ذَلِيلًا خَاضِعًا يَوْم الْقِيَامَة مِنْهُمْ عُزَيْر وَعِيسَى</p></td></tr></table></body></html>
