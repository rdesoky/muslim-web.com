<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ أَحْصَاهُمْ وَعَدَّهُمْ عَدًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ أَحْصَاهُمْ وَعَدَّهُمْ عَدًّا" </quran>فَلَا يَخْفَى عَلَيْهِ مَبْلَغُ جَمِيعِهِمْ وَلَا وَاحِدٌ مِنْهُمْ</p></td></tr></table></body></html>
