<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُّهُمْ آتِيهِ يَوْمَ الْقِيَامَةِ فَرْدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكُلّهمْ آتِيه يَوْم الْقِيَامَة فَرْدًا" </quran>بِلَا مَال وَلَا نَصِير لَهُ</p></td></tr></table></body></html>
