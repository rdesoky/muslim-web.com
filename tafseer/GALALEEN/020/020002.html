<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا أَنْزَلْنَا عَلَيْك الْقُرْآن" </quran>يَا مُحَمَّد <quran>"لِتَشْقَى" </quran>لِتَتْعَب بِمَا فَعَلْت بَعْد نُزُوله مِنْ طُول قِيَامك بِصَلَاةِ اللَّيْل أَيْ خَفِّفْ عَنْ نَفْسك</p></td></tr></table></body></html>
