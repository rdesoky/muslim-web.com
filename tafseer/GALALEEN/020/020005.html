<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الرَّحْمَنُ عَلَى الْعَرْشِ اسْتَوَى</font></td></tr><tr><td align=right dir=rtl><p>هُوَ <quran>"الرَّحْمَن عَلَى الْعَرْش" </quran>وَهُوَ فِي اللُّغَة سَرِير الْمُلْك <quran>"اسْتَوَى" </quran>اسْتِوَاء يَلِيق بِهِ</p></td></tr></table></body></html>
