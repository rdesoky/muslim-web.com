<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَمَا بَيْنَهُمَا وَمَا تَحْتَ الثَّرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُ مَا فِي السَّمَاوَات وَمَا فِي الْأَرْض وَمَا بَيْنهمَا" </quran>مِنْ الْمَخْلُوقَات <quran>"وَمَا تَحْت الثَّرَى" </quran>هُوَ التُّرَاب النَّدِيّ وَالْمُرَاد الْأَرَضُونَ السَّبْع لِأَنَّهَا تَحْته</p></td></tr></table></body></html>
