<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ لَا إِلَهَ إِلَّا هُوَ لَهُ الْأَسْمَاءُ الْحُسْنَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه لَا إلَه إلَّا هُوَ لَهُ الْأَسْمَاء الْحُسْنَى" </quran>التِّسْعَة وَالتِّسْعُونَ الْوَارِد بِهَا الْحَدِيث وَالْحُسْنَى مُؤَنَّث الْأَحْسَن</p></td></tr></table></body></html>
