<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّنِي أَنَا اللَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّنِي أَنَا اللَّه لَا إلَه إلَّا أَنَا فَاعْبُدْنِي وَأَقِمْ الصَّلَاة لِذِكْرِي" </quran>لِذِكْرِي فِيهَا</p></td></tr></table></body></html>
