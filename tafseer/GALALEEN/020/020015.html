<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ السَّاعَةَ آتِيَةٌ أَكَادُ أُخْفِيهَا لِتُجْزَى كُلُّ نَفْسٍ بِمَا تَسْعَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ السَّاعَة آتِيَة أَكَاد أُخْفِيهَا" </quran>عَنْ النَّاس وَيَظْهَر لَهُمْ قُرْبهَا بِعَلَامَاتِهَا <quran>"لِتُجْزَى" </quran>فِيهَا <quran>"كُلّ نَفْس بِمَا تَسْعَى" </quran>بِهِ مِنْ خَيْر أَوْ شَرّ</p></td></tr></table></body></html>
