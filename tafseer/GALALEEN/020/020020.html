<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَلْقَاهَا فَإِذَا هِيَ حَيَّةٌ تَسْعَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَلْقَاهَا فَإِذَا هِيَ حَيَّة" </quran>ثُعْبَان عَظِيم <quran>"تَسْعَى" </quran>تَمْشِي عَلَى بَطْنهَا سَرِيعًا كَسُرْعَةِ الثُّعْبَان الصَّغِير الْمُسَمَّى بِالْجَانِّ الْمُعَبَّر بِهِ فِيهَا فِي آيَة أُخْرَى</p></td></tr></table></body></html>
