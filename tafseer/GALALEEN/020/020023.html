<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِنُرِيَكَ مِنْ آيَاتِنَا الْكُبْرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِنُرِيَك" </quran>بِهَا إذَا فَعَلْت ذَلِكَ لِإِظْهَارِهَا <quran>"مِنْ آيَاتنَا" </quran>الْآيَة <quran>"الْكُبْرَى" </quran>أَيْ الْعُظْمَى عَلَى رِسَالَتك وَإِذَا أَرَادَ عَوْدهَا إلَى حَالَتهَا الْأُولَى ضَمَّهَا إلَى جَنَاحه كَمَا تَقَدَّمَ وَأَخْرَجَهَا</p></td></tr></table></body></html>
