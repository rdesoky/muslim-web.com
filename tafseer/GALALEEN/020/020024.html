<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اذْهَبْ إِلَى فِرْعَوْنَ إِنَّهُ طَغَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"اذْهَبْ" </quran>رَسُولًا <quran>"إلَى فِرْعَوْن" </quran>وَمَنْ مَعَهُ <quran>"إنَّهُ طَغَى" </quran>جَاوَزَ الْحَدّ فِي كُفْره إلَى ادِّعَاء الْإِلَهِيَّة</p></td></tr></table></body></html>
