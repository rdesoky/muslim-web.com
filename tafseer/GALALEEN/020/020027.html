<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاحْلُلْ عُقْدَة مِنْ لِسَانِي" </quran>حَدَثَتْ مِنْ احْتِرَاقه بِجَمْرَةٍ وَضَعَهَا بِفِيهِ وَهُوَ صَغِير</p></td></tr></table></body></html>
