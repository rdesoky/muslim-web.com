<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَشْرِكْهُ فِي أَمْرِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَشْرِكْهُ فِي أَمْرِي" </quran>أَيْ الرِّسَالَة وَالْفِعْلَانِ بِصِيغَتِي الْأَمْر وَالْمُضَارِع الْمَجْزُوم وَهُوَ جَوَاب الطَّلَب</p></td></tr></table></body></html>
