<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اذْهَبْ أَنْتَ وَأَخُوكَ بِآيَاتِي وَلَا تَنِيَا فِي ذِكْرِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"اذْهَبْ أَنْتَ وَأَخُوك" </quran>إلَى النَّاس <quran>"بِآيَاتِي" </quran>التِّسْع <quran>"وَلَا تَنِيَا" </quran>تَفْتُرَا <quran>"فِي ذِكْرِي" </quran>بِتَسْبِيحٍ وَغَيْره</p></td></tr></table></body></html>
