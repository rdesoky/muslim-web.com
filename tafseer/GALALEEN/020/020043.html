<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اذْهَبَا إِلَى فِرْعَوْنَ إِنَّهُ طَغَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"اذْهَبَا إلَى فِرْعَوْن إنَّهُ طَغَى" </quran>بِادِّعَائِهِ الرُّبُوبِيَّة</p></td></tr></table></body></html>
