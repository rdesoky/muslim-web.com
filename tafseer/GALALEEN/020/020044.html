<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقُولَا لَهُ قَوْلًا لَيِّنًا" </quran>فِي رُجُوعه عَنْ ذَلِكَ <quran>"لَعَلَّهُ يَتَذَكَّر" </quran>يَتَّعِظ وَالتَّرَجِّي بِالنِّسْبَةِ إلَيْهِمَا لِعِلْمِهِ تَعَالَى بِأَنَّهُ لَا يَرْجِع <quran>"أَوْ يَخْشَى" </quran>اللَّه فَيَرْجِع</p></td></tr></table></body></html>
