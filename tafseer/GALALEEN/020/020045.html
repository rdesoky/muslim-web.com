<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَا رَبَّنَا إِنَّنَا نَخَافُ أَنْ يَفْرُطَ عَلَيْنَا أَوْ أَنْ يَطْغَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَا رَبّنَا إنَّنَا نَخَاف أَنْ يَفْرُط عَلَيْنَا" </quran>أَيْ يَعْجَل بِالْعُقُوبَةِ <quran>"أَوْ أَنْ يَطْغَى" </quran>عَلَيْنَا أَيْ يَتَكَبَّر</p></td></tr></table></body></html>
