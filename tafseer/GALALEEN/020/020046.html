<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ لَا تَخَافَا إنَّنِي مَعَكُمَا" </quran>بِعَوْنِي <quran>"أَسْمَع" </quran>مَا يَقُول <quran>"وَأَرَى" </quran>مَا يَفْعَل</p></td></tr></table></body></html>
