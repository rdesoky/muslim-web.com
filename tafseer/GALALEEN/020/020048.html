<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا قَدْ أُوحِيَ إِلَيْنَا أَنَّ الْعَذَابَ عَلَى مَنْ كَذَّبَ وَتَوَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا قَدْ أُوحِيَ إلَيْنَا أَنَّ الْعَذَاب عَلَى مَنْ كَذَّبَ" </quran>مَا جِئْنَا بِهِ <quran>"وَتَوَلَّى" </quran>أَعْرَضَ عَنْهُ فَأَتَيَاهُ وَقَالَا جَمِيع مَا ذُكِرَ</p></td></tr></table></body></html>
