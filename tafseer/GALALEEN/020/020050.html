<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّنَا الَّذِي أَعْطَى كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّنَا الَّذِي أَعْطَى كُلّ شَيْء" </quran>مِنْ الْخَلْق <quran>"خَلْقه" </quran>الَّذِي هُوَ عَلَيْهِ مُتَمَيِّز بِهِ عَنْ غَيْره <quran>"ثُمَّ هَدَى" </quran>الْحَيَوَان مِنْهُ إلَى مَطْعَمه وَمَشْرَبه وَمَنْكَحِهِ وَغَيْر ذَلِكَ</p></td></tr></table></body></html>
