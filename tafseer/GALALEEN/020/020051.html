<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَمَا بَالُ الْقُرُونِ الْأُولَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>فِرْعَوْن <quran>"فَمَا بَال" </quran>حَال <quran>"الْقُرُون" </quran>الْأُمَم <quran>"الْأُولَى" </quran>كَقَوْمِ نُوح وَهُود وَلُوط وَصَالِح فِي عِبَادَتهمْ الْأَوْثَان</p></td></tr></table></body></html>
