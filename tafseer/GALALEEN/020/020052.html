<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ عِلْمُهَا عِنْدَ رَبِّي فِي كِتَابٍ لَا يَضِلُّ رَبِّي وَلَا يَنْسَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"عِلْمهَا" </quran>أَيْ عِلْم حَالهمْ مَحْفُوظ <quran>"عِنْد رَبِّي فِي كِتَاب" </quran>هُوَ اللَّوْح الْمَحْفُوظ يُجَازِيهِمْ عَلَيْهَا يَوْم الْقِيَامَة <quran>"لَا يَضِلّ" </quran>يَغِيب <quran>"رَبِّي" </quran>عَنْ شَيْء <quran>"وَلَا يَنْسَى" </quran>رَبِّي شَيْئًا</p></td></tr></table></body></html>
