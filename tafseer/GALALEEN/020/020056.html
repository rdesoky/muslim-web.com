<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَرَيْنَاهُ آيَاتِنَا كُلَّهَا فَكَذَّبَ وَأَبَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَرَيْنَاهُ" </quran>أَيْ أَبْصَرْنَا فِرْعَوْن <quran>"آيَاتنَا كُلّهَا" </quran>التِّسْع <quran>"فَكَذَّبَ" </quran>بِهَا وَزَعَمَ أَنَّهَا سِحْر <quran>"وَأَبَى" </quran>أَنْ يُوَحِّد اللَّه تَعَالَى</p></td></tr></table></body></html>
