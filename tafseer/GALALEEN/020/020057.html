<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَجِئْتَنَا لِتُخْرِجَنَا مِنْ أَرْضِنَا بِسِحْرِكَ يَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَجِئْتنَا لِتُخْرِجنَا مِنْ أَرْضنَا" </quran>مِصْر وَيَكُون لَك الْمُلْك فِيهَا</p></td></tr></table></body></html>
