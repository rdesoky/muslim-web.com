<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَوَلَّى فِرْعَوْنُ فَجَمَعَ كَيْدَهُ ثُمَّ أَتَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَتَوَلَّى فِرْعَوْن" </quran>أَدْبَرَ <quran>"فَجَمَعَ كَيْده" </quran>أَيْ ذَوِي كَيْده مِنْ السَّحَرَة <quran>"ثُمَّ أَتَى" </quran>بِهِمْ الْمَوْعِد</p></td></tr></table></body></html>
