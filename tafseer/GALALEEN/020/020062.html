<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَنَازَعُوا أَمْرَهُمْ بَيْنَهُمْ وَأَسَرُّوا النَّجْوَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَتَنَازَعُوا أَمْرهمْ بَيْنهمْ" </quran>فِي مُوسَى وَأَخِيهِ <quran>"وَأَسَرُّوا النَّجْوَى" </quran>أَيْ الْكَلَام بَيْنهمْ فِيهِمَا</p></td></tr></table></body></html>
