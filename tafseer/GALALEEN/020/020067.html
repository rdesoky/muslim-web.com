<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَوْجَسَ" </quran>أَحَسَّ <quran>"فِي نَفْسه خِيفَة مُوسَى" </quran>أَيْ خَافَ مِنْ جِهَة أَنَّ سِحْرهمْ مِنْ جِنْس مُعْجِزَته أَنْ يَلْتَبِس أَمْره عَلَى النَّاس فَلَا يُؤْمِنُوا بِهِ</p></td></tr></table></body></html>
