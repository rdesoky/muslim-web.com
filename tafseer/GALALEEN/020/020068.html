<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْنَا لَا تَخَفْ إِنَّكَ أَنْتَ الْأَعْلَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْنَا" </quran>لَهُ <quran>"لَا تَخَفْ إنَّك أَنْتَ الْأَعْلَى" </quran>عَلَيْهِمْ بِالْغَلَبَةِ</p></td></tr></table></body></html>
