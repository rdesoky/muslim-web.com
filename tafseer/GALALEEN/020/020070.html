<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأُلْقِيَ السَّحَرَةُ سُجَّدًا قَالُوا آمَنَّا بِرَبِّ هَارُونَ وَمُوسَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأُلْقِيَ السَّحَرَة سُجَّدًا" </quran>خَرُّوا سَاجِدِينَ لِلَّهِ تَعَالَى</p></td></tr></table></body></html>
