<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ يَأْتِهِ مُؤْمِنًا قَدْ عَمِلَ الصَّالِحَاتِ فَأُولَئِكَ لَهُمُ الدَّرَجَاتُ الْعُلَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ يَأْتِهِ مُؤْمِنًا قَدْ عَمِلَ الصَّالِحَات" </quran>الْفَرَائِض وَالنَّوَافِل <quran>"فَأُولَئِكَ لَهُمْ الدَّرَجَات الْعُلَى" </quran>جَمْع عُلْيَا مُؤَنَّث أَعْلَى</p></td></tr></table></body></html>
