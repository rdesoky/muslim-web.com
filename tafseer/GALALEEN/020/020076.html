<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>جَنَّاتُ عَدْنٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَذَلِكَ جَزَاءُ مَنْ تَزَكَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"جَنَّات عَدْن" </quran>أَيْ إقَامَة <quran>"تَجْرِي مِنْ تَحْتهَا الْأَنْهَار خَالِدِينَ فِيهَا وَذَلِكَ جَزَاء مَنْ تَزَكَّى" </quran>تَطَهَّرَ مِنْ الذُّنُوب</p></td></tr></table></body></html>
