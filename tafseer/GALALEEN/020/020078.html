<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَتْبَعَهُمْ فِرْعَوْنُ بِجُنُودِهِ فَغَشِيَهُمْ مِنَ الْيَمِّ مَا غَشِيَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَتْبَعَهُمْ فِرْعَوْن بِجُنُودِهِ" </quran>وَهُوَ مَعَهُمْ <quran>"فَغَشِيَهُمْ مِنْ الْيَمّ" </quran>أَيْ الْبَحْر <quran>"مَا غَشِيَهُمْ" </quran>فَأَغْرَقَهُمْ</p></td></tr></table></body></html>
