<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَضَلَّ فِرْعَوْنُ قَوْمَهُ وَمَا هَدَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَضَلَّ فِرْعَوْن قَوْمه" </quran>بِدُعَائِهِمْ إلَى عِبَادَته <quran>"وَمَا هَدَى" </quran>بَلْ أَوْقَعَهُمْ فِي الْهَلَاك خِلَاف قَوْله <quran>"وَمَا أَهْدِيكُمْ إلَّا سَبِيل الرَّشَاد"</quran></p></td></tr></table></body></html>
