<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنِّي لَغَفَّار لِمَنْ تَابَ" </quran>مِنْ الشِّرْك <quran>"وَآمَنَ" </quran>وَحَّدَ اللَّه <quran>"وَعَمِلَ صَالِحًا" </quran>يَصْدُق بِالْفَرْضِ وَالنَّفْل <quran>"ثُمَّ اهْتَدَى" </quran>بِاسْتِمْرَارِهِ عَلَى مَا ذُكِرَ إلَى مَوْته</p></td></tr></table></body></html>
