<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هُمْ أُولَاءِ عَلَى أَثَرِي وَعَجِلْتُ إِلَيْكَ رَبِّ لِتَرْضَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ هُمْ أُولَاءِ" </quran>أَيْ بِالْقُرْبِ مِنِّي يَأْتُونَ <quran>"عَلَى أَثَرِي وَعَجِلْت إلَيْك رَبّ لِتَرْضَى" </quran>عَنِّي : أَيْ زِيَادَة فِي رِضَاك وَقَبْل الْجَوَاب أَتَى بِالِاعْتِذَارِ حَسَب ظَنّه وَتَخَلُّف الْمَظْنُون لَمَّا</p></td></tr></table></body></html>
