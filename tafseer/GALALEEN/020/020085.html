<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنْ بَعْدِكَ وَأَضَلَّهُمُ السَّامِرِيُّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى <quran>"فَإِنَّا قَدْ فَتَنَّا قَوْمك مِنْ بَعْدك" </quran>أَيْ بَعْد فِرَاقك لَهُمْ <quran>"وَأَضَلَّهُمْ السَّامِرِيّ" </quran>فَعَبَدُوا الْعِجْل</p></td></tr></table></body></html>
