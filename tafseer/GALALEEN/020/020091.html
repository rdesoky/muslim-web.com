<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَنْ نَبْرَحَ عَلَيْهِ عَاكِفِينَ حَتَّى يَرْجِعَ إِلَيْنَا مُوسَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَنْ نَبْرَحَ" </quran>نَزَال <quran>"عَلَيْهِ عَاكِفِينَ" </quran>عَلَى عِبَادَته مُقِيمِينَ</p></td></tr></table></body></html>
