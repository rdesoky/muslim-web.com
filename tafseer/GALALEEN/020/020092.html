<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا هَارُونُ مَا مَنَعَكَ إِذْ رَأَيْتَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى بَعْد رُجُوعه <quran>"يَا هَارُون مَا مَنَعَك إذْ رَأَيْتهمْ ضَلُّوا" </quran>بِعِبَادَتِهِ</p></td></tr></table></body></html>
