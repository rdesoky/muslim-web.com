<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَّا تَتَّبِعَنِي أَفَعَصَيْتَ أَمْرِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَ" </quran>نْ <quran>"لَّا" </quran>لَا زَائِدَة <quran>"أَفَعَصَيْت أَمْرِي" </quran>بِإِقَامَتِك بَيْن مَنْ يَعْبُد غَيْر اللَّه تَعَالَى</p></td></tr></table></body></html>
