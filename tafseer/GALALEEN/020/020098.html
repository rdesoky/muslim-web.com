<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا إِلَهُكُمُ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ وَسِعَ كُلَّ شَيْءٍ عِلْمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا إلَهكُمْ اللَّه الَّذِي لَا إلَه إلَّا هُوَ وَسِعَ كُلّ شَيْء عِلْمًا" </quran>تَمْيِيز مُحَوَّل عَنْ الْفَاعِل أَيْ وَسِعَ عِلْمه كُلّ شَيْء</p></td></tr></table></body></html>
