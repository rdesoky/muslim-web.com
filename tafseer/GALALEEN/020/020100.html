<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ أَعْرَضَ عَنْهُ فَإِنَّهُ يَحْمِلُ يَوْمَ الْقِيَامَةِ وِزْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَنْ أَعْرَضَ عَنْهُ" </quran>فَلَمْ يُؤْمِن بِهِ <quran>"فَإِنَّهُ يَحْمِل يَوْم الْقِيَامَة وِزْرًا" </quran>حِمْلًا ثَقِيلًا مِنْ الْإِثْم</p></td></tr></table></body></html>
