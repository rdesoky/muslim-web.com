<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يُنْفَخُ فِي الصُّورِ وَنَحْشُرُ الْمُجْرِمِينَ يَوْمَئِذٍ زُرْقًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم يُنْفَخ فِي الصُّور" </quran>الْقَرْن النَّفْخَة الثَّانِيَة <quran>"وَنَحْشُر الْمُجْرِمِينَ" </quran>الْكَافِرِينَ <quran>"يَوْمئِذٍ زُرْقًا" </quran>عُيُونهمْ مَعَ سَوَاد وُجُوههمْ</p></td></tr></table></body></html>
