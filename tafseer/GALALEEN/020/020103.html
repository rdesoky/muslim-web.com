<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَتَخَافَتُونَ بَيْنَهُمْ إِنْ لَبِثْتُمْ إِلَّا عَشْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَتَخَافَتُونَ بَيْنهمْ" </quran>يَتَسَارُّونَ <quran>"إنْ" </quran>مَا <quran>"لَبِثْتُمْ" </quran>فِي الدُّنْيَا <quran>"إلَّا عَشْرًا" </quran>مِنْ اللَّيَالِي بِأَيَّامِهَا</p></td></tr></table></body></html>
