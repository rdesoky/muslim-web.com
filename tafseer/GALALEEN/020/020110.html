<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِهِ عِلْمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَعْلَم مَا بَيْن أَيْدِيهمْ" </quran>مِنْ أُمُور الْآخِرَة <quran>"وَمَا خَلْفهمْ" </quran>مِنْ أُمُور الدُّنْيَا <quran>"وَلَا يُحِيطُونَ بِهِ عِلْمًا" </quran>لَا يَعْلَمُونَ ذَلِكَ</p></td></tr></table></body></html>
