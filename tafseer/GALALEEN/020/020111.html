<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعَنَتِ الْوُجُوهُ لِلْحَيِّ الْقَيُّومِ وَقَدْ خَابَ مَنْ حَمَلَ ظُلْمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَعَنَتْ الْوُجُوه" </quran>خَضَعَتْ <quran>"لِلْحَيِّ الْقَيُّوم" </quran>أَيْ اللَّه <quran>"وَقَدْ خَابَ" </quran>خَسِرَ <quran>"مَنْ حَمَلَ ظُلْمًا" </quran>أَيْ شِرْكًا</p></td></tr></table></body></html>
