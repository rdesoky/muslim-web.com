<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ عَهِدْنَا إِلَى آدَمَ مِنْ قَبْلُ فَنَسِيَ وَلَمْ نَجِدْ لَهُ عَزْمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ عَهِدْنَا إلَى آدَم" </quran>وَصَّيْنَاهُ أَنْ لَا يَأْكُل مِنْ الشَّجَرَة <quran>"مِنْ قَبْل" </quran>أَيْ قَبْل أَكْله مِنْهَا <quran>"فَنَسِيَ" </quran>تَرَكَ عَهْدنَا <quran>"وَلَمْ نَجِد لَهُ عَزْمًا" </quran>حَزْمًا وَصَبْرًا عَمَّا نَهَيْنَاهُ عَنْهُ</p></td></tr></table></body></html>
