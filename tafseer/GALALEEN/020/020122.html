<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ اجْتَبَاهُ رَبُّهُ فَتَابَ عَلَيْهِ وَهَدَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ اجْتَبَاهُ رَبّه" </quran>قَرَّبَهُ <quran>"فَتَابَ عَلَيْهِ" </quran>قَبْل تَوْبَته <quran>"وَهَدَى" </quran>أَيْ هَدَاهُ إلَى الْمُدَاوَمَة عَلَى التَّوْبَة</p></td></tr></table></body></html>
