<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ لِمَ حَشَرْتَنِي أَعْمَى وَقَدْ كُنْتُ بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ لَمْ حَشَرْتنِي أَعْمَى وَقَدْ كُنْت بَصِيرًا" </quran>فِي الدُّنْيَا وَعِنْد الْبَعْث</p></td></tr></table></body></html>
