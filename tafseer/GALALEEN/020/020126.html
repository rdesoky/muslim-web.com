<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ كَذَلِكَ أَتَتْكَ آيَاتُنَا فَنَسِيتَهَا وَكَذَلِكَ الْيَوْمَ تُنْسَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>الْأَمْر <quran>"كَذَلِكَ أَتَتْك آيَتنَا فَنَسِيتهَا" </quran>تَرَكْتهَا وَلَمْ تُؤْمِن بِهَا <quran>"وَكَذَلِكَ" </quran>مِثْل نِسْيَانك آيَاتنَا <quran>"الْيَوْم تُنْسَى" </quran>تُتْرَك فِي النَّار</p></td></tr></table></body></html>
