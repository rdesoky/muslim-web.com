<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا يَأْتِيهِمْ مِنْ ذِكْرٍ مِنْ رَبِّهِمْ مُحْدَثٍ إِلَّا اسْتَمَعُوهُ وَهُمْ يَلْعَبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا يَأْتِيهِمْ مِنْ ذِكْر مِنْ رَبّهمْ مُحْدَث" </quran>شَيْئًا فَشَيْئًا أَيْ لَفْظ قُرْآن <quran>"إلَّا اسْتَمَعُوهُ وَهُمْ يَلْعَبُونَ" </quran>يَسْتَهْزِئُونَ</p></td></tr></table></body></html>
