<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا آمَنَتْ قَبْلَهُمْ مِنْ قَرْيَةٍ أَهْلَكْنَاهَا أَفَهُمْ يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا آمَنَتْ قَبْلهمْ مِنْ قَرْيَة" </quran>أَيْ أَهْلهَا <quran>"أَهْلَكْنَاهَا" </quran>بِتَكْذِيبِهَا مَا أَتَاهَا مِنْ الْآيَات <quran>"أَفَهُمْ يُؤْمِنُونَ" </quran>لَا</p></td></tr></table></body></html>
