<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا جَعَلْنَاهُمْ جَسَدًا لَا يَأْكُلُونَ الطَّعَامَ وَمَا كَانُوا خَالِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا جَعَلْنَاهُمْ" </quran>أَيْ الرُّسُل <quran>"جَسَدًا" </quran>بِمَعْنَى أَجْسَادًا <quran>"لَا يَأْكُلُونَ الطَّعَام" </quran>بَلْ يَأْكُلُونَهُ <quran>"وَمَا كَانُوا خَالِدِينَ" </quran>فِي الدُّنْيَا</p></td></tr></table></body></html>
