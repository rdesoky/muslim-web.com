<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ أَنْزَلْنَا إِلَيْكُمْ كِتَابًا فِيهِ ذِكْرُكُمْ أَفَلَا تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ أَنْزَلْنَا إلَيْكُمْ" </quran>يَا مَعْشَر قُرَيْش <quran>"كِتَابًا فِيهِ ذِكْركُمْ" </quran>لِأَنَّهُ بِلُغَتِكُمْ <quran>"أَفَلَا تَعْقِلُونَ" </quran>فَتُؤْمِنُونَ بِهِ</p></td></tr></table></body></html>
