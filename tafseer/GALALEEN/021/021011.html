<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَمْ قَصَمْنَا مِنْ قَرْيَةٍ كَانَتْ ظَالِمَةً وَأَنْشَأْنَا بَعْدَهَا قَوْمًا آخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَمْ قَصَمْنَا" </quran>أَهْلَكْنَا <quran>"مِنْ قَرْيَة" </quran>أَيْ أَهْلهَا <quran>"كَانَتْ ظَالِمَة" </quran>كَافِرَة</p></td></tr></table></body></html>
