<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا أَحَسُّوا بَأْسَنَا إِذَا هُمْ مِنْهَا يَرْكُضُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا أَحَسُّوا بَأْسنَا" </quran>شَعَرَ أَهْل الْقَرْيَة بِالْإِهْلَاكِ <quran>"إذَا هُمْ مِنْهَا يَرْكُضُونَ" </quran>يَهْرُبُونَ مُسْرِعِينَ</p></td></tr></table></body></html>
