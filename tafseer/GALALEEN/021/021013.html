<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَرْكُضُوا وَارْجِعُوا إِلَى مَا أُتْرِفْتُمْ فِيهِ وَمَسَاكِنِكُمْ لَعَلَّكُمْ تُسْأَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَتْ لَهُمْ الْمَلَائِكَة اسْتِهْزَاء <quran>"لَا تَرْكُضُوا وَارْجِعُوا إلَى مَا أُتْرِفْتُمْ" </quran>نُعِّمْتُمْ <quran>"فِيهِ وَمَسَاكِنكُمْ لَعَلَّكُمْ تُسْأَلُونَ" </quran>شَيْئًا مِنْ دُنْيَاكُمْ عَلَى الْعَادَة</p></td></tr></table></body></html>
