<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا خَلَقْنَا السَّمَاءَ وَالْأَرْضَ وَمَا بَيْنَهُمَا لَاعِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا خَلَقْنَا السَّمَاء وَالْأَرْض وَمَا بَيْنهمَا لَاعِبِينَ" </quran>عَابِثِينَ بَلْ دَالِّينَ عَلَى قُدْرَتنَا وَنَافِعِينَ عِبَادنَا</p></td></tr></table></body></html>
