<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُسَبِّحُونَ اللَّيْلَ وَالنَّهَارَ لَا يَفْتُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُسَبِّحُونَ اللَّيْل وَالنَّهَار لَا يَفْتُرُونَ" </quran>عَنْهُ فَهُوَ مِنْهُمْ كَالنَّفَسِ مِنَّا لَا يَشْغَلنَا عَنْهُ شَاغِل</p></td></tr></table></body></html>
