<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا اتَّخَذَ الرَّحْمَنُ وَلَدًا سُبْحَانَهُ بَلْ عِبَادٌ مُكْرَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا اتَّخَذَ الرَّحْمَن وَلَدًا" </quran>مِنْ الْمَلَائِكَة <quran>"سُبْحَانه بَلْ" </quran>هُمْ <quran>"عِبَاد مُكْرَمُونَ" </quran>عِنْده وَالْعُبُودِيَّة تُنَافِي الْوِلَادَة</p></td></tr></table></body></html>
