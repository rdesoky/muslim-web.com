<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُمْ بِأَمْرِهِ يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَسْبِقُونَهُ بِالْقَوْلِ" </quran>لَا يَأْتُونَ بِقَوْلِهِمْ إلَّا بَعْد قَوْله <quran>"وَهُمْ بِأَمْرِهِ يَعْمَلُونَ" </quran>أَيْ بَعْده</p></td></tr></table></body></html>
