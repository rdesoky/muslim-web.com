<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يَخْشَوْنَ رَبَّهُمْ بِالْغَيْبِ وَهُمْ مِنَ السَّاعَةِ مُشْفِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يَخْشَوْنَ رَبّهمْ بِالْغَيْبِ" </quran>عَنْ النَّاس أَيْ فِي الْخَلَاء عَنْهُمْ <quran>"وَهُمْ مِنْ السَّاعَة" </quran>أَيْ أَهْوَالهَا <quran>"مُشْفِقُونَ" </quran>خَائِفُونَ</p></td></tr></table></body></html>
