<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا هَذِهِ التَّمَاثِيلُ الَّتِي أَنْتُمْ لَهَا عَاكِفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ قَالَ لِأَبِيهِ وَقَوْمه مَا هَذِهِ التَّمَاثِيل" </quran>الْأَصْنَام <quran>"الَّتِي أَنْتُمْ لَهَا عَاكِفُونَ" </quran>أَيْ عَلَى عِبَادَتهَا مُقِيمُونَ</p></td></tr></table></body></html>
