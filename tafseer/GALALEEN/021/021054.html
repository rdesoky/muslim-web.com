<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَقَدْ كُنْتُمْ أَنْتُمْ وَآبَاؤُكُمْ فِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>لَهُمْ <quran>"لَقَدْ كُنْتُمْ أَنْتُمْ وَآبَاؤُكُمْ" </quran>بِعِبَادَتِهَا <quran>"فِي ضَلَال مُبِين" </quran>بَيِّن</p></td></tr></table></body></html>
