<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا مَنْ فَعَلَ هَذَا بِآلِهَتِنَا إِنَّهُ لَمِنَ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>بَعْد رُجُوعهمْ وَرُؤْيَتهمْ مَا فَعَلَ <quran>"مَنْ فَعَلَ هَذَا بِآلِهَتِنَا إنَّهُ لَمِنْ الظَّالِمِينَ" </quran>فِيهِ</p></td></tr></table></body></html>
