<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا سَمِعْنَا فَتًى يَذْكُرُهُمْ يُقَالُ لَهُ إِبْرَاهِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>أَيْ بَعْضهمْ لِبَعْضٍ <quran>"سَمِعْنَا فَتًى يَذْكُرهُمْ" </quran>أَيْ يَعِيبهُمْ</p></td></tr></table></body></html>
