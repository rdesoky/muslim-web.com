<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا فَأْتُوا بِهِ عَلَى أَعْيُنِ النَّاسِ لَعَلَّهُمْ يَشْهَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا فَأْتُوا بِهِ عَلَى أَعْيُن النَّاس" </quran>أَيْ ظَاهِرًا <quran>"لَعَلَّهُمْ يَشْهَدُونَ" </quran>عَلَيْهِ أَنَّهُ الْفَاعِل</p></td></tr></table></body></html>
