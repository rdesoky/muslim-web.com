<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَرَجَعُوا إِلَى أَنْفُسِهِمْ فَقَالُوا إِنَّكُمْ أَنْتُمُ الظَّالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَرَجَعُوا إلَى أَنْفُسهمْ" </quran>بِالتَّفَكُّرِ <quran>"فَقَالُوا" </quran>لِأَنْفُسِهِمْ <quran>"إنَّكُمْ أَنْتُمْ الظَّالِمُونَ" </quran>بِعِبَادَتِكُمْ مَنْ لَا يَنْطِق</p></td></tr></table></body></html>
