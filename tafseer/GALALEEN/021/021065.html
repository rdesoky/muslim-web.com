<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ نُكِسُوا عَلَى رُءُوسِهِمْ لَقَدْ عَلِمْتَ مَا هَؤُلَاءِ يَنْطِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ نُكِسُوا" </quran>مِنْ اللَّه <quran>"عَلَى رُءُوسهمْ" </quran>أَيْ رُدُّوا إلَى كُفْرهمْ وَقَالُوا وَاَللَّه <quran>"لَقَدْ عَلِمْت مَا هَؤُلَاءِ يَنْطِقُونَ" </quran>أَيْ فَكَيْفَ تَأْمُرنَا بِسُؤَالِهِمْ</p></td></tr></table></body></html>
