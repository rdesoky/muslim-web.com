<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَفَتَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَفَتَعْبُدُونَ مِنْ دُون اللَّه" </quran>أَيْ بَدَله <quran>"مَا لَا يَنْفَعكُمْ شَيْئًا" </quran>مِنْ رِزْق وَغَيْره <quran>"وَلَا يَضُرّكُمْ" </quran>شَيْئًا إذًا لَمْ تَعْبُدُوهُ</p></td></tr></table></body></html>
