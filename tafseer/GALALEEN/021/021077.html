<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَصَرْنَاهُ مِنَ الْقَوْمِ الَّذِينَ كَذَّبُوا بِآيَاتِنَا إِنَّهُمْ كَانُوا قَوْمَ سَوْءٍ فَأَغْرَقْنَاهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَصَرْنَاهُ" </quran>مَنَعْنَاهُ <quran>"مِنْ الْقَوْم الَّذِينَ كَذَّبُوا بِآيَاتِنَا" </quran>الدَّالَّة عَلَى رِسَالَته أَنْ لَا يَصِلُوا إلَيْهِ بِسُوءٍ</p></td></tr></table></body></html>
