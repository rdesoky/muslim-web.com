<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ كُلٌّ مِنَ الصَّابِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِسْمَاعِيل وَإِدْرِيس وَذَا الْكِفْل كُلّ مِنْ الصَّابِرِينَ" </quran>عَلَى طَاعَة اللَّه وَعَنْ مَعَاصِيه</p></td></tr></table></body></html>
