<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ وَكَذَلِكَ نُنْجِي الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنْ الْغَمّ" </quran>بِتِلْكَ الْكَلِمَات <quran>"وَكَذَلِكَ" </quran>كَمَا نَجَّيْنَاهُ <quran>"نُنْجِي الْمُؤْمِنِينَ" </quran>مِنْ كَرْبهمْ إذَا اسْتَغَاثُوا بِنَا دَاعِينَ</p></td></tr></table></body></html>
