<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاعْبُدُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ هَذِهِ" </quran>أَيْ مِلَّة الْإِسْلَام <quran>"أُمَّتكُمْ" </quran>دِينكُمْ أَيّهَا الْمُخَاطَبُونَ أَيْ يَجِب أَنْ تَكُونُوا عَلَيْهَا <quran>"أُمَّة وَاحِدَة" </quran>حَال لَازِمَة <quran>"وَأَنَا رَبّكُمْ فَاعْبُدُونِ" </quran>وَحِّدُونِ</p></td></tr></table></body></html>
