<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ وَهُوَ مُؤْمِنٌ فَلَا كُفْرَانَ لِسَعْيِهِ وَإِنَّا لَهُ كَاتِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَنْ يَعْمَل مِنْ الصَّالِحَات وَهُوَ مُؤْمِن فَلَا كُفْرَان" </quran>أَيْ لَا جُحُود <quran>"لِسَعْيِهِ وَإِنَّا لَهُ كَاتِبُونَ" </quran>بِأَنْ نَأْمُر الْحَفَظَة بِكَتْبِهِ فَنُجَازِيهِ عَلَيْهِ</p></td></tr></table></body></html>
