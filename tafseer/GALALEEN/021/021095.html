<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحَرَامٌ عَلَى قَرْيَةٍ أَهْلَكْنَاهَا أَنَّهُمْ لَا يَرْجِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحَرَام عَلَى قَرْيَة أَهْلَكْنَاهَا" </quran>أُرِيدَ أَهْلهَا <quran>"أَنَّهُمْ لَا" </quran>زَائِدَة <quran>"يَرْجِعُونَ" </quran>أَيْ مُمْتَنِع رُجُوعهمْ إلَى الدُّنْيَا</p></td></tr></table></body></html>
