<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكُمْ وَمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ حَصَبُ جَهَنَّمَ أَنْتُمْ لَهَا وَارِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّكُمْ" </quran>يَا أَهْل مَكَّة <quran>"وَمَا تَعْبُدُونَ مِنْ دُون اللَّه" </quran>أَيْ غَيْره مِنْ الْأَوْثَان <quran>"حَصَب جَهَنَّم" </quran>وَقُودهَا <quran>"أَنْتُمْ لَهَا وَارِدُونَ" </quran>دَاخِلُونَ فِيهَا</p></td></tr></table></body></html>
