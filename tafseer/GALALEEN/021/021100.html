<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُمْ فِيهَا زَفِيرٌ وَهُمْ فِيهَا لَا يَسْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُمْ" </quran>لِلْعَابِدِينَ <quran>"فِيهَا زَفِير وَهُمْ فِيهَا لَا يَسْمَعُونَ" </quran>شَيْئًا لِشِدَّةِ غَلَيَانهَا وَنَزَلَ لَمَّا قَالَ ابْن الزِّبَعْرَى عَبْد عُزَيْر وَالْمَسِيح وَالْمَلَائِكَة فَهُمْ فِي النَّار عَلَى مُقْتَضَى مَا تَقَدَّمَ</p></td></tr></table></body></html>
