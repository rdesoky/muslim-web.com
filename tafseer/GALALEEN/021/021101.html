<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ سَبَقَتْ لَهُمْ مِنَّا الْحُسْنَى أُولَئِكَ عَنْهَا مُبْعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ سَبَقَتْ لَهُمْ مِنَّا" </quran>الْمَنْزِلَة <quran>"الْحُسْنَى" </quran>وَمِنْهُمْ مَنْ ذُكِرَ</p></td></tr></table></body></html>
