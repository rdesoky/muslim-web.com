<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْمَعُونَ حَسِيسَهَا وَهُمْ فِي مَا اشْتَهَتْ أَنْفُسُهُمْ خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَسْمَعُونَ حَسِيسهَا" </quran>صَوْتهَا <quran>"وَهُمْ فِي مَا اشْتَهَتْ أَنْفُسهمْ" </quran>مِنْ النَّعِيم</p></td></tr></table></body></html>
