<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي هَذَا لَبَلَاغًا لِقَوْمٍ عَابِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ فِي هَذَا" </quran>الْقُرْآن <quran>"لَبَلَاغًا" </quran>كِفَايَة فِي دُخُول الْجَنَّة <quran>"لِقَوْمٍ عَابِدِينَ" </quran>عَامِلِينَ بِهِ</p></td></tr></table></body></html>
