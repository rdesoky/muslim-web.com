<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَرْسَلْنَاك" </quran>يَا مُحَمَّد <quran>"إلَّا رَحْمَة" </quran>أَيْ لِلرَّحْمَةِ <quran>"لِلْعَالَمِينَ" </quran>الْإِنْس وَالْجِنّ بِك</p></td></tr></table></body></html>
