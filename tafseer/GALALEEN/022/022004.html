<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُتِبَ عَلَيْهِ أَنَّهُ مَنْ تَوَلَّاهُ فَأَنَّهُ يُضِلُّهُ وَيَهْدِيهِ إِلَى عَذَابِ السَّعِيرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كُتِبَ عَلَيْهِ" </quran>قُضِيَ عَلَى الشَّيْطَان <quran>"أَنَّهُ مَنْ تَوَلَّاهُ" </quran>أَيْ اتَّبَعَهُ <quran>"فَأَنَّهُ يُضِلّهُ وَيَهْدِيهِ" </quran>يَدْعُوهُ <quran>"إلَى عَذَاب السَّعِير" </quran>أَيْ النَّار</p></td></tr></table></body></html>
