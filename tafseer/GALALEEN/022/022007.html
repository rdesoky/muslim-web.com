<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ السَّاعَةَ آتِيَةٌ لَا رَيْبَ فِيهَا وَأَنَّ اللَّهَ يَبْعَثُ مَنْ فِي الْقُبُورِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّ السَّاعَة آتِيَة لَا رَيْب" </quran>شَكّ <quran>"فِيهَا وَأَنَّ اللَّه يَبْعَث مَنْ فِي الْقُبُور" </quran>وَنَزَلَ فِي أَبِي جَهْل</p></td></tr></table></body></html>
