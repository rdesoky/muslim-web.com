<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنَ النَّاسِ مَنْ يُجَادِلُ فِي اللَّهِ بِغَيْرِ عِلْمٍ وَلَا هُدًى وَلَا كِتَابٍ مُنِيرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْ النَّاس مَنْ يُجَادِل فِي اللَّه بِغَيْرِ عِلْم وَلَا هُدًى" </quran>مَعَهُ <quran>"وَلَا كِتَاب مُنِير" </quran>لَهُ نُور مَعَهُ</p></td></tr></table></body></html>
