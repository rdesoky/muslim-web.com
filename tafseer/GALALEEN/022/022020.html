<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُصْهَرُ بِهِ مَا فِي بُطُونِهِمْ وَالْجُلُودُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُصْهَر" </quran>يُذَاب <quran>"بِهِ مَا فِي بُطُونهمْ" </quran>مِنْ شُحُوم وَغَيْرهَا <quran>"وَ" </quran>تُشْوَى بِهِ <quran>"الْجُلُود"</quran></p></td></tr></table></body></html>
