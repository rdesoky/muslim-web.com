<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُدُوا إِلَى الطَّيِّبِ مِنَ الْقَوْلِ وَهُدُوا إِلَى صِرَاطِ الْحَمِيدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَهُدُوا" </quran>فِي الدُّنْيَا <quran>"إلَى الطَّيِّب مِنْ الْقَوْل" </quran>وَهُوَ لَا إلَه إلَّا اللَّه <quran>"وَهُدُوا إلَى صِرَاط الْحَمِيد" </quran>أَيْ طَرِيق اللَّه الْمَحْمُودَة وَدِينه</p></td></tr></table></body></html>
