<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَأَيِّنْ مِنْ قَرْيَةٍ أَمْلَيْتُ لَهَا وَهِيَ ظَالِمَةٌ ثُمَّ أَخَذْتُهَا وَإِلَيَّ الْمَصِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَأَيِّنْ مِنْ قَرْيَة أَمْلَيْت لَهَا وَهِيَ ظَالِمَة ثُمَّ أَخَذْتهَا" </quran>الْمُرَاد أَهْلهَا <quran>"وَإِلَيَّ الْمَصِير" </quran>الْمَرْجِع</p></td></tr></table></body></html>
