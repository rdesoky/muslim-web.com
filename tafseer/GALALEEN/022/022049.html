<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَا أَيُّهَا النَّاسُ إِنَّمَا أَنَا لَكُمْ نَذِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ يَا أَيّهَا النَّاس" </quran>أَيْ أَهْل مَكَّة <quran>"إنَّمَا أَنَا لَكُمْ نَذِير مُبِين" </quran>بَيِّن الْإِنْذَار وَأَنَا بَشِير لِلْمُؤْمِنِينَ</p></td></tr></table></body></html>
