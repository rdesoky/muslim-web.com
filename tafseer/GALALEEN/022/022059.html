<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَيُدْخِلَنَّهُمْ مُدْخَلًا يَرْضَوْنَهُ وَإِنَّ اللَّهَ لَعَلِيمٌ حَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَيُدْخِلَنهُمْ مُدْخَلًا" </quran>بِضَمِّ الْمِيم وَفَتْحهَا أَيْ إدْخَالًا أَوْ مَوْضِعًا <quran>"يَرْضَوْنَهُ" </quran>وَهُوَ الْجَنَّة <quran>"وَإِنَّ اللَّه لَعَلِيم" </quran>بِنِيَّاتِهِمْ <quran>"حَلِيم" </quran>عَنْ عِقَابهمْ</p></td></tr></table></body></html>
