<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَإِنَّ اللَّهَ لَهُوَ الْغَنِيُّ الْحَمِيدُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُ مَا فِي السَّمَاوَات وَمَا فِي الْأَرْض" </quran>عَلَى جِهَة الْمِلْك <quran>"وَإِنَّ اللَّه لَهُوَ الْغَنِيّ" </quran>عَنْ عِبَاده <quran>"الْحَمِيد" </quran>لِأَوْلِيَائِهِ</p></td></tr></table></body></html>
