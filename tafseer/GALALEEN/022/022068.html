<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ جَادَلُوكَ فَقُلِ اللَّهُ أَعْلَمُ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ جَادَلُوك" </quran>فِي أَمْر الدِّين <quran>"فَقُلْ اللَّه أَعْلَم بِمَا تَعْمَلُونَ" </quran>فَيُجَازِيكُمْ عَلَيْهِ وَهَذَا قَبْل الْأَمْر بِالْقِتَالِ</p></td></tr></table></body></html>
