<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ يَحْكُمُ بَيْنَكُمْ يَوْمَ الْقِيَامَةِ فِيمَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه يَحْكُم بَيْنكُمْ" </quran>أَيّهَا الْمُؤْمِنُونَ وَالْكَافِرُونَ <quran>"يَوْم الْقِيَامَة فِيمَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ" </quran>بِأَنْ يَقُول كُلّ مِنْ الْفَرِيقَيْنِ خِلَاف قَوْل الْآخَر</p></td></tr></table></body></html>
