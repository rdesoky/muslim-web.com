<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا قَدَرُوا اللَّه" </quran>عَظَّمُوهُ <quran>"حَقّ قَدْره" </quran>عَظَمَته إذْ أَشْرَكُوا بِهِ مَا لَمْ يَمْتَنِع مِنْ الذُّبَاب وَلَا يَنْتَصِف مِنْهُ <quran>"إنَّ اللَّه لَقَوِيّ عَزِيز" </quran>غَالِب</p></td></tr></table></body></html>
