<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ خَلَقْنَا الْإِنْسَانَ مِنْ سُلَالَةٍ مِنْ طِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>اللَّهْ <quran>"لَقَدْ خَلَقْنَا الْإِنْسَان" </quran>آدَم <quran>"مِنْ سُلَالَة" </quran>هِيَ مِنْ سَلَلْت الشَّيْء مِنْ الشَّيْء أَيْ اسْتَخْرَجْته مِنْهُ وَهُوَ خُلَاصَته <quran>"مِنْ طِين" </quran>مُتَعَلِّق بِسُلَالَةٍ</p></td></tr></table></body></html>
