<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْزَلْنَا مِنَ السَّمَاءِ مَاءً بِقَدَرٍ فَأَسْكَنَّاهُ فِي الْأَرْضِ وَإِنَّا عَلَى ذَهَابٍ بِهِ لَقَادِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْزَلْنَا مِنْ السَّمَاء مَاء بِقَدَرٍ" </quran>مِنْ كِفَايَتهمْ <quran>"فَأَسْكَنَاهُ فِي الْأَرْض وَإِنَّا عَلَى ذَهَاب بِهِ لَقَادِرُونَ" </quran>فَيَمُوتُونَ مَعَ دَوَابّهمْ عَطَشًا</p></td></tr></table></body></html>
