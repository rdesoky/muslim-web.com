<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْشَأْنَا لَكُمْ بِهِ جَنَّاتٍ مِنْ نَخِيلٍ وَأَعْنَابٍ لَكُمْ فِيهَا فَوَاكِهُ كَثِيرَةٌ وَمِنْهَا تَأْكُلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَنْشَأْنَا لَكُمْ بِهِ جَنَّات مِنْ نَخِيل وَأَعْنَاب" </quran>هُمَا أَكْثَر فَوَاكِه الْعَرَب <quran>"لَكُمْ فِيهَا فَوَاكِه كَثِيرَة وَمِنْهَا تَأْكُلُونَ" </quran>صَيْفًا وَشِتَاء</p></td></tr></table></body></html>
