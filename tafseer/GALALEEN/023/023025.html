<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هُوَ إِلَّا رَجُلٌ بِهِ جِنَّةٌ فَتَرَبَّصُوا بِهِ حَتَّى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ هُوَ" </quran>مَا نُوح <quran>"إلَّا رَجُل بِهِ جِنَّة" </quran>حَالَة جُنُون <quran>"فَتَرَبَّصُوا بِهِ" </quran>انْتَظِرُوهُ <quran>"حَتَّى حِين" </quran>إلَى زَمَن مَوْته</p></td></tr></table></body></html>
