<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا اسْتَوَيْتَ أَنْتَ وَمَنْ مَعَكَ عَلَى الْفُلْكِ فَقُلِ الْحَمْدُ لِلَّهِ الَّذِي نَجَّانَا مِنَ الْقَوْمِ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا اسْتَوَيْت" </quran>اعْتَدَلْت <quran>"أَنْتَ وَمَنْ مَعَك عَلَى الْفُلْك فَقُلْ الْحَمْد لِلَّهِ الَّذِي نَجَّانَا مِنْ الْقَوْم الظَّالِمِينَ" </quran>الْكَافِرِينَ وَإِهْلَاكهمْ</p></td></tr></table></body></html>
