<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرْسَلْنَا فِيهِمْ رَسُولًا مِنْهُمْ أَنِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ أَفَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَرْسَلْنَا فِيهِمْ رَسُولًا مِنْهُمْ" </quran>هُودًا <quran>"أَنْ" </quran>بِأَنْ <quran>"اُعْبُدُوا اللَّه مَا لَكُمْ مِنْ إلَه غَيْره أَفَلَا تَتَّقُونَ" </quran>عِقَابه فَتُؤْمِنُونَ</p></td></tr></table></body></html>
