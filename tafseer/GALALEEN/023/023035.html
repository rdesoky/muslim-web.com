<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَعِدُكُمْ أَنَّكُمْ إِذَا مِتُّمْ وَكُنْتُمْ تُرَابًا وَعِظَامًا أَنَّكُمْ مُخْرَجُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَيَعِدُكُمْ أَنَّكُمْ إذَا مِتُّمْ وَكُنْتُمْ تُرَابًا وَعِظَامًا أَنَّكُمْ مُخْرَجُونَ" </quran>هُوَ خَبَر أَنَّكُمْ الْأُولَى وَأَنَّكُمْ الثَّانِيَة تَأْكِيد لَهَا لَمَّا طَالَ الْفَصْل</p></td></tr></table></body></html>
