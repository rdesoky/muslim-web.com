<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَيْهَاتَ هَيْهَاتَ لِمَا تُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَيْهَاتَ هَيْهَاتَ" </quran>اسْم فِعْل مَاضٍ بِمَعْنَى مَصْدَر : أَيْ بَعُدَ بَعُدَ <quran>"لِمَا تُوعَدُونَ" </quran>مِنْ الْإِخْرَاج مِنْ الْقُبُور وَاللَّام زَائِدَة لِلْبَيَانِ</p></td></tr></table></body></html>
