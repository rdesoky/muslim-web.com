<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا نَحْنُ بِمَبْعُوثِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ هِيَ" </quran>أَيْ مَا الْحَيَاة <quran>"إلَّا حَيَاتنَا الدُّنْيَا نَمُوت وَنَحْيَا" </quran>بِحَيَاةِ أَبْنَائِنَا</p></td></tr></table></body></html>
