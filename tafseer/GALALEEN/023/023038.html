<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هُوَ إِلَّا رَجُلٌ افْتَرَى عَلَى اللَّهِ كَذِبًا وَمَا نَحْنُ لَهُ بِمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ هُوَ" </quran>مَا الرَّسُول <quran>"إلَّا رَجُل افْتَرَى عَلَى وَمَا نَحْنُ لَهُ بِمُؤْمِنِينَ" </quran>مُصَدِّقِينَ بِالْبَعْثِ بَعْد الْمَوْت</p></td></tr></table></body></html>
