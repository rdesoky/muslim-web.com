<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ عَمَّا قَلِيلٍ لَيُصْبِحُنَّ نَادِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ عَمَّا قَلِيل" </quran>مِنْ الزَّمَان وَمَا زَائِدَة <quran>"لَيُصْبِحُنَّ" </quran>لَيَصِيرُنَّ <quran>"نَادِمِينَ" </quran>عَلَى كُفْرهمْ وَتَكْذِيبهمْ</p></td></tr></table></body></html>
