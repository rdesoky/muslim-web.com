<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا تَسْبِقُ مِنْ أُمَّةٍ أَجَلَهَا وَمَا يَسْتَأْخِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا تَسْبِق مِنْ أُمَّة أَجَلهَا" </quran>بِأَنْ تَمُوت قَبْله <quran>"وَمَا يَسْتَأْخِرُونَ" </quran>عَنْهُ ذُكِرَ الضَّمِير بَعْد تَأْنِيثه رِعَايَة لِلْمَعْنَى</p></td></tr></table></body></html>
