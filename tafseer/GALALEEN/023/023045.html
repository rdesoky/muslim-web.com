<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَرْسَلْنَا مُوسَى وَأَخَاهُ هَارُونَ بِآيَاتِنَا وَسُلْطَانٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ أَرْسَلْنَا مُوسَى وَأَخَاهُ هَارُون بِآيَاتِنَا وَسُلْطَان مُبِين" </quran>حُجَّة بَيِّنَة وَهِيَ الْيَد وَالْعَصَا وَغَيْرهمَا مِنْ الْآيَات</p></td></tr></table></body></html>
