<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى فِرْعَوْنَ وَمَلَئِهِ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا عَالِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَى فِرْعَوْن وَمَلَئِهِ فَاسْتَكْبَرُوا" </quran>عَنْ الْإِيمَان بِهَا وَبِاَللَّهِ <quran>"وَكَانُوا قَوْمًا عَالِينَ" </quran>قَاهِرِينَ بَنِي إسْرَائِيل بِالظُّلْمِ</p></td></tr></table></body></html>
