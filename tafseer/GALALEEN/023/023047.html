<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَالُوا أَنُؤْمِنُ لِبَشَرَيْنِ مِثْلِنَا وَقَوْمُهُمَا لَنَا عَابِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقَالُوا أَنُؤْمِنُ لِبَشَرَيْنِ مِثْلنَا وَقَوْمهمَا لَنَا عَابِدُونَ" </quran>مُطِيعُونَ خَاضِعُونَ</p></td></tr></table></body></html>
