<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ لَعَلَّهُمْ يَهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ آتَيْنَا مُوسَى الْكِتَاب" </quran>التَّوْرَاة <quran>"لَعَلَّهُمْ" </quran>قَوْمه بَنِي إسْرَائِيل <quran>"يَهْتَدُونَ" </quran>بِهِ مِنْ الضَّلَالَة وَأُوتِيَهَا بَعْد هَلَاك فِرْعَوْن وَقَوْمه جُمْلَة وَاحِدَة</p></td></tr></table></body></html>
