<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا إِنِّي بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَأَيُّهَا الرُّسُل كُلُوا مِنْ الطَّيِّبَات" </quran>الْحَلَالَاتِ <quran>"وَاعْمَلُوا صَالِحًا" </quran>مِنْ فَرْض وَنَفْل <quran>"إنِّي بِمَا تَعْمَلُونَ عَلِيم" </quran>فَأُجَازِيكُمْ عَلَيْهِ</p></td></tr></table></body></html>
