<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَرْهُمْ فِي غَمْرَتِهِمْ حَتَّى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَذَرْهُمْ" </quran>اُتْرُكْ كُفَّار مَكَّة <quran>"فِي غَمْرَتهمْ" </quran>ضَلَالَتهمْ <quran>"حَتَّى حِين" </quran>إلَى حِين مَوْتهمْ</p></td></tr></table></body></html>
