<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُونَ أَنَّمَا نُمِدُّهُمْ بِهِ مِنْ مَالٍ وَبَنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَيَحْسَبُونَ أَنَّمَا نُمِدّهُمْ بِهِ" </quran>نُعْطِيهِمْ <quran>"مِنْ مَال وَبَنِينَ" </quran>فِي الدُّنْيَا</p></td></tr></table></body></html>
