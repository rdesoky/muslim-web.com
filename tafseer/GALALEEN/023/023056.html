<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نُسَارِعُ لَهُمْ فِي الْخَيْرَاتِ بَل لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نُسَارِع" </quran>نُعَجِّل <quran>"لَهُمْ فِي الْخَيْرَات" </quran>لَا <quran>"بَلْ لَا يَشْعُرُونَ" </quran>أَنَّ ذَلِكَ اسْتِدْرَاج لَهُمْ</p></td></tr></table></body></html>
