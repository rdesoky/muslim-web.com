<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ هُمْ مِنْ خَشْيَةِ رَبِّهِمْ مُشْفِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ هُمْ مِنْ خَشْيَة رَبّهمْ" </quran>خَوْفهمْ مِنْهُ <quran>"مُشْفِقُونَ" </quran>خَائِفُونَ مِنْ عَذَابه</p></td></tr></table></body></html>
