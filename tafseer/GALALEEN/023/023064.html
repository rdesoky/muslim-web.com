<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>حَتَّى إِذَا أَخَذْنَا مُتْرَفِيهِمْ بِالْعَذَابِ إِذَا هُمْ يَجْأَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"حَتَّى" </quran>ابْتِدَائِيَّة <quran>"إذَا أَخَذْنَا مُتْرَفِيهِمْ" </quran>أَغْنِيَاءَهُمْ وَرُؤَسَاءَهُمْ <quran>"بِالْعَذَابِ" </quran>أَيْ السَّيْف يَوْم بَدْر <quran>"إذَا هُمْ يَجْأَرُونَ" </quran>يَضِجُّونَ يُقَال لَهُمْ</p></td></tr></table></body></html>
