<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَدْ كَانَتْ آيَاتِي تُتْلَى عَلَيْكُمْ فَكُنْتُمْ عَلَى أَعْقَابِكُمْ تَنْكِصُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَدْ كَانَتْ آيَاتِي" </quran>مِنْ الْقُرْآن <quran>"تُتْلَى عَلَيْكُمْ فَكُنْتُمْ عَلَى أَعْقَابكُمْ تَنْكِصُونَ" </quran>تَرْجِعُونَ الْقَهْقَرَى</p></td></tr></table></body></html>
