<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَخَذْنَاهُمْ بِالْعَذَابِ فَمَا اسْتَكَانُوا لِرَبِّهِمْ وَمَا يَتَضَرَّعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَخَذْنَاهُمْ بِالْعَذَابِ" </quran>الْجُوع <quran>"فَمَا اسْتَكَانُوا" </quran>تَوَاضَعُوا <quran>"لِرَبِّهِمْ وَمَا يَتَضَرَّعُونَ" </quran>يَرْغَبُونَ إلَى اللَّه بِالدُّعَاءِ</p></td></tr></table></body></html>
