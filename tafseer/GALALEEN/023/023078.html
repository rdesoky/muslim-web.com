<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الَّذِي أَنْشَأَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَا تَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَهُوَ الَّذِي أَنْشَأَ" </quran>خَلَقَ <quran>"لَكُمْ السَّمْع" </quran>بِمَعْنَى الْأَسْمَاع الْقُلُوب <quran>"وَالْأَبْصَار وَالْأَفْئِدَة" </quran>الْقُلُوب <quran>"قَلِيلًا مَا" </quran>تَأْكِيد لِلْقِلَّةِ</p></td></tr></table></body></html>
