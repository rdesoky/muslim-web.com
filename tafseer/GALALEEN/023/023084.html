<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لِمَنِ الْأَرْضُ وَمَنْ فِيهَا إِنْ كُنْتُمْ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"لِمَنْ الْأَرْض وَمَنْ فِيهَا" </quran>مِنْ الْخَلْق <quran>"إنْ كُنْتُمْ تَعْلَمُونَ" </quran>خَالِقهَا وَمَالِكهَا</p></td></tr></table></body></html>
