<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَقُولُونَ لِلَّهِ قُلْ أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَيَقُولُونَ لِلَّهِ قُلْ" </quran>لَهُمْ <quran>"أَفَلَا تَذَّكَّرُونَ" </quran>بِإِدْغَامِ التَّاء الثَّانِيَة فِي الذَّال تَتَّعِظُونَ فَتَعْلَمُونَ أَنَّ الْقَادِر عَلَى الْخَلْق ابْتِدَاء قَادِر عَلَى الْإِحْيَاء بَعْد الْمَوْت</p></td></tr></table></body></html>
