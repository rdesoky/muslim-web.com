<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ مَنْ رَبُّ السَّمَاوَاتِ السَّبْعِ وَرَبُّ الْعَرْشِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ مَنْ رَبّ السَّمَوَات السَّبْع وَرَبّ الْعَرْش الْعَظِيم" </quran>الْكُرْسِيّ</p></td></tr></table></body></html>
