<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ مَنْ بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَهُوَ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ إِنْ كُنْتُمْ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ مَنْ بِيَدِهِ مَلَكُوت" </quran>مُلْك وَالتَّاء لِلْمُبَالَغَةِ <quran>"وَهُوَ يُجِير وَلَا يُجَار عَلَيْهِ" </quran>يَحْمِي وَلَا يُحْمَى عَلَيْهِ</p></td></tr></table></body></html>
