<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ أَتَيْنَاهُمْ بِالْحَقِّ وَإِنَّهُمْ لَكَاذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ أَتَيْنَاهُمْ بِالْحَقِّ" </quran>بِالصِّدْقِ <quran>"وَإِنَّهُمْ لَكَاذِبُونَ" </quran>فِي نَفْيه وَهُوَ</p></td></tr></table></body></html>
