<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَتَعَالَى عَمَّا يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"عَالِم الْغَيْب وَالشَّهَادَة" </quran>مَا غَابَ وَمَا شُوهِدَ بِالْجَرِّ صِفَة وَالرَّفْع خَبَر هُوَ مُقَدَّرًا <quran>"فَتَعَالَى" </quran>تَعَظَّمَ <quran>"عَمَّا يُشْرِكُونَ" </quran>ـهُ مَعَهُ</p></td></tr></table></body></html>
