<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ رَبِّ إِمَّا تُرِيَنِّي مَا يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ رَبّ إمَّا" </quran>فِيهِ إدْغَام نُون إنْ الشَّرْطِيَّة فِي مَا الزَّائِدَة <quran>"تُرِيَنِّي مَا يُوعَدُونَ" </quran>يُوعَدُونَهُ مِنْ الْعَذَاب هُوَ صَادِق بِالْقَتْلِ بِبَدْرٍ</p></td></tr></table></body></html>
