<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقُلْ رَبّ أَعُوذ" </quran>أَعْتَصِم <quran>"بِك مِنْ هَمَزَات الشَّيَاطِين" </quran>نَزَعَاتهمْ بِمَا يُوَسْوِسُونَ بِهِ</p></td></tr></table></body></html>
