<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>حَتَّى إِذَا جَاءَ أَحَدَهُمُ الْمَوْتُ قَالَ رَبِّ ارْجِعُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"حَتَّى" </quran>ابْتِدَائِيَّة <quran>"إذَا جَاءَ أَحَدهمْ الْمَوْت" </quran>وَرَأَى مَقْعَده مِنْ النَّار وَمَقْعَده مِنْ الْجَنَّة لَوْ آمَنَ <quran>"قَالَ رَبّ ارْجِعُونِ" </quran>الْجَمْع لِلتَّعْظِيمِ</p></td></tr></table></body></html>
