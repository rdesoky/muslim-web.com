<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ ثَقُلَتْ مَوَازِينُهُ فَأُولَئِكَ هُمُ الْمُفْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَنْ ثَقُلَتْ مَوَازِينه" </quran>بِالْحَسَنَاتِ <quran>"فَأُولَئِكَ هُمْ الْمُفْلِحُونَ" </quran>الْفَائِزُونَ</p></td></tr></table></body></html>
