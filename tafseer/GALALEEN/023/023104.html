<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَلْفَحُ وُجُوهَهُمُ النَّارُ وَهُمْ فِيهَا كَالِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَلْفَح وُجُوههمْ النَّار" </quran>تُحْرِقهَا <quran>"وَهُمْ فِيهَا كَالِحُونَ" </quran>شَمَّرَتْ شِفَاههمْ الْعُلْيَا وَالسُّفْلَى عَنْ أَسْنَانهمْ وَيُقَال لَهُمْ</p></td></tr></table></body></html>
