<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ تَكُنْ آيَاتِي تُتْلَى عَلَيْكُمْ فَكُنْتُمْ بِهَا تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَمْ تَكُنْ آيَاتِي" </quran>مِنْ الْقُرْآن <quran>"تُتْلَى عَلَيْكُمْ" </quran>تُخَوَّفُونَ بِهَا</p></td></tr></table></body></html>
