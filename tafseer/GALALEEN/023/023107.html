<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبَّنَا أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا فَإِنَّا ظَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَبّنَا أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا" </quran>إلَى الْمُخَالَفَة</p></td></tr></table></body></html>
