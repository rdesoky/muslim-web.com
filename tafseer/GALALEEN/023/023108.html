<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ اخْسَئُوا فِيهَا وَلَا تُكَلِّمُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>لَهُمْ بِلِسَانِ مَالِك بَعْد قَدْر الدُّنْيَا مَرَّتَيْنِ <quran>"اخْسَئُوا فِيهَا" </quran>اُبْعُدُوا فِي النَّار أَذِلَّاء <quran>"وَلَا تُكَلِّمُونِ" </quran>فِي رَفْع الْعَذَاب عَنْكُمْ لِيَنْقَطِع رَجَاؤُهُمْ</p></td></tr></table></body></html>
