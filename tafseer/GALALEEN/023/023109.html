<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ كَانَ فَرِيقٌ مِنْ عِبَادِي يَقُولُونَ رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُ كَانَ فَرِيق مِنْ عِبَادِي" </quran>هُمْ الْمُهَاجِرُونَ</p></td></tr></table></body></html>
