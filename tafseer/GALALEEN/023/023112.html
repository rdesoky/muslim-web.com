<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ كَمْ لَبِثْتُمْ فِي الْأَرْضِ عَدَدَ سِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى لَهُمْ بِلِسَانِ مَالِك وَفِي قِرَاءَة قُلْ <quran>"كَمْ لَبِثْتُمْ فِي الْأَرْض" </quran>فِي الدُّنْيَا وَفِي قُبُوركُمْ <quran>"عَدَد سِنِينَ" </quran>تَمْيِيز</p></td></tr></table></body></html>
