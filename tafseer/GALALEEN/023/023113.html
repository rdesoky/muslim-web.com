<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ فَاسْأَلِ الْعَادِّينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْض يَوْم" </quran>شَكُّوا فِي ذَلِكَ وَاسْتَقْصَرُوهُ لِعِظَمِ مَا هُمْ فِيهِ مِنْ الْعَذَاب <quran>"فَاسْأَلْ الْعَادِّينَ" </quran>أَيْ الْمَلَائِكَة الْمُحْصِينَ أَعْمَال الْخَلْق</p></td></tr></table></body></html>
