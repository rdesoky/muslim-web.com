<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنْ لَبِثْتُمْ إِلَّا قَلِيلًا لَوْ أَنَّكُمْ كُنْتُمْ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى بِلِسَانِ مَالِك وَفِي قِرَاءَة قُلْ <quran>"إنْ" </quran>أَيْ مَا <quran>"لَبِثْتُمْ إلَّا قَلِيلًا لَوْ أَنَّكُمْ كُنْتُمْ تَعْلَمُونَ" </quran>مِقْدَار لُبْثكُمْ مِنْ الطُّول كَانَ قَلِيلًا بِالنِّسْبَةِ إلَى لُبْثكُمْ فِي النَّار</p></td></tr></table></body></html>
