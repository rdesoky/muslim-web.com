<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ لَا إِلَهَ إِلَّا هُوَ رَبُّ الْعَرْشِ الْكَرِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَتَعَالَى اللَّه" </quran>عَنْ الْعَبَث وَغَيْره مِمَّا لَا يَلِيق بِهِ <quran>"الْمَلِك الْحَقّ لَا إلَه إلَّا هُوَ رَبّ الْعَرْش الْكَرِيم" </quran>الْكُرْسِيّ : وَهُوَ السَّرِير الْحَسَن</p></td></tr></table></body></html>
