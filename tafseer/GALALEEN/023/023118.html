<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقُلْ رَبّ اغْفِرْ وَارْحَمْ" </quran>الْمُؤْمِنِينَ فِي الرَّحْمَة زِيَادَة عَنْ الْمَغْفِرَة <quran>"وَأَنْتَ خَيْر الرَّاحِمِينَ" </quran>أَفْضَل رَاحِم</p></td></tr></table></body></html>
