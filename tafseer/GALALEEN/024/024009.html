<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْخَامِسَةَ أَنَّ غَضَبَ اللَّهِ عَلَيْهَا إِنْ كَانَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالْخَامِسَة أَنَّ غَضَب اللَّه عَلَيْهَا إنْ كَانَ مِنْ الصَّادِقِينَ" </quran>فِي ذَلِكَ</p></td></tr></table></body></html>
