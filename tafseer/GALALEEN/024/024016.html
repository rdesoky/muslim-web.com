<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْلَا إِذْ سَمِعْتُمُوهُ قُلْتُمْ مَا يَكُونُ لَنَا أَنْ نَتَكَلَّمَ بِهَذَا سُبْحَانَكَ هَذَا بُهْتَانٌ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْلَا" </quran>هَلَّا <quran>"إذْ" </quran>حِين <quran>"سَمِعْتُمُوهُ قُلْتُمْ مَا يَكُون" </quran>مَا يَنْبَغِي <quran>"بِهَذَا" </quran>هُوَ لِلتَّعْجِيبِ هُنَا <quran>"هَذَا بُهْتَان" </quran>كَذِب</p></td></tr></table></body></html>
