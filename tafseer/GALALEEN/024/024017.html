<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعِظُكُمُ اللَّهُ أَنْ تَعُودُوا لِمِثْلِهِ أَبَدًا إِنْ كُنْتُمْ مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَعِظكُمْ اللَّه" </quran>يَنْهَاكُمْ <quran>"أَنْ تَعُودُوا لِمِثْلِهِ أَبَدًا إنْ كُنْتُمْ مُؤْمِنِينَ" </quran>تَتَّعِظُونَ بِذَلِكَ</p></td></tr></table></body></html>
