<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ وَاللَّهُ عَلِيمٌ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُبَيِّن اللَّه لَكُمْ الْآيَات" </quran>فِي الْأَمْر وَالنَّهْي <quran>"وَاَللَّه عَلِيم" </quran>بِمَا يَأْمُر بِهِ وَيَنْهَى عَنْهُ <quran>"حَكِيم" </quran>فِيهِ</p></td></tr></table></body></html>
