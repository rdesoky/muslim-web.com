<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ وَأَنَّ اللَّهَ رَءُوفٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْلَا فَضْل اللَّه عَلَيْكُمْ" </quran>أَيّهَا الْعُصْبَة <quran>"وَرَحْمَته وَأَنَّ اللَّه رَءُوف رَحِيم" </quran>بِكُمْ لَعَاجَلَكُمْ بِالْعُقُوبَةِ</p></td></tr></table></body></html>
