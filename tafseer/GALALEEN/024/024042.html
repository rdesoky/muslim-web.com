<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَى اللَّهِ الْمَصِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِلَّهِ مُلْك السَّمَاوَات وَالْأَرْض" </quran>خَزَائِن الْمَطَر وَالرِّزْق وَالنَّبَات <quran>"وَإِلَى اللَّه الْمَصِير" </quran>الْمَرْجِع</p></td></tr></table></body></html>
