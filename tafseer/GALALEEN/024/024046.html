<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ أَنْزَلْنَا آيَاتٍ مُبَيِّنَاتٍ وَاللَّهُ يَهْدِي مَنْ يَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ أَنْزَلْنَا آيَات مُبَيِّنَات" </quran>أَيْ بَيِّنَات هِيَ الْقُرْآن <quran>"وَاَللَّه يَهْدِي مَنْ يَشَاء إلَى صِرَاط" </quran>طَرِيق <quran>"مُسْتَقِيم" </quran>أَيْ دِين الْإِسْلَام</p></td></tr></table></body></html>
