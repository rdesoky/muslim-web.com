<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِنْهُمْ مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا دُعُوا إلَى اللَّه وَرَسُوله" </quran>الْمُبَلِّغ عَنْهُ <quran>"لِيَحْكُم بَيْنهمْ إذَا فَرِيق مِنْهُمْ مُعْرِضُونَ" </quran>عَنْ الْمَجِيء إلَيْهِ</p></td></tr></table></body></html>
