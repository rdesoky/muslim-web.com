<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ يَكُنْ لَهُمُ الْحَقُّ يَأْتُوا إِلَيْهِ مُذْعِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ يَكُنْ لَهُمْ الْحَقّ يَأْتُوا إلَيْهِ مُذْعِنِينَ" </quran>مُسْرِعِينَ طَائِعِينَ</p></td></tr></table></body></html>
