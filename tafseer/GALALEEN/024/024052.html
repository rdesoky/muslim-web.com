<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَئِكَ هُمُ الْفَائِزُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ يُطِعْ اللَّه وَرَسُوله وَيَخْشَ اللَّه" </quran>يَخَافهُ <quran>"وَيَتَّقْهِ" </quran>بِسُكُونِ الْهَاء وَكَسْرهَا بِأَنْ يُطِيعهُ <quran>"فَأُولَئِكَ هُمْ الْفَائِزُونَ" </quran>بِالْجَنَّةِ</p></td></tr></table></body></html>
