<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَطِيعُوا الرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَقِيمُوا الصَّلَاة وَآتُوا الزَّكَاة وَأَطِيعُوا الرَّسُول لَعَلَّكُمْ تُرْحَمُونَ" </quran>أَيْ رَجَاء الرَّحْمَة</p></td></tr></table></body></html>
