<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَنْزَلَهُ الَّذِي يَعْلَمُ السِّرَّ فِي السَّمَاوَاتِ وَالْأَرْضِ إِنَّهُ كَانَ غَفُورًا رَحِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ أَنْزَلَهُ الَّذِي يَعْلَم السِّرّ" </quran>الْغَيْب <quran>"فِي السَّمَاوَات وَالْأَرْض إنَّهُ كَانَ غَفُورًا" </quran>لِلْمُؤْمِنِينَ <quran>"رَحِيمًا" </quran>بِهِمْ</p></td></tr></table></body></html>
