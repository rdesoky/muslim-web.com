<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا مَالِ هَذَا الرَّسُولِ يَأْكُلُ الطَّعَامَ وَيَمْشِي فِي الْأَسْوَاقِ لَوْلَا أُنْزِلَ إِلَيْهِ مَلَكٌ فَيَكُونَ مَعَهُ نَذِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا مَال هَذَا الرَّسُول يَأْكُل الطَّعَام وَيَمْشِي فِي الْأَسْوَاق لَوْلَا" </quran>هَلَّا <quran>"أُنْزِلَ إلَيْهِ مَلَك فَيَكُون مَعَهُ نَذِيرًا" </quran>يُصَدِّقهُ</p></td></tr></table></body></html>
