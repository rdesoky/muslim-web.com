<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ كَذَّبُوا بِالسَّاعَةِ وَأَعْتَدْنَا لِمَنْ كَذَّبَ بِالسَّاعَةِ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ كَذَّبُوا بِالسَّاعَةِ" </quran>الْقِيَامَة <quran>"وَأَعْتَدْنَا لِمَنْ كَذَّبَ بِالسَّاعَةِ سَعِيرًا" </quran>نَارًا مُسَعَّرَة : أَيْ مُشْتَدَّة</p></td></tr></table></body></html>
