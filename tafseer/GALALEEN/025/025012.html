<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا رَأَتْهُمْ مِنْ مَكَانٍ بَعِيدٍ سَمِعُوا لَهَا تَغَيُّظًا وَزَفِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذَا رَأَتْهُمْ مِنْ مَكَان بَعِيد سَمِعُوا لَهَا تَغَيُّظًا" </quran>غَلَيَانًا كَالْغَضْبَانِ إذَا غَلَى صَدْره مِنْ الْغَضَب <quran>"وَزَفِيرًا" </quran>صَوْتًا شَدِيدًا أَوْ سَمَاع التَّغَيُّظ رُؤْيَته وَعِلْمه</p></td></tr></table></body></html>
