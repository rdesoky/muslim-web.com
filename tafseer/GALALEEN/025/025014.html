<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَدْعُوا الْيَوْمَ ثُبُورًا وَاحِدًا وَادْعُوا ثُبُورًا كَثِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا تَدْعُوا الْيَوْم ثُبُورًا وَاحِدًا وَادْعُوا ثُبُورًا كَثِيرًا" </quran>كَعَذَابِكُمْ</p></td></tr></table></body></html>
