<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْمُلْكُ يَوْمَئِذٍ الْحَقُّ لِلرَّحْمَنِ وَكَانَ يَوْمًا عَلَى الْكَافِرِينَ عَسِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"الْمُلْك يَوْمئِذٍ الْحَقّ لِلرَّحْمَنِ" </quran>لَا يَشْرَكهُ فِيهِ أَحَد <quran>"وَكَانَ" </quran>الْيَوْم <quran>"يَوْمًا عَلَى الْكَافِرِينَ عَسِيرًا" </quran>بِخِلَافِ الْمُؤْمِنِينَ</p></td></tr></table></body></html>
