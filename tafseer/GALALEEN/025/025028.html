<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا وَيْلَتَى لَيْتَنِي لَمْ أَتَّخِذْ فُلَانًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا وَيْلَتَى" </quran>أَلِفه عِوَض عَنْ يَاء الْإِضَافَة أَيْ وَيْلَتَى وَمَعْنَاهُ هَلَكَتِي <quran>"لَيْتَنِي لَمْ أَتَّخِذ فُلَانًا" </quran>أَيْ أُبَيًّا</p></td></tr></table></body></html>
