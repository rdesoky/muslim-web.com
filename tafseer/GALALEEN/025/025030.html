<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الرَّسُولُ يَا رَبِّ إِنَّ قَوْمِي اتَّخَذُوا هَذَا الْقُرْآنَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الرَّسُول" </quran>مُحَمَّد <quran>"يَا رَبّ إنَّ قَوْمِي" </quran>قُرَيْشًا <quran>"اتَّخَذُوا هَذَا الْقُرْآن مَهْجُورًا" </quran>مَتْرُوكًا</p></td></tr></table></body></html>
