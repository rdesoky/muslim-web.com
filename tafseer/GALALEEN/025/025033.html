<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَأْتُونَكَ بِمَثَلٍ إِلَّا جِئْنَاكَ بِالْحَقِّ وَأَحْسَنَ تَفْسِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا يَأْتُونَك بِمِثْلٍ" </quran>فِي إبْطَال أَمْرك <quran>"إلَّا جِئْنَاك بِالْحَقِّ" </quran>الدَّافِع لَهُ <quran>"وَأَحْسَن تَفْسِيرًا" </quran>بَيَانًا</p></td></tr></table></body></html>
