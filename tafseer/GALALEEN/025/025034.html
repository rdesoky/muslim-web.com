<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُحْشَرُونَ عَلَى وُجُوهِهِمْ إِلَى جَهَنَّمَ أُولَئِكَ شَرٌّ مَكَانًا وَأَضَلُّ سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p>هُمُ <quran>"الَّذِينَ يُحْشَرُونَ عَلَى وُجُوههمْ" </quran>أَيْ يُسَاقُونَ <quran>"إلَى جَهَنَّم أُولَئِكَ شَرّ مَكَانًا" </quran>هُوَ جَهَنَّم <quran>"وَأَضَلّ سَبِيلًا" </quran>أَخْطَأ طَرِيقًا مِنْ غَيْرهمْ وَهُوَ كُفْرهمْ</p></td></tr></table></body></html>
