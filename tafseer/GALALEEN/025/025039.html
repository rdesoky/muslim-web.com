<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلًّا ضَرَبْنَا لَهُ الْأَمْثَالَ وَكُلًّا تَبَّرْنَا تَتْبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكُلًّا ضَرَبْنَا لَهُ الْأَمْثَال" </quran>فِي إقَامَة الْحُجَّة عَلَيْهِمْ فَلَمْ نُهْلِكهُمْ إلَّا بَعْد الْإِنْذَار <quran>"وَكُلًّا تَبَّرْنَا تَتْبِيرًا" </quran>أَهْلَكْنَا إهْلَاكًا بِتَكْذِيبِهِمْ أَنْبِيَاءَهُمْ</p></td></tr></table></body></html>
