<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْكَ إِنْ يَتَّخِذُونَكَ إِلَّا هُزُوًا أَهَذَا الَّذِي بَعَثَ اللَّهُ رَسُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا رَأَوْك إنْ" </quran>مَا <quran>"يَتَّخِذُونَك إلَّا هُزُوًا" </quran>مَهْزُوءًا بِهِ يَقُولُونَ <quran>"أَهَذَا الَّذِي بَعَثَ اللَّه رَسُولًا" </quran>فِي دَعْوَاهُ مُحْتَقِرِينَ لَهُ عَنْ الرِّسَالَة</p></td></tr></table></body></html>
