<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ قَبَضْنَاهُ إِلَيْنَا قَبْضًا يَسِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ قَبَضْنَاهُ" </quran>أَيْ الظِّلّ الْمَمْدُود <quran>"إلَيْنَا قَبْضًا يَسِيرًا" </quran>خَفِيًّا بِطُلُوعِ الشَّمْس</p></td></tr></table></body></html>
