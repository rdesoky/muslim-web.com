<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ شِئْنَا لَبَعَثْنَا فِي كُلِّ قَرْيَةٍ نَذِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ شِئْنَا لَبَعَثْنَا فِي كُلّ قَرْيَة نَذِيرًا" </quran>يُخَوِّف أَهْلهَا وَلَكِنْ بَعَثْنَاك إلَى أَهْل الْقُرَى كُلّهَا نَذِيرًا لِيَعْظُم أَجْرك</p></td></tr></table></body></html>
