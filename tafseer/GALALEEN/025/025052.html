<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تُطِعِ الْكَافِرِينَ وَجَاهِدْهُمْ بِهِ جِهَادًا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا تُطِعْ الْكَافِرِينَ" </quran>فِي هَوَاهُمْ <quran>"وَجَاهِدْهُمْ بِهِ" </quran>أَيْ الْقُرْآن</p></td></tr></table></body></html>
