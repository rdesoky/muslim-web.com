<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يَبِيتُونَ لِرَبِّهِمْ سُجَّدًا وَقِيَامًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ يَبِيتُونَ لِرَبِّهِمْ سُجَّدًا" </quran>جَمْع سَاجِد <quran>"وَقِيَامًا" </quran>بِمَعْنَى قَائِمِينَ يُصَلُّونَ بِاللَّيْلِ</p></td></tr></table></body></html>
