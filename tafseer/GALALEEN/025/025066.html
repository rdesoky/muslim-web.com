<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهَا سَاءَتْ" </quran>بِئْسَ <quran>"مُسْتَقَرًّا وَمُقَامًا" </quran>هِيَ : أَيْ مَوْضِع اسْتِقْرَار وَإِقَامَة</p></td></tr></table></body></html>
