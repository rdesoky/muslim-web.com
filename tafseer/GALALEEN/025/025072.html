<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ لَا يَشْهَدُونَ الزُّور" </quran>أَيْ الْكَذِب وَالْبَاطِل <quran>"وَإِذَا مَرُّوا بِاللَّغْوِ" </quran>مِنْ الْكَلَام الْقَبِيح وَغَيْره <quran>"مَرُّوا كِرَامًا" </quran>مُعْرِضِينَ عَنْهُ</p></td></tr></table></body></html>
