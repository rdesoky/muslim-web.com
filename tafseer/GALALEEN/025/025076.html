<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا حَسُنَتْ مُسْتَقَرًّا وَمُقَامًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَالِدِينَ فِيهَا حَسُنَتْ مُسْتَقَرًّا وَمُقَامًا" </quran>مَوْضِع إقَامَة لَهُمْ وَأُولَئِكَ وَمَا بَعْده خَبَر عِبَاد الرَّحْمَن الْمُبْتَدَأ</p></td></tr></table></body></html>
