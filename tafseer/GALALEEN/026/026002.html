<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تِلْكَ" </quran>أَيْ هَذِهِ الْآيَات <quran>"آيَات الْكِتَاب" </quran>الْقُرْآن وَالْإِضَافَة بِمَعْنَى مِنْ <quran>"الْمُبِين" </quran>الْمُظْهِر الْحَقّ مِنْ الْبَاطِل</p></td></tr></table></body></html>
