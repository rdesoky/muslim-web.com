<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَعَلَّكَ بَاخِعٌ نَفْسَكَ أَلَّا يَكُونُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَعَلَّك" </quran>يَا مُحَمَّد <quran>"بَاخِع نَفْسك" </quran>قَاتِلْهَا غَمًّا مِنْ أَجْل <quran>"أَلَّا يَكُونُوا" </quran>أَيْ أَهْل مَكَّة <quran>"مُؤْمِنِينَ" </quran>وَلَعَلَّ هُنَا لِلْإِشْفَاقِ أَيْ أَشْفَقَ عَلَيْهَا بِتَخْفِيفِ هَذَا الْغَمّ</p></td></tr></table></body></html>
