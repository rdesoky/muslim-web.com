<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَأْتِيهِمْ مِنْ ذِكْرٍ مِنَ الرَّحْمَنِ مُحْدَثٍ إِلَّا كَانُوا عَنْهُ مُعْرِضِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا يَأْتِيهِمْ مِنْ ذِكْر" </quran>قُرْآن <quran>"مِنْ الرَّحْمَن مُحْدَث" </quran>صِفَة كَاشِفَة</p></td></tr></table></body></html>
