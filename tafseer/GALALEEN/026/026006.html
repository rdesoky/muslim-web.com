<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَدْ كَذَّبُوا فَسَيَأْتِيهِمْ أَنْبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقَدْ كَذَّبُوا" </quran>بِهِ <quran>"فَسَتَأْتِيهِمْ أَنْبَاء" </quran>عَوَاقِب</p></td></tr></table></body></html>
