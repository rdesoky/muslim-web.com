<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوَلَمْ يَرَوْا إِلَى الْأَرْضِ كَمْ أَنْبَتْنَا فِيهَا مِنْ كُلِّ زَوْجٍ كَرِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوَلَمْ يَرَوْا" </quran>يَنْظُرُوا <quran>"إلَى الْأَرْض كَمْ أَنْبَتْنَا فِيهَا" </quran>أَيْ كَثِيرًا <quran>"مِنْ كُلّ زَوْج كَرِيم" </quran>نَوْع حَسَن</p></td></tr></table></body></html>
