<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ نَادَى رَبُّكَ مُوسَى أَنِ ائْتِ الْقَوْمَ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>وَاذْكُرْ <quran>"إذْ نَادَى رَبّك مُوسَى" </quran>لَيْلَة رَأَى النَّار وَالشَّجَرَة <quran>"أَنْ" </quran>أَيْ : بِأَنْ <quran>"ائْتِ الْقَوْم الظَّالِمِينَ" </quran>رَسُولًا</p></td></tr></table></body></html>
