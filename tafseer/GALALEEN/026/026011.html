<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَوْمَ فِرْعَوْنَ أَلَا يَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَوْم فِرْعَوْن" </quran>مَعَهُ ظَلَمُوا أَنْفُسهمْ بِالْكُفْرِ بِاَللَّهِ وَبَنِي إسْرَائِيل بِاسْتِعْبَادِهِمْ <quran>"أَلَا" </quran>الْهَمْزَة لِلِاسْتِفْهَامِ الْإِنْكَارِيّ <quran>"يَتَّقُونَ" </quran>اللَّه بِطَاعَتِهِ فَيُوَحِّدُونَهُ</p></td></tr></table></body></html>
