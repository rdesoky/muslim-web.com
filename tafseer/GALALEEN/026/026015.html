<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ كَلَّا فَاذْهَبَا بِآيَاتِنَا إِنَّا مَعَكُمْ مُسْتَمِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>تَعَالَى <quran>"كَلَّا" </quran>لَا يَقْتُلُونَك <quran>"فَاذْهَبَا" </quran>أَيْ أَنْتَ وَأَخُوك , فَفِيهِ تَغْلِيب الْحَاضِر عَلَى الْغَائِب <quran>"بِآيَاتِنَا إنَّا مَعَكُمْ مُسْتَمِعُونَ" </quran>مَا تَقُولُونَ وَمَا يُقَال لَكُمْ , أُجْرِيَا مَجْرَى الْجَمَاعَة</p></td></tr></table></body></html>
