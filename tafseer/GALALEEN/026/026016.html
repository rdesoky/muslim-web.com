<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأْتِيَا فِرْعَوْنَ فَقُولَا إِنَّا رَسُولُ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأْتِيَا فِرْعَوْن فَقُولَا إنَّا" </quran>كُلًّا مِنَّا <quran>"رَسُول رَبّ الْعَالَمِينَ" </quran>إلَيْك</p></td></tr></table></body></html>
