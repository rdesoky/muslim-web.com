<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ أَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنْ" </quran>أَيْ : بِأَنْ <quran>"أَرْسِلْ مَعَنَا" </quran>إلَى الشَّام <quran>"بَنِي إسْرَائِيل" </quran>فَأْتِيَاهُ فَقَالَا لَهُ مَا ذُكِرَ</p></td></tr></table></body></html>
