<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَعَلْتَ فَعْلَتَكَ الَّتِي فَعَلْتَ وَأَنْتَ مِنَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفَعَلْت فَعْلَتَك الَّتِي فَعَلْت" </quran>هِيَ قَتْله الْقِبْطِيّ <quran>"وَأَنْتَ مِنْ الْكَافِرِينَ" </quran>الْجَاحِدِينَ لِنِعْمَتِي عَلَيْك بِالتَّرْبِيَةِ وَعَدَم الِاسْتِعْبَاد</p></td></tr></table></body></html>
