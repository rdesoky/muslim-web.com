<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَعَلْتُهَا إِذًا وَأَنَا مِنَ الضَّالِّينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"فَعَلْتهَا إذًا" </quran>أَيْ حِينَئِذٍ <quran>"وَأَنَا مِنْ الضَّالِّينَ" </quran>عَمًّا آتَانِي اللَّه بَعْدهَا مِنْ الْعِلْم وَالرِّسَالَة</p></td></tr></table></body></html>
