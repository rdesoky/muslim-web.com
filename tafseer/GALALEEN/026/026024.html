<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ مُوقِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ السَّمَاوَات وَالْأَرْض وَمَا بَيْنهمَا" </quran>أَيْ خَالِق ذَلِكَ <quran>"إنْ كُنْتُمْ مُوقِنِينَ" </quran>بِأَنَّهُ تَعَالَى خَالِقه فَآمِنُوا بِهِ وَحْده</p></td></tr></table></body></html>
