<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>فِرْعَوْن <quran>"لِمَنْ حَوْله" </quran>مِنْ أَشْرَاف قَوْمه <quran>"أَلَا تَسْتَمِعُونَ" </quran>جَوَابه الَّذِي لَمْ يُطَابِق السُّؤَال</p></td></tr></table></body></html>
