<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"رَبّكُمْ وَرَبّ آبَائِكُمْ الْأَوَّلِينَ" </quran>وَهَذَا وَإِنْ كَانَ دَاخِلًا فِيمَا قَبْله يَغِيظ فِرْعَوْن وَلِذَلِكَ</p></td></tr></table></body></html>
