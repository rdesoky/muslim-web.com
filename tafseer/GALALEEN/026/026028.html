<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"رَبّ الْمَشْرِق وَالْمَغْرِب وَمَا بَيْنهمَا إنْ كُنْتُمْ تَعْقِلُونَ" </quran>أَنَّهُ كَذَلِكَ فَآمِنُوا بِهِ وَحْده</p></td></tr></table></body></html>
