<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَئِنِ اتَّخَذْتَ إِلَهًا غَيْرِي لَأَجْعَلَنَّكَ مِنَ الْمَسْجُونِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>فِرْعَوْن لِمُوسَى <quran>"لَئِنْ اتَّخَذْت إلَهًا غَيْرِي لَأَجْعَلَنك مِنْ الْمَسْجُونِينَ" </quran>كَانَ سِجْنه شَدِيدًا يَحْبِس الشَّخْص فِي مَكَان تَحْت الْأَرْض وَحْده لَا يُبْصِر وَلَا يَسْمَع فِيهِ أَحَدًا</p></td></tr></table></body></html>
