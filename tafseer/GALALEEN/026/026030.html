<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>لَهُ مُوسَى <quran>"أَوَلَوْ" </quran>أَيْ : أَتَفْعَلُ ذَلِك وَلَوْ <quran>"جِئْتُك بِشَيْءٍ مُبِين" </quran>بُرْهَان بَيِّن عَلَى رِسَالَتِي</p></td></tr></table></body></html>
