<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَرْجِهْ وَأَخَاهُ وَابْعَثْ فِي الْمَدَائِنِ حَاشِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا أَرْجِهِ وَأَخَاهُ" </quran>أَخِّرْ أَمْرهمَا <quran>"وَابْعَثْ فِي الْمَدَائِن حَاشِرِينَ" </quran>جَامِعِينَ</p></td></tr></table></body></html>
