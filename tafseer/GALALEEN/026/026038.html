<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَجُمِعَ السَّحَرَةُ لِمِيقَاتِ يَوْمٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَجُمِعَ السَّحَرَة لِمِيقَاتِ يَوْم مَعْلُوم" </quran>وَهُوَ وَقْت الضُّحَى مِنْ يَوْم الزِّينَة</p></td></tr></table></body></html>
