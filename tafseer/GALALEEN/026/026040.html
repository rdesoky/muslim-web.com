<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَعَلَّنَا نَتَّبِعُ السَّحَرَةَ إِنْ كَانُوا هُمُ الْغَالِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَالتَّرَجِّي عَلَى تَقْدِير غَلَبَتهمْ لِيَسْتَمِرُّوا عَلَى دِينهمْ فَلَا يَتْبَعُوا مُوسَى</p></td></tr></table></body></html>
