<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ لَهُمْ مُوسَى" </quran>بَعْدَمَا قَالُوا لَهُ <quran>"إمَّا أَنْ تُلْقِي وَإِمَّا أَنْ نَكُون نَحْنُ الْمُلْقِينَ" </quran><quran>"أَلْقُوا مَا أَنْتُمْ مُلْقُونَ" </quran>فَالْأَمْر فِيهِ لِلْإِذْنِ بِتَقْدِيمِ إلْقَائِهِمْ تَوَسُّلًا بِهِ إلَى إظْهَار الْحَقّ</p></td></tr></table></body></html>
