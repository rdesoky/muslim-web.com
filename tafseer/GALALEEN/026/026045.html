<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَلْقَى مُوسَى عَصَاهُ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَلْقَى مُوسَى عَصَاهُ فَإِذَا هِيَ تَلْقَف" </quran>بِحَذْفِ إحْدَى التَّاءَيْنِ مِنْ الْأَصْل تَبْتَلِع <quran>"مَا يَأْفِكُونَ" </quran>يَقْلِبُونَهُ بِتَمْوِيهِهِمْ فَيُخَيِّلُونَ حِبَالهمْ وَعِصِيّهمْ أَنَّهَا حَيَّات تَسْعَى</p></td></tr></table></body></html>
