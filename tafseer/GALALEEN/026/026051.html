<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَطْمَعُ أَنْ يَغْفِرَ لَنَا رَبُّنَا خَطَايَانَا أَنْ كُنَّا أَوَّلَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا نَطْمَع" </quran>نَرْجُو <quran>"أَنْ يَغْفِر لَنَا رَبّنَا خَطَايَانَا أَنْ" </quran>أَيْ بِأَنْ <quran>"كُنَّا أَوَّل الْمُؤْمِنِينَ" </quran>فِي زَمَاننَا</p></td></tr></table></body></html>
