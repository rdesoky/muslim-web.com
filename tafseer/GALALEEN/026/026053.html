<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرْسَلَ فِرْعَوْنُ فِي الْمَدَائِنِ حَاشِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَرْسَلَ فِرْعَوْن" </quran>حِين أَخْبَرَ بِسَيْرِهِمْ <quran>"فِي الْمَدَائِن" </quran>قِيلَ كَانَ لَهُ أَلْف مَدِينَة وَاثْنَا عَشَر أَلْف قَرْيَة <quran>"حَاشِرِينَ" </quran>جَامِعِينَ الْجَيْش قَائِلًا</p></td></tr></table></body></html>
