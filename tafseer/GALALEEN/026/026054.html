<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ هَؤُلَاءِ لَشِرْذِمَة" </quran>طَائِفَة <quran>"قَلِيلُونَ" </quran>قِيلَ كَانُوا سِتّمِائَةِ أَلْف وَسَبْعِينَ أَلْفًا وَمُقَدَّمَة جَيْشه سَبْعمِائَةِ أَلْف فَقَلَّلَهُمْ بِالنَّظَرِ إلَى كَثْرَة جَيْشه</p></td></tr></table></body></html>
