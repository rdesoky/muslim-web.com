<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخْرَجْنَاهُمْ مِنْ جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَخْرَجْنَاهُمْ" </quran>أَيْ فِرْعَوْن وَقَوْمه مِنْ مِصْر لِيَلْحَقُوا مُوسَى وَقَوْمه <quran>"مِنْ جَنَّات" </quran>بَسَاتِين كَانَتْ عَلَى جَانِبَيْ النِّيل <quran>"وَعُيُون" </quran>أَنْهَار جَارِيَة فِي الدُّور مِنْ النِّيل</p></td></tr></table></body></html>
