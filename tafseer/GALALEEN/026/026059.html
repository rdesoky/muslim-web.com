<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ وَأَوْرَثْنَاهَا بَنِي إِسْرَائِيلَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ" </quran>أَيْ إخْرَاجنَا كَمَا وَصَفْنَا <quran>"وَأَوْرَثْنَاهَا بَنِي إسْرَائِيل" </quran>بَعْد إغْرَاق فِرْعَوْن وَقَوْمه :</p></td></tr></table></body></html>
