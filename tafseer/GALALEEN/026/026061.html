<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا تَرَاءَى الْجَمْعَانِ قَالَ أَصْحَابُ مُوسَى إِنَّا لَمُدْرَكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا تَرَاءَى الْجَمْعَانِ" </quran>رَأَى كُلّ مِنْهُمَا الْآخَر <quran>"قَالَ أَصْحَاب مُوسَى إنَّا لَمُدْرَكُونَ" </quran>يُدْرِكنَا جَمْع فِرْعَوْن وَلَا طَاقَة لَنَا بِهِ</p></td></tr></table></body></html>
