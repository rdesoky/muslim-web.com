<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ كَلَّا إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُوسَى <quran>"كَلَّا" </quran>أَيْ لَنْ يُدْرِكُونَا <quran>"إنَّ مَعِيَ رَبِّي" </quran>بِنَصْرِهِ <quran>"سَيَهْدِينِ" </quran>طَرِيق النَّجَاة</p></td></tr></table></body></html>
