<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَزْلَفْنَا ثَمَّ الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَزْلَفْنَا" </quran>قَرَّبْنَا <quran>"ثَمَّ" </quran>هُنَاكَ <quran>"الْآخِرِينَ" </quran>فِرْعَوْن وَقَوْمه حَتَّى سَلَكُوا مَسَالِكهمْ</p></td></tr></table></body></html>
