<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْجَيْنَا مُوسَى وَمَنْ مَعَهُ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْجَيْنَا مُوسَى وَمَنْ مَعَهُ أَجْمَعِينَ" </quran>بِإِخْرَاجِهِمْ مِنْ الْبَحْر عَلَى هَيْئَته الْمَذْكُورَة</p></td></tr></table></body></html>
