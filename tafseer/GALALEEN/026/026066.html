<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَغْرَقْنَا الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ أَغْرَقْنَا الْآخَرِينَ" </quran>فِرْعَوْن وَقَوْمه بِإِطْبَاقِ الْبَحْر عَلَيْهِمْ لَمَّا تَمَّ دُخُولهمْ فِي الْبَحْر وَخُرُوج بَنِي إسْرَائِيل مِنْهُ</p></td></tr></table></body></html>
