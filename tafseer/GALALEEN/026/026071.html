<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا نَعْبُدُ أَصْنَامًا فَنَظَلُّ لَهَا عَاكِفِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا نَعْبُد أَصْنَامًا" </quran>صَرَّحُوا بِالْفِعْلِ لِيَعْطِفُوا عَلَيْهِ <quran>"فَنَظَلّ لَهَا عَاكِفِينَ" </quran>نُقِيم نَهَارًا عَلَى عِبَادَتهَا زَادُوهُ فِي الْجَوَاب افْتِخَارًا بِهِ</p></td></tr></table></body></html>
