<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّهُمْ عَدُوٌّ لِي إِلَّا رَبَّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنَّهُمْ عَدُوّ لِي" </quran>لَا أَعْبُدهُمْ <quran>"إلَّا" </quran>لَكِنْ <quran>"رَبّ الْعَالَمِينَ" </quran>فَإِنِّي أَعْبُدهُ</p></td></tr></table></body></html>
