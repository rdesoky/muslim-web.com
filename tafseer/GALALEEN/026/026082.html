<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِي أَطْمَع" </quran>أَرْجُو <quran>"أَنْ يَغْفِر لِي خَطِيئَتِي يَوْم الدِّين" </quran>الْجَزَاء</p></td></tr></table></body></html>
