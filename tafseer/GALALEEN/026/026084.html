<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاجْعَلْ لِي لِسَان صِدْق" </quran>ثَنَاء حَسَنًا <quran>"فِي الْآخِرِينَ" </quran>الَّذِينَ يَأْتُونَ بَعْدِي إلَى يَوْم الْقِيَامَة</p></td></tr></table></body></html>
