<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا" </quran>لَكِنْ <quran>"مَنْ أَتَى اللَّه بِقَلْبٍ سَلِيم" </quran>مِنْ الشِّرْك وَالنِّفَاق وَهُوَ قَلْب الْمُؤْمِن فَإِنَّهُ يَنْفَعهُ ذَلِكَ</p></td></tr></table></body></html>
