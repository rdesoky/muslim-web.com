<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ دُونِ اللَّهِ هَلْ يَنْصُرُونَكُمْ أَوْ يَنْتَصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مِنْ دُون اللَّه" </quran>أَيْ غَيْره مِنْ الْأَصْنَام <quran>"هَلْ يَنْصُرُونَكُمْ" </quran>بِدَفْعِ الْعَذَاب عَنْكُمْ <quran>"أَوْ يَنْتَصِرُونَ" </quran>بِدَفْعِهِ عَنْ أَنْفُسهمْ , لَا</p></td></tr></table></body></html>
