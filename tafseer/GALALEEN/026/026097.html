<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَاللَّهِ إِنْ كُنَّا لَفِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَاللَّهِ إنْ" </quran>مُخَفَّفَة مِنْ الثَّقِيلَة وَاسْمهَا مَحْذُوف أَيْ إنَّهُ <quran>"كُنَّا لَفِي ضَلَال مُبِين" </quran>بَيِّن</p></td></tr></table></body></html>
