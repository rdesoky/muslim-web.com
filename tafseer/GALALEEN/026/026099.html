<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَضَلَّنَا إِلَّا الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَضَلَّنَا" </quran>عَنْ الْهُدَى <quran>"إلَّا الْمُجْرِمُونَ" </quran>أَيْ الشَّيَاطِين أَوْ أَوَّلُونَا الَّذِينَ اقْتَدَيْنَا بِهِمْ</p></td></tr></table></body></html>
