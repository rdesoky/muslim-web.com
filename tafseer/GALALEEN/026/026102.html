<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَوْ أَنَّ لَنَا كَرَّة" </quran>رَجْعَة إلَى الدُّنْيَا <quran>"فَنَكُون مِنْ الْمُؤْمِنِينَ" </quran>لَوْ هُنَا لِلتَّمَنِّي وَنَكُون جَوَابه</p></td></tr></table></body></html>
