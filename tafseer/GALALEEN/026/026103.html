<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي ذَلِكَ لَآيَةً وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ فِي ذَلِكَ" </quran>الْمَذْكُور مِنْ قِصَّة إبْرَاهِيم وَقَوْمه</p></td></tr></table></body></html>
