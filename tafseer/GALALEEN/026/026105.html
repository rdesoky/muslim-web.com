<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ قَوْمُ نُوحٍ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَتْ قَوْم نُوح الْمُرْسَلِينَ" </quran>بِتَكْذِيبِهِمْ لَهُ لِاشْتِرَاكِهِمْ فِي الْمَجِيء بِالتَّوْحِيدِ , أَوْ لِأَنَّهُ لِطُولِ لُبْثه فِيهِمْ كَأَنَّهُ رُسُل وَتَأْنِيث قَوْم بِاعْتِبَارِ مَعْنَاهُ وَتَذْكِيره بِاعْتِبَارِ لَفْظه</p></td></tr></table></body></html>
