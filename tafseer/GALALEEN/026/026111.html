<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَنُؤْمِنُ لَكَ وَاتَّبَعَكَ الْأَرْذَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا أَنُؤْمِنُ" </quran>نُصَدِّق <quran>"لَك" </quran>لِقَوْلِك <quran>"وَاتَّبَعَك" </quran>وَفِي قِرَاءَة وَأَتْبَاعك جَمْع تَابِع مُبْتَدَأ <quran>"الْأَرْذَلُونَ" </quran>السَّفَلَة كَالْحَاكَةِ وَالْأَسَاكِفَة</p></td></tr></table></body></html>
