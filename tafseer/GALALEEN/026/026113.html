<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ حِسَابُهُمْ إِلَّا عَلَى رَبِّي لَوْ تَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ" </quran>مَا <quran>"حِسَابهمْ إلَّا عَلَى رَبِّي" </quran>فَيُجَازِيهِمْ <quran>"لَوْ تَشْعُرُونَ" </quran>تَعْلَمُونَ ذَلِكَ مَا عَبَدْتُمُوهُمْ</p></td></tr></table></body></html>
