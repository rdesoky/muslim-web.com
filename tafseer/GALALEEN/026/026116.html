<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا نُوحُ لَتَكُونَنَّ مِنَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا نُوح" </quran>عَمَّا تَقُول لَنَا <quran>"لَتَكُونَن مِنْ الْمَرْجُومِينَ" </quran>بِالْحِجَارَةِ أَوْ بِالشَّتْمِ</p></td></tr></table></body></html>
