<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَافْتَحْ بَيْنِي وَبَيْنَهُمْ فَتْحًا وَنَجِّنِي وَمَنْ مَعِيَ مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَافْتَحْ بَيْنِي وَبَيْنهمْ فَتْحًا" </quran>أَيْ اُحْكُمْ</p></td></tr></table></body></html>
