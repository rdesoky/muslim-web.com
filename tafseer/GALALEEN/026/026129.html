<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَتَّخِذُونَ مَصَانِعَ لَعَلَّكُمْ تَخْلُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَتَّخِذُونَ مَصَانِع" </quran>لِلْمَاءِ تَحْت الْأَرْض <quran>"لَعَلَّكُمْ" </quran>كَأَنَّكُمْ <quran>"تَخْلُدُونَ" </quran>فِيهَا لَا تَمُوتُونَ</p></td></tr></table></body></html>
