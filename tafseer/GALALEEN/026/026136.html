<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا سَوَاءٌ عَلَيْنَا أَوَعَظْتَ أَمْ لَمْ تَكُنْ مِنَ الْوَاعِظِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا سَوَاء عَلَيْنَا" </quran>مُسْتَوٍ عِنْدنَا <quran>"أَوَعَظْت أَمْ لَمْ تَكُنْ مِنْ الْوَاعِظِينَ" </quran>أَصْلًا أَيْ لَا نَرْعَوِي لِوَعْظِك</p></td></tr></table></body></html>
