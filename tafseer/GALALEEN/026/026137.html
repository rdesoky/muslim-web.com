<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هَذَا إِلَّا خُلُقُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ" </quran>مَا <quran>"هَذَا" </quran>الَّذِي خَوَّفْتنَا بِهِ <quran>"إلَّا خُلُق الْأَوَّلِينَ" </quran>اخْتِلَاقهمْ وَكَذِبهمْ وَفِي قِرَاءَة بِضَمِّ الْخَاء وَاللَّام أَيْ مَا هَذَا الَّذِي نَحْنُ عَلَيْهِ مِنْ إنْكَار لِلْبَعْثِ إلَّا خَلْق الْأَوَّلِينَ أَيْ طَبِيعَتهمْ وَعَادَتهمْ</p></td></tr></table></body></html>
