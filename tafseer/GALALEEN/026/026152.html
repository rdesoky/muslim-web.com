<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُفْسِدُونَ فِي الْأَرْضِ وَلَا يُصْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يُفْسِدُونَ فِي الْأَرْض" </quran>بِالْمَعَاصِي <quran>"وَلَا يُصْلِحُونَ" </quran>بِطَاعَةِ اللَّه</p></td></tr></table></body></html>
