<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّمَا أَنْتَ مِنَ الْمُسَحَّرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا إنَّمَا أَنْتَ مِنْ الْمُسَحَّرِينَ" </quran>الَّذِينَ سَحَرُوا كَثِيرًا حَتَّى غَلَبَ عَلَى عَقْلهمْ</p></td></tr></table></body></html>
