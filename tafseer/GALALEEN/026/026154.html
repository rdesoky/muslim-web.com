<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا فَأْتِ بِآيَةٍ إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا أَنْتَ" </quran>أَيْضًا <quran>"إلَّا بَشَر مِثْلنَا فَأْتِ بِآيَةٍ إنْ كُنْت مِنْ الصَّادِقِينَ" </quran>فِي رِسَالَتك</p></td></tr></table></body></html>
