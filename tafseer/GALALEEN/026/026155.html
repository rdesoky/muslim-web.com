<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هَذِهِ نَاقَةٌ لَهَا شِرْبٌ وَلَكُمْ شِرْبُ يَوْمٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ هَذِهِ نَاقَة لَهَا شِرْب" </quran>نَصِيب مِنْ الْمَاء</p></td></tr></table></body></html>
