<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا لُوطُ لَتَكُونَنَّ مِنَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا لُوط" </quran>عَنْ إنْكَارك عَلَيْنَا <quran>"لَتَكُونَن مِنْ الْمُخْرَجِينَ" </quran>مِنْ بَلْدَتنَا</p></td></tr></table></body></html>
