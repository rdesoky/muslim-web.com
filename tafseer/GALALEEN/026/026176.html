<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَ أَصْحَابُ الْأَيْكَةِ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَ أَصْحَاب الْأَيْكَة" </quran>وَفِي قِرَاءَة بِحَذْفِ الْهَمْزَة وَإِلْقَاء حَرَكَتهَا عَلَى اللَّام وَفَتْح الْهَاء : هِيَ غَيْضَة شَجَر قُرْب مَدْيَن</p></td></tr></table></body></html>
