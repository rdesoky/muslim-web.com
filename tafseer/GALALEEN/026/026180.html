<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ إِنْ أَجْرِيَ إِلَّا عَلَى رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَسْأَلكُمْ عَلَيْهِ مِنْ أَجْر إنْ" </quran>مَا</p></td></tr></table></body></html>
