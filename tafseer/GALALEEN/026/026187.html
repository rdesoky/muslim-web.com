<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَسْقِطْ عَلَيْنَا كِسَفًا مِنَ السَّمَاءِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَسْقِطْ عَلَيْنَا كِسَفًا" </quran>بِسُكُونِ السِّين وَفَتْحهَا قِطَعًا <quran>"مِنْ السَّمَاء إنْ كُنْت مِنْ الصَّادِقِينَ" </quran>فِي رِسَالَتك</p></td></tr></table></body></html>
