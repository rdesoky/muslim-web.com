<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بِلِسَانٍ عَرَبِيٍّ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بِلِسَانٍ عَرَبِيّ مُبِين" </quran>بَيِّن وَفِي قِرَاءَة بِتَشْدِيدِ نَزَلَ وَنَصْب الرُّوح وَالْفَاعِل اللَّه</p></td></tr></table></body></html>
