<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَفِي زُبُرِ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهُ" </quran>ذِكْر الْقُرْآن الْمُنَزَّل عَلَى مُحَمَّد <quran>"لَفِي زُبُر" </quran>كُتُب <quran>"الْأَوَّلِينَ" </quran>كَالتَّوْرَاةِ وَالْإِنْجِيل</p></td></tr></table></body></html>
