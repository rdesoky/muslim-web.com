<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَغْنَى عَنْهُمْ مَا كَانُوا يُمَتَّعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا" </quran>اسْتِفْهَامِيَّة بِمَعْنَى : أَيّ شَيْء <quran>"أَغْنَى عَنْهُمْ مَا كَانُوا يُمَتَّعُونَ" </quran>فِي دَفْع الْعَذَاب أَوْ تَخْفِيفه أَيْ : لَمْ يُغْنِ</p></td></tr></table></body></html>
