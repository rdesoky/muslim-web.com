<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا لَهَا مُنْذِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَهْلَكْنَا مِنْ قَرْيَة إلَّا لَهَا مُنْذِرُونَ" </quran>رُسُل تُنْذِر أَهْلهَا</p></td></tr></table></body></html>
