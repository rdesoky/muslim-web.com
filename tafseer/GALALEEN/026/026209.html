<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذِكْرَى وَمَا كُنَّا ظَالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذِكْرَى" </quran>عِظَة لَهُمْ <quran>"وَمَا كُنَّا ظَالِمِينَ" </quran>فِي إهْلَاكهمْ بَعْد إنْذَارهمْ وَنَزَلَ رَدًّا لِقَوْلِ الْمُشْرِكِينَ</p></td></tr></table></body></html>
