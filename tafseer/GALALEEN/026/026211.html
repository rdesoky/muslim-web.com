<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَنْبَغِي لَهُمْ وَمَا يَسْتَطِيعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا يَنْبَغِي" </quran>يَصْلُح <quran>"لَهُمْ" </quran>أَنْ يَنْزِلُوا بِهِ <quran>"وَمَا يَسْتَطِيعُونَ" </quran>ذَلِكَ</p></td></tr></table></body></html>
