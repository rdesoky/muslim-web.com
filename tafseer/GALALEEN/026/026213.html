<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تَدْعُ مَعَ اللَّهِ إِلَهًا آخَرَ فَتَكُونَ مِنَ الْمُعَذَّبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا تَدْعُ مَعَ اللَّه إلَهًا آخَر فَتَكُون مِنْ الْمُعَذَّبِينَ" </quran>إنْ فَعَلْت ذَلِكَ الَّذِي دَعَوْك إلَيْهِ</p></td></tr></table></body></html>
