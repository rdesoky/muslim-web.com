<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْذِرْ عَشِيرَتك الْأَقْرَبِينَ" </quran>وَهُمْ بَنُو هَاشِم وَبَنُو الْمُطَّلِب "وَقَدْ أَنْذَرَهُمْ جَهَارًا" رَوَاهُ الْبُخَارِيّ وَمُسْلِم</p></td></tr></table></body></html>
