<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ عَصَوْكَ فَقُلْ إِنِّي بَرِيءٌ مِمَّا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنْ عَصَوْك" </quran>عَشِيرَتك <quran>"فَقُلْ" </quran>لَهُمْ <quran>"إنِّي بَرِيء مِمَّا تَعْمَلُونَ" </quran>مِنْ عِبَادَة غَيْر اللَّه</p></td></tr></table></body></html>
