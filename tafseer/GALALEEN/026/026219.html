<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَقَلُّبَكَ فِي السَّاجِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَقَلُّبك" </quran>فِي أَرْكَان الصَّلَاة قَائِمًا وَقَاعِدًا وَرَاكِعًا وَسَاجِدًا <quran>"فِي السَّاجِدِينَ" </quran>الْمُصَلِّينَ</p></td></tr></table></body></html>
