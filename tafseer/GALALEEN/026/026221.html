<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلْ أُنَبِّئُكُمْ عَلَى مَنْ تَنَزَّلُ الشَّيَاطِينُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَلْ أُنَبِّئكُمْ" </quran>يَا كُفَّار مَكَّة <quran>"عَلَى مَنْ تَنَزَّل الشَّيَاطِين" </quran>بِحَذْفِ إحْدَى التَّاءَيْنِ مِنْ الْأَصْل</p></td></tr></table></body></html>
