<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنَزَّلُ عَلَى كُلِّ أَفَّاكٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَنَزَّل عَلَى كُلّ أَفَّاك" </quran>كَذَّاب <quran>"أَثِيم" </quran>فَاجِر مِثْل مُسَيْلِمَة وَغَيْره مِنْ الْكَهَنَة</p></td></tr></table></body></html>
