<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُلْقُونَ السَّمْعَ وَأَكْثَرُهُمْ كَاذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُلْقُونَ" </quran>الشَّيَاطِين <quran>"السَّمْع" </quran>مَا سَمِعُوهُ مِنْ الْمَلَائِكَة إلَى الْكَهَنَة <quran>"وَأَكْثَرهمْ كَاذِبُونَ" </quran>يَضُمُّونَ إلَى الْمَسْمُوع كَذِبًا كَثِيرًا وَكَانَ هَذَا قَبْل أَنْ حُجِبَتْ الشَّيَاطِين عَنْ السَّمَاء</p></td></tr></table></body></html>
