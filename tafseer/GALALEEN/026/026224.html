<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالشُّعَرَاءُ يَتَّبِعُهُمُ الْغَاوُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالشُّعَرَاء يَتَّبِعهُمْ الْغَاوُونَ" </quran>فِي شِعْرهمْ فَيَقُولُونَ بِهِ وَيَرْوُونَهُ عَنْهُمْ فَهُمْ مَذْمُومُونَ</p></td></tr></table></body></html>
