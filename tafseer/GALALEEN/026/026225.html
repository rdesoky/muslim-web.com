<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ تَرَ أَنَّهُمْ فِي كُلِّ وَادٍ يَهِيمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَمْ تَرَ" </quran>تَعْلَم <quran>"أَنَّهُمْ فِي كُلّ وَادٍ" </quran>مِنْ أَوْدِيَة الْكَلَام وَفُنُونه <quran>"يَهِيمُونَ" </quran>يَمْضُونَ فَيُجَاوِزُونَ الْحَدّ مَدْحًا وَهِجَاء</p></td></tr></table></body></html>
