<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ لَهُمْ سُوءُ الْعَذَابِ وَهُمْ فِي الْآخِرَةِ هُمُ الْأَخْسَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ الَّذِينَ لَهُمْ سُوء الْعَذَاب" </quran>أَشَدّه فِي الدُّنْيَا الْقَتْل وَالْأَسْر <quran>"وَهُمْ فِي الْآخِرَة هُمْ الْأَخْسَرُونَ" </quran>لِمَصِيرِهِمْ إلَى النَّار الْمُؤَبَّدَة عَلَيْهِمْ</p></td></tr></table></body></html>
