<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّكَ لَتُلَقَّى الْقُرْآنَ مِنْ لَدُنْ حَكِيمٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّك" </quran>خِطَاب لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"لَتُلَقَّى الْقُرْآن" </quran>يُلْقَى عَلَيْك بِشِدَّةٍ <quran>"مِنْ لَدُنْ" </quran>مِنْ عِنْد <quran>"حَكِيم عَلِيم" </quran>فِي ذَلِكَ</p></td></tr></table></body></html>
