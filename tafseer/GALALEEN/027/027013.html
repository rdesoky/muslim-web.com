<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَتْهُمْ آيَاتُنَا مُبْصِرَةً قَالُوا هَذَا سِحْرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا جَاءَتْهُمْ آيَتنَا مُبْصِرَة" </quran>مُضِيئَة وَاضِحَة <quran>"قَالُوا هَذَا سِحْر مُبِين" </quran>بَيِّن ظَاهِر</p></td></tr></table></body></html>
