<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحُشِرَ لِسُلَيْمَانَ جُنُودُهُ مِنَ الْجِنِّ وَالْإِنْسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحُشِرَ" </quran>جُمِعَ <quran>"لِسُلَيْمَان جُنُوده مِنْ الْجِنّ وَالْإِنْس وَالطَّيْر" </quran>فِي مَسِير لَهُ <quran>"فَهُمْ يُوزَعُونَ" </quran>يَجْمَعُونَ ثُمَّ يُسَاقُونَ</p></td></tr></table></body></html>
