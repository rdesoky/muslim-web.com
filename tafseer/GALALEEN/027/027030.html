<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ مِنْ سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُ مِنْ سُلَيْمَان وَإِنَّهُ" </quran>أَيْ مَضْمُونه</p></td></tr></table></body></html>
