<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا نَحْنُ أُولُو قُوَّةٍ وَأُولُو بَأْسٍ شَدِيدٍ وَالْأَمْرُ إِلَيْكِ فَانْظُرِي مَاذَا تَأْمُرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا نَحْنُ أُولُوا قُوَّة وَأُولُوا بَأْس شَدِيد" </quran>أَيْ : أَصْحَاب شِدَّة فِي الْحَرْب <quran>"وَالْأَمْر إلَيْك فَانْظُرِي مَاذَا تَأْمُرِينَ" </quran>تَأْمُرِينَنَا نُطِعْك</p></td></tr></table></body></html>
