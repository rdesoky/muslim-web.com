<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَتْ إِنَّ الْمُلُوكَ إِذَا دَخَلُوا قَرْيَةً أَفْسَدُوهَا وَجَعَلُوا أَعِزَّةَ أَهْلِهَا أَذِلَّةً وَكَذَلِكَ يَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَتْ إنَّ الْمُلُوك إذَا دَخَلُوا قَرْيَة أَفْسَدُوهَا" </quran>بِالتَّخْرِيبِ <quran>"وَجَعَلُوا أَعِزَّة أَهْلهَا أَذِلَّة وَكَذَلِكَ يَفْعَلُونَ" </quran>أَيْ : مُرْسِلُو الْكِتَاب</p></td></tr></table></body></html>
