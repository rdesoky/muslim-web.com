<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا أَيُّهَا الْمَلَأُ أَيُّكُمْ يَأْتِينِي بِعَرْشِهَا قَبْلَ أَنْ يَأْتُونِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ يَأَيُّهَا الْمَلَأ أَيّكُمْ" </quran>فِي الْهَمْزَتَيْنِ مَا تَقَدَّمَ <quran>"يَأْتِينِي بِعَرْشِهَا قَبْل أَنْ يَأْتُونِي مُسْلِمِينَ" </quran>مُنْقَادِينَ طَائِعِينَ فَلِي أَخْذه قَبْل ذَلِكَ لَا بَعْده</p></td></tr></table></body></html>
