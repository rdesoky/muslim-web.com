<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَصَدَّهَا مَا كَانَتْ تَعْبُدُ مِنْ دُونِ اللَّهِ إِنَّهَا كَانَتْ مِنْ قَوْمٍ كَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَصَدَّهَا" </quran>عَنْ عِبَادَة اللَّه <quran>"مَا كَانَتْ تَعْبُد مِنْ دُون اللَّه" </quran>أَيْ غَيْره</p></td></tr></table></body></html>
