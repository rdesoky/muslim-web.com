<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَانَ فِي الْمَدِينَةِ تِسْعَةُ رَهْطٍ يُفْسِدُونَ فِي الْأَرْضِ وَلَا يُصْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَانَ فِي الْمَدِينَة" </quran>مَدِينَة ثَمُود <quran>"تِسْعَة رَهْط" </quran>أَيْ رِجَال <quran>"يُفْسِدُونَ فِي الْأَرْض" </quran>بِالْمَعَاصِي مِنْهَا قَرْضهمْ الدَّنَانِير وَالدَّرَاهِم <quran>"وَلَا يُصْلِحُونَ" </quran>بِالطَّاعَةِ</p></td></tr></table></body></html>
