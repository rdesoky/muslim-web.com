<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَكَرُوا" </quran>فِي ذَلِكَ <quran>"مَكْرًا وَمَكَرْنَا مَكْرًا" </quran>أَيْ جَازَيْنَاهُمْ بِتَعْجِيلِ عُقُوبَتهمْ</p></td></tr></table></body></html>
