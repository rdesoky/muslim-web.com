<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَاهُمْ وَقَوْمَهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَانْظُرْ كَيْفَ كَانَتْ عَاقِبَة مَكْرهمْ أَنَّا دَمَّرْنَاهُمْ" </quran>أَهْلَكْنَاهُمْ <quran>"وَقَوْمهمْ أَجْمَعِينَ" </quran>بِصَيْحَةِ جِبْرِيل أَوْ بِرَمْيِ الْمَلَائِكَة بِحِجَارَةٍ يَرَوْنَهَا وَلَا يَرَوْنَهُمْ</p></td></tr></table></body></html>
