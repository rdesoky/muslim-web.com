<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْجَيْنَا الَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْجَيْنَا الَّذِينَ آمَنُوا" </quran>بِصَالِحٍ وَهُمْ أَرْبَعَة آلَاف <quran>"وَكَانُوا يَتَّقُونَ" </quran>الشِّرْك</p></td></tr></table></body></html>
