<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَةَ وَأَنْتُمْ تُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلُوطًا" </quran>مَنْصُوب بِاذْكُرْ مُقَدَّرًا قَبْله وَيُبْدَل مِنْهُ <quran>"إذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَة" </quran>أَيْ اللِّوَاط <quran>"وَأَنْتُمْ تُبْصِرُونَ" </quran>أَيْ يُبْصِر بَعْضكُمْ بَعْضًا انْهِمَاكًا فِي الْمَعْصِيَة</p></td></tr></table></body></html>
