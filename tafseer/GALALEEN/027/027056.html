<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا أَخْرِجُوا آلَ لُوطٍ مِنْ قَرْيَتِكُمْ إِنَّهُمْ أُنَاسٌ يَتَطَهَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا كَانَ جَوَاب قَوْمه إلَّا أَنْ قَالُوا أَخْرِجُوا آل لُوط" </quran>أَهْله <quran>"مِنْ قَرْيَتكُمْ إنَّهُمْ أُنَاس يَتَطَهَّرُونَ" </quran>مِنْ أَدْبَار الرِّجَال</p></td></tr></table></body></html>
