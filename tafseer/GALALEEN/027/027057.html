<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْجَيْنَاهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ قَدَّرْنَاهَا مِنَ الْغَابِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَنْجَيْنَاهُ وَأَهْله إلَّا امْرَأَته قَدَّرْنَاهَا" </quran>جَعَلْنَاهَا بِتَقْدِيرِنَا <quran>"مِنْ الْغَابِرِينَ" </quran>الْبَاقِينَ فِي الْعَذَاب</p></td></tr></table></body></html>
