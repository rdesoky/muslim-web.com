<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا فَسَاءَ مَطَرُ الْمُنْذَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا" </quran>هُوَ حِجَارَة السِّجِّيل فَأَهْلَكَتْهُمْ <quran>"فَسَاءَ" </quran>بِئْسَ <quran>"مَطَر الْمُنْذَرِينَ" </quran>بِالْعَذَابِ مَطَرهمْ</p></td></tr></table></body></html>
