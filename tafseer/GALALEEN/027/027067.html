<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِينَ كَفَرُوا أَئِذَا كُنَّا تُرَابًا وَآبَاؤُنَا أَئِنَّا لَمُخْرَجُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الَّذِينَ كَفَرُوا" </quran>أَيْضًا فِي إنْكَار الْبَعْث <quran>"أَإِذَا كُنَّا تُرَابًا وَآبَاؤُنَا أَإِنَّا لَمُخْرَجُونَ" </quran>مِنْ الْقُبُور</p></td></tr></table></body></html>
