<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ وُعِدْنَا هَذَا نَحْنُ وَآبَاؤُنَا مِنْ قَبْلُ إِنْ هَذَا إِلَّا أَسَاطِيرُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ وُعِدْنَا هَذَا نَحْنُ وَآبَاؤُنَا مِنْ قَبْل إنْ" </quran>مَا <quran>"هَذَا إلَّا أَسَاطِير الْأَوَّلِينَ" </quran>جَمْع أُسْطُورَة بِالضَّمِّ أَيْ مَا سَطَرَ مِنْ الْكَذِب</p></td></tr></table></body></html>
