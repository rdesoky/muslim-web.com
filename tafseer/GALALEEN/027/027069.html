<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ سِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ سِيرُوا فِي الْأَرْض فَانْظُرُوا كَيْفَ كَانَ عَاقِبَة الْمُجْرِمِينَ" </quran>بِإِنْكَارِهِمْ وَهِيَ هَلَاكهمْ بِالْعَذَابِ</p></td></tr></table></body></html>
