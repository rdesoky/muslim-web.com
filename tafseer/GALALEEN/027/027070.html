<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَحْزَن عَلَيْهِمْ وَلَا تَكُنْ فِي ضَيْق مِمَّا يَمْكُرُونَ" </quran>تَسْلِيَة لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَيْ لَا تَهْتَمّ بِمَكْرِهِمْ عَلَيْك فَإِنَّا نَاصِرُوك عَلَيْهِمْ</p></td></tr></table></body></html>
