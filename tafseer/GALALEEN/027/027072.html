<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ عَسَى أَنْ يَكُونَ رَدِفَ لَكُمْ بَعْضُ الَّذِي تَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ عَسَى أَنْ يَكُون رَدِفَ" </quran>قَرُبَ <quran>"لَكُمْ بَعْض الَّذِي تَسْتَعْجِلُونَ" </quran>فَحَصَلَ لَهُمْ الْقَتْل بِبَدْرٍ وَبَاقِي الْعَذَاب يَأْتِيهِمْ بَعْد الْمَوْت</p></td></tr></table></body></html>
