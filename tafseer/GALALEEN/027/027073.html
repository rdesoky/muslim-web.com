<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّ رَبّك لَذُو فَضْل عَلَى النَّاس" </quran>وَمِنْهُ تَأْخِير الْعَذَاب عَنْ الْكُفَّار <quran>"وَلَكِنَّ أَكْثَرهمْ لَا يَشْكُرُونَ" </quran>فَالْكُفَّار لَا يَشْكُرُونَ تَأْخِير الْعَذَاب لِإِنْكَارِهِمْ وُقُوعه</p></td></tr></table></body></html>
