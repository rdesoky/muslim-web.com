<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ لَا تُسْمِعُ الْمَوْتَى وَلَا تُسْمِعُ الصُّمَّ الدُّعَاءَ إِذَا وَلَّوْا مُدْبِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّك لَا تُسْمِع الْمَوْتَى وَلَا تُسْمِع الصُّمّ الدُّعَاء إذَا" </quran>بِتَحْقِيقِ الْهَمْزَتَيْنِ وَتَسْهِيل الثَّانِيَة بَيْنهَا وَبَيْن الْيَاء</p></td></tr></table></body></html>
