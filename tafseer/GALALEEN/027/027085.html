<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوَقَعَ الْقَوْلُ عَلَيْهِمْ بِمَا ظَلَمُوا فَهُمْ لَا يَنْطِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَوَقَعَ الْقَوْل" </quran>حُقَّ الْعَذَاب <quran>"عَلَيْهِمْ بِمَا ظَلَمُوا" </quran>أَيْ أَشْرَكُوا <quran>"فَهُمْ لَا يَنْطِقُونَ" </quran>إذْ لَا حُجَّة لَهُمْ</p></td></tr></table></body></html>
