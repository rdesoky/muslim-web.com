<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَتْلُوا عَلَيْكَ مِنْ نَبَإِ مُوسَى وَفِرْعَوْنَ بِالْحَقِّ لِقَوْمٍ يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نَتْلُو" </quran>نَقُصّ <quran>"عَلَيْك مِنْ نَبَإِ" </quran>خَبَر <quran>"مُوسَى وَفِرْعَوْن بِالْحَقِّ" </quran>الصِّدْق <quran>"لِقَوْمٍ يُؤْمِنُونَ" </quran>لِأَجَلِهِمْ لِأَنَّهُمْ الْمُنْتَفِعُونَ بِهِ</p></td></tr></table></body></html>
