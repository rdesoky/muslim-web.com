<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَغَفَرَ لَهُ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>نَادِمًا <quran>"رَبّ إنِّي ظَلَمْت نَفْسِي" </quran>بِقَتْلِهِ <quran>"فَاغْفِرْ لِي فَغَفَرَ لَهُ إنَّهُ هُوَ الْغَفُور الرَّحِيم" </quran>أَيْ الْمُتَّصِف بِهِمَا أَزَلًا وَأَبَدًا</p></td></tr></table></body></html>
