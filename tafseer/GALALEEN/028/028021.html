<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّبُ قَالَ رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّب" </quran>لُحُوق طَالِب أَوْ غَوْث اللَّه إيَّاهُ <quran>"قَالَ رَبّ نَجِّنِي مِنْ الْقَوْم الظَّالِمِينَ" </quran>قَوْم فِرْعَوْن</p></td></tr></table></body></html>
