<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنِّي قَتَلْتُ مِنْهُمْ نَفْسًا فَأَخَافُ أَنْ يَقْتُلُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ إنِّي قَتَلْت مِنْهُمْ نَفْسًا" </quran>هُوَ الْقِبْطِيّ السَّابِق <quran>"فَأَخَاف أَنْ يَقْتُلُونِي" </quran>بِهِ</p></td></tr></table></body></html>
