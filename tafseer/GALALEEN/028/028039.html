<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاسْتَكْبَرَ هُوَ وَجُنُودُهُ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَظَنُّوا أَنَّهُمْ إِلَيْنَا لَا يُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاسْتَكْبَرَ هُوَ وَجُنُوده فِي الْأَرْض" </quran>أَرْض مِصْر <quran>"بِغَيْرِ الْحَقّ وَظَنُّوا أَنَّهُمْ إلَيْنَا لَا يَرْجِعُونَ" </quran>بِالْبِنَاءِ لِلْفَاعِلِ وَلِلْمَفْعُولِ</p></td></tr></table></body></html>
