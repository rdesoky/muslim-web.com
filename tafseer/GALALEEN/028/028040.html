<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذْنَاهُ وَجُنُودَهُ فَنَبَذْنَاهُمْ فِي الْيَمِّ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَخَذْنَاهُ وَجُنُوده فَنَبَذْنَاهُمْ" </quran>طَرَحْنَاهُمْ <quran>"فِي الْيَمّ" </quran>الْبَحْر الْمَالِح فَغَرِقُوا <quran>"فَانْظُرْ كَيْفَ كَانَ عَاقِبَة الظَّالِمِينَ" </quran>حِين صَارُوا إلَى الْهَلَاك</p></td></tr></table></body></html>
