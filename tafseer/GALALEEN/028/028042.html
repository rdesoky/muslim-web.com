<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَتْبَعْنَاهُمْ فِي هَذِهِ الدُّنْيَا لَعْنَةً وَيَوْمَ الْقِيَامَةِ هُمْ مِنَ الْمَقْبُوحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَتْبَعْنَاهُمْ فِي هَذِهِ الدُّنْيَا لَعْنَة" </quran>خِزْيًا <quran>"وَيَوْم الْقِيَامَة هُمْ مِنْ الْمَقْبُوحِينَ" </quran>الْمُبْعَدِينَ</p></td></tr></table></body></html>
