<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ فَأْتُوا بِكِتَابٍ مِنْ عِنْدِ اللَّهِ هُوَ أَهْدَى مِنْهُمَا أَتَّبِعْهُ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"فَأْتُوا بِكِتَابٍ مِنْ عِنْد اللَّه هُوَ أَهْدَى مِنْهُمَا" </quran>مِنْ الْكِتَابَيْنِ <quran>"أَتَّبِعهُ إنْ كُنْتُمْ صَادِقِينَ" </quran>فِي قَوْلكُمْ</p></td></tr></table></body></html>
