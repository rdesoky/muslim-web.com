<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ وَصَّلْنَا لَهُمُ الْقَوْلَ لَعَلَّهُمْ يَتَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ وَصَّلْنَا" </quran>بَيَّنَّا <quran>"لَهُمْ الْقَوْل" </quran>الْقُرْآن <quran>"لَعَلَّهُمْ يَتَذَكَّرُونَ" </quran>يَتَّعِظُونَ فَيُؤْمِنُونَ</p></td></tr></table></body></html>
