<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا يُتْلَى عَلَيْهِمْ قَالُوا آمَنَّا بِهِ إِنَّهُ الْحَقُّ مِنْ رَبِّنَا إِنَّا كُنَّا مِنْ قَبْلِهِ مُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا يُتْلَى عَلَيْهِمْ" </quran>الْقُرْآن <quran>"قَالُوا آمَنَّا بِهِ إنَّهُ الْحَقّ مِنْ رَبّنَا إنَّا كُنَّا مِنْ قَبْله مُسْلِمِينَ" </quran>مُوَحِّدِينَ</p></td></tr></table></body></html>
