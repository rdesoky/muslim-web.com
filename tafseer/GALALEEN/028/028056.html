<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّك لَا تَهْدِي مَنْ أَحْبَبْت" </quran>هِدَايَته وَنَزَلَ فِي حِرْصه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ عَلَى إيمَان عَمّه أَبِي طَالِب <quran>"وَلَكِنَّ اللَّه يَهْدِي مَنْ يَشَاء وَهُوَ أَعْلَم" </quran>عَالِم</p></td></tr></table></body></html>
