<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَمِيَتْ عَلَيْهِمُ الْأَنْبَاءُ يَوْمَئِذٍ فَهُمْ لَا يَتَسَاءَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَعَمِيَتْ عَلَيْهِمْ الْأَنْبَاء" </quran>الْأَخْبَار الْمُنْجِيَة فِي الْجَوَاب <quran>"يَوْمئِذٍ" </quran>لَمْ يَجِدُوا خَبَرًا لَهُمْ فِيهِ نَجَاة <quran>"فَهُمْ لَا يَتَسَاءَلُونَ" </quran>فَهُمْ لَا يَتَسَاءَلُونَ عَنْهُ فَيَسْكُتُونَ .</p></td></tr></table></body></html>
