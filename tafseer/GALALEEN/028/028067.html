<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا فَعَسَى أَنْ يَكُونَ مِنَ الْمُفْلِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَمَّا مَنْ تَابَ" </quran>مِنْ الشِّرْك <quran>"وَآمَنَ" </quran>صَدَّقَ بِتَوْحِيدِ اللَّه <quran>"وَعَمِلَ صَالِحًا" </quran>أَدَّى الْفَرَائِض <quran>"فَعَسَى أَنْ يَكُون مِنْ الْمُفْلِحِينَ" </quran>النَّاجِينَ بِوَعْدِ اللَّه</p></td></tr></table></body></html>
