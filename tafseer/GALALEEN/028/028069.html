<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَرَبُّكَ يَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَرَبّك يَعْلَم مَا تُكِنّ صُدُورهمْ" </quran>تُسِرّ قُلُوبهمْ مِنْ الْكُفْر وَغَيْره <quran>"وَمَا يُعْلِنُونَ" </quran>بِأَلْسِنَتِهِمْ مِنْ ذَلِكَ</p></td></tr></table></body></html>
