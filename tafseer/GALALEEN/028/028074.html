<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تَزْعُمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>اُذْكُرْ <quran>"يَوْم يُنَادِيهِمْ فَيَقُول أَيْنَ شُرَكَائِي الَّذِينَ كُنْتُمْ تَزْعُمُونَ" </quran>ذَكَرَ ثَانِيًا لِيَبْنِيَ عَلَيْهِ</p></td></tr></table></body></html>
