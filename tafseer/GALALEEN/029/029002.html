<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَحَسِبَ النَّاس أَنْ يُتْرَكُوا أَنْ يَقُولُوا" </quran>أَيْ : بِقَوْلِهِمْ <quran>"آمَنَّا وَهُمْ لَا يُفْتَنُونَ" </quran>يُخْتَبَرُونَ بِمَا يَتَبَيَّن بِهِ حَقِيقَة إيمَانهمْ نَزَلَ فِي جَمَاعَة آمَنُوا فَآذَاهُمْ الْمُشْرِكُونَ</p></td></tr></table></body></html>
