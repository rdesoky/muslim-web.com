<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ فَتَنَّا الَّذِينَ مِنْ قَبْلِهِمْ فَلَيَعْلَمَنَّ اللَّهُ الَّذِينَ صَدَقُوا وَلَيَعْلَمَنَّ الْكَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ فَتَنَّا الَّذِينَ مِنْ قَبْلهمْ فَلَيَعْلَمَن اللَّه الَّذِينَ صَدَقُوا" </quran>فِي إيمَانهمْ عِلْم مُشَاهَدَة <quran>"وَلَيَعْلَمَن الْكَاذِبِينَ" </quran>فِيهِ</p></td></tr></table></body></html>
