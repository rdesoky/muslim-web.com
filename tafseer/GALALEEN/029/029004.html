<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ حَسِبَ الَّذِينَ يَعْمَلُونَ السَّيِّئَاتِ أَنْ يَسْبِقُونَا سَاءَ مَا يَحْكُمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ حَسِبَ الَّذِينَ يَعْمَلُونَ السَّيِّئَات" </quran>الشِّرْك وَالْمَعَاصِي <quran>"أَنْ يَسْبِقُونَا" </quran>يَفُوتُونَا فَلَا نَنْتَقِم مِنْهُمْ <quran>"سَاءَ" </quran>بِئْسَ <quran>"مَا" </quran>الَّذِي <quran>"يَحْكُمُونَ" </quran>يَحْكُمُونَهُ حُكْمهمْ هَذَا</p></td></tr></table></body></html>
