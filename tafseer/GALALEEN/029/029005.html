<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ كَانَ يَرْجُو لِقَاءَ اللَّهِ فَإِنَّ أَجَلَ اللَّهِ لَآتٍ وَهُوَ السَّمِيعُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَنْ كَانَ يَرْجُو" </quran>يَخَاف <quran>"لِقَاء اللَّه فَإِنَّ أَجَل اللَّه" </quran>بِهِ <quran>"لَآتٍ" </quran>فَلْيَسْتَعِدَّ لَهُ <quran>"وَهُوَ السَّمِيع" </quran>لِأَقْوَالِ الْعِبَاد <quran>"الْعَلِيم" </quran>بِأَفْعَالِهِمْ</p></td></tr></table></body></html>
