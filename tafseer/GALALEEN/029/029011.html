<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَيَعْلَمَنَّ اللَّهُ الَّذِينَ آمَنُوا وَلَيَعْلَمَنَّ الْمُنَافِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَيَعْلَمَن اللَّه الَّذِينَ آمَنُوا" </quran>بِقُلُوبِهِمْ <quran>"وَلَيَعْلَمَن الْمُنَافِقِينَ" </quran>فَيُجَازِي الْفَرِيقَيْنِ وَاللَّام فِي الْفِعْلَيْنِ لَام قَسَم</p></td></tr></table></body></html>
