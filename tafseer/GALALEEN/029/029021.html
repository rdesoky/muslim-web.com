<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُعَذِّبُ مَنْ يَشَاءُ وَيَرْحَمُ مَنْ يَشَاءُ وَإِلَيْهِ تُقْلَبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُعَذِّب مَنْ يَشَاء" </quran>تَعْذِيبه <quran>"وَيَرْحَم مَنْ يَشَاء" </quran>رَحْمَته <quran>"وَإِلَيْهِ تُقْلَبُونَ" </quran>تُرَدُّونَ</p></td></tr></table></body></html>
