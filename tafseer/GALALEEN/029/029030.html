<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ انْصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ رَبّ اُنْصُرْنِي" </quran>بِتَحْقِيقِ قَوْلِي فِي إنْزَال الْعَذَاب <quran>"عَلَى الْقَوْم الْمُفْسِدِينَ" </quran>الْعَاصِينَ بِإِتْيَانِ الرِّجَال فَاسْتَجَابَ اللَّه دُعَاءَهُ</p></td></tr></table></body></html>
