<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا مُنْزِلُونَ عَلَى أَهْلِ هَذِهِ الْقَرْيَةِ رِجْزًا مِنَ السَّمَاءِ بِمَا كَانُوا يَفْسُقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا مُنْزِلُونَ" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>"عَلَى أَهْل هَذِهِ الْقَرْيَة رِجْزًا" </quran>عَذَابًا <quran>"مِنْ السَّمَاء بِمَا" </quran>بِالْفِعْلِ الَّذِي <quran>"كَانُوا يَفْسُقُونَ" </quran>بِهِ أَيْ بِسَبَبِ فِسْقهمْ</p></td></tr></table></body></html>
