<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ تَرَكْنَا مِنْهَا آيَةً بَيِّنَةً لِقَوْمٍ يَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ تَرَكْنَا مِنْهَا آيَة بَيِّنَة" </quran>ظَاهِرَة هِيَ آثَار خِرَابهَا <quran>"لِقَوْمٍ يَعْقِلُونَ" </quran>يَتَدَبَّرُونَ</p></td></tr></table></body></html>
