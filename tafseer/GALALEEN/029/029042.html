<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ يَعْلَمُ مَا يَدْعُونَ مِنْ دُونِهِ مِنْ شَيْءٍ وَهُوَ الْعَزِيزُ الْحَكِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه يَعْلَم مَا" </quran>بِمَعْنَى الَّذِي <quran>"يَدْعُونَ" </quran>يَعْبُدُونَ بِالْيَاءِ وَالتَّاء <quran>"مِنْ دُونه" </quran>غَيْره <quran>"مِنْ شَيْء وَهُوَ الْعَزِيز" </quran>فِي مُلْكه <quran>"الْحَكِيم" </quran>فِي صُنْعه</p></td></tr></table></body></html>
