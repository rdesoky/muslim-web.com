<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتِلْكَ الْأَمْثَالُ نَضْرِبُهَا لِلنَّاسِ وَمَا يَعْقِلُهَا إِلَّا الْعَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتِلْكَ الْأَمْثَال" </quran>فِي الْقُرْآن <quran>"نَضْرِبهَا" </quran>نَجْعَلهَا <quran>"لِلنَّاسِ وَمَا يَعْقِلهَا" </quran>أَيْ يَفْهَمهَا <quran>"إلَّا الْعَالِمُونَ" </quran>الْمُتَدَبِّرُونَ</p></td></tr></table></body></html>
