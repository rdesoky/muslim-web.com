<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسْتَعْجِلُونَكَ بِالْعَذَابِ وَلَوْلَا أَجَلٌ مُسَمًّى لَجَاءَهُمُ الْعَذَابُ وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَسْتَعْجِلُونَك بِالْعَذَابِ وَلَوْلَا أَجَل مُسَمًّى" </quran>لَهُ <quran>"لَجَاءَهُمْ الْعَذَاب" </quran>عَاجِلًا <quran>"وَلَيَأْتِيَنهمْ بَغْتَة وَهُمْ لَا يَشْعُرُونَ" </quran>بِوَقْتِ إتْيَانه</p></td></tr></table></body></html>
