<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كُلّ نَفْس ذَائِقَة الْمَوْت ثُمَّ إلَيْنَا تُرْجَعُونَ" </quran>بِالتَّاءِ وَالْيَاء بَعْد الْبَعْث</p></td></tr></table></body></html>
