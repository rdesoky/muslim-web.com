<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ جَاهَدُوا فِينَا" </quran>فِي حَقّنَا <quran>"لِنَهْدِيَنهمْ سُبُلنَا" </quran>أَيْ طُرُق السَّيْر إلَيْنَا <quran>"وَإِنَّ اللَّه لَمَعَ الْمُحْسِنِينَ" </quran>الْمُؤْمِنِينَ بِالنَّصْرِ وَالْعَوْن</p></td></tr></table></body></html>
