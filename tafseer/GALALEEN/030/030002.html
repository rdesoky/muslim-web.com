<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>غُلِبَتِ الرُّومُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"غُلِبَتْ الرُّوم" </quran>وَهُمْ أَهْل الْكِتَاب غَلَبَتْهَا فَارِس وَلَيْسُوا أَهْل كِتَاب بَلْ يَعْبُدُونَ الْأَوْثَان فَفَرِحَ كُفَّار مَكَّة بِذَلِكَ وَقَالُوا لِلْمُسْلِمِينَ : نَحْنُ نَغْلِبكُمْ كَمَا غَلَبَتْ فَارِس الرُّوم</p></td></tr></table></body></html>
