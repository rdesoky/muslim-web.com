<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا وَهُمْ عَنِ الْآخِرَةِ هُمْ غَافِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَعْلَمُونَ ظَاهِرًا مِنْ الْحَيَاة الدُّنْيَا" </quran>أَيْ مَعَايِشهَا مِنْ التِّجَارَة وَالزِّرَاعَة وَالْبِنَاء وَالْغَرْس وَغَيْر ذَلِكَ <quran>"وَهُمْ عَنْ الْآخِرَة هُمْ غَافِلُونَ" </quran>إعَادَة هُمْ تَأْكِيد</p></td></tr></table></body></html>
