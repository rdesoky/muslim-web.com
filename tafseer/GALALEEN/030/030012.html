<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ تَقُومُ السَّاعَةُ يُبْلِسُ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَوْم تَقُوم السَّاعَة يُبْلِس الْمُجْرِمُونَ" </quran>يَسْكُت الْمُشْرِكُونَ لِانْقِطَاعِ حُجَّتهمْ</p></td></tr></table></body></html>
