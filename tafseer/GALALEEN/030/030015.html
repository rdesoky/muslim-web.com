<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَات فَهُمْ فِي رَوْضَة" </quran>جَنَّة <quran>"يُحْبَرُونَ" </quran>يَسُرُّونَ</p></td></tr></table></body></html>
