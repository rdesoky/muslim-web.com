<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسُبْحَان اللَّه" </quran>أَيْ : سَبِّحُوا اللَّه بِمَعْنَى صَلُّوا <quran>"حِين تُمْسُونَ" </quran>أَيْ تَدْخُلُونَ فِي الْمَسَاء وَفِيهِ صَلَاتَانِ : الْمَغْرِب وَالْعِشَاء <quran>"وَحِين تُصْبِحُونَ" </quran>تَدْخُلُونَ فِي الصَّبَاح وَفِيهِ صَلَاة الصُّبْح</p></td></tr></table></body></html>
