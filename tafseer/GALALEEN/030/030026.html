<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ كُلٌّ لَهُ قَانِتُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَهُ مَنْ فِي السَّمَاوَات وَالْأَرْض" </quran>مُلْكًا وَخَلْقًا وَعَبِيدًا <quran>"كُلّ لَهُ قَانِتُونَ" </quran>مُطِيعُونَ</p></td></tr></table></body></html>
