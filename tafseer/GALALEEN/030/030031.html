<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُنِيبِينَ إِلَيْهِ وَاتَّقُوهُ وَأَقِيمُوا الصَّلَاةَ وَلَا تَكُونُوا مِنَ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مُنِيبِينَ" </quran>رَاجِعِينَ <quran>"إلَيْهِ" </quran>تَعَالَى فِيمَا أَمَرَ بِهِ وَنَهَى عَنْهُ حَال مِنْ فَاعِل أَقِمْ وَمَا أُرِيد بِهِ أَيْ أَقِيمُوا <quran>"وَاتَّقُوهُ" </quran>خَافُوهُ</p></td></tr></table></body></html>
