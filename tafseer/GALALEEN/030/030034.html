<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ فَتَمَتَّعُوا فَسَوْفَ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ" </quran>أُرِيد بِهِ التَّهْدِيد <quran>"فَتَمَتَّعُوا فَسَوْف تَعْلَمُونَ" </quran>عَاقِبَة تَمَتُّعكُمْ فِيهِ الْتِفَات عَنْ الْغِيبَة</p></td></tr></table></body></html>
