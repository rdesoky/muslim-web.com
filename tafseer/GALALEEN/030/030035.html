<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ أَنْزَلْنَا عَلَيْهِمْ سُلْطَانًا فَهُوَ يَتَكَلَّمُ بِمَا كَانُوا بِهِ يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ" </quran>بِمَعْنَى هَمْزَة الْإِنْكَار <quran>"أَنَزَلْنَا عَلَيْهِمْ سُلْطَانًا" </quran>حُجَّة وَكِتَابًا <quran>"فَهُوَ يَتَكَلَّم" </quran>تَكَلُّم دَلَالَة <quran>"بِمَا كَانُوا بِهِ يُشْرِكُونَ" </quran>أَيْ يَأْمُرهُمْ بِالْإِشْرَاكِ ! لَا</p></td></tr></table></body></html>
