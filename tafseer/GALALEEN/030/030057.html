<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَيَوْمَئِذٍ لَا يَنْفَعُ الَّذِينَ ظَلَمُوا مَعْذِرَتُهُمْ وَلَا هُمْ يُسْتَعْتَبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَيَوْمئِذٍ لَا يَنْفَع" </quran>بِالْيَاءِ وَالتَّاء <quran>"الَّذِينَ ظَلَمُوا مَعْذِرَتهمْ" </quran>فِي إنْكَارهمْ لَهُ <quran>"وَلَا هُمْ يُسْتَعْتَبُونَ" </quran>لَا يُطْلَب مِنْهُمْ الْعُتْبَى : أَيْ الرُّجُوع إلَى مَا يُرْضِي اللَّه</p></td></tr></table></body></html>
