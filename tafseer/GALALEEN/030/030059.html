<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ يَطْبَعُ اللَّهُ عَلَى قُلُوبِ الَّذِينَ لَا يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ يَطْبَع اللَّه عَلَى قُلُوب الَّذِينَ لَا يَعْلَمُونَ" </quran>التَّوْحِيد كَمَا طَبَعَ عَلَى قُلُوب هَؤُلَاءِ</p></td></tr></table></body></html>
