<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تِلْكَ" </quran>أَيْ هَذِهِ الْآيَات <quran>"آيَات الْكِتَاب" </quran>الْقُرْآن <quran>"الْحَكِيم" </quran>ذِي الْحِكْمَة وَالْإِضَافَة بِمَعْنَى مِنْ</p></td></tr></table></body></html>
