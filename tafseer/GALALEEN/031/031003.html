<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُدًى وَرَحْمَةً لِلْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُدًى وَرَحْمَة" </quran>بِالرَّفْعِ وَفِي قِرَاءَة الْعَامَّة بِالنَّصْبِ حَالًا مِنْ الْآيَات الْعَامِل فِيهَا مَا فِي <quran>"تِلْكَ" </quran>مِنْ مَعْنَى الْإِشَارَة</p></td></tr></table></body></html>
