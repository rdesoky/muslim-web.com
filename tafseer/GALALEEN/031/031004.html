<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ يُقِيمُونَ الصَّلَاة" </quran>بَيَان لِلْمُحْسِنِينَ <quran>"وَيُؤْتُونَ الزَّكَاة وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ" </quran>هُمْ الثَّانِي تَأْكِيد</p></td></tr></table></body></html>
