<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَنْزِيل الْكِتَاب" </quran>الْقُرْآن مُبْتَدَأ <quran>"لَا رَيْب" </quran>شَكّ <quran>"فِيهِ" </quran>خَبَر أَوَّل <quran>"مِنْ رَبّ الْعَالَمِينَ" </quran>خَبَر ثَانٍ</p></td></tr></table></body></html>
