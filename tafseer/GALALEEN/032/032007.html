<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ وَبَدَأَ خَلْقَ الْإِنْسَانِ مِنْ طِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِي أَحْسَنَ كُلّ شَيْء خَلَقَهُ" </quran>بِفَتْحِ اللَّام فِعْلًا مَاضِيًا صِفَة وَبِسُكُونِهَا بَدَل اشْتِمَال <quran>"وَبَدَأَ خَلْق الْإِنْسَان" </quran>آدَم</p></td></tr></table></body></html>
