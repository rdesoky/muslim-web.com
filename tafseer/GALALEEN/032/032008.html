<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَعَلَ نَسْلَهُ مِنْ سُلَالَةٍ مِنْ مَاءٍ مَهِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ جَعَلَ نَسْله" </quran>ذُرِّيَّته <quran>"مِنْ سُلَالَة" </quran>عَلَقَة <quran>"مِنْ مَاء مَهِين" </quran>ضَعِيف هُوَ النُّطْفَة</p></td></tr></table></body></html>
