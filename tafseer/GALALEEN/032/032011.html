<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَتَوَفَّاكُمْ مَلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ ثُمَّ إِلَى رَبِّكُمْ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>لَهُمْ <quran>"يَتَوَفَّاكُمْ مَلَك الْمَوْت الَّذِي وُكِّلَ بِكُمْ" </quran>أَيْ يَقْبِض أَرْوَاحكُمْ <quran>"ثُمَّ إلَى رَبّكُمْ تُرْجَعُونَ" </quran>أَحْيَاء فَيُجَازِيكُمْ بِأَعْمَالِكُمْ</p></td></tr></table></body></html>
