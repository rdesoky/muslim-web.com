<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ جَنَّاتُ الْمَأْوَى نُزُلًا بِمَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَات فَلَهُمْ جَنَّات الْمَأْوَى نُزُلًا" </quran>هُوَ مَا يُعَدّ لِلضَّيْفِ</p></td></tr></table></body></html>
