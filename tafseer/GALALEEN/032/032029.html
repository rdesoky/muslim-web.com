<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَوْمَ الْفَتْحِ لَا يَنْفَعُ الَّذِينَ كَفَرُوا إِيمَانُهُمْ وَلَا هُمْ يُنْظَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ يَوْم الْفَتْح" </quran>بِإِنْزَالِ الْعَذَاب بِهِمْ <quran>"لَا يَنْفَع الَّذِينَ كَفَرُوا إيمَانهمْ وَلَا هُمْ يَنْظُرُونَ" </quran>يُمْهِلُونَ لِتَوْبَةٍ أَوْ مَعْذِرَة</p></td></tr></table></body></html>
