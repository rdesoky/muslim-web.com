<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَعْرِضْ عَنْهُمْ وَانْتَظِرْ إِنَّهُمْ مُنْتَظِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَعْرِضْ عَنْهُمْ وَانْتَظِرْ" </quran>إنْزَال الْعَذَاب بِهِمْ <quran>"إنَّهُمْ مُنْتَظِرُونَ" </quran>بِك حَادِث مَوْت أَوْ قَتْل فَيَسْتَرِيحُونَ مِنْك وَهَذَا قَبْل الْأَمْر بِقِتَالِهِمْ</p></td></tr></table></body></html>
