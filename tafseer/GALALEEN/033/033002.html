<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّبِعْ مَا يُوحَى إِلَيْكَ مِنْ رَبِّكَ إِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاتَّبِعْ مَا يُوحَى إلَيْك مِنْ رَبّك" </quran>أَيْ الْقُرْآن <quran>"إنَّ اللَّه كَانَ بِمَا تَعْمَلُونَ خَبِيرًا" </quran>وَفِي قِرَاءَة بِالتَّحْتَانِيَّة</p></td></tr></table></body></html>
