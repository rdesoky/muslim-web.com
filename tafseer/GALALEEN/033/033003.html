<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَوَكَّلْ عَلَى اللَّهِ وَكَفَى بِاللَّهِ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَوَكَّلْ عَلَى اللَّه" </quran>فِي أَمْرك <quran>"وَكَفَى بِاَللَّهِ وَكِيلًا" </quran>حَافِظًا لَك وَأُمَّته تَبَع لَهُ فِي ذَلِكَ كُلّه</p></td></tr></table></body></html>
