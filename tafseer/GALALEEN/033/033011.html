<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُنَالِكَ ابْتُلِيَ الْمُؤْمِنُونَ وَزُلْزِلُوا زِلْزَالًا شَدِيدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُنَالِكَ اُبْتُلِيَ الْمُؤْمِنُونَ" </quran>اُخْتُبِرُوا لِيَتَبَيَّن الْمُخْلِص مِنْ غَيْره <quran>"وَزُلْزِلُوا" </quran>حُرِّكُوا <quran>"زِلْزَالًا شَدِيدًا" </quran>مِنْ شِدَّة الْفَزَع</p></td></tr></table></body></html>
