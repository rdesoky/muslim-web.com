<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ يَقُولُ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ مَا وَعَدَنَا اللَّهُ وَرَسُولُهُ إِلَّا غُرُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran>اُذْكُرْ <quran>"إِذْ يَقُول الْمُنَافِقُونَ وَاَلَّذِينَ فِي قُلُوبهمْ مَرَض" </quran>ضَعْف اعْتِقَاد <quran>"مَا وَعَدَنَا اللَّه وَرَسُوله" </quran>بِالنَّصْرِ <quran>"إلَّا غُرُورًا" </quran>بَاطِلًا</p></td></tr></table></body></html>
