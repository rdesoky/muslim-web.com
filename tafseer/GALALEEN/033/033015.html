<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ كَانُوا عَاهَدُوا اللَّهَ مِنْ قَبْلُ لَا يُوَلُّونَ الْأَدْبَارَ وَكَانَ عَهْدُ اللَّهِ مَسْئُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ كَانُوا عَاهَدُوا اللَّه مِنْ قَبْل لَا يُوَلُّونَ الْأَدْبَار وَكَانَ عَهْد اللَّه مَسْئُولًا" </quran>عَنْ الْوَفَاء بِهِ</p></td></tr></table></body></html>
