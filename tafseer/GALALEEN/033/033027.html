<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَوْرَثَكُمْ أَرْضَهُمْ وَدِيَارَهُمْ وَأَمْوَالَهُمْ وَأَرْضًا لَمْ تَطَئُوهَا وَكَانَ اللَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَوْرَثَكُمْ أَرْضهمْ وَدِيَارهمْ وَأَمْوَالهمْ وَأَرْضًا لَمْ تَطَئُوهَا" </quran>بَعْد وَهِيَ خَيْبَر أُخِذَتْ بَعْد قُرَيْظَة</p></td></tr></table></body></html>
