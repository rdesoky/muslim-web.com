<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا النَّبِيُّ إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا النَّبِيّ إنَّا أَرْسَلْنَاك شَاهِدًا" </quran>عَلَى مَنْ أَرْسَلْت إلَيْهِمْ <quran>"وَمُبَشِّرًا" </quran>مِنْ صِدْقك بِالْجَنَّةِ <quran>"وَنَذِيرًا" </quran>مُنْذِرًا مَنْ كَذَّبَك بِالنَّارِ</p></td></tr></table></body></html>
