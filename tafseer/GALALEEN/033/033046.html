<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَدَاعِيًا إِلَى اللَّهِ بِإِذْنِهِ وَسِرَاجًا مُنِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَدَاعِيًا إلَى اللَّه" </quran>إلَى طَاعَته <quran>"بِإِذْنِهِ" </quran>بِأَمْرِهِ <quran>"وَسِرَاجًا مُنِيرًا" </quran>أَيْ مِثْله فِي الِاهْتِدَاء بِهِ</p></td></tr></table></body></html>
