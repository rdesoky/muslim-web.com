<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَشِّرِ الْمُؤْمِنِينَ بِأَنَّ لَهُمْ مِنَ اللَّهِ فَضْلًا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَبَشِّرْ الْمُؤْمِنِينَ بِأَنَّ لَهُمْ مِنْ اللَّه فَضْلًا كَبِيرًا" </quran>هُوَ الْجَنَّة</p></td></tr></table></body></html>
