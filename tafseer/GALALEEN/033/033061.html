<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَلْعُونِينَ أَيْنَمَا ثُقِفُوا أُخِذُوا وَقُتِّلُوا تَقْتِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَلْعُونِينَ" </quran>مُبْعَدِينَ عَنْ الرَّحْمَة <quran>"أَيْنَمَا ثُقِفُوا" </quran>وُجِدُوا <quran>"أُخِذُوا وَقُتِّلُوا تَقْتِيلًا" </quran>أَيْ الْحُكْم فِيهِمْ هَذَا عَلَى جِهَة الْأَمْر بِهِ</p></td></tr></table></body></html>
