<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سُنَّةَ اللَّهِ فِي الَّذِينَ خَلَوْا مِنْ قَبْلُ وَلَنْ تَجِدَ لِسُنَّةِ اللَّهِ تَبْدِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"سُنَّة اللَّه" </quran>أَيْ سَنَّ اللَّه ذَلِكَ <quran>"فِي الَّذِينَ خَلَوْا مِنْ قَبْل" </quran>مِنْ الْأُمَم الْمَاضِيَة فِي مُنَافِقِيهِمْ الْمُرْجَفِينَ الْمُؤْمِنِينَ <quran>"وَلَنْ تَجِد لِسُنَّةِ اللَّه تَبْدِيلًا" </quran>مِنْهُ</p></td></tr></table></body></html>
