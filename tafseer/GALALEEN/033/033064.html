<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه لَعَنَ الْكَافِرِينَ" </quran>أَبْعَدَهُمْ <quran>"وَأَعَدَّ لَهُمْ سَعِيرًا" </quran>نَارًا شَدِيدَة يَدْخُلُونَهَا</p></td></tr></table></body></html>
