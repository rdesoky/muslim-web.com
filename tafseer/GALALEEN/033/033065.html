<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا أَبَدًا لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَالِدِينَ" </quran>مُقَدَّرًا خُلُودهمْ <quran>"فِيهَا أَبَدًا لَا يَجِدُونَ وَلِيًّا" </quran>يَحْفَظهُمْ عَنْهَا <quran>"وَلَا نَصِيرًا" </quran>يَدْفَعهَا عَنْهُمْ</p></td></tr></table></body></html>
