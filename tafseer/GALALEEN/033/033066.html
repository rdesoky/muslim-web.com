<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ تُقَلَّبُ وُجُوهُهُمْ فِي النَّارِ يَقُولُونَ يَا لَيْتَنَا أَطَعْنَا اللَّهَ وَأَطَعْنَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم تُقَلَّب وُجُوههمْ فِي النَّار يَقُولُونَ يَا" </quran>لِلتَّنْبِيهِ</p></td></tr></table></body></html>
