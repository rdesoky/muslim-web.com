<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَجْزِيَ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَئِكَ لَهُمْ مَغْفِرَةٌ وَرِزْقٌ كَرِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيَجْزِيَ" </quran>فِيهَا <quran>"الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَات أُولَئِكَ لَهُمْ مَغْفِرَة وَرِزْق كَرِيم" </quran>حَسَن فِي الْجَنَّة</p></td></tr></table></body></html>
