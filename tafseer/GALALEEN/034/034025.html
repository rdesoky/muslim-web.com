<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لَا تُسْأَلُونَ عَمَّا أَجْرَمْنَا وَلَا نُسْأَلُ عَمَّا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ لَا تُسْأَلُونَ عَمَّا أَجْرَمْنَا" </quran>أَذْنَبْنَا <quran>"وَلَا نُسْأَل عَمَّا تَعْمَلُونَ" </quran>لِأَنَّا بَرِيئُونَ مِنْكُمْ</p></td></tr></table></body></html>
