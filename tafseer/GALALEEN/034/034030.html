<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لَكُمْ مِيعَادُ يَوْمٍ لَا تَسْتَأْخِرُونَ عَنْهُ سَاعَةً وَلَا تَسْتَقْدِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ لَكُمْ مِيعَاد يَوْم لَا تَسْتَأْخِرُونَ عَنْهُ سَاعَة وَلَا تَسْتَقْدِمُونَ" </quran>عَلَيْهِ وَهُوَ يَوْم الْقِيَامَة</p></td></tr></table></body></html>
