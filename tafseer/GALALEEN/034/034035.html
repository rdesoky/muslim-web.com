<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا نَحْنُ أَكْثَرُ أَمْوَالًا وَأَوْلَادًا وَمَا نَحْنُ بِمُعَذَّبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا نَحْنُ أَكْثَر أَمْوَالًا وَأَوْلَادًا" </quran>مِمَّنْ آمَنَ</p></td></tr></table></body></html>
