<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا آتَيْنَاهُمْ مِنْ كُتُبٍ يَدْرُسُونَهَا وَمَا أَرْسَلْنَا إِلَيْهِمْ قَبْلَكَ مِنْ نَذِيرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا أَتَيْنَاهُمْ مِنْ كُتُب يَدْرُسُونَهَا وَمَا أَرْسَلْنَا إلَيْهِمْ قَبْلك مِنْ نَذِير" </quran>فَمِنْ أَيْنَ كَذَّبُوك</p></td></tr></table></body></html>
