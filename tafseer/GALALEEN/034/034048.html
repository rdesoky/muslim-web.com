<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّ رَبِّي يَقْذِفُ بِالْحَقِّ عَلَّامُ الْغُيُوبِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنَّ رَبِّي يَقْذِف بِالْحَقِّ" </quran>يُلْقِيه إلَى أَنْبِيَائِهِ . <quran>"عَلَّام الْغُيُوب" </quran>مَا غَابَ عَنْ خَلْقه فِي السَّمَاوَات وَالْأَرْض</p></td></tr></table></body></html>
