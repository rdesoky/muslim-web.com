<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ جَاءَ الْحَقُّ وَمَا يُبْدِئُ الْبَاطِلُ وَمَا يُعِيدُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ جَاءَ الْحَقّ" </quran>الْإِسْلَام <quran>"وَمَا يُبْدِئ الْبَاطِل" </quran>الْكُفْر <quran>"وَمَا يُعِيد" </quran>أَيْ لَمْ يَبْقَ لَهُ أَثَر</p></td></tr></table></body></html>
