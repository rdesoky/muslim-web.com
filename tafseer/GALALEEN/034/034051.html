<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ تَرَى إِذْ فَزِعُوا فَلَا فَوْتَ وَأُخِذُوا مِنْ مَكَانٍ قَرِيبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ تَرَى" </quran>يَا مُحَمَّد <quran>"إذْ فَزِعُوا" </quran>عِنْد الْبَعْث لَرَأَيْت أَمْرًا عَظِيمًا <quran>"فَلَا فَوْت" </quran>لَهُمْ مِنَّا أَيْ لَا يَفُوتُونَنَا <quran>"وَأُخِذُوا مِنْ مَكَان قَرِيب" </quran>أَيْ الْقُبُور</p></td></tr></table></body></html>
