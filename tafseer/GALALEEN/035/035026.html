<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَخَذْتُ الَّذِينَ كَفَرُوا فَكَيْفَ كَانَ نَكِيرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ أَخَذَتْ الَّذِينَ كَفَرُوا" </quran>بِتَكْذِيبِهِمْ <quran>"فَكَيْفَ كَانَ نَكِير" </quran>إنْكَارِي عَلَيْهِمْ بِالْعُقُوبَةِ وَالْإِهْلَاك أَيْ هُوَ وَاقِع مَوْقِعه</p></td></tr></table></body></html>
