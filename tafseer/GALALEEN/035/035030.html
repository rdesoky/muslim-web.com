<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيُوَفِّيَهُمْ أُجُورَهُمْ وَيَزِيدَهُمْ مِنْ فَضْلِهِ إِنَّهُ غَفُورٌ شَكُورٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيُوفِيَهُمْ أُجُورهمْ" </quran>ثَوَاب أَعْمَالهمْ الْمَذْكُورَة <quran>"وَيَزِيدهُمْ مِنْ فَضْله إنَّهُ غَفُور" </quran>لِذُنُوبِهِمْ <quran>"شَكُور" </quran>لِطَاعَتِهِمْ</p></td></tr></table></body></html>
