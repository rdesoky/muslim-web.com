<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنَّا الْحَزَنَ إِنَّ رَبَّنَا لَغَفُورٌ شَكُورٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا الْحَمْد لِلَّهِ الَّذِي أَذْهَبَ عَنَّا الْحَزَن" </quran>جَمِيعه <quran>"إنَّ رَبّنَا لَغَفُور" </quran>لِلذُّنُوبِ <quran>"شَكُور" </quran>لِلطَّاعَةِ</p></td></tr></table></body></html>
