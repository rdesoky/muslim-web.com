<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ عَالِمُ غَيْبِ السَّمَاوَاتِ وَالْأَرْضِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه عَالِم السَّمَوَات وَالْأَرْض إنَّهُ عَلِيم بِذَاتِ الصُّدُور" </quran>بِمَا فِي الْقُلُوب فَعِلْمه بِغَيْرِهِ أَوْلَى بِالنَّظَرِ إلَى حَال النَّاس</p></td></tr></table></body></html>
