<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"عَلَى" </quran>مُتَعَلِّق بِمَا قَبْله <quran>"صِرَاط مُسْتَقِيم" </quran>أَيْ طَرِيق الْأَنْبِيَاء قَبْلك التَّوْحِيد وَالْهُدَى وَالتَّأْكِيد بِالْقَسَمِ وَغَيْره رَدّ لِقَوْلِ الْكُفَّار لَهُ <quran>"لَسْت مُرْسَلًا"</quran></p></td></tr></table></body></html>
