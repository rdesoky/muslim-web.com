<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِتُنْذِرَ قَوْمًا مَا أُنْذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِتُنْذِر" </quran>بِهِ <quran>"قَوْمًا" </quran>مُتَعَلِّق بِتَنْزِيلِ <quran>"مَا أَنُذِرَ آبَاؤُهُمْ" </quran>أَيْ لَمْ يُنْذَرُوا فِي زَمَن الْفَتْرَة <quran>"فَهُمْ" </quran>أَيْ الْقَوْم <quran>"غَافِلُونَ" </quran>عَنْ الْإِيمَان وَالرُّشْد</p></td></tr></table></body></html>
