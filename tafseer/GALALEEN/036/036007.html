<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ حَقَّ الْقَوْل" </quran>وَجَبَ <quran>"عَلَى أَكْثَرهمْ" </quran>بِالْعَذَابِ <quran>"فَهُمْ لَا يُؤْمِنُونَ" </quran>أَيْ الْأَكْثَر</p></td></tr></table></body></html>
