<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَسَوَاء عَلَيْهِمْ أَأَنْذَرْتهمْ" </quran>بِتَحْقِيقِ الْهَمْزَتَيْنِ وَإِبْدَال الثَّانِيَة أَلِفًا وَتَسْهِيلهَا وَإِدْخَال أَلِف بَيْن الْمُسَهَّلَة وَالْأُخْرَى وَتَرْكه</p></td></tr></table></body></html>
