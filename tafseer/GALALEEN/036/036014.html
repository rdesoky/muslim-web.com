<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ أَرْسَلْنَا إِلَيْهِمُ اثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ فَقَالُوا إِنَّا إِلَيْكُمْ مُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ أَرْسَلْنَا إلَيْهِمْ اثْنَيْنِ فَكَذَّبُوهُمَا" </quran>إلَى آخِره بَدَل مِنْ إذْ الْأُولَى <quran>"فَعَزَّزْنَا" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد : قَوَّيْنَا الِاثْنَيْنِ</p></td></tr></table></body></html>
