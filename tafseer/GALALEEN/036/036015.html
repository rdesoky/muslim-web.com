<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا مَا أَنْتُمْ إِلَّا بَشَرٌ مِثْلُنَا وَمَا أَنْزَلَ الرَّحْمَنُ مِنْ شَيْءٍ إِنْ أَنْتُمْ إِلَّا تَكْذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا مَا أَنْتُمْ إلَّا بَشَر مِثْلنَا وَمَا أَنَزَلَ الرَّحْمَن مِنْ شَيْء إنْ" </quran>مَا</p></td></tr></table></body></html>
