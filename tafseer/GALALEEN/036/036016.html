<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا رَبّنَا يَعْلَم" </quran>جَارٍ مَجْرَى الْقَسَم وَزِيدَ التَّأْكِيد بِهِ وَبِاللَّامِ عَلَى مَا قَبْله لِزِيَادَةِ الْإِنْكَار فِي <quran>"إنَّا إلَيْكُمْ لَمُرْسَلُونَ"</quran></p></td></tr></table></body></html>
