<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا عَلَيْنَا إِلَّا الْبَلَاغُ الْمُبِينُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا عَلَيْنَا إلَّا الْبَلَاغ الْمُبِين" </quran>التَّبْلِيغ الْمُبِين الظَّاهِر بِالْأَدِلَّةِ الْوَاضِحَة وَهِيَ إبْرَاء الْأَكْمَه وَالْأَبْرَص وَالْمَرِيض وَإِحْيَاء الْمَيِّت</p></td></tr></table></body></html>
