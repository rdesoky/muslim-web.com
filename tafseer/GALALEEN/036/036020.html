<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَى قَالَ يَا قَوْمِ اتَّبِعُوا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَاءَ مِنْ أَقْصَى الْمَدِينَة رَجُل" </quran>هُوَ حَبِيب النَّجَّار كَانَ قَدْ آمَنَ بِالرُّسُلِ وَمَنْزِله بِأَقْصَى الْبَلَد <quran>"يَسْعَى" </quran>يَشْتَدّ عَدْوًا لَمَّا سَمِعَ بِتَكْذِيبِ الْقَوْم الرُّسُل</p></td></tr></table></body></html>
