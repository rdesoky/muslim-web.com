<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اتَّبِعُوا مَنْ لَا يَسْأَلُكُمْ أَجْرًا وَهُمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اتَّبِعُوا" </quran>تَأْكِيد لِلْأَوَّلِ <quran>"مَنْ لَا يَسْأَلكُمْ أَجْرًا" </quran>عَلَى رِسَالَته <quran>"وَهُمْ مُهْتَدُونَ" </quran>فَقِيلَ لَهُ : أَنْتَ عَلَى دِينهمْ</p></td></tr></table></body></html>
