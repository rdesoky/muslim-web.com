<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قِيلَ ادْخُلِ الْجَنَّةَ قَالَ يَا لَيْتَ قَوْمِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"قِيلَ" </quran>لَهُ عِنْد مَوْته <quran>"اُدْخُلْ الْجَنَّة" </quran>وَقِيلَ دَخَلَهَا حَيًّا <quran>"قَالَ يَا" </quran>حَرْف تَنْبِيه</p></td></tr></table></body></html>
