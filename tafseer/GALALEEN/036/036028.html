<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْزَلْنَا عَلَى قَوْمِهِ مِنْ بَعْدِهِ مِنْ جُنْدٍ مِنَ السَّمَاءِ وَمَا كُنَّا مُنْزِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا" </quran>نَافِيَة <quran>"أَنْزَلْنَا عَلَى قَوْمه" </quran>أَيْ حَبِيب <quran>"مِنْ بَعْده" </quran>بَعْد مَوْته <quran>"مِنْ جُنْد مِنْ السَّمَاء" </quran>أَيْ مَلَائِكَة لِإِهْلَاكِهِمْ <quran>"وَمَا كُنَّا مُنْزِلِينَ" </quran>مَلَائِكَة لِإِهْلَاكِ أَحَد</p></td></tr></table></body></html>
