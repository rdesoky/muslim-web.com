<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ خَامِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ" </quran>مَا <quran>"كَانَتْ" </quran>عُقُوبَتهمْ <quran>"إلَّا صَيْحَة وَاحِدَة" </quran>صَاحَ بِهِمْ جِبْرِيل <quran>"فَإِذَا هُمْ خَامِدُونَ" </quran>سَاكِنُونَ مَيِّتُونَ</p></td></tr></table></body></html>
