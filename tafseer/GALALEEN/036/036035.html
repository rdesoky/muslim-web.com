<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَأْكُلُوا مِنْ ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ أَفَلَا يَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيَأْكُلُوا مِنْ ثَمَره" </quran>بِفَتْحَتَيْنِ وَضَمَّتَيْنِ أَيْ ثَمَر الْمَذْكُور مِنْ النَّخِيل وَغَيْره <quran>"وَمَا عَمِلَتْهُ أَيْدِيهمْ" </quran>أَيْ لَمْ تَعْمَل الثَّمَر <quran>"أَفَلَا يَشْكُرُونَ" </quran>أَنْعُمه تَعَالَى عَلَيْهِمْ</p></td></tr></table></body></html>
