<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآيَة لَهُمْ" </quran>عَلَى الْقُدْرَة الْعَظِيمَة <quran>"اللَّيْل نَسْلَخ" </quran>نَفْصِل <quran>"مِنْهُ النَّهَار فَإِذَا هُمْ مُظْلِمُونَ" </quran>دَاخِلُونَ فِي الظَّلَام</p></td></tr></table></body></html>
