<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ نَشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنْقَذُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنْ نَشَأْ نُغْرِقهُمْ" </quran>مَعَ إيجَاد السُّفُن <quran>"فَلَا صَرِيخ" </quran>مُغِيث <quran>"لَهُمْ وَلَا هُمْ يُنْقِذُونَ" </quran>يَنْجُونَ</p></td></tr></table></body></html>
