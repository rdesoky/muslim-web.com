<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا رَحْمَةً مِنَّا وَمَتَاعًا إِلَى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا رَحْمَة مِنَّا وَمَتَاعًا إلَى حِين" </quran>أَيْ لَا يُنْجِيهِمْ إلَّا رَحْمَتنَا لَهُمْ وَتَمْتِيعنَا إيَّاهُمْ بِلَذَّاتِهِمْ إلَى انْقِضَاء آجَالهمْ</p></td></tr></table></body></html>
