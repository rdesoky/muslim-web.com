<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قِيلَ لَهُمُ اتَّقُوا مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا قِيلَ لَهُمْ اتَّقُوا مَا بَيْن أَيْدِيكُمْ" </quran>مِنْ عَذَاب الدُّنْيَا كَغَيْرِهِمْ <quran>"وَمَا خَلْفكُمْ" </quran>مِنْ عَذَاب الْآخِرَة <quran>"لَعَلَّكُمْ تُرْحَمُونَ" </quran>أَعْرَضُوا</p></td></tr></table></body></html>
