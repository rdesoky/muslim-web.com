<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَا إِلَى أَهْلِهِمْ يَرْجِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا يَسْتَطِيعُونَ تَوْصِيَة" </quran>أَيْ أَنْ يُوصُوا <quran>"وَلَا إلَى أَهْلهمْ يَرْجِعُونَ" </quran>مِنْ أَسْوَاقهمْ وَأَشْغَالهمْ بَلْ يَمُوتُونَ فِيهَا</p></td></tr></table></body></html>
