<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْئًا وَلَا تُجْزَوْنَ إِلَّا مَا كُنْتُمْ تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَالْيَوْم لَا تُظْلَم نَفْس شَيْئًا وَلَا تُجْزَوْنَ إلَّا" </quran>جَزَاء</p></td></tr></table></body></html>
