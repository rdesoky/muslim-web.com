<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَامْتَازُوا الْيَوْمَ أَيُّهَا الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran><quran>"امْتَازُوا الْيَوْم أَيّهَا الْمُجْرِمُونَ" </quran>أَيْ انْفَرَدُوا عَنْ الْمُؤْمِنِينَ عِنْد اخْتِلَاطهمْ بِهِمْ</p></td></tr></table></body></html>
