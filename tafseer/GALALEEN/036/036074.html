<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّخَذُوا مِنْ دُونِ اللَّهِ آلِهَةً لَعَلَّهُمْ يُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاِتَّخَذُوا مِنْ دُون اللَّه" </quran>أَيْ غَيْره <quran>"آلِهَة" </quran>أَصْنَامًا يَعْبُدُونَهَا <quran>"لَعَلَّهُمْ يُنْصَرُونَ" </quran>يُمْنَعُونَ مِنْ عَذَاب اللَّه تَعَالَى بِشَفَاعَةِ آلِهَتهمْ بِزَعْمِهِمْ</p></td></tr></table></body></html>
