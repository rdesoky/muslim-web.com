<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُنْدٌ مُحْضَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَسْتَطِيعُونَ" </quran>أَيْ آلِهَتهمْ نَزَلُوا مَنْزِلَة الْعُقَلَاء <quran>"نَصْرهُمْ وَهُمْ" </quran>أَيْ آلِهَتهمْ مِنْ الْأَصْنَام <quran>"لَهُمْ جُنْد" </quran>بِزَعْمِهِمْ نَصْرهمْ <quran>"مُحْضَرُونَ" </quran>فِي النَّار مَعَهُمْ</p></td></tr></table></body></html>
