<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا يَحْزُنْكَ قَوْلُهُمْ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا يَحْزُنك قَوْلهمْ" </quran>لَك : لَسْت مُرْسَلًا وَغَيْر ذَلِكَ <quran>"إنَّا نَعْلَم مَا يُسِرُّونَ وَمَا يُعْلِنُونَ" </quran>مِنْ ذَلِكَ وَغَيْره فَنُجَازِيهِمْ عَلَيْهِ</p></td></tr></table></body></html>
