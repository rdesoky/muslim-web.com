<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يُحْيِيهَا الَّذِي أَنْشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ يُحْيِيهَا الَّذِي أَنْشَأَهَا أَوَّل مَرَّة وَهُوَ بِكُلِّ خَلْق" </quran>مَخْلُوق <quran>"عَلِيم" </quran>مُجْمَلًا وَمُفَصَّلًا قَبْل خَلْقه وَبَعْد خَلْقه</p></td></tr></table></body></html>
