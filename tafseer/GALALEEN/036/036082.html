<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا أَمْره" </quran>شَأْنه <quran>"إذَا أَرَادَ شَيْئًا" </quran>أَيْ خَلْق شَيْء <quran>"أَنْ يَقُول لَهُ كُنْ فَيَكُون" </quran>أَيْ فَهُوَ يَكُون وَفِي قِرَاءَة بِالنَّصْبِ عَطْفًا عَلَى يَقُول</p></td></tr></table></body></html>
