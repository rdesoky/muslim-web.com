<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسُبْحَان الَّذِي بِيَدِهِ مَلَكُوت" </quran>مُلْك زِيدَتْ الْوَاو وَالتَّاء لِلْمُبَالَغَةِ أَيْ الْقُدْرَة عَلَى <quran>"كُلّ شَيْء وَإِلَيْهِ تُرْجَعُونَ" </quran>تُرَدُّونَ فِي الْآخِرَة</p></td></tr></table></body></html>
