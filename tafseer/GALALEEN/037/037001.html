<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالصَّافَّاتِ صَفًّا</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الصَّافَّات [ مَكِّيَّة وَآيَاتهَا نَزَلَتْ بَعْد الْأَنْعَام ]</p><p><quran>"وَالصَّافَّات صَفًّا" </quran>الْمَلَائِكَة تَصُفّ نُفُوسهَا فِي الْعِبَادَة أَوْ أَجْنِحَتهَا فِي الْهَوَاء تَنْتَظِر مَا تُؤْمَر بِهِ</p></td></tr></table></body></html>
