<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا وَرَبُّ الْمَشَارِقِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَبّ السَّمَاوَات وَالْأَرْض وَمَا بَيْنهمَا وَرَبّ الْمَشَارِق" </quran>أَيْ وَالْمَغَارِب لِلشَّمْسِ لَهَا كُلّ يَوْم مَشْرِق وَمَغْرِب</p></td></tr></table></body></html>
