<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا زَيَّنَّا السَّمَاءَ الدُّنْيَا بِزِينَةٍ الْكَوَاكِبِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا زَيَّنَّا السَّمَاء الدُّنْيَا بِزِينَةٍ الْكَوَاكِب" </quran>أَيْ بِضَوْئِهَا أَوْ بِهَا وَالْإِضَافَة لِلْبَيَانِ كَقِرَاءَةِ تَنْوِين زِينَة الْمُبَيَّنَة بِالْكَوَاكِبِ</p></td></tr></table></body></html>
