<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحِفْظًا مِنْ كُلِّ شَيْطَانٍ مَارِدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحِفْظًا" </quran>مَنْصُوب بِفِعْلٍ مُقَدَّر : أَيْ حَفِظْنَاهَا بِالشُّهُبِ <quran>"مِنْ كُلّ" </quran>مُتَعَلِّق بِالْمُقَدَّرِ <quran>"شَيْطَان مَارِد" </quran>عَاتٍ خَارِج عَنْ الطَّاعَة</p></td></tr></table></body></html>
