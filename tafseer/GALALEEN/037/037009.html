<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>دُحُورًا وَلَهُمْ عَذَابٌ وَاصِبٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"دُحُورًا" </quran>مَصْدَر دَحَرَهُ : أَيْ طَرَدَهُ وَأَبْعَدَهُ وَهُوَ مَفْعُول لَهُ <quran>"وَلَهُمْ" </quran>فِي الْآخِرَة <quran>"عَذَاب وَاصِب" </quran>دَائِم</p></td></tr></table></body></html>
