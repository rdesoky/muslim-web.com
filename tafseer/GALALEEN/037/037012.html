<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ عَجِبْتَ وَيَسْخَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ" </quran>لِلِانْتِقَالِ مِنْ غَرَض إلَى آخَر وَهُوَ الْإِخْبَار بِحَالِهِ وَحَالهمْ <quran>"عَجِبْت" </quran>بِفَتْحِ التَّاء خِطَابًا لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَيْ مِنْ تَكْذِيبهمْ إيَّاكَ <quran>"وَيَسْخَرُونَ" </quran>مِنْ تَعَجُّبك</p></td></tr></table></body></html>
