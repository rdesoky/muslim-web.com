<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا ذُكِّرُوا لَا يَذْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا ذُكِّرُوا" </quran>وُعِظُوا بِالْقُرْآنِ <quran>"لَا يَذْكُرُونَ" </quran>لَا يَتَّعِظُونَ</p></td></tr></table></body></html>
