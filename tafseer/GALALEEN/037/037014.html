<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْا آيَةً يَسْتَسْخِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا رَأَوْا آيَة" </quran>كَانْشِقَاقِ الْقَمَر <quran>"يَسْتَسْخِرُونَ" </quran>يُسْتَهْزَءُونَ بِهَا</p></td></tr></table></body></html>
