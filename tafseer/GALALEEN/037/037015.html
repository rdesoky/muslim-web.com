<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا إِنْ هَذَا إِلَّا سِحْرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>فِيهَا <quran>"إنْ" </quran>مَا <quran>"هَذَا إلَّا سِحْر مُبِين" </quran>بَيِّن وَقَالُوا مُنْكِرِينَ لِلْبَعْثِ :</p></td></tr></table></body></html>
