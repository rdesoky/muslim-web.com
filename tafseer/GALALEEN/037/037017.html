<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوَآبَاؤُنَا الْأَوَّلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ آبَاؤُنَا الْأَوَّلُونَ" </quran>بِسُكُونِ الْوَاو عَطْفًا بِأَوْ وَبِفَتْحِهَا وَالْهَمْزَة لِلِاسْتِفْهَامِ وَالْعَطْف بِالْوَاوِ وَالْمَعْطُوف عَلَيْهِ مَحَلّ إنَّ وَاسْمهَا أَوْ الضَّمِير فِي لَمَبْعُوثُونَ وَالْفَاصِل هَمْزَة الِاسْتِفْهَام</p></td></tr></table></body></html>
