<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ فَإِذَا هُمْ يَنْظُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنَّمَا هِيَ" </quran>ضَمِير مُبْهَم يُفَسِّرهُ : <quran>"زَجْرَة" </quran>أَيْ صَيْحَة <quran>"وَاحِدَة فَإِذَا هُمْ" </quran>أَيْ الْخَلَائِق أَحْيَاء <quran>"يَنْظُرُونَ" </quran>مَا يُفْعَل بِهِمْ</p></td></tr></table></body></html>
