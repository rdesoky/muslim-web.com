<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا يَا وَيْلَنَا هَذَا يَوْمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>أَيْ الْكُفَّار <quran>"يَا" </quran><quran>"وَيْلنَا" </quran>هَلَاكنَا وَهُوَ مَصْدَر لَا فِعْل لَهُ مِنْ لَفْظه وَتَقُول لَهُمْ الْمَلَائِكَة : <quran>"هَذَا يَوْم الدِّين" </quran>يَوْم الْحِسَاب وَالْجَزَاء</p></td></tr></table></body></html>
