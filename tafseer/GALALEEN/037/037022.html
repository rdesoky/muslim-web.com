<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>احْشُرُوا الَّذِينَ ظَلَمُوا وَأَزْوَاجَهُمْ وَمَا كَانُوا يَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَيُقَال لِلْمَلَائِكَةِ : <quran>"اُحْشُرُوا الَّذِينَ ظَلَمُوا" </quran>أَنْفُسهمْ بِالشِّرْكِ <quran>"وَأَزْوَاجهمْ" </quran>قُرَنَاءَهُمْ مِنْ الشَّيَاطِين</p></td></tr></table></body></html>
