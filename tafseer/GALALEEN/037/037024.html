<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقِفُوهُمْ إِنَّهُمْ مَسْئُولُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقِفُوهُمْ" </quran>احْبِسُوهُمْ عِنْد الصِّرَاط <quran>"إنَّهُمْ مَسْئُولُونَ" </quran>عَنْ جَمِيع أَقْوَالهمْ وَأَفْعَالهمْ وَيُقَال لَهُمْ تَوْبِيخًا :</p></td></tr></table></body></html>
