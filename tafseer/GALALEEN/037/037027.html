<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَقْبَلَ بَعْضُهُمْ عَلَى بَعْضٍ يَتَسَاءَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَقْبَلَ بَعْضهمْ عَلَى بَعْض يَتَسَاءَلُونَ" </quran>يَتَلَاوَمُونَ وَيَتَخَاصَمُونَ</p></td></tr></table></body></html>
