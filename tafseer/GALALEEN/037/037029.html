<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ لَمْ تَكُونُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>أَيْ الْمُتَّبِعُونَ لَهُمْ <quran>"بَلْ لَمْ تَكُونُوا مُؤْمِنِينَ" </quran>وَإِنَّمَا يَصْدُق الْإِضْلَال مِنَّا أَنْ لَوْ كُنْتُمْ مُؤْمِنِينَ فَرَجَعْتُمْ عَنْ الْإِيمَان إلَيْنَا</p></td></tr></table></body></html>
