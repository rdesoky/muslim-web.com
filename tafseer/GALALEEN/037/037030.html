<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ لَنَا عَلَيْكُمْ مِنْ سُلْطَانٍ بَلْ كُنْتُمْ قَوْمًا طَاغِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا كَانَ لَنَا عَلَيْكُمْ مِنْ سُلْطَان" </quran>قُوَّة وَقُدْرَة تَقْهَركُمْ عَلَى مُتَابَعَتنَا <quran>"بَلْ كُنْتُمْ قَوْمًا طَاغِينَ" </quran>ضَالِّينَ مِثْلنَا</p></td></tr></table></body></html>
