<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّهُمْ يَوْمَئِذٍ فِي الْعَذَابِ مُشْتَرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنَّهُمْ يَوْمئِذٍ" </quran>يَوْم الْقِيَامَة <quran>"فِي الْعَذَاب مُشْتَرِكُونَ" </quran>أَيْ لِاشْتِرَاكِهِمْ فِي الْغَوَايَة</p></td></tr></table></body></html>
