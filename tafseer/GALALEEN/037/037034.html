<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَذَلِكَ نَفْعَلُ بِالْمُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا كَذَلِكَ" </quran>كَمَا نَفْعَل بِهَؤُلَاءِ <quran>"نَفْعَل بِالْمُجْرِمِينَ" </quran>غَيْر هَؤُلَاءِ : أَيْ نُعَذِّبهُمْ التَّابِع مِنْهُمْ وَالْمَتْبُوع</p></td></tr></table></body></html>
