<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُمْ" </quran>أَيْ هَؤُلَاءِ بِقَرِينَةِ مَا بَعْده</p></td></tr></table></body></html>
