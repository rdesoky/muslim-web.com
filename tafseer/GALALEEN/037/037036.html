<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ أَئِنَّا لَتَارِكُو آلِهَتِنَا لِشَاعِرٍ مَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَقُولُونَ أَإِنَّا" </quran>فِي هَمْزَتَيْهِ مَا تَقَدَّمَ <quran>"لَتَارِكُوا آلِهَتنَا لِشَاعِرٍ مَجْنُون" </quran>أَيْ لِأَجْلِ مُحَمَّد</p></td></tr></table></body></html>
