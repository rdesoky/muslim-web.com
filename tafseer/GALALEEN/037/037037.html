<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ جَاءَ بِالْحَقِّ وَصَدَّقَ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ جَاءَ بِالْحَقِّ وَصَدَّقَ الْمُرْسَلِينَ" </quran>الْجَائِينَ بِهِ وَهُوَ أَنْ لَا إلَه إلَّا اللَّه</p></td></tr></table></body></html>
