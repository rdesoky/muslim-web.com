<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَ اللَّهِ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا عِبَاد اللَّه الْمُخْلَصِينَ" </quran>أَيْ الْمُؤْمِنِينَ اسْتِثْنَاء مُنْقَطِع أَيْ ذَكَرَ جَزَاءَهُمْ فِي الْآيَة التَّالِيَة</p></td></tr></table></body></html>
