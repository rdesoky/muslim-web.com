<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَاكِهُ وَهُمْ مُكْرَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَوَاكِه" </quran>بَدَل أَوْ بَيَان لِلرِّزْقِ وَهُوَ مَا يُؤْكَل تَلَذُّذًا لَا لِحِفْظِ صِحَّة لِأَنَّ أَهْل الْجَنَّة مُسْتَغْنَوْنَ عَنْ حِفْظهَا بِخَلْقِ أَجْسَامهمْ لِلْأَبَدِ <quran>"وَهُمْ مُكْرَمُونَ" </quran>بِثَوَابِ اللَّه سُبْحَانه وَتَعَالَى</p></td></tr></table></body></html>
