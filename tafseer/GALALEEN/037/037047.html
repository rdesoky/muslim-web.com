<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا فِيهَا غَوْلٌ وَلَا هُمْ عَنْهَا يُنْزَفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا فِيهَا غَوْل" </quran>مَا يَغْتَال عُقُولهمْ <quran>"وَلَا هُمْ عَنْهَا يُنْزَفُونَ" </quran>بِفَتْحِ الزَّاي وَكَسْرهَا مِنْ نَزَفَ الشَّارِب وَأَنْزَفَ : أَيْ يَسْكَرُونَ بِخِلَافِ خَمْر الدُّنْيَا</p></td></tr></table></body></html>
