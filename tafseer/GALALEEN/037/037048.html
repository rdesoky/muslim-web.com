<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعِنْدَهُمْ قَاصِرَاتُ الطَّرْفِ عِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَعِنْدهمْ قَاصِرَات الطَّرْف" </quran>حَابِسَات الْأَعْيُن عَلَى أَزْوَاجهنَّ لَا يَنْظُرْنَ إلَى غَيْرهمْ لِحُسْنِهِمْ عِنْدهنَّ <quran>"عِين" </quran>ضِخَام الْأَعْيُن حِسَانهَا</p></td></tr></table></body></html>
