<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَقْبَلَ بَعْضُهُمْ عَلَى بَعْضٍ يَتَسَاءَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَقْبَلَ بَعْضهمْ" </quran>بَعْض أَهْل الْجَنَّة <quran>"عَلَى بَعْض يَتَسَاءَلُونَ" </quran>عَمَّا مَرَّ بِهِمْ فِي الدُّنْيَا</p></td></tr></table></body></html>
