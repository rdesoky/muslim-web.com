<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاطَّلَعَ فَرَآهُ فِي سَوَاءِ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاطَّلَعَ" </quran>ذَلِكَ الْقَائِل مِنْ بَعْض كُوَى الْجَنَّة <quran>"فَرَآهُ" </quran>أَيْ رَأَى قَرِينه <quran>"فِي سَوَاء الْجَحِيم" </quran>فِي وَسَط النَّار</p></td></tr></table></body></html>
