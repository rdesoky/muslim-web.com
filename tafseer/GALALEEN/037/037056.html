<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ تَاللَّهِ إِنْ كِدْتَ لَتُرْدِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>لَهُ تَشْمِيتًا <quran>"تَاللَّهِ إنْ" </quran>مُخَفَّفَة مِنْ الثَّقِيلَة <quran>"كِدْت" </quran>قَارَبْت <quran>"لَتُرْدِينِي" </quran>لِتُهْلِكنِي بِإِغْوَائِك</p></td></tr></table></body></html>
