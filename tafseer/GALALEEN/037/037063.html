<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا جَعَلْنَاهَا فِتْنَةً لِلظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا جَعَلْنَاهَا" </quran>بِذَلِكَ <quran>"فِتْنَة لِلظَّالِمِينَ" </quran>أَيْ الْكَافِرِينَ مِنْ أَهْل مَكَّة إذْ قَالُوا : النَّار تُحْرِق الشَّجَر فَكَيْفَ تُنْبِتهُ</p></td></tr></table></body></html>
