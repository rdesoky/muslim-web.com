<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهَا شَجَرَةٌ تَخْرُجُ فِي أَصْلِ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهَا شَجَرَة تَخْرُج فِي أَصْل الْجَحِيم" </quran>أَيْ قَعْر جَهَنَّم وَأَغْصَانهَا تَرْتَفِع إلَى دَرَكَاتهَا</p></td></tr></table></body></html>
