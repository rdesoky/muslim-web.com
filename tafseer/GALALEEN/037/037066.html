<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّهُمْ لَآكِلُونَ مِنْهَا فَمَالِئُونَ مِنْهَا الْبُطُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنَّهُمْ" </quran>أَيْ الْكُفَّار <quran>"لَآكِلُونَ مِنْهَا" </quran>مَعَ قُبْحهَا لِشِدَّةِ جُوعهمْ</p></td></tr></table></body></html>
