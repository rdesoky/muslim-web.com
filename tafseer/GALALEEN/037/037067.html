<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّ لَهُمْ عَلَيْهَا لَشَوْبًا مِنْ حَمِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ إنَّ لَهُمْ عَلَيْهَا لَشَوْبًا مِنْ حَمِيم" </quran>أَيْ مَاء حَارّ يَشْرَبُونَهُ فَيَخْتَلِط بِالْمَأْكُولِ مِنْهَا فَيَصِير شَوْبًا لَهُ</p></td></tr></table></body></html>
