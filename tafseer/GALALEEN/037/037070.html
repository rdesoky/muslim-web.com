<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَهُمْ عَلَى آثَارِهِمْ يُهْرَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَهُمْ عَلَى آثَارهمْ يُهْرَعُونَ" </quran>يُزْعَجُونَ إلَى اتِّبَاعهمْ فَيُسْرِعُونِ إلَيْهِ</p></td></tr></table></body></html>
