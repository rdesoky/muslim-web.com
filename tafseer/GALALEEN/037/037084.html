<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ جَاءَ رَبَّهُ بِقَلْبٍ سَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ جَاءَ رَبّه" </quran>أَيْ تَابَعَهُ وَقْت مَجِيئِهِ <quran>"بِقَلْبٍ سَلِيم" </quran>مِنْ الشَّكّ وَغَيْره</p></td></tr></table></body></html>
