<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَاذَا تَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ قَالَ" </quran>فِي هَذِهِ الْحَالَة الْمُسْتَمِرَّة لَهُ <quran>"لِأَبِيهِ وَقَوْمه" </quran>قَالَ مُوَبِّخًا لِأَبِيهِ وَقَوْمه <quran>"مَاذَا" </quran>مَا الَّذِي</p></td></tr></table></body></html>
