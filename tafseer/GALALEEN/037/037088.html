<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَنَظَرَ نَظْرَةً فِي النُّجُومِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَنَظَرَ نَظْرَة فِي النُّجُوم" </quran>إيهَامًا لَهُمْ أَنَّهُ يَعْتَمِد عَلَيْهَا لِيَعْتَمِدُوهُ</p></td></tr></table></body></html>
