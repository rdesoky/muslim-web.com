<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَرَاغَ إِلَى آلِهَتِهِمْ فَقَالَ أَلَا تَأْكُلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَرَاغَ" </quran>مَالَ فِي خُفْيَة <quran>"إلَى آلِهَتهمْ" </quran>وَهِيَ الْأَصْنَام وَعِنْدهَا الطَّعَام <quran>"فَقَالَ" </quran>اسْتِهْزَاء <quran>"أَلَا تَأْكُلُونَ" </quran>فَلَمْ يَنْطِقُوا</p></td></tr></table></body></html>
