<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَرَاغَ عَلَيْهِمْ ضَرْبًا بِالْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَرَاغَ عَلَيْهِمْ ضَرْبًا بِالْيَمِينِ" </quran>بِالْقُوَّةِ فَكَسَرَهَا فَبَلَغَ قَوْمه مِمَّنْ رَآهُ</p></td></tr></table></body></html>
