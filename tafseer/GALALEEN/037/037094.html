<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَقْبَلُوا إِلَيْهِ يَزِفُّونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَقْبَلُوا إلَيْهِ يَزِفُّونَ" </quran>أَيْ يُسْرِعُونَ الْمَشْي فَقَالُوا لَهُ : نَحْنُ نَعْبُدهَا وَأَنْت تَكْسِرهَا</p></td></tr></table></body></html>
