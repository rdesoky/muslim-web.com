<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ خَلَقَكُمْ وَمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَللَّه خَلَقَكُمْ وَمَا تَعْمَلُونَ" </quran>مِنْ نَحْتكُمْ وَمَنْحُوتكُمْ فَاعْبُدُوهُ وَحْده وَمَا مَصْدَرِيَّة وَقِيلَ مَوْصُولَة وَقِيلَ مَوْصُوفَة</p></td></tr></table></body></html>
