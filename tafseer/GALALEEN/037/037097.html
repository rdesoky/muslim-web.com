<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا ابْنُوا لَهُ بُنْيَانًا فَأَلْقُوهُ فِي الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>بَيْنهمْ <quran>"ابْنُوا لَهُ بُنْيَانًا" </quran>فَامْلَئُوهُ حَطَبًا وَأَضْرِمُوهُ بِالنَّارِ فَإِذَا الْتَهَبَ <quran>"فَأَلْقُوهُ فِي الْجَحِيم" </quran>النَّار الشَّدِيدَة</p></td></tr></table></body></html>
