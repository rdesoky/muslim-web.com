<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرَادُوا بِهِ كَيْدًا فَجَعَلْنَاهُمُ الْأَسْفَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَرَادُوا بِهِ كَيْدًا" </quran>بِإِلْقَائِهِ فِي النَّار لِتُهْلِكهُ <quran>"فَجَعَلْنَاهُمْ الْأَسْفَلِينَ" </quran>الْمَقْهُورِينَ فَخَرَجَ مِنْ النَّار سَالِمًا</p></td></tr></table></body></html>
