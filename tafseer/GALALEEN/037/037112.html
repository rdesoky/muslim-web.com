<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَشَّرْنَاهُ بِإِسْحَاقَ نَبِيًّا مِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَبَشَّرْنَاهُ بِإِسْحَاقَ" </quran>اُسْتُدِلَّ بِذَلِكَ عَلَى أَنَّ الذَّبِيح غَيْره <quran>"نَبِيًّا" </quran>حَال مُقَدَّرَة : أَيْ يُوجَد مُقَدَّرًا نُبُوَّته</p></td></tr></table></body></html>
