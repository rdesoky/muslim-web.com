<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَجَّيْنَاهُمَا وَقَوْمَهُمَا مِنَ الْكَرْبِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَجَّيْنَاهُمَا وَقَوْمهمَا" </quran>بَنِي إسْرَائِيل <quran>"مِنَ الْكَرْب الْعَظِيم" </quran>أَيْ اسْتِعْبَاد فِرْعَوْن إيَّاهُمْ</p></td></tr></table></body></html>
