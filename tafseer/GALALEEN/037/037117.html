<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآتَيْنَاهُمَا الْكِتَابَ الْمُسْتَبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآتَيْنَاهُمَا الْكِتَاب الْمُسْتَبِين" </quran>الْبَلِيغ الْبَيَان فِيمَا أَتَى بِهِ مِنْ الْحُدُود وَالْأَحْكَام وَغَيْرهَا وَهُوَ التَّوْرَاة</p></td></tr></table></body></html>
