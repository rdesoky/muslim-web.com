<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِمْ مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِمْ" </quran>عَلَى آثَارهمْ وَمَنَازِلهمْ فِي أَسْفَاركُمْ <quran>"مُصْبِحِينَ" </quran>أَيْ وَقْت الصَّبَاح يَعْنِي بِالنَّهَارِ</p></td></tr></table></body></html>
