<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَاهَمَ فَكَانَ مِنَ الْمُدْحَضِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسَاهَمَ" </quran>قَارَعَ أَهْل السَّفِينَة <quran>"فَكَانَ مِنَ الْمُدْحَضِينَ" </quran>الْمَغْلُوبِينَ بِالْقُرْعَةِ فَأَلْقَوْهُ فِي الْبَحْر</p></td></tr></table></body></html>
