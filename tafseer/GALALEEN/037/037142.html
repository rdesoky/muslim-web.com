<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْتَقَمَهُ الْحُوتُ وَهُوَ مُلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَالْتَقَمَهُ الْحُوت" </quran>ابْتَلَعَهُ <quran>"وَهُوَ مُلِيم" </quran>أَيْ آتٍ بِمَا يُلَام عَلَيْهِ مِنْ ذَهَابه إلَى الْبَحْر وَرُكُوبه السَّفِينَة بِلَا إذْن مِنْ رَبّه</p></td></tr></table></body></html>
