<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْلَا أَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَوْلَا أَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ" </quran>الذَّاكِرِينَ بِقَوْلِهِ كَثِيرًا فِي بَطْن الْحُوت <quran>"لَا إلَه إلَّا أَنْتَ سُبْحَانك إنِّي كُنْت مِنَ الظَّالِمِينَ"</quran></p></td></tr></table></body></html>
