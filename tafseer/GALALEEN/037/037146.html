<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْبَتْنَا عَلَيْهِ شَجَرَةً مِنْ يَقْطِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْبَتْنَا عَلَيْهِ شَجَرَة مِنْ يَقْطِين" </quran>وَهِيَ الْقَرْع تُظِلّهُ بِسَاقٍ عَلَى خِلَاف الْعَادَة فِي الْقَرْع مُعْجِزَة لَهُ وَكَانَتْ تَأْتِيه وَعِلَّة صَبَاحًا وَمَسَاء يَشْرَب مِنْ لَبَنهَا حَتَّى قَوِيَ</p></td></tr></table></body></html>
