<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَرْسَلْنَاهُ إِلَى مِائَةِ أَلْفٍ أَوْ يَزِيدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَرْسَلْنَاهُ" </quran>بَعْد ذَلِكَ كَقَبْلِهِ إلَى قَوْم بِنِينَوَى مِنْ أَرْض الْمُوصِل <quran>"إلَى مِائَة أَلْف أَوْ" </quran>بَلْ <quran>"يَزِيدُونَ" </quran>عِشْرِينَ أَوْ ثَلَاثِينَ أَوْ سَبْعِينَ أَلْفًا</p></td></tr></table></body></html>
