<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَآمَنُوا فَمَتَّعْنَاهُمْ إِلَى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَآمَنُوا" </quran>عِنْد مُعَايَنَة الْعَذَاب الْمَوْعُودِينَ بِهِ <quran>"فَمَتَّعْنَاهُمْ" </quran>أَبْقَيْنَاهُمْ مُمَتَّعِينَ بِمَالِهِمْ <quran>"إلَى حِين" </quran>أَيْ حَتَّى تَنْقَضِي آجَالهمْ فِيهِ</p></td></tr></table></body></html>
