<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ خَلَقْنَا الْمَلَائِكَةَ إِنَاثًا وَهُمْ شَاهِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ خَلَقْنَا الْمَلَائِكَة إنَاثًا وَهُمْ شَاهِدُونَ" </quran>وَهُمْ مُشَاهِدُونَ لِخَلْقِنَا فَيَقُولُونَ ذَلِكَ</p></td></tr></table></body></html>
