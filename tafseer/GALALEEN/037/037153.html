<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَصْطَفَى الْبَنَاتِ عَلَى الْبَنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَصْطَفَى" </quran>بِفَتْحِ الْهَمْزَة لِلِاسْتِفْهَامِ وَاسْتُغْنِيَ بِهَا عَنْ هَمْزَة الْوَصْل فَحُذِفَتْ أَيْ أَخْتَار <quran>"الْبَنَات عَلَى الْبَنِينَ"</quran></p></td></tr></table></body></html>
