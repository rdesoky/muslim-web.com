<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأْتُوا بِكِتَابِكُمْ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأْتُوا بِكِتَابِكُمْ" </quran>التَّوْرَاة فَأَرُونِي ذَلِكَ فِيهِ <quran>"إنْ كُنْتُمْ صَادِقِينَ" </quran>فِي قَوْلكُمْ ذَلِكَ</p></td></tr></table></body></html>
