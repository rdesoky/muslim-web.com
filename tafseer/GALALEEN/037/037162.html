<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَنْتُمْ عَلَيْهِ بِفَاتِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا أَنْتُمْ عَلَيْهِ" </quran>أَيْ عَلَى مَعْبُودكُمْ وَعَلَيْهِ مُتَعَلِّق بِقَوْلِهِ <quran>"بِفَاتِنِينَ" </quran>أَيْ أَحَدًا</p></td></tr></table></body></html>
