<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا مِنَّا إِلَّا لَهُ مَقَامٌ مَعْلُومٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ جِبْرِيل لِلنَّبِيِّ <quran>"وَمَا مِنَّا" </quran>مَعْشَر الْمَلَائِكَة أَحَد <quran>"إلَّا لَهُ مَقَام مَعْلُوم" </quran>فِي السَّمَاوَات يَعْبُد اللَّه فِيهِ لَا يَتَجَاوَزهُ</p></td></tr></table></body></html>
