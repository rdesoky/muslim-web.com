<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَوْ أَنَّ عِنْدَنَا ذِكْرًا مِنَ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَوْ أَنَّ عِنْدنَا ذِكْرًا" </quran>كِتَابًا <quran>"مِنَ الْأَوَّلِينَ" </quran>أَيْ مِنْ كُتُب الْأُمَم الْمَاضِيَة</p></td></tr></table></body></html>
