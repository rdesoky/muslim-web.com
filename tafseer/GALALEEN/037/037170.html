<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَفَرُوا بِهِ فَسَوْفَ يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكَفَرُوا بِهِ" </quran>بِالْكِتَابِ الَّذِي جَاءَهُمْ وَهُوَ الْقُرْآن الْأَشْرَف مِنْ تِلْكَ الْكُتُب <quran>"فَسَوْفَ يَعْلَمُونَ" </quran>عَاقِبَة كُفْرهمْ</p></td></tr></table></body></html>
