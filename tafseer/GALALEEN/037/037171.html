<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ سَبَقَتْ كَلِمَتُنَا لِعِبَادِنَا الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ سَبَقَتْ كَلِمَتنَا" </quran>بِالنَّصْرِ <quran>"لِعِبَادِنَا الْمُرْسَلِينَ" </quran>وَهِيَ <quran>"لَأَغْلِبَن أَنَا وَرُسُلِي" </quran>أَوْ هِيَ قَوْله <quran>"إنَّهُمْ لَهُمُ الْمَنْصُورُونَ"</quran></p></td></tr></table></body></html>
