<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالُوا اسْتِهْزَاء : مَتَى نُزُول هَذَا الْعَذَاب ؟ قَالَ تَعَالَى تَهْدِيدًا لَهُمْ : <quran>"أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ"</quran></p></td></tr></table></body></html>
