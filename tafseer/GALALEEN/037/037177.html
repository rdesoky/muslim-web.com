<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا نَزَلَ بِسَاحَتِهِمْ فَسَاءَ صَبَاحُ الْمُنْذَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا نَزَلَ بِسَاحَتِهِمْ" </quran>بِفِنَائِهِمْ قَالَ الْفَرَّاء : الْعَرَب تَكْتَفِي بِذِكْرِ السَّاحَة عَنْ الْقَوْم <quran>"فَسَاءَ" </quran>بِئْسَ صَبَاحًا <quran>"صَبَاح الْمُنْذَرِينَ" </quran>فِيهِ إقَامَة الظَّاهِر مَقَام الْمُضْمَر</p></td></tr></table></body></html>
