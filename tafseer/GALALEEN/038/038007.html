<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا سَمِعْنَا بِهَذَا فِي الْمِلَّةِ الْآخِرَةِ إِنْ هَذَا إِلَّا اخْتِلَاقٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا سَمِعْنَا بِهَذَا فِي الْمِلَّة الْآخِرَة" </quran>أَيْ مِلَّة عِيسَى <quran>"إنْ" </quran>مَا <quran>"هَذَا إلَّا اخْتِلَاق" </quran>كَذِب</p></td></tr></table></body></html>
