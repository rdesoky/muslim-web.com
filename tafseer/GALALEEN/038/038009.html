<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ عِنْدَهُمْ خَزَائِنُ رَحْمَةِ رَبِّكَ الْعَزِيزِ الْوَهَّابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ عِنْدهمْ خَزَائِن رَحْمَة رَبّك الْعَزِيز" </quran>الْغَالِب <quran>"الْوَهَّاب" </quran>الْوَهَّاب مِنْ النُّبُوَّة وَغَيْرهَا فَيُعْطُونَهَا مَنْ شَاءُوا</p></td></tr></table></body></html>
