<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ وَعَادٌ وَفِرْعَوْنُ ذُو الْأَوْتَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَتْ قَبْلهمْ قَوْم نُوح" </quran>تَأْنِيث قَوْم بِاعْتِبَارِ الْمَعْنَى <quran>"وَعَادٍ وَفِرْعَوْن ذُو الْأَوْتَاد" </quran>كَانَ يُتَّدُ لِكُلِّ مَنْ يَغْضَب عَلَيْهِ أَرْبَعَة أَوْتَاد يُشَدّ إلَيْهَا يَدَيْهِ وَرِجْلَيْهِ وَيُعَذِّبهُ</p></td></tr></table></body></html>
