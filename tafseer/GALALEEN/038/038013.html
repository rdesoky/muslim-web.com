<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَثَمُودُ وَقَوْمُ لُوطٍ وَأَصْحَابُ الْأَيْكَةِ أُولَئِكَ الْأَحْزَابُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَثَمُود وَقَوْم لُوط وَأَصْحَاب الْأَيْكَة" </quran>أَيْ الْغَيْضَة وَهُمْ قَوْم شُعَيْب عَلَيْهِ السَّلَام</p></td></tr></table></body></html>
