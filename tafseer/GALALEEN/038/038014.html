<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كُلٌّ إِلَّا كَذَّبَ الرُّسُلَ فَحَقَّ عِقَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ" </quran>مَا <quran>"كُلّ" </quran>مِنْ الْأَحْزَاب <quran>"إلَّا كَذَّبَ الرُّسُل" </quran>لِأَنَّهُمْ إذَا كَذَّبُوا وَاحِدًا مِنْهُمْ فَقَدْ كَذَّبُوا جَمِيعهمْ لِأَنَّ دَعْوَتهمْ وَاحِدَة وَهِيَ دَعْوَة التَّوْحِيد <quran>"فَحَقّ" </quran>وَجَبَ</p></td></tr></table></body></html>
