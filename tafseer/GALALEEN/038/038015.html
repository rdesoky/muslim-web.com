<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَنْظُرُ هَؤُلَاءِ إِلَّا صَيْحَةً وَاحِدَةً مَا لَهَا مِنْ فَوَاقٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَا يَنْظُر" </quran>يَنْتَظِر <quran>"هَؤُلَاءِ" </quran>أَيْ كُفَّار مَكَّة <quran>"إلَّا صَيْحَة وَاحِدَة" </quran>هِيَ نَفْخَة الْقِيَامَة تَحِلّ بِهِمْ الْعَذَاب <quran>"مَا لَهَا مِنْ فَوَاق" </quran>بِفَتْحِ الْفَاء وَضَمّهَا : رُجُوع</p></td></tr></table></body></html>
