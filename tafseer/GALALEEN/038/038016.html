<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا رَبَّنَا عَجِّلْ لَنَا قِطَّنَا قَبْلَ يَوْمِ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>لَمَّا نَزَلَ <quran>"فَأَمَّا مَنْ أُوتِيَ كِتَابه بِيَمِينِهِ" </quran>إلَخْ <quran>"رَبّنَا عَجِّلْ لَنَا قِطّنَا" </quran>أَيْ كِتَاب أَعْمَالنَا <quran>"قَبْل يَوْم الْحِسَاب" </quran>قَالُوا ذَلِكَ اسْتِهْزَاء</p></td></tr></table></body></html>
