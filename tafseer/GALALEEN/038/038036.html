<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَخَّرْنَا لَهُ الرِّيحَ تَجْرِي بِأَمْرِهِ رُخَاءً حَيْثُ أَصَابَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسَخَّرْنَا لَهُ الرِّيح تَجْرِي بِأَمْرِهِ رُخَاء" </quran>لَيِّنَة <quran>"حَيْثُ أَصَابَ" </quran>أَرَادَ</p></td></tr></table></body></html>
