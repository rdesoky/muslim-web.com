<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالشَّيَاطِينَ كُلَّ بَنَّاءٍ وَغَوَّاصٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالشَّيَاطِين كُلّ بَنَّاء" </quran>يَبْنِي الْأَبْنِيَة الْعَجِيبَة <quran>"وَغَوَّاص" </quran>فِي الْبَحْر يَسْتَخْرِج اللُّؤْلُؤ</p></td></tr></table></body></html>
