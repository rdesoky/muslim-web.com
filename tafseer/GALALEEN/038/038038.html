<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآخَرِينَ مُقَرَّنِينَ فِي الْأَصْفَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآخَرِينَ" </quran>مِنْهُمْ <quran>"مُقَرَّنِينَ" </quran>مَشْدُودِينَ <quran>"فِي الْأَصْفَاد" </quran>الْقُيُود بِجَمْعِ أَيْدِيهمْ إلَى أَعْنَاقهمْ</p></td></tr></table></body></html>
