<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا عَطَاؤُنَا فَامْنُنْ أَوْ أَمْسِكْ بِغَيْرِ حِسَابٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا عَطَاؤُنَا فَامْنُنْ" </quran>أَعْطِ مِنْهُ مَنْ شِئْت <quran>"أَوْ أَمْسِكْ" </quran>عَنْ الْإِعْطَاء <quran>"بِغَيْرِ حِسَاب" </quran>أَيْ لَا حِسَاب عَلَيْك فِي ذَلِكَ</p></td></tr></table></body></html>
