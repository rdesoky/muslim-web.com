<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ارْكُضْ بِرِجْلِكَ هَذَا مُغْتَسَلٌ بَارِدٌ وَشَرَابٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُرْكُضْ" </quran>اضْرِبْ <quran>"بِرِجْلِك" </quran>اضْرِبْ بِرِجْلِك الْأَرْض فَضَرَبَ فَنَبَعَتْ عَيْن مَاء فَقِيلَ : <quran>"هَذَا مُغْتَسَل" </quran>مَاء تَغْتَسِل بِهِ <quran>"بَارِد وَشَرَاب" </quran>تَشْرَب مِنْهُ فَاغْتَسَلَ وَشَرِبَ فَذَهَبَ عَنْهُ كُلّ دَاء كَانَ بِبَاطِنِهِ وَظَاهِره</p></td></tr></table></body></html>
