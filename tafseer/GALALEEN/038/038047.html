<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُمْ عِنْدَنَا لَمِنَ الْمُصْطَفَيْنَ الْأَخْيَارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهُمْ عِنْدنَا لَمِنَ الْمُصْطَفَيْنَ" </quran>الْمُخْتَارِينَ <quran>"الْأَخْيَار" </quran>جَمْع خَيِّر بِالتَّشْدِيدِ</p></td></tr></table></body></html>
