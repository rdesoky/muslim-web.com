<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا ذِكْرٌ وَإِنَّ لِلْمُتَّقِينَ لَحُسْنَ مَآبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا ذِكْر" </quran>أَيْ هَذَا ذِكْر لَهُمْ بِالثَّنَاءِ الْجَمِيل هُنَا <quran>"وَإِنَّ لِلْمُتَّقِينَ" </quran>الشَّامِلِينَ لَهُمْ <quran>"لَحُسْن مَآب" </quran>مَرْجِع فِي الْآخِرَة</p></td></tr></table></body></html>
