<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُتَّكِئِينَ فِيهَا يَدْعُونَ فِيهَا بِفَاكِهَةٍ كَثِيرَةٍ وَشَرَابٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مُتَّكِئِينَ فِيهَا" </quran>عَلَى الْأَرَائِك</p></td></tr></table></body></html>
