<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعِنْدَهُمْ قَاصِرَاتُ الطَّرْفِ أَتْرَابٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَعِنْدهمْ قَاصِرَات الطَّرْف" </quran>حَابِسَات الْعَيْن عَلَى أَزْوَاجهنَّ <quran>"أَتْرَاب" </quran>أَسْنَانهنَّ وَاحِدَة وَهُنَّ بَنَات ثَلَاث وَثَلَاثِينَ سَنَة جَمْع تَرْب</p></td></tr></table></body></html>
