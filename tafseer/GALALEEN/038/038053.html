<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا مَا تُوعَدُونَ لِيَوْمِ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا" </quran>الْمَذْكُور <quran>"مَا تُوعَدُونَ" </quran>بِالْغِيبَةِ وَبِالْخِطَابِ الْتِفَاتًا <quran>"لِيَوْمِ الْحِسَاب" </quran>أَيْ لِأَجْلِهِ</p></td></tr></table></body></html>
