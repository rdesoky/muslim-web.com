<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا لَرِزْقُنَا مَا لَهُ مِنْ نَفَادٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ هَذَا لَرِزْقنَا مَا لَهُ مِنْ نَفَاد" </quran>أَيْ انْقِطَاع وَالْجُمْلَة حَال مِنْ رِزْقنَا أَوْ خَبَر ثَانٍ لِإِنَّ أَيْ دَائِمًا أَوْ دَائِم</p></td></tr></table></body></html>
