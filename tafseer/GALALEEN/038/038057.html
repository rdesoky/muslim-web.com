<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا فَلْيَذُوقُوهُ حَمِيمٌ وَغَسَّاقٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا" </quran>أَيْ الْعَذَاب الْمَفْهُوم مِمَّا بَعْده <quran>"فَلْيَذُوقُوهُ حَمِيم" </quran>أَيْ مَاء حَارّ مُحْرِق <quran>"وَغَسَّاق" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد : مَا يَسِيل مِنْ صَدِيد أَهْل النَّار</p></td></tr></table></body></html>
