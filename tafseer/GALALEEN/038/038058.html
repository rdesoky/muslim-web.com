<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآخَرُ مِنْ شَكْلِهِ أَزْوَاجٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآخَر" </quran>بِالْجَمْعِ وَالْإِفْرَاد <quran>"مِنْ شَكْله" </quran>أَيْ مِثْل الْمَذْكُور مِنْ الْحَمِيم وَالْغَسَّاق <quran>"أَزْوَاج" </quran>أَصْنَاف أَيْ عَذَابهمْ مِنْ أَنْوَاع مُخْتَلِفَة</p></td></tr></table></body></html>
