<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ أَنْتُمْ لَا مَرْحَبًا بِكُمْ أَنْتُمْ قَدَّمْتُمُوهُ لَنَا فَبِئْسَ الْقَرَارُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>أَيْ الْأَتْبَاع <quran>"بَلْ أَنْتُمْ لَا مَرْحَبًا بِكُمْ أَنْتُمْ قَدَّمْتُمُوهُ" </quran>أَيْ الْكُفْر <quran>"لَنَا فَبِئْسَ الْقَرَار" </quran>لَنَا وَلَكُمْ النَّار</p></td></tr></table></body></html>
