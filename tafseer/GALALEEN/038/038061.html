<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا رَبَّنَا مَنْ قَدَّمَ لَنَا هَذَا فَزِدْهُ عَذَابًا ضِعْفًا فِي النَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>أَيْضًا <quran>"رَبّنَا مَنْ قَدَّمَ لَنَا هَذَا فَزِدْهُ عَذَابًا ضِعْفًا" </quran>أَيْ مِثْل عَذَابه عَلَى كُفْره</p></td></tr></table></body></html>
