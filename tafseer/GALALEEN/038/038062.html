<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا مَا لَنَا لَا نَرَى رِجَالًا كُنَّا نَعُدُّهُمْ مِنَ الْأَشْرَارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>أَيْ كُفَّار مَكَّة وَهُمْ فِي النَّار <quran>"مَا لَنَا لَا نَرَى رِجَالًا كُنَّا نَعُدّهُمْ" </quran>فِي الدُّنْيَا</p></td></tr></table></body></html>
