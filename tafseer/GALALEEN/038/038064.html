<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ ذَلِكَ لَحَقٌّ تَخَاصُمُ أَهْلِ النَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ ذَلِكَ لَحَقّ" </quran>وَاجِب وُقُوعه وَهُوَ تَخَاصُم أَهْل النَّار <quran>"تَخَاصُم أَهْل النَّار" </quran>كَمَا تَقَدَّمَ</p></td></tr></table></body></html>
