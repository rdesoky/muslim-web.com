<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّمَا أَنَا مُنْذِرٌ وَمَا مِنْ إِلَهٍ إِلَّا اللَّهُ الْوَاحِدُ الْقَهَّارُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ" </quran>يَا مُحَمَّد لِكُفَّارِ مَكَّة <quran>"إنَّمَا أَنَا مُنْذِر" </quran>مُخَوِّف بِالنَّارِ <quran>"وَمَا مِنْ إلَه إلَّا اللَّه الْوَاحِد الْقَهَّار" </quran>لِخَلْقِهِ</p></td></tr></table></body></html>
