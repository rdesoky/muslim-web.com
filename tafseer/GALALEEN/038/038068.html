<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْتُمْ عَنْهُ مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنْتُمْ عَنْهُ مُعْرِضُونَ" </quran>أَيْ مُعْرِضُونَ عَنْ الْقُرْآن الَّذِي أَنْبَأْتُكُمْ بِهِ وَجِئْتُكُمْ فِيهِ بِمَا لَا يُعْلَم إلَّا بِوَحْيٍ</p></td></tr></table></body></html>
