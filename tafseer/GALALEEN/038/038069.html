<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا كَانَ لِيَ مِنْ عِلْمٍ بِالْمَلَإِ الْأَعْلَى إِذْ يَخْتَصِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا كَانَ لِي مِنْ عِلْم بِالْمَلَإِ الْأَعْلَى" </quran>أَيْ الْمَلَائِكَة <quran>"إذْ يَخْتَصِمُونَ" </quran>فِي شَأْن آدَم حِين قَالَ تَعَالَى : <quran>"إنِّي جَاعِل فِي الْأَرْض خَلِيفَة" </quran>إلَخْ</p></td></tr></table></body></html>
