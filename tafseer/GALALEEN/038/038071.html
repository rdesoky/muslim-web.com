<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي خَالِقٌ بَشَرًا مِنْ طِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ قَالَ رَبّك لِلْمَلَائِكَةِ إنِّي خَالِق بَشَرًا مِنْ طِين" </quran>هُوَ آدَم</p></td></tr></table></body></html>
