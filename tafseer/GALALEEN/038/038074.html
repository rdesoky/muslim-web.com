<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا إِبْلِيسَ اسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا إبْلِيس" </quran>هُوَ أَبُو الْجِنّ كَانَ بَيْن الْمَلَائِكَة <quran>"اسْتَكْبَرَ وَكَانَ مِنْ الْكَافِرِينَ" </quran>فِي عِلْم اللَّه تَعَالَى</p></td></tr></table></body></html>
