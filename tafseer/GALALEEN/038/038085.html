<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَأَمْلَأَنَّ جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَأَمْلَأَنّ جَهَنَّم مِنْك" </quran>أَيْ بِذُرِّيَّتِك <quran>"وَمِمَّنْ تَبِعَك مِنْهُمْ" </quran>أَيْ النَّاس</p></td></tr></table></body></html>
