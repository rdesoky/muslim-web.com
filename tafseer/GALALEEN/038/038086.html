<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ مَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ وَمَا أَنَا مِنَ الْمُتَكَلِّفِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ مَا أَسْأَلكُمْ عَلَيْهِ" </quran>عَلَى تَبْلِيغ الرِّسَالَة <quran>"مِنْ أَجْر" </quran>جُعْل <quran>"وَمَا أَنَا مِنَ الْمُتَكَلِّفِينَ" </quran>الْمُتَقَوِّلِينَ الْقُرْآن مِنْ تِلْقَاء نَفْسِي</p></td></tr></table></body></html>
