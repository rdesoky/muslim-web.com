<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَنْزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ فَاعْبُدِ اللَّهَ مُخْلِصًا لَهُ الدِّينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا أَنْزَلْنَا إلَيْك" </quran>يَا مُحَمَّد <quran>"الْكِتَاب بِالْحَقِّ" </quran>مُتَعَلِّق بِأَنْزَل <quran>"فَاعْبُدِ اللَّه مُخْلِصًا لَهُ الدِّين" </quran>مِنْ الشِّرْك : أَيْ مُوَحِّدًا لَهُ</p></td></tr></table></body></html>
