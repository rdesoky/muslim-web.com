<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ الْمُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأُمِرْت لِأَنْ" </quran>أَيْ بِأَنْ <quran>"أَكُونَ أَوَّل الْمُسْلِمِينَ" </quran>مِنْ هَذِهِ الْأُمَّة</p></td></tr></table></body></html>
