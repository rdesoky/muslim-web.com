<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ اجْتَنَبُوا الطَّاغُوتَ أَنْ يَعْبُدُوهَا وَأَنَابُوا إِلَى اللَّهِ لَهُمُ الْبُشْرَى فَبَشِّرْ عِبَادِي</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ اجْتَنَبُوا الطَّاغُوت" </quran>الْأَوْثَان <quran>"أَنْ يَعْبُدُوهَا وَأَنَابُوا" </quran>أَقْبَلُوا <quran>"إلَى اللَّه لَهُمُ الْبُشْرَى" </quran>بِالْجَنَّةِ</p></td></tr></table></body></html>
