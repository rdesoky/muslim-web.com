<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ فَأَتَاهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَ الَّذِينَ مِنْ قَبْلهمْ" </quran>رُسُلهمْ فِي إتْيَان الْعَذَاب <quran>"فَأَتَاهُمُ الْعَذَاب مِنْ حَيْثُ لَا يَشْعُرُونَ" </quran>مِنْ جِهَة لَا تَخْطِر بِبَالِهِمْ</p></td></tr></table></body></html>
