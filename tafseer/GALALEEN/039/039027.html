<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِي هَذَا الْقُرْآنِ مِنْ كُلِّ مَثَلٍ لَعَلَّهُمْ يَتَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ ضَرَبْنَا" </quran>جَعَلْنَا <quran>"لِلنَّاسِ فِي هَذَا الْقُرْآن مِنْ كُلّ مَثَل لَعَلَّهُمْ يَتَذَكَّرُونَ" </quran>يَتَّعِظُونَ</p></td></tr></table></body></html>
