<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُرْآنًا عَرَبِيًّا غَيْرَ ذِي عِوَجٍ لَعَلَّهُمْ يَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُرْآنًا عَرَبِيًّا" </quran>حَال مُؤَكِّدَة <quran>"غَيْر ذِي عِوَج" </quran>أَيْ لَبْس وَاخْتِلَاف <quran>"لَعَلَّهُمْ يَتَّقُونَ" </quran>الْكُفْر</p></td></tr></table></body></html>
