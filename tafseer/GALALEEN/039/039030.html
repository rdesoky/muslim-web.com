<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّك" </quran>خِطَاب لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"مَيِّت وَإِنَّهُمْ مَيِّتُونَ" </quran>سَتَمُوتُ وَيَمُوتُونَ فَلَا شَمَاتَة بِالْمَوْتِ نَزَلَتْ لَمَّا اسْتَبْطَئُوا مَوْته صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
