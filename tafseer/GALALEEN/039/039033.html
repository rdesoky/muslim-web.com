<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي جَاءَ بِالصِّدْقِ وَصَدَّقَ بِهِ أُولَئِكَ هُمُ الْمُتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِي جَاءَ بِالصِّدْقِ" </quran>هُوَ النَّبِيُّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَصَدَّقَ بِهِ" </quran>هُمْ الْمُؤْمِنُونَ فَاَلَّذِي بِمَعْنَى الَّذِينَ <quran>"أُولَئِكَ هُمُ الْمُتَّقُونَ" </quran>الشِّرْك</p></td></tr></table></body></html>
