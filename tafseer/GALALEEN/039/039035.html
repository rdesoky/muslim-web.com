<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيُكَفِّرَ اللَّهُ عَنْهُمْ أَسْوَأَ الَّذِي عَمِلُوا وَيَجْزِيَهُمْ أَجْرَهُمْ بِأَحْسَنِ الَّذِي كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيُكَفِّر اللَّه عَنْهُمْ أَسْوَأ الَّذِي عَمِلُوا وَيَجْزِيَهُمْ أَجْرهمْ بِأَحْسَنِ الَّذِي كَانُوا يَعْمَلُونَ" </quran>أَسْوَأ وَأَحْسَن بِمَعْنَى السَّيِّئ وَالْحَسَن</p></td></tr></table></body></html>
