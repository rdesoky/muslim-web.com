<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِنْ دُونِهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَيْسَ اللَّه بِكَافٍ عَبْده" </quran>أَيْ النَّبِيّ, بَلَى <quran>"وَيُخَوِّفُونَك" </quran>الْخِطَاب لَهُ <quran>"بِاَلَّذِينَ مِنْ دُونه" </quran>أَيْ الْأَصْنَام أَنْ تَقْتُلهُ أَوْ تَخْبِلهُ</p></td></tr></table></body></html>
