<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ يَهْدِ اللَّهُ فَمَا لَهُ مِنْ مُضِلٍّ أَلَيْسَ اللَّهُ بِعَزِيزٍ ذِي انْتِقَامٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ يَهْدِ اللَّه فَمَا لَهُ مِنْ مُضِلّ أَلَيْسَ اللَّه بِعَزِيزٍ" </quran>غَالِب عَلَى أَمْره <quran>"ذِي انْتِقَام" </quran>مِنْ أَعْدَائِهِ ؟ بَلَى</p></td></tr></table></body></html>
