<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَا قَوْمِ اعْمَلُوا عَلَى مَكَانَتِكُمْ إِنِّي عَامِلٌ فَسَوْفَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ يَا قَوْم اعْمَلُوا عَلَى مَكَانَتكُمْ" </quran>حَالَتكُمْ <quran>"إنِّي عَامِل" </quran>عَلَى حَالَتِي</p></td></tr></table></body></html>
