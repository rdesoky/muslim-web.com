<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ لِلَّهِ الشَّفَاعَةُ جَمِيعًا لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ثُمَّ إِلَيْهِ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ لِلَّهِ الشَّفَاعَة جَمِيعًا" </quran>أَيْ هُوَ مُخْتَصّ بِهَا فَلَا يَشْفَع أَحَد إلَّا بِإِذْنِهِ</p></td></tr></table></body></html>
