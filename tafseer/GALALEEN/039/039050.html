<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَدْ قَالَهَا الَّذِينَ مِنْ قَبْلِهِمْ فَمَا أَغْنَى عَنْهُمْ مَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَدْ قَالَهَا الَّذِينَ مِنْ قَبْلهمْ" </quran>مِنْ الْأُمَم كقَارُون وَقَوْمه الرَّاضِينَ بِهَا</p></td></tr></table></body></html>
