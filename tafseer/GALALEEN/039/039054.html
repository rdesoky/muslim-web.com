<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنِيبُوا إِلَى رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنِيبُوا" </quran>ارْجِعُوا <quran>"إلَى رَبّكُمْ وَأَسْلِمُوا" </quran>أَخْلِصُوا الْعَمَل <quran>"لَهُ مِنْ قَبْل أَنْ يَأْتِيكُمْ الْعَذَاب ثُمَّ لَا تُنْصَرُونَ" </quran>بِمَنْعِهِ إنْ لَمْ تَتُوبُوا</p></td></tr></table></body></html>
