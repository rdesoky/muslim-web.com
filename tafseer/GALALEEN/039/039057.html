<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ تَقُولَ لَوْ أَنَّ اللَّهَ هَدَانِي لَكُنْتُ مِنَ الْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ تَقُول لَوْ أَنَّ اللَّه هَدَانِي" </quran>بِالطَّاعَةِ فَاهْتَدَيْت <quran>"لَكُنْت مِنَ الْمُتَّقِينَ" </quran>عَذَابه</p></td></tr></table></body></html>
