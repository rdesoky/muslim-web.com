<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ تَقُولَ حِينَ تَرَى الْعَذَابَ لَوْ أَنَّ لِي كَرَّةً فَأَكُونَ مِنَ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ تَقُول حِين تَرَى الْعَذَاب لَوْ أَنَّ لِي كَرَّة" </quran>رَجْعَة إلَى الدُّنْيَا <quran>"فَأَكُون مِنَ الْمُحْسِنِينَ" </quran>الْمُؤْمِنِينَ فَيُقَال لَهُ مِنْ قِبَل اللَّه :</p></td></tr></table></body></html>
