<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلَى قَدْ جَاءَتْكَ آيَاتِي فَكَذَّبْتَ بِهَا وَاسْتَكْبَرْتَ وَكُنْتَ مِنَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلَى قَدْ جَاءَتْك آيَاتِي" </quran>الْقُرْآن وَهُوَ سَبَب الْهِدَايَة <quran>"فَكَذَّبْت بِهَا وَاسْتَكْبَرْت" </quran>تَكَبَّرْت عَنْ الْإِيمَان بِهَا</p></td></tr></table></body></html>
