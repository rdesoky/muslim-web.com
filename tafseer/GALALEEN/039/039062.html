<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَى كُلِّ شَيْءٍ وَكِيلٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه خَالِقُ كُلّ شَيْء وَهُوَ عَلَى كُلّ شَيْء وَكِيل" </quran>مُتَصَرِّف فِيهِ كَيْفَ يَشَاء</p></td></tr></table></body></html>
