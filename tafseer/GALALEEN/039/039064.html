<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَفَغَيْرَ اللَّهِ تَأْمُرُونِّي أَعْبُدُ أَيُّهَا الْجَاهِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ أَفَغَيْر اللَّه تَأْمُرُونِّي أَعْبُد أَيّهَا الْجَاهِلُونَ" </quran>غَيْر مَنْصُوب بِأَعْبُد الْمَعْمُول لِتَأْمُرُونِّي بِتَقْدِيرِ أَنْ بِنُونٍ وَاحِدَة وَبِنُونَيْنِ بِإِدْغَامٍ وَفَكّ</p></td></tr></table></body></html>
