<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أُوحِيَ إِلَيْكَ وَإِلَى الَّذِينَ مِنْ قَبْلِكَ لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ مِنَ الْخَاسِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أُوحِيَ إلَيْك وَإِلَى الَّذِينَ مِنْ قَبْلك" </quran>وَاَللَّه <quran>"لَئِنْ أَشْرَكْت" </quran>يَا مُحَمَّد فَرْضًا</p></td></tr></table></body></html>
