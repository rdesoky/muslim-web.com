<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوُفِّيَتْ كُلُّ نَفْسٍ مَا عَمِلَتْ وَهُوَ أَعْلَمُ بِمَا يَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَوُفِّيَتْ كُلّ نَفْس مَا عَمِلَتْ" </quran>أَيْ جَزَاءَهُ <quran>"وَهُوَ أَعْلَم" </quran>عَالِم <quran>"بِمَا يَفْعَلُونَ" </quran>فَلَا يَحْتَاج إلَى شَاهِد</p></td></tr></table></body></html>
