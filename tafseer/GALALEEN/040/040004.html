<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا يُجَادِلُ فِي آيَاتِ اللَّهِ إِلَّا الَّذِينَ كَفَرُوا فَلَا يَغْرُرْكَ تَقَلُّبُهُمْ فِي الْبِلَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا يُجَادِل فِي آيَات اللَّه" </quran>الْقُرْآن <quran>"إلَّا الَّذِينَ كَفَرُوا" </quran>مِنْ أَهْل مَكَّة <quran>"فَلَا يَغْرُرْك تَقَلُّبهمْ فِي الْبِلَاد" </quran>لِلْمَعَاشِ سَالِمِينَ فَإِنَّ عَاقِبَتهمْ النَّار</p></td></tr></table></body></html>
