<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَذَلِكَ حَقَّتْ كَلِمَةُ رَبِّكَ عَلَى الَّذِينَ كَفَرُوا أَنَّهُمْ أَصْحَابُ النَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكَذَلِكَ حَقَّتْ كَلِمَة رَبّك" </quran>أَيْ <quran>"لَأَمْلَأَنّ جَهَنَّم" </quran>الْآيَة <quran>"عَلَى الَّذِينَ كَفَرُوا أَنَّهُمْ أَصْحَاب النَّار" </quran>بَدَل مِنْ كَلِمَة</p></td></tr></table></body></html>
