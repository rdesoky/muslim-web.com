<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَادْعُوا اللَّه" </quran>اُعْبُدُوهُ <quran>"مُخْلِصِينَ لَهُ الدِّين" </quran>مِنْ الشِّرْك <quran>"وَلَوْ كَرِهَ الْكَافِرُونَ" </quran>إخْلَاصكُمْ مِنْهُ</p></td></tr></table></body></html>
