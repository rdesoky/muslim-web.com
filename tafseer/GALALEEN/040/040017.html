<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْيَوْمَ تُجْزَى كُلُّ نَفْسٍ بِمَا كَسَبَتْ لَا ظُلْمَ الْيَوْمَ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الْيَوْم تُجْزَى كُلّ نَفْس بِمَا كَسَبَتْ لَا ظُلْم الْيَوْم إنَّ اللَّه سَرِيع الْحِسَاب" </quran>يُحَاسِب جَمِيع الْخَلْق فِي قَدْر نِصْف نَهَار مِنْ أَيَّام الدُّنْيَا لِحَدِيثٍ بِذَلِكَ</p></td></tr></table></body></html>
