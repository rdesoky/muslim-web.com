<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى فِرْعَوْنَ وَهَامَانَ وَقَارُونَ فَقَالُوا سَاحِرٌ كَذَّابٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَى فِرْعَوْن وَهَامَان وَقَارُون فَقَالُوا" </quran>هُوَ <quran>"سَاحِر كَذَّاب"</quran></p></td></tr></table></body></html>
