<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى إِنِّي عُذْتُ بِرَبِّي وَرَبِّكُمْ مِنْ كُلِّ مُتَكَبِّرٍ لَا يُؤْمِنُ بِيَوْمِ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ مُوسَى" </quran>لِقَوْمِهِ وَقَدْ سَمِعَ ذَلِكَ</p></td></tr></table></body></html>
