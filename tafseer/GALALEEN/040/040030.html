<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِي آمَنَ يَا قَوْمِ إِنِّي أَخَافُ عَلَيْكُمْ مِثْلَ يَوْمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الَّذِي آمَنَ يَا قَوْم إنِّي أَخَاف عَلَيْكُمْ مِثْل يَوْم الْأَحْزَاب" </quran>أَيْ يَوْم حِزْب بَعْد حِزْب</p></td></tr></table></body></html>
