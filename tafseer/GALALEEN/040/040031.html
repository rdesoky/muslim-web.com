<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِثْلَ دَأْبِ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ وَالَّذِينَ مِنْ بَعْدِهِمْ وَمَا اللَّهُ يُرِيدُ ظُلْمًا لِلْعِبَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مِثْل دَأْب قَوْم نُوح وَعَادٍ وَثَمُود وَاَلَّذِينَ مِنْ بَعْدهمْ" </quran>مِثْل بَدَل مِنْ مِثْل قَبْله أَيْ مِثْل جَزَاء عَادَة مَنْ كَفَرَ قَبْلكُمْ مِنْ تَعْذِيبهمْ فِي الدُّنْيَا</p></td></tr></table></body></html>
