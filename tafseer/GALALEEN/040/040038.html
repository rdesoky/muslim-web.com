<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِي آمَنَ يَا قَوْمِ اتَّبِعُونِ أَهْدِكُمْ سَبِيلَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الَّذِي آمَنَ يَا قَوْم اتَّبِعُونِ" </quran>بِإِثْبَاتِ الْيَاء وَحَذْفهَا <quran>"أَهْدِكُمْ سَبِيل الرَّشَاد" </quran>تَقَدَّمَ</p></td></tr></table></body></html>
