<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا قَوْمِ إِنَّمَا هَذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا قَوْم إنَّمَا هَذِهِ الْحَيَاة الدُّنْيَا مَتَاع" </quran>تَمَتُّع يَزُول</p></td></tr></table></body></html>
