<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَقَاهُ اللَّهُ سَيِّئَاتِ مَا مَكَرُوا وَحَاقَ بِآلِ فِرْعَوْنَ سُوءُ الْعَذَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَوَقَاهُ اللَّه سَيِّئَات مَا مَكَرُوا" </quran>بِهِ مِنْ الْقَتْل <quran>"وَحَاقَ" </quran>نَزَلَ <quran>"بآل فِرْعَوْن" </quran>قَوْمه مَعَهُ <quran>"سُوء الْعَذَاب" </quran>الْغَرَق</p></td></tr></table></body></html>
