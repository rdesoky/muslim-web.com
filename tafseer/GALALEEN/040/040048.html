<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ الَّذِينَ اسْتَكْبَرُوا إِنَّا كُلٌّ فِيهَا إِنَّ اللَّهَ قَدْ حَكَمَ بَيْنَ الْعِبَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ الَّذِينَ اسْتَكْبَرُوا إنَّا كُلّ فِيهَا إنَّ اللَّه قَدْ حَكَمَ بَيْن الْعِبَاد" </quran>فَأَدْخَلَ الْمُؤْمِنِينَ الْجَنَّة وَالْكَافِرِينَ النَّار</p></td></tr></table></body></html>
