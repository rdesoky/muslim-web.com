<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِينَ فِي النَّارِ لِخَزَنَةِ جَهَنَّمَ ادْعُوا رَبَّكُمْ يُخَفِّفْ عَنَّا يَوْمًا مِنَ الْعَذَابِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ الَّذِينَ فِي النَّار لِخَزَنَةِ جَهَنَّم اُدْعُوا رَبّكُمْ يُخَفِّف عَنَّا يَوْمًا" </quran>أَيْ قَدْر يَوْم</p></td></tr></table></body></html>
