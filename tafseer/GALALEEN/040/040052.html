<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ لَا يَنْفَعُ الظَّالِمِينَ مَعْذِرَتُهُمْ وَلَهُمُ اللَّعْنَةُ وَلَهُمْ سُوءُ الدَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم لَا يَنْفَع" </quran>بِالْيَاءِ وَالتَّاء <quran>"الظَّالِمِينَ مَعْذِرَتهمْ" </quran>عُذْرهمْ لَوْ اعْتَذَرُوا <quran>"وَلَهُمْ اللَّعْنَة" </quran>أَيْ الْبُعْد مِنْ الرَّحْمَة <quran>"وَلَهُمْ سُوء الدَّار" </quran>الْآخِرَة أَيْ شِدَّة عَذَابهَا</p></td></tr></table></body></html>
