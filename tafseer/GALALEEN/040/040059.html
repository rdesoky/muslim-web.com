<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ السَّاعَةَ لَآتِيَةٌ لَا رَيْبَ فِيهَا وَلَكِنَّ أَكْثَرَ النَّاسِ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ السَّاعَة لَآتِيَة لَا رَيْب" </quran>شَكّ <quran>"فِيهَا وَلَكِنَّ أَكْثَر النَّاس لَا يُؤْمِنُونَ" </quran>بِهَا</p></td></tr></table></body></html>
