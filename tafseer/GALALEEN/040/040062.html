<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكُمُ اللَّهُ رَبُّكُمْ خَالِقُ كُلِّ شَيْءٍ لَا إِلَهَ إِلَّا هُوَ فَأَنَّى تُؤْفَكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكُمُ اللَّه رَبّكُمْ خَالِق كُلّ شَيْء لَا إلَه إلَّا هُوَ فَأَنَّى تُؤْفَكُونَ" </quran>فَكَيْفَ تُصْرَفُونَ عَنْ الْإِيمَان مَعَ قِيَام الْبُرْهَان</p></td></tr></table></body></html>
