<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ يُؤْفَكُ الَّذِينَ كَانُوا بِآيَاتِ اللَّهِ يَجْحَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ يُؤْفَك" </quran>أَيْ مِثْل إفْك هَؤُلَاءِ إفْك <quran>"الَّذِينَ كَانُوا بِآيَاتِ اللَّه" </quran>مُعْجِزَاته <quran>"يَجْحَدُونَ"</quran></p></td></tr></table></body></html>
