<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ الْحَيُّ لَا إِلَهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُوَ الْحَيّ لَا إلَه إلَّا هُوَ فَادْعُوهُ" </quran>اُعْبُدُوهُ <quran>"مُخْلِصِينَ لَهُ الدِّين" </quran>مِنْ الشِّرْك</p></td></tr></table></body></html>
