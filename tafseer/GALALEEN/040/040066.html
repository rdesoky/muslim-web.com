<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنِّي نُهِيتُ أَنْ أَعْبُدَ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ لَمَّا جَاءَنِيَ الْبَيِّنَاتُ مِنْ رَبِّي وَأُمِرْتُ أَنْ أُسْلِمَ لِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنِّي نُهِيت أَنْ أَعْبُد الَّذِينَ تَدْعُونَ" </quran>تَعْبُدُونَ <quran>"مِنْ دُون اللَّه لَمَّا جَاءَنِيَ الْبَيِّنَات" </quran>دَلَائِل التَّوْحِيد</p></td></tr></table></body></html>
