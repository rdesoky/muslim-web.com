<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ تَرَ إِلَى الَّذِينَ يُجَادِلُونَ فِي آيَاتِ اللَّهِ أَنَّى يُصْرَفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَمْ تَرَ إلَى الَّذِينَ يُجَادِلُونَ فِي آيَات اللَّه" </quran>الْقُرْآن <quran>"أَنَّى" </quran>كَيْفَ <quran>"يُصْرَفُونَ" </quran>عَنْ الْإِيمَان</p></td></tr></table></body></html>
