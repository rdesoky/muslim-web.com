<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ الَّذِي جَعَلَ لَكُمُ الْأَنْعَامَ لِتَرْكَبُوا مِنْهَا وَمِنْهَا تَأْكُلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اللَّه الَّذِي جَعَلَ لَكُمْ الْأَنْعَام" </quran>قِيلَ : الْإِبِل خَاصَّة هُنَا وَالظَّاهِر وَالْبَقَر وَالْغَنَم</p></td></tr></table></body></html>
