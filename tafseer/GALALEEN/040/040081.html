<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُرِيكُمْ آيَاتِهِ فَأَيَّ آيَاتِ اللَّهِ تُنْكِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُرِيكُمْ آيَاته" </quran>أَيْ الدَّالَّة عَلَى وَحْدَانِيّته <quran>"فَأَيّ آيَات اللَّه تُنْكِرُونَ" </quran>اسْتِفْهَام تَوْبِيخ وَتَذْكِير أَيْ أَشْهَر مِنْ تَأْنِيثه</p></td></tr></table></body></html>
