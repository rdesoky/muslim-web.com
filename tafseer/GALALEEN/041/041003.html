<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كِتَابٌ فُصِّلَتْ آيَاتُهُ قُرْآنًا عَرَبِيًّا لِقَوْمٍ يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كتاب" </quran>خبره <quran>"فصلت آياته" </quran>بينت بالأحكام والقصص والمواعظ <quran>"قرآنا عربيا" </quran>حال من كتاب بصفته <quran>"لقوم" </quran>متعلق بفصلت <quran>"يعلمون" </quran>يفهمون ذلك, وهم العرب</p></td></tr></table></body></html>
