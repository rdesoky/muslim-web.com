<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَشِيرًا وَنَذِيرًا فَأَعْرَضَ أَكْثَرُهُمْ فَهُمْ لَا يَسْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بشيرا" </quran>صفة قرآنا <quran>"ونذيرا فأعرض أكثرهم فهم لا يسمعون" </quran>سماع قبول</p></td></tr></table></body></html>
