<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ يُوحَى إِلَيَّ أَنَّمَا إِلَهُكُمْ إِلَهٌ وَاحِدٌ فَاسْتَقِيمُوا إِلَيْهِ وَاسْتَغْفِرُوهُ وَوَيْلٌ لِلْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قل إنما أنا بشر مثلكم يوحى إلي إنما إلهكم إله واحد فاستقيموا إليه" </quran>بالإيمان والطاعة <quran>"واستغفروه وويل" </quran>كلمة عذاب</p></td></tr></table></body></html>
