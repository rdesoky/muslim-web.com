<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ لَا يُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الذين لا يؤتون الزكاة وهم بالآخرة هم" </quran>تأكيد</p></td></tr></table></body></html>
