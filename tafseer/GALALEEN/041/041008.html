<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إن الذين آمنوا وعملوا الصالحات لهم أجر غير ممنون" </quran>مقطوع</p></td></tr></table></body></html>
