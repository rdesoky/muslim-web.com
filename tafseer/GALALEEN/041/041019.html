<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ يُحْشَرُ أَعْدَاءُ اللَّهِ إِلَى النَّارِ فَهُمْ يُوزَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"و" اذكر </quran>"يوم يحشر" بالياء والنون المفتوحة وضم الشين وفتح الهمزة <quran>"أعداء الله إلى النار فهم يوزعون" </quran>يساقون</p></td></tr></table></body></html>
