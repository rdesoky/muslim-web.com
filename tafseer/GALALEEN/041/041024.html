<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ يَصْبِرُوا فَالنَّارُ مَثْوًى لَهُمْ وَإِنْ يَسْتَعْتِبُوا فَمَا هُمْ مِنَ الْمُعْتَبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فإن يصبروا" </quran>على العذاب <quran>"فالنار مثوى" </quran>مأوى <quran>"لهم وإن يستعتبوا" </quran>يطلبوا العتبى, أي الرضا <quran>"فما هم من المعتبين" </quran>المرضيين</p></td></tr></table></body></html>
