<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِينَ كَفَرُوا لَا تَسْمَعُوا لِهَذَا الْقُرْآنِ وَالْغَوْا فِيهِ لَعَلَّكُمْ تَغْلِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وقال الذين كفروا" </quran>عند قراءة النبي صلى الله عليه وسلم <quran>"لا تسمعوا لهذا القرآن والغوا فيه" </quran>ائتوا باللغط ونحوه وصيحوا في زمن قراءته <quran>"لعلكم تغلبون" </quran>فيسكت عن القراءة</p></td></tr></table></body></html>
