<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ أَوْلِيَاؤُكُمْ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ وَلَكُمْ فِيهَا مَا تَشْتَهِي أَنْفُسُكُمْ وَلَكُمْ فِيهَا مَا تَدَّعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نحن أولياؤكم في الحياة الدنيا" </quran>أي نحفظكم فيها <quran>"وفي الآخرة" </quran>أي نكون معكم فيها حتى تدخلوا الجنة <quran>"ولكم فيها ما تشتهي أنفسكم ولكم فيها ما تدعون" </quran>تطلبون</p></td></tr></table></body></html>
