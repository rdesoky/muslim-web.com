<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ومن أحسن قولا" </quran>أي لا أحد أحسن قولا <quran>"ممن دعا إلى الله" </quran>بالتوحيد</p></td></tr></table></body></html>
