<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يُلَقَّاهَا إِلَّا الَّذِينَ صَبَرُوا وَمَا يُلَقَّاهَا إِلَّا ذُو حَظٍّ عَظِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وما يلقاها" </quran>أي يؤتي الخصلة التي هي أحسن <quran>" إلا الذين صبروا وما يلقها إلا ذو حظ" </quran>ثواب</p></td></tr></table></body></html>
