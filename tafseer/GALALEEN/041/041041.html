<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ كَفَرُوا بِالذِّكْرِ لَمَّا جَاءَهُمْ وَإِنَّهُ لَكِتَابٌ عَزِيزٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إن الذين كفروا بالذكر" </quran>القرآن <quran>"لما جاءهم" </quran>نجازيهم <quran>"وإنه لكتاب عزيز" </quran>منيع</p></td></tr></table></body></html>
