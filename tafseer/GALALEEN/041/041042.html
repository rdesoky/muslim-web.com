<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَأْتِيهِ الْبَاطِلُ مِنْ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ تَنْزِيلٌ مِنْ حَكِيمٍ حَمِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لا يأتيه الباطل من بين يديه ولا من خلفه" </quran>أي ليس قبله كتاب يكذبه ولا بعده <quran>"تنزيل من حكيم حميد" </quran>أي الله المحمود في أمره</p></td></tr></table></body></html>
