<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا يُقَالُ لَكَ إِلَّا مَا قَدْ قِيلَ لِلرُّسُلِ مِنْ قَبْلِكَ إِنَّ رَبَّكَ لَذُو مَغْفِرَةٍ وَذُو عِقَابٍ أَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ما يقال لك" </quran>من التكذيب <quran>"إلا" </quran>مثل <quran>"ما قد قيل للرسل من قبلك إن ربك لذو مغفرة" </quran>للمؤمنين <quran>"وذو عقاب أليم" </quran>للكافرين</p></td></tr></table></body></html>
