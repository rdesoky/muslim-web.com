<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْأَمُ الْإِنْسَانُ مِنْ دُعَاءِ الْخَيْرِ وَإِنْ مَسَّهُ الشَّرُّ فَيَئُوسٌ قَنُوطٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لا يسأم الإنسان من دعاء الخير" </quran>أي لا يزال يسأل ربه المال والصحة وغيرهما <quran>"وإن مسه الشر" </quran>الفقر والشدة <quran>"فيئوس قنوط" </quran>من رحمة الله, وهذا وما بعده في الكافرين</p></td></tr></table></body></html>
