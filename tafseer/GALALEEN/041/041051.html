<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا أَنْعَمْنَا عَلَى الْإِنْسَانِ أَعْرَضَ وَنَأَى بِجَانِبِهِ وَإِذَا مَسَّهُ الشَّرُّ فَذُو دُعَاءٍ عَرِيضٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وإذا أنعمنا على الإنسان" </quran>الجنس <quran>"أعرض" </quran>عن الشكر <quran>"ونأى بجانبه" </quran>ثنى عطفه متبخترا , وفي قراءة بتقديم الهمزة <quran>"وإذا مسه الشر فذو دعاء عريض" </quran>كثير</p></td></tr></table></body></html>
