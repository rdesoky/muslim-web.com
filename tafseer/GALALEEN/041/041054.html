<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا إِنَّهُمْ فِي مِرْيَةٍ مِنْ لِقَاءِ رَبِّهِمْ أَلَا إِنَّهُ بِكُلِّ شَيْءٍ مُحِيطٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ألا إنهم في مرية" </quran>شك <quran>"من لقاء ربهم" </quran>لإنكارهم البعث <quran>"ألا إنه" </quran>تعالى <quran>"بكل شيء محيط" </quran>علما وقدرة فيجازيهم بكفرهم</p></td></tr></table></body></html>
