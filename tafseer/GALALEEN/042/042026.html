<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسْتَجِيبُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَيَزِيدُهُمْ مِنْ فَضْلِهِ وَالْكَافِرُونَ لَهُمْ عَذَابٌ شَدِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَسْتَجِيب الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَات" </quran>يُجِيبهُمْ إلَى مَا يَسْأَلُونَ</p></td></tr></table></body></html>
