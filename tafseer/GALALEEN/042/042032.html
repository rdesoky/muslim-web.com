<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنْ آيَاتِهِ الْجَوَارِي فِي الْبَحْرِ كَالْأَعْلَامِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْ آيَاته الْجَوَار" </quran>السُّفُن <quran>"فِي الْبَحْر كَالْأَعْلَامِ" </quran>كَالْجِبَالِ فِي الْعِظَم</p></td></tr></table></body></html>
