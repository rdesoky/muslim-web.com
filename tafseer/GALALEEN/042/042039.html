<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ إِذَا أَصَابَهُمُ الْبَغْيُ هُمْ يَنْتَصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ إذَا أَصَابَهُمْ الْبَغْي" </quran>الظُّلْم <quran>"هُمْ يَنْتَصِرُونَ" </quran>صِنْف أَيْ يَنْتَقِمُونَ مِمَّنْ ظَلَمَهُمْ بِمِثْلِ ظُلْمه</p></td></tr></table></body></html>
