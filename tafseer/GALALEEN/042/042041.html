<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمَنِ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَمَنِ انْتَصَرَ بَعْد ظُلْمه" </quran>أَيْ ظُلْم الظَّالِم إيَّاهُ <quran>"فَأُولَئِكَ مَا عَلَيْهِمْ مِنْ سَبِيل" </quran>مُؤَاخَذَة</p></td></tr></table></body></html>
