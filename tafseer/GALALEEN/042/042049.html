<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يَخْلُقُ مَا يَشَاءُ يَهَبُ لِمَنْ يَشَاءُ إِنَاثًا وَيَهَبُ لِمَنْ يَشَاءُ الذُّكُورَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِلَّهِ مُلْك السَّمَاوَات وَالْأَرْض يَخْلُق مَا يَشَاء يَهَب لِمَنْ يَشَاء" </quran>مِنْ الْأَوْلَاد</p></td></tr></table></body></html>
