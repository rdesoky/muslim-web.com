<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ يُزَوِّجُهُمْ ذُكْرَانًا وَإِنَاثًا وَيَجْعَلُ مَنْ يَشَاءُ عَقِيمًا إِنَّهُ عَلِيمٌ قَدِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ يُزَوِّجهُمْ" </quran>أَيْ يَجْعَلهُمْ <quran>"ذُكْرَانًا وَإِنَاثًا وَيَجْعَل مَنْ يَشَاء عَقِيمًا" </quran>فَلَا يَلِد وَلَا يُولَد لَهُ <quran>"إنَّهُ عَلِيم" </quran>بِمَا يَخْلُق <quran>"قَدِير" </quran>عَلَى مَا يَشَاء</p></td></tr></table></body></html>
