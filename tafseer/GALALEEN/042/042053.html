<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>صِرَاطِ اللَّهِ الَّذِي لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ أَلَا إِلَى اللَّهِ تَصِيرُ الْأُمُورُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"صِرَاط اللَّه الَّذِي لَهُ مَا فِي السَّمَاوَات وَمَا فِي الْأَرْض" </quran>مُلْكًا وَخَلْقًا وَعَبِيدًا <quran>"أَلَا إلَى اللَّه تَصِير الْأُمُور" </quran>تَرْجِع</p></td></tr></table></body></html>
