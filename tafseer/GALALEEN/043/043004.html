<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ فِي أُمِّ الْكِتَابِ لَدَيْنَا لَعَلِيٌّ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهُ" </quran>مُثْبَت <quran>"فِي أُمّ الْكِتَاب" </quran>أَصْل الْكُتُب أَيْ اللَّوْح الْمَحْفُوظ <quran>"لَدَيْنَا" </quran>بَدَل : عِنْدنَا <quran>"لَعَلِيٌّ" </quran>عَلَى الْكُتُب قَبْله <quran>"حَكِيم" </quran>ذُو حِكْمَة بَالِغَة</p></td></tr></table></body></html>
