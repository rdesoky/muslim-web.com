<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي جَعَلَ لَكُمُ الْأَرْضَ مَهْدًا وَجَعَلَ لَكُمْ فِيهَا سُبُلًا لَعَلَّكُمْ تَهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِي جَعَلَ لَكُمُ الْأَرْض مَهْدًا" </quran>فِرَاشًا كَالْمَهْدِ لِلصَّبِيِّ <quran>"وَجَعَلَ لَكُمْ فِيهَا سُبُلًا" </quran>طُرُقًا <quran>"لَعَلَّكُمْ تَهْتَدُونَ" </quran>إلَى مَقَاصِدكُمْ فِي أَسْفَاركُمْ</p></td></tr></table></body></html>
