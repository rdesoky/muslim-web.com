<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوَمَنْ يُنَشَّأُ فِي الْحِلْيَةِ وَهُوَ فِي الْخِصَامِ غَيْرُ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوَ" </quran>هَمْزَة الْإِنْكَار وَوَاو الْعَطْف بِجُمْلَةِ أَيْ يَجْعَلُونَ لِلَّهِ <quran>"مَنْ يُنَشَّأ فِي الْحِلْيَة" </quran>الزِّينَة <quran>"وَهُوَ فِي الْخِصَام غَيْر مُبِين" </quran>مُظْهِر الْحُجَّة لِضَعْفِهِ عَنْهَا بِالْأُنُوثَةِ</p></td></tr></table></body></html>
