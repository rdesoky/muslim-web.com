<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ آتَيْنَاهُمْ كِتَابًا مِنْ قَبْلِهِ فَهُمْ بِهِ مُسْتَمْسِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ آتَيْنَاهُمْ كِتَابًا مِنْ قَبْله" </quran>أَيْ الْقُرْآن بِعِبَادَةِ غَيْر اللَّه <quran>"فَهُمْ بِهِ مُسْتَمْسِكُونَ" </quran>أَيْ لَمْ يَقَع ذَلِكَ</p></td></tr></table></body></html>
