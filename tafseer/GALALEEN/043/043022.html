<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ قَالُوا إِنَّا وَجَدْنَا آبَاءَنَا عَلَى أُمَّةٍ وَإِنَّا عَلَى آثَارِهِمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ قَالُوا إنَّا وَجَدْنَا آبَاءَنَا عَلَى أُمَّة" </quran>مِلَّة <quran>"وَإِنَّا" </quran>مَاشُونَ <quran>"عَلَى آثَارهمْ مُهْتَدُونَ" </quran>بِهِمْ وَكَانُوا يَعْبُدُونَ غَيْر اللَّه</p></td></tr></table></body></html>
