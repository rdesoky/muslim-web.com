<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَانْتَقَمْنَا مِنْهُمْ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَانْتَقَمْنَا مِنْهُمْ" </quran>أَيْ مِنْ الْمُكَذِّبِينَ لِلرُّسُلِ قَبْلك</p></td></tr></table></body></html>
