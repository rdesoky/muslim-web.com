<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ وَقَوْمِهِ إِنَّنِي بَرَاءٌ مِمَّا تَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَ" </quran><quran>"إِذْ قَالَ إبْرَاهِيم لِأَبِيهِ وَقَوْمِهِ إنَّنِي بَرَاء" </quran>أَيْ بَرِيء</p></td></tr></table></body></html>
