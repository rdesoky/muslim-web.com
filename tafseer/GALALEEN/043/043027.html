<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا الَّذِي فَطَرَنِي فَإِنَّهُ سَيَهْدِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا الَّذِي فَطَرَنِي" </quran>خَلَقَنِي <quran>"فَإِنَّهُ سَيَهْدِينِي" </quran>يُرْشِدنِي لِدِينِهِ</p></td></tr></table></body></html>
