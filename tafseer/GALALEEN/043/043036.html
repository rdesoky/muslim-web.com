<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ يَعْشُ عَنْ ذِكْرِ الرَّحْمَنِ نُقَيِّضْ لَهُ شَيْطَانًا فَهُوَ لَهُ قَرِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ يَعْشُ" </quran>يَعْرِض <quran>"عَنْ ذِكْر الرَّحْمَن" </quran>أَيْ الْقُرْآن <quran>"نُقَيِّض" </quran>نُسَبِّب <quran>"لَهُ شَيْطَانًا فَهُوَ لَهُ قَرِين" </quran>لَا يُفَارِقهُ</p></td></tr></table></body></html>
