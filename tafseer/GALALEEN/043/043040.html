<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَأَنْتَ تُسْمِعُ الصُّمَّ أَوْ تَهْدِي الْعُمْيَ وَمَنْ كَانَ فِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَأَنْتَ تُسْمِع الصُّمّ أَوْ تَهْدِي الْعُمْيَ وَمَنْ كَانَ فِي ضَلَال مُبِين" </quran>بَيِّن أَيْ فَهُمْ لَا يُؤْمِنُونَ</p></td></tr></table></body></html>
