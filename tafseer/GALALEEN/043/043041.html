<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِمَّا نَذْهَبَنَّ بِكَ فَإِنَّا مِنْهُمْ مُنْتَقِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِمَّا" </quran>فِيهِ إدْغَام نُون إنْ الشَّرْطِيَّة فِي مَا الزَّائِدَة <quran>"نَذْهَبَنَّ بِك" </quran>بِأَنْ نُمِيتك قَبْل تَعْذِيبهمْ <quran>"فَإِنَّا مِنْهُمْ مُنْتَقِمُونَ" </quran>فِي الْآخِرَة</p></td></tr></table></body></html>
