<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ نُرِيَنَّكَ الَّذِي وَعَدْنَاهُمْ فَإِنَّا عَلَيْهِمْ مُقْتَدِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ نُرِيَنك" </quran>فِي حَيَاتك <quran>"الَّذِي وَعَدْنَاهُمْ" </quran>بِهِ مِنْ الْعَذَاب <quran>"فَإِنَّا عَلَيْهِمْ" </quran>عَلَى عَذَابهمْ <quran>"مُقْتَدِرُونَ" </quran>قَادِرُونَ</p></td></tr></table></body></html>
