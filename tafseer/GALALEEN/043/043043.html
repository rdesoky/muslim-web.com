<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْتَمْسِكْ بِالَّذِي أُوحِيَ إِلَيْكَ إِنَّكَ عَلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاسْتَمْسِكْ بِاَلَّذِي أُوحِيَ إلَيْك" </quran>أَيْ الْقُرْآن <quran>"إنَّك عَلَى صِرَاط" </quran>طَرِيق</p></td></tr></table></body></html>
