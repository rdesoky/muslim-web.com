<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا كَشَفْنَا عَنْهُمُ الْعَذَابَ إِذَا هُمْ يَنْكُثُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا كَشَفْنَا" </quran>بِدُعَاءِ مُوسَى <quran>"عَنْهُمْ الْعَذَاب إذَا هُمْ يَنْكُثُونَ" </quran>يَنْقُضُونَ عَهْدهمْ وَيُصِرُّونَ عَلَى كُفْرهمْ</p></td></tr></table></body></html>
