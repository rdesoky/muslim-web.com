<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْتَخَفَّ قَوْمَهُ فَأَطَاعُوهُ إِنَّهُمْ كَانُوا قَوْمًا فَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاسْتَخَفَّ" </quran>اسْتَفَزَّ فِرْعَوْن <quran>"قَوْمه فَأَطَاعُوهُ" </quran>فِيمَا يُرِيد مِنْ تَكْذِيب مُوسَى</p></td></tr></table></body></html>
