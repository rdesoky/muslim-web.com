<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَجَعَلْنَاهُمْ سَلَفًا وَمَثَلًا لِلْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَجَعَلْنَاهُمْ سَلَفًا" </quran>جَمْع سَالِف كَخَادِمٍ وَخَدَم أَيْ سَابِقِينَ عِبْرَة <quran>"وَمَثَلًا لِلْآخَرِينَ" </quran>بَعْدهمْ يَتَمَثَّلُونَ بِحَالِهِمْ فَلَا يَقْدَمُونَ عَلَى مِثْل أَفْعَالهمْ</p></td></tr></table></body></html>
