<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ نَشَاءُ لَجَعَلْنَا مِنْكُمْ مَلَائِكَةً فِي الْأَرْضِ يَخْلُفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ نَشَاء لَجَعَلْنَا مِنْكُمْ" </quran>بَدَلكُمْ <quran>"مَلَائِكَة فِي الْأَرْض يَخْلُفُونَ" </quran>بِأَنْ نُهْلِككُمْ</p></td></tr></table></body></html>
