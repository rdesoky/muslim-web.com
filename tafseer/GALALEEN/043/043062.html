<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَصُدَّنَّكُمُ الشَّيْطَانُ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا يَصُدَّنكُمْ" </quran>يَصْرِفَنكُمْ عَنْ دِين اللَّه <quran>"الشَّيْطَان إنَّهُ لَكُمْ عَدُوّ مُبِين" </quran>بَيِّن الْعَدَاوَة</p></td></tr></table></body></html>
