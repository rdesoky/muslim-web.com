<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلْ يَنْظُرُونَ إِلَّا السَّاعَةَ أَنْ تَأْتِيَهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَلْ يَنْظُرُونَ" </quran>أَيْ كُفَّار مَكَّة أَيْ مَا يَنْتَظِرُونَ <quran>"إلَّا السَّاعَة أَنْ تَأْتِيهِمْ" </quran>بَدَل مِنْ السَّاعَة <quran>"بَغْتَة" </quran>فَجْأَة <quran>"وَهُمْ لَا يَشْعُرُونَ" </quran>بِوَقْتِ مَجِيئِهَا قَبْله</p></td></tr></table></body></html>
