<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ادْخُلُوا الْجَنَّةَ أَنْتُمْ وَأَزْوَاجُكُمْ تُحْبَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُدْخُلُوا الْجَنَّة أَنْتُمْ" </quran>مُبْتَدَأ <quran>"وَأَزْوَاجكُمْ" </quran>زَوْجَاتكُمْ <quran>"تُحْبَرُونَ" </quran>تُسَرُّونَ وَتُكْرَمُونَ خَبَر الْمُبْتَدَأ</p></td></tr></table></body></html>
