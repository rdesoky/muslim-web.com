<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يُفَتَّرُ عَنْهُمْ وَهُمْ فِيهِ مُبْلِسُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يُفَتَّر" </quran>يُخَفَّف <quran>"عَنْهُمْ وَهُمْ فِيهِ مُبْلِسُونَ" </quran>سَاكِتُونَ سُكُوت يَأْس</p></td></tr></table></body></html>
