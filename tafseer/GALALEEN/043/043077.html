<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَادَوْا يَا مَالِكُ لِيَقْضِ عَلَيْنَا رَبُّكَ قَالَ إِنَّكُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَادَوْا يَا مَالِك" </quran>هُوَ خَازِن النَّار <quran>"لِيَقْضِ عَلَيْنَا رَبّك" </quran>لِيُمِتْنَا <quran>"قَالَ" </quran>بَعْد أَلْف سَنَة <quran>"إنَّكُمْ مَاكِثُونَ" </quran>مُقِيمُونَ فِي الْعَذَاب دَائِمًا</p></td></tr></table></body></html>
