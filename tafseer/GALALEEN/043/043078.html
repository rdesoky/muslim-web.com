<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ جِئْنَاكُمْ بِالْحَقِّ وَلَكِنَّ أَكْثَرَكُمْ لِلْحَقِّ كَارِهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَقَدْ جِئْنَاكُمْ" </quran>أَيْ أَهْل مَكَّة <quran>"بِالْحَقِّ" </quran>عَلَى لِسَان الرَّسُول</p></td></tr></table></body></html>
