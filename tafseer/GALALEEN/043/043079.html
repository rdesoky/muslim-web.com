<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ أَبْرَمُوا أَمْرًا فَإِنَّا مُبْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ أَبْرَمُوا" </quran>أَيْ كُفَّار مَكَّة : أَحْكَمُوا <quran>"أَمْرًا" </quran>فِي كَيْد مُحَمَّد النَّبِيّ <quran>"فَإِنَّا مُبْرِمُونَ" </quran>مُحْكِمُونَ كَيْدنَا فِي إهْلَاكهمْ</p></td></tr></table></body></html>
