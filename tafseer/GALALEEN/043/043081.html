<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنْ كَانَ لِلرَّحْمَنِ وَلَدٌ فَأَنَا أَوَّلُ الْعَابِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنْ كَانَ لِلرَّحْمَنِ وَلَد" </quran>فَرْضًا <quran>"فَأَنَا أَوَّل الْعَابِدِينَ" </quran>لِلْوَلَدِ لَكِنْ ثَبَتَ أَنْ لَا وَلَد لَهُ تَعَالَى فَانْتَفَتْ عِبَادَته</p></td></tr></table></body></html>
