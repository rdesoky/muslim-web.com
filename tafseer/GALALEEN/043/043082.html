<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سُبْحَانَ رَبِّ السَّمَاوَاتِ وَالْأَرْضِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سُبْحَان رَبّ السَّمَوَات وَالْأَرْض رَبّ الْعَرْش" </quran>الْكُرْسِيّ <quran>"عَمَّا يَصِفُونَ" </quran>يَقُولُونَ مِنْ الْكَذِب بِنِسْبَةِ الْوَلَد إلَيْهِ</p></td></tr></table></body></html>
