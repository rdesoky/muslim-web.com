<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَرْهُمْ يَخُوضُوا وَيَلْعَبُوا حَتَّى يُلَاقُوا يَوْمَهُمُ الَّذِي يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَذَرْهُمْ يَخُوضُوا" </quran>فِي بَاطِلهمْ <quran>"وَيَلْعَبُوا" </quran>فِي دُنْيَاهُمْ <quran>"حَتَّى يُلَاقُوا يَوْمَهُمُ الَّذِي يُوعَدُونَ" </quran>فِيهِ الْعَذَاب وَهُوَ يَوْم الْقِيَامَة</p></td></tr></table></body></html>
