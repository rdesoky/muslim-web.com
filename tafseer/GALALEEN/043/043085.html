<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَبَارَكَ الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا وَعِنْدَهُ عِلْمُ السَّاعَةِ وَإِلَيْهِ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَبَارَكَ" </quran>تَعَظَّمَ <quran>"الَّذِي لَهُ مُلْك السَّمَوَات وَالْأَرْض وَمَا بَيْنهمَا وَعِنْده عِلْم السَّاعَة" </quran>مَتَى تَقُوم <quran>"وَإِلَيْهِ تُرْجَعُونَ" </quran>بِالْيَاءِ وَالتَّاء</p></td></tr></table></body></html>
