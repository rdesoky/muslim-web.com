<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقِيلِهِ يَا رَبِّ إِنَّ هَؤُلَاءِ قَوْمٌ لَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقِيلِهِ" </quran>أَيْ قَوْل مُحَمَّد النَّبِيّ وَنَصْبه عَلَى الْمَصْدَر بِفِعْلِهِ الْمُقَدَّر أَيْ وَقَالَ <quran>"يَا رَبّ إنَّ هَؤُلَاءِ قَوْم لَا يُؤْمِنُونَ"</quran></p></td></tr></table></body></html>
