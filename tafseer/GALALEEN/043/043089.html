<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاصْفَحْ عَنْهُمْ وَقُلْ سَلَامٌ فَسَوْفَ يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاصْفَحْ" </quran>أَعْرِضْ <quran>"عَنْهُمْ وَقُلْ سَلَام" </quran>مِنْكُمْ وَهَذَا قَبْل أَنْ يُؤْمَر بِقِتَالِهِمْ <quran>"فَسَوْفَ يَعْلَمُونَ" </quran>بِالْيَاءِ وَالتَّاء تَهْدِيد لَهُمْ</p></td></tr></table></body></html>
