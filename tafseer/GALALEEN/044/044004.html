<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا يُفْرَقُ كُلُّ أَمْرٍ حَكِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فِيهَا" </quran>أَيْ فِي لَيْلَة الْقَدْر أَوْ لَيْلَة النِّصْف مِنْ شَعْبَان <quran>"يُفْرَق" </quran>يُفْصَل <quran>"كُلّ أَمْر حَكِيم" </quran>مُحَكَّم مِنْ الْأَرْزَاق وَالْآجَال وَغَيْرهمَا الَّتِي تَكُون فِي السَّنَة إلَى مِثْل تِلْكَ اللَّيْلَة</p></td></tr></table></body></html>
