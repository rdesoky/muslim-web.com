<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَحْمَةً مِنْ رَبِّكَ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَحْمَة" </quran>رَأْفَة بِالْمُرْسَلِ إلَيْهِمْ <quran>"مِنْ رَبّك إنَّهُ هُوَ السَّمِيع" </quran>لِأَقْوَالِهِمْ <quran>"الْعَلِيم" </quran>بِأَفْعَالِهِمْ</p></td></tr></table></body></html>
