<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنَّى لَهُمُ الذِّكْرَى وَقَدْ جَاءَهُمْ رَسُولٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنَّى لَهُمْ الذِّكْرَى" </quran>أَيْ لَا يَنْفَعهُمْ الْإِيمَان عِنْد نُزُول الْعَذَاب <quran>"وَقَدْ جَاءَهُمْ رَسُول مُبِين" </quran>بَيِّن الرِّسَالَة</p></td></tr></table></body></html>
