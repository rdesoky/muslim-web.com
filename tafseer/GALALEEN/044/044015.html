<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَاشِفُوا الْعَذَابِ قَلِيلًا إِنَّكُمْ عَائِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا كَاشِفُوا الْعَذَاب" </quran>أَيْ الْجُوع عَنْكُمْ زَمَنًا <quran>"قَلِيلًا" </quran>فَكَشَفَ عَنْهُمْ <quran>"إنَّكُمْ عَائِدُونَ" </quran>إلَى كُفْركُمْ فَعَادُوا إلَيْهِ</p></td></tr></table></body></html>
