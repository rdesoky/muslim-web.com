<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ نَبْطِشُ الْبَطْشَةَ الْكُبْرَى إِنَّا مُنْتَقِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>اُذْكُرْ <quran>"يَوْم نَبْطِش الْبَطْشَة الْكُبْرَى" </quran>هُوَ يَوْم بَدْر وَالْبَطْش الْأَخْذ بِقُوَّةٍ <quran>"إنَّا مُنْتَقِمُونَ" </quran>مِنْهُمْ</p></td></tr></table></body></html>
