<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ فَتَنَّا قَبْلَهُمْ قَوْمَ فِرْعَوْنَ وَجَاءَهُمْ رَسُولٌ كَرِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ فَتَنَّا" </quran>بَلَوْنَا <quran>"قَبْلهمْ قَوْم فِرْعَوْن" </quran>مَعَهُ <quran>"وَجَاءَهُمْ رَسُول" </quran>هُوَ مُوسَى عَلَيْهِ السَّلَام <quran>"كَرِيم" </quran>عَلَى اللَّه تَعَالَى</p></td></tr></table></body></html>
