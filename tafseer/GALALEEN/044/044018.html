<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ أَدُّوا إِلَيَّ عِبَادَ اللَّهِ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنْ" </quran>أَيْ بِأَنْ <quran>"أَدُّوا إلَيَّ" </quran>مَا أَدْعُوكُمْ إلَيْهِ مِنْ الْإِيمَان أَيْ أَظْهِرُوا إيمَانكُمْ لِي يَا <quran>"عِبَاد اللَّه إنِّي لَكُمْ رَسُول أَمِين" </quran>عَلَى مَا أُرْسِلْت بِهِ</p></td></tr></table></body></html>
