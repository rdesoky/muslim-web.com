<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَسْرِ بِعِبَادِي لَيْلًا إِنَّكُمْ مُتَّبَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَسْرِ" </quran>بِقَطْعِ الْهَمْزَة وَوَصْلهَا <quran>"بِعِبَادِي" </quran>بَنِي إسْرَائِيل <quran>"لَيْلًا إنَّكُمْ مُتَّبِعُونَ" </quran>يَتَّبِعكُمْ فِرْعَوْن وَقَوْمه</p></td></tr></table></body></html>
