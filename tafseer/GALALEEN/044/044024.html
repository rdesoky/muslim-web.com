<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتْرُكِ الْبَحْرَ رَهْوًا إِنَّهُمْ جُنْدٌ مُغْرَقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاتْرُكِ الْبَحْر" </quran>إذَا قَطَعْته أَنْتَ وَأَصْحَابك <quran>"رَهْوًا" </quran>سَاكِنًا مُنْفَرِجًا حَتَّى يَدْخُلهُ الْقِبْط <quran>"إنَّهُمْ جُنْد مُغْرَقُونَ" </quran>فَاطْمَأَنَّ بِذَلِكَ فَأُغْرِقُوا</p></td></tr></table></body></html>
