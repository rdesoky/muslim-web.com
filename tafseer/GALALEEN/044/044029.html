<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا بَكَتْ عَلَيْهِمُ السَّمَاءُ وَالْأَرْضُ وَمَا كَانُوا مُنْظَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا بَكَتْ عَلَيْهِمُ السَّمَاء وَالْأَرْض" </quran>بِخِلَافِ الْمُؤْمِنِينَ يَبْكِي عَلَيْهِمْ بِمَوْتِهِمْ مُصَلَّاهُمْ مِنْ الْأَرْض وَمُصْعَد عَمَلهمْ مِنْ السَّمَاء <quran>"وَمَا كَانُوا مُنْظَرِينَ" </quran>مُؤَخِّرِينَ لِلتَّوْبَةِ</p></td></tr></table></body></html>
