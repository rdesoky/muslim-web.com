<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ الْمُهِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ نَجَّيْنَا بَنِي إسْرَائِيل مِنَ الْعَذَاب الْمُهِين" </quran>قَتْل الْأَبْنَاء وَاسْتِخْدَام النِّسَاء</p></td></tr></table></body></html>
