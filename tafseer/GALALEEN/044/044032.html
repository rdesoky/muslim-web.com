<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدِ اخْتَرْنَاهُمْ عَلَى عِلْمٍ عَلَى الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدِ اخْتَرْنَاهُمْ" </quran>أَيْ بَنِي إسْرَائِيل <quran>"عَلَى عِلْم" </quran>مِنَّا بِحَالِهِمْ <quran>"عَلَى الْعَالَمِينَ" </quran>أَيْ عَالِمِي زَمَانهمْ أَيْ الْعُقَلَاء</p></td></tr></table></body></html>
