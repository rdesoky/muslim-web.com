<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَآتَيْنَاهُمْ مِنَ الْآيَاتِ مَا فِيهِ بَلَاءٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَآتَيْنَاهُمْ مِنَ الْآيَات مَا فِيهِ بَلَاء مُبِين" </quran>نِعْمَة ظَاهِرَة مِنْ فَلْق الْبَحْر وَالْمَنّ وَالسَّلْوَى وَغَيْرهَا</p></td></tr></table></body></html>
