<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأْتُوا بِآبَائِنَا إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأْتُوا بِآبَائِنَا" </quran>أَحْيَاء <quran>"إنْ كُنْتُمْ صَادِقِينَ" </quran>أَنَّا نُبْعَث بَعْد مَوْتنَا أَيْ نُحْيَا</p></td></tr></table></body></html>
