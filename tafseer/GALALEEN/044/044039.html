<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا خَلَقْنَاهُمَا إِلَّا بِالْحَقِّ وَلَكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا خَلَقْنَاهُمَا" </quran>وَمَا بَيْنهمَا <quran>"إلَّا بِالْحَقِّ" </quran>أَيْ مُحِقِّينَ فِي ذَلِكَ لِيُسْتَدَلّ بِهِ عَلَى قُدْرَتنَا وَوَحْدَانِيّتنَا وَغَيْر ذَلِكَ <quran>"وَلَكِنَّ أَكْثَرهمْ" </quran>أَيْ كُفَّار مَكَّة</p></td></tr></table></body></html>
