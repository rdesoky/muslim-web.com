<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ يَوْمَ الْفَصْلِ مِيقَاتُهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ يَوْم الْفَصْل" </quran>يَوْم الْقِيَامَة يَفْصِل اللَّه فِيهِ بَيْن الْعِبَاد <quran>"مِيقَاتهمْ أَجْمَعِينَ" </quran>لِلْعَذَابِ الدَّائِم</p></td></tr></table></body></html>
