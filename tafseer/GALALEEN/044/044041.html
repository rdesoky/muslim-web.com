<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ لَا يُغْنِي مَوْلًى عَنْ مَوْلًى شَيْئًا وَلَا هُمْ يُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم لَا يُغْنِي مَوْلَى عَنْ مَوْلَى" </quran>بِقَرَابَةٍ أَوْ صَدَاقَة أَيْ لَا يَدْفَع عَنْهُ , وَيَوْم بَدَل مِنْ يَوْم الْفَصْل <quran>"شَيْئًا" </quran>مِنْ الْعَذَاب <quran>"وَلَا هُمْ يُنْصَرُونَ" </quran>يُمْنَعُونَ مِنْهُ</p></td></tr></table></body></html>
