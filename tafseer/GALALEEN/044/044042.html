<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا مَنْ رَحِمَ اللَّهُ إِنَّهُ هُوَ الْعَزِيزُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا مَنْ رَحِمَ اللَّه" </quran>وَهُمْ الْمُؤْمِنُونَ فَإِنَّهُ يَشْفَع بَعْضهمْ لِبَعْضٍ بِإِذْنِ اللَّه <quran>"إنَّهُ هُوَ الْعَزِيز" </quran>الْغَالِب فِي انْتِقَامه مِنْ الْكُفَّار <quran>"الرَّحِيم" </quran>بِالْمُؤْمِنِينَ</p></td></tr></table></body></html>
