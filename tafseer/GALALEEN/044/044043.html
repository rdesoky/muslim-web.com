<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ شَجَرَةَ الزَّقُّومِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ شَجَرَة الزَّقُّوم" </quran>هِيَ مِنْ أَخْبَث الشَّجَر الْمُرّ بتِهَامَة يُنْبِتهَا اللَّه تَعَالَى فِي الْجَحِيم</p></td></tr></table></body></html>
