<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذُقْ إِنَّكَ أَنْتَ الْعَزِيزُ الْكَرِيمُ</font></td></tr><tr><td align=right dir=rtl><p>وَيُقَال لَهُ <quran>"ذُقْ" </quran>أَيْ الْعَذَاب <quran>"إنَّك أَنْتَ الْعَزِيز الْكَرِيم" </quran>بِزَعْمِك وَقَوْلك مَا بَيْن جَبَلَيْهَا أَعَزّ وَأَكْرَم مِنِّي</p></td></tr></table></body></html>
