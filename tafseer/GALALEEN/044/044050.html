<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا مَا كُنْتُمْ بِهِ تَمْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ هَذَا" </quran>الَّذِي تَرَوْنَ مِنْ الْعَذَاب <quran>"مَا كُنْتُمْ بِهِ تَمْتَرُونَ" </quran>فِيهِ تَشُكُّونَ</p></td></tr></table></body></html>
