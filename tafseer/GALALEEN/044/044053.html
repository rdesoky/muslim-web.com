<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَلْبَسُونَ مِنْ سُنْدُسٍ وَإِسْتَبْرَقٍ مُتَقَابِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَلْبَسُونَ مِنْ سُنْدُس وَإِسْتَبْرَق" </quran>أَيْ مَا رَقَّ مِنْ الدِّيبَاج وَمَا غَلُظَ مِنْهُ <quran>"مُتَقَابِلِينَ" </quran>حَال أَيْ لَا يَنْظُر بَعْضهمْ إلَى قَفَا بَعْض لِدَوَرَانِ الْأَسِرَّة بِهِمْ</p></td></tr></table></body></html>
