<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ وَزَوَّجْنَاهُمْ بِحُورٍ عِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَلِكَ" </quran>يُقَدَّر قَبْله الْأَمْر <quran>"وَزَوَّجْنَاهُمْ" </quran>مِنْ التَّزْوِيج أَوْ قَرَنَّاهُمْ <quran>"بِحُورٍ عِين" </quran>بِنِسَاءٍ بِيض وَاسِعَات الْأَعْيُن حِسَانهَا</p></td></tr></table></body></html>
