<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَدْعُونَ فِيهَا بِكُلِّ فَاكِهَةٍ آمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَدْعُونَ" </quran>يَطْلُبُونَ الْخَدَم <quran>"فِيهَا" </quran>أَيْ الْجَنَّة أَنْ يَأْتُوا <quran>"بِكُلِّ فَاكِهَة" </quran>مِنْهَا <quran>"آمِنِينَ" </quran>مِنْ انْقِطَاعهَا وَمَضَرَّتهَا وَمِنْ كُلّ مَخُوف حَال</p></td></tr></table></body></html>
