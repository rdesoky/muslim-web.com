<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَذُوقُونَ فِيهَا الْمَوْتَ إِلَّا الْمَوْتَةَ الْأُولَى وَوَقَاهُمْ عَذَابَ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَذُوقُونَ فِيهَا الْمَوْت إلَّا الْمَوْتَة الْأُولَى" </quran>أَيْ الَّتِي فِي الدُّنْيَا بَعْد حَيَاتهمْ فِيهَا قَالَ بَعْضهمْ إلَّا بِمَعْنَى بَعْد</p></td></tr></table></body></html>
