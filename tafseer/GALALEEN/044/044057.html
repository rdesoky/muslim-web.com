<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَضْلًا مِنْ رَبِّكَ ذَلِكَ هُوَ الْفَوْزُ الْعَظِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَضْلًا" </quran>مَصْدَر بِمَعْنَى تَفَضُّلًا مَنْصُوب بِتَفَضُّلٍ مُقَدَّرًا</p></td></tr></table></body></html>
