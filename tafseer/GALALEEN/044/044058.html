<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّمَا يَسَّرْنَاهُ بِلِسَانِكَ لَعَلَّهُمْ يَتَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِنَّمَا يَسَّرْنَاهُ" </quran>سَهَّلْنَا الْقُرْآن <quran>"بِلِسَانِك" </quran>بِلُغَتِك لِتَفْهَمهُ الْعَرَب مِنْك <quran>"لَعَلَّهُمْ يَتَذَكَّرُونَ" </quran>يَتَّعِظُونَ فَيُؤْمِنُونَ لَكِنَّهُمْ لَا يُؤْمِنُونَ</p></td></tr></table></body></html>
