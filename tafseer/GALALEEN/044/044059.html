<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَارْتَقِبْ إِنَّهُمْ مُرْتَقِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَارْتَقِبْ" </quran>انْتَظِرْ هَلَاكهمْ <quran>"إنَّهُمْ مُرْتَقِبُونَ" </quran>هَلَاكك وَهَذَا قَبْل نُزُول الْأَمْر بِجِهَادِهِمْ</p></td></tr></table></body></html>
