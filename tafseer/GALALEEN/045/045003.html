<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي السَّمَاوَاتِ وَالْأَرْضِ لَآيَاتٍ لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ فِي السَّمَاوَات وَالْأَرْض" </quran>أَيْ فِي خَلْقهمَا <quran>"لَآيَات" </quran>دَالَّة عَلَى قُدْرَة اللَّه وَوَحْدَانِيّته تَعَالَى</p></td></tr></table></body></html>
