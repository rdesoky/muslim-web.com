<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا عَلِمَ مِنْ آيَاتِنَا شَيْئًا اتَّخَذَهَا هُزُوًا أُولَئِكَ لَهُمْ عَذَابٌ مُهِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا عَلِمَ مِنْ آيَاتنَا" </quran>أَيْ الْقُرْآن <quran>"شَيْئًا اتَّخَذَهَا هُزُوًا" </quran>أَيْ مَهْزُوءًا بِهَا <quran>"أُولَئِكَ" </quran>أَيْ الْأَفَّاكُونَ <quran>"لَهُمْ عَذَاب مُهِين" </quran>ذُو إهَانَة</p></td></tr></table></body></html>
