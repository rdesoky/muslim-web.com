<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَعَلْنَاكَ عَلَى شَرِيعَةٍ مِنَ الْأَمْرِ فَاتَّبِعْهَا وَلَا تَتَّبِعْ أَهْوَاءَ الَّذِينَ لَا يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ جَعَلْنَاك" </quran>يَا مُحَمَّد <quran>"عَلَى شَرِيعَة" </quran>طَرِيقَة <quran>"مِنَ الْأَمْر" </quran>أَمْر الدِّين <quran>"فَاتَّبِعْهَا وَلَا تَتَّبِع أَهْوَاء الَّذِينَ لَا يَعْلَمُونَ" </quran>فِي عِبَادَة غَيْر اللَّه</p></td></tr></table></body></html>
