<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ لَنْ يُغْنُوا عَنْكَ مِنَ اللَّهِ شَيْئًا وَإِنَّ الظَّالِمِينَ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ وَاللَّهُ وَلِيُّ الْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُمْ لَنْ يُغْنُوا" </quran>يَدْفَعُوا <quran>"عَنْك مِنَ اللَّه" </quran>مِنْ عَذَابه <quran>"شَيْئًا وَإِنَّ الظَّالِمِينَ" </quran>الْكَافِرِينَ</p></td></tr></table></body></html>
