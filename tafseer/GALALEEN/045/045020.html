<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا بَصَائِرُ لِلنَّاسِ وَهُدًى وَرَحْمَةٌ لِقَوْمٍ يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا" </quran>الْقُرْآن <quran>"بَصَائِر لِلنَّاسِ" </quran>مَعَالِم يَتَبَصَّرُونَ بِهَا فِي الْأَحْكَام وَالْحُدُود <quran>"وَهُدًى وَرَحْمَة لِقَوْمٍ يُوقِنُونَ" </quran>بِالْبَعْثِ</p></td></tr></table></body></html>
