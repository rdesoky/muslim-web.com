<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَيَوْمَ تَقُومُ السَّاعَةُ يَوْمَئِذٍ يَخْسَرُ الْمُبْطِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِلَّهِ مُلْك السَّمَوَات وَالْأَرْض وَيَوْم تَقُوم السَّاعَة" </quran>يُبْدَل مِنْهُ <quran>"يَوْمئِذٍ يَخْسَر الْمُبْطِلُونَ" </quran>الْكَافِرُونَ أَيْ يَظْهَر خُسْرَانهمْ بِأَنْ يَصِيرُوا إلَى النَّار</p></td></tr></table></body></html>
