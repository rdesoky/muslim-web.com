<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا كِتَابُنَا يَنْطِقُ عَلَيْكُمْ بِالْحَقِّ إِنَّا كُنَّا نَسْتَنْسِخُ مَا كُنْتُمْ تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا كِتَابنَا" </quran>دِيوَان الْحَفَظَة <quran>"يَنْطِق عَلَيْكُمْ بِالْحَقِّ إنَّا كُنَّا نَسْتَنْسِخ" </quran>نُثْبِت وَنَحْفَظ</p></td></tr></table></body></html>
