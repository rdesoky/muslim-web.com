<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الَّذِينَ كَفَرُوا أَفَلَمْ تَكُنْ آيَاتِي تُتْلَى عَلَيْكُمْ فَاسْتَكْبَرْتُمْ وَكُنْتُمْ قَوْمًا مُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمَّا الَّذِينَ كَفَرُوا" </quran>فَيُقَال لَهُمْ <quran>"أَفَلَمْ تَكُنْ آيَاتِي" </quran>الْقُرْآن <quran>"تُتْلَى عَلَيْكُمْ فَاسْتَكْبَرْتُمْ" </quran>تَكَبَّرْتُمْ <quran>"وَكُنْتُمْ قَوْمًا مُجْرِمِينَ" </quran>كَافِرِينَ</p></td></tr></table></body></html>
