<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهُ الْكِبْرِيَاءُ فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَهُ الْكِبْرِيَاء" </quran>الْعَظَمَة <quran>"فِي السَّمَاوَات وَالْأَرْض" </quran>حَال أَيْ كَائِنَة فِيهِمَا <quran>"وَهُوَ الْعَزِيز الْحَكِيم" </quran>تَقَدَّمَ</p></td></tr></table></body></html>
