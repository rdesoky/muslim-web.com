<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَنْزِيل الْكِتَاب" </quran>الْقُرْآن مُبْتَدَأ <quran>"مِنْ اللَّه" </quran>خَبَره <quran>"الْعَزِيز" </quran>فِي مُلْكه <quran>"الْحَكِيم" </quran>فِي صُنْعه</p></td></tr></table></body></html>
