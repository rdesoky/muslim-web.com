<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِذَا حُشِرَ النَّاس كَانُوا" </quran>أَيْ الْأَصْنَام <quran>"لَهُمْ" </quran>لِعَابِدِيهِمْ <quran>"أَعْدَاء وَكَانُوا بِعِبَادَتِهِمْ" </quran>بِعِبَادَةِ عَابِدِيهِمْ <quran>"كَافِرِينَ" </quran>جَاحِدِينَ</p></td></tr></table></body></html>
