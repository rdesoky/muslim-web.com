<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ أَصْحَابُ الْجَنَّةِ خَالِدِينَ فِيهَا جَزَاءً بِمَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ أَصْحَاب الْجَنَّة خَالِدِينَ فِيهَا" </quran>حَال <quran>"جَزَاء" </quran>مَنْصُوب عَلَى الْمَصْدَر بِفِعْلِهِ الْمُقَدَّر أَيْ يُجْزَوْنَ</p></td></tr></table></body></html>
