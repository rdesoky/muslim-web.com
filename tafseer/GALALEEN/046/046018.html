<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ حَقَّ عَلَيْهِمُ الْقَوْلُ فِي أُمَمٍ قَدْ خَلَتْ مِنْ قَبْلِهِمْ مِنَ الْجِنِّ وَالْإِنْسِ إِنَّهُمْ كَانُوا خَاسِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ الَّذِينَ حَقَّ" </quran>وَجَبَ <quran>"عَلَيْهِمْ الْقَوْل" </quran>بِالْعَذَابِ</p></td></tr></table></body></html>
