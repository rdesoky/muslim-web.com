<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ يُعْرَضُ الَّذِينَ كَفَرُوا عَلَى النَّارِ أَلَيْسَ هَذَا بِالْحَقِّ قَالُوا بَلَى وَرَبِّنَا قَالَ فَذُوقُوا الْعَذَابَ بِمَا كُنْتُمْ تَكْفُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَوْم يُعْرَض الَّذِينَ كَفَرُوا عَلَى النَّار" </quran>بِأَنْ يُعَذَّبُوا بِهَا يُقَال لَهُمْ <quran>"أَلَيْسَ هَذَا" </quran>التَّعْذِيب <quran>"بِالْحَقِّ"</quran></p></td></tr></table></body></html>
