<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَهْدِيهِمْ وَيُصْلِحُ بَالَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَيُهْدِيهِمْ" </quran>فِي الدُّنْيَا وَالْآخِرَة إلَى مَا يَنْفَعهُمْ <quran>"وَيُصْلِح بَالهمْ" </quran>حَالهمْ فِيهِمَا وَمَا فِي الدُّنْيَا لِمَنْ لَمْ يُقْتَل وَأُدْرِجُوا فِي قُتِلُوا تَغْلِيبًا</p></td></tr></table></body></html>
