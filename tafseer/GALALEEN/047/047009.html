<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ بِأَنَّهُمْ كَرِهُوا مَا أَنْزَلَ اللَّهُ فَأَحْبَطَ أَعْمَالَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>التَّعْس وَالْإِضْلَال <quran>"بِأَنَّهُمْ كَرِهُوا مَا أَنْزَلَ اللَّه" </quran>مِنْ الْقُرْآن الْمُشْتَمِل عَلَى التَّكَالِيف</p></td></tr></table></body></html>
