<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى وَآتَاهُمْ تَقْوَاهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ اهْتَدَوْا" </quran>وَهُمْ الْمُؤْمِنُونَ <quran>"زَادَهُمْ" </quran>اللَّه <quran>"هُدَى وَآتَاهُمْ تَقْوَاهُمْ" </quran>أَلْهَمَهُمْ مَا يَتَّقُونَ بِهِ النَّار</p></td></tr></table></body></html>
