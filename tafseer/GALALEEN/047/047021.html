<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>طَاعَةٌ وَقَوْلٌ مَعْرُوفٌ فَإِذَا عَزَمَ الْأَمْرُ فَلَوْ صَدَقُوا اللَّهَ لَكَانَ خَيْرًا لَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"طَاعَة وَقَوْل مَعْرُوف" </quran>أَيْ حَسَن لَك <quran>"فَإِذَا عَزَمَ الْأَمْر" </quran>أَيْ فُرِضَ الْقِتَال <quran>"فَلَوْ صَدَقُوا اللَّه" </quran>فِي الْإِيمَان وَالطَّاعَة وَجُمْلَة لَوْ جَوَاب إذَا</p></td></tr></table></body></html>
