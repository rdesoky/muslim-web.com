<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ فَأَصَمَّهُمْ وَأَعْمَى أَبْصَارَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أُولَئِكَ" </quran>أَيْ الْمُفْسِدُونَ <quran>"الَّذِينَ لَعَنَهُمْ اللَّه فَأَصَمَّهُمْ" </quran>عَنْ اسْتِمَاع الْحَقّ <quran>"وَأَعْمَى أَبْصَارهمْ" </quran>عَنْ طَرِيق الْهُدَى</p></td></tr></table></body></html>
