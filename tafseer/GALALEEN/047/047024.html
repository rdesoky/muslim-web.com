<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ أَمْ عَلَى قُلُوبٍ أَقْفَالُهَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَلَا يَتَدَبَّرُونَ الْقُرْآن" </quran>فَيَعْرِفُونَ الْحَقّ <quran>"أَمْ" </quran>بَلْ <quran>"عَلَى قُلُوب" </quran>لَهُمْ <quran>"أَقْفَالهَا" </quran>فَلَا يَفْهَمُونَهُ</p></td></tr></table></body></html>
