<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَيْفَ إِذَا تَوَفَّتْهُمُ الْمَلَائِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَارَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكَيْفَ" </quran>حَالهمْ <quran>"إذْ تَوَفَّتْهُمْ الْمَلَائِكَة يَضْرِبُونَ" </quran>حَال مِنْ الْمَلَائِكَة <quran>"وُجُوههمْ وَأَدْبَارهمْ" </quran>ظُهُورهمْ بِمَقَامِع مِنْ حَدِيد</p></td></tr></table></body></html>
