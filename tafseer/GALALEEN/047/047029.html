<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ حَسِبَ الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ أَنْ لَنْ يُخْرِجَ اللَّهُ أَضْغَانَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ حَسِبَ الَّذِينَ فِي قُلُوبهمْ مَرَض أَنْ لَنْ يُخْرِج اللَّه أَضْغَانهمْ" </quran>يُظْهِر أَحْقَادهمْ عَلَى النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَالْمُؤْمِنِينَ</p></td></tr></table></body></html>
