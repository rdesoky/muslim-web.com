<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَلَا تُبْطِلُوا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّه وَأَطِيعُوا الرَّسُول وَلَا تُبْطِلُوا أَعْمَالكُمْ" </quran>بِالْمَعَاصِي مَثَلًا</p></td></tr></table></body></html>
