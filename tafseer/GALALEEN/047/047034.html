<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ ثُمَّ مَاتُوا وَهُمْ كُفَّارٌ فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيل اللَّه" </quran>طَرِيقه وَهُوَ الْهُدَى <quran>"ثُمَّ مَاتُوا وَهُمْ كُفَّار فَلَنْ يَغْفِر اللَّه لَهُمْ" </quran>نَزَلَتْ فِي أَصْحَاب الْقَلِيب</p></td></tr></table></body></html>
