<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ يَسْأَلْكُمُوهَا فَيُحْفِكُمْ تَبْخَلُوا وَيُخْرِجْ أَضْغَانَكُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنْ يَسْأَلكُمُوهَا فَيُحْفِكُمْ" </quran>يُبَالِغ فِي طَلَبهَا <quran>"تَبْخَلُوا وَيُخْرِج" </quran>الْبُخْل <quran>"أَضْغَانكُمْ" </quran>لِدِينِ الْإِسْلَام</p></td></tr></table></body></html>
