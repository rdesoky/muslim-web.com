<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا فَتَحْنَا لَكَ فَتْحًا مُبِينًا</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الْفَتْح [ مَدَنِيَّة نَزَلَتْ فِي الطَّرِيق عِنْد الِانْصِرَاف مِنْ الْحُدَيْبِيَة وَآيَاتهَا 29 ]</p><p><quran>"إنَّا فَتَحْنَا لَك" </quran>قَضَيْنَا بِفَتْحِ مَكَّة وَغَيْرهَا فِي الْمُسْتَقْبَل عِنْوَة بِجِهَادِك <quran>"فَتْحًا مُبِينًا" </quran>بَيِّنًا ظَاهِرًا</p></td></tr></table></body></html>
