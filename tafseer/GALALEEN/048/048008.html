<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا أَرْسَلْنَاك شَاهِدًا" </quran>عَلَى أُمَّتك فِي الْقِيَامَة <quran>"وَمُبَشِّرًا" </quran>لَهُمْ فِي الدُّنْيَا <quran>"وَنَذِيرًا" </quran>مُنْذِرًا مُخَوِّفًا فِيهَا مَنْ عَمِلَ سُوءًا بِالنَّارِ</p></td></tr></table></body></html>
