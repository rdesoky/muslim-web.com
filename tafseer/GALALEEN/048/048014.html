<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ وَكَانَ اللَّهُ غَفُورًا رَحِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِلَّهِ مُلْك السَّمَوَات وَالْأَرْض يَغْفِر لِمَنْ يَشَاء وَيُعَذِّب مَنْ يَشَاء وَكَانَ اللَّه غَفُورًا رَحِيمًا" </quran>أَيْ لَمْ يَزَلْ مُتَّصِفًا بِمَا ذُكِرَ</p></td></tr></table></body></html>
