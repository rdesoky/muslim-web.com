<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَغَانِمَ كَثِيرَةً يَأْخُذُونَهَا وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَغَانِم كَثِيرَة يَأْخُذُونَهَا" </quran>مِنْ خَيْبَر <quran>"وَكَانَ اللَّه عَزِيزًا حَكِيمًا" </quran>أَيْ لَمْ يَزَلْ مُتَّصِفًا بِذَلِكَ</p></td></tr></table></body></html>
