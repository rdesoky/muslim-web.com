<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ قَاتَلَكُمُ الَّذِينَ كَفَرُوا لَوَلَّوُا الْأَدْبَارَ ثُمَّ لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ قَاتَلَكُمُ الَّذِينَ كَفَرُوا" </quran>بِالْحُدَيْبِيَةِ <quran>"لَوَلَّوُا الْأَدْبَار ثُمَّ لَا يَجِدُونَ وَلِيًّا" </quran>يَحْرُسهُمْ</p></td></tr></table></body></html>
