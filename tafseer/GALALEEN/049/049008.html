<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَضْلًا مِنَ اللَّهِ وَنِعْمَةً وَاللَّهُ عَلِيمٌ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَضْلًا مِنَ اللَّه" </quran>مَصْدَر مَنْصُوب بِفِعْلِهِ الْمُقَدَّر أَيْ أَفْضَل <quran>"وَنِعْمَة" </quran>مِنْهُ <quran>"وَاَللَّه عَلِيم" </quran>بِهِمْ <quran>"حَكِيم" </quran>فِي إنْعَامه عَلَيْهِمْ</p></td></tr></table></body></html>
