<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا الْمُؤْمِنُونَ إخْوَة" </quran>فِي الدِّين <quran>"فَأَصْلِحُوا بَيْن أَخَوَيْكُمْ" </quran>إذَا تَنَازَعَا وَقُرِئَ إخْوَتكُمْ بالفوقانية</p></td></tr></table></body></html>
