<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ يَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ بَصِيرٌ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ اللَّه يَعْلَم غَيْب السَّمَاوَات وَالْأَرْض" </quran>أَيْ مَا غَابَ فِيهِمَا <quran>"وَاَللَّه بَصِير بِمَا يَعْمَلُونَ" </quran>بِالْيَاءِ وَالتَّاء لَا يَخْفَى عَلَيْهِ شَيْء مِنْهُ</p></td></tr></table></body></html>
