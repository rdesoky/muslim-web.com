<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ق وَالْقُرْآنِ الْمَجِيدِ</font></td></tr><tr><td align=right dir=rtl><p>سُورَة ق [ مَكِّيَّة إلَّا آيَة 38 فَمَدَنِيَّة وآياتا 45 ]</p><p><quran>"ق" </quran>اللَّه أَعْلَم بِمُرَادِهِ بِهِ <quran>"وَالْقُرْآن الْمَجِيد" </quran>الْكَرِيم مَا آمَنَ كُفَّار مَكَّة بِمُحَمَّدٍ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
