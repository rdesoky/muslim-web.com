<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ عَجِبُوا أَنْ جَاءَهُمْ مُنْذِرٌ مِنْهُمْ فَقَالَ الْكَافِرُونَ هَذَا شَيْءٌ عَجِيبٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ عَجِبُوا أَنْ جَاءَهُمْ مُنْذِر مِنْهُمْ" </quran>رَسُول مِنْ أَنْفُسهمْ يُخَوِّفهُمْ بِالنَّارِ بَعْد الْبَعْث <quran>"فَقَالَ الْكَافِرُونَ هَذَا" </quran>الْإِنْذَار</p></td></tr></table></body></html>
