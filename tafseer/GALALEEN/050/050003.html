<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَئِذَا مِتْنَا وَكُنَّا تُرَابًا ذَلِكَ رَجْعٌ بَعِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَإِذَا" </quran>بِتَحْقِيقِ الْهَمْزَتَيْنِ وَتَسْهِيل الثَّانِيَة وَإِدْخَال أَلِف بَيْنهمَا عَلَى الْوَجْهَيْنِ <quran>"مِتْنَا وَكُنَّا تُرَابًا" </quran>نَرْجِع ؟ <quran>"ذَلِكَ رَجْع بَعِيد" </quran>فِي غَايَة الْبُعْد</p></td></tr></table></body></html>
