<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَدْ عَلِمْنَا مَا تَنْقُصُ الْأَرْضُ مِنْهُمْ وَعِنْدَنَا كِتَابٌ حَفِيظٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَدْ عَلِمْنَا مَا تَنْقُص الْأَرْض" </quran>تَأْكُل <quran>"مِنْهُمْ وَعِنْدنَا كِتَاب حَفِيظ" </quran>هُوَ اللَّوْح الْمَحْفُوظ فِيهِ جَمِيع الْأَشْيَاء الْمُقَدَّرَة</p></td></tr></table></body></html>
