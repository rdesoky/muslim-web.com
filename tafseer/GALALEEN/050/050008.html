<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَبْصِرَةً وَذِكْرَى لِكُلِّ عَبْدٍ مُنِيبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَبْصِرَة" </quran>مَفْعُول لَهُ أَيْ فَعَلْنَا ذَلِكَ تَبْصِيرًا مِنَّا <quran>"وَذِكْرَى" </quran>تَذْكِيرًا <quran>"لِكُلِّ عَبْد مُنِيب" </quran>رَجَّاع إلَى طَاعَتنَا</p></td></tr></table></body></html>
