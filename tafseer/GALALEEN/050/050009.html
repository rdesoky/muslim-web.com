<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً مُبَارَكًا فَأَنْبَتْنَا بِهِ جَنَّاتٍ وَحَبَّ الْحَصِيدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنَزَّلْنَا مِنَ السَّمَاء مَاء مُبَارَكًا" </quran>كَثِير الْبَرَكَة <quran>"فَأَنْبَتْنَا بِهِ جَنَّات" </quran>بَسَاتِين <quran>"وَحَبّ" </quran>الزَّرْع <quran>"الْحَصِيد" </quran>الْمَحْصُود</p></td></tr></table></body></html>
