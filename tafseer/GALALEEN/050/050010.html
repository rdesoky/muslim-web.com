<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالنَّخْلَ بَاسِقَاتٍ لَهَا طَلْعٌ نَضِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالنَّخْل بَاسِقَات" </quran>طِوَالًا حَال مُقَدَّرَة <quran>"لَهَا طَلْع نَضِيد" </quran>مُتَرَاكِب بَعْضه فَوْق بَعْض</p></td></tr></table></body></html>
