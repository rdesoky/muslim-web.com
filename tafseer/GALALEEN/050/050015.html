<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَعَيِينَا بِالْخَلْقِ الْأَوَّلِ بَلْ هُمْ فِي لَبْسٍ مِنْ خَلْقٍ جَدِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَعَيِينَا بِالْخَلْقِ الْأَوَّل" </quran>أَيْ لَمْ نَعْي بِهِ فَلَا نَعْيَا بِالْإِعَادَةِ <quran>"بَلْ هُمْ فِي لَبْس" </quran>شَكّ <quran>"مِنْ خَلْق جَدِيد" </quran>وَهُوَ الْبَعْث</p></td></tr></table></body></html>
