<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَتْ سَكْرَةُ الْمَوْتِ بِالْحَقِّ ذَلِكَ مَا كُنْتَ مِنْهُ تَحِيدُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَاءَتْ سَكْرَة الْمَوْت" </quran>غَمْرَته وَشِدَّته <quran>"بِالْحَقِّ" </quran>مِنْ أَمْر الْآخِرَة حَتَّى الْمُنْكِر لَهَا عِيَانًا وَهُوَ نَفْس الشِّدَّة <quran>"ذَلِكَ" </quran>أَيْ الْمَوْت <quran>"مَا كُنْت مِنْهُ تَحِيد" </quran>تَهْرَب وَتَفْزَع</p></td></tr></table></body></html>
