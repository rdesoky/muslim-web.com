<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنُفِخَ فِي الصُّورِ ذَلِكَ يَوْمُ الْوَعِيدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَنُفِخَ فِي الصُّور" </quran>لِلْبَعْثِ <quran>"ذَلِكَ" </quran>أَيْ يَوْم النَّفْخ <quran>"يَوْم الْوَعِيد" </quran>لِلْكُفَّارِ بِالْعَذَابِ</p></td></tr></table></body></html>
