<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ قَرِينُهُ هَذَا مَا لَدَيَّ عَتِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ قَرِينه" </quran>الْمَلَك الْمُوَكَّل بِهِ <quran>"هَذَا مَا" </quran>أَيْ الَّذِي <quran>"لَدَيَّ عَتِيد" </quran>حَاضِر فَيُقَال لِمَالِكِ :</p></td></tr></table></body></html>
