<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلْقِيَا فِي جَهَنَّمَ كُلَّ كَفَّارٍ عَنِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلْقِيَا فِي جَهَنَّم" </quran>أَيْ : أَلْقِ أَلْقِ أَوْ أَلْقِيَن وَبِهِ قَرَأَ الْحَسَن فَأُبْدِلَتْ النُّون أَلِفًا <quran>"كُلّ كَفَّار عَنِيد" </quran>مُعَانِد لِلْحَقِّ</p></td></tr></table></body></html>
