<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ قَرِينُهُ رَبَّنَا مَا أَطْغَيْتُهُ وَلَكِنْ كَانَ فِي ضَلَالٍ بَعِيدٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ قَرِينه" </quran>الشَّيْطَان <quran>"رَبّنَا مَا أَطْغَيْته" </quran>أَضْلَلْته <quran>"وَلَكِنْ كَانَ فِي ضَلَال بَعِيد" </quran>فَدَعَوْته فَاسْتَجَابَ لِي وَقَالَ هُوَ أَطْغَانِي بِدُعَائِهِ لَهُ</p></td></tr></table></body></html>
