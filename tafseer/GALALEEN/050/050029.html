<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا يُبَدَّلُ الْقَوْلُ لَدَيَّ وَمَا أَنَا بِظَلَّامٍ لِلْعَبِيدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا يُبَدَّل" </quran>يُغَيَّر <quran>"الْقَوْل لَدَيَّ" </quran>فِي ذَلِكَ <quran>"وَمَا أَنَا بِظَلَّامٍ لِلْعَبِيدِ" </quran>فَأُعَذِّبهُمْ بِغَيْرِ جُرْم وَظَلَّام بِمَعْنَى ذِي ظُلْم لِقَوْلِهِ <quran>"لَا ظُلْم الْيَوْم"</quran></p></td></tr></table></body></html>
