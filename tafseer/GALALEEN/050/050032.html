<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا مَا تُوعَدُونَ لِكُلِّ أَوَّابٍ حَفِيظٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا" </quran>الْمَرْئِيّ <quran>"مَا تُوعَدُونَ" </quran>بِالتَّاءِ وَالْيَاء فِي الدُّنْيَا وَيُبْدَل مِنْ لِلْمُتَّقِينَ قَوْله : <quran>"لِكُلِّ أَوَّاب" </quran>رَجَّاع إلَى طَاعَة اللَّه <quran>"حَفِيظ" </quran>حَافِظ لِحُدُودِهِ</p></td></tr></table></body></html>
