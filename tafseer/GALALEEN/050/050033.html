<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ خَشِيَ الرَّحْمَنَ بِالْغَيْبِ وَجَاءَ بِقَلْبٍ مُنِيبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَنْ خَشِيَ الرَّحْمَن بِالْغَيْبِ" </quran>خَافَهُ وَلَمْ يَرَهُ <quran>"وَجَاءَ بِقَلْبٍ مُنِيب" </quran>مُقْبِل عَلَى طَاعَته وَيُقَال لِلْمُتَّقِينَ أَيْضًا</p></td></tr></table></body></html>
