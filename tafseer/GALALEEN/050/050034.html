<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ادْخُلُوهَا بِسَلَامٍ ذَلِكَ يَوْمُ الْخُلُودِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اُدْخُلُوهَا بِسَلَامٍ" </quran>سَالِمِينَ مِنْ كُلّ مَخُوف أَوْ مَعَ سَلَام أَيْ سَلِّمُوا وَادْخُلُوا <quran>"ذَلِكَ" </quran>الْيَوْم الَّذِي حَصَلَ فِيهِ الدُّخُول <quran>"يَوْم الْخُلُود" </quran>الدَّوَام فِي الْجَنَّة</p></td></tr></table></body></html>
