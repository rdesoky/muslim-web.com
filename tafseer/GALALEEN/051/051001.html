<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالذَّارِيَاتِ ذَرْوًا</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الذَّارِيَات [ مَكِّيَّة وَآيَاتهَا سِتُّونَ ]</p><p><quran>"وَالذَّارِيَات" </quran>الرِّيَاح تَذْرُو التُّرَاب وَغَيْره <quran>"ذَرْوًا" </quran>مَصْدَر وَيُقَال تَذْرِيهِ ذَرْيًا : تَهُبّ بِهِ</p></td></tr></table></body></html>
