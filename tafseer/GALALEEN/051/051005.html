<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا تُوعَدُونَ لَصَادِقٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا تُوعَدُونَ" </quran>مَا مَصْدَرِيَّة أَيْ وَعْدهمْ بِالْبَعْثِ وَغَيْره <quran>"لَصَادِق" </quran>لَوَعْد صَادِق</p></td></tr></table></body></html>
