<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالسَّمَاءِ ذَاتِ الْحُبُكِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالسَّمَاء ذَات الْحُبُك" </quran>جَمْع حَبِيكَة كَطَرِيقَةٍ وَطَرِيق أَيْ صَاحِبَة الطُّرُق فِي الْخِلْقَة كَالطَّرِيقِ فِي الرَّمَل</p></td></tr></table></body></html>
