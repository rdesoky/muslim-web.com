<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكُمْ لَفِي قَوْلٍ مُخْتَلِفٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّكُمْ" </quran>يَا أَهْل مَكَّة فِي شَأْن النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَالْقُرْآن <quran>"لَفِي قَوْل مُخْتَلِف" </quran>قِيلَ شَاعِر سَاحِر كَاهِن شِعْر سِحْر كَهَانَة</p></td></tr></table></body></html>
