<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ هُمْ فِي غَمْرَةٍ سَاهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"الَّذِينَ هُمْ فِي غَمْرَة" </quran>جَهْل يَغْمُرهُمْ <quran>"سَاهُونَ" </quran>غَافِلُونَ عَنْ أَمْر الْآخِرَة</p></td></tr></table></body></html>
