<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَسْأَلُونَ أَيَّانَ يَوْمُ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَسْأَلُونَ" </quran>النَّبِيّ اسْتِفْهَام اسْتِهْزَاء <quran>"أَيَّانَ يَوْم الدِّين" </quran>أَيْ مَتَى مَجِيئُهُ وَجَوَابهمْ : يَجِيء</p></td></tr></table></body></html>
