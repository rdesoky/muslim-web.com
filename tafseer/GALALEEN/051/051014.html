<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذُوقُوا فِتْنَتَكُمْ هَذَا الَّذِي كُنْتُمْ بِهِ تَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذُوقُوا فِتْنَتكُمْ" </quran>تَعْذِيبكُمْ <quran>"هَذَا" </quran>التَّعْذِيب <quran>"الَّذِي كُنْتُمْ بِهِ تَسْتَعْجِلُونَ" </quran>فِي الدُّنْيَا اسْتِهْزَاء</p></td></tr></table></body></html>
