<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَانُوا قَلِيلًا مِنَ اللَّيْلِ مَا يَهْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَانُوا قَلِيلًا مِنَ اللَّيْل مَا يَهْجَعُونَ" </quran>يَنَامُونَ وَمَا زَائِدَة وَيَهْجَعُونَ خَبَر كَانَ وَقَلِيلًا ظَرْف أَيْ يَنَامُونَ فِي زَمَن يَسِير مِنْ اللَّيْل وَيُصَلُّونَ أَكْثَره</p></td></tr></table></body></html>
