<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي أَمْوَالِهِمْ حَقٌّ لِلسَّائِلِ وَالْمَحْرُومِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفِي أَمْوَالهمْ حَقّ لِلسَّائِلِ وَالْمَحْرُوم" </quran>الَّذِي لَا يَسْأَل لِتَعَفُّفِهِ</p></td></tr></table></body></html>
