<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي الْأَرْضِ آيَاتٌ لِلْمُوقِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفِي الْأَرْض" </quran>مِنْ الْجِبَال وَالْبِحَار وَالْأَشْجَار وَالثِّمَار وَالنَّبَات وَغَيْرهَا <quran>"آيَات" </quran>دَلَالَات عَلَى قُدْرَة اللَّه سُبْحَانه وَتَعَالَى وَوَحْدَانِيّته</p></td></tr></table></body></html>
