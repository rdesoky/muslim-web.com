<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي أَنْفُسِكُمْ أَفَلَا تُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفِي أَنْفُسكُمْ" </quran>آيَات أَيْضًا مِنْ مَبْدَأ خَلْقكُمْ إلَى مُنْتَهَاهُ وَمَا فِي تَرْكِيب خَلْقكُمْ مِنْ الْعَجَائِب <quran>"أَفَلَا تُبْصِرُونَ" </quran>ذَلِكَ فَتَسْتَدِلُّونَ بِهِ عَلَى صَانِعه وَقُدْرَته</p></td></tr></table></body></html>
