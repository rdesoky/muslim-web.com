<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفِي السَّمَاء رِزْقكُمْ" </quran>أَيْ الْمَطَر الْمُسَبَّب عَنْهُ النَّبَات الَّذِي هُوَ رِزْق <quran>"وَمَا تُوعَدُونَ" </quran>مِنْ الْمَآب وَالثَّوَاب وَالْعِقَاب أَيْ مَكْتُوب ذَلِكَ فِي السَّمَاء</p></td></tr></table></body></html>
