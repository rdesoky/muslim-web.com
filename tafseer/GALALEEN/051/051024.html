<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلْ أَتَاكَ حَدِيثُ ضَيْفِ إِبْرَاهِيمَ الْمُكْرَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَلْ أَتَاك" </quran>خِطَاب لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"حَدِيث ضَيْف إبْرَاهِيم الْمُكْرَمِينَ" </quran>وَهُمْ مَلَائِكَة اثْنَا عَشَر أَوْ عَشْرَة أَوْ ثَلَاثَة مِنْهُمْ جِبْرِيل</p></td></tr></table></body></html>
