<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَرَاغَ إِلَى أَهْلِهِ فَجَاءَ بِعِجْلٍ سَمِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَرَاغَ" </quran>مَالَ <quran>"إلَى أَهْله" </quran>سِرًّا <quran>"فَجَاءَ بِعِجْلٍ سَمِين" </quran>وَفِي سُورَة هُود <quran>"بِعِجْلٍ حَنِيذ" </quran>أَيْ مَشْوِيّ</p></td></tr></table></body></html>
