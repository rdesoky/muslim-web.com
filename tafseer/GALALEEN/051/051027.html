<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَرَّبَهُ إِلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقَرَّبَهُ إلَيْهِمْ قَالَ أَلَا تَأْكُلُونَ" </quran>عَرَضَ عَلَيْهِمْ الْأَكْل فَلَمْ يُجِيبُوا</p></td></tr></table></body></html>
