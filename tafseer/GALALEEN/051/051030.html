<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا كَذَلِكِ قَالَ رَبُّكِ إِنَّهُ هُوَ الْحَكِيمُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا كَذَلِك" </quran>أَيْ مِثْل قَوْلنَا فِي الْبِشَارَة <quran>"قَالَ رَبّك إنَّهُ هُوَ الْحَكِيم" </quran>فِي صُنْعه <quran>"الْعَلِيم" </quran>بِخَلْقِهِ</p></td></tr></table></body></html>
