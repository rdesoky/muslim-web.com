<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخْرَجْنَا مَنْ كَانَ فِيهَا مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَخْرَجْنَا مَنْ كَانَ فِيهَا" </quran>أَيْ قُرَى قَوْم لُوط <quran>"مِنَ الْمُؤْمِنِينَ" </quran>لِإِهْلَاكِ الْكَافِرِينَ</p></td></tr></table></body></html>
