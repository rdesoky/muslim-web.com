<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَرَكْنَا فِيهَا آيَةً لِلَّذِينَ يَخَافُونَ الْعَذَابَ الْأَلِيمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَرَكْنَا فِيهَا" </quran>بَعْد إهْلَاك الْكَافِرِينَ <quran>"آيَة" </quran>عَلَامَة عَلَى إهْلَاكهمْ <quran>"لِلَّذِينَ يَخَافُونَ الْعَذَاب الْأَلِيم" </quran>فَلَا يَفْعَلُونَ مِثْل فِعْلهمْ</p></td></tr></table></body></html>
