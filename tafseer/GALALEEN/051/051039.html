<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَوَلَّى بِرُكْنِهِ وَقَالَ سَاحِرٌ أَوْ مَجْنُونٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَتَوَلَّى" </quran>أَعْرَضَ عَنْ الْإِيمَان <quran>"بِرُكْنِهِ" </quran>مَعَ جُنُوده لِأَنَّهُمْ لَهُ كَالرُّكْنِ <quran>"وَقَالَ" </quran>لِمُوسَى هُوَ <quran>"سَاحِر أَوْ مَجْنُون"</quran></p></td></tr></table></body></html>
