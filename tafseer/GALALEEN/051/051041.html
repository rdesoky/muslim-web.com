<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي عَادٍ إِذْ أَرْسَلْنَا عَلَيْهِمُ الرِّيحَ الْعَقِيمَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفِي" </quran>إهْلَاك <quran>"عَادٍ" </quran>آيَة <quran>"إذْ أَرْسَلْنَا عَلَيْهِمْ الرِّيح الْعَقِيم" </quran>هِيَ الَّتِي لَا خَيْر فِيهَا لِأَنَّهَا لَا تَحْمِل الْمَطَر وَلَا تُلَقِّح الشَّجَر وَهِيَ الدَّبُور</p></td></tr></table></body></html>
