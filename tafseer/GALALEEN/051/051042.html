<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا تَذَرُ مِنْ شَيْءٍ أَتَتْ عَلَيْهِ إِلَّا جَعَلَتْهُ كَالرَّمِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا تَذَر مِنْ شَيْء" </quran>نَفْس أَوْ مَال <quran>"أَتَتْ عَلَيْهِ إلَّا جَعَلَتْهُ كَالرَّمِيمِ" </quran>كَالْبَالِي الْمُتَفَتِّت -</p></td></tr></table></body></html>
