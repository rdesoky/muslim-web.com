<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَتَوْا عَنْ أَمْرِ رَبِّهِمْ فَأَخَذَتْهُمُ الصَّاعِقَةُ وَهُمْ يَنْظُرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَعَتَوْا" </quran>تَكَبَّرُوا <quran>"عَنْ أَمْر رَبّهمْ" </quran>أَيْ عَنْ امْتِثَاله <quran>"فَأَخَذَتْهُمْ الصَّاعِقَة" </quran>بَعْد مُضِيّ الثَّلَاثَة أَيَّام أَيْ الصَّيْحَة الْمُهْلِكَة <quran>"وَهُمْ يَنْظُرُونَ" </quran>أَيْ بِالنَّهَارِ</p></td></tr></table></body></html>
