<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا اسْتَطَاعُوا مِنْ قِيَامٍ وَمَا كَانُوا مُنْتَصِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا اسْتَطَاعُوا مِنْ قِيَام" </quran>أَيْ مَا قَدَرُوا عَلَى النُّهُوض حِين نُزُول الْعَذَاب <quran>"وَمَا كَانُوا مُنْتَصِرِينَ" </quran>عَلَى مَنْ أَهْلَكَهُمْ</p></td></tr></table></body></html>
