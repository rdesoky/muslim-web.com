<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالسَّمَاءَ بَنَيْنَاهَا بِأَيْدٍ وَإِنَّا لَمُوسِعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالسَّمَاء بَنَيْنَاهَا بِأَيْدٍ" </quran>بِقُوَّةٍ <quran>"وَإِنَّا لَمُوسِعُونَ" </quran>قَادِرُونَ يُقَال : آدَ الرَّجُل يَئِيد قَوِيَ وَأَوْسَعَ الرَّجُل : صَارَ ذَا سِعَة وَقُوَّة</p></td></tr></table></body></html>
