<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تَجْعَلُوا مَعَ اللَّهِ إِلَهًا آخَرَ إِنِّي لَكُمْ مِنْهُ نَذِيرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا تَجْعَلُوا مَعَ اللَّه إلَهًا آخَر إنِّي لَكُمْ مِنْهُ نَذِير مُبِين" </quran>يُقَدَّر قَبْل فَفِرُّوا قُلْ لَهُمْ</p></td></tr></table></body></html>
