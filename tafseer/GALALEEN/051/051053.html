<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتَوَاصَوْا بِهِ بَلْ هُمْ قَوْمٌ طَاغُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَتَوَاصَوْا بِهِ" </quran>كُلّهمْ اسْتِفْهَام بِمَعْنَى النَّفْي <quran>"بَلْ هُمْ قَوْم طَاغُونَ" </quran>جَمَعَهُمْ عَلَى هَذَا الْقَوْل طُغْيَانهمْ</p></td></tr></table></body></html>
