<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَوَلَّ عَنْهُمْ فَمَا أَنْتَ بِمَلُومٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَتَوَلَّ" </quran>أَعْرِضْ <quran>"عَنْهُمْ فَمَا أَنْتَ بِمَلُومٍ" </quran>لِأَنَّك بَلَّغْتهمْ الرِّسَالَة</p></td></tr></table></body></html>
