<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَذَكِّرْ فَإِنَّ الذِّكْرَى تَنْفَعُ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَذَكِّرْ" </quran>عِظْ بِالْقُرْآنِ <quran>"فَإِنَّ الذِّكْرَى تَنْفَع الْمُؤْمِنِينَ" </quran>مَنْ عَلِمَ اللَّه تَعَالَى أَنَّهُ يُؤْمِن</p></td></tr></table></body></html>
