<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَمَا أُرِيدُ أَنْ يُطْعِمُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا أُرِيد مِنْهُمْ مِنْ رِزْق" </quran>لِي وَلِأَنْفُسِهِمْ وَغَيْرهمْ <quran>"وَمَا أُرِيد أَنْ يُطْعِمُونِ" </quran>وَلَا أَنْفُسهمْ وَلَا غَيْرهمْ</p></td></tr></table></body></html>
