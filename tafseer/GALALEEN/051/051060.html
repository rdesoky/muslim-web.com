<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَيْلٌ لِلَّذِينَ كَفَرُوا مِنْ يَوْمِهِمُ الَّذِي يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَوَيْل" </quran>شِدَّة عَذَاب <quran>"لِلَّذِينَ كَفَرُوا مِنْ" </quran>فِي <quran>"يَوْمِهُمُ الَّذِي يُوعَدُونَ" </quran>أَيْ يَوْم الْقِيَامَة</p></td></tr></table></body></html>
