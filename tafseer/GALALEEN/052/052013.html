<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يُدَعُّونَ إِلَى نَارِ جَهَنَّمَ دَعًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم يُدَعُّونَ إلَى نَار جَهَنَّم دَعًّا" </quran>يُدْفَعُونَ بِعُنْفٍ بَدَل مِنْ يَوْم تَمُور وَيُقَال لَهُمْ تَبْكِيتًا : <quran>"هَذِهِ النَّار الَّتِي كُنْتُمْ بِهَا تُكَذِّبُونَ"</quran></p></td></tr></table></body></html>
