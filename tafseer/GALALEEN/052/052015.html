<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَسِحْرٌ هَذَا أَمْ أَنْتُمْ لَا تُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَسِحْر هَذَا" </quran>الْعَذَاب الَّذِي تَرَوْنَ كَمَا كُنْتُمْ تَقُولُونَ فِي الْوَحْي هَذَا سِحْر</p></td></tr></table></body></html>
