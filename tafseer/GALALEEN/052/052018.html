<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاكِهِينَ بِمَا آتَاهُمْ رَبُّهُمْ وَوَقَاهُمْ رَبُّهُمْ عَذَابَ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاكِهِينَ" </quran>مُتَلَذِّذِينَ <quran>"بِمَا" </quran>مَصْدَرِيَّة <quran>"آتَاهُمْ" </quran>أَعْطَاهُمْ <quran>"رَبّهمْ وَوَقَاهُمْ رَبّهمْ عَذَاب الْجَحِيم" </quran>عَطْفًا عَلَى آتَاهُمْ أَيْ بِإِتْيَانِهِمْ وَوِقَايَتهمْ وَيُقَال لَهُمْ :</p></td></tr></table></body></html>
