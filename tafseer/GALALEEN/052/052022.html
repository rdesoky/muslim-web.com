<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمْدَدْنَاهُمْ بِفَاكِهَةٍ وَلَحْمٍ مِمَّا يَشْتَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمْدَدْنَاهُمْ" </quran>زِدْنَاهُمْ فِي وَقْت بَعْد وَقْت <quran>"بِفَاكِهَةٍ وَلَحْم مِمَّا يَشْتَهُونَ" </quran>وَإِنْ لَمْ يُصَرِّحُوا بِطَلَبِهِ</p></td></tr></table></body></html>
