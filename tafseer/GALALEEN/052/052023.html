<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَتَنَازَعُونَ فِيهَا كَأْسًا لَا لَغْوٌ فِيهَا وَلَا تَأْثِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَتَنَازَعُونَ" </quran>يَتَعَاطَوْنَ بَيْنهمْ <quran>"فِيهَا" </quran>أَيْ الْجَنَّة <quran>"كَأْسًا" </quran>خَمْرًا <quran>"لَا لَغْو فِيهَا" </quran>أَيْ بِسَبَبِ شُرْبهَا يَقَع بَيْنهمْ <quran>"وَلَا تَأْثِيم" </quran>بِهِ يَلْحَقهُمْ بِخِلَافِ خَمْر الدُّنْيَا</p></td></tr></table></body></html>
