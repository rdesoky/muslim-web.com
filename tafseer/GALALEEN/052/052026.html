<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّا كُنَّا قَبْلُ فِي أَهْلِنَا مُشْفِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالُوا" </quran>إيمَاء إلَى عِلَّة الْوُصُول <quran>"إنَّا كُنَّا قَبْل فِي أَهْلنَا" </quran>فِي الدُّنْيَا <quran>"مُشْفِقِينَ" </quran>خَائِفِينَ مِنْ عَذَاب اللَّه</p></td></tr></table></body></html>
