<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَكِّرْ فَمَا أَنْتَ بِنِعْمَةِ رَبِّكَ بِكَاهِنٍ وَلَا مَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَذَكِّرْ" </quran>دُمْ عَلَى تَذْكِير الْمُشْرِكِينَ وَلَا تَرْجِع عَنْهُ لِقَوْلِهِمْ لَك كَاهِن مَجْنُون <quran>"فَمَا أَنْتَ بِنِعْمَةِ رَبّك" </quran>بِإِنْعَامِهِ عَلَيْك <quran>"بِكَاهِنٍ" </quran>خَبَر مَا <quran>"وَلَا مَجْنُون" </quran>مَعْطُوف عَلَيْهِ</p></td></tr></table></body></html>
