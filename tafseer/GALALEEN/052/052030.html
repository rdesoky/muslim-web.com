<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يَقُولُونَ شَاعِرٌ نَتَرَبَّصُ بِهِ رَيْبَ الْمَنُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ" </quran>بَلْ <quran>"يَقُولُونَ" </quran>هُوَ <quran>"شَاعِر نَتَرَبَّص بِهِ رَيْب الْمَنُون" </quran>حَوَادِث الدَّهْر فَيَهْلَك كَغَيْرِهِ مِنْ الشُّعَرَاء</p></td></tr></table></body></html>
