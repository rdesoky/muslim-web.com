<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ تَرَبَّصُوا فَإِنِّي مَعَكُمْ مِنَ الْمُتَرَبِّصِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ تَرَبَّصُوا" </quran>هَلَاكِي <quran>"فَإِنِّي مَعَكُمْ مِنَ الْمُتَرَبِّصِينَ" </quran>هَلَاككُمْ فَعُذِّبُوا بِالسَّيْفِ يَوْم بَدْر وَالتَّرَبُّص الِانْتِظَار</p></td></tr></table></body></html>
