<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلْيَأْتُوا بِحَدِيثٍ مِثْلِهِ إِنْ كَانُوا صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلْيَأْتُوا بِحَدِيثٍ" </quran>مُخْتَلَق <quran>"مِثْله إنْ كَانُوا صَادِقِينَ" </quran>فِي قَوْلهمْ</p></td></tr></table></body></html>
