<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ عِنْدَهُمْ خَزَائِنُ رَبِّكَ أَمْ هُمُ الْمُسَيْطِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ عِنْدهمْ خَزَائِن رَبّك" </quran>مِنْ النُّبُوَّة وَالرِّزْق وَغَيْرهمَا فَيَخُصُّوا مَنْ شَاءُوا بِمَا شَاءُوا <quran>"أَمْ هُمُ الْمُسَيْطِرُونَ" </quran>الْمُتَسَلِّطُونَ الْجَبَّارُونَ وَفِعْله سَيْطَرَ وَمِثْله بَيْطَرَ وَبَيْقَرَ</p></td></tr></table></body></html>
