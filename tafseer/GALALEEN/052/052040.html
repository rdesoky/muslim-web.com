<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ تَسْأَلُهُمْ أَجْرًا فَهُمْ مِنْ مَغْرَمٍ مُثْقَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ تَسْأَلهُمْ أَجْرًا" </quran>عَلَى مَا جِئْتُمْ بِهِ مِنْ الدِّين <quran>"فَهُمْ مِنْ مَغْرَم" </quran>غُرْم ذَلِكَ <quran>"مُثْقَلُونَ" </quran>فَلَا يُسْلِمُونَ</p></td></tr></table></body></html>
