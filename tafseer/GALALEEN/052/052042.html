<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يُرِيدُونَ كَيْدًا فَالَّذِينَ كَفَرُوا هُمُ الْمَكِيدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ يُرِيدُونَ كَيْدًا" </quran>بِك لِيُهْلِكُوك فِي دَار النَّدْوَة <quran>"فَاَلَّذِينَ كَفَرُوا هُمُ الْمَكِيدُونَ" </quran>الْمَغْلُوبُونَ الْمُهْلَكُونَ فَحَفِظَهُ اللَّه مِنْهُمْ ثُمَّ أَهْلَكَهُمْ بِبَدْرٍ</p></td></tr></table></body></html>
