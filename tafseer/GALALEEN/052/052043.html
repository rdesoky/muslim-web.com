<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَهُمْ إِلَهٌ غَيْرُ اللَّهِ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ لَهُمْ إلَه غَيْر اللَّه سُبْحَان اللَّه عَمَّا يُشْرِكُونَ" </quran>بِهِ مِنْ الْآلِهَة وَالِاسْتِفْهَام بِأَمْ فِي مَوَاضِعهَا لِلتَّقْبِيحِ وَالتَّوْبِيخ</p></td></tr></table></body></html>
