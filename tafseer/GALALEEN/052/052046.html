<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ لَا يُغْنِي عَنْهُمْ كَيْدُهُمْ شَيْئًا وَلَا هُمْ يُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم لَا يُغْنِي" </quran>بَدَل مِنْ يَوْمَهُمُ <quran>"عَنْهُمْ كَيْدهمْ شَيْئًا وَلَا هُمْ يُنْصَرُونَ" </quran>يُمْنَعُونَ مِنْ الْعَذَاب فِي الْآخِرَة</p></td></tr></table></body></html>
