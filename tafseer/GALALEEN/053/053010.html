<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَوْحَى إِلَى عَبْدِهِ مَا أَوْحَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَوْحَى" </quran>تَعَالَى <quran>"إلَى عَبْده" </quran>جِبْرِيل <quran>"مَا أَوْحَى" </quran>جِبْرِيل إلَى النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَلَمْ يَذْكُر الْمُوحَى تَفْخِيمًا لِشَأْنِهِ</p></td></tr></table></body></html>
