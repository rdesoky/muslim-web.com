<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا كَذَبَ الْفُؤَادُ مَا رَأَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا كَذَبَ" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد أَنْكَرَ <quran>"الْفُؤَاد" </quran>فُؤَاد النَّبِيّ <quran>"مَا رَأَى" </quran>بِبَصَرِهِ مِنْ صُورَة جِبْرِيل</p></td></tr></table></body></html>
