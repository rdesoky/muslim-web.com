<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَتُمَارُونَهُ عَلَى مَا يَرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَتُمَارُونَهُ" </quran>تُجَادِلُونَهُ وَتَغْلِبُونَهُ <quran>"عَلَى مَا يَرَى" </quran>خِطَاب لِلْمُشْرِكِينَ الْمُنْكِرِينَ رُؤْيَة النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ لِجِبْرِيل</p></td></tr></table></body></html>
