<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عِنْدَ سِدْرَةِ الْمُنْتَهَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"عِنْد سِدْرَة الْمُنْتَهَى" </quran>لَمَّا أُسْرِيَ بِهِ فِي السَّمَاوَات وَهِيَ شَجَرَة نَبْق عَنْ يَمِين الْعَرْش لَا يَتَجَاوَزهَا أَحَد مِنْ الْمَلَائِكَة وَغَيْرهمْ</p></td></tr></table></body></html>
