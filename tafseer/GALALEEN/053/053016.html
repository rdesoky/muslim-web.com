<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ يَغْشَى السِّدْرَةَ مَا يَغْشَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذْ" </quran>حِين وَإِذْ مَعْمُولَة لِرَآهُ <quran>"يَغْشَى السِّدْرَة مَا يَغْشَى" </quran>مِنْ طَيْر وَغَيْره</p></td></tr></table></body></html>
