<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا زَاغَ الْبَصَرُ وَمَا طَغَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا زَاغَ الْبَصَر" </quran>مِنْ النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَمَا طَغَى" </quran>أَيْ مَا مَالَ بَصَره عَنْ مَرْئِيّه الْمَقْصُود لَهُ وَلَا جَاوَزَهُ تِلْكَ اللَّيْلَة</p></td></tr></table></body></html>
