<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لِلْإِنْسَانِ مَا تَمَنَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ لِلْإِنْسَانِ" </quran>أَيْ لِكُلِّ إنْسَان مِنْهُمْ <quran>"مَا تَمَنَّى" </quran>مِنْ أَنَّ الْأَصْنَام تَشْفَع لَهُمْ ؟ لَيْسَ الْأَمْر كَذَلِكَ</p></td></tr></table></body></html>
