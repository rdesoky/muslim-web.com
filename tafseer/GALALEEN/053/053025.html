<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلِلَّهِ الْآخِرَةُ وَالْأُولَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلِلَّهِ الْآخِرَة وَالْأُولَى" </quran>أَيْ الدُّنْيَا فَلَا يَقَع فِيهِمَا إلَّا مَا يُرِيدهُ تَعَالَى</p></td></tr></table></body></html>
