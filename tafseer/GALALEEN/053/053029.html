<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَعْرِضْ عَنْ مَنْ تَوَلَّى عَنْ ذِكْرِنَا وَلَمْ يُرِدْ إِلَّا الْحَيَاةَ الدُّنْيَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَعْرِضْ عَمَّنْ تَوَلَّى عَنْ ذِكْرنَا" </quran>أَيْ الْقُرْآن <quran>"وَلَمْ يُرِدْ إلَّا الْحَيَاة الدُّنْيَا" </quran>وَهَذَا قَبْل الْأَمْر بِالْجِهَادِ</p></td></tr></table></body></html>
