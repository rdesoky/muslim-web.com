<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتَ الَّذِي تَوَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَفَرَأَيْت الَّذِي تَوَلَّى" </quran>عَنْ الْإِيمَان ارْتَدَّ لَمَّا عُيِّرَ بِهِ وَقَالَ إنِّي خَشِيت عِقَاب اللَّه فَضَمِنَ لَهُ الْمُعِير لَهُ أَنْ يَحْمِل عَنْهُ عَذَاب اللَّه إنْ رَجَعَ إلَى شِرْكه وَأَعْطَاهُ مِنْ مَاله كَذَا فَرَجَعَ</p></td></tr></table></body></html>
