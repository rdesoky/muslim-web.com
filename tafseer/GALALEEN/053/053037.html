<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِبْرَاهِيمَ الَّذِي وَفَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"و" </quran>صُحُف <quran>"إبْرَاهِيم الَّذِي وَفَّى" </quran>تَمَّمَ مَا أُمِرَ بِهِ نَحْو <quran>"وَإِذِ ابْتَلَى إبْرَاهِيم رَبّه بِكَلِمَاتٍ فَأَتَمّهنَّ" </quran>وَبَيَان مَا</p></td></tr></table></body></html>
