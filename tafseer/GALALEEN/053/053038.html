<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَّا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَ" </quran>أَنْ <quran>"لَا تَزِر وَازِرَة وِزْر أُخْرَى" </quran>إلَخْ وَأَنْ مُخَفَّفَة مِنْ الثَّقِيلَة أَيْ لَا تَحْمِل نَفْس ذَنْب غَيْرهَا</p></td></tr></table></body></html>
