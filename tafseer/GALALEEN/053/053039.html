<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْ لَيْسَ لِلْإِنْسَانِ إِلَّا مَا سَعَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنْ" </quran>أَيْ أَنَّهُ <quran>"لَيْسَ لِلْإِنْسَانِ إلَّا مَا سَعَى" </quran>مِنْ خَيْر فَلَيْسَ لَهُ مِنْ سَعْي غَيْره الْخَيْر شَيْء</p></td></tr></table></body></html>
