<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يُجْزَاهُ الْجَزَاءَ الْأَوْفَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ يُجْزَاهُ الْجَزَاء الْأَوْفَى" </quran>الْأَكْمَل يُقَال : جَزَيْته سَعْيه وَبِسَعْيِهِ</p></td></tr></table></body></html>
