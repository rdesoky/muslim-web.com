<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ عَلَيْهِ النَّشْأَةَ الْأُخْرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّ عَلَيْهِ النَّشْأَة" </quran>بِالْمَدِّ وَالْقَصْر <quran>"الْأُخْرَى" </quran>الْخَلْقَة الْأُخْرَى لِلْبَعْثِ بَعْد الْخَلْقَة الْأُولَى</p></td></tr></table></body></html>
