<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ هُوَ أَغْنَى وَأَقْنَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّهُ هُوَ أَغْنَى" </quran>النَّاس بِالْكِفَايَةِ بِالْأَمْوَالِ <quran>"وَأَقْنَى" </quran>أَعْطَى الْمَال الْمُتَّخَذ قِنْيَة</p></td></tr></table></body></html>
