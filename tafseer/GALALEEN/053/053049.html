<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ هُوَ رَبُّ الشِّعْرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّهُ هُوَ رَبّ الشِّعْرَى" </quran>هُوَ كَوْكَب خَلْف الْجَوْزَاء كَانَتْ تُعْبَد فِي الْجَاهِلِيَّة</p></td></tr></table></body></html>
