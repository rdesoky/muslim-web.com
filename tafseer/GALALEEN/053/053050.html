<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ أَهْلَكَ عَادًا الْأُولَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّهُ أَهْلَكَ عَادًا الْأُولَى" </quran>وَفِي قِرَاءَة بِإِدْغَامِ التَّنْوِين فِي اللَّام وَضَمّهَا بِلَا هَمْزَة وَهِيَ قَوْم عَادٍ وَالْأُخْرَى قَوْم صَالِح</p></td></tr></table></body></html>
