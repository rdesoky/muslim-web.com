<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْمُؤْتَفِكَةَ أَهْوَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالْمُؤْتَفِكَة" </quran>وَهِيَ قُرَى قَوْم لُوط <quran>"أَهْوَى" </quran>أَسْقَطَهَا بَعْد رَفْعهَا إلَى السَّمَاء مَقْلُوبَة إلَى الْأَرْض بِأَمْرِهِ جِبْرِيل بِذَلِكَ</p></td></tr></table></body></html>
