<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَغَشَّاهَا مَا غَشَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَغَشَّاهَا" </quran>مِنْ الْحِجَارَة بَعْد ذَلِكَ <quran>"مَا غَشَّى" </quran>أُبْهِمَ تَهْوِيلًا وَفِي هُود : <quran>"جَعَلْنَا عَالِيهَا سَافِلهَا وَأَمْطَرْنَا عَلَيْهَا حِجَارَة مِنْ سِجِّيل"</quran></p></td></tr></table></body></html>
