<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبِأَيِّ آلَاءِ رَبِّكَ تَتَمَارَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَبِأَيِّ آلَاء رَبّك" </quran>أَنْعُمه الدَّالَّة عَلَى وَحْدَانِيّته وَقُدْرَته <quran>"تَتَمَارَى" </quran>تَتَشَكَّك أَيّهَا الْإِنْسَان أَوْ تَكْذِب</p></td></tr></table></body></html>
