<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَيْسَ لَهَا مِنْ دُونِ اللَّهِ كَاشِفَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَيْسَ لَهَا مِنْ دُون اللَّه" </quran>نَفْس <quran>"كَاشِفَة" </quran>أَيْ لَا يَكْشِفهَا وَيُظْهِرهَا إلَّا هُوَ كَقَوْلِهِ <quran>"لَا يُجَلِّيهَا لِوَقْتِهَا إلَّا هُوَ"</quran></p></td></tr></table></body></html>
