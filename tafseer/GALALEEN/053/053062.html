<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْجُدُوا لِلَّهِ وَاعْبُدُوا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاسْجُدُوا لِلَّهِ" </quran>الَّذِي خَلَقَكُمْ <quran>"وَاعْبُدُوا" </quran>وَلَا تَسْجُدُوا لِلْأَصْنَامِ وَلَا تَعْبُدُوهَا</p></td></tr></table></body></html>
