<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُهْطِعِينَ إِلَى الدَّاعِي يَقُولُ الْكَافِرُونَ هَذَا يَوْمٌ عَسِرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مُهْطِعِينَ" </quran>مُسْرِعِينَ مَادِّينِ أَعْنَاقهمْ <quran>"إلَى الدَّاعِ يَقُول الْكَافِرُونَ" </quran>مِنْهُمْ <quran>"هَذَا يَوْم عَسِر" </quran>صَعْب عَلَى الْكَافِرِينَ كَمَا فِي الْمُدَّثِّر <quran>"يَوْم عَسِير عَلَى الْكَافِرِينَ"</quran></p></td></tr></table></body></html>
