<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ فَكَذَّبُوا عَبْدَنَا وَقَالُوا مَجْنُونٌ وَازْدُجِرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَتْ قَبْلهمْ" </quran>قَبْل قُرَيْش <quran>"قَوْم نُوح" </quran>وَتَأْنِيث الْفِعْل كَذَّبَتْ لِمَعْنَى قَوْم <quran>"فَكَذَّبُوا عَبْدنَا" </quran>نُوحًا <quran>"وَقَالُوا مَجْنُون وَازْدُجِرَ" </quran>انْتَهَرُوهُ بِالسَّبِّ وَغَيْره</p></td></tr></table></body></html>
