<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَفَتَحْنَا أَبْوَابَ السَّمَاءِ بِمَاءٍ مُنْهَمِرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَفَتَحْنَا" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>"أَبْوَاب السَّمَاء بِمَاءٍ مُنْهَمِر" </quran>مُنْصَبّ انْصِبَابًا شَدِيدًا</p></td></tr></table></body></html>
