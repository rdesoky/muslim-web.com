<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَجَّرْنَا الْأَرْضَ عُيُونًا فَالْتَقَى الْمَاءُ عَلَى أَمْرٍ قَدْ قُدِرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفَجَّرْنَا الْأَرْض عُيُونًا" </quran>تَنْبُع <quran>"فَالْتَقَى الْمَاء" </quran>مَاء السَّمَاء وَالْأَرْض <quran>"عَلَى أَمْر" </quran>حَال <quran>"قَدْ قُدِرَ" </quran>قُضِيَ بِهِ فِي الْأَزَل وَهُوَ هَلَاكهمْ غَرَقًا</p></td></tr></table></body></html>
