<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحَمَلْنَاهُ عَلَى ذَاتِ أَلْوَاحٍ وَدُسُرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحَمَلْنَاهُ" </quran>أَيْ نُوحًا <quran>"عَلَى" </quran>سَفِينَة <quran>"ذَات أَلْوَاح وَدُسُر" </quran>وَهُوَ مَا تُشَدّ بِهِ الْأَلْوَاح مِنْ الْمَسَامِير وَغَيْرهَا وَأَحَدهَا دِسَار كَكِتَابٍ</p></td></tr></table></body></html>
