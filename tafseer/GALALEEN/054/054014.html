<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَجْرِي بِأَعْيُنِنَا جَزَاءً لِمَنْ كَانَ كُفِرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"تَجْرِي بِأَعْيُنِنَا" </quran>بِمَرْأَى مِنَّا أَيْ مَحْفُوظَة <quran>"جَزَاء" </quran>مَنْصُوب بِفِعْلٍ مُقَدَّر أَيْ أُغْرِقُوا انْتِصَارًا <quran>"لِمَنْ كَانَ كُفِرَ" </quran>وَهُوَ نُوح عَلَيْهِ السَّلَام وَقُرِئَ كَفَرَ بِالْبِنَاءِ لِلْفَاعِلِ أَيْ أُغْرِقُوا عِقَابًا لَهُمْ</p></td></tr></table></body></html>
