<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ ثَمُودُ بِالنُّذُرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبَتْ ثَمُود بِالنُّذُرِ" </quran>جَمْع نَذِير بِمَعْنَى مُنْذِر أَيْ بِالْأُمُورِ الَّتِي أَنْذَرَهُمْ بِهَا نَبِيّهمْ صَالِح إنْ لَمْ يُؤْمِنُوا بِهِ وَيَتَّبِعُوهُ</p></td></tr></table></body></html>
