<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَنَادَوْا صَاحِبَهُمْ فَتَعَاطَى فَعَقَرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَنَادَوْا صَاحِبهمْ" </quran>قِدَارًا لِيَقْتُلهَا <quran>"فَتَعَاطَى" </quran>تَنَاوَلَ السَّيْف <quran>"فَعَقَرَ" </quran>بِهِ النَّاقَة أَيْ قَتَلَهَا مُوَافَقَة لَهُمْ</p></td></tr></table></body></html>
