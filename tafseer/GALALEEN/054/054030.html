<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكَيْفَ كَانَ عَذَابِي وَنُذُر" </quran>إنْذَارِي لَهُمْ بِالْعَذَابِ قَبْل نُزُوله أَيْ وَقَعَ مَوْقِعه وَبَيَّنَهُ تَعَالَى فِي الْآيَة التَّالِيَة</p></td></tr></table></body></html>
