<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَنْذَرَهُمْ بَطْشَتَنَا فَتَمَارَوْا بِالنُّذُرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ أَنْذَرَهُمْ" </quran>خَوَّفَهُمْ لُوط <quran>"بَطْشَتنَا" </quran>أَخْذَتنَا إيَّاهُمْ بِالْعَذَابِ <quran>"فَتَمَارَوْا" </quran>تَجَادَلُوا وَكَذَّبُوا <quran>"بِالنُّذُرِ" </quran>بِإِنْذَارِهِ</p></td></tr></table></body></html>
