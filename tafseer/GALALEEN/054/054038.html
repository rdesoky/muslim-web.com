<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ صَبَّحَهُمْ بُكْرَةً عَذَابٌ مُسْتَقِرٌّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ صَبَّحَهُمْ بُكْرَة" </quran>وَقْت الصُّبْح مِنْ يَوْم غَيْر مُعَيَّن <quran>"عَذَاب مُسْتَقِرّ" </quran>دَائِم مُتَّصِل بِعَذَابِ الْآخِرَة</p></td></tr></table></body></html>
