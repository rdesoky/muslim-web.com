<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ جَاءَ آلَ فِرْعَوْنَ النُّذُرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ جَاءَ آل فِرْعَوْن" </quran>قَوْمه مَعَهُ <quran>"النُّذُر" </quran>الْإِنْذَار عَلَى لِسَان مُوسَى وَهَارُون فَلَمْ يُؤْمِنُوا</p></td></tr></table></body></html>
