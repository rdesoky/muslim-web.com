<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبُوا بِآيَاتِنَا كُلِّهَا فَأَخَذْنَاهُمْ أَخْذَ عَزِيزٍ مُقْتَدِرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَذَّبُوا بِآيَاتِنَا كُلّهَا" </quran>التِّسْع الَّتِي أُوتِيَهَا مُوسَى <quran>"فَأَخَذْنَاهُمْ" </quran>بِالْعَذَابِ <quran>"أَخْذ عَزِيز" </quran>قَوِيّ <quran>"مُقْتَدِر" </quran>قَادِر لَا يُعْجِزهُ شَيْء</p></td></tr></table></body></html>
