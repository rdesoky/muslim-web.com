<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يَقُولُونَ نَحْنُ جَمِيعٌ مُنْتَصِرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ يَقُولُونَ" </quran>أَيْ كُفَّار قُرَيْش <quran>"نَحْنُ جَمِيع" </quran>جَمْع <quran>"مُنْتَصِر" </quran>عَلَى مُحَمَّد</p></td></tr></table></body></html>
