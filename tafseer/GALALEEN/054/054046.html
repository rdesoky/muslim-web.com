<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلِ السَّاعَةُ مَوْعِدُهُمْ وَالسَّاعَةُ أَدْهَى وَأَمَرُّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلِ السَّاعَةُ مَوْعِدُهُمْ" </quran>بِالْعَذَابِ <quran>"وَالسَّاعَة" </quran>أَيْ عَذَابهَا <quran>"أَدْهَى" </quran>أَعْظَم بَلِيَّة <quran>"وَأَمَرّ" </quran>أَشَدّ مَرَارَة مِنْ عَذَاب الدُّنْيَا</p></td></tr></table></body></html>
