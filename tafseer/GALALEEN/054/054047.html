<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُجْرِمِينَ فِي ضَلَالٍ وَسُعُرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الْمُجْرِمِينَ فِي ضَلَال" </quran>هَلَاك بِالْقَتْلِ فِي الدُّنْيَا <quran>"وَسُعُر" </quran>نَار مُسَعَّرَة بِالتَّشْدِيدِ أَيْ مُهَيَّجَة فِي الْآخِرَة</p></td></tr></table></body></html>
