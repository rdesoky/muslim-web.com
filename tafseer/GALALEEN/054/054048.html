<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يُسْحَبُونَ فِي النَّارِ عَلَى وُجُوهِهِمْ ذُوقُوا مَسَّ سَقَرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْم يُسْحَبُونَ فِي النَّار عَلَى وُجُوههمْ" </quran>فِي الْآخِرَة وَيُقَال لَهُمْ <quran>"ذُوقُوا مَسَّ سَقَر" </quran>إصَابَة جَهَنَّم لَكُمْ</p></td></tr></table></body></html>
