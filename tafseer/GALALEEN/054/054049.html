<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا كُلّ شَيْء" </quran>مَنْصُوب بِفِعْلٍ يُفَسِّرهُ <quran>"خَلَقْنَاهُ" </quran>وَقُرِئَ كُلّ بِالرَّفْعِ مُبْتَدَأ خَبَره خَلَقْنَاهُ <quran>"خَلَقْنَاهُ بِقَدَرٍ" </quran>بِتَقْدِيرِ حَال مِنْ كُلّ أَيْ مُقَدَّرًا</p></td></tr></table></body></html>
