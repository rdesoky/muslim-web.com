<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُّ صَغِيرٍ وَكَبِيرٍ مُسْتَطَرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَكُلّ صَغِير وَكَبِير" </quran>مِنْ الذَّنْب أَوْ الْعَمَل <quran>"مُسْتَطَر" </quran>مَكْتُوب فِي اللَّوْح الْمَحْفُوظ</p></td></tr></table></body></html>
