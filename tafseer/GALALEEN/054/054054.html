<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَهَرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الْمُتَّقِينَ فِي جَنَّات" </quran>بَسَاتِين <quran>"وَنَهَر" </quran>أُرِيدَ بِهِ الْجِنْس وَقُرِئَ بِضَمِّ النُّون وَالْهَاء جَمْعًا كَأَسَدِ وَأُسْد وَالْمَعْنَى أَنَّهُمْ يَشْرَبُونَ مِنْ أَنَهَارهَا الْمَاء وَاللَّبَن وَالْعَسَل وَالْخَمْر</p></td></tr></table></body></html>
