<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالنَّجْم" </quran>مَا لَا سَاقَ لَهُ مِنْ النَّبَات <quran>"وَالشَّجَر" </quran>مَا لَهُ سَاق <quran>"يَسْجُدَانِ" </quran>يَخْضَعَانِ لِمَا يُرَاد مِنْهُمَا</p></td></tr></table></body></html>
