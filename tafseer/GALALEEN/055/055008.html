<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَّا تَطْغَوْا فِي الْمِيزَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَّا تَطْغَوْا" </quran>أَيْ لِأَجْلِ أَنْ لَا تَجُورُوا <quran>"فِي الْمِيزَان" </quran>مَا يُوزَن بِهِ</p></td></tr></table></body></html>
