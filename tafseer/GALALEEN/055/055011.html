<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا فَاكِهَةٌ وَالنَّخْلُ ذَاتُ الْأَكْمَامِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فِيهَا فَاكِهَة وَالنَّخْل" </quran>الْمَعْهُود <quran>"ذَات الْأَكْمَام" </quran>أَوْعِيَة طَلْعهَا</p></td></tr></table></body></html>
