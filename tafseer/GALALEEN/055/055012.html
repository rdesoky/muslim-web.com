<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالْحَبّ" </quran>كَالْحِنْطَةِ وَالشَّعِير <quran>"ذُو الْعَصْف" </quran>التِّبْن <quran>"وَالرَّيْحَان" </quran>الْوَرَق الْمَشْمُوم</p></td></tr></table></body></html>
