<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ الْإِنْسَانَ مِنْ صَلْصَالٍ كَالْفَخَّارِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَلَقَ الْإِنْسَان" </quran>آدَم <quran>"مِنْ صَلْصَال" </quran>طِين يَابِس يُسْمَع لَهُ صَلْصَلَة أَيْ صَوْت إذَا نُقِرَ <quran>"كَالْفَخَّارِ" </quran>وَهُوَ مَا طُبِخَ مِنْ طِين</p></td></tr></table></body></html>
