<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَخَلَقَ الْجَانَّ مِنْ مَارِجٍ مِنْ نَارٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَخَلَقَ الْجَانّ" </quran>أَبَا الْجِنّ وَهُوَ إبْلِيس <quran>"مِنْ مَارِج مِنْ نَار" </quran>هُوَ لَهَبهَا الْخَالِص مِنْ الدُّخَان</p></td></tr></table></body></html>
