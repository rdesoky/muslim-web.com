<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"رَبّ الْمَشْرِقَيْنِ" </quran>مَشْرِق الشِّتَاء وَمَشْرِق الصَّيْف <quran>"وَرَبّ الْمَغْرِبَيْنِ" </quran>مَغْرِب الصَّيْف وَمَغْرِب الشِّتَاء</p></td></tr></table></body></html>
