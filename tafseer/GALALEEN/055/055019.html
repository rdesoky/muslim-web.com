<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَرَجَ الْبَحْرَيْنِ يَلْتَقِيَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَرَجَ" </quran>أَرْسَلَ <quran>"الْبَحْرَيْنِ" </quran>الْعَذْب وَالْمِلْح <quran>"يَلْتَقِيَانِ" </quran>فِي رَأْي الْعَيْن</p></td></tr></table></body></html>
