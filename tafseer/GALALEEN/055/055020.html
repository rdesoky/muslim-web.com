<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَيْنَهُمَا بَرْزَخٌ لَا يَبْغِيَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَيْنهمَا بَرْزَخ" </quran>حَاجِز مِنْ قُدْرَته تَعَالَى <quran>"لَا يَبْغِيَانِ" </quran>لَا يَبْغِي وَاحِد مِنْهُمَا عَلَى الْآخَر فَيَخْتَلِط بِهِ</p></td></tr></table></body></html>
