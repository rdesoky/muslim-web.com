<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهُ الْجَوَارِي الْمُنْشَآتُ فِي الْبَحْرِ كَالْأَعْلَامِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَهُ الْجَوَار" </quran>السُّفُن <quran>"الْمُنْشَآت" </quran>الْمُحْدَثَات <quran>"فِي الْبَحْر كَالْأَعْلَامِ" </quran>كَالْجِبَالِ عِظَمًا وَارْتِفَاعًا</p></td></tr></table></body></html>
