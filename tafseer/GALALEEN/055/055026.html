<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُّ مَنْ عَلَيْهَا فَانٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كُلّ مَنْ عَلَيْهَا" </quran>أَيْ الْأَرْض مِنْ الْحَيَوَان <quran>"فَانٍ" </quran>هَالِك وَعَبَّرَ بِمَنْ تَغْلِيبًا لِلْعُقَلَاءِ</p></td></tr></table></body></html>
