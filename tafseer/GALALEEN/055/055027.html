<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَبْقَى وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيَبْقَى وَجْه رَبّك" </quran>ذَاته <quran>"ذُو الْجَلَال" </quran>الْعَظَمَة <quran>"وَالْإِكْرَام" </quran>لِلْمُؤْمِنِينَ بِأَنْعُمِهِ عَلَيْهِمْ</p></td></tr></table></body></html>
