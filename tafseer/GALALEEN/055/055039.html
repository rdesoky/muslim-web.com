<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَيَوْمَئِذٍ لَا يُسْأَلُ عَنْ ذَنْبِهِ إِنْسٌ وَلَا جَانٌّ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَيَوْمئِذٍ لَا يُسْأَل عَنْ ذَنْبه إنْس وَلَا جَانّ" </quran>عَنْ ذَنْبه وَيُسْأَلُونَ فِي وَقْت آخَر <quran>"فَوَرَبِّك لَنَسْأَلَنَّهُمْ أَجْمَعِينَ" </quran>وَالْجَانّ هُنَا وَفِيمَا سَيَأْتِي بِمَعْنَى الْجِنّ وَالْإِنْس فِيهِمَا بِمَعْنَى الْإِنْسِيّ</p></td></tr></table></body></html>
