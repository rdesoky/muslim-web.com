<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَطُوفُونَ بَيْنَهَا وَبَيْنَ حَمِيمٍ آنٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَطُوفُونَ" </quran>يَسْعَوْنَ <quran>"بَيْنهَا وَبَيْن حَمِيم" </quran>مَاء حَارّ <quran>"آنٍ" </quran>شَدِيد الْحَرَارَة يُسْقَوْنَهُ إذَا اسْتَغَاثُوا مِنْ حَرّ النَّار وَهُوَ مَنْقُوص كَقَاضٍ</p></td></tr></table></body></html>
