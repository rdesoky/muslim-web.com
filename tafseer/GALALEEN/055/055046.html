<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلِمَنْ خَافَ" </quran>أَيْ لِكُلٍّ مِنْهُمْ أَوْ لِمَجْمُوعِهِمْ <quran>"مَقَام رَبّه" </quran>قِيَامه بَيْن يَدَيْهِ لِلْحِسَابِ فَتَرَكَ مَعْصِيَته</p></td></tr></table></body></html>
