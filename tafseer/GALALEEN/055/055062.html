<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنْ دُونِهِمَا جَنَّتَانِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمِنْ دُونهمَا" </quran>مِنْ دُون الْجَنَّتَيْنِ الْمَذْكُورَتَيْنِ <quran>"جَنَّتَانِ" </quran>أَيْضًا لِمَنْ خَافَ مَقَام رَبّه</p></td></tr></table></body></html>
