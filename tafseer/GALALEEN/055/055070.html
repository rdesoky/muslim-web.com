<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهِنَّ خَيْرَاتٌ حِسَانٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فِيهِنَّ" </quran>أَيْ الْجَنَّتَيْنِ وَمَا فِيهِمَا <quran>"خَيْرَات" </quran>أَخَلَاقهَا خَيِّرَة <quran>"حِسَان" </quran>حَسَنَة الْوُجُوه</p></td></tr></table></body></html>
