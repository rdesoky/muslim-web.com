<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُتَّكِئِينَ عَلَى رَفْرَفٍ خُضْرٍ وَعَبْقَرِيٍّ حِسَانٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مُتَّكِئِينَ" </quran>أَيْ أَزْوَاجهمْ وَإِعْرَابه كَمَا تَقَدَّمَ <quran>"عَلَى رَفْرَف خُضْر" </quran>جَمْع رَفْرَفَة أَيْ بُسُط أَوْ وَسَائِد <quran>"وَعَبْقَرِيّ حِسَان" </quran>جَمْع عَبْقَرِيَّة أَيْ طَنَافِس</p></td></tr></table></body></html>
