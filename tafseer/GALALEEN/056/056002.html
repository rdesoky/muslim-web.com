<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَيْسَ لِوَقْعَتِهَا كَاذِبَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَيْسَ لِوَقْعَتِهَا كَاذِبَة" </quran>نَفْس تَكْذِب بِأَنْ تَنْفِيهَا كَمَا نَفَتْهَا فِي الدُّنْيَا</p></td></tr></table></body></html>
