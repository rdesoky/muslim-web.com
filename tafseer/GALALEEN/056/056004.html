<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا رُجَّتِ الْأَرْضُ رَجًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذَا رُجَّتْ الْأَرْض رَجًّا" </quran>حُرِّكَتْ حَرَكَة شَدِيدَة وَإِذَا هَذِهِ بَدَل مِنْ الْأُولَى</p></td></tr></table></body></html>
