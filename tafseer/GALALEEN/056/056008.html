<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَصْحَابُ الْمَيْمَنَةِ مَا أَصْحَابُ الْمَيْمَنَةِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَأَصْحَاب الْمَيْمَنَة" </quran>وَهُمْ الَّذِينَ يُؤْتُونَ كُتُبهمْ بِأَيْمَانِهِمْ مُبْتَدَأ خَبَره <quran>"مَا أَصْحَاب الْمَيْمَنَة" </quran>تَعْظِيم لِشَأْنِهِمْ بِدُخُولِهِمْ الْجَنَّة</p></td></tr></table></body></html>
