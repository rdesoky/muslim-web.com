<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالسَّابِقُونَ السَّابِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالسَّابِقُونَ" </quran>إلَى الْخَيْر وَهُمْ الْأَنْبِيَاء مُبْتَدَأ <quran>"السَّابِقُونَ" </quran>تَأْكِيد لِتَعْظِيمِ شَأْنهمْ</p></td></tr></table></body></html>
