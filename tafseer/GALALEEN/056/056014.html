<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَلِيلٌ مِنَ الْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَلِيل مِنْ الْآخِرِينَ" </quran>مِنْ أُمَّة مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَهُمْ السَّابِقُونَ مِنْ الْأُمَم الْمَاضِيَة وَهَذِهِ الْأُمَّة وَالْخَبَر</p></td></tr></table></body></html>
