<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بِأَكْوَابٍ وَأَبَارِيقَ وَكَأْسٍ مِنْ مَعِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بِأَكْوَابٍ" </quran>أَقْدَاح لَا عُرَا لَهَا <quran>"وَأَبَارِيق" </quran>لَهَا عُرَا وَخَرَاطِيم <quran>"وَكَأْس" </quran>إنَاء شُرْب الْخَمْر <quran>"مِنْ مَعِين" </quran>أَيْ خَمْر جَارِيَة مِنْ مَنْبَع لَا يَنْقَطِع أَبَدًا</p></td></tr></table></body></html>
