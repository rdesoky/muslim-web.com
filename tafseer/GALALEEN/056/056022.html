<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحُورٌ عِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَحُور" </quran>نِسَاء شَدِيدَات سَوَاد الْعُيُون وَبَيَاضهَا <quran>"عِين" </quran>ضِخَام الْعُيُون كُسِرَتْ عَيْنه بَدَل ضَمّهَا لِمُجَانَسَةِ الْيَاء وَمُفْرَده عَيْنَاء كَحَمْرَاء وَفِي قِرَاءَة بِجَرِّ حُور عِين</p></td></tr></table></body></html>
