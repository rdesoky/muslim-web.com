<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا تَأْثِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَسْمَعُونَ فِيهَا" </quran>فِي الْجَنَّة <quran>"لَغْوًا" </quran>فَاحِشًا مِنْ الْكَلَام <quran>"وَلَا تَأْثِيمًا" </quran>مَا يُؤْثِم</p></td></tr></table></body></html>
