<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عُرُبًا أَتْرَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"عُرُبًا" </quran>بِضَمِّ الرَّاء وَسُكُونهَا جَمْع عُرُوب وَهِيَ الْمُتَحَبِّبَة إلَى زَوْجهَا عِشْقًا لَهُ <quran>"أَتْرَابًا" </quran>جَمْع تِرْب أَيْ مُسْتَوِيَات فِي السِّنّ</p></td></tr></table></body></html>
