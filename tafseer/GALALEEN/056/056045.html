<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ كَانُوا قَبْلَ ذَلِكَ مُتْرَفِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُمْ كَانُوا قَبْل ذَلِك" </quran>فِي الدُّنْيَا <quran>"مُتْرَفِينَ" </quran>مُنَعَّمِينَ لَا يَتْعَبُونَ فِي الطَّاعَة</p></td></tr></table></body></html>
