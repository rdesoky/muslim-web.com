<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَشَارِبُونَ شُرْبَ الْهِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَشَارِبُونَ شَرْب" </quran>بِفَتْحِ الشِّين وَضَمّهَا مَصْدَر <quran>"الْهِيم" </quran>الْإِبِل الْعِطَاش جَمْع هَيْمَان لِلذَّكَرِ وَهَيْمَى لِلْأُنْثَى كَعَطْشَان وَعَطْشَى</p></td></tr></table></body></html>
