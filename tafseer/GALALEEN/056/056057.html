<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ خَلَقْنَاكُمْ فَلَوْلَا تُصَدِّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نَحْنُ خَلَقْنَاكُمْ" </quran>أَوَجَدْنَاكُمْ مِنْ عَدَم <quran>"فَلَوْلَا" </quran>هَلَّا <quran>"تُصَدِّقُونَ" </quran>بِالْبَعْثِ إذْ الْقَادِر عَلَى الْإِنْشَاء قَادِر عَلَى الْإِعَادَة</p></td></tr></table></body></html>
