<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَأَنْتُمْ تَخْلُقُونَهُ أَمْ نَحْنُ الْخَالِقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَأَنْتُمْ" </quran>بِتَحْقِيقِ الْهَمْزَتَيْنِ وَإِبْدَال الثَّانِيَة أَلِفًا وَتَسْهِيلهَا وَإِدْخَال أَلِف بَيْن الْمُسَهَّلَة وَالْأُخْرَى وَتَرْكه فِي الْمَوَاضِع الْأُخْرَى <quran>"تَخْلُقُونَهُ" </quran>أَيْ الْمَنِيّ بَشَرًا</p></td></tr></table></body></html>
