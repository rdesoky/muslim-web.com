<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ قَدَّرْنَا بَيْنَكُمُ الْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"نَحْنُ قَدَّرْنَا" </quran>بِالتَّشْدِيدِ وَالتَّخْفِيف <quran>"بَيْنكُمْ الْمَوْت وَمَا نَحْنُ بِمَسْبُوقِينَ" </quran>بِعَاجِزِينَ</p></td></tr></table></body></html>
