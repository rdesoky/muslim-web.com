<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ عَلِمْتُمُ النَّشْأَةَ الْأُولَى فَلَوْلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ عَلِمْتُمْ النَّشْأَة الْأُولَى" </quran>وَفِي قِرَاءَة بِسُكُونِ الشِّين <quran>"فَلَوْلَا تَذَكَّرُونَ" </quran>فِيهِ إدْغَام التَّاء الثَّانِيَة فِي الْأَصْل فِي الذَّال</p></td></tr></table></body></html>
