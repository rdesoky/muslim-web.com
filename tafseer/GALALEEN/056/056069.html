<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَأَنْتُمْ أَنْزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنْزِلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَأَنْتُمْ أَنَزَلْتُمُوهُ مِنْ الْمُزْن" </quran>السَّحَاب جَمْع مُزْنَة</p></td></tr></table></body></html>
