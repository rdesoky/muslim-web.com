<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَأَنْتُمْ أَنْشَأْتُمْ شَجَرَتَهَا أَمْ نَحْنُ الْمُنْشِئُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَأَنْتُمْ أَنْشَأْتُمْ شَجَرَتهَا" </quran>كَالْمَرْخِ وَالْعَفَار والكلخ</p></td></tr></table></body></html>
