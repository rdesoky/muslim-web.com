<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَقَسَمٌ لَوْ تَعْلَمُونَ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهُ" </quran>أَيْ الْقَسَم بِهَا <quran>"لَقَسَم لَوْ تَعْلَمُونَ عَظِيم" </quran>لَوْ كُنْتُمْ مِنْ ذَوِي الْعِلْم لَعَلِمْتُمْ عِظَم هَذَا الْقَسَم</p></td></tr></table></body></html>
