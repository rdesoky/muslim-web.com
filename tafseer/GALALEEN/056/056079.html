<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا يَمَسّهُ" </quran>خَبَر بِمَعْنَى النَّهْي <quran>"إلَّا الْمُطَهَّرُونَ" </quran>الَّذِينَ طَهَّرُوا أَنْفُسهمْ مِنْ الْأَحْدَاث</p></td></tr></table></body></html>
