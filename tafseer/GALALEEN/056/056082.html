<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَجْعَلُونَ رِزْقَكُمْ أَنَّكُمْ تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَجْعَلُونَ رِزْقكُمْ" </quran>مِنْ الْمَطَر أَيْ شُكْره <quran>"أَنَّكُمْ تُكَذِّبُونَ" </quran>بِسُقْيَا اللَّه حَيْثُ قُلْتُمْ مُطِرْنَا بِنَوْءِ كَذَا</p></td></tr></table></body></html>
