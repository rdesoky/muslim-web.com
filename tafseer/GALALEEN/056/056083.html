<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْلَا إِذَا بَلَغَتِ الْحُلْقُومَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَوْلَا" </quran>فَهَلَّا <quran>"إذَا بَلَغَتْ" </quran>الرُّوح وَقْت النَّزْع <quran>"الْحُلْقُوم" </quran>هُوَ مَجْرَى الطَّعَام</p></td></tr></table></body></html>
