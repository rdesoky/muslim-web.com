<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْلَا إِنْ كُنْتُمْ غَيْرَ مَدِينِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَوْلَا" </quran>فَهَلَّا <quran>"إنْ كُنْتُمْ غَيْر مَدِينِينَ" </quran>مَجْزِيِّينَ بِأَنْ تُبْعَثُوا أَيْ غَيْر مَبْعُوثِينَ بِزَعْمِكُمْ</p></td></tr></table></body></html>
