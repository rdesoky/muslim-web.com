<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَلَامٌ لَكَ مِنْ أَصْحَابِ الْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَسَلَام لَك" </quran>أَيْ لَهُ السَّلَامَة مِنْ الْعَذَاب <quran>"مِنْ أَصْحَاب الْيَمِين" </quran>مِنْ جِهَة أَنَّهُ مِنْهُمْ</p></td></tr></table></body></html>
