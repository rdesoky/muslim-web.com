<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَهُ مُلْك السَّمَوَات وَالْأَرْض يُحْيِي" </quran>بِالْإِنْشَاءِ <quran>"وَيُمِيت" </quran>بَعْده</p></td></tr></table></body></html>
