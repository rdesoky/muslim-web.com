<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَعَدَّ اللَّهُ لَهُمْ عَذَابًا شَدِيدًا إِنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَعَدَّ اللَّه لَهُمْ عَذَابًا شَدِيدًا إنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ" </quran>مِنْ الْمَعَاصِي</p></td></tr></table></body></html>
