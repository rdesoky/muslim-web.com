<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَنْ تُغْنِيَ عَنْهُمْ أَمْوَالُهُمْ وَلَا أَوْلَادُهُمْ مِنَ اللَّهِ شَيْئًا أُولَئِكَ أَصْحَابُ النَّارِ هُمْ فِيهَا خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَنْ تُغْنِي عَنْهُمْ أَمْوَالهمْ وَلَا أَوْلَادهمْ مِنْ اللَّه" </quran>مِنْ عَذَابه <quran>"شَيْئًا" </quran>مِنْ الْإِغْنَاء</p></td></tr></table></body></html>
