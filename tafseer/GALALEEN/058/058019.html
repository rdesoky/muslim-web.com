<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اسْتَحْوَذَ عَلَيْهِمُ الشَّيْطَانُ فَأَنْسَاهُمْ ذِكْرَ اللَّهِ أُولَئِكَ حِزْبُ الشَّيْطَانِ أَلَا إِنَّ حِزْبَ الشَّيْطَانِ هُمُ الْخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اسْتَحْوَذَ" </quran>اسْتَوْلَى <quran>"عَلَيْهِمْ الشَّيْطَان" </quran>بِطَاعَتِهِمْ لَهُ <quran>"فَأَنْسَاهُمْ ذِكْر اللَّه أُولَئِكَ حِزْب الشَّيْطَان" </quran>أَتْبَاعه</p></td></tr></table></body></html>
