<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ يُحَادُّونَ اللَّهَ وَرَسُولَهُ أُولَئِكَ فِي الْأَذَلِّينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ يُحَادُّونَ" </quran>يُخَالِفُونَ <quran>"اللَّه وَرَسُوله أُولَئِكَ فِي الْأَذَلِّينَ" </quran>الْمَغْلُوبِينَ</p></td></tr></table></body></html>
