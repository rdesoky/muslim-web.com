<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَتَبَ اللَّهُ لَأَغْلِبَنَّ أَنَا وَرُسُلِي إِنَّ اللَّهَ قَوِيٌّ عَزِيزٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَتَبَ اللَّه" </quran>فِي اللَّوْح الْمَحْفُوظ أَوْ قَضَى <quran>"لَأَغْلِبَن أَنَا وَرُسُلِي" </quran>بِالْحُجَّةِ أَوْ السَّيْف</p></td></tr></table></body></html>
