<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَأَنْتُمْ أَشَدُّ رَهْبَةً فِي صُدُورِهِمْ مِنَ اللَّهِ ذَلِكَ بِأَنَّهُمْ قَوْمٌ لَا يَفْقَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَأَنْتُمْ أَشَدّ رَهْبَة" </quran>خَوْفًا <quran>"فِي صُدُورهمْ" </quran>أَيْ الْمُنَافِقِينَ <quran>"مِنْ اللَّه" </quran>لِتَأْخِيرِ عَذَابه</p></td></tr></table></body></html>
