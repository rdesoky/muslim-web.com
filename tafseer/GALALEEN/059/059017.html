<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَانَ عَاقِبَتَهُمَا أَنَّهُمَا فِي النَّارِ خَالِدَيْنِ فِيهَا وَذَلِكَ جَزَاءُ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَكَانَ عَاقِبَتهمَا" </quran>أَيْ الْغَاوِي وَالْمُغْوِي وَقُرِئَ بِالرَّفْعِ اسْم كَانَ <quran>"أَنَّهُمَا فِي النَّار خَالِدَيْنِ فِيهَا وَذَلِكَ جَزَاء الظَّالِمِينَ" </quran>أَيْ الْكَافِرِينَ</p></td></tr></table></body></html>
