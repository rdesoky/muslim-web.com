<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَنُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُوَ اللَّه الَّذِي لَا إلَه إلَّا هُوَ عَالِم الْغَيْب وَالشَّهَادَة" </quran>السِّرّ وَالْعَلَانِيَة</p></td></tr></table></body></html>
