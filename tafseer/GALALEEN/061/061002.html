<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ" </quran>فِي طَلَب الْجِهَاد <quran>"مَا لَا تَفْعَلُونَ" </quran>إذْ انْهَزَمْتُمْ بِأُحُدٍ</p></td></tr></table></body></html>
