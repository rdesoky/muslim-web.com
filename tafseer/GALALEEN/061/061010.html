<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا هَلْ أَدُلُّكُمْ عَلَى تِجَارَةٍ تُنْجِيكُمْ مِنْ عَذَابٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ آمَنُوا هَلْ أَدُلّكُمْ عَلَى تِجَارَة تُنْجِيكُمْ" </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>"مِنْ عَذَاب أَلِيم" </quran>مُؤْلِم فَكَأَنَّهُمْ قَالُوا نَعَمْ</p></td></tr></table></body></html>
