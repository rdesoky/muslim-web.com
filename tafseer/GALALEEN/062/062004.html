<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ فَضْل اللَّه يُؤْتِيه مَنْ يَشَاء" </quran>النَّبِيّ وَمَنْ ذُكِرَ مَعَهُ</p></td></tr></table></body></html>
