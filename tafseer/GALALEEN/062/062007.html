<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَتَمَنَّوْنَهُ أَبَدًا بِمَا قَدَّمَتْ أَيْدِيهِمْ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَا يَتَمَنَّوْنَهُ أَبَدًا بِمَا قَدَّمَتْ أَيْدِيهمْ" </quran>مِنْ كُفْرهمْ بِالنَّبِيِّ الْمُسْتَلْزِم لِكَذِبِهِمْ <quran>"وَاَللَّه عَلِيم بِالظَّالِمِينَ" </quran>الْكَافِرِينَ</p></td></tr></table></body></html>
