<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اتَّخَذُوا أَيْمَانَهُمْ جُنَّةً فَصَدُّوا عَنْ سَبِيلِ اللَّهِ إِنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"اتَّخَذُوا أَيْمَانهمْ جُنَّة" </quran>سُتْرَة عَلَى أَمْوَالهمْ وَدِمَائِهِمْ <quran>"فَصَدُّوا " </quran>بِهَا <quran>"عَنْ سَبِيل اللَّه " </quran>أَيْ عَنْ الْجِهَاد فِيهِمْ</p></td></tr></table></body></html>
