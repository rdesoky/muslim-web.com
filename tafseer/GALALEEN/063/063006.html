<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَوَاءٌ عَلَيْهِمْ أَأَسْتَغْفَرْتَ لَهُمْ أَمْ لَمْ تَسْتَغْفِرْ لَهُمْ لَنْ يَغْفِرَ اللَّهُ لَهُمْ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَوَاء عَلَيْهِمْ أَسْتَغْفَرْت لَهُمْ " </quran>اُسْتُغْنِيَ بِهَمْزَةِ الِاسْتِفْهَام عَنْ هَمْزَة الْوَصْل</p></td></tr></table></body></html>
