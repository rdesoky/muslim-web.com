<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَنْ يُؤَخِّرَ اللَّهُ نَفْسًا إِذَا جَاءَ أَجَلُهَا وَاللَّهُ خَبِيرٌ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَنْ يُؤَخِّر اللَّه نَفْسًا إذَا جَاءَ أَجَلهَا وَاَللَّه خَبِير بِمَا تَعْمَلُونَ " </quran>بِالتَّاءِ وَالْيَاء</p></td></tr></table></body></html>
