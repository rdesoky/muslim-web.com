<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ الَّذِي خَلَقَكُمْ فَمِنْكُمْ كَافِرٌ وَمِنْكُمْ مُؤْمِنٌ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هُوَ الَّذِي خَلَقَكُمْ فَمِنْكُمْ كَافِر وَمِنْكُمْ مُؤْمِن" </quran>فِي أَصْلِ الْخِلْقَة ثُمَّ يُمِيتكُمْ وَيُعِيدكُمْ عَلَى ذَلِكَ</p></td></tr></table></body></html>
