<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ وَإِلَيْهِ الْمَصِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"خَلَقَ السَّمَوَات وَالْأَرْض بِالْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَركُمْ" </quran>إذْ جَعَلَ شَكْل الْآدَمِيّ أَحْسَن الْأَشْكَال</p></td></tr></table></body></html>
