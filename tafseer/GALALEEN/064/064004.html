<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ وَاللَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَعْلَم مَا فِي السَّمَوَات وَالْأَرْض وَيَعْلَم مَا تُسِرُّونَ وَمَا تُعْلِنُونَ وَاَللَّه عَلِيم بِذَاتِ الصُّدُور" </quran>بِمَا فِيهَا مِنْ الْأَسْرَار وَالْمُعْتَقَدَات</p></td></tr></table></body></html>
