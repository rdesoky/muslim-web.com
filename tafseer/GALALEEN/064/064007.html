<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>زَعَمَ الَّذِينَ كَفَرُوا أَنْ لَنْ يُبْعَثُوا قُلْ بَلَى وَرَبِّي لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ وَذَلِكَ عَلَى اللَّهِ يَسِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"زَعَمَ الَّذِينَ كَفَرُوا أَنْ" </quran>مُخَفَّفَة وَاسْمهَا مَحْذُوف أَيْ أَنَّهُمْ</p></td></tr></table></body></html>
