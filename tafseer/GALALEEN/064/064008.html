<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَآمِنُوا بِاللَّهِ وَرَسُولِهِ وَالنُّورِ الَّذِي أَنْزَلْنَا وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَآمِنُوا بِاَللَّهِ وَرَسُوله وَالنُّور" </quran>الْقُرْآن</p></td></tr></table></body></html>
