<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ النَّارِ خَالِدِينَ فِيهَا وَبِئْسَ الْمَصِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا" </quran>الْقُرْآن <quran>"أُولَئِكَ أَصْحَاب النَّار خَالِدِينَ فِيهَا وَبِئْسَ الْمَصِير" </quran>هِيَ</p></td></tr></table></body></html>
