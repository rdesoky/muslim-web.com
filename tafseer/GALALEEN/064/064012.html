<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ فَإِنْ تَوَلَّيْتُمْ فَإِنَّمَا عَلَى رَسُولِنَا الْبَلَاغُ الْمُبِينُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَطِيعُوا اللَّه وَأَطِيعُوا الرَّسُول فَإِنْ تَوَلَّيْتُمْ فَإِنَّمَا عَلَى رَسُولنَا الْبَلَاغ الْمُبِين" </quran>الْبَيِّن</p></td></tr></table></body></html>
