<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ أَمْرُ اللَّهِ أَنْزَلَهُ إِلَيْكُمْ وَمَنْ يَتَّقِ اللَّهَ يُكَفِّرْ عَنْهُ سَيِّئَاتِهِ وَيُعْظِمْ لَهُ أَجْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ذَلِكَ" </quran>الْمَذْكُور فِي الْعِدَّة <quran>"أَمْر اللَّه" </quran>حُكْمه</p></td></tr></table></body></html>
