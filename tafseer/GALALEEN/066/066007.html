<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ كَفَرُوا لَا تَعْتَذِرُوا الْيَوْمَ إِنَّمَا تُجْزَوْنَ مَا كُنْتُمْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا أَيّهَا الَّذِينَ كَفَرُوا لَا تَعْتَذِرُوا الْيَوْم" </quran>يُقَال لَهُمْ ذَلِكَ عِنْد دُخُولهمْ النَّار أَيْ لِأَنَّهُ لَا يَنْفَعكُمْ <quran>"إنَّمَا تُجْزَوْنَ مَا كُنْتُمْ تَعْمَلُونَ" </quran>أَيْ جَزَاءَهُ</p></td></tr></table></body></html>
