<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الْمُلْك [ مَكِّيَّة وَآيَاتهَا ثَلَاثُونَ آيَة ]</p><p><quran>"تَبَارَكَ" </quran>تَنَزَّهَ عَنْ صِفَات الْمُحَدِّثِينَ <quran>"الَّذِي بِيَدِهِ" </quran>فِي تَصَرُّفه <quran>"الْمُلْك" </quran>السُّلْطَان وَالْقُدْرَة</p></td></tr></table></body></html>
