<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا" </quran>صَوْتًا مُنْكَرًا كَصَوْتِ الْحِمَار <quran>"وَهِيَ تَفُور" </quran>تَغْلِي</p></td></tr></table></body></html>
