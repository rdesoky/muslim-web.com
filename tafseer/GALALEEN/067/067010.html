<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا لَوْ كُنَّا نَسْمَع" </quran>أَيْ سَمَاع تَفَهُّم <quran>"أَوْ نَعْقِل" </quran>أَيْ عَقْل تَفَكُّر</p></td></tr></table></body></html>
