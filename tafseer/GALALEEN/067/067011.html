<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاعْتَرَفُوا بِذَنْبِهِمْ فَسُحْقًا لِأَصْحَابِ السَّعِيرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاعْتَرَفُوا" </quran>حَيْثُ لَا يَنْفَع الِاعْتِرَاف <quran>"بِذَنْبِهِمْ" </quran>وَهُوَ تَكْذِيب النَّذْر <quran>"فَسُحْقًا" </quran>بِسُكُونِ الْحَاء وَضَمّهَا <quran>"لِأَصْحَابِ السَّعِير" </quran>فَبُعْدًا لَهُمْ عَنْ رَحْمَة اللَّه</p></td></tr></table></body></html>
