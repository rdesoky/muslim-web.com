<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ بِالْغَيْبِ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ كَبِيرٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الَّذِينَ يَخْشَوْنَ رَبّهمْ" </quran>يَخَافُونَهُ <quran>"بِالْغَيْبِ" </quran>فِي غَيْبَتهمْ عَنْ أَعْيُن النَّاس فَيُطِيعُونَهُ سِرًّا فَيَكُون عَلَانِيَة أَوْلَى <quran>"لَهُمْ مَغْفِرَة وَأَجْر كَبِير" </quran>أَيْ الْجَنَّة</p></td></tr></table></body></html>
