<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَا يَعْلَم مَنْ خَلَقَ" </quran>مَا تُسِرُّونَ أَيْ أَيَنْتَفِي عِلْمه بِذَلِكَ <quran>"وَهُوَ اللَّطِيف" </quran>فِي عِلْمه <quran>"الْخَبِير" </quran>فِيهِ</p></td></tr></table></body></html>
