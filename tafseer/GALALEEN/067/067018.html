<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَقَدْ كَذَّبَ الَّذِينَ مِنْ قَبْلهمْ" </quran>مِنْ الْأُمَم <quran>"فَكَيْفَ كَانَ نَكِير" </quran>فَكَيْفَ كَانَ إنْكَارِي عَلَيْهِمْ بِالتَّكْذِيبِ عِنْد إهْلَاكهمْ أَيْ أَنَّهُ حَقّ</p></td></tr></table></body></html>
