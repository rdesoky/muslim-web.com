<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ هُوَ الَّذِي ذَرَأَكُمْ" </quran>خَلَقَكُمْ <quran>"فِي الْأَرْض وَإِلَيْهِ تُحْشَرُونَ" </quran>لِلْحِسَابِ</p></td></tr></table></body></html>
