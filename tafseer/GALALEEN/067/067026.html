<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّمَا الْعِلْمُ عِنْدَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنَّمَا الْعِلْم" </quran>بِمَجِيئِهِ <quran>"عِنْد اللَّه وَإِنَّمَا أَنَا نَذِير مُبِين" </quran>بَيِّن الْإِنْذَار</p></td></tr></table></body></html>
