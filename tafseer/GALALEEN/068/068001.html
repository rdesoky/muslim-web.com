<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ن وَالْقَلَمِ وَمَا يَسْطُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الْقَلَم [ مَكِّيَّة وَآيَاتهَا اثْنَتَانِ وَخَمْسُونَ آيَة ]</p><p><quran>"ن" </quran>أَحَد حُرُوف الْهِجَاء اللَّه أَعْلَم بِمُرَادِهِ بِهِ <quran>"وَالْقَلَم" </quran>الَّذِي كَتَبَ بِهِ الْكَائِنَات فِي اللَّوْح الْمَحْفُوظ <quran>"وَمَا يَسْطُرُونَ" </quran>أَيْ الْمَلَائِكَة مِنْ الْخَيْر وَالصَّلَاح</p></td></tr></table></body></html>
