<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَنْتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا أَنْتَ" </quran>يَا مُحَمَّد <quran>"بِنِعْمَةِ رَبّك بِمَجْنُونٍ" </quran>أَيْ انْتَفَى الْجُنُون عَنْك بِسَبَبِ إنْعَام رَبّك عَلَيْك بِالنُّبُوَّةِ وَغَيْرهَا وَهَذَا رَدّ لِقَوْلِهِمْ إنَّهُ مَجْنُون</p></td></tr></table></body></html>
