<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بِأَيِّيكُمُ الْمَفْتُونُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بِأَيِيِّكُمْ الْمَفْتُون" </quran>مَصْدَر كَالْمَعْقُولِ أَيْ الْفُتُون بِمَعْنَى الْجُنُون أَيْ أَبِك أَمْ بِهِمْ</p></td></tr></table></body></html>
