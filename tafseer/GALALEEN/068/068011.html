<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَمَّازٍ مَشَّاءٍ بِنَمِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَمَّاز" </quran>عَيَّاب أَيْ مُغْتَاب <quran>"مَشَّاء بِنَمِيمٍ" </quran>أَيْ سَاعٍ بِالْكَلَامِ بَيْن النَّاس عَلَى وَجْه الْإِفْسَاد بَيْنهمْ</p></td></tr></table></body></html>
