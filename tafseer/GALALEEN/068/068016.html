<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَنَسِمُهُ عَلَى الْخُرْطُومِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَنَسِمُهُ عَلَى الْخُرْطُوم" </quran>سَنَجْعَلُ عَلَى أَنْفه عَلَامَة يُعَيَّر بِهَا مَا عَاشَ فَخُطِمَ أَنْفه بِالسَّيْفِ يَوْم بَدْر</p></td></tr></table></body></html>
