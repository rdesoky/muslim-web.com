<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنِ اغْدُوا عَلَى حَرْثِكُمْ إِنْ كُنْتُمْ صَارِمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنْ اُغْدُوَا عَلَى حَرْثكُمْ" </quran>غَلَّتْكُمْ تَفْسِير لِتَنَادَوْا أَوْ أَنْ مَصْدَرِيَّة أَيْ بِأَنْ <quran>"إنْ كُنْتُمْ صَارِمِينَ" </quran>مُرِيدِينَ الْقَطْع وَجَوَاب الشَّرْط دَلَّ عَلَيْهِ مَا قَبْله</p></td></tr></table></body></html>
