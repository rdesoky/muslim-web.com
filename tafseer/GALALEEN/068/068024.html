<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ لَا يَدْخُلَنَّهَا الْيَوْمَ عَلَيْكُمْ مِسْكِينٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَنْ لَا يَدْخُلَنهَا الْيَوْم عَلَيْكُمْ مِسْكِين" </quran>تَفْسِير لِمَا قَبْله أَوْ أَنْ مَصْدَرِيَّة أَيْ بِأَنْ</p></td></tr></table></body></html>
