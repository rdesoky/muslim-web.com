<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا رَأَوْهَا قَالُوا إِنَّا لَضَالُّونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَمَّا رَأَوْهَا" </quran>سَوْدَاء مُحْتَرِقَة <quran>"قَالُوا إنَّا لَضَالُّونَ" </quran>عَنْهَا أَيْ لَيْسَتْ هَذِهِ ثُمَّ قَالُوا لَمَّا عَلِمُوهَا</p></td></tr></table></body></html>
