<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَوْسَطُهُمْ أَلَمْ أَقُلْ لَكُمْ لَوْلَا تُسَبِّحُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ أَوْسَطهمْ" </quran>خَيْرهمْ <quran>"أَلَمْ أَقُلْ لَكُمْ لَوْلَا" </quran>هَلَّا <quran>"تُسَبِّحُونَ" </quran>اللَّه تَائِبِينَ</p></td></tr></table></body></html>
