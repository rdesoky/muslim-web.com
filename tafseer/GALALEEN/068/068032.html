<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَسَى رَبُّنَا أَنْ يُبْدِلَنَا خَيْرًا مِنْهَا إِنَّا إِلَى رَبِّنَا رَاغِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُبْدِلنَا" </quran>بِالتَّشْدِيدِ وَالتَّخْفِيف <quran>"خَيْرًا مِنْهَا إنَّا إلَى رَبّنَا رَاغِبُونَ" </quran>لِيَقْبَل تَوْبَتنَا وَيَرُدّ عَلَيْنَا خَيْرًا مِنْ جَنَّتنَا رُوِيَ أَنَّهُمْ أُبْدِلُوا خَيْرًا مِنْهَا</p></td></tr></table></body></html>
