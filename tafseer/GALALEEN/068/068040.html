<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلْهُمْ أَيُّهُمْ بِذَلِكَ زَعِيمٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَلْهُمْ أَيّهمْ بِذَلِكَ" </quran>الْحُكْم الَّذِي يَحْكُمُونَ بِهِ لِأَنْفُسِهِمْ مِنْ أَنَّهُمْ يُعْطُونَ فِي الْآخِرَة أَفَضْل مِنْ الْمُؤْمِنِينَ <quran>"زَعِيم" </quran>كَفِيل لَهُمْ</p></td></tr></table></body></html>
