<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ عِنْدَهُمُ الْغَيْبُ فَهُمْ يَكْتُبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَمْ عِنْدهمْ الْغَيْب" </quran>أَيْ اللَّوْح الْمَحْفُوظ الَّذِي فِيهِ الْغَيْب <quran>"فَهُمْ يَكْتُبُونَ" </quran>مِنْهُ مَا يَقُولُونَ</p></td></tr></table></body></html>
