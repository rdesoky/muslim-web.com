<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاجْتَبَاهُ رَبُّهُ فَجَعَلَهُ مِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاجْتَبَاهُ رَبّه" </quran>بِالنُّبُوَّةِ <quran>"فَجَعَلَهُ مِنْ الصَّالِحِينَ" </quran>أَيْ مِنْ الْأَنْبِيَاء</p></td></tr></table></body></html>
