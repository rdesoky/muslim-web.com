<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمَّا عَاد فَأُهْلِكُوا بِرِيحٍ صَرْصَر عَاتِيَة" </quran>قَوِيَّة شَدِيدَة عَلَى عَادٍ مَعَ قُوَّتهمْ وَشِدَّتهمْ</p></td></tr></table></body></html>
