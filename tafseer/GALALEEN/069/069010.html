<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَصَوْا رَسُولَ رَبِّهِمْ فَأَخَذَهُمْ أَخْذَةً رَابِيَةً</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَعَصَوْا رَسُول رَبّهمْ" </quran>أَيْ لُوطًا وَغَيْره <quran>"فَأَخَذَهُمْ أَخْذَة رَابِيَة" </quran>زَائِدَة فِي الشِّدَّة عَلَى غَيْرهَا</p></td></tr></table></body></html>
