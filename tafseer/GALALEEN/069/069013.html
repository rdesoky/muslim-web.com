<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا نُفِخَ فِي الصُّورِ نَفْخَةٌ وَاحِدَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا نُفِخَ فِي الصُّور نَفْخَة وَاحِدَة" </quran>لِلْفَصْلِ بَيْن الْخَلَائِق وَهِيَ الثَّانِيَة</p></td></tr></table></body></html>
