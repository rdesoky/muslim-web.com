<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَئِذٍ تُعْرَضُونَ لَا تَخْفَى مِنْكُمْ خَافِيَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَوْمئِذٍ تُعْرَضُونَ" </quran>لِلْحِسَابِ <quran>"لَا تَخْفَى" </quran>بِالتَّاءِ وَالْيَاء <quran>"مِنْكُمْ خَافِيَة" </quran>مِنْ السَّرَائِر</p></td></tr></table></body></html>
