<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِشِمَالِهِ فَيَقُولُ يَا لَيْتَنِي لَمْ أُوتَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَمَّا مَنْ أُوتِيَ كِتَابه بِشِمَالِهِ فَيَقُول يَا" </quran>لِلتَّنْبِيهِ</p></td></tr></table></body></html>
