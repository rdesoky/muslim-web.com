<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا ‎لَيْتَهَا كَانَتِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَا لَيْتَهَا" </quran>أَيْ الْمَوْتَة فِي الدُّنْيَا <quran>"كَانَتْ الْقَاضِيَهْ" </quran>الْقَاطِعَة لِحَيَاتِي بِأَنْ لَا أُبْعَث</p></td></tr></table></body></html>
