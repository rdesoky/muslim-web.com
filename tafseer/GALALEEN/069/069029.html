<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلَكَ عَنِّي سُلْطَانِيَهْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَلَكَ عَنِّي سُلْطَانِيَهْ" </quran>قُوَّتِي وَحُجَّتِي وَهَاء كِتَابِيَهْ وَحِسَابِيَهْ وَمَالِيَهْ وَسُلْطَانِيَهْ لِلسَّكْتِ تَثْبُت وَقْفًا وَوَصْلًا اتِّبَاعًا لِلْمُصْحَفِ الْإِمَام وَالنَّقْل وَمِنْهُمْ مَنْ حَذَفَهَا وَصْلًا</p></td></tr></table></body></html>
