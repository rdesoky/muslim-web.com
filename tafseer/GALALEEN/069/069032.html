<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ فِي سِلْسِلَةٍ ذَرْعُهَا سَبْعُونَ ذِرَاعًا فَاسْلُكُوهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ فِي سَلْسَلَة ذَرْعهَا سَبْعُونَ ذِرَاعًا" </quran>بِذِرَاعِ الْمَلَك <quran>"فَاسْلُكُوهُ" </quran>أَدْخِلُوهُ فِيهَا بَعْد إدْخَاله النَّار وَلَمْ تَمْنَع الْفَاء مِنْ تَعَلُّق الْفِعْل بِالظَّرْفِ الْمُتَقَدِّم</p></td></tr></table></body></html>
