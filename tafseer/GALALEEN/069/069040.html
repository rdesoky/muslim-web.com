<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُ" </quran>أَيْ الْقُرْآن <quran>"لَقَوْل رَسُول كَرِيم" </quran>أَيْ قَالَهُ رِسَالَة عَنْ اللَّه تَعَالَى</p></td></tr></table></body></html>
