<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ لَقَطَعْنَا مِنْهُ الْوَتِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ لَقَطَعْنَا مِنْهُ الْوَتِين" </quran>نِيَاط الْقَلْب وَهُوَ عِرْق مُتَّصِل بِهِ إذَا انْقَطَعَ مَاتَ صَاحِبه</p></td></tr></table></body></html>
