<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَحَسْرَةٌ عَلَى الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَإِنَّهُ" </quran>أَيْ الْقُرْآن <quran>"لَحَسْرَة عَلَى الْكَافِرِينَ" </quran>إذَا رَأَوْا ثَوَاب الْمُصَدِّقِينَ وَعِقَاب الْمُكَذِّبِينَ بِهِ</p></td></tr></table></body></html>
