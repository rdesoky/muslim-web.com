<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِلْكَافِرِينَ لَيْسَ لَهُ دَافِعٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِلْكَافِرِينَ لَيْسَ لَهُ دَافِع" </quran>هُوَ النَّضْر بْن الْحَارِث قَالَ <quran>"اللَّهُمَّ إنْ كَانَ هَذَا هُوَ الْحَقّ" </quran>الْآيَة</p></td></tr></table></body></html>
