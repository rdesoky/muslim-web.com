<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاصْبِرْ صَبْرًا جَمِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَاصْبِرْ" </quran>وَهَذَا قَبْل أَنْ يُؤْمَر بِالْقِتَالِ <quran>"صَبْرًا جَمِيلًا" </quran>أَيْ لَا جَزَع فِيهِ</p></td></tr></table></body></html>
