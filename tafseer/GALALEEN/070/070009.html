<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَكُونُ الْجِبَالُ كَالْعِهْنِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَتَكُون الْجِبَال كَالْعِهْنِ" </quran>كَالصُّوفِ فِي الْخِفَّة وَالطَّيَرَان بِالرِّيحِ</p></td></tr></table></body></html>
