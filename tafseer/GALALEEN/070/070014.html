<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ فِي الْأَرْضِ جَمِيعًا ثُمَّ يُنْجِيهِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَنْ فِي الْأَرْض جَمِيعًا ثُمَّ يُنْجِيه" </quran>ذَلِكَ الِافْتِدَاء وَالْجُمْلَة عَطْف عَلَى يَفْتَدِي</p></td></tr></table></body></html>
