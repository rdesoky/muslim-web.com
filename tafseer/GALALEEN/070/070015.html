<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّهَا لَظَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>رَدّ لِمَا يَوَدّهُ <quran>"إنَّهَا" </quran>أَيْ النَّار <quran>"لَظَى" </quran>اسْم لِجَهَنَّم لِأَنَّهَا تَتَلَظَّى أَيْ تَتَلَهَّب عَلَى الْكُفَّار</p></td></tr></table></body></html>
