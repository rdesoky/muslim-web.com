<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عَلَى أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَّا عَلَى أَزْوَاجهمْ أَوْ مَا مَلَكَتْ أَيْمَانهمْ" </quran>مِنْ الْإِمَاء</p></td></tr></table></body></html>
