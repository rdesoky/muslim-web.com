<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنِ ابْتَغَى وَرَاءَ ذَلِكَ فَأُولَئِكَ هُمُ الْعَادُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَنْ ابْتَغَى وَرَاء ذَلِكَ فَأُولَئِكَ هُمْ الْعَادُونَ" </quran>الْمُتَجَاوِزُونَ الْحَلَال إلَى الْحَرَام</p></td></tr></table></body></html>
