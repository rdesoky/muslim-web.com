<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ هُمْ لِأَمَانَاتِهِمْ" </quran>وَفِي قِرَاءَة بِالْإِفْرَادِ : مَا ائْتَمَنُوا عَلَيْهِ مِنْ أَمْر الدِّين وَالدُّنْيَا <quran>"وَعَهْدهمْ" </quran>الْمَأْخُوذ عَلَيْهِمْ فِي ذَلِكَ <quran>"رَاعُونَ" </quran>حَافِظُونَ</p></td></tr></table></body></html>
