<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ بِشَهَادَاتِهِمْ قَائِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاَلَّذِينَ هُمْ بِشَهَادَاتِهِمْ" </quran>وَفِي قِرَاءَة بِالْجَمْعِ <quran>"قَائِمُونَ" </quran>يُقِيمُونَهَا وَلَا يَكْتُمُونَهَا</p></td></tr></table></body></html>
