<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّا خَلَقْنَاهُمْ مِمَّا يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>رَدْع لَهُمْ عَنْ طَمَعهمْ فِي الْجَنَّة <quran>"إنَّا خَلَقْنَاهُمْ" </quran>كَغَيْرِهِمْ <quran>"مِمَّا يَعْلَمُونَ" </quran>مِنْ نُطَف فَلَا يُطْمَع بِذَلِكَ فِي الْجَنَّة وَإِنَّمَا يُطْمَع فِيهَا بِالتَّقْوَى</p></td></tr></table></body></html>
