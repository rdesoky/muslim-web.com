<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا أُقْسِمُ بِرَبِّ الْمَشَارِقِ وَالْمَغَارِبِ إِنَّا لَقَادِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا" </quran>لَا زَائِدَة <quran>"أُقْسِم بِرَبِّ الْمَشَارِق وَالْمَغَارِب" </quran>لِلشَّمْسِ وَالْقَمَر وَسَائِر الْكَوَاكِب</p></td></tr></table></body></html>
