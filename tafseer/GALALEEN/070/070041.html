<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى أَنْ نُبَدِّلَ خَيْرًا مِنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"عَلَى أَنْ نُبَدَّل" </quran>نَأْتِي بَدَلهمْ <quran>"خَيْرًا مِنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَ" </quran>بِعَاجِزِينَ عَنْ ذَلِكَ</p></td></tr></table></body></html>
