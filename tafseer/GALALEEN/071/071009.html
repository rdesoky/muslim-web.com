<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنِّي أَعْلَنْتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ إنِّي أَعْلَنْت لَهُمْ" </quran>صَوْتِي <quran>"وَأَسْرَرْت" </quran>الْكَلَام</p></td></tr></table></body></html>
