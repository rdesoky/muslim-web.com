<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يُرْسِل السَّمَاء" </quran>الْمَطَر وَكَانُوا قَدْ مَنَعُوهُ <quran>"عَلَيْكُمْ مِدْرَارًا" </quran>كَثِير الدُّرُور</p></td></tr></table></body></html>
