<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَلْ لَكُمْ جَنَّاتٍ وَيَجْعَلْ لَكُمْ أَنْهَارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَل لَكُمْ جَنَّات" </quran>بَسَاتِين <quran>"وَيَجْعَل لَكُمْ أَنْهَارًا" </quran>جَارِيَة</p></td></tr></table></body></html>
