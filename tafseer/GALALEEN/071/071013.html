<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا" </quran>أَيْ تَأْمُلُونَ وَقَار اللَّه إيَّاكُمْ بِأَنْ تُؤْمِنُوا</p></td></tr></table></body></html>
