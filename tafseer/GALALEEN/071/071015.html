<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ سَبْعَ سَمَاوَاتٍ طِبَاقًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَمْ تَرَوْا" </quran>تَنْظُرُوا <quran>"كَيْفَ خَلَقَ اللَّه سَبْع سَمَوَات طِبَاقًا" </quran>بَعْضهَا فَوْق بَعْض</p></td></tr></table></body></html>
