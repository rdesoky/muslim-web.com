<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلَ الْقَمَرَ فِيهِنَّ نُورًا وَجَعَلَ الشَّمْسَ سِرَاجًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَعَلَ الْقَمَر فِيهِنَّ" </quran>أَيْ فِي مَجْمُوعهنَّ الصَّادِق بِالسَّمَاءِ الدُّنْيَا <quran>"نُورًا وَجَعَلَ الشَّمْس سِرَاجًا" </quran>مِصْبَاحًا مُضِيئًا وَهُوَ أَقْوَى مِنْ نُور الْقَمَر</p></td></tr></table></body></html>
