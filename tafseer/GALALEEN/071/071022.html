<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَكَرُوا مَكْرًا كُبَّارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَمَكَرُوا" </quran>أَيْ الرُّؤَسَاء <quran>"مَكْرًا كُبَّارًا" </quran>عَظِيمًا جِدًّا بِأَنْ كَذَّبُوا نُوحًا وَآذَوْهُ وَمَنْ اتَّبَعَهُ</p></td></tr></table></body></html>
