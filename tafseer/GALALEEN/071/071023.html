<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالُوا" </quran>لِلسَّفَلَةِ <quran>"لَا تَذَرُونَّ آلِهَتكُمْ وَلَا تَذَرُونَّ وَدًّا" </quran>بِفَتْحِ الْوَاو وَضَمّهَا <quran>"وَلَا سُوَاعًا وَلَا يَغُوث وَيَعُوق وَنَسْرًا" </quran>هِيَ أَسْمَاء أَصْنَامهمْ</p></td></tr></table></body></html>
