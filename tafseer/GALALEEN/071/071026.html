<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ نُوحٌ رَبِّ لَا تَذَرْ عَلَى الْأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَقَالَ نُوح رَبّ لَا تَذَر عَلَى الْأَرْض مِنْ الْكَافِرِينَ دَيَّارًا" </quran>أَيْ نَازِل دَار وَالْمَعْنَى أَحَدًا</p></td></tr></table></body></html>
