<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ وَلَنْ نُشْرِكَ بِرَبِّنَا أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يَهْدِي إلَى الرُّشْد" </quran>الْإِيمَان وَالصَّوَاب <quran>"فَآمَنَّا بِهِ وَلَنْ نُشْرِك" </quran>بَعْد الْيَوْم</p></td></tr></table></body></html>
