<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ تَعَالَى جَدُّ رَبِّنَا مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّهُ" </quran>الضَّمِير لِلشَّأْنِ فِيهِ وَفِي الْمَوْضِعَيْنِ بَعْده <quran>"تَعَالَى جَدّ رَبّنَا" </quran>تَنَزَّهَ جَلَاله وَعَظَمَته عَمَّا نُسِبَ إلَيْهِ <quran>"مَا اتَّخَذَ صَاحِبَة" </quran>زَوْجَة</p></td></tr></table></body></html>
