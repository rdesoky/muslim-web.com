<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ كَانَ يَقُولُ سَفِيهُنَا عَلَى اللَّهِ شَطَطًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَفِيهنَا" </quran>جَاهِلنَا <quran>"عَلَى اللَّه شَطَطًا" </quran>غَلَوْا فِي الْكَذِب بِوَصْفِهِ بِالصَّاحِبَةِ وَالْوَلَد</p></td></tr></table></body></html>
