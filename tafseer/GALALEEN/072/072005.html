<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا ظَنَنَّا أَنْ لَنْ تَقُولَ الْإِنْسُ وَالْجِنُّ عَلَى اللَّهِ كَذِبًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا ظَنَنَّا أَنْ" </quran>مُخَفَّفَة أَيْ أَنَّهُ <quran>"لَنْ تَقُول الْإِنْس وَالْجِنّ عَلَى اللَّه كَذِبًا" </quran>بِوَصْفِهِ بِذَلِكَ حَتَّى تَبَيَّنَّا كَذِبهمْ بِذَلِكَ</p></td></tr></table></body></html>
