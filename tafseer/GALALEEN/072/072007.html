<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُمْ ظَنُّوا كَمَا ظَنَنْتُمْ أَنْ لَنْ يَبْعَثَ اللَّهُ أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّهُمْ" </quran>أَيْ الْجِنّ <quran>"ظَنُّوا كَمَا ظَنَنْتُمْ" </quran>يَا إنْس <quran>"أَنْ" </quran>مُخَفَّفَة مِنْ الثَّقِيلَة أَيْ أَنَّهُ <quran>"لَنْ يَبْعَث اللَّه أَحَدًا" </quran>بَعْد مَوْته</p></td></tr></table></body></html>
