<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَاعِدَ لِلسَّمْعِ فَمَنْ يَسْتَمِعِ الْآنَ يَجِدْ لَهُ شِهَابًا رَصَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا كُنَّا" </quran>أَيْ قَبْل مَبْعَثه <quran>"نَقْعُد مِنْهَا مَقَاعِد لِلسَّمْعِ" </quran>أَيْ نَسْتَمِع <quran>"فَمَنْ يَسْتَمِع الْآن يَجِد لَهُ شِهَابًا رَصَدًا" </quran>أُرْصِدَ لَهُ لِيُرْمَى بِهِ</p></td></tr></table></body></html>
