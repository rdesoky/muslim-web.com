<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا لَا نَدْرِي أَشَرٌّ أُرِيدَ بِمَنْ فِي الْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا لَا نَدْرِي أَشَرّ أُرِيدَ" </quran>بَعْد اسْتِرَاق السَّمْع <quran>"بِمَنْ فِي الْأَرْض أَمْ أَرَادَ بِهِمْ رَبّهمْ رَشَدًا" </quran>خَيْرًا</p></td></tr></table></body></html>
