<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا مِنَّا الصَّالِحُونَ وَمِنَّا دُونَ ذَلِكَ كُنَّا طَرَائِقَ قِدَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا مِنَّا الصَّالِحُونَ" </quran>بَعْد اسْتِمَاع الْقُرْآن <quran>"وَمِنَّا دُون ذَلِكَ" </quran>أَيْ قَوْم غَيْر صَالِحِينَ <quran>"كُنَّا طَرَائِق قِدَدًا" </quran>فِرَقًا مُخْتَلِفِينَ مُسْلِمِينَ وَكَافِرِينَ</p></td></tr></table></body></html>
