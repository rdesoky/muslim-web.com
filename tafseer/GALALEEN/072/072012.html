<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا ظَنَنَّا أَنْ لَنْ نُعجِزَ اللَّهَ فِي الْأَرْضِ وَلَنْ نُعْجِزَهُ هَرَبًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا ظَنَنَّا أَنْ" </quran>مُخَفَّفَة مِنْ الثَّقِيلَة أَيْ أَنَّهُ <quran>"لَنْ نُعْجِز اللَّه فِي الْأَرْض وَلَنْ نَعْجِزهُ هَرَبًا" </quran>لَا نُفَوِّتهُ كَائِنِينَ فِي الْأَرْض أَوْ هَارِبِينَ مِنْهَا فِي السَّمَاء</p></td></tr></table></body></html>
