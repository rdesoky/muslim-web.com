<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا مِنَّا الْمُسْلِمُونَ وَمِنَّا الْقَاسِطُونَ فَمَنْ أَسْلَمَ فَأُولَئِكَ تَحَرَّوْا رَشَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّا مِنَّا الْمُسْلِمُونَ وَمِنَّا الْقَاسِطُونَ" </quran>الْجَائِرُونَ بِكُفْرِهِمْ <quran>"فَمَنْ أَسْلَمَ فَأُولَئِكَ تَحَرَّوْا رَشَدًا" </quran>قَصَدُوا هِدَايَة</p></td></tr></table></body></html>
