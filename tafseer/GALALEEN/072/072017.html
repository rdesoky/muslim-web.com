<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِنَفْتِنَهُمْ فِيهِ وَمَنْ يُعْرِضْ عَنْ ذِكْرِ رَبِّهِ يَسْلُكْهُ عَذَابًا صَعَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِنَفْتِنهُمْ" </quran>لِنَخْتَبِرهُمْ <quran>"فِيهِ" </quran>فَنَعْلَم كَيْفَ شُكْرهمْ عِلْم ظُهُور <quran>"وَمَنْ يُعْرِض عَنْ ذِكْر رَبّه" </quran>الْقُرْآن <quran>"يَسْلُكهُ" </quran>بِالنُّونِ وَالْيَاء نُدْخِلهُ <quran>"عَذَابًا صَعَدًا" </quran>شَاقًّا</p></td></tr></table></body></html>
