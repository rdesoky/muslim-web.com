<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَأَنَّ الْمَسَاجِد" </quran>مَوَاضِع الصَّلَاة <quran>"لِلَّهِ فَلَا تَدْعُوَا" </quran>فِيهَا <quran>"مَعَ اللَّه أَحَدًا" </quran>بِأَنْ تُشْرِكُوا كَمَا كَانَتْ الْيَهُود وَالنَّصَارَى إذَا دَخَلُوا كَنَائِسهمْ وَبِيعَهُمْ أَشْرَكُوا</p></td></tr></table></body></html>
