<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قَالَ" </quran>مُجِيبًا لِلْكُفَّارِ فِي قَوْلهمْ ارْجِعْ عَمَّا أَنْتَ فِيهِ وَفِي قِرَاءَة قُلْ <quran>"إنَّمَا أَدْعُو رَبِّي" </quran>إلَهًا</p></td></tr></table></body></html>
