<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنْ أَدْرِي أَقَرِيبٌ مَا تُوعَدُونَ أَمْ يَجْعَلُ لَهُ رَبِّي أَمَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قُلْ إنْ" </quran>أَيْ مَا <quran>"أَدْرِي أَقَرِيب مَا تُوعَدُونَ" </quran>مِنْ الْعَذَاب <quran>"أَمْ يَجْعَل لَهُ رَبِّي أَمَدًا" </quran>غَايَة وَأَجَلًا لَا يَعْلَمهُ إلَّا هُوَ</p></td></tr></table></body></html>
