<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَالِمُ الْغَيْبِ فَلَا يُظْهِرُ عَلَى غَيْبِهِ أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"عَالِم الْغَيْب" </quran>مَا غَابَ عَنْ الْعِبَاد <quran>"فَلَا يُظْهِر" </quran>يُطْلِع <quran>"عَلَى غَيْبه أَحَدًا" </quran>مِنْ النَّاس</p></td></tr></table></body></html>
