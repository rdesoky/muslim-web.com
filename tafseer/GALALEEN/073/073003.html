<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نِصْفَهُ أَوِ انْقُصْ مِنْهُ قَلِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"نِصْفه" </quran>بَدَل مِنْ قَلِيلًا وَقِلَّته بِالنَّظَرِ إلَى الْكُلّ <quran>"أَوْ اُنْقُصْ مِنْهُ" </quran>مِنْ النِّصْف <quran>"قَلِيلًا" </quran>إلَى الثُّلُث</p></td></tr></table></body></html>
