<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ زِدْ عَلَيْهِ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَوْ زِدْ عَلَيْهِ" </quran>إلَى الثُّلُثَيْنِ وَأَوْ لِلتَّخْيِيرِ <quran>"وَرَتِّلْ الْقُرْآن" </quran>تَثَبَّتْ فِي تِلَاوَته</p></td></tr></table></body></html>
