<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا سَنُلْقِي عَلَيْكَ قَوْلًا ثَقِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّا سَنُلْقِي عَلَيْك قَوْلًا" </quran>قُرْآنًا <quran>"ثَقِيلًا" </quran>مُهِيبًا أَوْ شَدِيدًا لِمَا فِيهِ مِنْ التَّكَالِيف</p></td></tr></table></body></html>
