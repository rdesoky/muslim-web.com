<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ نَاشِئَة اللَّيْل" </quran>الْقِيَام بَعْد النَّوْم <quran>"هِيَ أَشَدّ وَطْئًا" </quran>مُوَافَقَة السَّمْع لِلْقَلْبِ عَلَى تَفَهُّم الْقُرْآن <quran>"وَأَقْوَم قِيلًا" </quran>أَبْيَن قَوْلًا</p></td></tr></table></body></html>
