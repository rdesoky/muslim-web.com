<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ لَكَ فِي النَّهَارِ سَبْحًا طَوِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ لَك فِي النَّهَار سَبْحًا طَوِيلًا" </quran>تَصَرُّفًا فِي إشْغَالك لَا تَفْرُغ فِيهِ لِتِلَاوَةِ الْقُرْآن</p></td></tr></table></body></html>
