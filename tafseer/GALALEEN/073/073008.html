<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاذْكُرْ اسْم رَبّك" </quran>أَيْ قُلْ بِسْمِ اللَّه الرَّحْمَن الرَّحِيم فِي ابْتِدَاء قِرَاءَتك <quran>"وَتَبَتَّلْ" </quran>انْقَطِعْ <quran>"إلَيْهِ تَبْتِيلًا" </quran>مَصْدَر بَتَلَ جِيءَ بِهِ رِعَايَة لِلْفَوَاصِلِ وَهُوَ مَلْزُوم التَّبَتُّل</p></td></tr></table></body></html>
