<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p>هُوَ <quran>"رَبّ الْمَشْرِق وَالْمَغْرِب لَا إلَه إلَّا هُوَ فَاِتَّخِذْهُ وَكِيلًا" </quran>مُوَكِّلًا لَهُ أُمُورك</p></td></tr></table></body></html>
