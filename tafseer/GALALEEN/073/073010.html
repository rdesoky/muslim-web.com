<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاصْبِرْ عَلَى مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاصْبِرْ عَلَى مَا يَقُولُونَ" </quran>أَيْ كُفَّار مَكَّة مِنْ أَذَاهُمْ <quran>"وَاهْجُرْهُمْ هَجْرًا جَمِيلًا" </quran>لَا جَزَع فِيهِ وَهَذَا قَبْل الْأَمْر بِقِتَالِهِمْ</p></td></tr></table></body></html>
