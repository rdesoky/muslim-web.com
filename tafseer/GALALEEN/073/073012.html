<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ لَدَيْنَا أَنْكَالًا وَجَحِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ لَدَيْنَا أَنْكَالًا" </quran>قُيُودًا ثِقَالًا جَمْع نِكْل بِكَسْرِ النُّون <quran>"وَجَحِيمًا" </quran>نَارًا مُحْرِقَة</p></td></tr></table></body></html>
