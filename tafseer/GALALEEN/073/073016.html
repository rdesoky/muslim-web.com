<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَصَى فِرْعَوْنُ الرَّسُولَ فَأَخَذْنَاهُ أَخْذًا وَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَعَصَى فِرْعَوْن الرَّسُول فَأَخَذْنَاهُ أَخْذًا وَبِيلًا" </quran>شَدِيدًا</p></td></tr></table></body></html>
