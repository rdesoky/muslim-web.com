<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>السَّمَاءُ مُنْفَطِرٌ بِهِ كَانَ وَعْدُهُ مَفْعُولًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"السَّمَاء مُنْفَطِر" </quran>ذَات انْفِطَار أَيْ انْشِقَاق <quran>"بِهِ" </quran>بِذَلِكَ الْيَوْم لِشِدَّتِهِ <quran>"كَانَ وَعْده" </quran>تَعَالَى بِمَجِيءِ ذَلِكَ <quran>"مَفْعُولًا" </quran>أَيْ هُوَ كَائِن لَا مَحَالَة</p></td></tr></table></body></html>
