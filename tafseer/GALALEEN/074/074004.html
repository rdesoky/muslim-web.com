<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَثِيَابَكَ فَطَهِّرْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَثِيَابك فَطَهِّرْ" </quran>عَنْ النَّجَاسَة أَوْ قَصِّرْهَا خِلَاف جَرّ الْعَرَب ثِيَابهمْ خُيَلَاء فَرُبَّمَا أَصَابَتْهَا نَجَاسَة</p></td></tr></table></body></html>
