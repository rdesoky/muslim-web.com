<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالرُّجْزَ فَاهْجُرْ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالرُّجْز" </quran>فَسَّرَهُ النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ بِالْأَوْثَانِ <quran>"فَاهْجُرْ" </quran>أَيْ دُمْ عَلَى هَجْره</p></td></tr></table></body></html>
