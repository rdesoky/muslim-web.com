<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى الْكَافِرِينَ غَيْرُ يَسِيرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"عَلَى الْكَافِرِينَ غَيْر يَسِير" </quran>فِيهِ دَلَالَة عَلَى أَنَّهُ يَسِير عَلَى الْمُؤْمِنِينَ فِي عُسْره</p></td></tr></table></body></html>
