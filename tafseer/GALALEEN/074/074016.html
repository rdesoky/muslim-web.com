<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّهُ كَانَ لِآيَاتِنَا عَنِيدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>لَا أَزِيدهُ عَلَى ذَلِكَ <quran>"إنَّهُ كَانَ لِآيَاتِنَا" </quran>الْقُرْآن <quran>"عَنِيدًا" </quran>مُعَانِدًا</p></td></tr></table></body></html>
