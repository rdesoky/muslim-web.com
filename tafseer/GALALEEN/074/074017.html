<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَأُرْهِقُهُ صَعُودًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"سَأُرْهِقُهُ" </quran>أُكَلِّفهُ <quran>"صَعُودًا" </quran>مَشَقَّة مِنْ الْعَذَاب أَوْ جَبَلًا مِنْ نَار يَصْعَد فِيهِ ثُمَّ يَهْوِي أَبَدًا</p></td></tr></table></body></html>
