<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ فَكَّرَ وَقَدَّرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهُ فَكَّرَ" </quran>فِيمَا يَقُول فِي الْقُرْآن الَّذِي سَمِعَهُ مِنْ النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>"وَقَدَّرَ" </quran>فِي نَفْسه ذَلِكَ</p></td></tr></table></body></html>
