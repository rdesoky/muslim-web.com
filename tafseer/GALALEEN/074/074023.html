<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ أَدْبَرَ" </quran>عَنْ الْإِيمَان <quran>"وَاسْتَكْبَرَ" </quran>تَكَبَّرَ عَنْ اتِّبَاع النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
