<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَالَ إِنْ هَذَا إِلَّا سِحْرٌ يُؤْثَرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَقَالَ" </quran>فِيمَا جَاءَ بِهِ <quran>"إنْ" </quran>مَا <quran>"هَذَا إلَّا سِحْر يُؤْثَر" </quran>يُنْقَل عَنْ السَّحَرَة</p></td></tr></table></body></html>
