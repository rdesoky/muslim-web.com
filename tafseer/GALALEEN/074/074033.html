<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّيْلِ إِذْ أَدْبَرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَاللَّيْل إذَا" </quran>بِفَتْحِ الذَّال <quran>"أَدْبَرَ" </quran>جَاءَ بَعْد النَّهَار وَفِي قِرَاءَة إذَا أَدْبَرَ بِسُكُونِ الذَّال بَعْدهَا هَمْزَة أَيْ مَضَى</p></td></tr></table></body></html>
