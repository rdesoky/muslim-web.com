<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِمَنْ شَاءَ مِنْكُمْ أَنْ يَتَقَدَّمَ أَوْ يَتَأَخَّرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِمَنْ شَاءَ مِنْكُمْ" </quran>بَدَل مِنْ الْبَشَر <quran>"أَنْ يَتَقَدَّم" </quran>إلَى الْخَيْر أَوْ الْجَنَّة بِالْإِيمَانِ <quran>"أَوْ يَتَأَخَّر" </quran>إلَى الشَّرّ أَوْ النَّار بِالْكُفْرِ</p></td></tr></table></body></html>
