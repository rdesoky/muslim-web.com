<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا تَنْفَعُهُمْ شَفَاعَةُ الشَّافِعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا تَنْفَعهُمْ شَفَاعَة الشَّافِعِينَ" </quran>مِنْ الْمَلَائِكَة وَالْأَنْبِيَاء وَالصَّالِحِينَ وَالْمَعْنَى لَا شَفَاعَة لَهُمْ</p></td></tr></table></body></html>
