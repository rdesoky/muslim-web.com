<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَهُمْ عَنِ التَّذْكِرَةِ مُعْرِضِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَمَا" </quran>مُبْتَدَأ <quran>"لَهُمْ" </quran>خَبَره مُتَعَلِّق بِمَحْذُوفٍ انْتَقَلَ ضَمِيره إلَيْهِ <quran>"عَنْ التَّذْكِرَة مُعْرِضِينَ" </quran>حَال مِنْ الضَّمِير وَالْمَعْنَى أَيّ شَيْء حَصَلَ لَهُمْ فِي إعْرَاضهمْ عَنْ الِاتِّعَاظ</p></td></tr></table></body></html>
