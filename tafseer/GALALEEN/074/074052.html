<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ يُرِيدُ كُلُّ امْرِئٍ مِنْهُمْ أَنْ يُؤْتَى صُحُفًا مُنَشَّرَةً</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ يُرِيد كُلّ امْرِئٍ مِنْهُمْ أَنْ يُؤْتَى صُحُفًا مُنَشَّرَة" </quran>أَيْ مِنْ اللَّه تَعَالَى بِاتِّبَاعِ النَّبِيّ كَمَا قَالُوا : لَنْ نُؤْمِن لَك حَتَّى تُنَزِّل عَلَيْنَا كِتَابًا نَقْرَؤُهُ</p></td></tr></table></body></html>
