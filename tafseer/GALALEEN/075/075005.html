<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ يُرِيدُ الْإِنْسَانُ لِيَفْجُرَ أَمَامَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ يُرِيد الْإِنْسَان لِيَفْجُر" </quran>اللَّام زَائِدَة وَنَصَبَهُ بِأَنْ مُقَدَّرَة أَيْ أَنْ يُكَذِّب <quran>"أَمَامه" </quran>أَيْ يَوْم الْقِيَامَة دَلَّ عَلَيْهِ :</p></td></tr></table></body></html>
