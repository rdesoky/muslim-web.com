<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا بَرِقَ الْبَصَرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَإِذَا بَرِقَ الْبَصَر" </quran>بِكَسْرِ الرَّاء وَفَتْحهَا فِي بَرِقَ بِمَعْنَى دَهَشَ وَتَحَيَّرَ لِمَا رَأَى مِمَّا كَانَ يُكَذِّبهُ</p></td></tr></table></body></html>
