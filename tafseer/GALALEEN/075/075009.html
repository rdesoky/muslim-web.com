<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجُمِعَ الشَّمْسُ وَالْقَمَرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجُمِعَ الشَّمْس وَالْقَمَر" </quran>فَطَلَعَا مِنْ الْمَغْرِب أَوْ ذَهَبَ ضَوْءُهُمَا وَذَلِكَ فِي يَوْم الْقِيَامَة</p></td></tr></table></body></html>
