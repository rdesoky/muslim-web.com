<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلِ الْإِنْسَانُ عَلَى نَفْسِهِ بَصِيرَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"بَلْ الْإِنْسَان عَلَى نَفْسه بَصِيرَة" </quran>شَاهِد تَنْطِق جَوَارِحه بِعَمَلِهِ وَالْهَاء لِلْمُبَالَغَةِ فَلَا بُدّ مِنْ جَزَائِهِ</p></td></tr></table></body></html>
