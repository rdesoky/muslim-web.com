<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ أَلْقَى مَعَاذِيرَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَلَوْ أَلْقَى مَعَاذِيره" </quran>جَمْع مَعْذِرَة عَلَى غَيْر قِيَاس أَيْ لَوْ جَاءَ بِكُلِّ مَعْذِرَة مَا قُبِلَتْ مِنْهُ</p></td></tr></table></body></html>
