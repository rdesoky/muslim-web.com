<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عَلَيْنَا جَمْعَهُ وَقُرْآنَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ عَلَيْنَا جَمْعه" </quran>فِي صَدْرك <quran>"وَقُرْآنه" </quran>قِرَاءَتك إيَّاهُ أَيْ جَرَيَانه عَلَى لِسَانك</p></td></tr></table></body></html>
