<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كَلَّا" </quran>اسْتِفْتَاح بِمَعْنَى أَلَا <quran>"بَلْ تُحِبُّونَ الْعَاجِلَة" </quran>الدُّنْيَا بِالْيَاءِ وَالتَّاء فِي الْفِعْلَيْنِ</p></td></tr></table></body></html>
