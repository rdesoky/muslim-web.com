<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْتَفَّتِ السَّاقُ بِالسَّاقِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَالْتَفَّتْ السَّاق بِالسَّاقِ" </quran>أَيْ إحْدَى سَاقَيْهِ بِالْأُخْرَى عِنْد الْمَوْت أَوْ الْتَفَّتْ شِدَّة فِرَاق الدُّنْيَا بِشِدَّةِ إقْبَال الْآخِرَة</p></td></tr></table></body></html>
