<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى رَبِّكَ يَوْمَئِذٍ الْمَسَاقُ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إلَى رَبّك يَوْمئِذٍ الْمَسَاق" </quran>أَيْ السَّوْق وَهَذَا يَدُلّ عَلَى الْعَامِل فِي إذَا وَالْمَعْنَى إذَا بَلَغَتْ النَّفْس الْحُلْقُوم تُسَاق إلَى حُكْم رَبّهَا</p></td></tr></table></body></html>
