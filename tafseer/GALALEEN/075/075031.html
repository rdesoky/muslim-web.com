<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا صَدَّقَ وَلَا صَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَلَا صَدَّقَ" </quran>الْإِنْسَان <quran>"وَلَا صَلَّى" </quran>أَيْ لَمْ يُصَدِّق وَلَمْ يُصَلِّ</p></td></tr></table></body></html>
