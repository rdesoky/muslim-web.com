<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ ذَهَبَ إِلَى أَهْلِهِ يَتَمَطَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ ذَهَبَ إلَى أَهْله يَتَمَطَّى" </quran>يَتَبَخْتَر فِي مِشْيَته إعْجَابًا</p></td></tr></table></body></html>
