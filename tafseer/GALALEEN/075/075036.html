<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُ الْإِنْسَانُ أَنْ يُتْرَكَ سُدًى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَيَحْسَبُ" </quran>يَظُنّ <quran>"الْإِنْسَان أَنْ يُتْرَك سُدًى" </quran>هَمْلًا لَا يُكَلَّف بِالشَّرَائِعِ لَا يَحْسَب ذَلِكَ</p></td></tr></table></body></html>
