<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ يَكُ نُطْفَةً مِنْ مَنِيٍّ يُمْنَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَمْ يَكُ" </quran>أَيْ كَانَ <quran>"نُطْفَة مِنْ مَنِيّ يُمْنَى" </quran>بِالْيَاءِ وَالتَّاء تُصَبّ فِي الرَّحِم</p></td></tr></table></body></html>
