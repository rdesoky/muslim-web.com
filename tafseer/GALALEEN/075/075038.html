<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>"ثُمَّ كَانَ" </quran>الْمَنِيّ <quran>"عَلَقَة فَخَلَقَ" </quran>اللَّه مِنْهَا الْإِنْسَان <quran>"فَسَوَّى" </quran>أَيْ عَدَّلَ أَعْضَاءَهُ</p></td></tr></table></body></html>
