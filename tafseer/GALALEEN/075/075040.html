<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَيْسَ ذَلِكَ بِقَادِرٍ عَلَى أَنْ يُحْيِيَ الْمَوْتَى</font></td></tr><tr><td align=right dir=rtl><p><quran>"أَلَيْسَ ذَلِكَ" </quran>الْفَعَّال لِهَذِهِ الْأَشْيَاء <quran>"بِقَادِرٍ عَلَى أَنْ يُحْيِيَ الْمَوْتَى" </quran>قَالَ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ بَلَى</p></td></tr></table></body></html>
