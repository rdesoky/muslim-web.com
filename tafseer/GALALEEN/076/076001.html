<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلْ أَتَى عَلَى الْإِنْسَانِ حِينٌ مِنَ الدَّهْرِ لَمْ يَكُنْ شَيْئًا مَذْكُورًا</font></td></tr><tr><td align=right dir=rtl><p>سورة الإنسان [مكية أو مدنية وآياتها إحدى وثلاثون"</p><p><quran>"هل" </quran>قد <quran>"أتى على الإنسان" </quran>آدم <quran>"حين من الدهر" </quran>أربعون سنة <quran>"لم يكن" </quran>فيه <quran>"شيئا مذكورا" </quran>كان فيه مصورا من طين لا يذكر أو المراد بالإنسان الجنس وبالحين مدة الحمل</p></td></tr></table></body></html>
