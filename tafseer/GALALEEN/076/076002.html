<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا خَلَقْنَا الْإِنْسَانَ مِنْ نُطْفَةٍ أَمْشَاجٍ نَبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنا خلقنا الإنسان" </quran>الجنس <quran>"من نطفة أمشاج" </quran>أخلاط, أي من ماء الرجل وماء المرأة المختلطين الممتزجين <quran>"نبتليه" </quran>نختبره بالتكليف والجملة مستأنفة أو حال مقدرة, أي مريدين ابتلاءه حين تأهله <quran>"فجعلناه" </quran>بسبب ذلك</p></td></tr></table></body></html>
