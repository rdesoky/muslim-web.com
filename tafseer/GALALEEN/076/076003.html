<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنا هديناه السبيل" </quran>بينا له طريق الهدى ببعث الرسل <quran>"إما شاكرا" </quran>أي مؤمنا <quran>"وإما كفورا" </quran>حالان من المفعول, أي بينا له في حال شكره أو كفره المقدرة وإما لتفصيل الأحوال</p></td></tr></table></body></html>
