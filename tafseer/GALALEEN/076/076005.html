<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْأَبْرَارَ يَشْرَبُونَ مِنْ كَأْسٍ كَانَ مِزَاجُهَا كَافُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إن الأبرار" </quran>جمع بر أو بار وهم المطيعون <quran>"يشربون من كأس" </quran>هو إناء شرب الخمر وهي فيه والمراد من خمر تسمية للحال باسم المحل ومن للتبعيض <quran>"كان مزاجها" </quran>ما تمزج به</p></td></tr></table></body></html>
