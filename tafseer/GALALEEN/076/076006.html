<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"عينا" </quran>بدل من كافورا فيها رائحته <quran>"يشرب بها" </quran>منها <quran>"عباد الله" </quran>أولياؤه <quran>"يفجرونها تفجيرا" </quran>يقودونها حيث شاءوا من منازلهم</p></td></tr></table></body></html>
