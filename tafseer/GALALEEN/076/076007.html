<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يوفون بالنذر" </quran>في طاعة الله <quran>"ويخافون يوما كان شره مستطيرا" </quran>منتشرا</p></td></tr></table></body></html>
