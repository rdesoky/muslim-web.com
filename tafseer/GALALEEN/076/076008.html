<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُطْعِمُونَ الطَّعَامَ عَلَى حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ويطعمون الطعام على حبه" </quran>أي الطعام وشهوتهم له <quran>"مسكينا" </quran>فقيرا <quran>"ويتيما" </quran>لا أب له <quran>"وأسيرا" </quran>يعني المحبوس بحق</p></td></tr></table></body></html>
