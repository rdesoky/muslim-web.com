<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنْكُمْ جَزَاءً وَلَا شُكُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنما نطعمكم لوجه الله" </quran>لطلب ثوابه <quran>"لا نريد منكم جزاء ولا شكورا" </quran>شكرا فيه علة الإطعام وهل تكلموا بذلك أو علمه الله منهم فأثنى عليهم به, قولان</p></td></tr></table></body></html>
