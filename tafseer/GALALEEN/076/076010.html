<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَخَافُ مِنْ رَبِّنَا يَوْمًا عَبُوسًا قَمْطَرِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنا نخاف من ربنا يوما عبوسا" </quran>تكلح الوجوه فيه أي كريه المنظر لشدته <quran>"قمطريرا" </quran>شديدا في ذلك</p></td></tr></table></body></html>
