<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَقَاهُمُ اللَّهُ شَرَّ ذَلِكَ الْيَوْمِ وَلَقَّاهُمْ نَضْرَةً وَسُرُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فوقاهم الله شر ذلك اليوم ولقاهم" </quran>أعطاهم <quran>"نضرة" </quran>حسنا وإضاءة في وجوههم</p></td></tr></table></body></html>
