<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَزَاهُمْ بِمَا صَبَرُوا جَنَّةً وَحَرِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وجزاهم بما صبروا" </quran>بصبرهم عن المعصية <quran>"جنة" </quran>أدخلوها <quran>"وحريرا" </quran>البسوه</p></td></tr></table></body></html>
