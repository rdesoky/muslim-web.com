<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ لَا يَرَوْنَ فِيهَا شَمْسًا وَلَا زَمْهَرِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"متكئين" </quran>حال من مرفوع أدخلوها المقدر <quran>"فيها على الأرائك" </quran>السرر في الحجال <quran>"لا يرون" </quran>لا يجدون حال ثانية <quran>"فيها شمسا ولا زمهريرا" </quran>لا حرا ولا بردا وقيل الزمهرير القمر فهي مضيئة من غير شمس ولا قمر</p></td></tr></table></body></html>
