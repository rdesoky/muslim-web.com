<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَدَانِيَةً عَلَيْهِمْ ظِلَالُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ودانية" </quran>قريبة عطف على محل لا يرون, أي غير رائين <quran>"عليهم" </quran>منهم <quran>"ظلالها" </quran>شجرها <quran>"وذللت قطوفها تذليلا" </quran>أدنيت ثمارها فينالها القائم والقاعد والمضطجع</p></td></tr></table></body></html>
