<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُطَافُ عَلَيْهِمْ بِآنِيَةٍ مِنْ فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"ويطاف عليهم" </quran>فيها <quran>"بآنية من فضة وأكواب" </quran>أقداح بلا عرى</p></td></tr></table></body></html>
