<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَوَارِيرَ مِنْ فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"قواريرا من فضة" </quran>أي أنها من فضة يرى باطنها من ظاهرها كالزجاج <quran>"قدروها" </quran>أي الطائفون <quran>"تقديرا" </quran>على قدر ري الشاربين من غير زيادة ولا نقص وذلك ألذ الشراب</p></td></tr></table></body></html>
