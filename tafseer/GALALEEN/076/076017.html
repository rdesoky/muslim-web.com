<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُسْقَوْنَ فِيهَا كَأْسًا كَانَ مِزَاجُهَا زَنْجَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ويسقون فيها كأسا" </quran>خمرا <quran>"كان مزاجها" </quran>ما تمزج به <quran>"زنجبيلا" </quran>يعنى أن ماءها كالزنجبيل الذى تستلذ به العرب</p></td></tr></table></body></html>
