<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَيْنًا فِيهَا تُسَمَّى سَلْسَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"عينا" </quran>بدل من زنجبيلا <quran>"فيها تسمى سلسبيلا" </quran>سهل المساغ في الحلق</p></td></tr></table></body></html>
