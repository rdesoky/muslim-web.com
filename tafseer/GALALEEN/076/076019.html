<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَنْثُورًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ويطوف عليهم ولدان مخلدون" </quran>بصفة الولدان لا يشيبون <quran>"إذا رأيتهم حسبتهم" </quran>لحسنهم وانتشارهم في الخدمة <quran>"لؤلؤا منثورا" </quran>من سلكه أو من صدفه وهو أحسن منه في غير ذلك</p></td></tr></table></body></html>
