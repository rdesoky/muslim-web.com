<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وإذا رأيت ثم" </quran>أي وجدت الرؤية منك في الجنة <quran>"رأيت" </quran>جواب إذا <quran>"نعيما" </quran>لا يوصف <quran>"وملكا كبيرا" </quran>واسعا لا غاية له</p></td></tr></table></body></html>
