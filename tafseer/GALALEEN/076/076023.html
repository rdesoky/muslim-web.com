<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنْزِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنا نحن" </quran>تأكيد لاسم إن أو فصل <quran>"نزلنا عليك القرآن تنزيلا" </quran>خبر إن أي فصلناه ولم ننزله جملة واحدة</p></td></tr></table></body></html>
