<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"واذكر اسم ربك" </quran>في الصلاة <quran>"بكرة وأصيلا" </quran>يعني الفجر والظهر والعصر</p></td></tr></table></body></html>
