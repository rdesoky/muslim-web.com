<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"ومن الليل فاسجد له" </quran>يعني المغرب والعشاء <quran>"وسبحه ليلا طويلا" </quran>صل التطوع فيه كما تقدم من ثلثيه أو نصفه أو ثلثه</p></td></tr></table></body></html>
