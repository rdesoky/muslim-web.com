<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذِهِ تَذْكِرَةٌ فَمَنْ شَاءَ اتَّخَذَ إِلَى رَبِّهِ سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"إن هذه" </quran>السورة <quran>"تذكرة" </quran>عظة للخلق <quran>"فمن شاء اتخذ إلى ربه سبيلا" </quran>طريقا بالطاعة</p></td></tr></table></body></html>
