<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا تَشَاءُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وما تشاءون" </quran>بالتاء والياء اتخاذ السبيل بالطاعة <quran>"إلا أن يشاء الله" </quran>ذلك <quran>"إن الله كان عليما" </quran>بخلقه <quran>"حكيما" </quran>في فعله</p></td></tr></table></body></html>
