<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُدْخِلُ مَنْ يَشَاءُ فِي رَحْمَتِهِ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"يدخل من يشاء في رحمته" </quran>جنته وهم المؤمنون <quran>"والظالمين" </quran>ناصبه فعل مقدر, أي أعد يفسره <quran>"أعد لهم عذابا أليما" </quran>مؤلما وهم الكافرون</p></td></tr></table></body></html>
