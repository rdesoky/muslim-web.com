<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْمُرْسَلَاتِ عُرْفًا</font></td></tr><tr><td align=right dir=rtl><p>سُورَة الْمُرْسَلَات [ مَكِّيَّة وَآيَاتهَا خَمْسُونَ ]</p><p><quran>"وَالْمُرْسَلَات عُرْفًا" </quran>أَيْ الرِّيَاح مُتَتَابِعَة كَعُرْفِ الْفَرَس يَتْلُو بَعْضه بَعْضًا وَنَصْبه عَلَى الْحَال</p></td></tr></table></body></html>
