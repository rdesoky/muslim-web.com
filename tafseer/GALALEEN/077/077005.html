<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْمُلْقِيَاتِ ذِكْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَالْمُلْقِيَات ذِكْرًا" </quran>أَيْ الْمَلَائِكَة تَنْزِل بِالْوَحْيِ إلَى الْأَنْبِيَاء وَالرُّسُل يُلْقُونَ الْوَحْي إلَى الْأُمَم</p></td></tr></table></body></html>
