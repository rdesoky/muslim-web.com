<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عُذْرًا أَوْ نُذْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"عُذْرًا أَوْ نُذْرًا" </quran>أَيْ لِلْإِعْذَارِ وَالْإِنْذَار مِنْ اللَّه تَعَالَى وَفِي قِرَاءَة بِضَمِّ ذَال نُذْرًا وَقُرِئَ بِضَمِّ ذَال عُذْرًا</p></td></tr></table></body></html>
