<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا تُوعَدُونَ لَوَاقِعٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّمَا تُوعَدُونَ" </quran>أَيْ يَا كُفَّار مَكَّة مِنْ الْبَعْث وَالْعَذَاب <quran>"لَوَاقِع" </quran>كَائِن لَا مَحَالَة</p></td></tr></table></body></html>
