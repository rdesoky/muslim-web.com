<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَوْمِ الْفَصْلِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لِيَوْمِ الْفَصْل" </quran>بَيْن الْخَلْق وَيُؤْخَذ مِنْهُ جَوَاب إذَا أَيْ وَقَعَ الْفَصْل بَيْن الْخَلَائِق</p></td></tr></table></body></html>
