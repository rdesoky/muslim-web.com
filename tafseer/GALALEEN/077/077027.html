<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْنَا فِيهَا رَوَاسِيَ شَامِخَاتٍ وَأَسْقَيْنَاكُمْ مَاءً فُرَاتًا</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَجَعَلْنَا فِيهَا رَوَاسِي شَامِخَات" </quran>جِبَالًا مُرْتَفِعَات <quran>"وَأَسْقَيْنَاكُمْ مَاء فُرَاتًا" </quran>عَذْبًا</p></td></tr></table></body></html>
