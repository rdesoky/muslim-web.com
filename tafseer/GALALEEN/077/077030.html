<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْطَلِقُوا إِلَى ظِلٍّ ذِي ثَلَاثِ شُعَبٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"انْطَلِقُوا إلَى ظِلّ ذِي ثَلَاث شُعَب" </quran>هُوَ دُخَان جَهَنَّم إذَا ارْتَفَعَ افْتَرَقَ ثَلَاث فِرَق لِعِظَمِهِ</p></td></tr></table></body></html>
