<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا ظَلِيلٍ وَلَا يُغْنِي مِنَ اللَّهَبِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"لَا ظَلِيل" </quran>كَنِين يُظِلّهُمْ مِنْ حَرّ ذَلِكَ الْيَوْم <quran>"وَلَا يُغْنِي" </quran>يَرُدّ عَنْهُمْ شَيْئًا <quran>"مِنْ اللَّهَب" </quran>النَّار</p></td></tr></table></body></html>
