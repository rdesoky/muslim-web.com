<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهَا تَرْمِي بِشَرَرٍ كَالْقَصْرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّهَا" </quran>أَيْ النَّار <quran>"تَرْمِي بِشَرَرٍ" </quran>هُوَ مَا تَطَايَرَ مِنْهَا <quran>"كَالْقَصْرِ" </quran>مِنْ الْبِنَاء فِي عِظَمه وَارْتِفَاعه</p></td></tr></table></body></html>
