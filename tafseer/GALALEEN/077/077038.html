<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا يَوْمُ الْفَصْلِ جَمَعْنَاكُمْ وَالْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"هَذَا يَوْم الْفَصْل جَمَعْنَاكُمْ" </quran>أَيّهَا الْمُكَذِّبُونَ مِنْ هَذِهِ الْأُمَّة <quran>"وَالْأَوَّلِينَ" </quran>مِنْ الْمُكَذِّبِينَ قَبْلكُمْ فَتُحَاسَبُونَ وَتُعَذَّبُونَ جَمِيعًا</p></td></tr></table></body></html>
