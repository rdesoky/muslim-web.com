<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي ظِلَالٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>"إنَّ الْمُتَّقِينَ فِي ظِلَال" </quran>أَيْ تَكَاثُف أَشْجَار إذْ لَا شَمْس يُظِلّ مِنْ حَرّهَا <quran>"وَعُيُون" </quran>نَابِعَة مِنْ الْمَاء</p></td></tr></table></body></html>
