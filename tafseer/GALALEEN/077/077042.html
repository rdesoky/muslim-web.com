<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَوَاكِهَ مِمَّا يَشْتَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"وَفَوَاكِه مِمَّا يَشْتَهُونَ" </quran>فِيهِ إعْلَام بِأَنَّ الْمَأْكَل وَالْمَشْرَب فِي الْجَنَّة بِحَسَبِ شَهَوَاتهمْ بِخِلَافِ الدُّنْيَا فَبِحَسَبِ مَا يَجِد النَّاس فِي الْأَغْلَب وَيُقَال لَهُمْ :</p></td></tr></table></body></html>
