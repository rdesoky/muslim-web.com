<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا كُنْتُمْ تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كُلُوا وَاشْرَبُوا هَنِيئًا" </quran>حَال أَيْ مُتَهَنِّئِينَ <quran>"بِمَا كُنْتُمْ تَعْمَلُونَ" </quran>مِنْ الطَّاعَة</p></td></tr></table></body></html>
