<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُوا وَتَمَتَّعُوا قَلِيلًا إِنَّكُمْ مُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"كُلُوا وَتَمَتَّعُوا" </quran>خِطَاب لِلْكُفَّارِ فِي الدُّنْيَا <quran>"قَلِيلًا" </quran>مِنْ الزَّمَان وَغَايَته إلَى الْمَوْت وَفِي هَذَا تَهْدِيد لَهُمْ</p></td></tr></table></body></html>
