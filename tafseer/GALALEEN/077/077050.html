<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبِأَيِّ حَدِيثٍ بَعْدَهُ يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>"فَبِأَيِّ حَدِيث بَعْده" </quran>أَيْ الْقُرْآن <quran>"يُؤْمِنُونَ" </quran>أَيْ لَا يَمْكَن إيمَانهمْ بِغَيْرِهِ مِنْ كُتُب اللَّه بَعْد تَكْذِيبهمْ بِهِ لِاشْتِمَالِهِ عَلَى الْإِعْجَاز الَّذِي لَمْ يَشْتَمِل عَلَيْهِ غَيْره .</p></td></tr></table></body></html>
