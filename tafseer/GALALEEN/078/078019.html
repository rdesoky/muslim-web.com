<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَفُتِحَتْ السَّمَاء " </quran>بِالتَّشْدِيدِ وَالتَّخْفِيف شُقِّقَتْ لِنُزُولِ الْمَلَائِكَة <quran>" فَكَانَتْ أَبْوَابًا " </quran>ذَات أَبْوَاب</p></td></tr></table></body></html>
