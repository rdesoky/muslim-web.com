<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَابِثِينَ فِيهَا أَحْقَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَابِثِينَ " </quran>حَال مُقَدَّرَة , أَيْ مُقَدَّرًا لُبْثهمْ <quran>" فِيهَا أَحْقَابًا " </quran>دُهُورًا لَا نِهَايَة لَهَا جَمْع حُقْب بِضَمِّ أَوَّله</p></td></tr></table></body></html>
