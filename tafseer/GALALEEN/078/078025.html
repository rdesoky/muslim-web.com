<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا حَمِيمًا وَغَسَّاقًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِلَّا " </quran>لَكِنْ <quran>" حَمِيمًا " </quran>مَاء حَارًّا غَايَة الْحَرَارَة <quran>" وَغَسَّاقًا " </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد مَا يَسِيل مِنْ صَدِيد أَهْل النَّار فَإِنَّهُمْ يَذُوقُونَهُ جُوزُوا بِذَلِكَ</p></td></tr></table></body></html>
