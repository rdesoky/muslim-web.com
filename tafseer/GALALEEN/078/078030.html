<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذُوقُوا فَلَنْ نَزِيدَكُمْ إِلَّا عَذَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَذُوقُوا " </quran>أَيْ فَيُقَال لَهُمْ فِي الْآخِرَة عِنْد وُقُوع الْعَذَاب ذُوقُوا جَزَاءَكُمْ <quran>" فَلَنْ نَزِيدكُمْ إِلَّا عَذَابًا " </quran>فَوْق عَذَابكُمْ</p></td></tr></table></body></html>
