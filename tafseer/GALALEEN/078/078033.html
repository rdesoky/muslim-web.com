<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَوَاعِبَ أَتْرَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَكَوَاعِب " </quran>جَوَارِي تَكَعَّبَتْ ثُدِيّهنَّ جَمْع كَاعِب <quran>" أَتْرَابًا " </quran>عَلَى سِنّ وَاحِد , جَمْع تِرْب بِكَسْرِ التَّاء وَسُكُون الرَّاء</p></td></tr></table></body></html>
