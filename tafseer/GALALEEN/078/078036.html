<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>جَزَاءً مِنْ رَبِّكَ عَطَاءً حِسَابًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" جَزَاء مِنْ رَبّك " </quran>أَيْ جَزَاهُمْ اللَّه بِذَلِكَ جَزَاء <quran>" عَطَاء " </quran>بَدَل مِنْ جَزَاء <quran>" حِسَابًا " </quran>أَيْ كَثِيرًا , مِنْ قَوْلهمْ : أَعْطَانِي فَأَحْسَبنِي , أَيْ أَكْثَر عَلَيَّ حَتَّى قُلْت حَسْبِي</p></td></tr></table></body></html>
