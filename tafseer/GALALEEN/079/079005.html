<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْمُدَبِّرَاتِ أَمْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَالْمُدَبِّرَات أَمْرًا " </quran>الْمَلَائِكَة تُدَبِّر أَمْر الدُّنْيَا , أَيْ تَنْزِل بِتَدْبِيرِهِ , وَجَوَاب هَذِهِ الْأَقْسَام مَحْذُوف , أَيْ لَتُبْعَثُنَّ يَا كُفَّار مَكَّة وَهُوَ عَامِل فِي " يَوْم تَرْجُف الرَّاجِفَة "</p></td></tr></table></body></html>
