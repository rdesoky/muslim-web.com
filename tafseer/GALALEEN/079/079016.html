<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ نَادَاهُ رَبُّهُ بِالْوَادِي الْمُقَدَّسِ طُوًى</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِذْ نَادَاهُ رَبّه بِالْوَادِ الْمُقَدَّس طُوًى " </quran>اِسْم الْوَادِي بِالتَّنْوِينِ وَتَرْكه</p></td></tr></table></body></html>
