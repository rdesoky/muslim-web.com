<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقُلْ هَلْ لَكَ إِلَى أَنْ تَزَكَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَقُلْ هَلْ لَك " </quran>أَدْعُوك <quran>" إِلَى أَنْ تَزَكَّى " </quran>وَفِي قِرَاءَة بِتَشْدِيدِ الزَّاي بِإِدْغَامِ التَّاء الثَّانِيَة فِي الْأَصْل فِيهَا : تَتَطَهَّر مِنْ الشِّرْك بِأَنْ تَشْهَد أَنْ لَا إِلَه إِلَّا اللَّه</p></td></tr></table></body></html>
