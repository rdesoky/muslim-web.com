<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَخْرَجَ " </quran>حَال بِإِضْمَارِ قَدْ أَيْ مُخْرِجًا <quran>" مِنْهَا مَاءَهَا " </quran>بِتَفْجِيرِ عُيُونهَا <quran>" وَمَرْعَاهَا " </quran>مَا تَرْعَاهُ النَّعَم مِنْ الشَّجَر وَالْعُشْب وَمَا يَأْكُلهُ النَّاس مِنْ الْأَقْوَات وَالثِّمَار , وَإِطْلَاق الْمَرْعَى عَلَيْهِ اِسْتِعَارَة</p></td></tr></table></body></html>
