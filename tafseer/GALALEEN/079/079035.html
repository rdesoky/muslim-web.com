<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَتَذَكَّرُ الْإِنْسَانُ مَا سَعَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" يَوْم يَتَذَكَّر الْإِنْسَان " </quran>بَدَل مِنْ إِذَا <quran>" مَا سَعَى " </quran>فِي الدُّنْيَا مِنْ خَيْر وَشَرّ</p></td></tr></table></body></html>
