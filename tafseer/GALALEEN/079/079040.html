<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَمَّا مَنْ خَافَ مَقَام رَبّه " </quran>قِيَامه بَيْن يَدَيْهِ <quran>" وَنَهَى النَّفْس " </quran>الْأَمَّارَة <quran>" عَنْ الْهَوَى " </quran>الْمُرْدِي بِاتِّبَاعِ الشَّهَوَات</p></td></tr></table></body></html>
