<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَإِنَّ الْجَنَّة هِيَ الْمَأْوَى " </quran>وَحَاصِل الْجَوَاب : فَالْعَاصِي فِي النَّار وَالْمُطِيع فِي الْجَنَّة</p></td></tr></table></body></html>
