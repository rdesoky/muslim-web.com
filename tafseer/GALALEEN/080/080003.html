<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا يُدْرِيك " </quran>يُعْلِمك <quran>" لَعَلَّهُ يَزَّكَّى " </quran>فِيهِ إِدْغَام التَّاء فِي الْأَصْل فِي الزَّاي , أَيْ يَتَطَهَّر مِنْ الذُّنُوب بِمَا يَسْمَع مِنْك</p></td></tr></table></body></html>
