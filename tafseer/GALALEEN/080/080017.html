<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُتِلَ الْإِنْسَانُ مَا أَكْفَرَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" قُتِلَ الْإِنْسَان " </quran>لُعِنَ الْكَافِر <quran>" مَا أَكْفَرَهُ " </quran>اِسْتِفْهَام تَوْبِيخ , أَيْ مَا حَمَلَهُ عَلَى الْكُفْر</p></td></tr></table></body></html>
