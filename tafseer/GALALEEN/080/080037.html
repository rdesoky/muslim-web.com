<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِكُلِّ امْرِئٍ مِنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لِكُلِّ اِمْرِئٍ مِنْهُمْ يَوْمئِذٍ شَأْن يُغْنِيه " </quran>حَال يَشْغَلهُ عَنْ شَأْن غَيْره , أَيْ اِشْتَغَلَ كُلّ وَاحِد بِنَفْسِهِ</p></td></tr></table></body></html>
