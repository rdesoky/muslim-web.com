<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا الْعِشَارُ عُطِّلَتْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَإِذَا الْعِشَار " </quran>النُّوق الْحَوَامِل <quran>" عُطِّلَتْ " </quran>تُرِكَتْ بِلَا رَاعٍ أَوْ بِلَا حَلْب لِمَا دَهَاهُمْ مِنْ الْأَمْر , وَإِنْ لَمْ يَكُنْ مَال أَعْجَب إِلَيْهِمْ مِنْهَا</p></td></tr></table></body></html>
