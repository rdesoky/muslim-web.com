<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلِمَتْ نَفْسٌ مَا أَحْضَرَتْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" عَلِمَتْ نَفْس " </quran>كُلّ نَفْس وَقْت هَذِهِ الْمَذْكُورَات وَهُوَ يَوْم الْقِيَامَة <quran>" مَا أَحْضَرَتْ " </quran>مِنْ خَيْر وَشَرّ</p></td></tr></table></body></html>
