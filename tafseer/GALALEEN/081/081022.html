<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا صَاحِبُكُمْ بِمَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا صَاحِبكُمْ " </quran>مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ عُطِفَ عَلَى إِنَّهُ إِلَى آخِر الْمُقْسَم عَلَيْهِ <quran>" بِمَجْنُونٍ " </quran>كَمَا زَعَمْتُمْ</p></td></tr></table></body></html>
