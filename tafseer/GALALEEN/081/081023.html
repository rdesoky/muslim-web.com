<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَلَقَدْ رَآهُ " </quran>رَأَى مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ جِبْرِيل عَلَى صُورَته الَّتِي خُلِقَ عَلَيْهَا <quran>" بِالْأُفُقِ الْمُبِين " </quran>الْبَيِّن وَهُوَ الْأَعْلَى بِنَاحِيَةِ الْمَشْرِق</p></td></tr></table></body></html>
