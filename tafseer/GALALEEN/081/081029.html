<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا تَشَاءُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا تَشَاءُونَ " </quran>الِاسْتِقَامَة عَلَى الْحَقّ <quran>" إِلَّا أَنْ يَشَاء اللَّه رَبّ الْعَالَمِينَ " الْخَلَائِق اِسْتِقَامَتكُمْ عَلَيْهِ .</p></td></tr></table></body></html>
