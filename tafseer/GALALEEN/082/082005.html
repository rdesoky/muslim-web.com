<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلِمَتْ نَفْسٌ مَا قَدَّمَتْ وَأَخَّرَتْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" عَلِمَتْ نَفْس " </quran>أَيْ كُلّ نَفْس وَقْت هَذِهِ الْمَذْكُورَات وَهُوَ يَوْم الْقِيَامَة <quran>" مَا قَدَّمَتْ " </quran>مِنْ الْأَعْمَال <quran>" و " </quran>مَا <quran>" أَخَّرَتْ " </quran>مِنْهَا فَلَمْ تَعْمَلهُ</p></td></tr></table></body></html>
