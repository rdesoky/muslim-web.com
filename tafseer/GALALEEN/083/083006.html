<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" يَوْم " </quran>بَدَل مِنْ مَحَلّ لِيَوْمٍ فَنَاصِبه مَبْعُوثُونَ <quran>" يَقُوم النَّاس " </quran>مِنْ قُبُورهمْ <quran>" لِرَبِّ الْعَالَمِينَ " </quran>الْخَلَائِق لِأَجْلِ أَمْره وَحِسَابه وَجَزَائِهِ</p></td></tr></table></body></html>
