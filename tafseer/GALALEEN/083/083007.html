<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" كَلَّا " </quran>حَقًّا <quran>" إِنَّ كِتَاب الْفُجَّار " </quran>أَيْ كِتَاب أَعْمَال الْكُفَّار <quran>" لَفِي سِجِّين " </quran>قِيلَ هُوَ كِتَاب جَامِع لِأَعْمَالِ الشَّيَاطِين وَالْكَفَرَة , وَقِيلَ هُوَ مَكَان أَسْفَل الْأَرْض السَّابِعَة وَهُوَ مَحَلّ إِبْلِيس وَجُنُوده</p></td></tr></table></body></html>
