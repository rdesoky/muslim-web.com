<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خِتَامُهُ مِسْكٌ وَفِي ذَلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" خِتَامه مِسْك " </quran>أَيْ آخِر شُرْبه تَفُوح مِنْهُ رَائِحَة الْمِسْك <quran>" وَفِي ذَلِكَ فَلْيَتَنَافَسْ الْمُتَنَافِسُونَ " </quran>فَلْيَرْغَبُوا بِالْمُبَادَرَةِ إِلَى طَاعَة اللَّه</p></td></tr></table></body></html>
