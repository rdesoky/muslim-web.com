<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّ الَّذِينَ أَجْرَمُوا " </quran>كَأَبِي جَهْل وَنَحْوه <quran>" كَانُوا مِنْ الَّذِينَ آمَنُوا " </quran>كَعَمَّارٍ وَبِلَال وَنَحْوهمَا <quran>" يَضْحَكُونَ " </quran>اِسْتِهْزَاء بِهِمْ</p></td></tr></table></body></html>
