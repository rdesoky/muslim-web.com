<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا مَرُّوا بِهِمْ يَتَغَامَزُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَإِذَا مَرُّوا " </quran>أَيْ الْمُؤْمِنُونَ <quran>" بِهِمْ يَتَغَامَزُونَ " </quran>يُشِير الْمُجْرِمُونَ إِلَى الْمُؤْمِنِينَ بِالْجَفْنِ وَالْحَاجِب اِسْتِهْزَاء</p></td></tr></table></body></html>
