<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا انْقَلَبُوا إِلَى أَهْلِهِمُ انْقَلَبُوا فَكِهِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَإِذَا اِنْقَلَبُوا " </quran>رَجَعُوا <quran>" إِلَى أَهْلهمْ اِنْقَلَبُوا فَكِهِينَ " </quran>وَفِي قِرَاءَة فَكِهِينَ مُعْجَبِينَ بِذِكْرِهِمْ الْمُؤْمِنِينَ</p></td></tr></table></body></html>
