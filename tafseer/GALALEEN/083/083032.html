<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَؤُلَاءِ لَضَالُّونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَإِذَا رَأَوْهُمْ " </quran>أَيْ الْمُؤْمِنِينَ <quran>" قَالُوا إِنَّ هَؤُلَاءِ لَضَالُّونَ " </quran>لِإِيمَانِهِمْ بِمُحَمَّدٍ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
