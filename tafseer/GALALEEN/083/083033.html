<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أُرْسِلُوا عَلَيْهِمْ حَافِظِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا أُرْسِلُوا " </quran>أَيْ الْكُفَّار <quran>" عَلَيْهِمْ " </quran>عَلَى الْمُؤْمِنِينَ <quran>" حَافِظِينَ " </quran>لَهُمْ أَوْ لِأَعْمَالِهِمْ حَتَّى يُدْرُوهُمْ إِلَى مَصَالِحهمْ</p></td></tr></table></body></html>
