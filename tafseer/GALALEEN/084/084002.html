<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَذِنَتْ " </quran>سَمِعَتْ وَأَطَاعَتْ فِي الِانْشِقَاق <quran>" لِرَبِّهَا وَحُقَّتْ " </quran>أَيْ وَحُقَّ لَهَا أَنْ تَسْمَع وَتُطِيع</p></td></tr></table></body></html>
