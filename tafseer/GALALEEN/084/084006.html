<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الْإِنْسَانُ إِنَّكَ كَادِحٌ إِلَى رَبِّكَ كَدْحًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" يَا أَيّهَا الْإِنْسَان إِنَّك كَادِح " </quran>جَاهِد فِي عَمَلك <quran>" إِلَى " </quran>لِقَاء <quran>" رَبّك " </quran>وَهُوَ الْمَوْت <quran>" كَدْحًا فَمُلَاقِيه " </quran>أَيْ مُلَاقٍ عَمَلك الْمَذْكُور مِنْ خَيْر أَوْ شَرّ يَوْم الْقِيَامَة</p></td></tr></table></body></html>
