<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ ظَنَّ أَنْ لَنْ يَحُورَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّهُ ظَنَّ أَنْ " </quran>مُخَفَّفَة مِنْ الثَّقِيلَة وَاسْمهَا مَحْذُوف , أَيْ أَنَّهُ <quran>" لَنْ يَحُور " </quran>يَرْجِع إِلَى رَبّه</p></td></tr></table></body></html>
