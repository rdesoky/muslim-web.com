<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَتَرْكَبُنَّ طَبَقًا عَنْ طَبَقٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَتَرْكَبُنَّ " </quran>أَيّهَا النَّاس أَصْله تَرْكَبُونَنَّ حُذِفَتْ نُون الرَّفْع لِتَوَالِي الْأَمْثَال وَالْوَاو لِالْتِقَاءِ السَّاكِنَيْنِ <quran>" طَبَقًا عَنْ طَبَق " </quran>حَالًا بَعْد حَال , وَهُوَ الْمَوْت ثُمَّ الْحَيَاة وَمَا بَعْدهَا مِنْ أَحْوَال الْقِيَامَة</p></td></tr></table></body></html>
