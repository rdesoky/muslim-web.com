<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَمَا لَهُمْ " </quran>أَيْ الْكُفَّار <quran>" لَا يُؤْمِنُونَ " </quran>أَيْ أَيّ مَانِع مِنْ الْإِيمَان أَوْ أَيّ حُجَّة لَهُمْ فِي تَرْكه مَعَ وُجُود بَرَاهِينه</p></td></tr></table></body></html>
