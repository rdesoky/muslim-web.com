<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" و " </quran>مَا لَهُمْ <quran>" إِذَا قُرِئَ عَلَيْهِمْ الْقُرْآن لَا يَسْجُدُونَ " </quran>يَخْضَعُونَ بِأَنْ يُؤْمِنُوا بِهِ لِإِعْجَازِهِ</p></td></tr></table></body></html>
