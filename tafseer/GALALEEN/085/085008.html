<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَنْ يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا نَقَمُوا مِنْهُمْ إِلَّا يُؤْمِنُوا بِاَللَّهِ الْعَزِيز " </quran>فِي مُلْكه <quran>" الْحَمِيد " </quran>الْمَحْمُود</p></td></tr></table></body></html>
