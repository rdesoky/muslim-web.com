<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَى كُلِّ شَيْءٍ شَهِيدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>" الَّذِي لَهُ مُلْك السَّمَوَات وَالْأَرْض وَاَللَّه عَلَى كُلّ شَيْء شَهِيد " </quran>أَيْ مَا أَنْكَرَ الْكُفَّار عَلَى الْمُؤْمِنِينَ إِلَّا إِيمَانهمْ</p></td></tr></table></body></html>
