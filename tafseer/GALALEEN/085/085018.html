<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِرْعَوْنَ وَثَمُودَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" فِرْعَوْن وَثَمُود " </quran>بَدَل مِنْ الْجُنُود وَاسْتُغْنِيَ بِذِكْرِ فِرْعَوْن عَنْ أَتْبَاعه , وَحَدِيثهمْ أَنَّهُمْ أُهْلِكُوا بِكُفْرِهِمْ وَهَذَا تَنْبِيه لِمَنْ كَفَرَ بِالنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَالْقُرْآن لِيَتَّعِظُوا</p></td></tr></table></body></html>
