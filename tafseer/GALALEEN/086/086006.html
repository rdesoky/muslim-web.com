<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خُلِقَ مِنْ مَاءٍ دَافِقٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" خُلِقَ مِنْ مَاء دَافِق " </quran>هَذَا جَوَاب قَوْله مِمَّ خُلِقَ ؟ خُلِقَ مِنْ مَاء دَافِق أَيْ ذِي اِنْدِفَاق مِنْ الرَّجُل وَالْمَرْأَة فِي رَحِمهَا</p></td></tr></table></body></html>
