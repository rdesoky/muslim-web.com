<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَهُ مِنْ قُوَّةٍ وَلَا نَاصِرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَمَا لَهُ " </quran>لِمُنْكِرِ الْبَعْث <quran>" مِنْ قُوَّة " </quran>يَمْتَنِع بِهَا مِنْ الْعَذَاب <quran>" وَلَا نَاصِر " </quran>يَدْفَعهُ عَنْهُ</p></td></tr></table></body></html>
