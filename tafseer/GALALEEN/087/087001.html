<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" سَبِّحْ اِسْم رَبّك " </quran>أَيْ نَزِّهْ رَبّك عَمَّا لَا يَلِيق بِهِ وَاسْم زَائِد <quran>" الْأَعْلَى " </quran>صِفَة لِرَبِّك</p></td></tr></table></body></html>
