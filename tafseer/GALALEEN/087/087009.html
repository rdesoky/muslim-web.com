<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَكِّرْ إِنْ نَفَعَتِ الذِّكْرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَذَكِّرْ " </quran>عِظْ بِالْقُرْآنِ <quran>" إِنْ نَفَعَتْ الذِّكْرَى " </quran>مِنْ تَذْكِرَة الْمَذْكُور فِي سَيَذَّكَّرُ , يَعْنِي وَإِنْ لَمْ تَنْفَع وَنَفْعهَا لِبَعْضٍ وَعَدَم النَّفْع لِبَعْضٍ آخَر</p></td></tr></table></body></html>
