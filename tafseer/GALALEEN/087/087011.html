<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَتَجَنَّبُهَا الْأَشْقَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَيَتَجَنَّبهَا " </quran>أَيْ الذِّكْرَى , أَيْ يَتْرُكهَا جَانِبًا لَا يَلْتَفِت إِلَيْهَا <quran>" الْأَشْقَى " </quran>بِمَعْنَى الشَّقِيّ أَيْ الْكَافِر</p></td></tr></table></body></html>
