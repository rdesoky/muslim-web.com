<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَذَكَرَ اِسْم رَبّه " </quran>مُكَبِّرًا <quran>" فَصَلَّى " </quran>الصَّلَوَات الْخَمْس وَذَلِكَ مِنْ أُمُور الْآخِرَة وَكَفَّار مَكَّة مُعْرِضُونَ عَنْهَا</p></td></tr></table></body></html>
