<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا لَفِي الصُّحُفِ الْأُولَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّ هَذَا " </quran>إِفْلَاح مَنْ تَزَكَّى وَكَوْن الْآخِرَة خَبَرًا <quran>" لَفِي الصُّحُف الْأُولَى " </quran>أَيْ الْمُنَزَّلَة قَبْل الْقُرْآن</p></td></tr></table></body></html>
