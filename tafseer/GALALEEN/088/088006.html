<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَيْسَ لَهُمْ طَعَامٌ إِلَّا مِنْ ضَرِيعٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَيْسَ لَهُمْ طَعَام إِلَّا مِنْ ضَرِيع " </quran>هُوَ نَوْع مِنْ الشَّوْك لَا تَرْعَاهُ دَابَّة لِخُبْثِهِ</p></td></tr></table></body></html>
