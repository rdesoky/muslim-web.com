<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَفَلَا يَنْظُرُونَ " </quran>أَيْ كُفَّار مَكَّة نَظَر اِعْتِبَار <quran>" إِلَى الْإِبِل كَيْف خُلِقَتْ "</quran></p></td></tr></table></body></html>
