<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَسْتَ عَلَيْهِمْ بِمُسَيْطِرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَسْت عَلَيْهِمْ بِمُصَيْطِر " </quran>وَفِي قِرَاءَة بِالسِّينِ بَدَل الصَّاد , أَيْ بِمُسَلَّطٍ وَهَذَا قَبْل الْأَمْر بِالْجِهَادِ</p></td></tr></table></body></html>
