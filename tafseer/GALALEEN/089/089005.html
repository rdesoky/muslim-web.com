<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلْ فِي ذَلِكَ قَسَمٌ لِذِي حِجْرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" هَلْ فِي ذَلِكَ " </quran>الْقَسَم <quran>" قَسَم لِذِي حِجْر " </quran>عَقْل , وَجَوَاب الْقَسَم مَحْذُوف أَيْ : لَتُعَذَّبُنَّ يَا كُفَّار مَكَّة</p></td></tr></table></body></html>
