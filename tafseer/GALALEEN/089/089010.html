<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِرْعَوْنَ ذِي الْأَوْتَادِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَفِرْعَوْن ذِي الْأَوْتَاد " </quran>كَانَ يَتِد أَرْبَعَة أَوْتَاد يَشُدّ إِلَيْهَا يَدَيْ وَرِجْلَيْ مَنْ يُعَذِّبهُ</p></td></tr></table></body></html>
