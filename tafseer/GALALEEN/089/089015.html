<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا الْإِنْسَانُ إِذَا مَا ابْتَلَاهُ رَبُّهُ فَأَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبِّي أَكْرَمَنِي</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَأَمَّا الْإِنْسَان " </quran>الْكَافِر <quran>" إِذَا مَا اِبْتَلَاهُ " </quran>اِخْتَبَرَهُ <quran>" رَبّه فَأَكْرَمَهُ " </quran>بِالْمَالِ وَغَيْره <quran>" وَنَعَّمَهُ فَيَقُول رَبِّي أَكْرَمْنَ "</quran></p></td></tr></table></body></html>
