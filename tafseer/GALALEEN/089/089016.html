<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا إِذَا مَا ابْتَلَاهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبِّي أَهَانَنِي</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَمَّا إِذَا مَا اِبْتَلَاهُ فَقَدَرَ " </quran>ضَيَّقَ <quran>" عَلَيْهِ رِزْقه فَيَقُول رَبِّي أَهَانَن "</quran></p></td></tr></table></body></html>
