<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَتُحِبُّونَ الْمَال حُبًّا جَمًّا " </quran>أَيْ : كَثِيرًا فَلَا يُنْفِقُونَهُ , وَفِي قِرَاءَة بِالْفَوْقَانِيَّةِ فِي الْأَفْعَال الْأَرْبَعَة</p></td></tr></table></body></html>
