<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَقُولُ يَا لَيْتَنِي قَدَّمْتُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" يَقُول " </quran>مَعَ تَذَكُّره <quran>" يَا لَيْتَنِي " </quran>لِلتَّنْبِيهِ <quran>" قَدَّمْت " </quran>الْخَيْر وَالْإِيمَان <quran>" لِحَيَاتِي " </quran>الطَّيِّبَة فِي الْآخِرَة أَوْ وَقْت حَيَاتِي فِي الدُّنْيَا</p></td></tr></table></body></html>
