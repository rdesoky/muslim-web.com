<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ارْجِعِي إِلَى رَبِّكِ رَاضِيَةً مَرْضِيَّةً</font></td></tr><tr><td align=right dir=rtl><p><quran>" اِرْجِعِي إِلَى رَبّك " </quran>يُقَال لَهَا ذَلِكَ عِنْد الْمَوْت , أَيْ اِرْجِعِي إِلَى أَمْره وَإِرَادَته <quran>" رَاضِيَة " </quran>بِالثَّوَابِ <quran>" مَرْضِيَّة " </quran>عِنْد اللَّه بِعَمَلِك , أَيْ جَامِعَة بَيْن الْوَصْفَيْنِ وَهُمَا حَالَانِ وَيُقَال لَهَا فِي الْقِيَامَة</p></td></tr></table></body></html>
