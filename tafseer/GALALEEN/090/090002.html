<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْتَ حِلٌّ بِهَذَا الْبَلَدِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَنْتَ " </quran>يَا مُحَمَّد <quran>" حِلّ " </quran>حَلَال <quran>" بِهَذَا الْبَلَد " </quran>بِأَنْ يَحِلّ لَك فَتُقَاتِل فِيهِ , وَقَدْ أَنْجَزَ اللَّه لَهُ هَذَا الْوَعْد يَوْم الْفَتْح , فَالْجُمْلَة اِعْتِرَاض بَيْن الْمُقْسَم بِهِ وَمَا عُطِفَ عَلَيْهِ</p></td></tr></table></body></html>
