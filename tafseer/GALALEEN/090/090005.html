<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُ أَنْ لَنْ يَقْدِرَ عَلَيْهِ أَحَدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَيَحْسَبُ " </quran>أَيَظُنُّ الْإِنْسَان قَوِيّ قُرَيْش وَهُوَ أَبُو الْأَشَدّ بْن كِلْدَة بِقُوَّتِهِ <quran>" أَنْ " </quran>مُخَفَّفَة مِنْ الثَّقِيلَة وَاسْمهَا مَحْذُوف , أَيْ أَنَّهُ <quran>" لَنْ يَقْدِر عَلَيْهِ أَحَد " </quran>وَاَللَّه قَادِر عَلَيْهِ</p></td></tr></table></body></html>
