<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُ أَنْ لَمْ يَرَهُ أَحَدٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَيَحْسَبُ أَنْ " </quran>أَيْ أَنَّهُ <quran>" لَمْ يَرَهُ أَحَد " </quran>فِيمَا أَنْفَقَهُ فَيَعْلَم قَدْره , وَاَللَّه عَالِم بِقَدْرِهِ وَأَنَّهُ لَيْسَ مِمَّا يَتَكَثَّر بِهِ وَمُجَازِيه عَلَى فِعْله السَّيِّئ</p></td></tr></table></body></html>
