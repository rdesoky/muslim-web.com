<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا الْعَقَبَةُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَمَا أَدْرَاك " </quran>أَعْلَمَك <quran>" مَا الْعَقَبَة " </quran>الَّتِي يَقْتَحِمهَا تَعْظِيمًا لِشَأْنِهَا , وَالْجُمْلَة اِعْتِرَاض وَبَيَّنَ سَبَب جَوَازهَا</p></td></tr></table></body></html>
