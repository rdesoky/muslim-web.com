<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّيْلِ إِذَا يَغْشَاهَا</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَاللَّيْل إِذَا يَغْشَاهَا " </quran>يُغَطِّيهَا بِظُلْمَتِهِ وَإِذَا فِي الثَّلَاثَة لِمُجَرَّدِ الظَّرْفِيَّة وَالْعَامِل فِيهَا فِعْل الْقَسَم</p></td></tr></table></body></html>
