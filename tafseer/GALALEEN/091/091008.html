<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَأَلْهَمَهَا فُجُورهَا وَتَقْوَاهَا " </quran>بَيَّنَ لَهَا طَرِيق الْخَيْر وَالشَّرّ وَأَخَّرَ التَّقْوَى رِعَايَة لِرُءُوسِ الْآي وَجَوَاب الْقَسَم : " قَدْ أَفْلَحَ "</p></td></tr></table></body></html>
