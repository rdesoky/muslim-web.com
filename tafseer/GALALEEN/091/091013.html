<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَقَالَ لَهُمْ رَسُول اللَّه " </quran>صَالِح <quran>" نَاقَة اللَّه " </quran>أَيْ ذَرُوهَا <quran>" وَسُقْيَاهَا " </quran>شُرْبهَا فِي يَوْمهَا وَكَانَ لَهَا يَوْم وَلَهُمْ يَوْم</p></td></tr></table></body></html>
