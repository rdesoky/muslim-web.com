<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالنَّهَارِ إِذَا تَجَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَالنَّهَار إِذَا تَجَلَّى " </quran>تَكَشَّفَ وَظَهَرَ وَإِذَا فِي الْمَوْضِعَيْنِ لِمُجَرَّدِ الظَّرْفِيَّة وَالْعَامِل فِيهَا فِعْل الْقَسَم</p></td></tr></table></body></html>
