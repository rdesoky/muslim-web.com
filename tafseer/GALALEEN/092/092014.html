<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْذَرْتُكُمْ نَارًا تَلَظَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَأَنْذَرْتُكُمْ " </quran>خَوَّفْتُكُمْ يَا أَهْل مَكَّة <quran>" نَارًا تَلَظَّى " </quran>بِحَذْفِ إِحْدَى التَّاءَيْنِ مِنْ الْأَصْل وَقُرِئَ بِثُبُوتِهَا , أَيْ تَتَوَقَّد</p></td></tr></table></body></html>
