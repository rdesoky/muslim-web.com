<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي كَذَّبَ وَتَوَلَّى</font></td></tr><tr><td align=right dir=rtl><p><quran>" الَّذِي كَذَّبَ " </quran>النَّبِيّ <quran>" وَتَوَلَّى " </quran>عَنْ الْإِيمَان وَهَذَا الْحَصْر مُؤَوَّل لِقَوْلِهِ تَعَالَى : " وَيَغْفِر مَا دُون ذَلِكَ لِمَنْ يَشَاء " فَيَكُون الْمُرَاد الصِّلِيّ الْمُؤَبَّد</p></td></tr></table></body></html>
