<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" مَا وَدَّعَك " </quran>تَرَكَك يَا مُحَمَّد <quran>" رَبّك وَمَا قَلَى " </quran>أَبْغَضك نَزَلَ هَذَا لَمَّا قَالَ الْكُفَّار عِنْد تَأَخُّر الْوَحْي عَنْهُ خَمْسَة عَشَر يَوْمًا : إِنَّ رَبّه وَدَّعَهُ وَقَلَاهُ</p></td></tr></table></body></html>
