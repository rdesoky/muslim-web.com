<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوَجَدَكَ عَائِلًا فَأَغْنَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَوَجَدَك عَائِلًا " </quran>فَقِيرًا <quran>" فَأَغْنَى " </quran>أَغْنَاك بِمَا قَنَّعَك بِهِ مِنْ الْغَنِيمَة وَغَيْرهَا وَفِي الْحَدِيث : " لَيْسَ الْغِنَى عَنْ كَثْرَة الْعَرَض وَلَكِنَّ الْغِنَى غِنَى النَّفْس "</p></td></tr></table></body></html>
