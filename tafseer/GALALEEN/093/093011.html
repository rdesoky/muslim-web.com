<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَمَّا بِنِعْمَةِ رَبّك " </quran>عَلَيْك بِالنُّبُوَّةِ وَغَيْرهَا <quran>" فَحَدِّثْ " </quran>أَخْبِرْ , وَحُذِفَ ضَمِيره صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ فِي بَعْض الْأَفْعَال رِعَايَة لِلْفَوَاصِلِ .</p></td></tr></table></body></html>
