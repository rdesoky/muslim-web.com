<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي أَنْقَضَ ظَهْرَكَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" الَّذِي أَنْقَضَ " </quran>أَثْقَل <quran>" ظَهْرك " </quran>وَهَذَا كَقَوْلِهِ تَعَالَى : " لِيَغْفِر لَك اللَّه مَا تَقَدَّمَ مِنْ ذَنْبك "</p></td></tr></table></body></html>
