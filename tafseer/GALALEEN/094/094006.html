<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ مَعَ الْعُسْرِ يُسْرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّ مَعَ الْعُسْر يُسْرًا " </quran>وَالنَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ قَاسَى مِنْ الْكُفَّار شِدَّة ثُمَّ حَصَلَ لَهُ الْيُسْر بِنَصْرِهِ عَلَيْهِمْ</p></td></tr></table></body></html>
