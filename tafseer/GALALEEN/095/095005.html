<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" ثُمَّ رَدَدْنَاهُ " </quran>فِي بَعْض أَفْرَاده <quran>" أَسْفَل سَافِلِينَ " </quran>كِنَايَة عَنْ الْهَرَم وَالضَّعْف فَيَنْقُص عَمَل الْمُؤْمِن عَنْ زَمَن الشَّبَاب وَيَكُون لَهُ أَجْره</p></td></tr></table></body></html>
