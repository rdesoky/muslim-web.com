<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ رَآهُ اسْتَغْنَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَنْ رَآهُ " </quran>أَيْ نَفْسه <quran>" اِسْتَغْنَى " </quran>بِالْمَالِ , نَزَلَ فِي أَبِي جَهْل , وَرَأَى عِلْمِيَّة وَاسْتَغْنَى مَفْعُول ثَانٍ وَأَنْ رَآهُ مَفْعُول لَهُ</p></td></tr></table></body></html>
