<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِلَى رَبِّكَ الرُّجْعَى</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّ إِلَى رَبّك " </quran>يَا إِنْسَان <quran>" الرُّجْعَى " </quran>أَيْ الرُّجُوع تَخْوِيف لَهُ فَيُجَازِي الطَّاغِي بِمَا يَسْتَحِقّهُ</p></td></tr></table></body></html>
