<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا لَئِنْ لَمْ يَنْتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" كَلَّا " </quran>رَدْع لَهُ <quran>" لَئِنْ " </quran>لَام قَسَم <quran>" لَمْ يَنْتَهِ " </quran>عَمَّا هُوَ عَلَيْهِ مِنْ الْكُفْر <quran>" لَنَسْفَعًا بِالنَّاصِيَةِ " </quran>لَأَجُرَّنَّ بِنَاصِيَتِهِ إِلَى النَّار</p></td></tr></table></body></html>
