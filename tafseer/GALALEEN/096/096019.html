<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِبْ</font></td></tr><tr><td align=right dir=rtl><p><quran>" كَلَّا " </quran>رَدْع لَهُ <quran>" لَا تُطِعْهُ " </quran>يَا مُحَمَّد فِي تَرْك الصَّلَاة <quran>" وَاسْجُدْ " </quran>صَلِّ لِلَّهِ <quran>" وَاقْتَرِبْ " </quran>مِنْهُ بِطَاعَتِهِ .</p></td></tr></table></body></html>
