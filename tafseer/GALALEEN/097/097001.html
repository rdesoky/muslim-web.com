<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّا أَنْزَلْنَاهُ " </quran>أَيْ الْقُرْآن جُمْلَة وَاحِدَة مِنْ اللَّوْح الْمَحْفُوظ إِلَى السَّمَاء الدُّنْيَا <quran>" فِي لَيْلَة الْقَدْر " </quran>أَيْ الشَّرَف الْعَظِيم</p></td></tr></table></body></html>
