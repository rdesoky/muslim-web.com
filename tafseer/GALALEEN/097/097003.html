<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَيْلَة الْقَدْر خَيْر مِنْ أَلْف شَهْر " </quran>لَيْسَ فِيهَا لَيْلَة الْقَدْر فَالْعَمَل الصَّالِح فِيهَا خَيْر مِنْهُ فِي أَلْف شَهْر لَيْسَتْ فِيهَا</p></td></tr></table></body></html>
