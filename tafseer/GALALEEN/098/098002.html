<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَسُولٌ مِنَ اللَّهِ يَتْلُو صُحُفًا مُطَهَّرَةً</font></td></tr><tr><td align=right dir=rtl><p><quran>" رَسُول مِنْ اللَّه " </quran>بَدَل مِنْ الْبَيِّنَة وَهُوَ النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ <quran>" يَتْلُوا صُحُفًا مُطَهَّرَة " </quran>مِنْ الْبَاطِل</p></td></tr></table></body></html>
