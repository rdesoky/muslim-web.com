<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا كُتُبٌ قَيِّمَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>" فِيهَا كُتُب " </quran>أَحْكَام مَكْتُوبَة <quran>" قَيِّمَة " </quran>مُسْتَقِيمَة , أَيْ يَتْلُو مَضْمُون ذَلِكَ وَهُوَ الْقُرْآن , فَمِنْهُمْ مَنْ آمَنَ بِهِ وَمِنْهُمْ مَنْ كَفَرَ</p></td></tr></table></body></html>
