<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَسَطْنَ بِهِ جَمْعًا</font></td></tr><tr><td align=right dir=rtl><p><quran>" فَوَسَطْنَ بِهِ " </quran>بِالنَّقْعِ <quran>" جَمْعًا " </quran>مِنْ الْعَدْو أَيْ صِرْنَ وَسَطه وَعُطِفَ الْفِعْل عَلَى الِاسْم لِأَنَّهُ فِي تَأْوِيل الْفِعْل أَيْ وَاَللَّاتِي عَدَوْنَ فَأَوْرَيْن فَأَغَرْنَ</p></td></tr></table></body></html>
