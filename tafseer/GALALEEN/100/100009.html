<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" أَفَلَا يَعْلَم إِذَا بُعْثِرَ " </quran>أُثِيرَ وَأُخْرِجَ <quran>" مَا فِي الْقُبُور " </quran>مِنْ الْمَوْتَى , أَيْ بُعِثُوا</p></td></tr></table></body></html>
