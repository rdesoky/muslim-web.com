<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" يَوْم " </quran>نَاصِبه دَلَّ عَلَيْهِ الْقَارِعَة , أَيْ تَقْرَع <quran>" يَكُون النَّاس كَالْفِرَاشِ الْمَبْثُوث " </quran>كَغَوْغَاء الْجَرَاد الْمُنْتَشِر يَمُوج بَعْضهمْ فِي بَعْض لِلْحِيرَةِ إِلَى أَنْ يُدْعَوْا لِلْحِسَابِ</p></td></tr></table></body></html>
