<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنْفُوشِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَتَكُون الْجِبَال كَالْعِهْنِ الْمَنْفُوش " </quran>كَالصُّوفِ الْمَنْدُوف فِي خِفَّة سَيْرهَا حَتَّى تَسْتَوِي مَعَ الْأَرْض</p></td></tr></table></body></html>
