<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" الَّذِي جَمَعَ " </quran>بِالتَّخْفِيفِ وَالتَّشْدِيد <quran>" مَالًا وَعَدَّدَهُ " </quran>أَحْصَاهُ وَجَعَلَهُ عُدَّة لِحَوَادِث الدَّهْر</p></td></tr></table></body></html>
