<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا لَيُنْبَذَنَّ فِي الْحُطَمَةِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" كَلَّا " </quran>رَدْع <quran>" لَيُنَبَذَنَّ " </quran>جَوَاب قَسَم مَحْذُوف , أَيْ لَيُطْرَحَنَّ <quran>" فِي الْحُطَمَة " </quran>الَّتِي تُحَطِّم كُلّ مَا أُلْقِيَ فِيهَا</p></td></tr></table></body></html>
