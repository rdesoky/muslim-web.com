<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهَا عَلَيْهِمْ مُؤْصَدَةٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّهَا عَلَيْهِمْ " </quran>جَمَعَ الضَّمِير رِعَايَة لِمَعْنَى كُلّ <quran>" مُؤْصَدَة " </quran>بِالْهَمْزِ وَبِالْوَاوِ بَدَله , مُطْبَقَة</p></td></tr></table></body></html>
