<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيل " </quran>جَمَاعَات جَمَاعَات , قِيلَ لَا وَاحِد لَهُ كَأَسَاطِير , وَقِيلَ وَاحِده : أُبُول أَوْ إِبَال أَوْ إِبِّيل كَعُجُولِ وَمِفْتَاح وَسِكِّين</p></td></tr></table></body></html>
