<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>" الَّذِي أَطْعَمَهُمْ مِنْ جُوع " </quran>أَيْ مِنْ أَجْله <quran>" وَآمَنَهُمْ مِنْ خَوْف " </quran>أَيْ مِنْ أَجْله وَكَانَ يُصِيبهُمْ الْجُوع لِعَدَمِ الزَّرْع بِمَكَّة وَخَافُوا جَيْش الْفِيل .</p></td></tr></table></body></html>
