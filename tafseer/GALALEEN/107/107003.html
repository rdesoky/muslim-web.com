<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" وَلَا يَحُضّ " </quran>نَفْسه وَلَا غَيْره <quran>" عَلَى طَعَام الْمِسْكِين " </quran>أَيْ إِطْعَامه , نَزَلَتْ فِي الْعَاصِي بْن وَائِل أَوْ الْوَلِيد بْن الْمُغِيرَة</p></td></tr></table></body></html>
