<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِنَّ شَانِئُك " </quran>أَيْ مُبْغِضك <quran>" هُوَ الْأَبْتَر " </quran>الْمُنْقَطِع عَنْ كُلّ خَيْر , أَوْ الْمُنْقَطِع الْعَقِب , نَزَلَتْ فِي الْعَاصِي بْن وَائِل سَمَّى النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَبْتَر عِنْد مَوْت اِبْنه الْقَاسِم .</p></td></tr></table></body></html>
