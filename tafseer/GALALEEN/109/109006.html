<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَكُمْ دِينُكُمْ وَلِيَ دِينِ</font></td></tr><tr><td align=right dir=rtl><p><quran>" لَكُمْ دِينكُمْ " </quran>الشِّرْك <quran>" وَلِيَ دِين " </quran>الْإِسْلَام وَهَذَا قَبْل أَنْ يُؤْمَر بِالْحَرْبِ وَحَذَفَ يَاء الْإِضَافَة الْقُرَّاء السَّبْعَة وَقْفًا وَوَصْلًا وَأَثْبَتَهَا يَعْقُوب فِي الْحَالَيْنِ .</p></td></tr></table></body></html>
