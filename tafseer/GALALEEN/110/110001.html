<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ</font></td></tr><tr><td align=right dir=rtl><p><quran>" إِذَا جَاءَ نَصْر اللَّه " </quran>نَبِيّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ عَلَى أَعْدَائِهِ <quran>" وَالْفَتْح " </quran>فَتْح مَكَّة</p></td></tr></table></body></html>
