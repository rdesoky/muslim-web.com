<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الجلالين</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ</font></td></tr><tr><td align=right dir=rtl><p><quran>" مَا أَغْنَى عَنْهُ مَاله وَمَا كَسَبَ " </quran>أَيْ وَكَسَبَهُ , أَيْ وَلَده مَا أَغْنَى بِمَعْنَى يُغْنِي</p></td></tr></table></body></html>
