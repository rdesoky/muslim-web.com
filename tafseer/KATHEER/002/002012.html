<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ وَلَكِنْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول أَلَا إِنَّ هَذَا الَّذِي يَعْتَمِدُونَهُ وَيَزْعُمُونَ أَنَّهُ إِصْلَاح هُوَ عَيْن الْفَسَاد وَلَكِنْ مِنْ جَهْلهمْ لَا يَشْعُرُونَ بِكَوْنِهِ فَسَادًا .</p></td></tr></table></body></html>
