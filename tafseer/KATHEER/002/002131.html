<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُ رَبُّهُ أَسْلِمْ قَالَ أَسْلَمْتُ لِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَمَرَهُ اللَّه تَعَالَى بِالْإِخْلَاصِ وَالِاسْتِسْلَام وَالِانْقِيَاد فَأَجَابَ إِلَى ذَلِكَ شَرْعًا وَقَدَرًا .</p></td></tr></table></body></html>
