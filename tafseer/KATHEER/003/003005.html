<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ لَا يَخْفَى عَلَيْهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى أَنَّهُ يَعْلَم غَيْب السَّمَاء وَالْأَرْض لَا يَخْفَى عَلَيْهِ شَيْء مِنْ ذَلِكَ .</p></td></tr></table></body></html>
