<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ جَزَاؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ اللَّهِ وَالْمَلَائِكَةِ وَالنَّاسِ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَعَالَى " أُولَئِكَ جَزَاؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَة اللَّه وَالْمَلَائِكَة وَالنَّاس أَجْمَعِينَ " أَيْ يَلْعَنهُمْ اللَّه وَيَلْعَنهُمْ خَلْقُهُ .</p></td></tr></table></body></html>
