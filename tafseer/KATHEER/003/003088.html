<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْظَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" خَالِدِينَ فِيهَا " أَيْ فِي اللَّعْنَة " لَا يُخَفَّف عَنْهُمْ الْعَذَاب وَلَا هُمْ يُنْظَرُونَ " أَيْ لَا يُفَتَّر عَنْهُمْ الْعَذَاب وَلَا يُخَفَّف عَنْهُمْ سَاعَة وَاحِدَة .</p></td></tr></table></body></html>
