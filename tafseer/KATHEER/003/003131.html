<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّقُوا النَّارَ الَّتِي أُعِدَّتْ لِلْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ تَوَعَّدَهُمْ بِالنَّارِ وَحَذَّرَهُمْ مِنْهَا فَقَالَ تَعَالَى . " وَاتَّقُوا النَّار الَّتِي أُعِدَّتْ لِلْكَافِرِينَ وَأَطِيعُوا اللَّه وَالرَّسُول لَعَلَّكُمْ تُرْحَمُونَ " .</p></td></tr></table></body></html>
