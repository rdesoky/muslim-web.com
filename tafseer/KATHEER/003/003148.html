<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَآتَاهُمُ اللَّهُ ثَوَابَ الدُّنْيَا وَحُسْنَ ثَوَابِ الْآخِرَةِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ النَّصْر وَالظَّفَر وَالْعَاقِبَة " وَحُسْن ثَوَاب الْآخِرَة " أَيْ جَمَعَ لَهُمْ ذَلِكَ مَعَ هَذَا " وَاَللَّه يُحِبّ الْمُحْسِنِينَ " .</p></td></tr></table></body></html>
