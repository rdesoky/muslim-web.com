<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُوا فِي الْبِلَادِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى لَا تَنْظُر إِلَى مَا هَؤُلَاءِ الْكُفَّار مُتْرَفُونَ فِيهِ مِنْ النِّعْمَة وَالْغِبْطَة وَالسُّرُور فَعَمَّا قَلِيل يَزُول هَذَا كُلّه عَنْهُمْ وَيُصْبِحُونَ مُرْتَهَنِينَ بِأَعْمَالِهِمْ السَّيِّئَة .</p></td></tr></table></body></html>
