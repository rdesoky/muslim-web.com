<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذًا لَآتَيْنَاهُمْ مِنْ لَدُنَّا أَجْرًا عَظِيمًا</font></td></tr><tr><td align=right dir=rtl><p>وَإِذًا لَآتَيْنَاهُمْ مِنْ لَدُنَّا أَيْ مِنْ عِنْدنَا أَجْرًا عَظِيمًا يَعْنِي الْجَنَّة .</p></td></tr></table></body></html>
