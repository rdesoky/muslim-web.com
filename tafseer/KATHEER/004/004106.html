<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاسْتَغْفِرِ اللَّهَ إِنَّ اللَّهَ كَانَ غَفُورًا رَحِيمًا</font></td></tr><tr><td align=right dir=rtl><p>وَاسْتَغْفِرْ اللَّه أَيْ مِمَّا قُلْت لِقَتَادَةَ إِنَّ اللَّه كَانَ غَفُورًا رَحِيمًا .</p></td></tr></table></body></html>
