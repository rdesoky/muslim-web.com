<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَكَفَى بِاللَّهِ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " وَلِلَّهِ مَا فِي السَّمَوَات وَمَا فِي الْأَرْض وَكَفَى بِاَللَّهِ وَكِيلًا " أَيْ هُوَ الْقَائِم عَلَى كُلّ نَفْس بِمَا كَسَبَتْ الرَّقِيب الشَّهِيد عَلَى كُلّ شَيْء .</p></td></tr></table></body></html>
