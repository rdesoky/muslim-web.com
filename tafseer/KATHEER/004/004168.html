<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ كَفَرُوا وَظَلَمُوا لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقًا</font></td></tr><tr><td align=right dir=rtl><p>" وَلَا يَهْدِيهِمْ طَرِيقًا " أَيْ سَبِيلًا إِلَى الْخَيْر .</p></td></tr></table></body></html>
