<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا طَرِيقَ جَهَنَّمَ خَالِدِينَ فِيهَا أَبَدًا وَكَانَ ذَلِكَ عَلَى اللَّهِ يَسِيرًا</font></td></tr><tr><td align=right dir=rtl><p>" إِلَّا طَرِيق جَهَنَّم " وَهَذَا اِسْتِثْنَاء مُنْقَطِع " خَالِدِينَ فِيهَا أَبَدًا " الْآيَة .</p></td></tr></table></body></html>
