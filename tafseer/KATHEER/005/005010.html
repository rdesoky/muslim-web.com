<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ " وَاَلَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَاب الْجَحِيم " وَهَذَا مِنْ عَدْله تَعَالَى وَحِكْمَته وَحُكْمه الَّذِي لَا يَجُور فِيهِ بَلْ هُوَ الْحَكَم الْعَدْل الْحَكِيم الْقَدِير .</p></td></tr></table></body></html>
