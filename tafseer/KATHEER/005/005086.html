<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ أَخْبَرَ عَنْ حَال الْأَشْقِيَاء فَقَالَ : " وَاَلَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا " أَيْ جَحَدُوا بِهَا وَخَالَفُوهَا أُولَئِكَ أَصْحَاب الْجَحِيم " أَيْ هُمْ أَهْلهَا وَالدَّاخِلُونَ فِيهَا .</p></td></tr></table></body></html>
