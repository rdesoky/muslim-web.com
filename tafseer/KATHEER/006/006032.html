<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " وَمَا الْحَيَاة الدُّنْيَا إِلَّا لَعِب وَلَهْو " أَيْ إِنَّمَا غَالِبهَا كَذَلِكَ " وَلَلدَّار الْآخِرَة خَيْر لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ " .</p></td></tr></table></body></html>
