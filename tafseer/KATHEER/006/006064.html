<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلِ اللَّهُ يُنَجِّيكُمْ مِنْهَا وَمِنْ كُلِّ كَرْبٍ ثُمَّ أَنْتُمْ تُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اللَّه " قُلْ اللَّه يُنْجِيكُمْ مِنْهَا وَمِنْ كُلّ كَرْب ثُمَّ أَنْتُمْ " أَيْ بَعْد ذَلِكَ " تُشْرِكُونَ " أَيْ تَدْعُونَ مَعَهُ فِي حَال الرَّفَاهِيَة آلِهَة أُخْرَى .</p></td></tr></table></body></html>
