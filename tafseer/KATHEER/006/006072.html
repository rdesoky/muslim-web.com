<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْ أَقِيمُوا الصَّلَاةَ وَاتَّقُوهُ وَهُوَ الَّذِي إِلَيْهِ تُحْشَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَأَنْ أَقِيمُوا الصَّلَاة وَاتَّقُوهُ " أَيْ وَأَمَرَنَا بِإِقَامَةِ الصَّلَاة وَبِتَقْوَاهُ فِي جَمِيع الْأَحْوَال " وَهُوَ الَّذِي إِلَيْهِ تُحْشَرُونَ " أَيْ يَوْم الْقِيَامَة .</p></td></tr></table></body></html>
