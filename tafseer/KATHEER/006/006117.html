<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ أَعْلَمُ مَنْ يَضِلُّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p>" هُوَ أَعْلَم مَنْ يَضِلّ عَنْ سَبِيله " فَيُيَسِّرهُ لِذَلِكَ " هُوَ أَعْلَم بِالْمُهْتَدِينَ " فَيُيَسِّرْهُمْ لِذَلِكَ وَكُلّ مُيَسَّر لِمَا خُلِقَ لَهُ .</p></td></tr></table></body></html>
