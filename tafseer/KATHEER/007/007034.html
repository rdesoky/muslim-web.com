<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِكُلِّ أُمَّةٍ أَجَلٌ فَإِذَا جَاءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً وَلَا يَسْتَقْدِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى " وَلِكُلِّ أُمَّة" أَيْ قَرْن وَجِيل " أَجَل فَإِذَا جَاءَ أَجَلهمْ " أَيْ مِيقَاتهمْ الْمُقَدَّر لَهُمْ " لَا يَسْتَأْخِرُونَ سَاعَة وَلَا يَسْتَقْدِمُونَ" .</p></td></tr></table></body></html>
