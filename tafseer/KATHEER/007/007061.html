<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا قَوْمِ لَيْسَ بِي ضَلَالَةٌ وَلَكِنِّي رَسُولٌ مِنْ رَبِّ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ يَا قَوْم لَيْسَ بِي ضَلَالَة وَلَكِنِّي رَسُول مِنْ رَبّ الْعَالَمِينَ " أَيْ مَا أَنَا ضَالّ وَلَكِنْ أَنَا رَسُول مِنْ رَبّ الْعَالَمِينَ رَبّ كُلّ شَيْء وَمَلِيكه .</p></td></tr></table></body></html>
