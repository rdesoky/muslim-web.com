<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُبَلِّغُكُمْ رِسَالَاتِ رَبِّي وَأَنَا لَكُمْ نَاصِحٌ أَمِينٌ</font></td></tr><tr><td align=right dir=rtl><p>" أُبَلِّغكُمْ رِسَالَات رَبِّي وَأَنَا لَكُمْ نَاصِح أَمِين " وَهَذِهِ الصِّفَات الَّتِي يَتَّصِف بِهَا الرُّسُل الْبَلَاغ وَالنُّصْح وَالْأَمَانَة .</p></td></tr></table></body></html>
