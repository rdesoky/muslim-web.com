<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يُمَسِّكُونَ بِالْكِتَابِ وَأَقَامُوا الصَّلَاةَ إِنَّا لَا نُضِيعُ أَجْرَ الْمُصْلِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " وَاَلَّذِينَ يُمَسِّكُونَ بِالْكِتَابِ " أَيْ اِعْتَصَمُوا بِهِ وَاقْتَدُوا بِأَوَامِرِهِ وَتَرَكُوا زَوَاجِره " وَأَقَامُوا الصَّلَاة إِنَّا لَا نُضِيع أَجْر الْمُصْلِحِينَ" .</p></td></tr></table></body></html>
