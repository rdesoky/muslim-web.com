<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُمْلِي لَهُمْ إِنَّ كَيْدِي مَتِينٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " وَأُمْلِي لَهُمْ " أَيْ وَسَأُمْلِي لَهُمْ أَيْ أُطَوِّل لَهُمْ مَا هُمْ فِيهِ" إِنَّ كَيْدِي مَتِين " أَيْ قَوِيّ شَدِيد .</p></td></tr></table></body></html>
