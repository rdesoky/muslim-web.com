<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ عِبَادٌ أَمْثَالُكُمْ فَادْعُوهُمْ فَلْيَسْتَجِيبُوا لَكُمْ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>ذَكَرَ تَعَالَى أَنَّهَا عَبِيد مِثْل عَابِدِيهَا أَيْ مَخْلُوقَات مِثْلهمْ .</p></td></tr></table></body></html>
