<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكُمْ فَذُوقُوهُ وَأَنَّ لِلْكَافِرِينَ عَذَابَ النَّارِ</font></td></tr><tr><td align=right dir=rtl><p>" ذَلِكُمْ فَذُوقُوهُ وَأَنَّ لِلْكَافِرِينَ عَذَابَ النَّار " هَذَا خِطَاب لِلْكُفَّارِ أَيْ ذُوقُوا هَذَا الْعَذَاب وَالنَّكَال فِي الدُّنْيَا وَاعْلَمُوا أَيْضًا أَنَّ لِلْكَافِرِينَ عَذَابَ النَّار فِي الْآخِرَة .</p></td></tr></table></body></html>
