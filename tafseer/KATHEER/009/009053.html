<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَنْفِقُوا طَوْعًا أَوْ كَرْهًا لَنْ يُتَقَبَّلَ مِنْكُمْ إِنَّكُمْ كُنْتُمْ قَوْمًا فَاسِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " قُلْ أَنْفِقُوا طَوْعًا أَوْ كَرْهًا " أَيْ مَهْمَا أَنْفَقْتُمْ مِنْ نَفَقَة طَائِعِينَ أَوْ مُكْرَهِينَ " لَنْ يُتَقَبَّل مِنْكُمْ إِنَّكُمْ كُنْتُمْ قَوْمًا فَاسْقِينَ " .</p></td></tr></table></body></html>
