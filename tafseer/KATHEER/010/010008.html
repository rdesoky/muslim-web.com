<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ مَأْوَاهُمُ النَّارُ بِمَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَإِنَّ مَأْوَاهُمْ يَوْم مَعَادهمْ النَّار جَزَاء عَلَى مَا كَانُوا يَكْسِبُونَ فِي دُنْيَاهُمْ مِنْ الْآثَام وَالْخَطَايَا وَالْإِجْرَام مَعَ مَا هُمْ فِيهِ مِنْ الْكُفْر بِاَللَّهِ وَرَسُوله وَالْيَوْم الْآخِر .</p></td></tr></table></body></html>
