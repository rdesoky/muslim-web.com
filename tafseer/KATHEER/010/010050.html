<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَرَأَيْتُمْ إِنْ أَتَاكُمْ عَذَابُهُ بَيَاتًا أَوْ نَهَارًا مَاذَا يَسْتَعْجِلُ مِنْهُ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ " قُلْ أَرَأَيْتُمْ إِنْ أَتَاكُمْ عَذَابه بَيَاتًا أَوْ نَهَارًا " أَيْ لَيْلًا أَوْ نَهَارًا " مَاذَا يَسْتَعْجِل مِنْهُ الْمُجْرِمُونَ "</p></td></tr></table></body></html>
