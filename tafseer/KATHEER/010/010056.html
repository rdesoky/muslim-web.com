<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُوَ يُحْيِي وَيُمِيتُ وَإِلَيْهِ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَأَنَّهُ يُحْيِي وَيُمِيت وَإِلَيْهِ مَرْجِعهمْ ; وَأَنَّهُ الْقَادِر عَلَى ذَلِكَ الْعَلِيم بِمَا تَفَرَّقَ مِنْ الْأَجْسَام وَتَمَزَّقَ فِي سَائِر أَقْطَار الْأَرْض وَالْبِحَار وَالْقِفَار .</p></td></tr></table></body></html>
