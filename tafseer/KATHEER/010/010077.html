<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ مُوسَى أَتَقُولُونَ لِلْحَقِّ لَمَّا جَاءَكُمْ أَسِحْرٌ هَذَا وَلَا يُفْلِحُ السَّاحِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ " لَهُمْ " مُوسَى " مُنْكِرًا عَلَيْهِمْ " أَتَقُولُونَ لِلْحَقِّ لَمَّا جَاءَكُمْ أَسِحْر هَذَا وَلَا يُفْلِح السَّاحِرُونَ " .</p></td></tr></table></body></html>
