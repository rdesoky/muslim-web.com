<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ دُونِهِ فَكِيدُونِي جَمِيعًا ثُمَّ لَا تُنْظِرُونِ</font></td></tr><tr><td align=right dir=rtl><p>" فَكِيدُونِي جَمِيعًا " أَيْ أَنْتُمْ وَآلِهَتكُمْ إِنْ كَانَتْ حَقًّا " ثُمَّ لَا تُنْظِرُونِ " أَيْ طَرْفَة عَيْن .</p></td></tr></table></body></html>
