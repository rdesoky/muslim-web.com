<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِبْرَاهِيمَ لَحَلِيمٌ أَوَّاهٌ مُنِيبٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " إِنَّ إِبْرَاهِيم لَحَلِيم أَوَّاه مُنِيب " مَدْح لِإِبْرَاهِيم بِهَذِهِ الصِّفَات الْجَمِيلَة , وَقَدْ تَقَدَّمَ تَفْسِيرهَا .</p></td></tr></table></body></html>
