<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ</font></td></tr><tr><td align=right dir=rtl><p>" وَاسْتَغْفِرُوا " رَبّكُمْ مِنْ سَالِف الذُّنُوب " ثُمَّ تُوبُوا إِلَيْهِ " فِيمَا تَسْتَقْبِلُونَهُ مِنْ الْأَعْمَال السَّيِّئَة وَقَوْله " إِنَّ رَبِّي رَحِيم وَدُود " أَيْ لِمَنْ تَابَ .</p></td></tr></table></body></html>
