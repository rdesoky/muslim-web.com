<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَئِنْ أَكَلَهُ الذِّئْبُ وَنَحْنُ عُصْبَةٌ إِنَّا إِذًا لَخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" لَئِنْ أَكَلَهُ الذِّئْب وَنَحْنُ عُصْبَة إِنَّا إذًا لَخَاسِرُونَ" يَقُولُونَ لَئِنْ عَدَا عَلَيْهِ الذِّئْب فَأَكَلَهُ بَيْننَا . وَنَحْنُ جَمَاعَة إِنَّا إِذًا لَهَالِكُونَ عَاجِزُونَ .</p></td></tr></table></body></html>
