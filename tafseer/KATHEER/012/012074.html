<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا فَمَا جَزَاؤُهُ إِنْ كُنْتُمْ كَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَمَا جَزَاؤُهُ" أَيْ السَّارِق إِنْ كَانَ فِيكُمْ " إِنْ كُنْتُمْ كَاذِبِينَ أَيْ أَيّ شَيْء يَكُون عُقُوبَته إِنْ وَجَدْنَا فِيكُمْ مَنْ أَخَذَهُ ؟ .</p></td></tr></table></body></html>
