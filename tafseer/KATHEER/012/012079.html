<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ مَعَاذَ اللَّهِ أَنْ نَأْخُذَ إِلَّا مَنْ وَجَدْنَا مَتَاعَنَا عِنْدَهُ إِنَّا إِذًا لَظَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ مَعَاذ اللَّه أَنْ نَأْخُذ إِلَّا مَنْ وَجَدْنَا مَتَاعنَا عِنْده " أَيْ كَمَا قُلْتُمْ وَاعْتَرَفْتُمْ" إِنَّا إِذًا لَظَالِمُونَ " أَيْ إِنْ أَخَذْنَا بَرِيئًا بِسَقِيمٍ .</p></td></tr></table></body></html>
