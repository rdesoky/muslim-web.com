<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُوفُونَ بِعَهْدِ اللَّهِ وَلَا يَنْقُضُونَ الْمِيثَاقَ</font></td></tr><tr><td align=right dir=rtl><p>الَّذِينَ يُوفُونَ بِعَهْدِ اللَّه وَلَا يَنْقُضُونَ الْمِيثَاق " وَلَيْسُوا كَالْمُنَافِقِينَ الَّذِينَ إِذَا عَاهَدَ أَحَدهمْ غَدَرَ وَإِذَا خَاصَمَ فَجَرَ وَإِذَا حَدَّثَ كَذَبَ وَإِذَا ائْتُمِنَ خَانَ .</p></td></tr></table></body></html>
