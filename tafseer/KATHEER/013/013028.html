<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُمْ بِذِكْرِ اللَّهِ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَطِيب وَتَرْكَن إِلَى جَانِب اللَّه وَتَسْكُن عِنْد ذِكْره وَتَرْضَى بِهِ مَوْلًى وَنَصِيرًا وَلِهَذَا قَالَ " أَلَا بِذِكْرِ اللَّه تَطْمَئِنّ الْقُلُوب " .</p></td></tr></table></body></html>
