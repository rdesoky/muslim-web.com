<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ نَسْلُكُهُ فِي قُلُوبِ الْمُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ أَخْبَرَ أَنَّهُ سَلَكَ التَّكْذِيب فِي قُلُوب الْمُجْرِمِينَ الَّذِينَ عَانَدُوا وَاسْتَكْبَرُوا عَنْ اِتِّبَاع الْهُدَى قَالَ أَنَس وَالْحَسَن الْبَصْرِيّ " كَذَلِكَ نَسْلُكهُ فِي قُلُوب الْمُجْرِمِينَ " يَعْنِي الشِّرْك .</p></td></tr></table></body></html>
