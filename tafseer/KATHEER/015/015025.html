<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ هُوَ يَحْشُرُهُمْ إِنَّهُ حَكِيمٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>" وَإِنَّ رَبّك هُوَ يَحْشُرهُمْ إِنَّهُ حَكِيم عَلِيم " فَقَالَ عَوْن بْن عَبْد اللَّه وَفَّقَك اللَّه وَجَزَاك خَيْرًا .</p></td></tr></table></body></html>
