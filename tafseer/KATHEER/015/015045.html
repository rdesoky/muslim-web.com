<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ تَعَالَى حَال أَهْل النَّار عَطَفَ عَلَى ذِكْر أَصْل الْجَنَّة وَأَنَّهُمْ فِي جَنَّات وَعُيُون .</p></td></tr></table></body></html>
