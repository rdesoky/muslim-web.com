<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَبِّئْهُمْ عَنْ ضَيْفِ إِبْرَاهِيمَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى وَأَخْبِرْهُمْ يَا مُحَمَّد عَنْ قِصَّة ضَيْف إِبْرَاهِيم وَالضَّيْف يُطْلَق عَلَى الْوَاحِد وَالْجَمْع كَالزَّوْرِ وَالسَّفَر .</p></td></tr></table></body></html>
