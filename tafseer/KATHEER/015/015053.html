<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَا تَوْجَلْ إِنَّا نُبَشِّرُكَ بِغُلَامٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>" قَالُوا لَا تَوْجَل " أَيْ لَا تَخَفْ وَبَشَّرُوهُ " بِغُلَامٍ عَلِيم " أَيْ إِسْحَاق " كَمَا تَقَدَّمَ فِي سُورَة هُود .</p></td></tr></table></body></html>
