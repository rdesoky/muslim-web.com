<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ وَمَنْ يَقْنَطُ مِنْ رَحْمَةِ رَبِّهِ إِلَّا الضَّالُّونَ</font></td></tr><tr><td align=right dir=rtl><p>فَأَجَابَهُمْ بِأَنَّهُ لَيْسَ يَقْنَط وَلَكِنْ يَرْجُو مِنْ اللَّه الْوَلَد وَإِنْ كَانَ قَدْ كَبِرَ وَأَسَنَّتْ اِمْرَأَته فَإِنَّهُ يَعْلَم مِنْ قُدْرَة اللَّه وَرَحْمَته مَا هُوَ أَبْلَغ مِنْ ذَلِكَ .</p></td></tr></table></body></html>
