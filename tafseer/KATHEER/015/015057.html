<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَمَا خَطْبُكُمْ أَيُّهَا الْمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى إِخْبَارًا عَنْ إِبْرَاهِيم عَلَيْهِ السَّلَام لَمَّا ذَهَبَ عَنْهُ الرَّوْع وَجَاءَتْهُ الْبُشْرَى إنَّهُ شَرَعَ يَسْأَلهُمْ عَمَّا جَاءُوا لَهُ .</p></td></tr></table></body></html>
