<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا آلَ لُوطٍ إِنَّا لَمُنَجُّوهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَأَخْبَرُوهُ أَنَّهُمْ سَيُنَجُّونَ آل لُوط مِنْ بَيْنهمْ .</p></td></tr></table></body></html>
