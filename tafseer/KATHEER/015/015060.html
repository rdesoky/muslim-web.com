<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا امْرَأَتَهُ قَدَّرْنَا إِنَّهَا لَمِنَ الْغَابِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>إِلَّا اِمْرَأَته فَإِنَّهَا مِنْ الْهَالِكِينَ وَلِهَذَا قَالُوا " إِلَّا اِمْرَأَته قَدَّرْنَا إِنَّهَا لَمِنْ الْغَابِرِينَ " أَيْ الْبَاقِينَ الْمُهْلَكِينَ .</p></td></tr></table></body></html>
