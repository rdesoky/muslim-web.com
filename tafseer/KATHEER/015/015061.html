<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَ آلَ لُوطٍ الْمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ لُوط لَمَّا جَاءَتْهُ الْمَلَائِكَة فِي صُورَة شَبَاب حِسَان الْوُجُوه فَدَخَلُوا عَلَيْهِ دَاره .</p></td></tr></table></body></html>
