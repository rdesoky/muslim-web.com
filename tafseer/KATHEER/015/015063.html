<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ جِئْنَاكَ بِمَا كَانُوا فِيهِ يَمْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالُوا بَلْ جِئْنَاك بِمَا كَانُوا فِيهِ يَمْتَرُونَ " يَعْنُونَ بِعَذَابِهِمْ وَهَلَاكهمْ وَدَمَارهمْ الَّذِي كَانُوا يَشُكُّونَ فِي وُقُوعه بِهِمْ وَحُلُوله بِسَاحَتِهِمْ .</p></td></tr></table></body></html>
