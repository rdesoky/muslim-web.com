<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَتَيْنَاكَ بِالْحَقِّ وَإِنَّا لَصَادِقُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَأَتَيْنَاك بِالْحَقِّ" كَقَوْلِهِ تَعَالَى " مَا نُنَزِّل الْمَلَائِكَة إِلَّا بِالْحَقِّ" وَقَوْله " وَإِنَّا لَصَادِقُونَ " تَأْكِيد لِخَبَرِهِمْ إِيَّاهُ بِمَا أَخْبَرُوهُ بِهِ مِنْ نَجَاته وَإِهْلَاك قَوْمه .</p></td></tr></table></body></html>
