<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَ أَهْلُ الْمَدِينَةِ يَسْتَبْشِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ مَجِيء قَوْم لُوط لَمَّا عَلِمُوا بِأَضْيَافِهِ وَصَبَاحَة وُجُوههمْ وَأَنَّهُمْ جَاءُوا مُسْتَبْشِرِينَ بِهِمْ فَرِحِينَ .</p></td></tr></table></body></html>
