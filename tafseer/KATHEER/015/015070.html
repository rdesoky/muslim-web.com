<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَوَلَمْ نَنْهَكَ عَنِ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالُوا لَهُ مُجِيبِينَ" أَوَلَمْ نَنْهَك عَنْ الْعَالَمِينَ " أَيْ أَوَمَا نَهَيْنَاك أَنْ تُضَيِّف أَحَدًا ؟ .</p></td></tr></table></body></html>
