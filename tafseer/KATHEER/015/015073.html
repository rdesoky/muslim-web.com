<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذَتْهُمُ الصَّيْحَةُ مُشْرِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى " فَأَخَذَتْهُمْ الصَّيْحَة " وَهِيَ مَا جَاءَهُمْ بِهِ مِنْ الصَّوْت الْقَاصِف عِنْد شُرُوق الشَّمْس وَهُوَ طُلُوعهَا وَذَلِكَ مَعَ رَفْع بِلَادهمْ إِلَى عَنَان السَّمَاء .</p></td></tr></table></body></html>
