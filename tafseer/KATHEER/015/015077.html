<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي ذَلِكَ لَآيَةً لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " إِنَّ فِي ذَلِكَ لَآيَة لِلْمُؤْمِنِينَ " أَيْ إِنَّ الَّذِي صَنَعْنَا بِقَوْمِ لُوط مِنْ الْهَلَاك وَالدَّمَار وَإِنْجَاءَنَا لُوطًا وَأَهْله لَدَلَالَة وَاضِحَة جَلِيَّة لِلْمُؤْمِنِينَ بِاَللَّهِ وَرُسُله .</p></td></tr></table></body></html>
