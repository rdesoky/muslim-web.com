<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ كَانَ أَصْحَابُ الْأَيْكَةِ لَظَالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَصْحَاب الْأَيْكَة هُمْ قَوْم شُعَيْب قَالَ الضَّحَّاك وَقَتَادَة وَغَيْرهمَا الْأَيْكَة الشَّجَر الْمُلْتَفّ وَكَانَ ظُلْمهمْ بِشِرْكِهِمْ بِاَللَّهِ وَقَطْعهمْ الطَّرِيق وَنَقْصهمْ الْمِكْيَال وَالْمِيزَان .</p></td></tr></table></body></html>
