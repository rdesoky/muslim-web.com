<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يَدْعُونَ مِنْ دُونِ اللَّهِ لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ أَخْبَرَ أَنَّ الْأَصْنَام الَّتِي يَدْعُونَهَا مِنْ دُون اللَّه لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ كَمَا قَالَ الْخَلِيل " أَتَعْبُدُونَ مَا تَنْحِتُونَ وَاَللَّه خَلَقَكُمْ وَمَا تَعْمَلُونَ " .</p></td></tr></table></body></html>
