<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا بُشِّرَ أَحَدُهُمْ بِالْأُنْثَى ظَلَّ وَجْهُهُ مُسْوَدًّا وَهُوَ كَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>فَإِنَّهُ " إِذَا بُشِّرَ أَحَدهمْ بِالْأُنْثَى ظَلَّ وَجْهه مُسْوَدًّا " أَيْ كَئِيبًا مِنْ الْهَمّ " وَهُوَ كَظِيم " سَاكِت مِنْ شِدَّة مَا هُوَ فِيهِ مِنْ الْحُزْن .</p></td></tr></table></body></html>
