<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ تَوَلَّوْا فَإِنَّمَا عَلَيْكَ الْبَلَاغُ الْمُبِينُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " فَإِنْ تَوَلَّوْا " أَيْ بَعْد هَذَا الْبَيَان وَهَذَا الِامْتِنَان فَلَا عَلَيْك مِنْهُمْ " فَإِنَّمَا عَلَيْك الْبَلَاغ الْمُبِين " وَقَدْ أَدَّيْته إِلَيْهِمْ .</p></td></tr></table></body></html>
