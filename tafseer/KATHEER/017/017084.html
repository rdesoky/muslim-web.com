<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ كُلٌّ يَعْمَلُ عَلَى شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَى سَبِيلًا</td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ " قُلْ كُلّ يَعْمَل عَلَى شَاكِلَته فَرَبّكُمْ أَعْلَم بِمَنْ هُوَ أَهْدَى سَبِيلًا " أَيْ مِنَّا وَمِنْكُمْ وَسَيَجْزِي كُلّ عَامِل بِعَمَلِهِ فَإِنَّهُ لَا تَخْفَى عَلَيْهِ خَافِيَة .</p></td></tr></table></body></html>
