<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَاكِثِينَ فِيهِ أَبَدًا</td></tr><tr><td align=right dir=rtl><p>" مَاكِثِينَ فِيهِ " فِي ثَوَابهمْ عِنْد اللَّه وَهُوَ الْجَنَّة خَالِدِينَ فِيهِ أَبَدًا دَائِمًا لَا زَوَال لَهُ وَلَا اِنْقِضَاء .</p></td></tr></table></body></html>
