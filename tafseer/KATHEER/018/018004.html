<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُنْذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا</td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن إِسْحَاق وَهُمْ مُشْرِكُو الْعَرَب فِي قَوْلهمْ نَحْنُ نَعْبُد الْمَلَائِكَة وَهُمْ بَنَات اللَّه .</p></td></tr></table></body></html>
