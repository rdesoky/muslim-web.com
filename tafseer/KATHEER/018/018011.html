<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَضَرَبْنَا عَلَى آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا</td></tr><tr><td align=right dir=rtl><p>وَقَوْله " فَضَرَبْنَا عَلَى آذَانهمْ فِي الْكَهْف سِنِينَ عَدَدًا " أَيْ أَلْقَيْنَا عَلَيْهِمْ النَّوْم حِين دَخَلُوا إِلَى الْكَهْف فَنَامُوا سِنِينَ كَثِيرَة .</p></td></tr></table></body></html>
