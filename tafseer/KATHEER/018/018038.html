<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَكِنَّا هُوَ اللَّهُ رَبِّي وَلَا أُشْرِكُ بِرَبِّي أَحَدًا</td></tr><tr><td align=right dir=rtl><p>" لَكِنَّا هُوَ اللَّه رَبِّي " أَيْ لَكِنْ أَنَا لَا أَقُول بِمَقَالَتِك بَلْ أَعْتَرِف لِلَّهِ بِالْوَحْدَانِيَّةِ وَالرُّبُوبِيَّة " وَلَا أُشْرِك بِرَبِّي أَحَدًا " أَيْ بَلْ هُوَ اللَّه الْمَعْبُود وَحْده لَا شَرِيك لَهُ.</p></td></tr></table></body></html>
