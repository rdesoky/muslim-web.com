<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ ذَلِكَ مَا كُنَّا نَبْغِ فَارْتَدَّا عَلَى آثَارِهِمَا قَصَصًا</td></tr><tr><td align=right dir=rtl><p>" قَالَ ذَلِكَ مَا كُنَّا نَبْغِ " أَيْ هَذَا هُوَ الَّذِي نَطْلُب " فَارْتَدَّا " أَيْ رَجَعَا " عَلَى آثَارهمَا " أَيْ طَرِيقهمَا " قَصَصًا " أَيْ يَقُصَّانِ آثَار مَشْيهمَا وَيَقْفُوَانِ أَثَرهمَا .</p></td></tr></table></body></html>
