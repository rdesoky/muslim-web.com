<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَيْفَ تَصْبِرُ عَلَى مَا لَمْ تُحِطْ بِهِ خُبْرًا</td></tr><tr><td align=right dir=rtl><p>" وَكَيْف تَصْبِر عَلَى مَا لَمْ تُحِطْ بِهِ خُبْرًا " فَأَنَا أَعْرِف أَنَّك سَتُنْكِرُ عَلَيَّ مَا أَنْتَ مَعْذُور فِيهِ وَلَكِنْ مَا اِطَّلَعْت عَلَى حِكْمَته وَمَصْلَحَته الْبَاطِنَة الَّتِي اِطَّلَعْت أَنَا عَلَيْهَا دُونك .</p></td></tr></table></body></html>
