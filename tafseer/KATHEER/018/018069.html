<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ سَتَجِدُنِي إِنْ شَاءَ اللَّهُ صَابِرًا وَلَا أَعْصِي لَكَ أَمْرًا</td></tr><tr><td align=right dir=rtl><p>" قَالَ " أَيْ مُوسَى " سَتَجِدُنِي إِنْ شَاءَ اللَّه صَابِرًا " أَيْ عَلَى مَا أَرَى مِنْ أُمُورك " وَلَا أَعْصِي لَك أَمْرًا " أَيْ وَلَا أُخَالِفك فِي شَيْء فَعِنْد ذَلِكَ شَارَطَهُ الْخَضِر عَلَيْهِ السَّلَام .</p></td></tr></table></body></html>
