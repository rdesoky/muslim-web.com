<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَتْبَعَ سَبَبًا</td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ ذِي الْقَرْنَيْنِ " ثُمَّ أَتْبَعَ سَبَبًا " أَيْ ثُمَّ سَلَكَ طَرِيقًا مِنْ مَشَارِق الْأَرْض .</p></td></tr></table></body></html>
