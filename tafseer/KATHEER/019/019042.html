<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لِأَبِيهِ يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ</td></tr><tr><td align=right dir=rtl><p>كَيْف نَهَاهُ عَنْ عِبَادَة الْأَصْنَام فَقَالَ " يَا أَبَتِ لِمَ تَعْبُد مَا لَا يَسْمَع وَلَا يُبْصِر وَلَا يُغْنِي عَنْك شَيْئًا " أَيْ لَا يَنْفَعك وَلَا يَدْفَع عَنْك ضَرَرًا .</p></td></tr></table></body></html>
