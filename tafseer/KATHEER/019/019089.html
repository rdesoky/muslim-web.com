<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ جِئْتُمْ شَيْئًا إِدًّا</td></tr><tr><td align=right dir=rtl><p>لَقَدْ جِئْتُمْ " أَيْ فِي قَوْلكُمْ هَذَا " شَيْئًا إِدًّا " قَالَ اِبْن عَبَّاس وَمُجَاهِد وَقَتَادَة وَمَالِك أَيْ عَظِيمًا وَيُقَال إِدًّا بِكَسْرِ الْهَمْزَة وَفَتْحهَا وَمَعَ مَدّهَا أَيْضًا ثَلَاث لُغَات أَشْهَرهَا الْأُولَى .</p></td></tr></table></body></html>
