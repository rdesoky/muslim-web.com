<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَنْبَغِي لِلرَّحْمَنِ أَنْ يَتَّخِذَ وَلَدًا</td></tr><tr><td align=right dir=rtl><p>وَقَوْله " وَمَا يَنْبَغِي لِلرَّحْمَنِ أَنْ يَتَّخِذ وَلَدًا " أَيْ لَا يَصْلُح لَهُ وَلَا يَلِيق بِهِ لِجَلَالِهِ وَعَظَمَته لِأَنَّهُ لَا كُفْء لَهُ مِنْ خَلْقه لِأَنَّ جَمِيع الْخَلَائِق عَبِيد لَهُ .</p></td></tr></table></body></html>
