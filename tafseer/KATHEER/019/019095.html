<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُّهُمْ آتِيهِ يَوْمَ الْقِيَامَةِ فَرْدًا</td></tr><tr><td align=right dir=rtl><p>" وَكُلّهمْ آتِيه يَوْم الْقِيَامَة فَرْدًا " أَيْ لَا نَاصِر لَهُ وَلَا مُجِير إِلَّا اللَّه وَحْده لَا شَرِيك لَهُ فَيَحْكُم فِي خَلْقه بِمَا يَشَاء وَهُوَ الْعَادِل الَّذِي لَا يَظْلِم مِثْقَال ذَرَّة وَلَا يَظْلِم أَحَدًا .</p></td></tr></table></body></html>
