<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهَلْ أَتَاكَ حَدِيثُ مُوسَى</td></tr><tr><td align=right dir=rtl><p>مِنْ هَاهُنَا شَرَعَ تَبَارَكَ وَتَعَالَى فِي ذِكْر قِصَّة مُوسَى وَكَيْف كَانَ اِبْتِدَاء الْوَحْي إِلَيْهِ وَتَكْلِيمه إِيَّاهُ وَذَلِكَ بَعْدَمَا قَضَى مُوسَى الْأَجَل الَّذِي كَانَ بَيْنه وَبَيْن صِهْره فِي رِعَايَة الْغَنَم .</p></td></tr></table></body></html>
