<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَلْقِهَا يَا</td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " قَالَ أَلْقِهَا يَا مُوسَى " أَيْ هَذِهِ الْعَصَا الَّتِي فِي يَدك يَا مُوسَى أَلْقِهَا .</p></td></tr></table></body></html>
