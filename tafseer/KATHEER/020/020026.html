<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسِّرْ لِي أَمْرِي</td></tr><tr><td align=right dir=rtl><p>قَالَ " رَبّ اِشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي " أَيْ إِنْ لَمْ تَكُنْ أَنْتَ عَوْنِي وَنَصِيرِي وَعَضُدِي وَظَهِيرِي وَإِلَّا فَلَا طَاقَة لِي بِذَلِكَ .</p></td></tr></table></body></html>
