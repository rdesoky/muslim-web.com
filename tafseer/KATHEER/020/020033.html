<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَيْ نُسَبِّحَكَ كَثِيرًا</td></tr><tr><td align=right dir=rtl><p>" كَيْ نُسَبِّحك كَثِيرًا وَنَذْكُرك كَثِيرًا " قَالَ مُجَاهِد لَا يَكُون الْعَبْد مِنْ الذَّاكِرِينَ اللَّه كَثِيرًا حَتَّى يَذْكُر اللَّه قَائِمًا وَقَاعِدًا وَمُضْطَجِعًا .</p></td></tr></table></body></html>
