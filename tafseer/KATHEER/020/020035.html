<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ كُنْتَ بِنَا بَصِيرًا</td></tr><tr><td align=right dir=rtl><p>وَقَوْله " إِنَّك كُنْت بِنَا بَصِيرًا " أَيْ فِي اِصْطِفَائِك لَنَا وَإِعْطَائِك إِيَّانَا النُّبُوَّة وَبَعْثَتك لَنَا إِلَى عَدُوّك فِرْعَوْن فَلَك الْحَمْد عَلَى ذَلِكَ .</p></td></tr></table></body></html>
