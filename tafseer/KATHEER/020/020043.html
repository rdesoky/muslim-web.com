<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اذْهَبَا إِلَى فِرْعَوْنَ إِنَّهُ طَغَى</td></tr><tr><td align=right dir=rtl><p>وَقَوْله " اِذْهَبَا إِلَى فِرْعَوْن إِنَّهُ طَغَى " أَيْ تَمَرَّدَ وَعَتَا وَتَجَبَّرَ عَلَى اللَّه وَعَصَاهُ .</p></td></tr></table></body></html>
