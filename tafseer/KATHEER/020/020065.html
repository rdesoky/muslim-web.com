<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا مُوسَى إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ</td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ السَّحَرَة حِين تَوَافَقُوا هُمْ وَمُوسَى عَلَيْهِ السَّلَام أَنَّهُمْ قَالُوا لِمُوسَى " إِمَّا أَنْ تُلْقِي " أَيْ أَنْتَ أَوَّلًا .</p></td></tr></table></body></html>
