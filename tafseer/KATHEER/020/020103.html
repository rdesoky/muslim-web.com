<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَتَخَافَتُونَ بَيْنَهُمْ إِنْ لَبِثْتُمْ إِلَّا عَشْرًا</td></tr><tr><td align=right dir=rtl><p>" يَتَخَافَتُونَ بَيْنهمْ " قَالَ اِبْن عَبَّاس يَتَسَاوَرُونَ بَيْنهمْ أَيْ يَقُول بَعْضهمْ لِبَعْضٍ " إِنْ لَبِثْتُمْ إِلَّا عَشْرًا " أَيْ فِي الدَّار الدُّنْيَا لَقَدْ كَانَ لُبْثكُمْ فِيهَا قَلِيلًا عَشَرَة أَيَّام أَوْ نَحْوهَا .</p></td></tr></table></body></html>
