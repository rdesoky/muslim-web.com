<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَسْأَلُونَكَ عَنِ الْجِبَالِ فَقُلْ يَنْسِفُهَا رَبِّي نَسْفًا</td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى " وَيَسْأَلُونَك عَنْ الْجِبَال " أَيْ هَلْ تَبْقَى يَوْم الْقِيَامَة أَوْ تَزُول ؟ فَقُلْ يَنْسِفهَا رَبِّي نَسْفًا أَيْ يُذْهِبهَا عَنْ أَمَاكِنهَا وَيَمْحَقهَا وَيُسَيِّرهَا تَسْيِيرًا .</p></td></tr></table></body></html>
