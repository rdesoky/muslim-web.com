<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَيَذَرُهَا قَاعًا صَفْصَفًا</td></tr><tr><td align=right dir=rtl><p>" فَيَذَرهَا " أَيْ الْأَرْض " قَاعًا صَفْصَفًا " أَيْ بِسَاطًا وَاحِدًا وَالْقَاع هُوَ الْمُسْتَوِي مِنْ الْأَرْض وَالصَّفْصَف تَأْكِيد لِمَعْنَى ذَلِكَ وَقِيلَ الَّذِي لَا نَبَات فِيهِ وَالْأَوَّل أَوْلَى وَإِنْ كَانَ الْآخَر مُرَادًا أَيْضًا بِاللَّازِمِ .</p></td></tr></table></body></html>
