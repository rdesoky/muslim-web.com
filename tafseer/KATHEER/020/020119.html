<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّكَ لَا تَظْمَأُ فِيهَا وَلَا تَضْحَى</td></tr><tr><td align=right dir=rtl><p>" وَأَنَّك لَا تَظْمَأ فِيهَا وَلَا تَضْحَى " وَهَذَانِ أَيْضًا مُتَقَابِلَانِ فَالظَّمَأ حَرّ الْبَاطِن وَهُوَ الْعَطَش وَالضُّحَى حَرّ الظَّاهِر .</p></td></tr></table></body></html>
