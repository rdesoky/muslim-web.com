<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ لِمَ حَشَرْتَنِي أَعْمَى وَقَدْ كُنْتُ بَصِيرًا</td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا يَقُول " رَبّ لِمَ حَشَرْتنِي أَعْمَى وَقَدْ كُنْت بَصِيرًا " أَيْ فِي الدُّنْيَا .</p></td></tr></table></body></html>
