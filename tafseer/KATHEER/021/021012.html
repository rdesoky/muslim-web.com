<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا أَحَسُّوا بَأْسَنَا إِذَا هُمْ مِنْهَا يَرْكُضُونَ</td></tr><tr><td align=right dir=rtl><p>" فَلَمَّا أَحَسُّوا بَأْسنَا " أَيْ تَيَقَّنُوا أَنَّ الْعَذَاب وَاقِع بِهِمْ لَا مَحَالَة كَمَا وَعَدَهُمْ نَبِيّهمْ " إِذَا هُمْ مِنْهَا يَرْكُضُونَ" أَيْ يَفِرُّونَ هَارِبِينَ .</p></td></tr></table></body></html>
