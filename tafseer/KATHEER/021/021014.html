<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا وَيْلَنَا إِنَّا كُنَّا</td></tr><tr><td align=right dir=rtl><p>" قَالُوا يَا وَيْلنَا إِنَّا كُنَّا ظَالِمِينَ " اِعْتَرَفُوا بِذُنُوبِهِمْ حِين لَا يَنْفَعهُمْ ذَلِكَ .</p></td></tr></table></body></html>
