<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا وَجَدْنَا آبَاءَنَا لَهَا عَابِدِينَ</td></tr><tr><td align=right dir=rtl><p>" قَالُوا وَجَدْنَا آبَاءَنَا لَهَا عَابِدِينَ " لَمْ يَكُنْ لَهُمْ حُجَّة سِوَى صَنِيع آبَائِهِمْ الضَّلَال .</p></td></tr></table></body></html>
