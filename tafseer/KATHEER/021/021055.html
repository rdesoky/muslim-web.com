<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَجِئْتَنَا بِالْحَقِّ أَمْ أَنْتَ مِنَ اللَّاعِبِينَ</td></tr><tr><td align=right dir=rtl><p>قَالُوا أَجِئْتنَا بِالْحَقِّ أَمْ أَنْتَ مِنْ اللَّاعِبِينَ " يَقُولُونَ هَذَا الْكَلَام الصَّادِر عَنْك تَقُولهُ لَاعِبًا أَوْ مُحِقًّا فِيهِ فَإِنَّا لَمْ نَسْمَع بِهِ قَبْلك .</p></td></tr></table></body></html>
