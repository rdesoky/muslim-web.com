<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَأَنْتَ فَعَلْتَ هَذَا بِآلِهَتِنَا يَا</td></tr><tr><td align=right dir=rtl><p>قَالُوا أَأَنْت فَعَلْت هَذَا بِآلِهَتِنَا يَا إِبْرَاهِيم قَالَ بَلْ فَعَلَهُ كَبِيرهمْ هَذَا " يَعْنِي الَّذِي تَرَكَهُ لَمْ يُكَسِّرهُ .</p></td></tr></table></body></html>
