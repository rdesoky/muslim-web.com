<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَفَتَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ</td></tr><tr><td align=right dir=rtl><p>أَفَتَعْبُدُونَ مِنْ دُون اللَّه مَا لَا يَنْفَعكُمْ شَيْئًا وَلَا يَضُرّكُمْ " أَيْ إِذَا كَانَتْ لَا تَنْطِق وَهِيَ لَا تَنْفَع وَلَا تَضُرّ فَلِمَ تَعْبُدُونَهَا مِنْ دُون اللَّه " .</p></td></tr></table></body></html>
