<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّكُمْ بَعْدَ ذَلِكَ لَمَيِّتُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " ثُمَّ إِنَّكُمْ بَعْد ذَلِكَ لَمَيِّتُونَ " يَعْنِي بَعْد هَذِهِ النَّشْأَة الْأُولَى مِنْ الْعَدَم تَصِيرُونَ إِلَى الْمَوْت .</p></td></tr></table></body></html>
