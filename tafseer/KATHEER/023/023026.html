<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ انْصُرْنِي بِمَا كَذَّبُونِ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ نُوح عَلَيْهِ السَّلَام أَنَّهُ دَعَا رَبّه لِيَسْتَنْصِرهُ عَلَى قَوْمه كَمَا قَالَ تَعَالَى مُخْبِرًا عَنْهُ فِي الْآيَة الْأُخْرَى" فَدَعَا رَبّه أَنِّي مَغْلُوب فَانْتَصِرْ " وَقَالَ هَهُنَا " رَبّ اُنْصُرْنِي بِمَا كَذَّبُونِ " .</p></td></tr></table></body></html>
