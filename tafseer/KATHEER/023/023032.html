<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرْسَلْنَا فِيهِمْ رَسُولًا مِنْهُمْ أَنِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ أَفَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَأَنَّهُ تَعَالَى أَرْسَلَ فِيهِمْ رَسُولًا مِنْهُمْ فَدَعَاهُمْ إِلَى عِبَادَة اللَّه وَحْده لَا شَرِيك لَهُ .</p></td></tr></table></body></html>
