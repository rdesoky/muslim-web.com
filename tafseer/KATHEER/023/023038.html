<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هُوَ إِلَّا رَجُلٌ افْتَرَى عَلَى اللَّهِ كَذِبًا وَمَا نَحْنُ لَهُ بِمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>" إِنْ هُوَ إِلَّا رَجُل اِفْتَرَى عَلَى اللَّه كَذِبًا " أَيْ فِيمَا جَاءَكُمْ بِهِ مِنْ الرِّسَالَة وَالنِّذَارَة وَالْإِخْبَار بِالْمَعَادِ " وَمَا نَحْنُ لَهُ بِمُؤْمِنِينَ " .</p></td></tr></table></body></html>
