<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ عَمَّا قَلِيلٍ لَيُصْبِحُنَّ نَادِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ عَمَّا قَلِيل لَيُصْبِحُنَّ نَادِمِينَ " أَيْ بِمُخَالَفَتِك وَعِنَادك فِيمَا جِئْتهمْ بِهِ .</p></td></tr></table></body></html>
