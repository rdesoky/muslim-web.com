<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ قُرُونًا آخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى" ثُمَّ أَنْشَأْنَا مِنْ بَعْدهمْ قُرُونًا آخَرِينَ " أَيْ أُمَمًا وَخَلَائِق .</p></td></tr></table></body></html>
