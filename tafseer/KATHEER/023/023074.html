<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ عَنِ الصِّرَاطِ لَنَاكِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>لَنَاكِبُونَ " أَيْ لَعَادِلُونَ جَائِرُونَ مُنْحَرِفُونَ تَقُول الْعَرَب نَكَبَ فُلَان عَنْ الطَّرِيق إِذَا زَاغَ عَنْهَا .</p></td></tr></table></body></html>
