<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَقُولُونَ لِلَّهِ قُلْ أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" سَيَقُولُونَ لِلَّهِ " أَيْ فَيَعْتَرِفُونَ لَك بِأَنَّ ذَلِكَ لِلَّهِ وَحْده لَا شَرِيك لَهُ فَإِذَا كَانَ ذَلِكَ " قُلْ أَفَلَا تَذَكَّرُونَ " أَنَّهُ لَا تَنْبَغِي الْعِبَادَة إِلَّا لِلْخَالِقِ الرَّازِق لَا لِغَيْرِهِ .</p></td></tr></table></body></html>
