<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَتَعَالَى عَمَّا يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>" عَالِم الْغَيْب وَالشَّهَادَة " أَيْ يَعْلَم مَا يَغِيب عَنْ الْمَخْلُوقَات وَمَا يُشَاهِدُونَهُ " فَتَعَالَى عَمَّا يُشْرِكُونَ " أَيْ تَقَدَّسَ وَتَنَزَّهَ وَتَعَالَى وَعَزَّ وَجَلَّ عَمَّا يَقُول الظَّالِمُونَ وَالْجَاحِدُونَ .</p></td></tr></table></body></html>
