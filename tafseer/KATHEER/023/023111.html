<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي جَزَيْتُهُمُ الْيَوْمَ بِمَا صَبَرُوا أَنَّهُمْ هُمُ الْفَائِزُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ تَعَالَى " إِنِّي جَزَيْتهمْ الْيَوْم بِمَا صَبَرُوا " أَيْ عَلَى أَذَاكُمْ لَهُمْ وَاسْتِهْزَائِكُمْ بِهِمْ " أَنَّهُمْ هُمْ الْفَائِزُونَ " بِالسَّعَادَةِ وَالسَّلَامَة وَالْجَنَّة وَالنَّجَاة مِنْ النَّار .</p></td></tr></table></body></html>
