<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ وَاللَّهُ عَلِيمٌ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَعَالَى " وَيُبَيِّن اللَّه لَكُمْ الْآيَات " أَيْ يُوَضِّح لَكُمْ الْأَحْكَام الشَّرْعِيَّة وَالْحِكَم الْقَدَرِيَّة " وَاَللَّه عَلِيم حَكِيم " أَيْ عَلِيم بِمَا يُصْلِح عِبَاده حَكِيم فِي شَرْعه وَقَدَره .</p></td></tr></table></body></html>
