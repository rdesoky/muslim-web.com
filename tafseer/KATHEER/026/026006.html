<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَدْ كَذَّبُوا فَسَيَأْتِيهِمْ أَنْبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ تَعَالَى هَهُنَا " فَقَدْ كَذَّبُوا فَسَيَأْتِيهِمْ أَنْبَاء مَا كَانُوا بِهِ يَسْتَهْزِئُونَ " أَيْ فَقَدْ كَذَّبُوا بِمَا جَاءَهُمْ مِنْ الْحَقّ فَسَيَعْلَمُونَ نَبَأ هَذَا التَّكْذِيب بَعْد حِين .</p></td></tr></table></body></html>
