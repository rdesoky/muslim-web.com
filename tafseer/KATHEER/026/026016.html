<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأْتِيَا فِرْعَوْنَ فَقُولَا إِنَّا رَسُولُ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>كَقَوْلِهِ فِي الْآيَة الْأُخْرَى " إِنَّا رَسُولَا رَبّك " أَيْ كُلّ مِنَّا أُرْسِلَ إِلَيْك .</p></td></tr></table></body></html>
