<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَعَلْتَ فَعْلَتَكَ الَّتِي فَعَلْتَ وَأَنْتَ مِنَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ " وَأَنْتَ مِنْ الْكَافِرِينَ " أَيْ الْجَاحِدِينَ قَالَهُ اِبْن عَبَّاس وَعَبْد الرَّحْمَن بْن زَيْد بْن أَسْلَم وَاخْتَارَهُ اِبْن جَرِير .</p></td></tr></table></body></html>
