<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ</font></td></tr><tr><td align=right dir=rtl><p>فِيمَا قَالَهُ " أَلَا تَسْتَمِعُونَ " أَيْ أَلَا تَعْجَبُونَ مِنْ هَذَا فِي زَعْمه أَنَّ لَكُمْ إِلَهًا غَيْرِي ؟ .</p></td></tr></table></body></html>
