<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ لَهُمْ مُوسَى " رَبّكُمْ وَرَبّ آبَائِكُمْ الْأَوَّلِينَ " أَيْ خَالِقكُمْ وَخَالِق آبَائِكُمْ الْأَوَّلِينَ الَّذِي كَانُوا قَبْل فِرْعَوْن وَزَمَانه .</p></td></tr></table></body></html>
