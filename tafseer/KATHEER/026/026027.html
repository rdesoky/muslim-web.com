<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ</font></td></tr><tr><td align=right dir=rtl><p>إِلَيْكُمْ لَمَجْنُون " أَيْ لَيْسَ لَهُ عَقْل فِي دَعْوَاهُ أَنَّ ثَمَّ رَبًّا غَيْرِي " قَالَ " أَيْ مُوسَى لِأُولَئِكَ الَّذِينَ أَوْعَزَ إِلَيْهِمْ فِرْعَوْن مَا أَوْعَزَ مِنْ الشُّبْهَة .</p></td></tr></table></body></html>
