<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَأْتِ بِهِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ فَأْتِ بِهِ إِنْ كُنْت مِنْ الصَّادِقِينَ فَأَلْقَى عَصَاهُ فَإِذَا هِيَ ثُعْبَان مُبِين " أَيْ ظَاهِر وَاضِح فِي غَايَة الْجَلَاء وَالْوُضُوح وَالْعَظَمَة ذَات قَوَائِم وَفَم كَبِير وَشَكْل هَائِل مُزْعِج .</p></td></tr></table></body></html>
