<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَرْجِهْ وَأَخَاهُ وَابْعَثْ فِي الْمَدَائِنِ حَاشِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالُوا أَرْجِهْ وَأَخَاهُ وَابْعَثْ فِي الْمَدَائِن حَاشِرِينَ يَأْتُوك بِكُلِّ سَحَّار عَلِيم " أَيْ أَخِّرْهُ وَأَخَاهُ حَتَّى تَجْمَع لَهُ مِنْ مَدَائِن مَمْلَكَتك وَأَقَالِيم دَوْلَتك .</p></td></tr></table></body></html>
