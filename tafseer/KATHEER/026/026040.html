<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَعَلَّنَا نَتَّبِعُ السَّحَرَةَ إِنْ كَانُوا هُمُ الْغَالِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ قَائِلهمْ " لَعَلَّنَا نَتَّبِع السَّحَرَة إِنْ كَانُوا هُمْ الْغَالِبِينَ " وَلَمْ يَقُولُوا نَتَّبِع الْحَقّ سَوَاء كَانَ مِنْ السَّحَرَة أَوْ مِنْ مُوسَى بَلْ الرَّعِيَّة عَلَى دِين مَلِكِهِمْ.</p></td></tr></table></body></html>
