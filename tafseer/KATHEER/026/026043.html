<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَعَادُوا إِلَى مَقَام الْمُنَاظَرَة " قَالُوا يَا مُوسَى إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُون أَوَّل مَنْ أَلْقَى قَالَ بَلْ أَلْقُوا " وَقَدْ اِخْتُصِرَ هَذَا هَهُنَا فَقَالَ لَهُمْ مُوسَى .</p></td></tr></table></body></html>
