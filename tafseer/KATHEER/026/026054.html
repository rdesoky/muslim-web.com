<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ هَؤُلَاءِ " يَعْنِي بَنِي إِسْرَائِيل " لَشِرْذِمَة قَلِيلُونَ " أَيْ لَطَائِفَة قَلِيلَة.</p></td></tr></table></body></html>
