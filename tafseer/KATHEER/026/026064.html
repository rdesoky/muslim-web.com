<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَزْلَفْنَا ثَمَّ الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ فِي هَذِهِ الْقِصَّة " وَأَزْلَفْنَا ثَمَّ الْآخَرِينَ " أَيْ هُنَالِكَ قَالَ اِبْن عَبَّاس وَعَطَاء الْخُرَاسَانِيّ وَقَتَادَة وَالسُّدِّيّ " وَأَزْلَفْنَا " أَيْ قَرَّبْنَا مِنْ الْبَحْر فِرْعَوْن وَجُنُوده وَأَدْنَيْنَاهُمْ إِلَيْهِ .</p></td></tr></table></body></html>
