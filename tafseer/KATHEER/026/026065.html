<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنْجَيْنَا مُوسَى وَمَنْ مَعَهُ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>" وَأَنْجَيْنَا مُوسَى وَمَنْ مَعَهُ أَجْمَعِينَ " أَيْ أَنْجَيْنَا مُوسَى وَبَنِي إِسْرَائِيل وَمَنْ اِتَّبَعَهُمْ عَلَى دِينهمْ فَلَمْ يَهْلِك مِنْهُمْ أَحَد .</p></td></tr></table></body></html>
