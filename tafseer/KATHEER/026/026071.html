<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا نَعْبُدُ أَصْنَامًا فَنَظَلُّ لَهَا عَاكِفِينَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالُوا نَعْبُد أَصْنَامًا فَنَظَلّ لَهَا عَاكِفِينَ " أَيْ مُقِيمِينَ عَلَى عِبَادَتهَا وَدُعَائِهَا .</p></td></tr></table></body></html>
