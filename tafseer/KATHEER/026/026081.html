<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي يُمِيتُنِي ثُمَّ يُحْيِينِ</font></td></tr><tr><td align=right dir=rtl><p>" وَاَلَّذِي يُمِيتنِي ثُمَّ يُحْيِينِ " أَيْ هُوَ الَّذِي يُحْيِي وَيُمِيت لَا يَقْدِر عَلَى ذَلِكَ أَحَد سِوَاهُ فَإِنَّهُ هُوَ الَّذِي يُبْدِئ وَيُعِيد .</p></td></tr></table></body></html>
