<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى :" وَاجْعَلْنِي مِنْ وَرَثَة جَنَّة النَّعِيم " أَيْ أَنْعِمْ عَلَيَّ فِي الدُّنْيَا بِبَقَاءِ الذِّكْر الْجَمِيل بَعْدِي وَفِي الْآخِرَة بِأَنْ تَجْعَلنِي مِنْ وَرَثَة جَنَّة النَّعِيم .</p></td></tr></table></body></html>
