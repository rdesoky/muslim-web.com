<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p>" وَأُزْلِفَتْ الْجَنَّة" أَيْ قُرِّبَتْ وَأُدْنِيَتْ مِنْ أَهْلهَا مُزَخْرَفَة مُزَيَّنَة لِنَاظِرِيهَا وَهُمْ الْمُتَّقُونَ الَّذِينَ رَغِبُوا فِيهَا عَلَى مَا فِي الدُّنْيَا وَعَمِلُوا لَهَا فِي الدُّنْيَا .</p></td></tr></table></body></html>
