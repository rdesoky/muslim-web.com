<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبُرِّزَتِ الْجَحِيمُ لِلْغَاوِينَ</font></td></tr><tr><td align=right dir=rtl><p>" وَبُرِّزَتْ الْجَحِيم لِلْغَاوِينَ" أَيْ أُظْهِرَتْ وَكُشِفَ عَنْهَا وَبَدَتْ مِنْهَا عُنُق فَزَفَرَتْ زَفْرَة بَلَغَتْ مِنْهَا الْقُلُوب الْحَنَاجِر وَقِيلَ لِأَهْلِهَا تَقْرِيعًا وَتَوْبِيخًا .</p></td></tr></table></body></html>
