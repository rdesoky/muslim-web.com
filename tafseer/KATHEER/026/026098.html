<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ نُسَوِّيكُمْ بِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>" تَاللَّهِ إِنْ كُنَّا لَفِي ضَلَال مُبِين إِذْ نُسَوِّيكُمْ بِرَبِّ الْعَالَمِينَ " أَيْ نَجْعَل أَمْركُمْ مُطَاعًا كَمَا يُطَاع أَمْر رَبّ الْعَالَمِينَ وَعَبَدْنَاكُمْ مَعَ رَبّ الْعَالَمِينَ .</p></td></tr></table></body></html>
