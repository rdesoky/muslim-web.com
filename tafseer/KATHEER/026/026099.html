<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَضَلَّنَا إِلَّا الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَمَا أَضَلَّنَا إِلَّا الْمُجْرِمُونَ " أَيْ مَا دَعَانَا إِلَى ذَلِكَ إِلَّا الْمُجْرِمُونَ.</p></td></tr></table></body></html>
