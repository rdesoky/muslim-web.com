<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَنَا مِنْ شَافِعِينَ</font></td></tr><tr><td align=right dir=rtl><p>" فَمَا لَنَا مِنْ شَافِعِينَ " قَالَ بَعْضهمْ يَعْنِي مِنْ الْمَلَائِكَة كَمَا يَقُولُونَ " فَهَلْ لَنَا مِنْ شُفَعَاء فَيَشْفَعُوا لَنَا أَوْ نُرَدّ فَنَعْمَل غَيْر الَّذِي كُنَّا نَعْمَل " وَكَذَا قَالُوا : " فَمَا لَنَا مِنْ شَافِعِينَ ".</p></td></tr></table></body></html>
