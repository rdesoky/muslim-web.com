<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ إِنْ أَجْرِيَ إِلَّا عَلَى رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>" فَاتَّقُوا اللَّه وَأَطِيعُونِ وَمَا أَسْأَلكُمْ عَلَيْهِ مِنْ أَجْر " الْآيَة أَيْ لَا أَطْلُب مِنْكُمْ جَزَاء عَلَى نُصْحِي لَكُمْ بَلْ أَدَّخِر ثَوَاب ذَلِكَ عِنْد اللَّه .</p></td></tr></table></body></html>
