<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ حِسَابُهُمْ إِلَّا عَلَى رَبِّي لَوْ تَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" إِنْ حِسَابهمْ إِلَّا عَلَى رَبِّي لَوْ تَشْعُرُونَ وَمَا أَنَا بِطَارِدِ الْمُؤْمِنِينَ" كَأَنَّهُمْ سَأَلُوا مِنْهُ أَنْ يُبْعِدهُمْ عَنْهُ وَيُتَابِعُوهُ فَأَبَى عَلَيْهِمْ ذَلِكَ .</p></td></tr></table></body></html>
