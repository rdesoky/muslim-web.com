<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَافْتَحْ بَيْنِي وَبَيْنَهُمْ فَتْحًا وَنَجِّنِي وَمَنْ مَعِيَ مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>رَبّ إِنَّ قَوْمِي كَذَّبُونِ فَافْتَحْ بَيْنِي وَبَيْنهمْ فَتْحًا " الْآيَة كَمَا قَالَ فِي الْآيَة الْأُخْرَى" فَدَعَا رَبّه أَنِّي مَغْلُوب فَانْتَصِرْ " إِلَى آخِر الْآيَة .</p></td></tr></table></body></html>
