<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَغْرَقْنَا بَعْدُ الْبَاقِينَ</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ أَغْرَقْنَا بَعْدُ الْبَاقِينَ " وَأَغْرَقْنَا مَنْ كَفَرَ بِهِ وَخَالَفَ أَمْره كُلّهمْ أَجْمَعِينَ " إِنَّ فِي ذَلِكَ لَآيَة وَمَا كَانَ أَكْثَرهمْ مُؤْمِنِينَ وَإِنَّ رَبّك لَهُوَ الْعَزِيز الرَّحِيم " .</p></td></tr></table></body></html>
