<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُمْ أَخُوهُمْ هُودٌ أَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَبَعَثَ اللَّه هُودًا إِلَيْهِمْ رَجُلًا مِنْهُمْ رَسُولًا وَبَشِيرًا وَنَذِيرًا فَدَعَاهُمْ إِلَى اللَّه وَحْده وَحَذَّرَهُمْ نِقْمَته وَعَذَابه فِي مُخَالَفَته وَبَطْشه فَقَالَ لَهُمْ كَمَا قَالَ نُوح لِقَوْمِهِ .</p></td></tr></table></body></html>
