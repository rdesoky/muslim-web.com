<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّقُوا اللَّهَ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>" فَاتَّقُوا اللَّه وَأَطِيعُونِ" أَيْ اُعْبُدُوا رَبّكُمْ وَأَطِيعُوا رَسُولكُمْ ثُمَّ شَرَعَ يُذَكِّرهُمْ نِعَم اللَّه عَلَيْهِمْ .</p></td></tr></table></body></html>
