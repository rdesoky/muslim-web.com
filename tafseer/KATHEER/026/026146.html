<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتُتْرَكُونَ فِي مَا هَا هُنَا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول لَهُمْ وَاعِظًا لَهُمْ وَمُحَذِّرهمْ نِقَم اللَّه أَنْ تَحِلّ بِهِمْ وَمُذَكِّرًا بِأَنْعُمِ اللَّه عَلَيْهِمْ فِيمَا رَزَقَهُمْ مِنْ الْأَرْزَاق الدَّارَّة وَجَعَلَهُمْ فِي أَمْن مِنْ الْمَحْذُورَات .</p></td></tr></table></body></html>
