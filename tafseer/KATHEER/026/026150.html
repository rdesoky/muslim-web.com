<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّقُوا اللَّهَ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ " فَاتَّقُوا اللَّه وَأَطِيعُونِ " أَيْ أَقْبِلُوا عَلَى مَا يَعُود نَفْعه عَلَيْكُمْ فِي الدُّنْيَا وَالْآخِرَة مِنْ عِبَادَة رَبّكُمْ الَّذِي خَلَقَكُمْ وَرَزَقَكُمْ لِتَعْبُدُوهُ وَتُوَحِّدُوهُ وَتُسَبِّحُوهُ بُكْرَة وَأَصِيلًا.</p></td></tr></table></body></html>
