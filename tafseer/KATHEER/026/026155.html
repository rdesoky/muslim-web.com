<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هَذِهِ نَاقَةٌ لَهَا شِرْبٌ وَلَكُمْ شِرْبُ يَوْمٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي تَرِد مَاءَكُمْ يَوْمًا وَيَوْمًا تَرِدُونَهُ أَنْتُمْ .</p></td></tr></table></body></html>
