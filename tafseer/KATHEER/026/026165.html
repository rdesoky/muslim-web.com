<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتَأْتُونَ الذُّكْرَانَ مِنَ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا نَهَاهُمْ نَبِيّ اللَّه عَنْ اِرْتِكَاب الْفَوَاحِش وَغَشَيَانهمْ الذُّكُور وَأَرْشَدَهُمْ إِلَى إِتْيَان نِسَائِهِمْ اللَّاتِي خَلَقَهُنَّ اللَّه لَهُمْ مَا كَانَ جَوَابهمْ لَهُ .</p></td></tr></table></body></html>
