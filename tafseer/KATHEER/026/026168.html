<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ " إِنِّي لِعَمَلِكُمْ مِنْ الْقَالِينَ " أَيْ الْمُبْغِضِينَ لَا أُحِبّهُ وَلَا أَرْضَى بِهِ وَإِنِّي بَرِيء مِنْكُمْ ثُمَّ دَعَا اللَّه عَلَيْهِمْ .</p></td></tr></table></body></html>
