<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ " رَبّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ " قَالَ اللَّه تَعَالَى " فَنَجَّيْنَاهُ وَأَهْله أَجْمَعِينَ " أَيْ كُلّهمْ .</p></td></tr></table></body></html>
