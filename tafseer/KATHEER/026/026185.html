<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّمَا أَنْتَ مِنَ الْمُسَحَّرِينَ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ جَوَاب قَوْمه لَهُ بِمِثْلِ مَا أَجَابَتْ بِهِ ثَمُود لِرَسُولِهَا تَشَابَهَتْ قُلُوبهمْ حَيْثُ قَالُوا " إِنَّمَا أَنْتَ مِنْ الْمُسَحَّرِينَ" يَعْنُونَ مِنْ الْمَسْحُورِينَ كَمَا تَقَدَّمَ .</p></td></tr></table></body></html>
