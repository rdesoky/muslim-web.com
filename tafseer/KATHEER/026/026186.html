<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا وَإِنْ نَظُنُّكَ لَمِنَ الْكَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>" وَمَا أَنْتَ إِلَّا بَشَر مِثْلنَا لَهُ إِنْ نَظُنّك لَمِنْ الْكَاذِبِينَ" أَيْ تَتَعَمَّد الْكَذِب فِيمَا تَقُولهُ لَا أَنَّ اللَّه أَرْسَلَك إِلَيْنَا .</p></td></tr></table></body></html>
