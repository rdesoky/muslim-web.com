<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّي أَعْلَمُ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالَ رَبِّي أَعْلَم بِمَا تَعْمَلُونَ " يَقُول اللَّه أَعْلَم بِكُمْ فَإِنْ كُنْتُمْ تَسْتَحِقُّونَ ذَلِكَ جَازَاكُمْ بِهِ وَهُوَ غَيْر ظَالِم لَكُمْ وَهَكَذَا وَقَعَ بِهِمْ جَزَاء كَمَا سَأَلُوا جَزَاء وِفَاقًا .</p></td></tr></table></body></html>
