<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يُؤْمِنُونَ بِهِ حَتَّى يَرَوُا الْعَذَابَ الْأَلِيمَ</font></td></tr><tr><td align=right dir=rtl><p>" لَا يُؤْمِنُونَ بِهِ " أَيْ بِالْحَقِّ " حَتَّى يَرَوْا الْعَذَاب الْأَلِيم" أَيْ حَيْثُ لَا يَنْفَع الظَّالِمِينَ مَعْذِرَتهمْ وَلَهُمْ اللَّعْنَة وَلَهُمْ سُوء الدَّار .</p></td></tr></table></body></html>
