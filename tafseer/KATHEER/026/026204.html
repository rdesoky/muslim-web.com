<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ " إِنْكَار عَلَيْهِمْ وَتَهْدِيد لَهُمْ فَإِنَّهُمْ كَانُوا يَقُولُونَ لِلرَّسُولِ تَكْذِيبًا وَاسْتِبْعَادًا : اِئْتِنَا بِعَذَابِ اللَّه ; كَمَا قَالَ تَعَالَى " وَيَسْتَعْجِلُونَك بِالْعَذَابِ" الْآيَة .</p></td></tr></table></body></html>
