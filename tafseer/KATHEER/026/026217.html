<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " وَتَوَكَّلَ عَلَى الْعَزِيز الرَّحِيم " أَيْ فِي جَمِيع أُمُورك فَإِنَّهُ مُؤَيِّدك وَحَافِظك وَنَاصِرك وَمُظَفِّرك وَمُعْلِي كَلِمَتك .</p></td></tr></table></body></html>
