<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُدًى وَبُشْرَى لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا تَحْصُل الْهِدَايَة وَالْبِشَارَة مِنْ الْقُرْآن لِمَنْ آمَنَ بِهِ وَاتَّبَعَهُ وَصَدَّقَهُ وَعَمِلَ بِمَا فِيهِ .</p></td></tr></table></body></html>
