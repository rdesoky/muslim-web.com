<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ لَهُمْ سُوءُ الْعَذَابِ وَهُمْ فِي الْآخِرَةِ هُمُ الْأَخْسَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" أُولَئِكَ الَّذِينَ لَهُمْ سُوء الْعَذَاب " أَيْ فِي الدُّنْيَا وَالْآخِرَة " وَهُمْ فِي الْآخِرَة هُمْ الْأَخْسَرُونَ" أَيْ لَيْسَ يَخْسَر أَنْفُسهمْ وَأَمْوَالهمْ سِوَاهُمْ مِنْ أَهْل الْمَحْشَر .</p></td></tr></table></body></html>
