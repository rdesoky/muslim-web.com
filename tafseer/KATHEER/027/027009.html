<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا مُوسَى إِنَّهُ أَنَا اللَّهُ الْعَزِيزُ</font></td></tr><tr><td align=right dir=rtl><p>أَعْلَمَهُ أَنَّ الَّذِي يُخَاطِبهُ وَيُنَاجِيه هُوَ رَبّه اللَّه الْعَزِيز الَّذِي عَزَّ كُلّ شَيْء وَقَهَرَهُ وَغَلَبَهُ الْحَكِيم فِي أَقْوَاله وَأَفْعَاله.</p></td></tr></table></body></html>
