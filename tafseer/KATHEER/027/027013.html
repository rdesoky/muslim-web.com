<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَتْهُمْ آيَاتُنَا مُبْصِرَةً قَالُوا هَذَا سِحْرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بَيِّنَة وَاضِحَة ظَاهِرَة " قَالُوا هَذَا سِحْر مُبِين " وَأَرَادُوا مُعَارَضَته بِسِحْرِهِمْ فَغُلِبُوا وَانْقَلَبُوا صَاغِرِينَ .</p></td></tr></table></body></html>
