<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا قَوْمِ لِمَ تَسْتَعْجِلُونَ بِالسَّيِّئَةِ قَبْلَ الْحَسَنَةِ لَوْلَا تَسْتَغْفِرُونَ اللَّهَ لَعَلَّكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِمَ تَدْعُونَ بِحُضُورِ الْعَذَاب وَلَا تَطْلُبُونَ مِنْ اللَّه رَحْمَته.</p></td></tr></table></body></html>
