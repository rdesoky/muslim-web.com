<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة تَوَاثَقُوا عَلَى أَنْ يَأْخُذُوهُ لَيْلًا فَيَقْتُلُوهُ وَذُكِرَ لَنَا أَنَّهُمْ بَيْنَمَا هُمْ مَعَانِيق إِلَى صَالِح لِيَفْتِكُوا بِهِ إِذْ بَعَثَ اللَّه عَلَيْهِمْ صَخْرَة فَأَهْمَدَتْهُمْ .</p></td></tr></table></body></html>
