<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِينَ كَفَرُوا أَئِذَا كُنَّا تُرَابًا وَآبَاؤُنَا أَئِنَّا لَمُخْرَجُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ مُنْكِرِي الْبَعْث مِنْ الْمُشْرِكِينَ أَنَّهُمْ اِسْتَبْعَدُوا إِعَادَة الْأَجْسَاد بَعْد صَيْرُورَتهَا عِظَامًا وَرُفَاتًا وَتُرَابًا .</p></td></tr></table></body></html>
