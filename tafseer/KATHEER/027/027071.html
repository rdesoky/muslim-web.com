<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ مَتَى هَذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ الْمُشْرِكِينَ فِي سُؤَالهمْ عَنْ يَوْم الْقِيَامَة وَاسْتِبْعَادهمْ وُقُوع ذَلِكَ " وَيَقُولُونَ مَتَى هَذَا الْوَعْد إِنْ كُنْتُمْ صَادِقِينَ " .</p></td></tr></table></body></html>
