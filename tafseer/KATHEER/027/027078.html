<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ يَقْضِي بَيْنَهُمْ بِحُكْمِهِ وَهُوَ الْعَزِيزُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ رَبّك يَقْضِي بَيْنهمْ " أَيْ يَوْم الْقِيَامَة " بِحُكْمِهِ وَهُوَ الْعَزِيز " أَيْ فِي اِنْتِقَامه " الْعَلِيم " بِأَفْعَالِ عِبَاده وَأَقْوَالهمْ .</p></td></tr></table></body></html>
