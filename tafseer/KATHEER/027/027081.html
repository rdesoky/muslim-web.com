<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتَ بِهَادِي الْعُمْيِ عَنْ ضَلَالَتِهِمْ إِنْ تُسْمِعُ إِلَّا مَنْ يُؤْمِنُ بِآيَاتِنَا فَهُمْ مُسْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا يَسْتَجِيب لَك مَنْ هُوَ سَمِيع بَصِير السَّمْع وَالْبَصَر النَّافِع فِي الْقَلْب وَالْبَصِيرَة الْخَاضِع لِلَّهِ وَلِمَا جَاءَ عَنْهُ عَلَى أَلْسِنَة الرُّسُل .</p></td></tr></table></body></html>
