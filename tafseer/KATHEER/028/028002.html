<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : " تِلْكَ " أَيْ هَذِهِ" آيَات الْكِتَاب الْمُبِين " أَيْ الْوَاضِح الْجَلِيّ الْكَاشِف عَنْ حَقَائِق الْأُمُور وَعِلْم مَا قَدْ كَانَ وَمَا هُوَ كَائِن .</p></td></tr></table></body></html>
