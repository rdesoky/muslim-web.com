<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ فَأْتُوا بِكِتَابٍ مِنْ عِنْدِ اللَّهِ هُوَ أَهْدَى مِنْهُمَا أَتَّبِعْهُ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِيمَا تُدَافِعُونَ بِهِ الْحَقّ وَتُعَارِضُونَ بِهِ مِنْ الْبَاطِل .</p></td></tr></table></body></html>
