<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَعَمِيَتْ عَلَيْهِمُ الْأَنْبَاءُ يَوْمَئِذٍ فَهُمْ لَا يَتَسَاءَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى : " فَعَمِيَتْ عَلَيْهِمْ الْأَنْبَاء يَوْمَئِذٍ فَهُمْ لَا يَتَسَاءَلُونَ " قَالَ مُجَاهِد فَعَمِيَتْ عَلَيْهِمْ الْحُجَج فَهُمْ لَا يَتَسَاءَلُونَ بِالْأَنْسَابِ .</p></td></tr></table></body></html>
