<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّ فِيهَا لُوطًا قَالُوا نَحْنُ أَعْلَمُ بِمَنْ فِيهَا لَنُنَجِّيَنَّهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ كَانَتْ مِنَ الْغَابِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الْهَالِكِينَ لِأَنَّهَا كَانَتْ تُمَالِئهُمْ عَلَى كُفْرهمْ وَبَغْيهمْ وَدَبْرهمْ .</p></td></tr></table></body></html>
