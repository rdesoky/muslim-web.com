<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ تَرَكْنَا مِنْهَا آيَةً بَيِّنَةً لِقَوْمٍ يَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ تَعَالَى : " وَلَقَدْ تَرَكْنَا مِنْهَا آيَة بَيِّنَة" أَيْ وَاضِحَة " لِقَوْمٍ يَعْقِلُونَ " كَمَا قَالَ تَعَالَى : " وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِمْ مُصْبِحِينَ وَبِاللَّيْلِ أَفَلَا تَعْقِلُونَ " .</p></td></tr></table></body></html>
