<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ تَقُومُ السَّاعَةُ يُبْلِسُ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى" وَيَوْم تَقُوم السَّاعَة يُبْلِس الْمُجْرِمُونَ " قَالَ اِبْن عَبَّاس : يَيْأَس الْمُجْرِمُونَ وَقَالَ مُجَاهِد يَفْتَضِح الْمُجْرِمُونَ وَفِي رِوَايَة يُكْتَب الْمُجْرِمُونَ .</p></td></tr></table></body></html>
