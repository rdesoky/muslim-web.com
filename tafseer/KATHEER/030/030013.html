<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمْ يَكُنْ لَهُمْ مِنْ شُرَكَائِهِمْ شُفَعَاءُ وَكَانُوا بِشُرَكَائِهِمْ كَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>" وَلَمْ يَكُنْ لَهُمْ مِنْ شُرَكَائِهِمْ شُفَعَاء " أَيْ مَا شَفَعَتْ فِيهِمْ الْآلِهَة الَّتِي كَانُوا يَعْبُدُونَهَا مِنْ دُون اللَّه تَعَالَى وَكَفَرُوا بِهِمْ وَخَانُوهُمْ أَحْوَج مَا كَانُوا إِلَيْهِمْ .</p></td></tr></table></body></html>
