<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ أَنْزَلْنَا عَلَيْهِمْ سُلْطَانًا فَهُوَ يَتَكَلَّمُ بِمَا كَانُوا بِهِ يُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>" أَمْ أَنْزَلْنَا عَلَيْهِمْ سُلْطَانًا " أَيْ حُجَّة " فَهُوَ يَتَكَلَّم " أَيْ يَنْطِق " بِمَا كَانُوا بِهِ يُشْرِكُونَ" وَهَذَا اِسْتِفْهَام إِنْكَار أَيْ لَمْ يَكُنْ لَهُمْ شَيْء مِنْ ذَلِكَ .</p></td></tr></table></body></html>
