<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُدًى وَرَحْمَةً لِلْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ فِي أَوَّل سُورَة الْبَقَرَة عَامَّة الْكَلَام عَلَى مَا يَتَعَلَّق بِصَدْرِ هَذِهِ السُّورَة وَهُوَ أَنَّهُ سُبْحَانه وَتَعَالَى جَعَلَ هَذَا الْقُرْآن هُدًى وَشِفَاء وَرَحْمَة لِلْمُحْسِنِينَ .</p></td></tr></table></body></html>
