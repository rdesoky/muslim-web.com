<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اللَّه تَعَالَى " أُولَئِكَ عَلَى هُدًى مِنْ رَبّهمْ " أَيْ عَلَى بَصِيرَة وَبَيِّنَة وَمَنْهَج وَاضِح جَلِيّ " وَأُولَئِكَ هُمْ الْمُفْلِحُونَ " أَيْ فِي الدُّنْيَا وَالْآخِرَة .</p></td></tr></table></body></html>
