<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله" تَنْزِيل الْكِتَاب لَا رَيْب فِيهِ " أَيْ لَا شَكَّ فِيهِ وَلَا مِرْيَة أَنَّهُ مُنَزَّل " مِنْ رَبّ الْعَالَمِينَ " .</p></td></tr></table></body></html>
