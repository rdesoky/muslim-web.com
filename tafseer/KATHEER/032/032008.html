<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَعَلَ نَسْلَهُ مِنْ سُلَالَةٍ مِنْ مَاءٍ مَهِينٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَتَنَاسَلُونَ كَذَلِكَ مِنْ نُطْفَة تَخْرُج مِنْ بَيْن صُلْب الرَّجُل وَتَرَائِب الْمَرْأَة .</p></td></tr></table></body></html>
