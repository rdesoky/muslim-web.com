<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ هُنَا " إِنَّ رَبّك هُوَ يَفْصِل بَيْنهمْ يَوْم الْقِيَامَة فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ " أَيْ مِنْ الِاعْتِقَادَات وَالْأَعْمَال .</p></td></tr></table></body></html>
