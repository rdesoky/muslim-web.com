<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّبِعْ مَا يُوحَى إِلَيْكَ مِنْ رَبِّكَ إِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ تَعَالَى " وَاتَّبِعْ مَا يُوحَى إِلَيْك مِنْ رَبّك " أَيْ مِنْ قُرْآن وَسُنَّة " إِنَّ اللَّه كَانَ بِمَا تَعْمَلُونَ خَبِيرًا " أَيْ فَلَا تَخْفَى عَلَيْهِ خَافِيَة.</p></td></tr></table></body></html>
