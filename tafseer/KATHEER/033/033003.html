<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَوَكَّلْ عَلَى اللَّهِ وَكَفَى بِاللَّهِ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p>وَتَوَكَّلْ عَلَى اللَّه أَيْ فِي جَمِيع أُمُورك وَأَحْوَالك " وَكَفَى بِاَللَّهِ وَكِيلًا " أَيْ وَكَفَى بِهِ وَكِيلًا لِمَنْ تَوَكَّلَ عَلَيْهِ وَأَنَابَ إِلَيْهِ .</p></td></tr></table></body></html>
