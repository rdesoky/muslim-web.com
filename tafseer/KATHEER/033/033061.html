<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَلْعُونِينَ أَيْنَمَا ثُقِفُوا أُخِذُوا وَقُتِّلُوا تَقْتِيلًا</font></td></tr><tr><td align=right dir=rtl><p>" إِلَّا قَلِيلًا مَلْعُونِينَ " حَال مِنْهُمْ فِي مُدَّة إِقَامَتهمْ فِي الْمَدِينَة مُدَّة قَرِيبَة مَطْرُودِينَ مُبْعَدِينَ " أَيْنَمَا ثُقِفُوا " أَيْ وُجِدُوا " أُخِذُوا " لِذِلَّتِهِمْ وَقِلَّتهمْ " وَقُتِّلُوا تَقْتِيلًا " .</p></td></tr></table></body></html>
