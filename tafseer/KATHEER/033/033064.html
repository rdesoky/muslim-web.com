<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَعَالَى : " إِنَّ اللَّه لَعَنَ الْكَافِرِينَ " أَيْ أَبْعَدهمْ عَنْ رَحْمَته " وَأَعَدَّ لَهُمْ سَعِيرًا " أَيْ فِي الدَّار الْآخِرَة.</p></td></tr></table></body></html>
