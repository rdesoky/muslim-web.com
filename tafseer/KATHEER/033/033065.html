<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا أَبَدًا لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p>" خَالِدِينَ فِيهَا أَبَدًا " أَيْ مَاكِثِينَ مُسْتَمِرِّينَ فَلَا خُرُوج لَهُمْ مِنْهَا وَلَا زَوَال لَهُمْ عَنْهَا " لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا " أَيْ وَلَيْسَ لَهُمْ مُغِيث وَلَا مُعِين يُنْقِذهُمْ مِمَّا هُمْ فِيهِ .</p></td></tr></table></body></html>
