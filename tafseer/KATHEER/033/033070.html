<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى آمِرًا عِبَاده الْمُؤْمِنِينَ بِتَقْوَاهُ وَأَنْ يَعْبُدُوهُ عِبَادَة مَنْ كَأَنَّهُ يَرَاهُ وَأَنْ يَقُولُوا" قَوْلًا سَدِيدًا " أَيْ مُسْتَقِيمًا لَا اِعْوِجَاج فِيهِ وَلَا اِنْحِرَاف .</p></td></tr></table></body></html>
