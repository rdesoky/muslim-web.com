<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ يَشَأْ يُذْهِبْكُمْ وَيَأْتِ بِخَلْقٍ جَدِيدٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى : " إِنْ يَشَأْ يُذْهِبْكُمْ وَيَأْتِ بِخَلْقٍ جَدِيد " أَيْ لَوْ شَاءَ لَأَذْهَبكُمْ أَيّهَا النَّاس وَأَتَى بِقَوْمٍ غَيْركُمْ .</p></td></tr></table></body></html>
