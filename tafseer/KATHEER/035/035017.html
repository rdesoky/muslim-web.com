<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا ذَلِكَ عَلَى اللَّهِ بِعَزِيزٍ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ تَعَالَى :" وَمَا ذَلِكَ عَلَى اللَّه بِعَزِيزٍ " وَمَا هَذَا عَلَيْهِ بِصَعْبٍ وَلَا مُمْتَنِعٍ .</p></td></tr></table></body></html>
