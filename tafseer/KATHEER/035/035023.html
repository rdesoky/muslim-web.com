<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ أَنْتَ إِلَّا نَذِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>" إِنْ أَنْتَ إِلَّا نَذِير " أَيْ إِنَّمَا عَلَيْك الْبَلَاغ وَالْإِنْذَار وَاَللَّه يُضِلّ مَنْ يَشَاء وَيَهْدِي مَنْ يَشَاء .</p></td></tr></table></body></html>
