<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْقُرْآنِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَالْقُرْآن الْحَكِيم " أَيْ الْمُحْكَم الَّذِي لَا يَأْتِيه الْبَاطِل مِنْ بَيْن يَدَيْهِ وَلَا مِنْ خَلْفه .</p></td></tr></table></body></html>
