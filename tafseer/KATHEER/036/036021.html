<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اتَّبِعُوا مَنْ لَا يَسْأَلُكُمْ أَجْرًا وَهُمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>" اِتَّبِعُوا مَنْ لَا يَسْأَلكُمْ أَجْرًا " أَيْ عَلَى إِبْلَاغ الرِّسَالَة " وَهُمْ مُهْتَدُونَ " فِيمَا يَدْعُونَكُمْ إِلَيْهِ مِنْ عِبَادَة اللَّه وَحْده لَا شَرِيك لَهُ .</p></td></tr></table></body></html>
