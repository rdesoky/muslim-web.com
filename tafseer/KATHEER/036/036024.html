<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي إِذًا لَفِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>" إنِّي إِذًا لَفِي ضَلَال مُبِين " أَيْ إِنْ اِتَّخَذْتهَا آلِهَة مِنْ دُون اللَّه .</p></td></tr></table></body></html>
