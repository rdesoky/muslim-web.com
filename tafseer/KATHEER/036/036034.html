<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْنَا فِيهَا جَنَّاتٍ مِنْ نَخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ</font></td></tr><tr><td align=right dir=rtl><p>" وَجَعَلْنَا فِيهَا جَنَّات مِنْ نَخِيل وَأَعْنَاب وَفَجَّرْنَا فِيهَا مِنْ الْعُيُون " أَيْ جَعَلْنَا فِيهَا أَنْهَارًا سَارِحَة فِي أَمْكِنَة يَحْتَاجُونَ إِلَيْهَا .</p></td></tr></table></body></html>
