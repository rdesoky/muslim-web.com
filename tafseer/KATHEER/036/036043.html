<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ نَشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنْقَذُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله عَزَّ وَجَلَّ " وَإِنْ نَشَأْ نُغْرِقهُمْ " يَعْنِي الَّذِينَ فِي السُّفُن " فَلَا صَرِيخ لَهُمْ " أَيْ فَلَا مُغِيث لَهُمْ مِمَّا هُمْ فِيهِ " وَلَا هُمْ يُنْقَذُونَ " أَيْ مِمَّا أَصَابَهُمْ .</p></td></tr></table></body></html>
