<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذِهِ جَهَنَّمُ الَّتِي كُنْتُمْ تُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>يُقَال لِلْكَفَرَةِ مِنْ بَنِي آدَم يَوْم الْقِيَامَة وَقَدْ بُرِّزَتْ الْجَحِيم لَهُمْ تَقْرِيعًا وَتَوْبِيخًا " هَذِهِ جَهَنَّم الَّتِي كُنْتُمْ تُوعَدُونَ " أَيْ هَذِهِ الَّتِي حَذَّرَتْكُمْ الرُّسُل فَكَذَّبْتُمُوهُمْ .</p></td></tr></table></body></html>
