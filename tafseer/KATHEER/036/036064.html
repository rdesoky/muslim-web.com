<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اصْلَوْهَا الْيَوْمَ بِمَا كُنْتُمْ تَكْفُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" اِصْلَوْهَا الْيَوْم بِمَا كُنْتُمْ تَكْفُرُونَ " كَمَا قَالَ تَعَالَى : " يَوْم يُدَعُّونَ إِلَى نَار جَهَنَّم دَعًّا هَذِهِ النَّار الَّتِي كُنْتُمْ بِهَا تُكَذِّبُونَ أَفَسِحْر هَذَا أَمْ أَنْتُمْ لَا تُبْصِرُونَ " .</p></td></tr></table></body></html>
