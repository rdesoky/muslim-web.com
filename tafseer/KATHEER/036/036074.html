<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّخَذُوا مِنْ دُونِ اللَّهِ آلِهَةً لَعَلَّهُمْ يُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُنْكِرًا عَلَى الْمُشْرِكِينَ فِي اِتِّخَاذهمْ الْأَنْدَاد آلِهَة مَعَ اللَّه يَبْتَغُونَ بِذَلِكَ أَنْ تَنْصُرهُمْ تِلْكَ الْآلِهَة وَتَرْزُقهُمْ وَتُقَرِّبهُمْ إِلَى اللَّه زُلْفَى .</p></td></tr></table></body></html>
