<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحِفْظًا مِنْ كُلِّ شَيْطَانٍ مَارِدٍ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله جَلَّ وَعَلَا هَهُنَا " وَحِفْظًا " تَقْدِيره وَحَفِظْنَاهَا حِفْظًا " مِنْ كُلّ شَيْطَان مَارِد " : يَعْنِي الْمُتَمَرِّد الْعَاتِي .</p></td></tr></table></body></html>
