<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْا آيَةً يَسْتَسْخِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة عَجِبَ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَسَخِرَ ضُلَّالُ بَنِي آدَم " وَإِذَا رَأَوْا آيَة " أَيْ دَلَالَة وَاضِحَة عَلَى ذَلِكَ " يَسْتَسْخِرُونَ" قَالَ مُجَاهِد وَقَتَادَة يَسْتَهْزِئُونَ .</p></td></tr></table></body></html>
