<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ هُمُ الْيَوْمَ مُسْتَسْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُنْقَادُونَ لِأَمْرِ اللَّه لَا يُخَالِفُونَهُ وَلَا يَحِيدُونَ عَنْهُ وَاَللَّه أَعْلَم .</p></td></tr></table></body></html>
