<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ لَمْ تَكُونُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>تَقُول الْقَادَة مِنْ الْجِنّ وَالْإِنْس لِلْأَتْبَاعِ مَا الْأَمْر كَمَا تَزْعُمُونَ بَلْ كَانَتْ قُلُوبكُمْ مُنْكِرَة لِلْإِيمَانِ قَابِلَة لِلْكُفْرِ وَالْعِصْيَان .</p></td></tr></table></body></html>
