<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ أَئِنَّا لَتَارِكُو آلِهَتِنَا لِشَاعِرٍ مَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنَحْنُ نَتْرُك عِبَادَة آلِهَتنَا وَآلِهَة آبَائِنَا عَنْ قَوْل هَذَا الشَّاعِر الْمَجْنُون يَعْنُونَ رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ .</p></td></tr></table></body></html>
