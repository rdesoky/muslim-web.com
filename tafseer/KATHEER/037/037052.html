<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَقُولُ أَئِنَّكَ لَمِنَ الْمُصَدِّقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَأَنْت تُصَدِّقُ بِالْبَعْثِ وَالنُّشُور وَالْحِسَاب وَالْجَزَاء يَعْنِي يَقُول ذَلِكَ عَلَى وَجْه التَّعَجُّب وَالتَّكْذِيب وَالِاسْتِبْعَاد وَالْكُفْر وَالْعِنَاد .</p></td></tr></table></body></html>
