<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلَامٌ عَلَى نُوحٍ فِي الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>مُفَسِّر لِمَا أَبْقَى عَلَيْهِ مِنْ الذِّكْر الْجَمِيل وَالثَّنَاء الْحَسَن أَنَّهُ يُسَلِّم عَلَيْهِ فِي جَمِيع الطَّوَائِف وَالْأُمَم.</p></td></tr></table></body></html>
