<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَكَذَا نَجْزِي مَنْ أَحْسَنَ مِنْ الْعِبَاد فِي طَاعَة اللَّه تَعَالَى نَجْعَل لَهُ لِسَان صِدْق يُذْكَر بِهِ بَعْدَهُ بِحَسَبِ مَرْتَبَته فِي ذَلِكَ .</p></td></tr></table></body></html>
