<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ إِنَّهُ مِنْ عِبَادنَا الْمُؤْمِنِينَ " قَدْ تَقَدَّمَ تَفْسِيره وَاَللَّه تَعَالَى أَعْلَم .</p></td></tr></table></body></html>
