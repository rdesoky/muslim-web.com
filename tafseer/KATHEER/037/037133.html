<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ لُوطًا لَمِنَ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ عَبْده وَرَسُوله لُوط رَضِيَ اللَّه عَنْهُمَا أَنَّهُ بَعَثَهُ إِلَى قَوْمه .</p></td></tr></table></body></html>
