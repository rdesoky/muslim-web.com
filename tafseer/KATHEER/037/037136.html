<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ دَمَّرْنَا الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَإِنَّ اللَّه تَعَالَى أَهْلَكَهُمْ بِأَنْوَاعٍ مِنْ الْعُقُوبَات وَجَعَلَ مَحَلَّتهمْ مِنْ الْأَرْض بُحَيْرَة مُنْتِنَة قَبِيحَة الْمَنْظَر وَالطَّعْم وَالرِّيح وَجَعَلَهَا بِسَبِيلٍ مُقِيم يَمُرُّ بِهَا الْمُسَافِرُونَ لَيْلًا وَنَهَارًا.</p></td></tr></table></body></html>
