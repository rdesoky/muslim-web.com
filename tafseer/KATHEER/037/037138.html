<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبِاللَّيْلِ أَفَلَا تَعْقِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ تَعَالَى " وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِمْ مُصْبِحِينَ وَبِاللَّيْلِ أَفَلَا تَعْقِلُونَ " أَيْ أَفَلَا تَعْتَبِرُونَ بِهِمْ كَيْفَ دَمَّرَ اللَّه عَلَيْهِمْ وَتَعْلَمُونَ أَنَّ لِلْكَافِرِينَ أَمْثَالهَا ؟ .</p></td></tr></table></body></html>
