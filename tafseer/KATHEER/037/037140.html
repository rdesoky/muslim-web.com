<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ أَبَقَ إِلَى الْفُلْكِ الْمَشْحُونِ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " إِذْ أَبَقَ إِلَى الْفُلْك الْمَشْحُون " قَالَ اِبْن عَبَّاس رَضِيَ اللَّه عَنْهُمَا هُوَ الْمُوقَر أَيْ الْمَمْلُوء بِالْأَمْتِعَةِ .</p></td></tr></table></body></html>
