<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سُبْحَانَ اللَّهِ عَمَّا يَصِفُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله جَلَّتْ عَظْمه " سُبْحَان اللَّه عَمَّا يَصِفُونَ " أَيْ تَعَالَى وَتَقَدَّسَ وَتَنَزَّهَ عَنْ أَنْ يَكُون لَهُ وَلَد وَعَمَّا يَصِفهُ بِهِ الظَّالِمُونَ الْمُلْحِدُونَ عُلُوًّا كَبِيرًا .</p></td></tr></table></body></html>
