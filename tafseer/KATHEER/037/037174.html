<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَوَلَّ عَنْهُمْ حَتَّى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p>إِلَى وَقْت مُؤَجَّل فَإِنَّا سَنَجْعَلُ لَك الْعَاقِبَة وَالنُّصْرَة وَالظَّفَر وَلِهَذَا قَالَ بَعْضهمْ غَيَّا ذَلِكَ إِلَى يَوْم بَدْر وَمَا بَعْدهَا أَيْضًا فِي مَعْنَاهَا .</p></td></tr></table></body></html>
