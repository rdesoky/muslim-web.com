<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَبْصِرْهُمْ فَسَوْفَ يُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنْظِرْهُمْ وَارْتَقِبْ مَاذَا يَحِلّ بِهِمْ مِنْ الْعَذَاب وَالنَّكَال بِمُخَالَفَتِك وَتَكْذِيبك وَلِهَذَا قَالَ تَعَالَى عَلَى وَجْه التَّهْدِيد وَالْوَعِيد" فَسَوْفَ يُبْصِرُونَ " .</p></td></tr></table></body></html>
