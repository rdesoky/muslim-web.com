<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسَلَامٌ عَلَى الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ سَلَام اللَّه عَلَيْهِمْ فِي الدُّنْيَا وَالْآخِرَة لِسَلَامَةِ مَا قَالُوهُ فِي رَبِّهِمْ وَصِحَّته وَحَقِّيَّتِهِ .</p></td></tr></table></body></html>
