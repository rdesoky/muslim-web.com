<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ لَهُ عِنْدَنَا لَزُلْفَى وَحُسْنَ مَآبٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " وَإِنَّ لَهُ عِنْدنَا لَزُلْفَى وَحُسْن مَآب " أَيْ فِي الدَّار وَالْآخِرَة.</p></td></tr></table></body></html>
