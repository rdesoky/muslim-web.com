<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا ذِكْرٌ وَإِنَّ لِلْمُتَّقِينَ لَحُسْنَ مَآبٍ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا ذِكْر " أَيْ هَذَا فَصْل فِيهِ ذِكْر لِمَنْ يَتَذَكَّر وَقَالَ السُّدِّيّ يَعْنِي الْقُرْآن الْعَظِيم.</p></td></tr></table></body></html>
