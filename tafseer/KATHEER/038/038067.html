<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ هُوَ نَبَأٌ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>قُلْ هُوَ نَبَأ عَظِيم " أَيْ خَبَر عَظِيم وَشَأْن بَلِيغ وَهُوَ إِرْسَال اللَّه تَعَالَى إِيَّايَ إِلَيْكُمْ.</p></td></tr></table></body></html>
