<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْتُمْ عَنْهُ مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَنْتُمْ عَنْهُ مُعْرِضُونَ " أَيْ غَافِلُونَ قَالَ مُجَاهِد وَشُرَيْح الْقَاضِي وَالسُّدِّيّ فِي قَوْله عَزَّ وَجَلَّ " قُلْ هُوَ نَبَأ " عَظِيم يَعْنِي الْقُرْآن.</p></td></tr></table></body></html>
