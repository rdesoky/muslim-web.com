<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنِّي أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ مُخْلِصًا لَهُ الدِّينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا أُمِرْت بِإِخْلَاصِ الْعِبَادَة لِلَّهِ وَحْدَهُ لَا شَرِيك لَهُ .</p></td></tr></table></body></html>
