<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ الْمُسْلِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ السُّدِّيّ يَعْنِي مِنْ أُمَّته صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ.</p></td></tr></table></body></html>
