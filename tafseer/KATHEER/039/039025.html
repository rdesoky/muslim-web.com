<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ فَأَتَاهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرُون الْمَاضِيَة الْمُكَذِّبَة لِلرُّسُلِ أَهْلَكَهُمْ اللَّه بِذُنُوبِهِمْ وَمَا كَانَ لَهُمْ مِنْ اللَّه مِنْ وَاقٍ .</p></td></tr></table></body></html>
