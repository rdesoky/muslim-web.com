<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُمْ مَا يَشَاءُونَ عِنْدَ رَبِّهِمْ ذَلِكَ جَزَاءُ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>" لَهُمْ مَا يَشَاءُونَ عِنْد رَبّهمْ " يَعْنِي فِي الْجَنَّة مَهْمَا طَلَبُوا وَجَدُوا .</p></td></tr></table></body></html>
