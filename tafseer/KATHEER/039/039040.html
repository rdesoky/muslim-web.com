<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>" مَنْ يَأْتِيه عَذَاب يُخْزِيه " أَيْ فِي الدُّنْيَا " وَيَحِلّ عَلَيْهِ عَذَاب مُقِيم " أَيْ دَائِم وَمُسْتَمِرّ لَا مَحِيد عَنْهُ وَذَلِكَ يَوْم الْقِيَامَة أَعَاذَنَا اللَّه مِنْهَا .</p></td></tr></table></body></html>
