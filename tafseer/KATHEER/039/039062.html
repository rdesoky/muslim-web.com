<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَى كُلِّ شَيْءٍ وَكِيلٌ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى أَنَّهُ خَالِق الْأَشْيَاء كُلّهَا وَرَبّهَا وَمَلِيكهَا وَالْمُتَصَرِّف فِيهَا وَكُلٌّ تَحْت تَدْبِيره وَقَهْره وَكِلَاءَته .</p></td></tr></table></body></html>
