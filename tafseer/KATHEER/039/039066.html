<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلِ اللَّهَ فَاعْبُدْ وَكُنْ مِنَ الشَّاكِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَخْلِصْ الْعِبَادَة لِلَّهِ وَحْده لَا شَرِيك لَهُ أَنْتَ وَمَنْ اِتَّبَعَك وَصَدَّقَك.</p></td></tr></table></body></html>
