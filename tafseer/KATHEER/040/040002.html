<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْعَلِيمِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَنْزِيل هَذَا الْكِتَاب وَهُوَ الْقُرْآن مِنْ اللَّه ذِي الْعِزَّة وَالْعِلْم فَلَا يُرَام جَنَابه وَلَا يَخْفَى عَلَيْهِ الذَّرّ وَإِنْ تَكَاثَفَ حِجَابه .</p></td></tr></table></body></html>
