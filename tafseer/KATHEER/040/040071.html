<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذِ الْأَغْلَالُ فِي أَعْنَاقِهِمْ وَالسَّلَاسِلُ يُسْحَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُتَّصِلَة بِالْأَغْلَالِ بِأَيْدِي الزَّبَانِيَة يَسْحَبُونَهُمْ عَلَى وُجُوههمْ تَارَة إِلَى الْحَمِيم وَتَارَة إِلَى الْجَحِيم .</p></td></tr></table></body></html>
