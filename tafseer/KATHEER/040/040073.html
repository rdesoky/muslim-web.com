<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ قِيلَ لَهُمْ أَيْنَ مَا كُنْتُمْ تُشْرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " ثُمَّ قِيلَ لَهُمْ أَيْنَمَا كُنْتُمْ تُشْرِكُونَ مِنْ دُون اللَّه " أَيْ قِيلَ لَهُمْ أَيْنَ الْأَصْنَام الَّتِي كُنْتُمْ تَعْبُدُونَهَا مِنْ دُون اللَّه هَلْ يَنْصُرُونَكُمْ الْيَوْم .</p></td></tr></table></body></html>
