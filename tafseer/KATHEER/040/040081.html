<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُرِيكُمْ آيَاتِهِ فَأَيَّ آيَاتِ اللَّهِ تُنْكِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله جَلَّ وَعَلَا " وَيُرِيكُمْ آيَاته " أَيْ حُجَجه وَبَرَاهِينه فِي الْآفَاق وَفِي أَنْفُسكُمْ " فَأَيّ آيَات اللَّه تُنْكِرُونَ " أَيْ لَا تَقْدِرُونَ عَلَى إِنْكَار شَيْء مِنْ آيَاته إِلَّا أَنْ تُعَانِدُوا وَتُكَابِرُوا .</p></td></tr></table></body></html>
