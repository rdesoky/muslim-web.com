<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ كَفَرُوا بِالذِّكْرِ لَمَّا جَاءَهُمْ وَإِنَّهُ لَكِتَابٌ عَزِيزٌ</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ الَّذِينَ كَفَرُوا بِالذِّكْرِ لَمَّا جَاءَهُمْ" قَالَ الضَّحَّاك وَالسُّدِّيّ وَقَتَادَة وَهُوَ الْقُرْآن " وَإِنَّهُ لَكِتَاب عَزِيز " أَيْ مَنِيع الْجَنَاب لَا يُرَام أَنْ يَأْتِي أَحَد بِمِثْلِهِ .</p></td></tr></table></body></html>
