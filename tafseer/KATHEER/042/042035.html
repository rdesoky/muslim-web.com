<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَعْلَمَ الَّذِينَ يُجَادِلُونَ فِي آيَاتِنَا مَا لَهُمْ مِنْ مَحِيصٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا مَحِيد لَهُمْ عَنْ بَأْسنَا وَنِقْمَتنَا فَإِنَّهُمْ مَقْهُورُونَ بِقُدْرَتِنَا .</p></td></tr></table></body></html>
