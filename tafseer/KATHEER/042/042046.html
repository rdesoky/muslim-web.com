<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ لَهُمْ مِنْ أَوْلِيَاءَ يَنْصُرُونَهُمْ مِنْ دُونِ اللَّهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ سَبِيلٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُنْقِذُوهُمْ مِمَّا هُمْ فِيهِ مِنْ الْعَذَاب وَالنَّكَال " وَمَنْ يُضْلِلْ اللَّه فَمَا لَهُ مِنْ سَبِيل " أَيْ لَيْسَ لَهُ خَلَاص .</p></td></tr></table></body></html>
