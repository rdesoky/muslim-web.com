<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمَّا جَاءَهُمُ الْحَقُّ قَالُوا هَذَا سِحْرٌ وَإِنَّا بِهِ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَابَرُوهُ وَعَانَدُوهُ وَدَفَعُوا بِالصُّدُورِ وَالرَّاح كُفْرًا وَحَسَدًا وَبَغْيًا .</p></td></tr></table></body></html>
