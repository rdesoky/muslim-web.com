<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُمْ لَيَصُدُّونَهُمْ عَنِ السَّبِيلِ وَيَحْسَبُونَ أَنَّهُمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَذَا الَّذِي تَغَافَلَ عَنْ الْهُدَى نُقَيِّض لَهُ مِنْ الشَّيَاطِين مَنْ يُضِلّهُ وَيَهْدِيه إِلَى صِرَاط الْجَحِيم.</p></td></tr></table></body></html>
