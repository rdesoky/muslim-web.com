<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَنْ يَنْفَعَكُمُ الْيَوْمَ إِذْ ظَلَمْتُمْ أَنَّكُمْ فِي الْعَذَابِ مُشْتَرِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يُغْنِي عَنْكُمْ اِجْتِمَاعكُمْ فِي النَّار وَاشْتِرَاككُمْ فِي الْعَذَاب الْأَلِيم .</p></td></tr></table></body></html>
