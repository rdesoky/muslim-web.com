<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِمَّا نَذْهَبَنَّ بِكَ فَإِنَّا مِنْهُمْ مُنْتَقِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا بُدّ أَنْ نَنْتَقِم مِنْهُمْ وَنُعَاقِبهُمْ وَلَوْ ذَهَبْت أَنْتَ.</p></td></tr></table></body></html>
