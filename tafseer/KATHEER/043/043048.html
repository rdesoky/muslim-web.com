<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا نُرِيهِمْ مِنْ آيَةٍ إِلَّا هِيَ أَكْبَرُ مِنْ أُخْتِهَا وَأَخَذْنَاهُمْ بِالْعَذَابِ لَعَلَّهُمْ يَرْجِعُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَمَعَ هَذَا مَا رَجَعُوا عَنْ غَيّهمْ وَضَلَالهمْ وَجَهْلهمْ وَخَبَالهمْ .</p></td></tr></table></body></html>
