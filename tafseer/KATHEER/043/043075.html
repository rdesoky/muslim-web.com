<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يُفَتَّرُ عَنْهُمْ وَهُمْ فِيهِ مُبْلِسُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ سَاعَة وَاحِدَة" وَهُمْ فِيهِ مُبْلِسُونَ " أَيْ آيِسُونَ مِنْ كُلّ خَيْر .</p></td></tr></table></body></html>
