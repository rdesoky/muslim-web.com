<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سُبْحَانَ رَبِّ السَّمَاوَاتِ وَالْأَرْضِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَعَالَى وَتَقَدَّسَ وَتَنَزَّهَ خَالِق الْأَشْيَاء عَنْ أَنْ يَكُون لَهُ وَلَد فَإِنَّهُ فَرْد أَحَد لَا نَظِير لَهُ وَلَا كُفْء لَهُ فَلَا وَلَد لَهُ .</p></td></tr></table></body></html>
