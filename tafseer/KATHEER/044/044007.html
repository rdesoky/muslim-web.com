<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ مُوقِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>رَبّ السَّمَوَات وَالْأَرْض وَمَا بَيْنهمَا وَخَالِقهمَا وَمَالِكهمَا وَمَا فِيهِمَا إِنْ كُنْتُمْ مُوقِنِينَ أَيْ إِنْ كُنْتُمْ مُتَحَقِّقِينَ.</p></td></tr></table></body></html>
