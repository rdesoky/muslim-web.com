<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ هُمْ فِي شَكٍّ يَلْعَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى بَلْ هَؤُلَاءِ الْمُشْرِكُونَ فِي شَكّ يَلْعَبُونَ أَيْ قَدْ جَاءَهُمْ الْحَقّ الْيَقِين وَهُمْ يَشُكُّونَ فِيهِ وَيَمْتَرُونَ وَلَا يُصَدِّقُونَ بِهِ .</p></td></tr></table></body></html>
