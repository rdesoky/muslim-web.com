<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنَّى لَهُمُ الذِّكْرَى وَقَدْ جَاءَهُمْ رَسُولٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ جَلَّ وَعَلَا هَهُنَا " أَنَّى لَهُمْ الذِّكْرَى وَقَدْ جَاءَهُمْ رَسُول مُبِين " يَقُول كَيْف لَهُمْ بِالتَّذَكُّرِ وَقَدْ أَرْسَلْنَا إِلَيْهِمْ رَسُولًا بَيَّنَ الرِّسَالَة وَالنِّذَارَة .</p></td></tr></table></body></html>
