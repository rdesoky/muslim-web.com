<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا مَنْ رَحِمَ اللَّهُ إِنَّهُ هُوَ الْعَزِيزُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ" إِلَّا مَنْ رَحِمَ اللَّه " أَيْ لَا يَنْفَع يَوْمئِذٍ إِلَّا رَحْمَة اللَّه عَزَّ وَجَلَّ بِخَلْقِهِ " إِنَّهُ هُوَ الْعَزِيز الرَّحِيم" أَيْ هُوَ عَزِيز ذُو رَحْمَة وَاسِعَة .</p></td></tr></table></body></html>
