<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَالْمُهْلِ يَغْلِي فِي الْبُطُونِ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله " كَالْمُهْلِ " قَالُوا كَعَكَرِ الزَّيْت " يَغْلِي فِي الْبُطُون " .</p></td></tr></table></body></html>
