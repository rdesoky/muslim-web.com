<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَدْعُونَ فِيهَا بِكُلِّ فَاكِهَةٍ آمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله عَزَّ وَجَلَّ" يَدْعُونَ فِيهَا بِكُلِّ فَاكِهَة آمِنِينَ " أَيْ مَهْمَا طَلَبُوا مِنْ أَنْوَاع الثِّمَار أُحْضِرَ لَهُمْ وَهُمْ آمِنُونَ مِنْ اِنْقِطَاعه وَامْتِنَاعه بَلْ يُحْضَر إِلَيْهِمْ كُلَّمَا أَرَادُوا .</p></td></tr></table></body></html>
