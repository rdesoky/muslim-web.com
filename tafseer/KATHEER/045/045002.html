<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى أَنَّهُ أَنْزَلَ الْكِتَاب عَلَى عَبْده وَرَسُوله مُحَمَّد صَلَوَات اللَّه وَسَلَامه عَلَيْهِ دَائِمًا إِلَى يَوْم الدِّين وَوَصَفَ نَفْسه بِالْعِزَّةِ الَّتِي لَا تُرَام وَالْحِكْمَة فِي الْأَقْوَال وَالْأَفْعَال.</p></td></tr></table></body></html>
