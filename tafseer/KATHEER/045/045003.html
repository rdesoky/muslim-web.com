<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي السَّمَاوَاتِ وَالْأَرْضِ لَآيَاتٍ لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>يُرْشِد تَعَالَى خَلْقه إِلَى التَّفَكُّر فِي آلَائِهِ وَنِعَمه وَقُدْرَته الْعَظِيمَة الَّتِي خَلَقَ بِهِمَا السَّمَوَات الْأَرْض .</p></td></tr></table></body></html>
