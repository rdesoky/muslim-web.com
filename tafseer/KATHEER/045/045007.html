<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيْلٌ لِكُلِّ أَفَّاكٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَعَالَى وَيْل لِكُلِّ أَفَّاك أَثِيم أَيْ أَفَّاك فِي قَوْله كَذَّاب حَلَّاف مَهِين أَثِيم فِي فِعْله وَقَلْبه كَافِر بِآيَاتِ اللَّه .</p></td></tr></table></body></html>
