<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا هُدًى وَالَّذِينَ كَفَرُوا بِآيَاتِ رَبِّهِمْ لَهُمْ عَذَابٌ مِنْ رِجْزٍ أَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَبَارَكَ وَتَعَالَى هَذَا هُدًى يَعْنِي الْقُرْآن وَاَلَّذِينَ كَفَرُوا بِآيَاتِ رَبّهمْ لَهُمْ عَذَاب مِنْ رِجْزٍ أَلِيم وَهُوَ الْمُؤْلِم الْمُوجِع وَاَللَّه سُبْحَانه وَتَعَالَى أَعْلَم .</p></td></tr></table></body></html>
