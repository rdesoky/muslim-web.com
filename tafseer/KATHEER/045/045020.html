<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا بَصَائِرُ لِلنَّاسِ وَهُدًى وَرَحْمَةٌ لِقَوْمٍ يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ عَزَّ وَجَلَّ هَذَا بَصَائِر لِلنَّاسِ يَعْنِي الْقُرْآن وَهُدًى وَرَحْمَة لِقَوْمٍ يُوقِنُونَ .</p></td></tr></table></body></html>
