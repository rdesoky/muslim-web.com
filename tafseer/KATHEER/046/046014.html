<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ أَصْحَابُ الْجَنَّةِ خَالِدِينَ فِيهَا جَزَاءً بِمَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْأَعْمَال سَبَب لِنَيْلِ الرَّحْمَة لَهُمْ وَسُبُوغهَا عَلَيْهِمْ وَاَللَّه أَعْلَمُ .</p></td></tr></table></body></html>
