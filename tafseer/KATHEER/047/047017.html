<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى وَآتَاهُمْ تَقْوَاهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَاَلَّذِينَ قَصَدُوا الْهِدَايَة وَفَّقَهُمْ اللَّه - تَعَالَى - لَهَا فَهَدَاهُمْ إِلَيْهَا وَثَبَّتَهُمْ عَلَيْهَا وَزَادَهُمْ مِنْهَا " وَآتَاهُمْ تَقْوَاهُمْ " أَيْ أَلْهَمَهُمْ رُشْدَهُمْ .</p></td></tr></table></body></html>
