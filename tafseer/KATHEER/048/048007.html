<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ جُنُودُ السَّمَاوَاتِ وَالْأَرْضِ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا</font></td></tr><tr><td align=right dir=rtl><p>قَالَ عَزَّ وَجَلَّ مُؤَكِّدًا لِقُدْرَتِهِ عَلَى الِانْتِقَام مِنْ الْأَعْدَاء أَعْدَاء الْإِسْلَام مِنْ الْكَفَرَة وَالْمُنَافِقِينَ" وَلِلَّهِ جُنُود السَّمَاوَات وَالْأَرْض وَكَانَ اللَّه عَزِيزًا حَكِيمًا " .</p></td></tr></table></body></html>
