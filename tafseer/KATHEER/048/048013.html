<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ لَمْ يُؤْمِنْ بِاللَّهِ وَرَسُولِهِ فَإِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَنْ لَمْ يُخْلِص الْعَمَل فِي الظَّاهِر وَالْبَاطِن لِلَّهِ فَإِنَّ اللَّه تَعَالَى سَيُعَذِّبُهُ فِي السَّعِير وَإِنْ أَظْهَرَ لِلنَّاسِ مَا يَعْتَقِدُونَ خِلَاف مَا هُوَ عَلَيْهِ فِي نَفْس الْأَمْر .</p></td></tr></table></body></html>
