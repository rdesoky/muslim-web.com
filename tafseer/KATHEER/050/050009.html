<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً مُبَارَكًا فَأَنْبَتْنَا بِهِ جَنَّاتٍ وَحَبَّ الْحَصِيدِ</font></td></tr><tr><td align=right dir=rtl><p>" أَيْ نَافِعًا " فَأَنْبَتْنَا بِهِ جَنَّات " أَيْ حَدَائِق مِنْ بَسَاتِين وَنَحْوهَا " وَحَبَّ الْحَصِيدِ" وَهُوَ الزَّرْع الَّذِي يُرَاد لِحَبِّهِ وَادِّخَاره .</p></td></tr></table></body></html>
