<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ يَتَلَقَّى الْمُتَلَقِّيَانِ عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ قَعِيدٌ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْمَلَكَيْنِ اللَّذَيْنِ يَكْتُبَانِ عَمَل الْإِنْسَان" عَنْ الْيَمِين وَعَنْ الشِّمَال قَعِيد " أَيْ مُتَرَصِّد .</p></td></tr></table></body></html>
