<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا مَا تُوعَدُونَ لِكُلِّ أَوَّابٍ حَفِيظٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ رَجَّاع تَائِب مُقْلِع " حَفِيظ " أَيْ يَحْفَظ الْعَهْد فَلَا يَنْقُضهُ وَلَا يَنْكُثهُ وَقَالَ عُبَيْد بْن عُمَر الْأَوَّاب الْحَفِيظ الَّذِي لَا يَجْلِس مَجْلِسًا فَيَقُوم حَتَّى يَسْتَغْفِر اللَّهَ عَزَّ وَجَلَّ " .</p></td></tr></table></body></html>
