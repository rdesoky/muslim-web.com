<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَسْمَعُونَ الصَّيْحَةَ بِالْحَقِّ ذَلِكَ يَوْمُ الْخُرُوجِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي النَّفْخَة فِي الصُّور الَّتِي تَأْتِي بِالْحَقِّ الَّذِي كَانَ أَكْثَرُهُمْ فِيهِ يَمْتَرُونَ " ذَلِكَ يَوْم الْخُرُوج " أَيْ مِنْ الْأَجْدَاث .</p></td></tr></table></body></html>
