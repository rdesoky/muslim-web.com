<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ هُمْ فِي غَمْرَةٍ سَاهُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس رَضِيَ اللَّه عَنْهُمَا وَغَيْر وَاحِد : فِي الْكُفْر وَالشَّكّ غَافِلُونَ لَاهُونَ .</p></td></tr></table></body></html>
