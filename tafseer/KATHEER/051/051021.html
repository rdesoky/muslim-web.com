<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي أَنْفُسِكُمْ أَفَلَا تُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ عَزَّ وَجَلَّ " وَفِي أَنْفُسكُمْ أَفَلَا تُبْصِرُونَ " قَالَ قَتَادَة مَنْ تَفَكَّرَ فِي خَلْق نَفْسه عَرَفَ أَنَّهُ إِنَّمَا خَلْق وَلُيِّنَتْ مَفَاصِله لِلْعِبَادَةِ.</p></td></tr></table></body></html>
