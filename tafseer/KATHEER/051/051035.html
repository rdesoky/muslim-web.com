<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخْرَجْنَا مَنْ كَانَ فِيهَا مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ تَعَالَى هَهُنَا " فَأَخْرَجْنَا مَنْ كَانَ فِيهَا مِنْ الْمُؤْمِنِينَ " وَهُمْ لُوط وَأَهْل بَيْته إِلَّا اِمْرَأَته .</p></td></tr></table></body></html>
