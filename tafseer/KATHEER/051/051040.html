<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذْنَاهُ وَجُنُودَهُ فَنَبَذْنَاهُمْ فِي الْيَمِّ وَهُوَ مُلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَلْقَيْنَاهُمْ " فِي الْيَمّ " وَهُوَ الْبَحْر " وَهُوَ مُلِيم" أَيْ وَهُوَ مَلُوم كَافِر جَاحِد فَاجِر مُعَانِد .</p></td></tr></table></body></html>
