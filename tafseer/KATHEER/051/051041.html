<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفِي عَادٍ إِذْ أَرْسَلْنَا عَلَيْهِمُ الرِّيحَ الْعَقِيمَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ عَزَّ وَجَلَّ " وَفِي عَادٍ إِذْ أَرْسَلْنَا عَلَيْهِمْ الرِّيح الْعَقِيم " أَيْ الْمُفْسِدَة الَّتِي لَا تُنْتِج شَيْئًا . قَالَهُ الضَّحَّاك وَقَتَادَة وَغَيْرهمَا .</p></td></tr></table></body></html>
