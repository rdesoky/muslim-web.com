<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا اسْتَطَاعُوا مِنْ قِيَامٍ وَمَا كَانُوا مُنْتَصِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ هَرَبٍ وَلَا نُهُوض " وَمَا كَانُوا مُنْتَصِرِينَ " أَيْ وَلَا يَقْدِرُونَ عَلَى أَنْ يَنْتَصِرُوا مِمَّا هُمْ فِيهِ .</p></td></tr></table></body></html>
