<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْأَرْضَ فَرَشْنَاهَا فَنِعْمَ الْمَاهِدُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَالْأَرْض فَرَشْنَاهَا" أَيْ جَعَلْنَاهَا فِرَاشًا لِلْمَخْلُوقَاتِ " فَنِعْمَ الْمَاهِدُونَ" أَيْ وَجَعَلْنَاهَا مَهْدًا لِأَهْلِهَا .</p></td></tr></table></body></html>
