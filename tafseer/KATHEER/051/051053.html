<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتَوَاصَوْا بِهِ بَلْ هُمْ قَوْمٌ طَاغُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَوْصَى بَعْضهمْ بَعْضًا بِهَذِهِ الْمَقَالَة ؟ " بَلْ هُمْ قَوْم طَاغُونَ " أَيْ لَكِنْ هُمْ قَوْم طُغَاة تَشَابَهَتْ قُلُوبهمْ فَقَالَ مُتَأَخِّرهمْ كَمَا قَالَ مُتَقَدِّمهمْ .</p></td></tr></table></body></html>
