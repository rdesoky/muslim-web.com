<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَيْل لَهُمْ ذَلِكَ الْيَوْم مِنْ عَذَاب اللَّه وَنَكَاله بِهِمْ وَعِقَابه لَهُمْ .</p></td></tr></table></body></html>
