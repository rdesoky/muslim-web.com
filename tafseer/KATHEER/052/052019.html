<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا كُنْتُمْ تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>كَقَوْلِهِ تَعَالَى " كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّام الْخَالِيَة " أَيْ هَذَا بِذَاكَ تَفَضُّلًا مِنْهُ وَإِحْسَانًا .</p></td></tr></table></body></html>
