<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ بَل لَا يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَهُمْ خَلَقُوا السَّمَوَاتِ وَالْأَرْضَ ؟ وَهَذَا إِنْكَار عَلَيْهِمْ فِي شِرْكهمْ بِاَللَّهِ وَهُمْ يَعْلَمُونَ أَنَّهُ الْخَالِق وَحْدَهُ لَا شَرِيك لَهُ وَلَكِنَّ عَدَم إِيقَانهمْ هُوَ الَّذِي يَحْمِلهُمْ عَلَى ذَلِكَ .</p></td></tr></table></body></html>
