<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ عِنْدَهُمُ الْغَيْبُ فَهُمْ يَكْتُبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَيْسَ الْأَمْر كَذَلِكَ فَإِنَّهُ لَا يَعْلَم أَحَد مِنْ أَهْل السَّمَوَات وَالْأَرْض الْغَيْبَ إِلَّا اللَّه .</p></td></tr></table></body></html>
