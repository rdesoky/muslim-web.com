<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يُرِيدُونَ كَيْدًا فَالَّذِينَ كَفَرُوا هُمُ الْمَكِيدُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى أَمْ يُرِيد هَؤُلَاءِ بِقَوْلِهِمْ هَذَا فِي الرَّسُول وَفِي الدِّين غُرُور النَّاس وَكَيْد الرَّسُول وَأَصْحَابه فَكَيْدهمْ إِنَّمَا يَرْجِع وَبَالُهُ عَلَى أَنْفُسهمْ فَاَلَّذِينَ كَفَرُوا هُمْ الْمَكِيدُونَ .</p></td></tr></table></body></html>
