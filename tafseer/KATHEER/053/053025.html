<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلِلَّهِ الْآخِرَةُ وَالْأُولَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا الْأَمْر كُلّه لِلَّهِ مَالِك الدُّنْيَا وَالْآخِرَة وَالْمُتَصَرِّف فِي الدُّنْيَا وَالْآخِرَة فَهُوَ الَّذِي مَا شَاءَ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ .</p></td></tr></table></body></html>
