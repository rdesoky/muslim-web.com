<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَّا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كُلّ نَفْس ظَلَمَتْ نَفْسهَا بِكُفْرٍ أَوْ شَيْء مِنْ الذُّنُوب فَإِنَّمَا عَلَيْهَا وِزْرهَا لَا يَحْمِلهُ عَنْهَا أَحَد كَمَا قَالَ " وَإِنْ تَدْعُ مُثْقَلَةٌ إِلَى حِمْلِهَا لَا يُحْمَل مِنْهُ شَيْءٌ وَلَوْ كَانَ ذَا قُرْبَى" .</p></td></tr></table></body></html>
