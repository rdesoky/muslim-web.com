<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ هُوَ رَبُّ الشِّعْرَى</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس وَمُجَاهِد وَقَتَادَة وَابْن زَيْد وَغَيْرهمْ هُوَ هَذَا النَّجْم الْوَقَّاد الَّذِي يُقَال لَهُ مِرْزَم الْجَوْزَاء كَانَتْ طَائِفَة مِنْ الْعَرَب يَعْبُدُونَهُ .</p></td></tr></table></body></html>
