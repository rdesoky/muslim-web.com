<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَوْمَ نُوحٍ مِنْ قَبْلُ إِنَّهُمْ كَانُوا هُمْ أَظْلَمَ وَأَطْغَى</font></td></tr><tr><td align=right dir=rtl><p>" وَقَوْم نُوح مِنْ قَبْل " أَيْ مِنْ قَبْل هَؤُلَاءِ " إِنَّهُمْ كَانُوا هُمْ أَظْلَمَ وَأَطْغَى " أَيْ أَشَدُّ تَمَرُّدًا مِنْ الَّذِينَ مِنْ بَعْدهمْ .</p></td></tr></table></body></html>
