<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْمُؤْتَفِكَةَ أَهْوَى</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي مَدَائِن قَوْم لُوط قَلَبَهَا عَلَيْهِمْ فَجَعَلَ عَالِيَهَا سَافِلَهَا وَأَمْطَرَ عَلَيْهِمْ حِجَارَة مِنْ سِجِّيل مَنْضُود .</p></td></tr></table></body></html>
