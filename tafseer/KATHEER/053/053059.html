<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَمِنْ هَذَا الْحَدِيثِ تَعْجَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى مُنْكِرًا عَلَى الْمُشْرِكِينَ فِي اِسْتِمَاعهمْ الْقُرْآن وَإِعْرَاضهمْ عَنْهُ وَتَلَهِّيهمْ " تَعْجَبُونَ " مِنْ أَنْ يَكُون صَحِيحًا .</p></td></tr></table></body></html>
