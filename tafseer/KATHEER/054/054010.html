<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَدَعَا رَبَّهُ أَنِّي مَغْلُوبٌ فَانْتَصِرْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنِّي ضَعِيف عَنْ هَؤُلَاءِ وَعَنْ مُقَاوَمَتهمْ فَانْتَصِرْ أَنْتَ لِدِينِك .</p></td></tr></table></body></html>
