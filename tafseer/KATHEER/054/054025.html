<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَؤُلْقِيَ الذِّكْرُ عَلَيْهِ مِنْ بَيْنِنَا بَلْ هُوَ كَذَّابٌ أَشِرٌ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ تَعَجَّبُوا مِنْ إِلْقَاء الْوَحْي عَلَيْهِ خَاصَّة مِنْ دُونهمْ ثُمَّ رَمَوْهُ بِالْكَذِبِ فَقَالُوا " بَلْ هُوَ كَذَّاب أَشِر " أَيْ مُتَجَاوِز فِي حَدّ الْكَذِب .</p></td></tr></table></body></html>
