<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَنَادَوْا صَاحِبَهُمْ فَتَعَاطَى فَعَقَرَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الْمُفَسِّرُونَ هُوَ عَاقِر النَّاقَة وَاسْمه قِدَار بْن سَالِف وَكَانَ أَشْقَى قَوْمه كَقَوْلِهِ " إِذْ اِنْبَعَثَ أَشْقَاهَا " " فَتَعَاطَى " أَيْ حَسِرَ.</p></td></tr></table></body></html>
