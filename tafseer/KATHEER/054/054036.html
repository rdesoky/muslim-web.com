<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَنْذَرَهُمْ بَطْشَتَنَا فَتَمَارَوْا بِالنُّذُرِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَلَقَدْ كَانَ قَبْل حُلُول الْعَذَاب بِهِمْ قَدْ أَنْذَرَهُمْ بَأْس اللَّه وَعَذَابه فَمَا اِلْتَفَتُوا إِلَى ذَلِكَ وَلَا أَصْغَوْا إِلَيْهِ بَلْ شَكُّوا فِيهِ وَتَمَارَوْا بِهِ .</p></td></tr></table></body></html>
