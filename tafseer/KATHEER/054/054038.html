<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ صَبَّحَهُمْ بُكْرَةً عَذَابٌ مُسْتَقِرٌّ</font></td></tr><tr><td align=right dir=rtl><p>فَرَجَعُوا عَلَى أَدْبَارهمْ يَتَحَسَّسُونَ بِالْحِيطَانِ وَيَتَوَعَّدُونَ لُوطًا " عَلَيْهِ السَّلَام إِلَى الصَّبَاح .</p></td></tr></table></body></html>
