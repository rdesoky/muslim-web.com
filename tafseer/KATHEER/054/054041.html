<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ جَاءَ آلَ فِرْعَوْنَ النُّذُرُ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ فِرْعَوْن وَقَوْمه إِنَّهُمْ جَاءَهُمْ رَسُول اللَّه مُوسَى وَأَخُوهُ هَارُون بِالْبِشَارَةِ إِنْ آمَنُوا وَالنِّذَارَة إِنْ كَفَرُوا .</p></td></tr></table></body></html>
