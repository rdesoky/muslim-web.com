<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبُوا بِآيَاتِنَا كُلِّهَا فَأَخَذْنَاهُمْ أَخْذَ عَزِيزٍ مُقْتَدِرٍ</font></td></tr><tr><td align=right dir=rtl><p>وَأَيَّدَهُمَا بِمُعْجِزَاتٍ عَظِيمَة وَآيَات مُتَعَدِّدَة فَكَذَّبُوا بِهَا كُلّهَا فَأَخَذَهُمْ اللَّه أَخْذ عَزِيز مُقْتَدِر أَيْ فَأَبَادَهُمْ اللَّه وَلَمْ يُبْقِ مِنْهُمْ مَخْبَر وَلَا عَيْن وَلَا أَثَر .</p></td></tr></table></body></html>
