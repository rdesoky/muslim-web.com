<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يَقُولُونَ نَحْنُ جَمِيعٌ مُنْتَصِرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَعْتَقِدُونَ أَنَّهُمْ يَتَنَاصَرُونَ بَعْضهمْ بَعْضًا وَأَنَّ جَمْعَهُمْ يُغْنِي عَنْهُمْ مَنْ أَرَادَهُمْ بِسُوءٍ .</p></td></tr></table></body></html>
