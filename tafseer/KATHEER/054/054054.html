<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَهَرٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِعَكْسِ مَا الْأَشْقِيَاء فِيهِ مِنْ الضَّلَال وَالسُّعُر وَالسَّحْب فِي النَّار عَلَى وُجُوههمْ مَعَ التَّوْبِيخ وَالتَّقْرِيع وَالتَّهْدِيد .</p></td></tr></table></body></html>
