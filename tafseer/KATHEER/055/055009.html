<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا تَبْخَسُوا الْوَزْن بَلْ زِنُوا بِالْحَقِّ وَالْقِسْط كَمَا قَالَ تَعَالَى " وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيم " .</p></td></tr></table></body></html>
