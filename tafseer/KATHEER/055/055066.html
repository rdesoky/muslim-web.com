<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهِمَا عَيْنَانِ نَضَّاخَتَانِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَيَّاضَتَانِ وَالْجَرْي أَقْوَى مِنْ النَّضْخ وَقَالَ الضَّحَّاك " نَضَّاخَتَانِ " أَيْ مُمْتَلِئَتَانِ وَلَا تَنْقَطِعَانِ .</p></td></tr></table></body></html>
