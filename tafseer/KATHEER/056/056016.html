<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مُتَّكِئِينَ عَلَيْهَا مُتَقَابِلِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " مُتَّكِئِينَ عَلَيْهَا مُتَقَابِلِينَ " أَيْ وُجُوه بَعْضهمْ إِلَى بَعْض لَيْسَ أَحَد وَرَاء أَحَد .</p></td></tr></table></body></html>
