<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُخَلَّدُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُخَلَّدُونَ عَلَى صِفَة وَاحِدَة لَا يَكْبُرُونَ عَنْهَا وَلَا يَشِيبُونَ وَلَا يَتَغَيَّرُونَ.</p></td></tr></table></body></html>
