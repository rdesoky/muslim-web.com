<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَصْحَابُ الشِّمَالِ مَا أَصْحَابُ الشِّمَالِ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ تَعَالَى حَال أَصْحَاب الْيَمِين عَطَفَ عَلَيْهِمْ بِذِكْرِ أَصْحَاب الشِّمَال فَقَالَ " وَأَصْحَاب الشِّمَال مَا أَصْحَاب الشِّمَال " أَيّ شَيْء هُمْ فِيهِ أَصْحَاب الشِّمَال ؟ .</p></td></tr></table></body></html>
