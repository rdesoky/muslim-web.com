<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي سَمُومٍ وَحَمِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ فَسَّرَ ذَلِكَ فَقَالَ " فِي سَمُوم" وَهُوَ الْهَوَاء الْحَارّ " وَحَمِيم " وَهُوَ الْمَاء الْحَارّ .</p></td></tr></table></body></html>
