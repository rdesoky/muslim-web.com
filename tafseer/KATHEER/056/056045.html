<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ كَانُوا قَبْلَ ذَلِكَ مُتْرَفِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ تَعَالَى " إِنَّهُمْ كَانُوا قَبْل ذَلِكَ مُتْرَفِينَ " أَيْ كَانُوا فِي الدَّار الدُّنْيَا مُنَعَّمِينَ مُقْبِلِينَ عَلَى لَذَّات أَنْفُسهمْ لَا يَلْوُونَ عَلَى مَا جَاءَتْهُمْ بِهِ الرُّسُل .</p></td></tr></table></body></html>
