<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَمَجْمُوعُونَ إِلَى مِيقَاتِ يَوْمٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ هَهُنَا " لَمَجْمُوعُونَ إِلَى مِيقَات يَوْم مَعْلُوم " أَيْ هُوَ مُوَقَّت بِوَقْتٍ مَحْدُود لَا يَتَقَدَّم وَلَا يَتَأَخَّر وَلَا يَزِيد وَلَا يَنْقُص .</p></td></tr></table></body></html>
