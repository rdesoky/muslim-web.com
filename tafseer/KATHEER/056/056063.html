<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتُمْ مَا تَحْرُثُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى " أَفَرَأَيْتُمْ مَا تَحْرُثُونَ " وَهُوَ شَقّ الْأَرْض وَإِثَارَتهَا وَالْبَذْر فِيهَا.</p></td></tr></table></body></html>
