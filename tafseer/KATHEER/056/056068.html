<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " أَفَرَأَيْتُمْ الْمَاء الَّذِي تَشْرَبُونَ أَأَنْتُمْ أَنْزَلْتُمُوهُ مِنْ الْمُزْن" يُعْنَى السَّحَاب قَالَهُ اِبْن عَبَّاس وَمُجَاهِد وَغَيْر وَاحِد" أَمْ نَحْنُ الْمُنْزِلُونَ " يَقُول بَلْ نَحْنُ الْمُنْزِلُونَ .</p></td></tr></table></body></html>
