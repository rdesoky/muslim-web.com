<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَقَسَمٌ لَوْ تَعْلَمُونَ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله " وَإِنَّهُ لَقَسَم لَوْ تَعْلَمُونَ عَظِيم " أَيْ وَإِنَّ هَذَا الْقَسَم الَّذِي أَقْسَمْت بِهِ لَقَسَم عَظِيم لَوْ تَعْلَمُونَ عَظَمَته لَعَظَّمْتُمْ الْمُقْسَم بِهِ عَلَيْهِ .</p></td></tr></table></body></html>
