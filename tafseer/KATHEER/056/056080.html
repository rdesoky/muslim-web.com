<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلٌ مِنْ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " تَنْزِيل مِنْ رَبّ الْعَالَمِينَ " أَيْ هَذَا الْقُرْآن مُنَزَّل مِنْ اللَّه رَبّ الْعَالَمِينَ وَلَيْسَ هُوَ كَمَا يَقُولُونَ إِنَّهُ سِحْر أَوْ كِهَانَة أَوْ شِعْر بَلْ هُوَ الْحَقّ الَّذِي لَا مِرْيَة فِيهِ وَلَيْسَ وَرَاءَهُ حَقّ نَافِع .</p></td></tr></table></body></html>
