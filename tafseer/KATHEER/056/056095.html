<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا لَهُوَ حَقُّ الْيَقِينِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " إِنَّ هَذَا لَهُوَ حَقّ الْيَقِين " أَيْ إِنَّ هَذَا الْخَبَر لَهُوَ حَقّ الْيَقِين الَّذِي لَا مِرْيَة فِيهِ وَلَا مَحِيد لِأَحَدٍ عَنْهُ .</p></td></tr></table></body></html>
