<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هُوَ الْمَالِك الْمُتَصَرِّف فِي خَلْقه فَيُحْيِي وَيُمِيت وَيُعْطِي مَنْ يَشَاء مَا يَشَاء " وَهُوَ عَلَى كُلّ شَيْء قَدِير " أَيْ مَا شَاءَ كَانَ وَمَا لَمْ يَشَأْ لَمْ يَكُنْ .</p></td></tr></table></body></html>
