<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَانَ عَاقِبَتَهُمَا أَنَّهُمَا فِي النَّارِ خَالِدَيْنِ فِيهَا وَذَلِكَ جَزَاءُ الظَّالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَكَانَ عَاقِبَة الْآمِر بِالْكُفْرِ وَالْفَاعِل لَهُ وَمَصِيرهمَا إِلَى نَار جَهَنَّم خَالِدَيْنِ فِيهَا " وَذَلِكَ جَزَاء الظَّالِمِينَ " أَيْ جَزَاء كُلّ ظَالِم .</p></td></tr></table></body></html>
