<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي مَا أَعْطَاهُ اللَّه مُحَمَّدًا صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ مِنْ النُّبُوَّة الْعَظِيمَة وَمَا خَصَّ بِهِ أُمَّته مِنْ بِعْثَتِهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ إِلَيْهِمْ .</p></td></tr></table></body></html>
