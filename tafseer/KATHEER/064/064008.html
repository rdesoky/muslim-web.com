<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَآمِنُوا بِاللَّهِ وَرَسُولِهِ وَالنُّورِ الَّذِي أَنْزَلْنَا وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ تَعَالَى " فَآمِنُوا بِاَللَّهِ وَرَسُوله وَالنُّور الَّذِي أَنْزَلْنَا " يَعْنِي الْقُرْآن " وَاَللَّه بِمَا تَعْمَلُونَ خَبِير " أَيْ فَلَا تَخْفَى عَلَيْهِ مِنْ أَعْمَالكُمْ خَافِيَة .</p></td></tr></table></body></html>
