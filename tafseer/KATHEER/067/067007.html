<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ</font></td></tr><tr><td align=right dir=rtl><p>" إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا " قَالَ اِبْن جَرِير يَعْنِي الصِّيَاح " وَهِيَ تَفُور " قَالَ الثَّوْرِيّ تَغْلِي بِهِمْ كَمَا يَغْلِي الْحَبّ الْقَلِيل فِي الْمَاء الْكَثِير .</p></td></tr></table></body></html>
