<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا أَنْتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَسْت وَلِلَّهِ الْحَمْد بِمَجْنُونٍ كَمَا يَقُولهُ الْجَهَلَة مِنْ قَوْمك الْمُكَذِّبُونَ بِمَا جِئْتهمْ بِهِ مِنْ الْهُدَى وَالْحَقّ الْمُبِين فَنَسَبُوك فِيهِ إِلَى الْجُنُون .</p></td></tr></table></body></html>
