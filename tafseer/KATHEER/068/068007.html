<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هُوَ يَعْلَم تَعَالَى أَيّ الْفَرِيقَيْنِ مِنْكُمْ وَمِنْهُمْ هُوَ الْمُهْتَدِي وَيَعْلَم الْحِزْب الضَّالّ عَنْ الْحَقّ .</p></td></tr></table></body></html>
