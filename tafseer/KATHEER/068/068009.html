<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَدُّوا لَوْ تُدْهِنُ فَيُدْهِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَدُّوا لَوْ تُدْهِن فَيُدْهِنُونَ" قَالَ اِبْن عَبَّاس لَوْ تُرَخِّص لَهُمْ فَيُرَخِّصُونَ . وَقَالَ مُجَاهِد " وَدُّوا لَوْ تُدْهِن " تَرْكَن إِلَى آلِهَتِهِمْ وَتَتْرُك مَا أَنْتَ عَلَيْهِ مِنْ الْحَقّ .</p></td></tr></table></body></html>
