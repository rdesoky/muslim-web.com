<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنَّاعٍ لِلْخَيْرِ مُعْتَدٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَمْنَع مَا عَلَيْهِ وَمَا لَدَيْهِ مِنْ الْخَيْر " مُعْتَدٍ " فِي تَنَاوُل مَا أَحَلَّ اللَّه لَهُ يَتَجَاوَز فِيهَا الْحَدّ الْمَشْرُوع " أَثِيم " أَيْ يَتَنَاوَل الْمُحَرَّمَات .</p></td></tr></table></body></html>
