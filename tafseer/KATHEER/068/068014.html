<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ كَانَ ذَا مَالٍ وَبَنِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى هَذَا مُقَابَلَة مَا أَنْعَمَ اللَّه عَلَيْهِ مِنْ الْمَال وَالْبَنِينَ .</p></td></tr></table></body></html>
