<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَطَافَ عَلَيْهَا طَائِفٌ مِنْ رَبِّكَ وَهُمْ نَائِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا حَنَّثَهُمْ اللَّه فِي أَيْمَانهمْ فَقَالَ تَعَالَى " فَطَافَ عَلَيْهَا طَائِف مِنْ رَبّك وَهُمْ نَائِمُونَ " أَيْ أَصَابَتْهَا آفَة سَمَاوِيَّة.</p></td></tr></table></body></html>
