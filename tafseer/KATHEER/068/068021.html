<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَنَادَوْا مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَمَّا كَانَ وَقْت الصُّبْح نَادَى بَعْضهمْ بَعْضًا لِيَذْهَبُوا إِلَى الْجِذَاذ أَيْ الْقَطْع .</p></td></tr></table></body></html>
