<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْ لَا يَدْخُلَنَّهَا الْيَوْمَ عَلَيْكُمْ مِسْكِينٌ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ تَعَالَى" فَانْطَلَقُوا وَهُمْ يَتَخَافَتُونَ أَنْ لَا يَدْخُلَنهَا الْيَوْم عَلَيْكُمْ مِسْكِين " أَيْ يَقُول بَعْضهمْ لِبَعْضٍ لَا تُمَكِّنُوا الْيَوْم فَقِيرًا يَدْخُلهَا عَلَيْكُمْ .</p></td></tr></table></body></html>
