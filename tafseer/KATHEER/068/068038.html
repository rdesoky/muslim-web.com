<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ أَمْ لَكُمْ أَيْمَان عَلَيْنَا بَالِغَة إِلَى يَوْم الْقِيَامَة إِنَّ لَكُمْ لَمَا تَحْكُمُونَ " أَيْ أَمَعَكُمْ عُهُود مِنَّا وَمَوَاثِيق مُؤَكَّدَة ؟ .</p></td></tr></table></body></html>
