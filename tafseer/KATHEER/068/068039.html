<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَكُمْ أَيْمَانٌ عَلَيْنَا بَالِغَةٌ إِلَى يَوْمِ الْقِيَامَةِ إِنَّ لَكُمْ لَمَا تَحْكُمُونَ</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ لَكُمْ لَمَا تَحْكُمُونَ" أَيْ أَنَّهُ سَيَحْصُلُ لَكُمْ مَا تُرِيدُونَ وَتَشْتَهُونَ .</p></td></tr></table></body></html>
