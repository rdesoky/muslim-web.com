<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلْهُمْ أَيُّهُمْ بِذَلِكَ زَعِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قُلْ لَهُمْ مَنْ هُوَ الْمُتَضَمِّن الْمُتَكَفِّل بِهَذَا ؟ قَالَ اِبْن عَبَّاس يَقُول أَيّهمْ بِذَلِكَ كَفِيل .</p></td></tr></table></body></html>
