<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَهُمْ شُرَكَاءُ فَلْيَأْتُوا بِشُرَكَائِهِمْ إِنْ كَانُوا صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>" أَمْ لَهُمْ شُرَكَاء " أَيْ مِنْ الْأَصْنَام وَالْأَنْدَاد " فَلْيَأْتُوا بِشُرَكَائِهِمْ إِنْ كَانُوا صَادِقِينَ " .</p></td></tr></table></body></html>
