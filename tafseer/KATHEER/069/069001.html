<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْحَاقَّةُ</font></td></tr><tr><td align=right dir=rtl><p>الْحَاقَّة مِنْ أَسْمَاء يَوْم الْقِيَامَة لِأَنَّ فِيهَا يَتَحَقَّق الْوَعْد وَالْوَعِيد .</p></td></tr></table></body></html>
