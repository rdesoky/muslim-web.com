<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ ثَمُودُ وَعَادٌ بِالْقَارِعَةِ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ ذَكَرَ تَعَالَى إِهْلَاكه الْأُمَم الْمُكَذِّبِينَ بِهَا .</p></td></tr></table></body></html>
