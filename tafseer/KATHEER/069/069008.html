<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَهَلْ تَرَى لَهُمْ مِنْ بَاقِيَةٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَلْ تُحِسّ مِنْهُمْ مِنْ أَحَد مِنْ بَقَايَاهُمْ أَوْ مِمَّنْ يَنْتَسِب إِلَيْهِمْ بَلْ بَادُوا عَنْ آخِرهمْ وَلَمْ يَجْعَل اللَّه لَهُمْ خَلَفًا .</p></td></tr></table></body></html>
