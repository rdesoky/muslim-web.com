<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحُمِلَتِ الْأَرْضُ وَالْجِبَالُ فَدُكَّتَا دَكَّةً وَاحِدَةً</font></td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ هَهُنَا " وَحُمِلَتْ الْأَرْض وَالْجِبَال فَدُكَّتَا دَكَّة وَاحِدَة " أَيْ فَمُدَّتْ مَدّ الْأَدِيم الْعِكَاظِيّ وَتَبَدَّلَتْ الْأَرْض غَيْر الْأَرْض .</p></td></tr></table></body></html>
