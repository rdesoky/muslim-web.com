<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي ظَنَنْتُ أَنِّي مُلَاقٍ حِسَابِيَهْ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " إِنِّي ظَنَنْت أَنِّي مُلَاقٍ حِسَابِيَهْ " أَيْ قَدْ كُنْت مُوقِنًا فِي الدُّنْيَا أَنَّ هَذَا الْيَوْم كَائِن لَا مَحَالَة كَمَا قَالَ تَعَالَى " الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو رَبّهمْ " .</p></td></tr></table></body></html>
