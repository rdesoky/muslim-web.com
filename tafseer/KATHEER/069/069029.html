<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَلَكَ عَنِّي سُلْطَانِيَهْ</font></td></tr><tr><td align=right dir=rtl><p>" مَا أَغْنَى عَنِّي مَالِيَهْ هَلَكَ عَنِّي سُلْطَانِيَهْ " أَيْ لَمْ يَدْفَع عَنِّي مَالِي وَلَا جَاهِي عَذَاب اللَّه وَبَأْسه بَلْ خَلَصَ الْأَمْر إِلَيَّ وَحْدِي فَلَا مُعِين لِي وَلَا مُجِير .</p></td></tr></table></body></html>
