<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَيْسَ لَهُ الْيَوْمَ هَا هُنَا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى" فَلَيْسَ لَهُ الْيَوْم هَهُنَا حَمِيم وَلَا طَعَام إِلَّا مِنْ غِسْلِين لَا يَأْكُلهُ إِلَّا الْخَاطِئُونَ " أَيْ لَيْسَ لَهُ الْيَوْم مَنْ يُنْقِذهُ مِنْ عَذَاب اللَّه تَعَالَى لَا حَمِيم وَهُوَ الْقَرِيب وَلَا شَفِيع يُطَاع .</p></td></tr></table></body></html>
