<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا أُقْسِمُ بِمَا تُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُقْسِمًا لِخَلْقِهِ بِمَا يُشَاهِدُونَهُ مِنْ آيَاته فِي مَخْلُوقَاته الدَّالَّة عَلَى كَمَالِهِ فِي أَسْمَائِهِ وَصِفَاته .</p></td></tr></table></body></html>
