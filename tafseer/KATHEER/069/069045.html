<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَأَخَذْنَا مِنْهُ بِالْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ مَعْنَاهُ لَانْتَقَمْنَا مِنْهُ بِالْيَمِينِ لِأَنَّهَا أَشَدّ فِي الْبَطْش وَقِيلَ لَأَخَذْنَا مِنْهُ بِيَمِينِهِ .</p></td></tr></table></body></html>
