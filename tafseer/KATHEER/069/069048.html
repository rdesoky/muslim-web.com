<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَتَذْكِرَةٌ لِلْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن كَمَا قَالَ تَعَالَى " قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدًى وَشِفَاء وَاَلَّذِينَ لَا يُؤْمِنُونَ فِي آذَانهمْ وَقْر وَهُوَ عَلَيْهِمْ عَمًى " .</p></td></tr></table></body></html>
