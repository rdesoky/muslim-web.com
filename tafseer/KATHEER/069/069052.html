<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّذِي أَنْزَلَ هَذَا الْقُرْآن الْعَظِيم . آخِر تَفْسِير سُورَة الْحَاقَّة وَلِلَّهِ الْحَمْد وَالْمِنَّة .</p></td></tr></table></body></html>
