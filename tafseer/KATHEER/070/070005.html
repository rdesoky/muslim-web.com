<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاصْبِرْ صَبْرًا جَمِيلًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِصْبِرْ يَا مُحَمَّد عَلَى تَكْذِيب قَوْمك لَك وَاسْتِعْجَالهمْ الْعَذَاب اِسْتِبْعَادًا لِوُقُوعِهِ كَقَوْلِهِ" يَسْتَعْجِل بِهَا الَّذِينَ لَا يُؤْمِنُونَ بِهَا وَاَلَّذِينَ آمَنُوا مُشْفِقُونَ مِنْهَا وَيَعْلَمُونَ أَنَّهَا الْحَقّ " .</p></td></tr></table></body></html>
