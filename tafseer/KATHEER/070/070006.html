<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ يَرَوْنَهُ بَعِيدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وُقُوع الْعَذَاب وَقِيَام السَّاعَة يَرَاهُ الْكَفَرَة بَعِيد الْوُقُوع بِمَعْنَى مُسْتَحِيل الْوُقُوع.</p></td></tr></table></body></html>
