<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ تَكُونُ السَّمَاءُ كَالْمُهْلِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى الْعَذَاب وَاقِع بِالْكَافِرِينَ " يَوْم تَكُون السَّمَاء كَالْمُهْلِ " قَالَ اِبْن عَبَّاس وَمُجَاهِد وَعَطَاء وَسَعِيد بْن جُبَيْر وَعِكْرِمَة وَالسُّدِّيّ وَغَيْر وَاحِد أَيْ كَدُرْدِيِّ الزَّيْت .</p></td></tr></table></body></html>
