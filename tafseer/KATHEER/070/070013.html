<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَصِيلَتِهِ الَّتِي تُؤْوِيهِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ مُجَاهِد وَالسُّدِّيّ " فَصِيلَته" قَبِيلَته وَعَشِيرَته وَقَالَ عِكْرِمَة فَخِذه الَّذِي هُوَ مِنْهُمْ وَقَالَ أَشْهَب عَنْ مَالِك فَصِيلَته أُمّه .</p></td></tr></table></body></html>
