<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْإِنْسَانَ خُلِقَ هَلُوعًا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ الْإِنْسَان وَمَا هُوَ مَجْبُول عَلَيْهِ مِنْ الْأَخْلَاق الدَّنِيئَة" إِنَّ الْإِنْسَان خُلِقَ هَلُوعًا " .</p></td></tr></table></body></html>
