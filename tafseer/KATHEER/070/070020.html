<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا مَسَّهُ الشَّرُّ جَزُوعًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِذَا أَصَابَهُ الضُّرّ فَزِعَ وَجَزِعَ وَانْخَلَعَ قَلْبه مِنْ شِدَّة الرُّعْب وَأَيِسَ أَنْ يَحْصُل لَهُ بَعْد ذَلِكَ خَيْر .</p></td></tr></table></body></html>
