<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا الْمُصَلِّينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْإِنْسَان مِنْ حَيْثُ هُوَ مُتَّصِف بِصِفَاتِ الذَّمّ إِلَّا مَنْ عَصَمَهُ اللَّه وَوَفَّقَهُ وَهَدَاهُ إِلَى الْخَيْر وَيَسَّرَ لَهُ أَسْبَابه وَهُمْ الْمُصَلُّونَ .</p></td></tr></table></body></html>
