<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَأْمَنهُ أَحَد مِمَّنْ عَقَلَ عَنْ اللَّه أَمْره إِلَّا بِأَمَانٍ مِنْ اللَّه تَبَارَكَ وَتَعَالَى.</p></td></tr></table></body></html>
