<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ذَلِكَ الْيَوْمُ الَّذِي كَانُوا يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>" خَاشِعَة أَبْصَارهمْ " أَيْ خَاضِعَة " تَرْهَقهُمْ ذِلَّة " أَيْ فِي مُقَابَلَة مَا اِسْتَكْبَرُوا فِي الدُّنْيَا عَنْ الطَّاعَةِ .</p></td></tr></table></body></html>
