<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اُتْرُكُوا مَحَارِمَهُ وَاجْتَنِبُوا مَآثِمه " وَأَطِيعُونِ " فِيمَا آمُركُمْ بِهِ وَأَنْهَاكُمْ عَنْهُ .</p></td></tr></table></body></html>
