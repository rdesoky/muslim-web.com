<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنِّي أَعْلَنْتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ إِنِّي أَعْلَنْت لَهُمْ " أَيْ كَلَامًا ظَاهِرًا بِصَوْتٍ عَالٍ" وَأَسْرَرْت لَهُمْ إِسْرَارًا " أَيْ فِيمَا بَيْنِي وَبَيْنهمْ فَنَوَّعَ عَلَيْهِمْ الدَّعْوَة لِتَكُونَ أَنْجَع فِيهِمْ .</p></td></tr></table></body></html>
