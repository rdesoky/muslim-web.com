<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَظَمَة قَالَهُ اِبْن عَبَّاس وَمُجَاهِد وَالضَّحَّاك وَقَالَ اِبْن عَبَّاس لَا تُعَظِّمُونَ اللَّه حَقّ عَظَمَته أَيْ لَا تَخَافُونَ مِنْ بَأْسه وَنِقْمَته .</p></td></tr></table></body></html>
