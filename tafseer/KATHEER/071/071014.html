<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَدْ خَلَقَكُمْ أَطْوَارًا</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ مَعْنَاهُ مِنْ نُطْفَة ثُمَّ مِنْ عَلَقَة ثُمَّ مِنْ مُضْغَة قَالَهُ اِبْن عَبَّاس وَعِكْرِمَة وَقَتَادَة وَيَحْيَى بْن رَافِع وَالسُّدِّيّ وَابْن زَيْد .</p></td></tr></table></body></html>
