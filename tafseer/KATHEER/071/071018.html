<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يُعِيدُكُمْ فِيهَا وَيُخْرِجُكُمْ إِخْرَاجًا</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ يُعِيدكُمْ فِيهَا أَيْ إِذَا مُتُّمْ " وَيُخْرِجكُمْ إِخْرَاجًا " أَيْ يَوْم الْقِيَامَة يُعِيدكُمْ كَمَا بَدَأَكُمْ أَوَّل مَرَّة .</p></td></tr></table></body></html>
