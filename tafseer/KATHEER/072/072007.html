<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُمْ ظَنُّوا كَمَا ظَنَنْتُمْ أَنْ لَنْ يَبْعَثَ اللَّهُ أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَنْ يَبْعَث اللَّه بَعْد هَذِهِ الْمُدَّة رَسُولًا . قَالَهُ الْكَلْبِيّ وَابْن جَرِير .</p></td></tr></table></body></html>
