<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّا ظَنَنَّا أَنْ لَنْ نُعجِزَ اللَّهَ فِي الْأَرْضِ وَلَنْ نُعْجِزَهُ هَرَبًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نَعْلَم أَنَّ قُدْرَة اللَّه حَاكِمَة عَلَيْنَا وَأَنَّا لَا نُعْجِزهُ فِي الْأَرْض وَلَوْ أَمْعَنَّا فِي الْهَرَب فَإِنَّهُ عَلَيْنَا قَادِر لَا يُعْجِزهُ أَحَد مِنَّا .</p></td></tr></table></body></html>
