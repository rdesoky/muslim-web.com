<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنِّي لَا أَمْلِكُ لَكُمْ ضَرًّا وَلَا رَشَدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا أَنَا بَشَر مِثْلكُمْ يُوحَى إِلَيَّ وَعَبْد مِنْ عِبَاد اللَّه لَيْسَ إِلَيَّ مِنْ الْأَمْر شَيْء فِي هِدَايَتكُمْ وَلَا غِوَايَتكُمْ بَلْ الْمَرْجِع فِي ذَلِكَ كُلّه إِلَى اللَّه عَزَّ وَجَلَّ .</p></td></tr></table></body></html>
