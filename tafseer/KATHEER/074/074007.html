<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِرَبِّكَ فَاصْبِرْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِجْعَلْ صَبْرك عَلَى أَذَاهُمْ لِوَجْهِ رَبّك عَزَّ وَجَلَّ قَالَهُ مُجَاهِد وَقَالَ إِبْرَاهِيم النَّخَعِيّ اِصْبِرْ عَطِيَّتك لِلَّهِ عَزَّ وَجَلَّ .</p></td></tr></table></body></html>
