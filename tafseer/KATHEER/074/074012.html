<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْتُ لَهُ مَالًا مَمْدُودًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَاسِعًا كَثِيرًا قِيلَ أَلْف دِينَار وَقِيلَ مِائَة أَلْف دِينَار وَقِيلَ أَرْضًا يَسْتَغِلّهَا وَقِيلَ غَيْر ذَلِكَ .</p></td></tr></table></body></html>
