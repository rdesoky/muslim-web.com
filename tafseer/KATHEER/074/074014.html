<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَهَّدْتُ لَهُ تَمْهِيدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَكَّنْته مِنْ صُنُوف الْمَال وَالْأَثَاث وَغَيْر ذَلِكَ .</p></td></tr></table></body></html>
