<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ عَبَسَ وَبَسَرَ</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ عَبَسَ " أَيْ قَبَضَ بَيْن عَيْنَيْهِ وَقَطَّبَ " وَبَسَرَ " أَيْ كَلَحَ وَكَرِهَ وَمِنْهُ قَوْل تَوْبَة بْن حِمْيَر الشَّاعِر : <poem type=2><part>وَقَدْ رَابَنِي مِنْهَا صُدُود رَأَيْته </part><part>وَإِعْرَاضهَا عَنْ حَاجَتِي وَبُسُورهَا </part></poem>.</p></td></tr></table></body></html>
