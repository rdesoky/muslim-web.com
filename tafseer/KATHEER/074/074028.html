<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تُبْقِي وَلَا تَذَرُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَأْكُل لُحُومهمْ وَعُرُوقهمْ وَعَصَبهمْ وَجُلُودهمْ ثُمَّ تُبَدَّل غَيْر ذَلِكَ وَهُمْ فِي ذَلِكَ لَا يَمُوتُونَ وَلَا يَحْيَوْنَ قَالَهُ اِبْن بُرَيْدَة وَأَبُو سِنَان وَغَيْرهمَا.</p></td></tr></table></body></html>
