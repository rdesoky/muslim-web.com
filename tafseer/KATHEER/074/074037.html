<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِمَنْ شَاءَ مِنْكُمْ أَنْ يَتَقَدَّمَ أَوْ يَتَأَخَّرَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِمَنْ شَاءَ أَنْ يَقْبَل النِّذَارَة وَيَهْتَدِي لِلْحَقِّ أَوْ يَتَأَخَّر عَنْهَا وَيُوَلِّي دُبُرهَا .</p></td></tr></table></body></html>
