<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>حَتَّى أَتَانَا الْيَقِينُ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْمَوْت كَقَوْلِهِ تَعَالَى" وَاعْبُدْ رَبّك حَتَّى يَأْتِيك الْيَقِين " وَقَالَ رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ " أَمَّا هُوَ - يَعْنِي عُثْمَان بْن مَظْعُون - فَقَدْ جَاءَهُ الْيَقِين مِنْ رَبّه " .</p></td></tr></table></body></html>
