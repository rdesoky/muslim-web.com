<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُ الْإِنْسَانُ أَلَّنْ نَجْمَعَ عِظَامَهُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَوْم الْقِيَامَة أَيَظُنُّ أَنَّا لَا نَقْدِر عَلَى إِعَادَة عِظَامه وَجَمْعهَا مِنْ أَمَاكِنهَا الْمُتَفَرِّقَة .</p></td></tr></table></body></html>
