<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجُمِعَ الشَّمْسُ وَالْقَمَرُ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ مُجَاهِد كُوِّرَا وَقَرَأَ اِبْن زَيْد عِنْد تَفْسِير هَذِهِ الْآيَة " إِذَا الشَّمْس كُوِّرَتْ وَإِذَا النُّجُوم اِنْكَدَرَتْ " وَرُوِيَ عَنْ اِبْن مَسْعُود أَنَّهُ قَرَأَ " وَجُمِعَ بَيْن الشَّمْس وَالْقَمَر " .</p></td></tr></table></body></html>
