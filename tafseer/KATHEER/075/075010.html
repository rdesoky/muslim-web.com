<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَقُولُ الْإِنْسَانُ يَوْمَئِذٍ أَيْنَ الْمَفَرُّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِذَا عَايَنَ اِبْن آدَم هَذِهِ الْأَهْوَال يَوْم الْقِيَامَة حِينَئِذٍ يُرِيد أَنْ يَفِرّ وَيَقُول أَيْنَ الْمَفَرّ أَيْ هَلْ مِنْ مَلْجَإٍ أَوْ مَوْئِل.</p></td></tr></table></body></html>
