<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا قَرَأْنَاهُ فَاتَّبِعْ قُرْآنَهُ</font></td></tr><tr><td align=right dir=rtl><p>" فَإِذَا قَرَأْنَاهُ " أَيْ إِذَا تَلَاهُ عَلَيْك الْمَلَك عَنْ اللَّه تَعَالَى " فَاتَّبِعْ قُرْآنه " أَيْ فَاسْتَمِعْ لَهُ ثُمَّ اِقْرَأْهُ كَمَا أَقْرَأَك .</p></td></tr></table></body></html>
