<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا يَحْمِلهُمْ عَلَى التَّكْذِيب بِيَوْمِ الْقِيَامَة وَمُخَالَفَة مَا أَنْزَلَهُ اللَّه عَزَّ وَجَلَّ عَلَى رَسُوله صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ مِنْ الْوَحْي الْحَقّ وَالْقُرْآن الْعَظِيم .</p></td></tr></table></body></html>
