<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَذَرُونَ الْآخِرَةَ</font></td></tr><tr><td align=right dir=rtl><p>إِنَّهُمْ إِنَّمَا هِمَّتهمْ إِلَى الدَّار الدُّنْيَا الْعَاجِلَة وَهُمْ لَاهُونَ مُتَشَاغِلُونَ عَنْ الْآخِرَة.</p></td></tr></table></body></html>
