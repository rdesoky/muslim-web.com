<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوُجُوهٌ يَوْمَئِذٍ بَاسِرَةٌ</font></td></tr><tr><td align=right dir=rtl><p>هَذِهِ وُجُوه الْفُجَّار تَكُون يَوْم الْقِيَامَة بَاسِرَة قَالَ قَتَادَة كَالِحَة وَقَالَ السُّدِّيّ تُغَيَّر أَلْوَانهَا وَقَالَ اِبْن زَيْد " بَاسِرَة " أَيْ عَابِسَة .</p></td></tr></table></body></html>
