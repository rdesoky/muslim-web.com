<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَصَارَ عَلَقَة ثُمَّ مُضْغَة ثُمَّ شُكِّلَ وَنُفِخَ فِيهِ الرُّوح فَصَارَ خَلْقًا آخَر سَوِيًّا سَلِيم الْأَعْضَاء ذَكَرًا أَوْ أُنْثَى بِإِذْنِ اللَّه وَتَقْدِيره ؟ .</p></td></tr></table></body></html>
