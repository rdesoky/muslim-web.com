<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنْثَى</font></td></tr><tr><td align=right dir=rtl><p>فَصَارَ خَلْقًا آخَر سَوِيًّا سَلِيم الْأَعْضَاء ذَكَرًا أَوْ أُنْثَى بِإِذْنِ اللَّه وَتَقْدِيره وَلِهَذَا قَالَ تَعَالَى " فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَر وَالْأُنْثَى " .</p></td></tr></table></body></html>
