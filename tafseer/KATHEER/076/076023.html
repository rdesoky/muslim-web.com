<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنْزِيلًا</font></td></tr><tr><td align=right dir=rtl><p>يَمْتَنّ اللَّه عَلَى رَسُوله صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ بِمَا أَنْزَلَهُ عَلَيْهِ مِنْ الْقُرْآن الْعَظِيم تَنْزِيلًا .</p></td></tr></table></body></html>
