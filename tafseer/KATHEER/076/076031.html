<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُدْخِلُ مَنْ يَشَاءُ فِي رَحْمَتِهِ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَهْدِي مَنْ يَشَاء وَيُضِلّ مَنْ يَشَاء فَمَنْ يَهْدِهِ فَلَا مُضِلّ لَهُ وَمَنْ يُضْلِلْ فَلَا هَادِيَ لَهُ آخِر تَفْسِير سُورَةالْإِنْسَان وَلِلَّهِ الْحَمْدُ وَالْمِنَّة .</p></td></tr></table></body></html>
