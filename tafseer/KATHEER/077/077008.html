<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا النُّجُومُ طُمِسَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ذَهَبَ ضَوْءُهَا كَقَوْلِهِ تَعَالَى" وَإِذَا النُّجُوم اِنْكَدَرَتْ " وَكَقَوْلِهِ تَعَالَى " وَإِذَا الْكَوَاكِب اِنْتَثَرَتْ " .</p></td></tr></table></body></html>
