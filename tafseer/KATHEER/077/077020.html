<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نَخْلُقْكُمْ مِنْ مَاءٍ مَهِينٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ضَعِيف حَقِير بِالنِّسْبَةِ إِلَى قُدْرَة الْبَارِئ عَزَّ وَجَلَّ كَمَا تَقَدَّمَ فِي سُورَة يس فِي حَدِيث بِشْر بْن جِحَاش " اِبْن آدَم أَنَّى تُعْجِزنِي وَقَدْ خَلَقْتُك مِنْ مِثْل هَذِهِ ؟ " .</p></td></tr></table></body></html>
