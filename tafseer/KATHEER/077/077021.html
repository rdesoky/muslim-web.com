<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَجَعَلْنَاهُ فِي قَرَارٍ مَكِينٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي جَمَعْنَاهُ فِي الرَّحِم وَهُوَ قَرَار الْمَاء مِنْ الرَّجُل وَالْمَرْأَة وَالرَّحِم مُعَدّ لِذَلِكَ حَافِظ لِمَا أُودِعَ فِيهِ مِنْ الْمَاء .</p></td></tr></table></body></html>
