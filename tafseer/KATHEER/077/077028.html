<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَيْل لِمَنْ تَأَمَّلَ هَذِهِ الْمَخْلُوقَات الدَّالَّة عَلَى عَظَمَة خَالِقهَا ثُمَّ بَعْد هَذَا يَسْتَمِرّ عَلَى تَكْذِيبه وَكُفْره .</p></td></tr></table></body></html>
