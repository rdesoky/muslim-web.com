<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْطَلِقُوا إِلَى مَا كُنْتُمْ بِهِ تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُخْبِرًا عَنْ الْكُفَّار الْمُكَذِّبِينَ بِالْمَعَادِ وَالْجَزَاء وَالْجَنَّة وَالنَّار أَنَّهُمْ يُقَال لَهُمْ يَوْم الْقِيَامَة " اِنْطَلِقُوا إِلَى مَا كُنْتُمْ بِهِ تُكَذِّبُونَ " .</p></td></tr></table></body></html>
