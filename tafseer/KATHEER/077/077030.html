<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْطَلِقُوا إِلَى ظِلٍّ ذِي ثَلَاثِ شُعَبٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي لَهَب النَّار إِذَا اِرْتَفَعَ وَصَعِدَ مَعَهُ دُخَان فَمِنْ شِدَّته وَقُوَّته أَنَّ لَهُ ثَلَاث شُعَب .</p></td></tr></table></body></html>
