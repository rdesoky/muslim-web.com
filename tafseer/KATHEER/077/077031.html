<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا ظَلِيلٍ وَلَا يُغْنِي مِنَ اللَّهَبِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ظِلّ الدُّخَان الْمُقَابِل لِلَّهَبِ لَا ظَلِيل هُوَ فِي نَفْسه وَلَا يُغْنِي مِنْ اللَّهَب يَعْنِي وَلَا يَقِيهِمْ حَرّ اللَّهَب .</p></td></tr></table></body></html>
