<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلُوا وَتَمَتَّعُوا قَلِيلًا إِنَّكُمْ مُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُدَّة قَلِيلَة قَرِيبَة قَصِيرَة أَيْ ثُمَّ تُسَاقُونَ إِلَى نَار جَهَنَّم الَّتِي تَقَدَّمَ ذِكْرهَا .</p></td></tr></table></body></html>
