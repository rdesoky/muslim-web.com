<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَمَّ يَتَسَاءَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى مُنْكِرًا عَلَى الْمُشْرِكِينَ فِي تَسَاؤُلهمْ عَنْ يَوْم الْقِيَامَة إِنْكَارًا لِوُقُوعِهَا " عَمّ يَتَسَاءَلُونَ " أَيْ عَنْ أَيّ شَيْء يَتَسَاءَلُونَ مِنْ أَمْر الْقِيَامَة.</p></td></tr></table></body></html>
