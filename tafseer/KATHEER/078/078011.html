<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْنَا النَّهَارَ مَعَاشًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جَعَلْنَاهُ مُشْرِقًا نَيِّرًا مُضِيئًا لِيَتَمَكَّن النَّاس مِنْ التَّصَرُّف فِيهِ وَالذَّهَاب وَالْمَجِيء لِلْمَعَاشِ وَالتَّكَسُّب وَالتِّجَارَات وَغَيْر ذَلِكَ .</p></td></tr></table></body></html>
