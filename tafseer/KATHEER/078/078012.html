<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي السَّمَوَات السَّبْع فِي اِتِّسَاعهَا وَارْتَفَاعِهَا وَإِحْكَامهَا وَإِتْقَانهَا وَتَزْيِينهَا بِالْكَوَاكِبِ الثَّوَابِت وَالسَّيَّارَات .</p></td></tr></table></body></html>
