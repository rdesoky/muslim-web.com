<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِنُخْرِج بِهَذَا الْمَاء الْكَثِير الطَّيِّب النَّافِع الْمُبَارَك " حَبًّا " يُدَّخَر لِلْأَنَاسِيِّ وَالْأَنْعَام " وَنَبَاتًا " أَيْ خَضِرًا يُؤْكَل رَطْبًا .</p></td></tr></table></body></html>
