<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>جَزَاءً وِفَاقًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَذَا الَّذِي صَارُوا إِلَيْهِ مِنْ هَذِهِ الْعُقُوبَة وَفْق أَعْمَالهمْ الْفَاسِدَة الَّتِي كَانُوا يَعْمَلُونَهَا فِي الدُّنْيَا قَالَهُ مُجَاهِد وَقَتَادَة وَغَيْر وَاحِد .</p></td></tr></table></body></html>
