<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَمْ يَكُونُوا يَعْتَقِدُونَ أَنَّ ثَمَّ دَارًا يُجَازَوْنَ فِيهَا وَيُحَاسَبُونَ .</p></td></tr></table></body></html>
