<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَقَدْ عَلِمْنَا أَعْمَال الْعِبَاد كُلّهمْ وَكَتَبْنَاهُمْ عَلَيْهِمْ وَسَنَجْزِيهِمْ عَلَى ذَلِكَ إِنْ خَيْرًا فَخَيْر وَإِنْ شَرًّا فَشَرّ .</p></td></tr></table></body></html>
