<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا</font></td></tr><tr><td align=right dir=rtl><p>" كَقَوْلِهِ " لَا لَغْو فِيهَا وَلَا تَأْثِيم " أَيْ لَيْسَ فِيهَا كَلَام لَاغٍ عَارٍ عَنْ الْفَائِدَة وَلَا إِثْم كَذِب بَلْ هِيَ دَار السَّلَام وَكُلّ مَا فِيهَا سَالِم مِنْ النَّقْص .</p></td></tr></table></body></html>
