<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ الْيَوْمُ الْحَقُّ فَمَنْ شَاءَ اتَّخَذَ إِلَى رَبِّهِ مَآبًا</font></td></tr><tr><td align=right dir=rtl><p>" ذَلِكَ الْيَوْم الْحَقّ " أَيْ الْكَائِن لَا مَحَالَة " فَمَنْ شَاءَ اِتَّخَذَ إِلَى رَبّه مَآبًا " أَيْ مَرْجِعًا وَطَرِيقًا يَهْتَدِي إِلَيْهِ وَمَنْهَجًا يَمُرّ بِهِ عَلَيْهِ .</p></td></tr></table></body></html>
