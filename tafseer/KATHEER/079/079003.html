<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالسَّابِحَاتِ سَبْحًا</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ اِبْن مَسْعُود هِيَ الْمَلَائِكَة وَرُوِيَ عَنْ عَلِيّ وَمُجَاهِد وَسَعِيد بْن جُبَيْر وَأَبِي صَالِح مِثْل ذَلِكَ وَعَنْ مُجَاهِد " وَالسَّابِحَات سَبْحًا " الْمَوْت وَقَالَ قَتَادَة هِيَ النُّجُوم وَقَالَ عَطَاء بْن أَبِي رَبَاح هِيَ السُّفُن.</p></td></tr></table></body></html>
