<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَئِذَا كُنَّا عِظَامًا نَخِرَةً</font></td></tr><tr><td align=right dir=rtl><p>وَقُرِئَ نَاخِرَة وَقَالَ اِبْن عَبَّاس وَمُجَاهِد وَقَتَادَة أَيْ بَالِيَة قَالَ اِبْن عَبَّاس وَهُوَ الْعَظْم إِذَا بَلِيَ وَدَخَلَتْ الرِّيح فِيهِ .</p></td></tr></table></body></html>
