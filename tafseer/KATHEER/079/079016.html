<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ نَادَاهُ رَبُّهُ بِالْوَادِي الْمُقَدَّسِ طُوًى</font></td></tr><tr><td align=right dir=rtl><p>" إِذْ نَادَاهُ رَبّه " أَيْ كَلَّمَهُ نِدَاء " بِالْوَادِ الْمُقَدَّس " أَيْ الْمُطَهَّر" طُوًى " وَهُوَ اِسْم الْوَادِي عَلَى الصَّحِيح كَمَا تَقَدَّمَ فِي سُورَة طَه .</p></td></tr></table></body></html>
