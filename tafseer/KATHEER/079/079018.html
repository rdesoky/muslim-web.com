<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقُلْ هَلْ لَكَ إِلَى أَنْ تَزَكَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قُلْ لَهُ هَلْ لَك أَنْ تُجِيب إِلَى طَرِيقَة وَمَسْلَك تُزَكَّى بِهِ وَتَسْلَم وَتُطِيع .</p></td></tr></table></body></html>
