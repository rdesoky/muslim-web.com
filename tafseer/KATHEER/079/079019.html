<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَهْدِيَكَ إِلَى رَبِّكَ فَتَخْشَى</font></td></tr><tr><td align=right dir=rtl><p>وَأَهْدِيَك إِلَى رَبّك أَيْ أَدُلّك إِلَى عِبَادَة رَبّك فَتَخْشَى أَيْ فَيَصِير قَلْبك خَاضِعًا لَهُ مُطِيعًا خَاشِعًا بَعْدَمَا كَانَ قَاسِيًا خَبِيثًا بَعِيدًا مِنْ الْخَيْر .</p></td></tr></table></body></html>
