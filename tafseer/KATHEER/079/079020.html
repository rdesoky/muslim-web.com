<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرَاهُ الْآيَةَ الْكُبْرَى</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي فَأَظْهَرَ لَهُ مُوسَى مَعَ هَذِهِ الدَّعْوَة الْحَقّ حُجَّة قَوِيَّة وَدَلِيلًا وَاضِحًا عَلَى صِدْق مَا جَاءَهُ بِهِ مِنْ عِنْد اللَّه .</p></td></tr></table></body></html>
