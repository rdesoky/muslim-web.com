<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَدْبَرَ يَسْعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي مُقَابَلَة الْحَقّ بِالْبَاطِلِ وَهُوَ جَمْعه السَّحَرَة لِيُقَابِلُوا مَا جَاءَ بِهِ مُوسَى مِنْ الْمُعْجِزَات الْبَاهِرَات .</p></td></tr></table></body></html>
