<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَى</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس وَمُجَاهِد وَهَذِهِ الْكَلِمَة قَالَهَا فِرْعَوْن بَعْد قَوْله مَا عَلِمْت لَكُمْ مِنْ إِلَه غَيْرِي بِأَرْبَعِينَ سَنَة .</p></td></tr></table></body></html>
