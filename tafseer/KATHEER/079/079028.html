<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَفَعَ سَمْكَهَا فَسَوَّاهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جَعَلَهَا عَالِيَة الْبِنَاء بَعِيدَة الْفِنَاء مُسْتَوِيَة الْأَرْجَاء مُكَلَّلَة بِالْكَوَاكِبِ فِي اللَّيْلَة الظَّلْمَاء .</p></td></tr></table></body></html>
