<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَتَذَكَّرُ الْإِنْسَانُ مَا سَعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ حِينَئِذٍ يَتَذَكَّر اِبْن آدَم جَمِيع عَمَله خَيْره وَشَرّه كَمَا قَالَ تَعَالَى " يَوْمئِذٍ يَتَذَكَّر الْإِنْسَان وَأَنَّى لَهُ الذِّكْرَى " .</p></td></tr></table></body></html>
