<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَإِنَّ مَصِيره إِلَى الْجَحِيم وَإِنَّ مَطْعَمه مِنْ الزَّقُّوم وَمَشْرَبه مِنْ الْحَمِيم .</p></td></tr></table></body></html>
