<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ خَافَ الْقِيَام بَيْن يَدَيْ اللَّه عَزَّ وَجَلَّ وَخَافَ حُكْم اللَّه فِيهِ وَنَهَى نَفْسه عَنْ هَوَاهَا وَرَدَّهَا إِلَى طَاعَة مَوْلَاهَا .</p></td></tr></table></body></html>
