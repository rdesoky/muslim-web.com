<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ شَاءَ ذَكَرَهُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَمَنْ شَاءَ ذَكَرَ اللَّه تَعَالَى فِي جَمِيع أُمُوره وَيَحْتَمِل عَوْد الضَّمِير إِلَى الْوَحْي لِدَلَالَةِ الْكَلَام عَلَيْهِ .</p></td></tr></table></body></html>
