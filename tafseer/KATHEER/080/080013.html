<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي صُحُفٍ مُكَرَّمَةٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَذِهِ السُّورَة أَوْ الْعِظَة وَكِلَاهُمَا مُتَلَازِم بَلْ جَمِيع الْقُرْآن فِي صُحُف مُكَرَّمَة أَيْ مُعَظَّمَة مُوَقَّرَة .</p></td></tr></table></body></html>
