<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ أَيِّ شَيْءٍ خَلَقَهُ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ بَيَّنَ تَعَالَى لَهُ كَيْف خَلَقَهُ مِنْ الشَّيْء الْحَقِير .</p></td></tr></table></body></html>
