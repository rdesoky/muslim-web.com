<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلْيَنْظُرِ الْإِنْسَانُ إِلَى طَعَامِهِ</font></td></tr><tr><td align=right dir=rtl><p>فِيهِ اِمْتِنَان وَفِيهِ اِسْتِدْلَال بِإِحْيَاءِ النَّبَات مِنْ الْأَرْض الْهَامِدَة عَلَى إِحْيَاء الْأَجْسَام بَعْدَمَا كَانَتْ عِظَامًا بَالِيَة وَتُرَابًا مُتَمَزِّقًا .</p></td></tr></table></body></html>
