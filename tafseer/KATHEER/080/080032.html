<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَتَاعًا لَكُمْ وَلِأَنْعَامِكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عِيشَة لَكُمْ وَلِأَنْعَامِكُمْ فِي هَذِهِ الدَّار إِلَى يَوْم الْقِيَامَة .</p></td></tr></table></body></html>
