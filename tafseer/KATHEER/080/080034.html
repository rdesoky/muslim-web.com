<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَرَاهُ وَيَفِرّ مِنْهُ وَيَبْتَعِد مِنْهُ لِأَنَّ الْهَوْل عَظِيم وَالْخَطْب جَلِيل .</p></td></tr></table></body></html>
