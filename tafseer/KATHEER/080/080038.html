<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ مُسْفِرَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَكُون النَّاس هُنَالِكَ فَرِيقَيْنِ وُجُوه مُسْفِرَة أَيْ مُسْتَنِيرَة .</p></td></tr></table></body></html>
