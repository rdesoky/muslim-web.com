<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَرْهَقُهَا قَتَرَةٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ اِبْن عَبَّاس " تَرْهَقُهَا قَتَرَة" أَيْ يَغْشَاهَا سَوَاد الْوُجُوه .</p></td></tr></table></body></html>
