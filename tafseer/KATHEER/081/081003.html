<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا الْجِبَالُ سُيِّرَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ زَالَتْ عَنْ أَمَاكِنهَا وَنُسِفَتْ فَتُرِكَتْ الْأَرْض قَاعًا صَفْصَفًا .</p></td></tr></table></body></html>
