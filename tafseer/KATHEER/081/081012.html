<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا الْجَحِيمُ سُعِّرَتْ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ السُّدِّيّ أُحْمِيَتْ وَقَالَ قَتَادَة أُوقِدَتْ قَالَ وَإِنَّمَا يُسَعِّرهَا غَضَب اللَّه وَخَطَايَا بَنِي آدَم .</p></td></tr></table></body></html>
