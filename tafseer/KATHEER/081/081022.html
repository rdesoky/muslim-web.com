<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا صَاحِبُكُمْ بِمَجْنُونٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الشَّعْبِيّ وَمَيْمُون بْن مِهْرَان وَأَبُو صَالِح وَمَنْ تَقَدَّمَ ذِكْرهمْ الْمُرَاد بِقَوْلِهِ" وَمَا صَاحِبكُمْ بِمَجْنُونٍ " يَعْنِي مُحَمَّدًا صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ .</p></td></tr></table></body></html>
