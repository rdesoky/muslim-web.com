<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِمَنْ شَاءَ مِنْكُمْ أَنْ يَسْتَقِيمَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَنْ أَرَادَ الْهِدَايَة فَعَلَيْهِ بِهَذَا الْقُرْآن فَإِنَّهُ مَنْجَاة لَهُ وَهِدَايَة وَلَا هِدَايَة فِيمَا سِوَاهُ .</p></td></tr></table></body></html>
