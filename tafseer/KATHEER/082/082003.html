<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا الْبِحَارُ فُجِّرَتْ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ عَلِيّ بْن أَبِي طَلْحَة عَنْ اِبْن عَبَّاس فَجَّرَ اللَّه بَعْضهمْ فِي بَعْض . وَقَالَ الْحَسَن فَجَّرَ اللَّه بَعْضهَا فِي بَعْض فَذَهَبَ مَاؤُهَا وَقَالَ قَتَادَة اِخْتَلَطَ عَذْبهَا بِمَالِحِهَا وَقَالَ الْكَلْبِيّ مُلِئَتْ .</p></td></tr></table></body></html>
