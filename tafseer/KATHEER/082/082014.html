<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ ذَكَرَ مَا يَصِير إِلَيْهِ الْفُجَّار مِنْ الْجَحِيم وَالْعَذَاب الْمُقِيم .</p></td></tr></table></body></html>
