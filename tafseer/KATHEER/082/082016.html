<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُمْ عَنْهَا بِغَائِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَغِيبُونَ عَنْ الْعَذَاب سَاعَة وَاحِدَة وَلَا يُخَفَّف عَنْهُمْ مِنْ عَذَابهَا وَلَا يُجَابُونَ إِلَى مَا يَسْأَلُونَ مِنْ الْمَوْت أَوْ الرَّاحَة وَلَوْ يَوْمًا وَاحِدًا .</p></td></tr></table></body></html>
