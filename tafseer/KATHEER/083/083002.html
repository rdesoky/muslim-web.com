<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ</font></td></tr><tr><td align=right dir=rtl><p>بِقَوْلِهِ تَعَالَى " الَّذِينَ إِذَا اِكْتَالُوا عَلَى النَّاس " أَيْ مِنْ النَّاس" يَسْتَوْفُونَ " أَيْ يَأْخُذُونَ حَقّهمْ بِالْوَافِي وَالزَّائِد.</p></td></tr></table></body></html>
