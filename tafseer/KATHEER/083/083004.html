<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا يَظُنُّ أُولَئِكَ أَنَّهُمْ مَبْعُوثُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَمَا يَخَاف أُولَئِكَ مِنْ الْبَعْث وَالْقِيَام بَيْن يَدَيْ مَنْ يَعْلَم السَّرَائِر وَالضَّمَائِر .</p></td></tr></table></body></html>
