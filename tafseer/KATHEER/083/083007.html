<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى حَقًّا" إِنَّ كِتَاب الْفُجَّار لَفِي سِجِّين " أَيْ إِنَّ مَصِيرهمْ وَمَأْوَاهُمْ لَفِي سِجِّين فِعِّيل مِنْ السِّجْن وَهُوَ الضِّيق كَمَا يُقَال فِسِّيق وَشِرِّيب وَخِمِّير وَسِكِّير وَنَحْو ذَلِكَ .</p></td></tr></table></body></html>
