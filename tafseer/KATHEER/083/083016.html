<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّهُمْ لَصَالُو الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ثُمَّ هُمْ مَعَ هَذَا الْحِرْمَان عَنْ رُؤْيَة الرَّحْمَن مِنْ أَهْل النِّيرَان .</p></td></tr></table></body></html>
