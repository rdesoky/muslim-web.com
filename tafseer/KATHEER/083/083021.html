<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَشْهَدُهُ الْمُقَرَّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>هُمْ الْمَلَائِكَة قَالَهُ قَتَادَة وَقَالَ الْعَوْفِيّ عَنْ اِبْن عَبَّاس يَشْهَدهُ مِنْ كُلّ سَمَاء مُقَرَّبُوهَا .</p></td></tr></table></body></html>
