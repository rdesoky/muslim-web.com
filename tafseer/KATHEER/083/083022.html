<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَوْم الْقِيَامَة هُمْ فِي نَعِيم مُقِيم وَجَنَّات فِيهَا فَضْل عَمِيم .</p></td></tr></table></body></html>
