<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ النَّعِيمِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَعْرِف إِذَا نَظَرْت إِلَيْهِمْ فِي وُجُوههمْ نَضْرَة النَّعِيم أَيْ صِفَة التَّرَافَة وَالْحِشْمَة وَالسُّرُور وَالدَّعَة وَالرِّيَاسَة مِمَّا هُمْ فِيهِ مِنْ النَّعِيم الْعَظِيم .</p></td></tr></table></body></html>
