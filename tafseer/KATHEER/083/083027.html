<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِزَاجُهُ مِنْ تَسْنِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَمِزَاج هَذَا الرَّحِيق الْمَوْصُوف مِنْ تَسْنِيم أَيْ مِنْ شَرَاب يُقَال لَهُ تَسْنِيم وَهُوَ أَشْرَف شَرَاب أَهْل الْجَنَّة وَأَعْلَاهُ قَالَهُ أَبُو صَالِح وَالضَّحَّاك.</p></td></tr></table></body></html>
