<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ يَضْحَكُونَ</font></td></tr><tr><td align=right dir=rtl><p>" فَالْيَوْم" يَعْنِي يَوْم الْقِيَامَة " الَّذِينَ آمَنُوا مِنْ الْكُفَّار يَضْحَكُونَ" أَيْ فِي مُقَابَلَة مَا ضَحِكَ بِهِمْ أُولَئِكَ .</p></td></tr></table></body></html>
