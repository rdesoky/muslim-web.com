<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى الْأَرَائِكِ يَنْظُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِلَى اللَّه عَزَّ وَجَلَّ فِي مُقَابَلَة مَنْ زَعَمَ فِيهِمْ أَنَّهُمْ ضَالُّونَ وَلَيْسُوا بِضَالِّينَ بَلْ هُمْ مِنْ أَوْلِيَاء اللَّه الْمُقَرَّبِينَ يَنْظُرُونَ إِلَى رَبّهمْ فِي دَار كَرَامَته .</p></td></tr></table></body></html>
