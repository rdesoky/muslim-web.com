<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِشِمَالِهِ مِنْ وَرَاء ظَهْره تُثْنَى يَده إِلَى وَرَائِهِ وَيُعْطَى كِتَابه بِهَا كَذَلِكَ .</p></td></tr></table></body></html>
