<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَرِحًا لَا يُفَكِّر فِي الْعَوَاقِب وَلَا يَخَاف مِمَّا أَمَامه فَأَعْقَبَهُ ذَلِكَ الْفَرَح الْيَسِير الْحُزْن الطَّوِيل .</p></td></tr></table></body></html>
