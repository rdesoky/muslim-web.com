<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلَى إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي بَلَى سَيُعِيدُهُ اللَّه كَمَا بَدَأَهُ وَيُجَازِيه عَلَى أَعْمَاله خَيْرهَا وَشَرّهَا فَإِنَّهُ كَانَ بِهِ بَصِيرًا أَيْ عَلِيمًا خَبِيرًا .</p></td></tr></table></body></html>
