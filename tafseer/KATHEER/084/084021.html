<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَمَا لَهُمْ إِذَا قُرِئَتْ عَلَيْهِمْ آيَات اللَّه وَكَلَامه وَهُوَ هَذَا الْقُرْآن لَا يَسْجُدُونَ إِعْظَامًا وَإِكْرَامًا وَاحْتِرَامًا ؟ .</p></td></tr></table></body></html>
