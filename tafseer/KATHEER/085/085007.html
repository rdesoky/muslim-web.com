<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُمْ عَلَى مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُشَاهِدُونَ لِمَا يُفْعَل بِأُولَئِكَ الْمُؤْمِنِينَ .</p></td></tr></table></body></html>
