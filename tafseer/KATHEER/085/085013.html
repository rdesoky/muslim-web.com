<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ قُوَّته وَقُدْرَته التَّامَّة يُبْدِئ الْخَلْق وَيُعِيدهُ كَمَا بَدَأَهُ بِلَا مُمَانِع وَلَا مُدَافِع.</p></td></tr></table></body></html>
