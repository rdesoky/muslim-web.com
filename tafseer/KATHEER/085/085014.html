<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الْغَفُورُ الْوَدُودُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَغْفِر ذَنْب مَنْ تَابَ إِلَيْهِ وَخَضَعَ لَدَيْهِ وَلَوْ كَانَ الذَّنْب مِنْ أَيّ شَيْء كَانَ وَالْوَدُود قَالَ اِبْن عَبَّاس وَغَيْره هُوَ الْحَبِيب .</p></td></tr></table></body></html>
