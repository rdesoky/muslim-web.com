<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذُو الْعَرْشِ الْمَجِيدُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ صَاحِب الْعَرْش الْعَظِيم الْعَالِي عَلَى جَمِيع الْخَلَائِق وَالْمَجِيد فِيهِ قِرَاءَتَانِ الرَّفْع عَلَى أَنَّهُ صِفَة لِلرَّبِّ عَزَّ وَجَلَّ وَالْجَرّ عَلَى أَنَّهُ صِفَة لِلْعَرْشِ وَكِلَاهُمَا مَعْنًى صَحِيح .</p></td></tr></table></body></html>
