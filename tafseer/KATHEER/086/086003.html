<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>النَّجْمُ الثَّاقِبُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " الثَّاقِب " قَالَ اِبْن عَبَّاس الْمُضِيء وَقَالَ السُّدِّيّ يَثْقُب الشَّيَاطِين إِذَا أُرْسِلَ عَلَيْهَا وَقَالَ عِكْرِمَة هُوَ مُضِيء وَمُحْرِق لِلشَّيْطَانِ .</p></td></tr></table></body></html>
