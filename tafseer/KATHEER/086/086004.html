<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كُلُّ نَفْسٍ لَمَّا عَلَيْهَا حَافِظٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كُلّ نَفْس عَلَيْهَا مِنْ اللَّه حَافِظ يَحْرُسهَا مِنْ الْآفَات كَمَا قَالَ تَعَالَى " لَهُ مُعَقِّبَات مِنْ بَيْن يَدَيْهِ وَمِنْ خَلْفه يَحْفَظُونَهُ مِنْ أَمْر اللَّه " .</p></td></tr></table></body></html>
