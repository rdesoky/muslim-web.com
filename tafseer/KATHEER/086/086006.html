<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خُلِقَ مِنْ مَاءٍ دَافِقٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْمَنِيّ يَخْرُج دَفْقًا مِنْ الرَّجُل وَمِنْ الْمَرْأَة فَيَتَوَلَّد مِنْهُمَا الْوَلَد بِإِذْنِ اللَّه عَزَّ وَجَلَّ .</p></td></tr></table></body></html>
