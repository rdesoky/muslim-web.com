<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَهُ مِنْ قُوَّةٍ وَلَا نَاصِرٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " فَمَا لَهُ " أَيْ الْإِنْسَان يَوْم الْقِيَامَة " مِنْ قُوَّة " أَيْ فِي نَفْسه " وَلَا نَاصِر " أَيْ مِنْ خَارِج مِنْهُ أَيْ لَا يَقْدِر عَلَى أَنْ يُنْقِذ نَفْسه مِنْ عَذَاب اللَّه وَلَا يَسْتَطِيع لَهُ أَحَد ذَلِكَ .</p></td></tr></table></body></html>
