<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْأَرْضِ ذَاتِ الصَّدْعِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس هُوَ اِنْصِدَاعهَا عَنْ النَّبَات وَكَذَا قَالَ سَعِيد بْن جُبَيْر وَعِكْرِمَة وَأَبُو مَالِك وَالضَّحَّاك وَالْحَسَن وَقَتَادَة وَالسُّدِّيّ وَغَيْر وَاحِد.</p></td></tr></table></body></html>
