<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَنُقْرِئُكَ فَلَا تَنْسَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " سَنُقْرِئُك " أَيْ يَا مُحَمَّد " فَلَا تَنْسَى " وَهَذَا إِخْبَار مِنْ اللَّه تَعَالَى وَوَعْد مِنْهُ لَهُ بِأَنَّهُ سَيُقْرِئُهُ قِرَاءَة لَا يَنْسَاهَا.</p></td></tr></table></body></html>
