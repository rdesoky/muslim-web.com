<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنُيَسِّرُكَ لِلْيُسْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نُسَهِّل عَلَيْك أَفْعَال الْخَيْر وَأَقْوَاله وَنَشْرَع لَك شَرْعًا سَهْلًا سَمْحًا مُسْتَقِيمًا عَدْلًا لَا اِعْوِجَاج فِيهِ وَلَا حَرَج وَلَا عُسْر .</p></td></tr></table></body></html>
