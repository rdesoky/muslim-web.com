<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَذَّكَّرُ مَنْ يَخْشَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ سَيَتَّعِظُ بِمَا تُبَلِّغهُ يَا مُحَمَّد مَنْ قَلْبه يَخْشَى اللَّه وَيَعْلَم أَنَّهُ مُلَاقِيه .</p></td></tr></table></body></html>
