<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَدْ أَفْلَحَ مَنْ تَزَكَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ طَهَّرَ نَفْسه مِنْ الْأَخْلَاق الرَّذِيلَة وَتَابَعَ مَا أَنْزَلَ اللَّه عَلَى الرَّسُول صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ .</p></td></tr></table></body></html>
