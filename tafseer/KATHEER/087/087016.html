<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تُقَدِّمُونَهَا عَلَى أَمْر الْآخِرَة وَتُبَدُّونَهَا عَلَى مَا فِيهِ نَفْعكُمْ وَصَلَاحكُمْ فِي مَعَاشكُمْ وَمَعَادكُمْ .</p></td></tr></table></body></html>
