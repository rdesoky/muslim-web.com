<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ذَلِيلَة قَالَهُ قَتَادَة وَقَالَ اِبْن عَبَّاس تَخْشَع وَلَا يَنْفَعهَا عَمَلهَا .</p></td></tr></table></body></html>
