<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ نَاعِمَةٌ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ حَال الْأَشْقِيَاء ثَنَّى بِذِكْرِ السُّعَدَاء فَقَالَ " وُجُوه يَوْمَئِذٍ " أَيْ يَوْم الْقِيَامَة" نَاعِمَة " أَيْ يُعْرَف النَّعِيم فِيهَا وَإِنَّمَا حَصَلَ لَهَا ذَلِكَ بِسَعْيِهَا .</p></td></tr></table></body></html>
