<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا سُرُرٌ مَرْفُوعَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَالِيَة نَاعِمَة كَثِيرَة الْفُرُش مُرْتَفِعَة السُّمْك عَلَيْهَا الْحُور الْعَيْن قَالُوا فَإِذَا أَرَادَ وَلِيّ اللَّه أَنْ يَجْلِس عَلَى تِلْكَ السُّرُر الْعَالِيَة تَوَاضَعَتْ لَهُ .</p></td></tr></table></body></html>
