<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَكْوَابٌ مَوْضُوعَةٌ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَوَانِي الشُّرْب مُعَدَّة مُرْصَدَة لِمَنْ أَرَادَهَا مِنْ أَرْبَابهَا .</p></td></tr></table></body></html>
