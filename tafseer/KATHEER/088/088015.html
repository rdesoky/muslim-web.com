<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَمَارِقُ مَصْفُوفَةٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس النَّمَارِق الْوَسَائِد وَكَذَا قَالَ عِكْرِمَة وَقَتَادَة وَالضَّحَّاك وَالسُّدِّيّ وَالثَّوْرِيّ وَغَيْرهمْ .</p></td></tr></table></body></html>
