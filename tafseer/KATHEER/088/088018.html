<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَيْفَ رَفَعَهَا اللَّه عَزَّ وَجَلَّ عَنْ الْأَرْض هَذَا الرَّفْع الْعَظِيم كَمَا قَالَ تَعَالَى" أَفَلَمْ يَنْظُرُوا إِلَى السَّمَاء فَوْقهمْ كَيْف بَنَيْنَاهَا وَزَيَّنَّاهَا وَمَا لَهَا مِنْ فُرُوج " .</p></td></tr></table></body></html>
