<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جُعِلَتْ مَنْصُوبَة فَإِنَّهَا ثَابِتَة رَاسِيَة لِئَلَّا تَمِيد الْأَرْض بِأَهْلِهَا وَجَعَلَ فِيهَا مَا جَعَلَ مِنْ الْمَنَافِع وَالْمَعَادِن .</p></td></tr></table></body></html>
