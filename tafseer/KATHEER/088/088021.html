<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَكِّرْ إِنَّمَا أَنْتَ مُذَكِّرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَذَكِّرْ يَا مُحَمَّد النَّاس بِمَا أُرْسِلْت بِهِ إِلَيْهِمْ فَإِنَّمَا عَلَيْك الْبَلَاغ وَعَلَيْنَا الْحِسَاب .</p></td></tr></table></body></html>
