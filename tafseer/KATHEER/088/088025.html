<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِلَيْنَا إِيَابَهُمْ</font></td></tr><tr><td align=right dir=rtl><p>رَوَى عَنْ أَبِي أُمَامَة وَعَنْهُ سَعِيد بْن أَبِي هِلَال وَقَوْله تَعَالَى " إِنَّ إِلَيْنَا إِيَابهمْ " أَيْ مَرْجِعهمْ وَمُنْقَلَبهمْ .</p></td></tr></table></body></html>
