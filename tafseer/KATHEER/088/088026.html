<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نَحْنُ نُحَاسِبهُمْ عَلَى أَعْمَالهمْ وَنُجَازِيهِمْ بِهَا إِنْ خَيْرًا فَخَيْر وَإِنْ شَرًّا فَشَرّ . آخِر تَفْسِير سُورَة الْغَاشِيَة , وَلِلَّهِ الْحَمْد وَالْمِنَّة.</p></td></tr></table></body></html>
