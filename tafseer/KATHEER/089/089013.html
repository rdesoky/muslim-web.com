<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنْزَلَ عَلَيْهِمْ رِجْزًا مِنْ السَّمَاء وَأَحَلَّ بِهِمْ عُقُوبَة لَا يَرُدّهَا عَنْ الْقَوْم الْمُجْرِمِينَ .</p></td></tr></table></body></html>
