<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَمًّا</font></td></tr><tr><td align=right dir=rtl><p>" تَأْكُلُونَ التُّرَاث" يَعْنِي الْمِيرَاث " أَكْلًا لَمًّا " أَيْ مِنْ أَيّ جِهَة حَصَلَ لَهُمْ مِنْ حَلَال أَوْ حَرَام .</p></td></tr></table></body></html>
