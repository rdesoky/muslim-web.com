<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَيَوْمَئِذٍ لَا يُعَذِّبُ عَذَابَهُ أَحَدٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَيْسَ أَحَد أَشَدّ عَذَابًا مِنْ تَعْذِيب اللَّه مَنْ عَصَاهُ .</p></td></tr></table></body></html>
