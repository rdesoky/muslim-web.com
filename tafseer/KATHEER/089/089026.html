<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَلَيْسَ أَحَد أَشَدّ قَبْضًا وَوُثُقًا مِنْ الزَّبَانِيَة لِمَنْ كَفَرَ بِرَبِّهِمْ عَزَّ وَجَلَّ وَهَذَا فِي حَقّ الْمُجْرِمِينَ مِنْ الْخَلَائِق وَالظَّالِمِينَ .</p></td></tr></table></body></html>
