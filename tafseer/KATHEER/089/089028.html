<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ارْجِعِي إِلَى رَبِّكِ رَاضِيَةً مَرْضِيَّةً</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِلَى جِوَاره وَثَوَابه وَمَا أَعَدَّ لِعِبَادِهِ فِي جَنَّته رَاضِيَة أَيْ فِي نَفْسهَا مَرْضِيَّة أَيْ قَدْ رَضِيَتْ عَنْ اللَّه وَرَضِيَ عَنْهَا وَأَرْضَاهَا .</p></td></tr></table></body></html>
