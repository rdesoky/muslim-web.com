<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَقُولُ أَهْلَكْتُ مَالًا لُبَدًا</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " يَقُول أَهْلَكْت مَالًا لُبَدًا " أَيْ يَقُول اِبْن آدَم أَنْفَقْت مَالًا لُبَدًا أَيْ كَثِيرًا قَالَهُ مُجَاهِد وَالْحَسَن وَقَتَادَة وَالسُّدِّيّ وَغَيْرهمْ.</p></td></tr></table></body></html>
