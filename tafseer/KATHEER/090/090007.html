<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَيَحْسَبُ أَنْ لَمْ يَرَهُ أَحَدٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ مُجَاهِد أَيْ أَيَحْسَبُ أَنْ لَمْ يَرَهُ اللَّه عَزَّ وَجَلَّ وَكَذَا قَالَ غَيْره مِنْ السَّلَف.</p></td></tr></table></body></html>
