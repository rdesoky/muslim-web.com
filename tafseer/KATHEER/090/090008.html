<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نَجْعَلْ لَهُ عَيْنَيْنِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُبْصِر بِهِمَا فَانْظُرْ بِعَيْنَيْك إِلَى مَا أَحْلَلْت لَك وَإِنْ رَأَيْت مَا حَرَّمْت عَلَيْك فَأَطْبِقْ عَلَيْهِمَا غِطَاءَهُمَا .</p></td></tr></table></body></html>
