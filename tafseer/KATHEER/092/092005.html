<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا مَنْ أَعْطَى وَاتَّقَى</td></tr><tr><td align=right dir=rtl><p>" فَأَمَّا مَنْ أَعْطَى وَاتَّقَى" أَيْ أَعْطَى مَا أُمِرَ بِإِخْرَاجِهِ وَاتَّقَى اللَّه فِي أُمُوره.</p></td></tr></table></body></html>
