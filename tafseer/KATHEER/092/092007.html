<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَنُيَسِّرُهُ لِلْيُسْرَى</td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " فَسَنُيَسِّرُهُ لِلْيُسْرَى " قَالَ اِبْن عَبَّاس يَعْنِي لِلْخَيْرِ وَقَالَ زَيْد بْن أَسْلَم يَعْنِي الْجَنَّة وَقَالَ بَعْض السَّلَف مِنْ ثَوَاب الْحَسَنَةِ الْحَسَنَةُ بَعْدهَا , وَمَنْ جَاءَ السَّيِّئَة السَّيِّئَةُ بَعْدهَا.</p></td></tr></table></body></html>
