<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَى</td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى " وَأَمَّا مَنْ بَخِلَ " أَيْ بِمَا عِنْده " وَاسْتَغْنَى " قَالَ عِكْرِمَة عَنْ اِبْن عَبَّاس أَيْ بَخِلَ بِمَالِهِ وَاسْتَغْنَى عَنْ رَبّه عَزَّ وَجَلَّ.</p></td></tr></table></body></html>
