<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّى</td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " وَمَا يُغْنِي عَنْهُ مَاله إِذَا تَرَدَّى " قَالَ مُجَاهِد : أَيْ إِذَا مَاتَ وَقَالَ أَبُو صَالِح وَمَالِك عَنْ زَيْد بْن أَسْلَم إِذَا تَرَدَّى فِي النَّار .</p></td></tr></table></body></html>
