<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عَلَيْنَا لَلْهُدَى</td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة " إِنَّ عَلَيْنَا لَلْهُدَى" أَيْ نُبَيِّن الْحَلَال وَالْحَرَام وَقَالَ غَيْره : مَنْ سَلَكَ طَرِيق الْهُدَى وَصَلَ إِلَى اللَّه وَجَعَلَهُ كَقَوْلِهِ تَعَالَى" وَعَلَى اللَّه قَصْد السَّبِيل " حَكَاهُ اِبْن جَرِير .</p></td></tr></table></body></html>
