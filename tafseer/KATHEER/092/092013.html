<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَى</td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " إِنَّ لَنَا لَلْآخِرَة وَالْأُولَى " أَيْ الْجَمِيع مِلْكنَا وَأَنَا الْمُتَصَرِّف فِيهِمَا .</p></td></tr></table></body></html>
