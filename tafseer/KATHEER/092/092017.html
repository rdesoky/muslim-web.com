<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسَيُجَنَّبُهَا الْأَتْقَى</td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " وَسَيُجَنَّبُهَا الْأَتْقَى " أَيْ وَسَيُزَحْزَحُ عَنْ النَّار التَّقِيّ الْأَتْقَى.</p></td></tr></table></body></html>
