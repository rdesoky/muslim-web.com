<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّى</td></tr><tr><td align=right dir=rtl><p>قَوْله " الَّذِي يُؤْتِي مَاله يَتَزَكَّى " أَيْ يَصْرِف مَاله فِي طَاعَة رَبّه لِيُزَكِّيَ نَفْسه وَمَاله وَمَا وَهَبَهُ اللَّه مِنْ دِين وَدُنْيَا .</p></td></tr></table></body></html>
