<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا لِأَحَدٍ عِنْدَهُ مِنْ نِعْمَةٍ تُجْزَى</td></tr><tr><td align=right dir=rtl><p>" وَمَا لِأَحَدٍ عِنْده مِنْ نِعْمَة تُجْزَى " أَيْ لَيْسَ بَذْله مَاله فِي مُكَافَأَة مَنْ أَسْدَى إِلَيْهِ مَعْرُوفًا فَهُوَ يُعْطِي فِي مُقَابَلَة ذَلِكَ وَإِنَّمَا دَفَعَهُ ذَلِكَ .</p></td></tr></table></body></html>
