<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَى</td></tr><tr><td align=right dir=rtl><p>" اِبْتِغَاء وَجْه رَبّه الْأَعْلَى " أَيْ طَمَعًا فِي أَنْ يَحْصُل لَهُ رُؤْيَته فِي الدَّار الْآخِرَة فِي رَوْضَات الْجَنَّات .</p></td></tr></table></body></html>
