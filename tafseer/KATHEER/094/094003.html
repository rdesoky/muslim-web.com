<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي أَنْقَضَ ظَهْرَكَ</td></tr><tr><td align=right dir=rtl><p>الْإِنْقَاض الصَّوْت وَقَالَ غَيْر وَاحِد مِنْ السَّلَف فِي قَوْله " الَّذِي أَنْقَضَ ظَهْرك " أَيْ أَثْقَلَك حَمْله .</p></td></tr></table></body></html>
