<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَى رَبِّكَ فَارْغَبْ</td></tr><tr><td align=right dir=rtl><p>قَالَ الثَّوْرِيّ اِجْعَلْ نِيَّتك وَرَغْبَتك إِلَى اللَّه عَزَّ وَجَلَّ . آخِر تَفْسِير سُورَة أَلَمْ نَشْرَح وَلِلَّهِ الْحَمْد وَالْمِنَّة .</p></td></tr></table></body></html>
