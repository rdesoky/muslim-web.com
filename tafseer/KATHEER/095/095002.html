<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَطُورِ سِينِينَ</td></tr><tr><td align=right dir=rtl><p>قَالَ كَعْب الْأَحْبَار وَغَيْر وَاحِد هُوَ الْجَبَل الَّذِي كَلَّمَ اللَّه عَلَيْهِ مُوسَى عَلَيْهِ السَّلَام .</p></td></tr></table></body></html>
