<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ</td></tr><tr><td align=right dir=rtl><p>هَذَا هُوَ الْمُقْسَم عَلَيْهِ وَهُوَ أَنَّهُ تَعَالَى خَلَقَ الْإِنْسَان فِي أَحْسَن صُورَة وَشَكْل مُنْتَصِب الْقَامَة سَوِيّ الْأَعْضَاء حَسَنهَا .</p></td></tr></table></body></html>
