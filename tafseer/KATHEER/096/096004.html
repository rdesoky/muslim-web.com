<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي عَلَّمَ بِالْقَلَمِ</td></tr><tr><td align=right dir=rtl><p>وَفِي الْأَثَر قَيِّدُوا الْعِلْم بِالْكِتَابَةِ وَفِيهِ أَيْضًا مَنْ عَمِلَ بِمَا عَلِمَ وَرَّثَهُ اللَّهُ عِلْمَ مَا لَمْ يَكُنْ يَعْلَم .</p></td></tr></table></body></html>
