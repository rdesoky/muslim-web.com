<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا إِنَّ الْإِنْسَانَ لَيَطْغَى</td></tr><tr><td align=right dir=rtl><p>يُخْبِر تَعَالَى عَنْ الْإِنْسَان أَنَّهُ ذُو فَرَح وَأَشَر وَبَطَر وَطُغْيَان .</p></td></tr></table></body></html>
