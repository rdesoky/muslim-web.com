<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَرَأَيْتَ إِنْ كَانَ عَلَى الْهُدَى</td></tr><tr><td align=right dir=rtl><p>أَيْ فَمَا ظَنّك إِنْ كَانَ هَذَا الَّذِي تَنْهَاهُ عَلَى الطَّرِيق الْمُسْتَقِيمَة فِي فِعْله.</p></td></tr></table></body></html>
