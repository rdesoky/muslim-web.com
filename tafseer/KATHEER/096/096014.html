<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَى</td></tr><tr><td align=right dir=rtl><p>وَلِهَذَا قَالَ " أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَى " أَيْ أَمَا عَلِمَ هَذَا النَّاهِي لِهَذَا الْمُهْتَدِي أَنَّ اللَّه يَرَاهُ وَيَسْمَع كَلَامه وَسَيُجَازِيهِ عَلَى فِعْله أَتَمّ الْجَزَاء .</p></td></tr></table></body></html>
