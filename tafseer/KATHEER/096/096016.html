<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ</td></tr><tr><td align=right dir=rtl><p>ثُمَّ قَالَ " نَاصِيَة كَاذِبَة خَاطِئَة " يَعْنِي نَاصِيَة أَبِي جَهْل كَاذِبَة فِي مَقَالهَا خَاطِئَة فِي أَفْعَالهَا .</p></td></tr></table></body></html>
