<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ</td></tr><tr><td align=right dir=rtl><p>قَالَ تَعَالَى مُعَظِّمًا لِشَأْنِ لَيْلَة الْقَدْر الَّذِي اِخْتَصَّهَا بِإِنْزَالِ الْقُرْآن الْعَظِيم فِيهَا فَقَالَ وَمَا أَدْرَاك مَا لَيْلَة الْقَدْر .</p></td></tr></table></body></html>
