<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْمُغِيرَاتِ صُبْحًا</td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْإِغَارَة وَقْت الصَّبَاح كَمَا كَانَ رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ يُغِير صَبَاحًا وَيَسْتَمِع الْأَذَان فَإِنْ سَمِعَ أَذَانًا وَإِلَّا أَغَارَ .</p></td></tr></table></body></html>
