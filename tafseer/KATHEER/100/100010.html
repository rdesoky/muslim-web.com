<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَحُصِّلَ مَا فِي الصُّدُورِ</td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس وَغَيْره يَعْنِي أُبْرِزَ وَأُظْهِرَ مَا كَانُوا يُسِرُّونَ فِي نُفُوسهمْ .</p></td></tr></table></body></html>
