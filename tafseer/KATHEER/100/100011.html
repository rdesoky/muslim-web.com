<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّهُمْ بِهِمْ يَوْمَئِذٍ لَخَبِيرٌ</td></tr><tr><td align=right dir=rtl><p>أَيْ لَعَالَمٌ بِجَمِيعِ مَا كَانُوا يَصْنَعُونَ وَيَعْمَلُونَ وَمُجَازِيهمْ عَلَيْهِ أَوْفَر الْجَزَاء وَلَا يَظْلِم مِثْقَال ذَرَّة . آخِر تَفْسِير سُورَة الْعَادِيَات وَلِلَّهِ الْحَمْد وَالْمِنَّة .</p></td></tr></table></body></html>
