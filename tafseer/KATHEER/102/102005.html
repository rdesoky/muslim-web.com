<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ</td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِين " أَيْ لَوْ عَلِمْتُمْ حَقّ الْعِلْم لَمَا أَلْهَاكُمْ التَّكَاثُر عَنْ طَلَب الدَّار الْآخِرَة حَتَّى صِرْتُمْ إِلَى الْمَقَابِر .</p></td></tr></table></body></html>
