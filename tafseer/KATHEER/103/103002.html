<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ</td></tr><tr><td align=right dir=rtl><p>فَأَقْسَمَ تَعَالَى بِذَلِكَ عَلَى أَنَّ الْإِنْسَان لَفِي خُسْر أَيْ فِي خَسَارَة وَهَلَاك .</p></td></tr></table></body></html>
