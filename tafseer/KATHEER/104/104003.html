<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ</td></tr><tr><td align=right dir=rtl><p>أَيْ يَظُنّ أَنَّ جَمْعه الْمَال يُخَلِّدهُ فِي هَذِهِ الدَّار " كَلَّا " أَيْ لَيْسَ الْأَمْر كَمَا زَعَمَ وَلَا كَمَا حَسِبَ . ثُمَّ .</p></td></tr></table></body></html>
