<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا لَيُنْبَذَنَّ فِي الْحُطَمَةِ</td></tr><tr><td align=right dir=rtl><p>أَيْ لَيُلْقَيَنَّ هَذَا الَّذِي جَمَعَ مَالًا فَعَدَّدَهُ فِي الْحُطَمَة , وَهِيَ اِسْم طَبَقَة مِنْ أَسْمَاء النَّار لِأَنَّهَا تُحَطِّم مَنْ فِيهَا .</p></td></tr></table></body></html>
