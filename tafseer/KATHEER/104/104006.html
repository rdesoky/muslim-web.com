<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَارُ اللَّهِ الْمُوقَدَةُ</td></tr><tr><td align=right dir=rtl><p>تَأْكُل كُلّ شَيْء مِنْ جَسَده حَتَّى إِذَا بَلَغَتْ فُؤَاده حَذْو حَلْقه تَرْجِع عَلَى جَسَده .</p></td></tr></table></body></html>
