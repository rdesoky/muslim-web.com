<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَمْ يَلِدْ وَلَمْ يُولَدْ</td></tr><tr><td align=right dir=rtl><p>وَقَالَ الْبَيْهَقِيّ نَحْو ذَلِكَ وَقَوْله تَعَالَى " لَمْ يَلِد وَلَمْ يُولَد " أَيْ لَيْسَ لَهُ وَلَد وَلَا وَالِد وَلَا صَاحِبَة .</p></td></tr></table></body></html>
