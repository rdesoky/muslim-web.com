<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير ابن كثير</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ شَرِّ مَا خَلَقَ</td></tr><tr><td align=right dir=rtl><p>وَقَوْله تَعَالَى " مِنْ شَرّ مَا خَلَقَ" أَيْ مِنْ شَرّ جَمِيع الْمَخْلُوقَات وَقَالَ ثَابِت الْبُنَانِيّ وَالْحَسَن الْبَصْرِيّ جَهَنَّم وَإِبْلِيس وَذُرِّيَّته مِمَّا خَلَقَ.</p></td></tr></table></body></html>
