<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ إِنَّ اللَّهَ مَعَ</font></td></tr><tr><td align=right dir=rtl><p>مَضَى الْقَوْل فِي مَعْنَى الِاسْتِعَانَة بِالصَّبْرِ وَالصَّلَاة , فَلَا مَعْنَى لِلْإِعَادَةِ .</p></td></tr></table></body></html>
