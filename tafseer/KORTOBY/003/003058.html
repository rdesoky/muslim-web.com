<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ نَتْلُوهُ عَلَيْكَ مِنَ الْآيَاتِ وَالذِّكْرِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>" ذَلِكَ " فِي مَوْضِع رَفْع بِالِابْتِدَاءِ وَخَبَره " نَتْلُوهُ " . وَيَجُوز : الْأَمْر ذَلِكَ , عَلَى إِضْمَار الْمُبْتَدَأ .</p></td></tr></table></body></html>
