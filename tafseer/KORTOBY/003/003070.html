<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَهْلَ الْكِتَابِ لِمَ تَكْفُرُونَ بِآيَاتِ اللَّهِ وَأَنْتُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِصِحَّةِ الْآيَات الَّتِي عِنْدكُمْ فِي كُتُبكُمْ ; عَنْ قَتَادَة وَالسُّدِّيّ . وَقِيلَ : الْمَعْنَى وَأَنْتُمْ تَشْهَدُونَ بِمِثْلِهَا مِنْ آيَات الْأَنْبِيَاء الَّتِي أَنْتُمْ مُقِرُّونَ بِهَا .</p></td></tr></table></body></html>
