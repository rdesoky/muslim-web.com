<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَا أَهْلَ الْكِتَابِ لِمَ تَلْبِسُونَ الْحَقَّ</font></td></tr><tr><td align=right dir=rtl><p>اللَّبْس الْخَلْط , وَقَدْ تَقَدَّمَ فِي الْبَقَرَة . وَمَعْنَى هَذِهِ الْآيَة وَاَلَّتِي قَبْلهَا مَعْنَى ذَلِكَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِالْبَاطِلِ وَتَكْتُمُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَيَجُوز " تَكْتُمُوا " عَلَى جَوَاب الِاسْتِفْهَام .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْحَقَّ وَأَنْتُمْ</font></td></tr><tr><td align=right dir=rtl><p>جُمْلَة فِي مَوْضِع الْحَال .</p></td></tr></table></body></html>
