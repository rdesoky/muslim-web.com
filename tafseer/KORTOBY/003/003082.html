<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ تَوَلَّى بَعْدَ ذَلِكَ فَأُولَئِكَ هُمُ الْفَاسِقُونَ</font></td></tr><tr><td align=right dir=rtl><p>" مَنْ " شَرْط . فَمَنْ تَوَلَّى مِنْ أُمَم الْأَنْبِيَاء عَنْ الْإِيمَان بَعْد أَخْذ الْمِيثَاق " فَأُولَئِكَ هُمْ الْفَاسِقُونَ " أَيْ الْخَارِجُونَ عَنْ الْإِيمَان . وَالْفَاسِق الْخَارِج . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
