<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ جَزَاؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ اللَّهِ وَالْمَلَائِكَةِ وَالنَّاسِ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنْ دَامُوا عَلَى كُفْرهمْ . وَقَدْ تَقَدَّمَ مَعْنَى لَعْنَة اللَّه وَالنَّاس فِي " الْبَقَرَة " فَلَا مَعْنَى لِإِعَادَتِهِ .</p></td></tr></table></body></html>
