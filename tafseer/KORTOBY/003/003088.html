<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ الْعَذَابُ وَلَا هُمْ يُنْظَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يُؤَخَّرُونَ وَلَا يُؤَجَّلُونَ .</p></td></tr></table></body></html>
