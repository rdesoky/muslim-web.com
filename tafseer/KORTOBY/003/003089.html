<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا الَّذِينَ تَابُوا مِنْ بَعْدِ ذَلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>هُوَ الْحَارِث بْن سُوَيْد كَمَا تَقَدَّمَ . وَيَدْخُل فِي الْآيَة بِالْمَعْنَى كُلّ مَنْ رَاجَعَ الْإِسْلَام وَأَخْلَصَ .</p></td></tr></table></body></html>
