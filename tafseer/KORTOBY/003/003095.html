<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ صَدَقَ اللَّهُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قُلْ يَا مُحَمَّد صَدَقَ اللَّه . إِنَّهُ لَمْ يَكُنْ ذَلِكَ فِي التَّوْرَاة مُحَرَّمًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّبِعُوا مِلَّةَ إِبْرَاهِيمَ حَنِيفًا</font></td></tr><tr><td align=right dir=rtl><p>أَمْر بِاتِّبَاعِ دِينه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ مِنَ الْمُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p>رَدّ عَلَيْهِمْ فِي دَعْوَاهُمْ الْبَاطِل كَمَا تَقَدَّمَ .</p></td></tr></table></body></html>
