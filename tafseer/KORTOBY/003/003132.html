<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَطِيعُوا اللَّهَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَطِيعُوا اللَّه فِي الْفَرَائِض</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَالرَّسُولَ</font></td></tr><tr><td align=right dir=rtl><p>فِي السُّنَن : وَقِيلَ : " أَطِيعُوا اللَّه " فِي تَحْرِيم الرِّبَا " وَالرَّسُول " فِيمَا بَلَّغَكُمْ مِنْ التَّحْرِيم .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَعَلَّكُمْ تُرْحَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَيْ يَرْحَمكُمْ اللَّه . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
