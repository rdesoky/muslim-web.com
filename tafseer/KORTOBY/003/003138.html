<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا بَيَانٌ لِلنَّاسِ وَهُدًى وَمَوْعِظَةٌ لِلْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن , عَنْ الْحَسَن وَغَيْره . وَقِيلَ : هَذَا إِشَارَة إِلَى قَوْله : " قَدْ خَلَتْ مِنْ قَبْلكُمْ سُنَن " . وَالْمَوْعِظَة الْوَعْظ . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
