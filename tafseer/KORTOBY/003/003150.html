<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلِ اللَّهُ مَوْلَاكُمْ وَهُوَ خَيْرُ النَّاصِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُتَوَلِّي نَصْركُمْ وَحِفْظكُمْ إِنْ أَطَعْتُمُوهُ . وَقُرِئَ " بَلْ اللَّه " بِالنَّصْبِ , عَلَى تَقْدِير بَلْ وَأَطِيعُوا اللَّه مَوْلَاكُمْ .</p></td></tr></table></body></html>
