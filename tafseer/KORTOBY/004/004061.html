<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَى مَا أَنْزَلَ اللَّهُ وَإِلَى الرَّسُولِ رَأَيْتَ الْمُنَافِقِينَ يَصُدُّونَ عَنْكَ صُدُودًا</font></td></tr><tr><td align=right dir=rtl><p>" صُدُودًا " اِسْم لِلْمَصْدَرِ عِنْد الْخَلِيل , وَالْمَصْدَر الصَّدّ . وَالْكُوفِيُّونَ يَقُولُونَ : هُمَا مَصْدَرَانِ .</p></td></tr></table></body></html>
