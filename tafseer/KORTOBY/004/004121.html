<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ مَأْوَاهُمْ جَهَنَّمُ وَلَا يَجِدُونَ عَنْهَا مَحِيصًا</font></td></tr><tr><td align=right dir=rtl><p>" أُولَئِكَ " اِبْتِدَاء " مَأْوَاهُمْ " اِبْتِدَاء ثَانٍ " جَهَنَّم " خَبَر الثَّانِي وَالْجُمْلَة خَبَر الْأَوَّل . و " مَحِيصًا " مَلْجَأ , وَالْفِعْل مِنْهُ حَاصَ يَحِيص .</p></td></tr></table></body></html>
