<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَرَى كَثِيرًا مِنْهُمْ يُسَارِعُونَ فِي الْإِثْمِ وَالْعُدْوَانِ وَأَكْلِهِمُ السُّحْتَ لَبِئْسَ مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي مِنْ الْيَهُود . " يُسَارِعُونَ فِي الْإِثْم وَالْعُدْوَان " أَيْ يُسَابِقُونَ فِي الْمَعَاصِي وَالظُّلْم " وَأَكْلهمْ السُّحْت لَبِئْسَ مَا كَانُوا يَعْمَلُونَ "</p></td></tr></table></body></html>
