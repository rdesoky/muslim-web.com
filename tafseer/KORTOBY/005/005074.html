<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَتُوبُونَ إِلَى اللَّهِ وَيَسْتَغْفِرُونَهُ وَاللَّهُ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>تَقْرِير وَتَوْبِيخ . أَيْ فَلْيَتُوبُوا إِلَيْهِ وَلْيَسْأَلُوهُ سَتْر ذُنُوبهمْ ; وَالْمُرَاد الْكَفَرَة مِنْهُمْ , وَإِنَّمَا خُصَّ الْكَفَرَة بِالذِّكْرِ لِأَنَّهُمْ الْقَائِلُونَ بِذَلِكَ دُون الْمُؤْمِنِينَ .</p></td></tr></table></body></html>
