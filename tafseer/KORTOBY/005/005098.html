<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ</font></td></tr><tr><td align=right dir=rtl><p>تَخْوِيف</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ اللَّهَ غَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>تَرْجِيَة , وَقَدْ تَقَدَّمَ هَذَا الْمَعْنَى .</p></td></tr></table></body></html>
