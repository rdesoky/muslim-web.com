<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنِّي أَخَافُ إِنْ عَصَيْتُ رَبِّي عَذَابَ يَوْمٍ عَظِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِعِبَادَةِ غَيْره أَنْ يُعَذِّبنِي , وَالْخَوْف تَوَقُّع الْمَكْرُوه . قَالَ اِبْن عَبَّاس : " أَخَاف " هُنَا بِمَعْنَى أَعْلَم .</p></td></tr></table></body></html>
