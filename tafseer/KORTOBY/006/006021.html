<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ أَظْلَمُ</font></td></tr><tr><td align=right dir=rtl><p>اِبْتِدَاء وَخَبَر أَيْ لَا أَحَد أَظْلَم</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِمَّنِ افْتَرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِخْتَلَقَ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>عَلَى اللَّهِ كَذِبًا أَوْ كَذَّبَ بِآيَاتِهِ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد الْقُرْآن وَالْمُعْجِزَات .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ لَا يُفْلِحُ الظَّالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ : مَعْنَاهُ فِي الدُّنْيَا .</p></td></tr></table></body></html>
