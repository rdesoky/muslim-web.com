<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْقُرْآنِ وَالْمُعْجِزَات . وَقِيلَ : بِمُحَمَّدٍ عَلَيْهِ الصَّلَاة وَالسَّلَام .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>يَمَسُّهُمُ الْعَذَابُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُصِيبهُمْ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِمَا كَانُوا يَفْسُقُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَكْفُرُونَ .</p></td></tr></table></body></html>
