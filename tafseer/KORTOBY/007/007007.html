<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَنَقُصَّنَّ عَلَيْهِمْ بِعِلْمٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : يَنْطِق عَلَيْهِمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كُنَّا غَائِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كُنَّا شَاهِدِينَ لِأَعْمَالِهِمْ . وَدَلَّتْ الْآيَة عَلَى أَنَّ اللَّه تَعَالَى عَالِمٌ بِعِلْمٍ .</p></td></tr></table></body></html>
