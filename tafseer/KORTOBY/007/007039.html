<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَتْ أُولَاهُمْ لِأُخْرَاهُمْ فَمَا كَانَ لَكُمْ عَلَيْنَا مِنْ فَضْلٍ فَذُوقُوا الْعَذَابَ بِمَا كُنْتُمْ تَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَدْ كَفَرْتُمْ وَفَعَلْتُمْ كَمَا فَعَلْنَا , فَلَيْسَ تَسْتَحِقُّونَ تَخْفِيفًا مِنْ الْعَذَاب</p></td></tr></table></body></html>
