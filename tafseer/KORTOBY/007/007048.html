<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَادَى أَصْحَابُ الْأَعْرَافِ رِجَالًا يَعْرِفُونَهُمْ بِسِيمَاهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ أَهْل النَّار .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا مَا أَغْنَى عَنْكُمْ جَمْعُكُمْ وَمَا كُنْتُمْ تَسْتَكْبِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِلدُّنْيَا وَاسْتِكْبَاركُمْ عَنْ الْإِيمَان .</p></td></tr></table></body></html>
