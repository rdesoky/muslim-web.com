<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا قَوْمِ لَيْسَ بِي ضَلَالَةٌ وَلَكِنِّي رَسُولٌ مِنْ رَبِّ</font></td></tr><tr><td align=right dir=rtl><p>وَالضَّلَال وَالضَّلَالَة : الْعُدُول عَنْ طَرِيق الْحَقّ , وَالذَّهَاب عَنْهُ . أَيْ إِنَّا لَنَرَاك فِي دُعَائِنَا إِلَى إِلَه وَاحِد فِي ضَلَال عَنْ الْحَقّ .</p></td></tr></table></body></html>
