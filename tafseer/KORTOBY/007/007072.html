<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْجَيْنَاهُ وَالَّذِينَ مَعَهُ بِرَحْمَةٍ مِنَّا وَقَطَعْنَا دَابِرَ الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَمَا كَانُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>" دَابِر " آخِر . وَقَدْ تَقَدَّمَ أَيْ لَمْ يَبْقَ لَهُمْ بَقِيَّة .</p></td></tr></table></body></html>
