<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَالُوا لِمَنْ دُونهمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَئِنِ اتَّبَعْتُمْ شُعَيْبًا إِنَّكُمْ إِذًا لَخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَالِكُونَ .</p></td></tr></table></body></html>
