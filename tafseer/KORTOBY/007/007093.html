<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَوَلَّى عَنْهُمْ وَقَالَ يَا قَوْمِ لَقَدْ أَبْلَغْتُكُمْ رِسَالَاتِ رَبِّي وَنَصَحْتُ لَكُمْ فَكَيْفَ آسَى عَلَى قَوْمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَحْزَن . أَسَيْت عَلَى الشَّيْء آسَى أَسًى , وَأَنَا آسٍ .</p></td></tr></table></body></html>
