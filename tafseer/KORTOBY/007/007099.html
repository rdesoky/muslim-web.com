<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَأَمِنُوا مَكْرَ اللَّهِ فَلَا يَأْمَنُ مَكْرَ اللَّهِ إِلَّا الْقَوْمُ الْخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَذَابه وَجَزَاءَهُ عَلَى مَكْرهمْ . وَقِيلَ : مَكْره اِسْتِدْرَاجه بِالنِّعْمَةِ وَالصِّحَّة .</p></td></tr></table></body></html>
