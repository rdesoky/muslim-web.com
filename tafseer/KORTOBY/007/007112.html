<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَأْتُوكَ بِكُلِّ سَاحِرٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>جَزْم ; لِأَنَّهُ جَوَاب الْأَمْر وَلِذَلِكَ حُذِفَتْ مِنْهُ النُّون . قَرَأَ أَهْل الْكُوفَة إِلَّا عَاصِمًا " بِكُلِّ سَحَّار " وَقَرَأَ سَائِر النَّاس " سَاحِر " وَهُمَا مُتَقَارِبَانِ ; إِلَّا أَنَّ فَعَّالًا أَشَدّ مُبَالَغَة .</p></td></tr></table></body></html>
