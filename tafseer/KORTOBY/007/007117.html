<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَوْحَيْنَا إِلَى مُوسَى أَنْ أَلْقِ عَصَاكَ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا يَكْذِبُونَ , لِأَنَّهُمْ جَاءُوا بِحِبَالٍ وَجَعَلُوا فِيهَا زِئْبَقًا حَتَّى تَحَرَّكَتْ .</p></td></tr></table></body></html>
