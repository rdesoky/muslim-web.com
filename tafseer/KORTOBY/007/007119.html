<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَغُلِبُوا هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>نَصْب عَلَى الْحَال . وَالْفِعْل مِنْهُ صَغِرَ يَصْغَر صَغَرًا وَصِغَرًا وَصَغَارًا . أَيْ اِنْقَلَبَ قَوْم فِرْعَوْن وَفِرْعَوْن مَعَهُمْ أَذِلَّاء مَقْهُورِينَ مَغْلُوبِينَ .</p></td></tr></table></body></html>
