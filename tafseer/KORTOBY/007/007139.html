<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَؤُلَاءِ مُتَبَّرٌ مَا هُمْ فِيهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُهْلَكٌ , وَالتَّبَار : الْهَلَاك . وَكُلّ إِنَاء مُكَسَّر مُتَبَّرٌ . وَأَمْر مُتَبَّر . أَيْ إِنَّ الْعَابِد وَالْمَعْبُود مُهْلَكَانِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَبَاطِلٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ذَاهِب مُضْمَحِلّ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>" كَانُوا " صِلَة زَائِدَة .</p></td></tr></table></body></html>
