<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ عَمِلُوا السَّيِّئَاتِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْكُفْر وَالْمَعَاصِي .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ تَابُوا مِنْ بَعْدِهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ بَعْد فِعْلِهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَآمَنُوا إِنَّ رَبَّكَ مِنْ بَعْدِهَا لَغَفُورٌ رَحِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ بَعْد التَّوْبَة</p></td></tr></table></body></html>
