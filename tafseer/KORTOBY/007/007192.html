<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَسْتَطِيعُونَ لَهُمْ نَصْرًا وَلَا أَنْفُسَهُمْ يَنْصُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّ الْأَصْنَام , لَا تَنْصُر وَلَا تَنْتَصِر .</p></td></tr></table></body></html>
