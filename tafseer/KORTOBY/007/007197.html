<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ تَدْعُونَ مِنْ دُونِهِ لَا يَسْتَطِيعُونَ نَصْرَكُمْ وَلَا أَنْفُسَهُمْ يَنْصُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>كَرَّرَهُ لَيُبَيِّنَ أَنَّ مَا يَعْبُدُونَهُ لَا يَنْفَع وَلَا يَضُرّ .</p></td></tr></table></body></html>
