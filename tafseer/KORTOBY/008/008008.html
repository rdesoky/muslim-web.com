<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيُحِقَّ الْحَقَّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُظْهِر دِين الْإِسْلَام وَيُعِزّهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَيُبْطِلَ الْبَاطِلَ وَلَوْ كَرِهَ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْكُفْر . وَإِبْطَاله إِعْدَامه ; كَمَا أَنَّ إِحْقَاقَ الْحَقّ إِظْهَاره " بَلْ نَقْذِف بِالْحَقِّ عَلَى الْبَاطِل فَيَدْمَغهُ فَإِذَا هُوَ زَاهِق " [ الْأَنْبِيَاء : 18 ] .</p></td></tr></table></body></html>
