<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا النَّصْرُ إِلَّا مِنْ عِنْدِ اللَّهِ</font></td></tr><tr><td align=right dir=rtl><p>نَبَّهَ عَلَى أَنَّ النَّصْرَ مِنْ عِنْده جَلَّ وَعَزَّ لَا مِنْ الْمَلَائِكَة ; أَيْ لَوْلَا نَصْره لَمَا اِنْتَفَعَ بِكَثْرَةِ الْعَدَد بِالْمَلَائِكَةِ . وَالنَّصْر مِنْ عِنْد اللَّه يَكُون بِالسَّيْفِ وَيَكُون بِالْحُجَّةِ .</p></td></tr></table></body></html>
