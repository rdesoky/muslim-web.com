<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ بِأَنَّهُمْ شَاقُّوا اللَّهَ</font></td></tr><tr><td align=right dir=rtl><p>" ذَلِكَ " فِي مَوْضِع رَفْع عَلَى الِابْتِدَاء , وَالتَّقْدِير : ذَلِكَ الْأَمْر , أَوْ الْأَمْر ذَلِكَ . " شَاقُّوا اللَّهَ " أَيْ أَوْلِيَاءَهُ . وَالشِّقَاق : أَنْ يَصِيرَ كُلّ وَاحِد فِي شِقّ . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
