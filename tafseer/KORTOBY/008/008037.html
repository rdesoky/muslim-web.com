<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِيَمِيزَ اللَّهُ الْخَبِيثَ مِنَ الطَّيِّبِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمُؤْمِن مِنْ الْكَافِر . وَقِيلَ : هُوَ عَامّ فِي كُلّ شَيْء , مِنْ الْأَعْمَال وَالنَّفَقَات وَغَيْر ذَلِكَ .</p></td></tr></table></body></html>
