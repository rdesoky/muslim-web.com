<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُبَشِّرُهُمْ رَبُّهُمْ بِرَحْمَةٍ مِنْهُ وَرِضْوَانٍ وَجَنَّاتٍ لَهُمْ فِيهَا نَعِيمٌ مُقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>" يُبَشِّرهُمْ رَبّهمْ " أَيْ يُعْلِمهُمْ فِي الدُّنْيَا مَا لَهُمْ فِي الْآخِرَة مِنْ الثَّوَاب الْجَزِيل وَالنَّعِيم الْمُقِيم . وَالنَّعِيم : لِين الْعَيْش وَرَغَده .</p></td></tr></table></body></html>
