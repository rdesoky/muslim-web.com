<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا أَبَدًا</font></td></tr><tr><td align=right dir=rtl><p>نُصِبَ عَلَى الْحَال . وَالْخُلُود الْإِقَامَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ عِنْدَهُ أَجْرٌ عَظِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَعَدَّ لَهُمْ فِي دَار كَرَامَته ذَلِكَ الثَّوَاب .</p></td></tr></table></body></html>
