<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ يَعْلَمُوا أَنَّ اللَّهَ يَعْلَمُ سِرَّهُمْ وَنَجْوَاهُمْ وَأَنَّ اللَّهَ عَلَّامُ الْغُيُوبِ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا تَوْبِيخ , وَإِذَا كَانَ عَالِمًا فَإِنَّهُ سَيُجَازِيهِمْ .</p></td></tr></table></body></html>
