<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ شَكّ وَرَيْب وَنِفَاق . وَقَدْ تَقَدَّمَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَزَادَتْهُمْ رِجْسًا إِلَى رِجْسِهِمْ وَمَاتُوا وَهُمْ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ شَكًّا إِلَى شَكّهمْ وَكُفْرًا إِلَى كُفْرهمْ . وَقَالَ مُقَاتِل : إِثْمًا إِلَى إِثْمهمْ ; وَالْمَعْنَى مُتَقَارِب</p></td></tr></table></body></html>
