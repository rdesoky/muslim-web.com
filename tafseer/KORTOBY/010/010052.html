<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ قِيلَ لِلَّذِينَ ظَلَمُوا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَقُول لَهُمْ خَزَنَة جَهَنَّم .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ذُوقُوا عَذَابَ الْخُلْدِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّذِي لَا يَنْقَطِع .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>هَلْ تُجْزَوْنَ إِلَّا بِمَا كُنْتُمْ تَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جَزَاء كُفْركُمْ .</p></td></tr></table></body></html>
