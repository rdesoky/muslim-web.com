<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَخْتَلِقُونَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَا يُفْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَفُوزُونَ وَلَا يَأْمَنُونَ ; وَتَمَّ الْكَلَام .</p></td></tr></table></body></html>
