<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ فِرْعَوْنُ ائْتُونِي بِكُلِّ سَاحِرٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>إِنَّمَا قَالَهُ لَمَّا رَأَى الْعَصَا وَالْيَد الْبَيْضَاء وَاعْتَقَدَ أَنَّهُمَا سِحْر . وَقَرَأَ حَمْزَة وَالْكِسَائِيّ وَابْن وَثَّاب وَالْأَعْمَش " سَحَّار " وَقَدْ تَقَدَّمَ فِي الْأَعْرَاف الْقَوْل فِيهِمَا .</p></td></tr></table></body></html>
