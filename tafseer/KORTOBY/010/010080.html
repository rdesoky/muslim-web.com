<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَ السَّحَرَةُ قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِطْرَحُوا عَلَى الْأَرْض مَا مَعَكُمْ مِنْ حِبَالكُمْ وَعِصِيّكُمْ . وَقَدْ تَقَدَّمَ فِي الْأَعْرَاف الْقَوْل فِي هَذَا مُسْتَوْفًى .</p></td></tr></table></body></html>
