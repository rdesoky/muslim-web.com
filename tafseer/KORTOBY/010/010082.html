<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُحِقُّ اللَّهُ الْحَقَّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُبَيِّنهُ وَيُوَضِّحهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِكَلِمَاتِهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِكَلَامِهِ وَحُجَجه وَبَرَاهِينه . وَقِيلَ : بِعِدَاتِهِ بِالنَّصْرِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ كَرِهَ الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ آل فِرْعَوْن .</p></td></tr></table></body></html>
