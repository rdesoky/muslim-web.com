<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَجِّنَا بِرَحْمَتِكَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ خَلِّصْنَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِنَ الْقَوْمِ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ فِرْعَوْن وَقَوْمه لِأَنَّهُمْ كَانُوا يَأْخُذُونَهُمْ بِالْأَعْمَالِ الشَّاقَّة .</p></td></tr></table></body></html>
