<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الَّذِينَ حَقَّتْ عَلَيْهِمْ كَلِمَةُ رَبِّكَ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ الْقَوْل فِيهِ فِي هَذِهِ السُّورَة . قَالَ قَتَادَة : أَيْ الَّذِينَ حَقَّ عَلَيْهِمْ غَضَب اللَّه وَسَخَطه بِمَعْصِيَتِهِمْ لَا يُؤْمِنُونَ .</p></td></tr></table></body></html>
