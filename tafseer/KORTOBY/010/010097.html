<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ جَاءَتْهُمْ كُلُّ آيَةٍ</font></td></tr><tr><td align=right dir=rtl><p>أَنَّثَ " كُلًّا " عَلَى الْمَعْنَى ; أَيْ وَلَوْ جَاءَتْهُمْ الْآيَات .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>حَتَّى يَرَوُا الْعَذَابَ الْأَلِيمَ</font></td></tr><tr><td align=right dir=rtl><p>فَحِينَئِذٍ يُؤْمِنُونَ وَلَا يَنْفَعهُمْ .</p></td></tr></table></body></html>
