<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ</font></td></tr><tr><td align=right dir=rtl><p>اِبْتِدَاء وَخَبَر .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ضَاعَ عَنْهُمْ اِفْتِرَاؤُهُمْ وَتَلِفَ .</p></td></tr></table></body></html>
