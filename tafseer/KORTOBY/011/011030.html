<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَا قَوْمِ مَنْ يَنْصُرُنِي مِنَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الْفَرَّاء : أَيْ يَمْنَعنِي مِنْ عَذَابه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>اللَّهِ إِنْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِأَجْلِ إِيمَانهمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>طَرَدْتُهُمْ أَفَلَا</font></td></tr><tr><td align=right dir=rtl><p>أُدْغِمَتْ التَّاء فِي الذَّال . وَيَجُوز حَذْفهَا فَتَقُول : تَذَكَّرُونَ .</p></td></tr></table></body></html>
