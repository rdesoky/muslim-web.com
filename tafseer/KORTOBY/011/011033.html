<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّمَا يَأْتِيكُمْ بِهِ اللَّهُ إِنْ شَاءَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنْ أَرَادَ إِهْلَاككُمْ عَذَّبَكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِفَائِتِينَ . وَقِيلَ : بِغَالِبِينَ بِكَثْرَتِكُمْ ; لِأَنَّهُمْ أُعْجِبُوا بِذَلِكَ ; كَانُوا مَلَئُوا الْأَرْض سَهْلًا وَجَبَلًا عَلَى مَا يَأْتِي .</p></td></tr></table></body></html>
