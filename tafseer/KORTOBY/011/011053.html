<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا هُودُ مَا جِئْتَنَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ حُجَّة وَاضِحَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قَوْلِكَ وَمَا نَحْنُ لَكَ</font></td></tr><tr><td align=right dir=rtl><p>إِصْرَارًا مِنْهُمْ عَلَى الْكُفْر .</p></td></tr></table></body></html>
