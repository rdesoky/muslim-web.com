<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَطَاءً غَيْرَ مَجْذُوذٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ غَيْر مَقْطُوع ; مِنْ جَذَّهُ يَجُذّهُ أَيْ قَطَعَهُ ; قَالَ النَّابِغَة : <poem type=2><part>تَجُذّ السَّلُوقِيّ الْمُضَاعَف نَسْجه </part><part>وَتُوقِد بِالصُّفَّاحِ نَار الْحُبَاحِب</part></poem></p></td></tr></table></body></html>
