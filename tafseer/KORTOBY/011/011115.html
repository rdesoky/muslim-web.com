<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاصْبِرْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَلَى الصَّلَاة ; كَقَوْلِهِ : " وَأْمُرْ أَهْلك بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا " [ طَه : 132 ] . وَقِيلَ : الْمَعْنَى وَاصْبِرْ يَا مُحَمَّد عَلَى مَا تَلْقَى مِنْ الْأَذَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْمُصَلِّينَ .</p></td></tr></table></body></html>
