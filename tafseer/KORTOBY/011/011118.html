<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ شَاءَ رَبُّكَ لَجَعَلَ النَّاسَ أُمَّةً وَاحِدَةً</font></td></tr><tr><td align=right dir=rtl><p>قَالَ سَعِيد بْن جُبَيْر : عَلَى مِلَّة الْإِسْلَام وَحْدهَا . وَقَالَ الضَّحَّاك : أَهْل دِين وَاحِد , أَهْل ضَلَالَة أَوْ أَهْل هُدًى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَزَالُونَ مُخْتَلِفِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَلَى أَدْيَان شَتَّى ; قَالَهُ مُجَاهِد وَقَتَادَة .</p></td></tr></table></body></html>
