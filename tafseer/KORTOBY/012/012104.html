<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا تَسْأَلُهُمْ عَلَيْهِ مِنْ أَجْرٍ</font></td></tr><tr><td align=right dir=rtl><p>" مِنْ " صِلَة ; أَيْ مَا تَسْأَلهُمْ جَعْلًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هُوَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا هُوَ ; يَعْنِي الْقُرْآن وَالْوَحْي .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا ذِكْرٌ لِلْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عِظَة وَتَذْكِرَة " لِلْعَالَمِينَ " .</p></td></tr></table></body></html>
