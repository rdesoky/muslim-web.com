<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى إِنْ تَكْفُرُوا أَنْتُمْ وَمَنْ فِي الْأَرْضِ جَمِيعًا فَإِنَّ اللَّهَ لَغَنِيٌّ حَمِيدٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَلْحَقهُ بِذَلِكَ نَقْص , بَلْ هُوَ الْغَنِيّ . ( الْحَمِيد ) أَيْ الْمَحْمُود .</p></td></tr></table></body></html>
