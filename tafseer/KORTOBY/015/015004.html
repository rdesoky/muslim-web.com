<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا وَلَهَا كِتَابٌ مَعْلُومٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَجَل مُؤَقَّت كُتِبَ لَهُمْ فِي اللَّوْح الْمَحْفُوظ .</p></td></tr></table></body></html>
