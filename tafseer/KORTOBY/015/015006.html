<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالُوا يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ إِنَّكَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَهُ كُفَّار قُرَيْش لِمُحَمَّدٍ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ عَلَى جِهَة الِاسْتِهْزَاء .</p></td></tr></table></body></html>
