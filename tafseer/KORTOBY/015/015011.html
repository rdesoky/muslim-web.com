<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يَأْتِيهِمْ مِنْ رَسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p>تَسْلِيَة لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ ; أَيْ كَمَا فَعَلَ بِك هَؤُلَاءِ الْمُشْرِكُونَ فَكَذَلِكَ فُعِلَ بِمَنْ قَبْلك مِنْ الرُّسُل .</p></td></tr></table></body></html>
