<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَدْ خَلَتْ سُنَّةُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَضَتْ سُنَّة اللَّه بِإِهْلَاكِ الْكُفَّار , فَمَا أَقْرَب هَؤُلَاءِ مِنْ الْهَلَاك . وَقِيلَ : " خَلَتْ سُنَّة الْأَوَّلِينَ " بِمِثْلِ مَا فَعَلَ هَؤُلَاءِ مِنْ التَّكْذِيب وَالْكُفْر , فَهُمْ يَقْتَدُونَ بِأُولَئِكَ .</p></td></tr></table></body></html>
