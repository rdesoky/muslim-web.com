<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ هُوَ يَحْشُرُهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِلْحِسَابِ وَالْجَزَاء .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ حَكِيمٌ عَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>يَضَع كُلّ شَيْء مَوْضِعه</p></td></tr></table></body></html>
