<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَمَسُّهُمْ فِيهَا نَصَبٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِعْيَاء وَتَعَب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُمْ مِنْهَا بِمُخْرَجِينَ</font></td></tr><tr><td align=right dir=rtl><p>دَلِيل عَلَى أَنَّ نَعِيم الْجَنَّة دَائِم لَا يَزُول , وَأَنَّ أَهْلهَا فِيهَا بَاقُونَ . أُكُلهَا دَائِم ; " إِنَّ هَذَا لَرِزْقنَا مَا لَهُ مِنْ نَفَاد " [ ص : 54 ] .</p></td></tr></table></body></html>
