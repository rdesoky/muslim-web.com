<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَا تَوْجَلْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَالَتْ الْمَلَائِكَة لَا تَخَفْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نُبَشِّرُكَ بِغُلَامٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ حَلِيم ; قَالَهُ مُقَاتِل . وَقَالَ الْجُمْهُور : عَالِم . وَهُوَ إِسْحَاق .</p></td></tr></table></body></html>
