<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا آلَ لُوطٍ</font></td></tr><tr><td align=right dir=rtl><p>أَتْبَاعه وَأَهْل دِينه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا لَمُنَجُّوهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَرَأَ حَمْزَة وَالْكِسَائِيّ " لَمُنْجُوهُمْ " بِالتَّخْفِيفِ مِنْ أَنْجَى . الْبَاقُونَ : بِالتَّشْدِيدِ مِنْ نَجَّى , وَاخْتَارَهُ أَبُو عُبَيْد وَأَبُو حَاتِم . وَالتَّنْجِيَة وَالْإِنْجَاء التَّخْلِيص .</p></td></tr></table></body></html>
