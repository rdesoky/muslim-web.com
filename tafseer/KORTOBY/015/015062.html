<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّكُمْ قَوْمٌ مُنْكَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا أَعْرِفكُمْ . وَقِيلَ : كَانُوا شَبَابًا وَرَأَى جَمَالًا فَخَافَ عَلَيْهِمْ مِنْ فِتْنَة قَوْمه ; فَهَذَا هُوَ الْإِنْكَار .</p></td></tr></table></body></html>
