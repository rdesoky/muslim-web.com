<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءَ أَهْلُ الْمَدِينَةِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَهْل مَدِينَة لُوط</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>يَسْتَبْشِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>مُسْتَبْشِرِينَ بِالْأَضْيَافِ طَمَعًا مِنْهُمْ فِي رُكُوب الْفَاحِشَة .</p></td></tr></table></body></html>
