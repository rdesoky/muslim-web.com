<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّقُوا اللَّهَ وَلَا تُخْزُونِ</font></td></tr><tr><td align=right dir=rtl><p>يَجُوز أَنْ يَكُون مِنْ الْخِزْي وَهُوَ الذُّلّ وَالْهَوَان , وَيَجُوز أَنْ يَكُون مِنْ الْخَزَايَة وَهُوَ الْحَيَاء وَالْخَجَل . وَقَدْ تَقَدَّمَ فِي هُود .</p></td></tr></table></body></html>
