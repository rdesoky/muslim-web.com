<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ هَؤُلَاءِ بَنَاتِي إِنْ كُنْتُمْ فَاعِلِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَتَزَوَّجُوهُنَّ وَلَا تَرْكَنُوا إِلَى الْحَرَام . وَقَدْ تَقَدَّمَ بَيَان هَذَا فِي هُود .</p></td></tr></table></body></html>
