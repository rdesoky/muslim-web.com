<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ الْخَلَّاقُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمُقَدِّر لِلْخَلْقِ وَالْأَخْلَاق .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p>بِأَهْلِ الْوِفَاق وَالنِّفَاق .</p></td></tr></table></body></html>
