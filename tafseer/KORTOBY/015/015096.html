<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يَجْعَلُونَ مَعَ اللَّهِ إِلَهًا آخَرَ فَسَوْفَ يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>هَذِهِ صِفَة الْمُسْتَهْزِئِينَ . وَقِيلَ : هُوَ اِبْتِدَاء وَخَبَره " فَسَوْفَ يَعْلَمُونَ " .</p></td></tr></table></body></html>
