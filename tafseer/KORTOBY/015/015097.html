<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَلْبك ; لِأَنَّ الصَّدْر مَحَلّ الْقَلْب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِمَا يَقُولُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِمَا تَسْمَعهُ مِنْ تَكْذِيبك وَرَدّ قَوْلك , وَتَنَالهُ . وَيَنَالهُ أَصْحَابك مِنْ أَعْدَائِك .</p></td></tr></table></body></html>
