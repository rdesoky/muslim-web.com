<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ يَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا تُبْطِنُونَهُ وَمَا تُظْهِرُونَهُ . وَقَدْ تَقَدَّمَ جَمِيع هَذَا مُسْتَوْفًى</p></td></tr></table></body></html>
