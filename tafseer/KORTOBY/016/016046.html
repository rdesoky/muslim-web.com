<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَوْ يَأْخُذَهُمْ فِي تَقَلُّبِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي أَسْفَارهمْ وَتَصَرُّفهمْ ; قَالَهُ قَتَادَة . وَقِيلَ : " فِي تَقَلُّبهمْ " عَلَى فِرَاشهمْ أَيْنَمَا كَانُوا . وَقَالَ الضَّحَّاك : بِاللَّيْلِ وَالنَّهَار .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَمَا هُمْ بِمُعْجِزِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُسَابِقِينَ اللَّه وَلَا فَائِتِيهِ .</p></td></tr></table></body></html>
