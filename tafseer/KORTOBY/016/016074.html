<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ إِنَّ اللَّهَ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا تُشَبِّهُوا بِهِ هَذِهِ الْجَمَادَات ; لِأَنَّهُ وَاحِد قَادِر لَا مِثْل لَهُ . وَقَدْ تَقَدَّمَ</p></td></tr></table></body></html>
