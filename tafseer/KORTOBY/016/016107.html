<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ذَلِكَ الْغَضَب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِأَنَّهُمُ اسْتَحَبُّوا الْحَيَاةَ الدُّنْيَا عَلَى الْآخِرَةِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِخْتَارُوهَا عَلَى الْآخِرَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>" أَنَّ " فِي مَوْضِع خَفْض عَطْفًا عَلَى " بِأَنَّهُمْ "</p></td></tr></table></body></html>
