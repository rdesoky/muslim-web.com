<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الَّذِينَ طَبَعَ اللَّهُ عَلَى قُلُوبِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَنْ فَهْم الْمَوَاعِظ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَسَمْعِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>عَنْ كَلَام اللَّه تَعَالَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَبْصَارِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>عَنْ النَّظَر فِي الْآيَات .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأُولَئِكَ هُمُ الْغَافِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>عَمَّا يُرَاد بِهِمْ .</p></td></tr></table></body></html>
