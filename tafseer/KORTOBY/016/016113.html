<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ جَاءَهُمْ رَسُولٌ مِنْهُمْ فَكَذَّبُوهُ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا يَدُلّ عَلَى أَنَّهَا مَكَّة . وَهُوَ قَوْل اِبْن عَبَّاس وَمُجَاهِد وَقَتَادَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذَهُمُ الْعَذَابُ وَهُمْ ظَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ الْجُوع الَّذِي وَقَعَ بِمَكَّة . وَقِيلَ : الشَّدَائِد وَالْجُوع مِنْهَا .</p></td></tr></table></body></html>
