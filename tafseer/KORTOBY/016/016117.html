<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَتَاعٌ قَلِيلٌ وَلَهُمْ عَذَابٌ أَلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا هُمْ فِيهِ مِنْ نَعِيم الدُّنْيَا يَزُول عَنْ قَرِيب . وَقَالَ الزَّجَّاج : أَيْ مَتَاعهمْ مَتَاع قَلِيل . وَقِيلَ : لَهُمْ مَتَاع قَلِيل ثُمَّ يُرَدُّونَ إِلَى عَذَاب أَلِيم .</p></td></tr></table></body></html>
