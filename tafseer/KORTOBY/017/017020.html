<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُلًّا نُمِدُّ هَؤُلَاءِ وَهَؤُلَاءِ مِنْ عَطَاءِ رَبِّكَ</font></td></tr><tr><td align=right dir=rtl><p>أَعْلَمَ أَنَّهُ يَرْزُق الْمُؤْمِنِينَ وَالْكَافِرِينَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ عَطَاءُ رَبِّكَ مَحْظُورًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَحْبُوسًا مَمْنُوعًا ; مِنْ حَظَرَ يَحْظُر حَظْرًا وَحِظَارًا .</p></td></tr></table></body></html>
