<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَجْعَلْ مَعَ اللَّهِ إِلَهًا آخَرَ</font></td></tr><tr><td align=right dir=rtl><p>الْخِطَاب لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَالْمُرَاد أُمَّته . وَقِيلَ : الْخِطَاب لِلْإِنْسَانِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَتَقْعُدَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَبْقَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مَذْمُومًا مَخْذُولًا</font></td></tr><tr><td align=right dir=rtl><p>لَا نَاصِر لَك وَلَا وَلِيًّا .</p></td></tr></table></body></html>
