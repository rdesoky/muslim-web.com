<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سُبْحَانَهُ وَتَعَالَى عَمَّا يَقُولُونَ عُلُوًّا كَبِيرًا</font></td></tr><tr><td align=right dir=rtl><p>نَزَّهَ سُبْحَانه نَفْسه وَقَدَّسَهُ وَمَجَّدَهُ عَمَّا لَا يَلِيق بِهِ . وَالتَّسْبِيح : التَّنْزِيه . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
