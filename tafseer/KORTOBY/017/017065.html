<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : هُمْ الْمُؤْمِنُونَ . وَقَدْ تَقَدَّمَ الْكَلَام فِيهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَكَفَى بِرَبِّكَ وَكِيلًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَاصِمًا مِنْ الْقَبُول مِنْ إِبْلِيس , وَحَافِظًا مِنْ كَيْده وَسُوء مَكْره .</p></td></tr></table></body></html>
