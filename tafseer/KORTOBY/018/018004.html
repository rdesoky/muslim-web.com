<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُنْذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا</font></td></tr><tr><td align=right dir=rtl><p>وَهُمْ الْيَهُود , قَالُوا عُزَيْر اِبْن اللَّه , وَالنَّصَارَى قَالُوا الْمَسِيح اِبْن اللَّه , وَقُرَيْش قَالَتْ الْمَلَائِكَة بَنَات اللَّه . فَالْإِنْذَار فِي أَوَّل السُّورَة عَامّ , وَهَذَا خَاصّ فِيمَنْ قَالَ لِلَّهِ وَلَد .</p></td></tr></table></body></html>
