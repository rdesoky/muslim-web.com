<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَتْبَعَ سَبَبًا</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ مَعْنَاهُ أَنَّ أَتْبَعَ وَاتَّبَعَ بِمَعْنَى أَيْ سَلَكَ طَرِيقًا وَمَنَازِل .</p></td></tr></table></body></html>
