<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَرًّا بِوَالِدَيْهِ</font></td></tr><tr><td align=right dir=rtl><p>الْبَرّ بِمَعْنَى الْبَارّ وَهُوَ الْكَثِير الْبِرّ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>جَبَّارًا</font></td></tr><tr><td align=right dir=rtl><p>مُتَكَبِّرًا . وَهَذَا وَصْف لِيَحْيَى عَلَيْهِ السَّلَام بِلِينِ الْجَانِب وَخَفْض الْجَنَاح .</p></td></tr></table></body></html>
