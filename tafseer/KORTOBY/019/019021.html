<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِنَجْعَلَهُ</font></td></tr><tr><td align=right dir=rtl><p>مُتَعَلِّق بِمَحْذُوفٍ ; أَيْ وَنَخْلُقهُ لِنَجْعَلهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>آيَةً</font></td></tr><tr><td align=right dir=rtl><p>دَلَالَة عَلَى قُدْرَتنَا عَجِيبَة.</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَرَحْمَةً مِنَّا</font></td></tr><tr><td align=right dir=rtl><p>لِمَنْ آمَنَ بِهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَكَانَ أَمْرًا مَقْضِيًّا</font></td></tr><tr><td align=right dir=rtl><p>مُقَدَّرًا فِي اللَّوْح مَسْطُورًا .</p></td></tr></table></body></html>
