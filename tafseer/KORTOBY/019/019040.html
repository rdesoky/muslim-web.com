<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا نَحْنُ نَرِثُ الْأَرْضَ وَمَنْ عَلَيْهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نُمِيت سُكَّانهَا فَنَرِثهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَيْنَا يُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَوْم الْقِيَامَة فَنُجَازِي كُلًّا بِعَمَلِهِ , وَقَدْ تَقَدَّمَ هَذَا فِي " الْحِجْر " وَغَيْرهَا .</p></td></tr></table></body></html>
