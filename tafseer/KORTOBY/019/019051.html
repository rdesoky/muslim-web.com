<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرْ فِي الْكِتَابِ مُوسَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَاقْرَأْ عَلَيْهِمْ مِنْ الْقُرْآن قِصَّة مُوسَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ كَانَ مُخْلَصًا</font></td></tr><tr><td align=right dir=rtl><p>فِي عِبَادَته غَيْر مُرَاءٍ . وَقَرَأَ أَهْل الْكُوفَة بِفَتْحِ اللَّام ; أَيْ أَخْلَصْنَاهُ فَجَعَلْنَاهُ مُخْتَارًا .</p></td></tr></table></body></html>
