<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوَهَبْنَا لَهُ مِنْ رَحْمَتِنَا أَخَاهُ هَارُونَ نَبِيًّا</font></td></tr><tr><td align=right dir=rtl><p>وَذَلِكَ حِين سَأَلَ فَقَالَ : "وَاجْعَلْ لِي وَزِيرًا مِنْ أَهْلِي هَارُون أَخِي " [ طَه : 29 ]</p></td></tr></table></body></html>
