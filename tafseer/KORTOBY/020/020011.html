<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا أَتَاهَا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي النَّار</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>نُودِيَ يَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الشَّجَرَة كَمَا فِي سُورَة " الْقَصَص " أَيْ مِنْ جِهَتهَا وَنَاحِيَتهَا عَلَى مَا يَأْتِي</p></td></tr></table></body></html>
