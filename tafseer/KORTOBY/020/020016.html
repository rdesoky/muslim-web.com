<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا يَصُدَّنَّكَ عَنْهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَصْرِفَنَّك عَنْ الْإِيمَان بِهَا وَالتَّصْدِيق لَهَا</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مَنْ لَا يُؤْمِنُ بِهَا وَاتَّبَعَ هَوَاهُ فَتَرْدَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَتَهْلِك . وَهُوَ فِي مَوْضِع نَصْب بِجَوَابِ النَّهْي .</p></td></tr></table></body></html>
