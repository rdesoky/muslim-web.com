<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اذْهَبْ إِلَى فِرْعَوْنَ إِنَّهُ طَغَى</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا آنَسَهُ بِالْعَصَا وَالْيَد , وَأَرَاهُ مَا يَدُلّ عَلَى أَنَّهُ رَسُول , أَمَرَهُ بِالذَّهَابِ إِلَى فِرْعَوْن , وَأَنْ يَدْعُوهُ . و " طَغَى " مَعْنَاهُ عَصَى وَتَكَبَّرَ وَكَفَرَ وَتَجَبَّرَ وَجَاوَزَ الْحَدّ .</p></td></tr></table></body></html>
