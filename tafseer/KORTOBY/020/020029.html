<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاجْعَلْ لِي وَزِيرًا مِنْ أَهْلِي</font></td></tr><tr><td align=right dir=rtl><p>فَسَأَلَ مُوسَى اللَّه تَعَالَى أَنْ يَجْعَل لَهُ وَزِيرًا , إِلَّا أَنَّهُ لَمْ يُرِدْ أَنْ يَكُون مَقْصُورًا عَلَى الْوَزَارَة حَتَّى لَا يَكُون شَرِيكًا لَهُ فِي النُّبُوَّة , وَلَوْلَا ذَلِكَ لَجَازَ أَنْ يَسْتَوْزِرهُ مِنْ غَيْر مَسْأَلَة .</p></td></tr></table></body></html>
