<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَارُونَ أَخِي</font></td></tr><tr><td align=right dir=rtl><p>وَعَيَّنَ فَقَالَ " هَارُون " وَانْتَصَبَ عَلَى الْبَدَل مِنْ قَوْله " وَزِيرًا " . وَيَكُون مَنْصُوبًا ب " اِجْعَلْ " عَلَى التَّقْدِيم وَالتَّأْخِير , وَالتَّقْدِير : وَاجْعَلْ لِي هَارُون أَخِي وَزِيرًا . وَكَانَ هَارُون أَكْبَر مِنْ مُوسَى بِسَنَةٍ , وَقِيلَ : بِثَلَاثٍ .</p></td></tr></table></body></html>
