<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَذْكُرَكَ كَثِيرًا</font></td></tr><tr><td align=right dir=rtl><p>" كَثِيرًا " نَعْت لِمَصْدَرٍ مَحْذُوف . وَيَجُوز أَنْ يَكُون نَعْتًا لِوَقْتٍ . وَالْإِدْغَام حَسَن .</p></td></tr></table></body></html>
