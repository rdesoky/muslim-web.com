<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ كُنْتَ بِنَا بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الْخَطَّابِيّ : الْبَصِير الْمُبْصِر , وَالْبَصِير الْعَالِم بِخَفِيَّاتِ الْأُمُور , فَالْمَعْنَى ; أَيْ عَالِمًا بِنَا , وَمُدْرِكًا لَنَا فِي صِغَرنَا فَأَحْسَنْت إِلَيْنَا , فَأَحْسِنْ إِلَيْنَا كَذَلِكَ يَا رَبّ .</p></td></tr></table></body></html>
