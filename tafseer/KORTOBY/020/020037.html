<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ مَنَنَّا عَلَيْكَ مَرَّةً أُخْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَبْل هَذِهِ , وَهِيَ حِفْظه سُبْحَانه لَهُ مِنْ شَرّ الْأَعْدَاء فِي الِابْتِدَاء ; وَذَلِكَ حِين الذَّبْح . وَاَللَّه أَعْلَم . وَالْمَنّ الْإِحْسَان وَالْإِفْضَال .</p></td></tr></table></body></html>
