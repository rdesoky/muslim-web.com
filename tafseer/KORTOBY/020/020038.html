<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ أَوْحَيْنَا إِلَى أُمِّكَ مَا يُوحَى</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ : " أَوْحَيْنَا " أَلْهَمْنَا وَقِيلَ : أَوْحَى إِلَيْهَا فِي النَّوْم . وَقَالَ اِبْن عَبَّاس : أَوْحَى إِلَيْهَا كَمَا أَوْحَى إِلَى النَّبِيِّينَ .</p></td></tr></table></body></html>
