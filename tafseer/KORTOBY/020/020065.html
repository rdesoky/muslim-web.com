<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد السَّحَرَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مُوسَى إِمَّا أَنْ</font></td></tr><tr><td align=right dir=rtl><p>عَصَاك مِنْ يَدك</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ</font></td></tr><tr><td align=right dir=rtl><p>تَأَدَّبُوا مَعَ مُوسَى فَكَانَ ذَلِكَ سَبَب إِيمَانهمْ .</p></td></tr></table></body></html>
