<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا إِلَهُكُمُ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا هُوَ وَسِعَ كُلَّ شَيْءٍ عِلْمًا</font></td></tr><tr><td align=right dir=rtl><p>لَا الْعِجْل ; أَيْ وَسِعَ كُلّ شَيْء عِلْمه ; يَفْعَل الْفِعْل عَنْ الْعِلْم ; وَنُصِبَ عَلَى التَّفْسِير .</p><p>وَقَرَأَ مُجَاهِد وَقَتَادَة " وَسِعَ كُلّ شَيْء عِلْمًا " .</p></td></tr></table></body></html>
