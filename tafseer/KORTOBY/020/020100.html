<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ أَعْرَضَ عَنْهُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْقُرْآن فَلَمْ يُؤْمِن بِهِ , وَلَمْ يَعْمَل بِمَا فِيهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّهُ يَحْمِلُ يَوْمَ الْقِيَامَةِ وِزْرًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِثْمًا عَظِيمًا وَحِمْلًا ثَقِيلًا .</p></td></tr></table></body></html>
