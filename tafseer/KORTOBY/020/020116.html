<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَى</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ فِي ( الْبَقَرَة ) مُسْتَوفَى .</p></td></tr></table></body></html>
