<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ لَكَ أَلَّا تَجُوعَ فِيهَا وَلَا تَعْرَى</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ لَك أَلَّا تَجُوع فِيهَا " أَيْ فِي الْجَنَّة " وَلَا تَعْرَى "</p></td></tr></table></body></html>
