<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ مَتَى هَذَا الْوَعْدُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمَوْعُود , كَمَا يُقَال : اللَّه رَجَاؤُنَا أَيْ مَرْجُوّنَا . وَقِيلَ : مَعْنَى " الْوَعْد " هُنَا الْوَعِيد , أَيْ الَّذِي يَعِدنَا مِنْ الْعَذَاب . وَقِيلَ : الْقِيَامَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَا مَعْشَر الْمُؤْمِنِينَ .</p></td></tr></table></body></html>
