<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَجِئْتَنَا بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَجَاءٍ أَنْتَ بِحَقٍّ فِيمَا تَقُول ؟</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>أَمْ أَنْتَ مِنَ اللَّاعِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَاعِب مَازِح .</p></td></tr></table></body></html>
