<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَوْ كَانَ هَؤُلَاءِ آلِهَةً مَا وَرَدُوهَا وَكُلٌّ فِيهَا خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَوْ كَانَتْ الْأَصْنَام آلِهَة لَمَا وَرَدَ عَابِدُوهَا النَّار . وَقِيلَ : مَا وَرَدَهَا الْعَابِدُونَ وَالْمَعْبُودُونَ ; وَلِهَذَا قَالَ : " وَكُلّ فِيهَا خَالِدُونَ " .</p></td></tr></table></body></html>
