<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ يَعْلَمُ الْجَهْرَ مِنَ الْقَوْلِ وَيَعْلَمُ مَا تَكْتُمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الشِّرْك وَهُوَ الْمُجَازِي عَلَيْهِ .</p></td></tr></table></body></html>
