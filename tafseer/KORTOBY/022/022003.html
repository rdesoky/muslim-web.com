<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمِنَ النَّاسِ مَنْ يُجَادِلُ فِي اللَّهِ بِغَيْرِ عِلْمٍ</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ : الْمُرَاد النَّضْر بْن الْحَارِث , قَالَ : إِنَّ اللَّه عَزَّ وَجَلَّ غَيْر قَادِر عَلَى إِحْيَاء مَنْ قَدْ بَلِيَ وَعَادَ تُرَابًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَيَتَّبِعُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي قَوْله ذَلِكَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كُلَّ شَيْطَانٍ مَرِيدٍ</font></td></tr><tr><td align=right dir=rtl><p>مُتَمَرِّد .</p></td></tr></table></body></html>
