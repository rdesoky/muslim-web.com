<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كُتِبَ عَلَيْهِ أَنَّهُ مَنْ تَوَلَّاهُ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة وَمُجَاهِد : أَيْ مَنْ تَوَلَّى الشَّيْطَان .</p></td></tr></table></body></html>
