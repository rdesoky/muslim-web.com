<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَذَلِكَ أَنْزَلْنَاهُ آيَاتٍ بَيِّنَاتٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ اللَّهَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَكَذَلِكَ أَنَّ اللَّه</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>يَهْدِي مَنْ يُرِيدُ</font></td></tr><tr><td align=right dir=rtl><p>عَلَّقَ وُجُود الْهِدَايَة بِإِرَادَتِهِ ; فَهُوَ الْهَادِي لَا هَادِي سِوَاهُ .</p></td></tr></table></body></html>
