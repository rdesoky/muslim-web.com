<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَوْمُ إِبْرَاهِيمَ وَقَوْمُ لُوطٍ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا تَسْلِيَة لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَتَعْزِيَة ; أَيْ كَانَ قَبْلك أَنْبِيَاء كُذِّبُوا فَصَبَرُوا إِلَى أَنْ أَهْلَكَ اللَّه الْمُكَذِّبِينَ , فَاقْتَدِ بِهِمْ وَاصْبِرْ .</p></td></tr></table></body></html>
