<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَأَيِّنْ مِنْ قَرْيَةٍ أَمْلَيْتُ لَهَا وَهِيَ ظَالِمَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَمْهَلْتهَا مَعَ عُتُوّهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَخَذْتُهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْعَذَابِ .</p></td></tr></table></body></html>
