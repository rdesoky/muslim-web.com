<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَا أَيُّهَا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَهْل مَكَّة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>النَّاسُ إِنَّمَا أَنَا لَكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُنْذِر مُخَوِّف . وَقَدْ تَقَدَّمَ فِي الْبَقَرَة الْإِنْذَار فِي أَوَّلهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>نَذِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أُبَيِّن لَكُمْ مَا تَحْتَاجُونَ إِلَيْهِ مِنْ أَمْر دِينكُمْ .</p></td></tr></table></body></html>
