<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد مَا قَدَّمُوا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا خَلْفَهُمْ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد مَا خَلَّفُوا ; مِثْل قَوْله فِي يس : " إِنَّا نَحْنُ نُحْيِي الْمَوْتَى وَنَكْتُب مَا قَدَّمُوا " [ يس : 12 ] يُرِيد مَا بَيْن أَيْدِيهمْ " وَأَثَارَهُمْ " يُرِيد مَا خَلَّفُوا .</p></td></tr></table></body></html>
