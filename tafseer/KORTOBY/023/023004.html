<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ لِلزَّكَاةِ فَاعِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَمَعْنَى " فَاعِلُونَ " أَيْ مُؤَدُّونَ ; وَهِيَ فَصِيحَة , وَقَدْ جَاءَتْ فِي كَلَام الْعَرَب. قَالَ أُمَيَّة اِبْن أَبِي الصَّلْت : <poem type=2><part>الْمُطْعِمُونَ الطَّعَام فِي السَّنَة الْأَزْ </part><part>مَة وَالْفَاعِلُونَ لِلزَّكَوَاتِ</part></poem></p></td></tr></table></body></html>
