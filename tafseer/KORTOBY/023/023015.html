<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّكُمْ بَعْدَ ذَلِكَ لَمَيِّتُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بَعْد الْخَلْق وَالْحَيَاة . وَالنَّحَّاس : وَيُقَال فِي هَذَا الْمَعْنَى لَمَائِتُونَ .</p></td></tr></table></body></html>
