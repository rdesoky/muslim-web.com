<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَى قَوْمِهِ فَقَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ أَفَلَا</font></td></tr><tr><td align=right dir=rtl><p>قُرِئَ بِالْخَفْضِ رَدًّا عَلَى اللَّفْظ , وَبِالرَّفْعِ رَدًّا عَلَى الْمَعْنَى . وَقَدْ مَضَى فِي " الْأَعْرَاف " .</p></td></tr></table></body></html>
