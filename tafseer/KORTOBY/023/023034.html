<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَئِنْ أَطَعْتُمْ بَشَرًا مِثْلَكُمْ إِنَّكُمْ إِذًا لَخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد لَمَغْبُونُونَ بِتَرْكِكُمْ آلِهَتكُمْ وَاتِّبَاعكُمْ إِيَّاهُ مِنْ غَيْر فَضِيلَة لَهُ عَلَيْكُمْ.</p></td></tr></table></body></html>
