<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ بَعْد هَلَاك هَؤُلَاءِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قُرُونًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أُمَمًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>آخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : يُرِيد بَنِي إِسْرَائِيل ; وَفِي الْكَلَام حَذْف : فَكَذَّبُوا أَنْبِيَاءَهُمْ فَأَهْلَكْنَاهُمْ .</p></td></tr></table></body></html>
