<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى فِرْعَوْنَ وَمَلَئِهِ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا عَالِينَ</font></td></tr><tr><td align=right dir=rtl><p>مُتَكَبِّرِينَ قَاهِرِينَ لِغَيْرِهِمْ بِالظُّلْمِ ; كَمَا قَالَ تَعَالَى : " إِنَّ فِرْعَوْن عَلَا فِي الْأَرْض " [ الْقَصَص : 4 ]</p></td></tr></table></body></html>
