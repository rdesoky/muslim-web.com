<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَرْهُمْ فِي غَمْرَتِهِمْ حَتَّى حِينٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ مُجَاهِد : حَتَّى الْمَوْت , فَهُوَ تَهْدِيد لَا تَوْقِيت ; كَمَا يُقَال : سَيَأْتِي لَك يَوْم .</p></td></tr></table></body></html>
