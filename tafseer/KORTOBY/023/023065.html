<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا تَجْأَرُوا الْيَوْمَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ عَذَابنَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكُمْ مِنَّا لَا تُنْصَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>لَا تُمْنَعُونَ وَلَا يَنْفَعكُمْ جَزَعكُمْ . وَقَالَ الْحَسَن : لَا تُنْصَرُونَ بِقَبُولِ التَّوْبَة. وَقِيلَ : مَعْنَى هَذَا النَّهْي الْإِخْبَار ; أَيْ إِنَّكُمْ إِنْ تَضَرَّعْتُمْ لَمْ يَنْفَعكُمْ .</p></td></tr></table></body></html>
