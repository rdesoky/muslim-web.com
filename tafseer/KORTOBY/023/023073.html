<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّكَ لَتَدْعُوهُمْ إِلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِلَى دِين قَوِيم. وَالصِّرَاط فِي اللُّغَة الطَّرِيق ; فَسُمِّيَ الدِّين طَرِيقًا لِأَنَّهُ يُؤَدِّي إِلَى الْجَنَّة فَهُوَ طَرِيق إِلَيْهَا.</p></td></tr></table></body></html>
