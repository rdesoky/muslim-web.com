<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الَّذِي أَنْشَأَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ</font></td></tr><tr><td align=right dir=rtl><p>عَرَّفَهُمْ كَثْرَة نِعَمه وَكَمَال قُدْرَته.</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قَلِيلًا مَا تَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا تَشْكُرُونَ إِلَّا شُكْرًا قَلِيلًا . وَقِيلَ : أَيْ لَا تَشْكُرُونَ الْبَتَّة .</p></td></tr></table></body></html>
