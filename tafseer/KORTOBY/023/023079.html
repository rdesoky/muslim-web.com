<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنْشَأَكُمْ وَبَثَّكُمْ وَخَلَقَكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَيْهِ تُحْشَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تُجْمَعُونَ لِلْجَزَاءِ .</p></td></tr></table></body></html>
