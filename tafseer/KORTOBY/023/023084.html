<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ</font></td></tr><tr><td align=right dir=rtl><p>يَا مُحَمَّد جَوَابًا لَهُمْ عَمَّا قَالُوهُ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لِمَنِ الْأَرْضُ وَمَنْ فِيهَا إِنْ كُنْتُمْ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>يُخْبِر بِرُبُوبِيَّتِهِ وَوَحْدَانِيّته وَمُلْكه الَّذِي لَا يَزُول , وَقُدْرَته الَّتِي لَا تَحُول ;</p></td></tr></table></body></html>
