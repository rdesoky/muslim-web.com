<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَقُولُونَ لِلَّهِ</font></td></tr><tr><td align=right dir=rtl><p>وَلَا بُدّ لَهُمْ مِنْ ذَلِكَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَفَلَا تَتَّعِظُونَ وَتَعْلَمُونَ أَنَّ مَنْ قَدَرَ عَلَى خَلْق ذَلِكَ اِبْتِدَاء فَهُوَ عَلَى إِحْيَاء الْمَوْتَى بَعْد مَوْتهمْ قَادِر .</p></td></tr></table></body></html>
