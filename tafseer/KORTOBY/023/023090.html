<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ أَتَيْنَاهُمْ بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْقَوْلِ الصِّدْق , لَا مَا تَقُولهُ الْكُفَّار مِنْ إِثْبَات الشَّرِيك وَنَفْي الْبَعْث .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُمْ لَكَاذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَنَّ الْمَلَائِكَة بَنَات اللَّه .</p></td></tr></table></body></html>
