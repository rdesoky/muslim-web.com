<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ رَبِّ إِمَّا تُرِيَنِّي مَا يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>عَلَّمَهُ مَا يَدْعُو بِهِ ; أَيْ قُلْ رَبّ , أَيْ يَا رَبّ إِنْ أَرَيْتنِي مَا يُوعَدُونَ مِنْ الْعَذَاب.</p></td></tr></table></body></html>
