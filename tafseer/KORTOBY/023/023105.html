<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ تَكُنْ آيَاتِي تُتْلَى عَلَيْكُمْ فَكُنْتُمْ بِهَا تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>الْآيَات يُرِيد بِهَا الْقُرْآن . " تُتْلَى عَلَيْكُمْ " أَيْ تُقْرَأ .</p></td></tr></table></body></html>
