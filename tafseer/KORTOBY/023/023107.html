<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبَّنَا أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا فَإِنَّا ظَالِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>طَلَبُوا الرَّجْعَة إِلَى الدُّنْيَا كَمَا طَلَبُوهَا عِنْد الْمَوْت . " فَإِنْ عُدْنَا " إِلَى الْكُفْر " فَإِنَّا ظَالِمُونَ " لِأَنْفُسِنَا بِالْعَوْدِ إِلَيْهِ فَيُجَابُونَ بَعْد أَلْف سَنَة :</p></td></tr></table></body></html>
