<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ضَرَبُوا لَك هَذِهِ الْأَمْثَال لِيَتَوَصَّلُوا إِلَى تَكْذِيبك .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَضَلُّوا</font></td></tr><tr><td align=right dir=rtl><p>عَنْ سَبِيل الْحَقّ وَعَنْ بُلُوغ مَا أَرَادُوا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَلَا يَسْتَطِيعُونَ سَبِيلًا</font></td></tr><tr><td align=right dir=rtl><p>إِلَى تَصْحِيح مَا قَالُوهُ فِيك .</p></td></tr></table></body></html>
