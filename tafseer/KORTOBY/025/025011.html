<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ كَذَّبُوا بِالسَّاعَةِ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد يَوْم الْقِيَامَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَعْتَدْنَا لِمَنْ كَذَّبَ بِالسَّاعَةِ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد جَهَنَّم تَتَلَظَّى عَلَيْهِمْ .</p></td></tr></table></body></html>
