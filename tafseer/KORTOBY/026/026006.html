<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَقَدْ كَذَّبُوا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَعْرَضُوا وَمَنْ أَعْرَضَ عَنْ شَيْء وَلَمْ يَقْبَلهُ فَهُوَ تَكْذِيب لَهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَسَيَأْتِيهِمْ أَنْبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَعِيد لَهُمْ ; أَيْ فَسَوْفَ يَأْتِيهِمْ عَاقِبَة مَا كَذَّبُوا وَاَلَّذِي اِسْتَهْزَءُوا بِهِ .</p></td></tr></table></body></html>
