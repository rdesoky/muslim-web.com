<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد الْمَنِيع الْمُنْتَقِم مِنْ أَعْدَائِهِ , الرَّحِيم بِأَوْلِيَائِهِ .</p></td></tr></table></body></html>
