<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَلَمْ نُرَبِّكَ فِينَا وَلِيدًا</font></td></tr><tr><td align=right dir=rtl><p>عَلَى جِهَة الْمَنّ عَلَيْهِ وَالِاحْتِقَار . أَيْ رَبَّيْنَاك صَغِيرًا وَلَمْ نَقْتُلك فِي جُمْلَة مَنْ قَتَلْنَا</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَبِثْتَ فِينَا مِنْ عُمُرِكَ سِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَمَتَى كَانَ هَذَا الَّذِي تَدَّعِيه . ثُمَّ قَرَّرَهُ بِقَتْلِ الْقِبْطِيّ</p></td></tr></table></body></html>
