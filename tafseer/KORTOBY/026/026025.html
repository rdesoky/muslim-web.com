<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ فِرْعَوْن : " أَلَا تَسْتَمِعُونَ " عَلَى مَعْنَى الْإِغْرَاء وَالتَّعَجُّب مِنْ سَفَه الْمَقَالَة إِذْ كَانَتْ عَقِيدَة الْقَوْم أَنَّ فِرْعَوْن رَبّهمْ وَمَعْبُودهمْ وَالْفَرَاعِنَة قَبْله كَذَلِكَ .</p></td></tr></table></body></html>
