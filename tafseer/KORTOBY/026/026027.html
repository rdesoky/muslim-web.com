<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَيْسَ يُجِيبنِي عَمَّا أَسْأَل ; فَأَجَابَهُ مُوسَى عَلَيْهِ السَّلَام عَنْ هَذَا بِأَنْ قَالَ : " رَبّ الْمَشْرِق وَالْمَغْرِب "</p></td></tr></table></body></html>
