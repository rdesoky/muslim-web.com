<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>فَيَتَّضِح لَك بِهِ صِدْقِي , فَلَمَّا سَمِعَ فِرْعَوْن ذَلِكَ طَمِعَ فِي أَنْ يَجِد أَثْنَاءَهُ مَوْضِع مُعَارَضَة " فَقَالَ " لَهُ " فَأْتِ بِهِ إِنْ كُنْت مِنْ الصَّادِقِينَ "</p></td></tr></table></body></html>
