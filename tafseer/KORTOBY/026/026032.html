<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَلْقَى عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ يَده فَكَانَ مَا أَخْبَرَ اللَّه مِنْ قِصَّته . وَقَدْ تَقَدَّمَ بَيَان ذَلِكَ وَشَرْحه فِي " الْأَعْرَاف " إِلَى آخِر الْقِصَّة .</p></td></tr></table></body></html>
