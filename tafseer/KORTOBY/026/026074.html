<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَلِكَ يَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَنَزَعُوا إِلَى التَّقْلِيد مِنْ غَيْر حُجَّة وَلَا دَلِيل . وَقَدْ مَضَى الْقَوْل فِيهِ .</p></td></tr></table></body></html>
