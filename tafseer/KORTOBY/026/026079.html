<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَرْزُقنِي . وَدُخُول " هُوَ " تَنْبِيه عَلَى أَنَّ غَيْره لَا يُطْعِم وَلَا يَسْقِي ; كَمَا تَقُول : زَيْد هُوَ الَّذِي فَعَلَ كَذَا ; أَيْ لَمْ يَفْعَلهُ غَيْره .</p></td></tr></table></body></html>
