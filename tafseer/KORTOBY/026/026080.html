<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ : " مَرِضْت " رِعَايَة لِلْأَدَبِ وَإِلَّا فَالْمَرَض وَالشِّفَاء مِنْ اللَّه عَزَّ وَجَلَّ جَمِيعًا . وَنَظِيره قَوْل فَتَى مُوسَى : " وَمَا أَنْسَانِيهِ إِلَّا الشَّيْطَان " [ الْكَهْف : 63 ] .</p></td></tr></table></body></html>
