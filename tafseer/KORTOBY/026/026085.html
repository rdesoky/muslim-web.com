<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ</font></td></tr><tr><td align=right dir=rtl><p>دُعَاء بِالْجَنَّةِ وَبِمَنْ يَرِثهَا , وَهُوَ يَرُدّ قَوْل بَعْضهمْ : لَا أَسْأَل جَنَّة وَلَا نَارًا .</p></td></tr></table></body></html>
