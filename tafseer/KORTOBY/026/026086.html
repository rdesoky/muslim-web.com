<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاغْفِرْ لِأَبِي</font></td></tr><tr><td align=right dir=rtl><p>كَانَ أَبُوهُ وَعَدَهُ فِي الظَّاهِر أَنْ يُؤْمِن بِهِ فَاسْتَغْفَرَ لَهُ لِهَذَا , فَلَمَّا بَانَ أَنَّهُ لَا يَفِي بِمَا قَالَ تَبَرَّأَ مِنْهُ . وَقَدْ تَقَدَّمَ هَذَا الْمَعْنَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ كَانَ مِنَ الضَّالِّينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمُشْرِكِينَ . " وَكَانَ " زَائِدَة .</p></td></tr></table></body></html>
