<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قُرِّبَتْ وَأُدْنِيَتْ لِيَدْخُلُوهَا . وَقَالَ الزَّجَّاج : قَرُبَ دُخُولهمْ إِيَّاهَا .</p></td></tr></table></body></html>
