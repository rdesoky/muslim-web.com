<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَاللَّهِ</font></td></tr><tr><td align=right dir=rtl><p>حَلَفُوا بِاَللَّهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنْ كُنَّا لَفِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي خَسَار وَتَبَار وَحَيْرَة عَنْ الْحَقّ بَيِّنَة إِذَا اِتَّخَذْنَا مَعَ اللَّه آلِهَة فَعَبَدْنَاهَا كَمَا يُعْبَد ;</p></td></tr></table></body></html>
