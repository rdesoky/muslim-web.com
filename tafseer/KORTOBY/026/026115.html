<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ أَنَا إِلَّا نَذِيرٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي : إِنَّ اللَّه مَا أَرْسَلَنِي أَخُصّ ذَوِي الْغِنَى دُون الْفُقَرَاء , إِنَّمَا أَنَا رَسُول أُبَلِّغكُمْ مَا أُرْسِلْت بِهِ , فَمَنْ أَطَاعَنِي فَذَلِكَ السَّعِيد عِنْد اللَّه وَإِنْ كَانَ فَقِيرًا .</p></td></tr></table></body></html>
