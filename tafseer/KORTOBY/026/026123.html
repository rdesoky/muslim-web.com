<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ عَادٌ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>التَّأْنِيث بِمَعْنَى الْقَبِيلَة وَالْجَمَاعَة . وَتَكْذِيبهمْ الْمُرْسَلِينَ كَمَا تَقَدَّمَ .</p></td></tr></table></body></html>
