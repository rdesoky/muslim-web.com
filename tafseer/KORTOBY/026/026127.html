<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا طَمَع لِي فِي مَالكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنْ أَجْرِيَ إِلَّا عَلَى رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا جَزَائِي " إِلَّا عَلَى رَبّ الْعَالَمِينَ " .</p></td></tr></table></body></html>
