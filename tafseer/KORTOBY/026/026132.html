<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّقُوا الَّذِي أَمَدَّكُمْ بِمَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الْخَيْرَات ; ثُمَّ فَسَّرَهَا بِقَوْلِهِ : " أَمَدَّكُمْ بِأَنْعَامٍ وَبَنِينَ . وَجَنَّات وَعُيُون "</p></td></tr></table></body></html>
