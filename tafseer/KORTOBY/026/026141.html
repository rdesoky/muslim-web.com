<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ ثَمُودُ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>ذَكَرَ قِصَّة صَالِح وَقَوْمه وَهُمْ ثَمُود ; وَكَانُوا يَسْكُنُونَ الْحِجْر كَمَا تَقَدَّمَ فِي " الْحِجْر " وَهِيَ ذَوَات نَخْل وَزُرُوع وَمِيَاه .</p></td></tr></table></body></html>
