<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي لَكُمْ رَسُولٌ أَمِينٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ صَادِق فِيمَا أُبَلِّغكُمْ عَنْ اللَّه تَعَالَى . وَقِيلَ : " أَمِين " فِيمَا بَيْنكُمْ ; فَإِنَّهُمْ كَانُوا عَرَفُوا أَمَانَته وَصِدْقه مِنْ قَبْل كَمُحَمَّدٍ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ فِي قُرَيْش .</p></td></tr></table></body></html>
