<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ دَمَّرْنَا الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَهْلَكْنَاهُمْ بِالْخَسْفِ وَالْحَصْب ; قَالَ مُقَاتِل : خَسَفَ اللَّه بِقَوْمِ لُوط وَأَرْسَلَ الْحِجَارَة عَلَى مَنْ كَانَ خَارِجًا مِنْ الْقَرْيَة .</p></td></tr></table></body></html>
