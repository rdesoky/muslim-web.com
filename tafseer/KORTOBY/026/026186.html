<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا وَإِنْ نَظُنُّكَ لَمِنَ الْكَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا نَظُنّك إِلَّا مِنْ الْكَاذِبِينَ فِي أَنَّك رَسُول اللَّه تَعَالَى .</p></td></tr></table></body></html>
