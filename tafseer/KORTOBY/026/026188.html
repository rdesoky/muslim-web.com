<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّي أَعْلَمُ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>تَهْدِيد ; أَيْ إِنَّمَا عَلَيَّ التَّبْلِيغ وَلَيْسَ الْعَذَاب الَّذِي سَأَلْتُمْ وَهُوَ يُجَازِيكُمْ .</p></td></tr></table></body></html>
