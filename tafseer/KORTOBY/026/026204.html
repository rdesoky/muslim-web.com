<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ مُقَاتِل : قَالَ الْمُشْرِكُونَ لِلنَّبِيِّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ يَا مُحَمَّد إِلَى مَتَى تَعِدنَا بِالْعَذَابِ وَلَا تَأْتِي بِهِ ! فَنَزَلَتْ : " أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ " .</p></td></tr></table></body></html>
