<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاخْفِضْ جَنَاحَكَ لِمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ فِي سُورَة " الْحِجْر " وَ " سُبْحَان " يُقَال : خَفَضَ جَنَاحه إِذَا لَانَ .</p></td></tr></table></body></html>
