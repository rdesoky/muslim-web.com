<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي يَرَاكَ حِينَ تَقُومُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ حِين تَقُوم إِلَى الصَّلَاة فِي قَوْل أَكْثَر الْمُفَسِّرِينَ : اِبْن عَبَّاس وَغَيْره . وَقَالَ مُجَاهِد : يَعْنِي حِين تَقُوم حَيْثُمَا كُنْت .</p></td></tr></table></body></html>
