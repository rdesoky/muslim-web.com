<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنَزَّلُ عَلَى كُلِّ أَفَّاكٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>إِنَّمَا قَالَ : " تَنَزَّل " لِأَنَّهَا أَكْثَر مَا تَكُون فِي الْهَوَاء , وَأَنَّهَا تَمُرّ فِي الرِّيح .</p></td></tr></table></body></html>
