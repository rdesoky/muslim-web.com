<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُلْقُونَ السَّمْعَ وَأَكْثَرُهُمْ كَاذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ فِي " الْحِجْر " . " فَيُلْقُونَ السَّمْع " صِفَة الشَّيَاطِين " وَأَكْثَرهمْ " يَرْجِع إِلَى الْكَهَنَة . وَقِيلَ : إِلَى الشَّيَاطِين .</p></td></tr></table></body></html>
