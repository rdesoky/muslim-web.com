<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ وَصَفَهُمْ فَقَالَ : " الَّذِينَ يُقِيمُونَ الصَّلَاة وَيُؤْتُونَ الزَّكَاة وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ " وَقَدْ مَضَى فِي أَوَّل " الْبَقَرَة " بَيَان هَذَا</p></td></tr></table></body></html>
