<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ مَتَى هَذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَيَقُولُونَ مَتَى هَذَا الْوَعْد . .. " أَيْ وَقْت يَجِيئنَا الْعَذَاب بِتَكْذِيبِنَا " إِنْ كُنْتُمْ صَادِقِينَ " .</p></td></tr></table></body></html>
