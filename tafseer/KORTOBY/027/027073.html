<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ لَذُو فَضْلٍ عَلَى النَّاسِ</font></td></tr><tr><td align=right dir=rtl><p>وَإِنَّ رَبّك لَذُو فَضْل عَلَى النَّاس " فِي تَأْخِير الْعُقُوبَة وَإِدْرَار الرِّزْق</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَلَكِنَّ أَكْثَرهمْ لَا يَشْكُرُونَ " فَضْله وَنِعَمه .</p></td></tr></table></body></html>
