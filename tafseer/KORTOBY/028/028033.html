<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنِّي قَتَلْتُ مِنْهُمْ نَفْسًا فَأَخَافُ أَنْ يَقْتُلُونِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : قَتَلَ قِبْطِيًّا كَافِرًا . قَالَ كَعْب : وَكَانَ إِذْ ذَاكَ اِبْن اِثْنَتَيْ عَشْرَة سَنَة . فِي صَحِيح مُسْلِم : وَكَانَ قَتَلَهُ خَطَأ ; عَلَى مَا يَأْتِي</p></td></tr></table></body></html>
