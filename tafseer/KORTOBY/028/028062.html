<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ يُنَادِيهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُنَادِي اللَّه يَوْم الْقِيَامَة هَؤُلَاءِ الْمُشْرِكِينَ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تَزْعُمُونَ</font></td></tr><tr><td align=right dir=rtl><p>بِزَعْمِكُمْ أَنَّهُمْ يَنْصُرُونَكُمْ وَيَشْفَعُونَ لَكُمْ</p></td></tr></table></body></html>
