<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ مَاذَا أَجَبْتُمُ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَقُول اللَّه لَهُمْ مَا كَانَ جَوَابكُمْ لِمَنْ أُرْسِلَ إِلَيْكُمْ مِنْ النَّبِيِّينَ لَمَّا بَلَّغُوكُمْ رِسَالَاتِي</p></td></tr></table></body></html>
