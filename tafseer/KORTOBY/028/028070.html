<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ لَهُ الْحَمْدُ فِي الْأُولَى وَالْآخِرَةِ وَلَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ مَعْنَاهُ , وَأَنَّهُ الْمُنْفَرِد بِالْوَحْدَانِيَّةِ , لِأَنَّ جَمِيع الْمَحَامِد إِنَّمَا تَجِب لَهُ وَأَنْ لَا حُكْم إِلَّا لَهُ وَإِلَيْهِ الْمَصِير</p></td></tr></table></body></html>
