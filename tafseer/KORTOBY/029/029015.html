<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْجَيْنَاهُ وَأَصْحَابَ السَّفِينَةِ وَجَعَلْنَاهَا آيَةً لِلْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>مَعْطُوف عَلَى الْهَاء وَالْهَاء وَالْأَلِف فِي " جَعَلْنَاهَا " لِلسَّفِينَةِ أَوْ لِلْعُقُوبَةِ أَوْ لِلنَّجَاةِ ; ثَلَاثَة أَقْوَال</p></td></tr></table></body></html>
