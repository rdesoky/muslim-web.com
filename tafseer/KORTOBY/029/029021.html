<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يُعَذِّبُ مَنْ يَشَاءُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِعَدْلِهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَيَرْحَمُ مَنْ يَشَاءُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِفَضْلِهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَيْهِ تُقْلَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>تُرْجَعُونَ وَتُرَدُّونَ</p></td></tr></table></body></html>
