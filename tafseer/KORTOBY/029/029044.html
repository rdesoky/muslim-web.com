<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ اللَّهُ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْعَدْلِ وَالْقِسْط وَقِيلَ : بِكَلَامِهِ وَقُدْرَته وَذَلِكَ هُوَ الْحَقّ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي ذَلِكَ لَآيَةً</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَلَامَة وَدَلَالَة</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>الْمُصَدِّقِينَ</p></td></tr></table></body></html>
