<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعْدَ اللَّهِ لَا يُخْلِفُ اللَّهُ وَعْدَهُ</font></td></tr><tr><td align=right dir=rtl><p>لِأَنَّ كَلَامه صِدْق . وَانْتَصَبَ " وَعْد اللَّه " عَلَى الْمَصْدَر ; أَيْ وَعَدَ ذَلِكَ وَعْدًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَهُمْ الْكُفَّار وَهُمْ أَكْثَر . وَقِيلَ : الْمُرَاد مُشْرِكُو مَكَّة .</p></td></tr></table></body></html>
