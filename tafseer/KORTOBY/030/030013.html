<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمْ يَكُنْ لَهُمْ مِنْ شُرَكَائِهِمْ شُفَعَاءُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ شُرَكَائِهِمْ الَّذِينَ عَبَدُوهُمْ مِنْ دُون اللَّه</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَكَانُوا بِشُرَكَائِهِمْ كَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالُوا لَيْسُوا بِآلِهَةٍ فَتَبَرَّءُوا مِنْهَا وَتَبَرَّأَتْ مِنْهُمْ ; حَسْبَمَا تَقَدَّمَ فِي غَيْر مَوْضِع .</p></td></tr></table></body></html>
