<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ سِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ مِنْ قَبْلُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قُلْ لَهُمْ يَا مُحَمَّد سِيرُوا فِي الْأَرْض لِيَعْتَبِرُوا بِمَنْ قَبْلهمْ , وَيَنْظُرُوا كَيْف كَانَ عَاقِبَة مَنْ كَذَّبَ الرُّسُل</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كَانَ أَكْثَرُهُمْ مُشْرِكِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَافِرِينَ فَأُهْلِكُوا .</p></td></tr></table></body></html>
