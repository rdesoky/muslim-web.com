<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا تُتْلَى عَلَيْهِ آيَاتُنَا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَعْرَضَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مُسْتَكْبِرًا</font></td></tr><tr><td align=right dir=rtl><p>نُصِبَ عَلَى الْحَال .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كَأَنْ لَمْ يَسْمَعْهَا كَأَنَّ فِي أُذُنَيْهِ وَقْرًا</font></td></tr><tr><td align=right dir=rtl><p>ثِقَلًا وَصَمَمًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَبَشِّرْهُ بِعَذَابٍ أَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُوجِع</p></td></tr></table></body></html>
