<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ دَائِمِينَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَعْدَ اللَّهِ حَقًّا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَعَدَهُمْ اللَّه هَذَا وَعْدًا حَقًّا لَا خُلْف فِيهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الْعَزِيزُ</font></td></tr><tr><td align=right dir=rtl><p>الْعَزِيز الَّذِي لَا يَمْتَنِع عَلَيْهِ مَا يُرِيدهُ ;</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْحَكِيمُ</font></td></tr><tr><td align=right dir=rtl><p>الْحَكِيم فِيمَا يَفْعَلهُ</p></td></tr></table></body></html>
