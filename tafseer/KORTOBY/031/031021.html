<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنْزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا وَجَدْنَا عَلَيْهِ آبَاءَنَا</font></td></tr><tr><td align=right dir=rtl><p>وَإِلَّا تَقْلِيدهمْ لِلْأَسْلَافِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>أَوَلَوْ كَانَ الشَّيْطَانُ يَدْعُوهُمْ إِلَى عَذَابِ السَّعِيرِ</font></td></tr><tr><td align=right dir=rtl><p>فَيَتَّبِعُونَهُ</p></td></tr></table></body></html>
