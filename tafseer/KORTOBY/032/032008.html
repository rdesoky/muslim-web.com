<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَعَلَ نَسْلَهُ مِنْ سُلَالَةٍ مِنْ مَاءٍ مَهِينٍ</font></td></tr><tr><td align=right dir=rtl><p>تَقَدَّمَ فِي " الْمُؤْمِنُونَ " وَغَيْرهَا . قَالَ الزَّجَّاج : " مِنْ مَاء مَهِين " ضَعِيف . وَقَالَ غَيْره : " مَهِين " لَا خَطَر لَهُ عِنْد النَّاس .</p></td></tr></table></body></html>
