<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ أَظْلَمُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا أَحَد أَظْلَمُ لِنَفْسِهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِمَّنْ ذُكِّرَ بِآيَاتِ رَبِّهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِحُجَجِهِ وَعَلَامَاته .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَعْرَضَ عَنْهَا</font></td></tr><tr><td align=right dir=rtl><p>بِتَرْكِ الْقَبُول .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا مِنَ الْمُجْرِمِينَ مُنْتَقِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>لِتَكْذِيبِهِمْ وَإِعْرَاضهمْ .</p></td></tr></table></body></html>
