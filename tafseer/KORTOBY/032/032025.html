<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَقْضِي وَيَحْكُم بَيْن الْمُؤْمِنِينَ وَالْكُفَّار , فَيُجَازِي كُلًّا بِمَا يَسْتَحِقّ . وَقِيلَ : يَقْضِي بَيْن الْأَنْبِيَاء وَبَيْن قَوْمهمْ ; حَكَاهُ النَّقَّاش .</p></td></tr></table></body></html>
