<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ طَرَدَهُمْ وَأَبْعَدَهُمْ . وَاللَّعْن : الطَّرْد وَالْإِبْعَاد عَنْ الرَّحْمَة . وَقَدْ مَضَى فِي " الْبَقَرَة " بَيَانه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَعَدَّ لَهُمْ سَعِيرًا</font></td></tr><tr><td align=right dir=rtl><p>أَنَّثَ السَّعِير لِأَنَّهَا بِمَعْنَى النَّار .</p></td></tr></table></body></html>
