<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَالِدِينَ فِيهَا أَبَدًا لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p>خَالِدِينَ فِي السَّعِير لَا يَجِدُونَ مَنْ يُنَجِّيهِمْ مِنْ عَذَاب اللَّه وَالْخُلُود فِيهِ .</p></td></tr></table></body></html>
