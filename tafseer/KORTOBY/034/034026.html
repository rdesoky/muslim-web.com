<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ يَجْمَعُ بَيْنَنَا رَبُّنَا</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد يَوْم الْقِيَامَة</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يَفْتَحُ بَيْنَنَا بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَقْضِي فَيُثِيب الْمُهْتَدِيَ وَيُعَاقِب الضَّالّ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ الْفَتَّاحُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْقَاضِي بِالْحَقِّ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p>بِأَحْوَالِ الْخَلْق . وَهَذَا كُلّه مَنْسُوخ بِآيَةِ السَّيْف .</p></td></tr></table></body></html>
