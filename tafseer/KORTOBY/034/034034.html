<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَرْسَلْنَا فِي قَرْيَةٍ مِنْ نَذِيرٍ إِلَّا قَالَ مُتْرَفُوهَا إِنَّا بِمَا أُرْسِلْتُمْ بِهِ كَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة : أَيْ أَغْنِيَاؤُهَا وَرُؤَسَاؤُهَا وَجَبَابِرَتهَا وَقَادَة الشَّرّ لِلرُّسُلِ إِنَّا بِمَا أُرْسِلْتُمْ بِهِ كَافِرُونَ</p></td></tr></table></body></html>
