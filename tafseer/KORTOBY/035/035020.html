<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا الظُّلُمَاتُ وَلَا النُّورُ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الْأَخْفَش سَعِيد : " لَا " زَائِدَة ; وَالْمَعْنَى وَلَا الظُّلُمَات وَالنُّور ,</p></td></tr></table></body></html>
