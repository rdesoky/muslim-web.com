<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَرْسَلْنَاكَ بِالْحَقِّ بَشِيرًا وَنَذِيرًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بَشِيرًا بِالْجَنَّةِ أَهْل طَاعَته , وَنَذِيرًا بِالنَّارِ أَهْل مَعْصِيَته .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ مِنْ أُمَّةٍ إِلَّا خَلَا فِيهَا نَذِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ سَلَفَ فِيهَا نَبِيّ . قَالَ اِبْن جُرَيْج : إِلَّا الْعَرَب .</p></td></tr></table></body></html>
