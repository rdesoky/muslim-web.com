<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي أَوْحَيْنَا إِلَيْكَ مِنَ الْكِتَابِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>هُوَ الْحَقُّ مُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ إِنَّ اللَّهَ بِعِبَادِهِ لَخَبِيرٌ بَصِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الْكُتُب .</p></td></tr></table></body></html>
