<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَجَبَ الْعَذَاب عَلَى أَكْثَرهمْ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>بِإِنْذَارِك . وَهَذَا فِيمَنْ سَبَقَ فِي عِلْم اللَّه أَنَّهُ يَمُوت عَلَى كُفْرِهِ ثُمَّ بَيَّنَ سَبَب تَرْكهمْ الْإِيمَان فَقَالَ : " إِنَّا جَعَلْنَا فِي أَعْنَاقهمْ أَغْلَالًا "</p></td></tr></table></body></html>
