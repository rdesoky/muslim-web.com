<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا مَا أَنْتُمْ إِلَّا بَشَرٌ مِثْلُنَا</font></td></tr><tr><td align=right dir=rtl><p>تَأْكُلُونَ الطَّعَام وَتَمْشُونَ فِي الْأَسْوَاق</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْزَلَ الرَّحْمَنُ مِنْ شَيْءٍ</font></td></tr><tr><td align=right dir=rtl><p>يَأْمُر بِهِ وَلَا مِنْ شَيْء يَنْهَى عَنْهُ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنْ أَنْتُمْ إِلَّا تَكْذِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>فِي دَعْوَاكُمْ الرِّسَالَة ;</p></td></tr></table></body></html>
