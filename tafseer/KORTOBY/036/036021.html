<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اتَّبِعُوا مَنْ لَا يَسْأَلُكُمْ أَجْرًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَوْ كَانُوا مُتَّهَمِينَ لَطَلَبُوا مِنْكُمْ الْمَال</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُمْ مُهْتَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>فَاهْتَدُوا بِهِمْ .</p></td></tr></table></body></html>
