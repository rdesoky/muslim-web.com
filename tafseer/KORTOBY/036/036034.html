<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَعَلْنَا فِيهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي الْأَرْض .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>جَنَّاتٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بَسَاتِين .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِنْ نَخِيلٍ وَأَعْنَابٍ</font></td></tr><tr><td align=right dir=rtl><p>وَخَصَّصَهُمَا بِالذِّكْرِ ; لِأَنَّهُمَا أَعْلَى الثِّمَار .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي الْبَسَاتِين .</p></td></tr></table></body></html>
