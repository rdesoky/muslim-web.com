<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي</font></td></tr><tr><td align=right dir=rtl><p>الْعَهْد هُنَا بِمَعْنَى الْوَصِيَّة ; أَيْ أَلَمْ أُوصِكُمْ وَأُبَلِّغْكُمْ عَلَى أَلْسِنَة الرُّسُل .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>آدَمَ أَنْ لَا تَعْبُدُوا الشَّيْطَانَ إِنَّهُ لَكُمْ عَدُوٌّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا تُطِيعُوهُ فِي مَعْصِيَتِي . قَالَ الْكِسَائِيّ : لَا لِلنَّهْيِ .</p></td></tr></table></body></html>
