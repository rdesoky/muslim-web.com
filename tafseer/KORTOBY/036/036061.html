<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنِ اعْبُدُونِي هَذَا صِرَاطٌ مُسْتَقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>" وَأَنْ اُعْبُدُونِي " بِكَسْرِ النُّونِ عَلَى الْأَصْل , وَمَنْ ضَمَّ كَرِهَ كَسْرَةً بَعْدهَا ضَمَّة . " هَذَا صِرَاط مُسْتَقِيم " أَيْ عِبَادَتِي دِين قَوِيم .</p></td></tr></table></body></html>
