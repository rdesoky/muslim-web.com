<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهُمْ فِيهَا مَنَافِعُ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ أَصْوَافهَا وَأَوْبَارهَا وَأَشْعَارهَا وَشُحُومهَا وَلُحُومهَا وَغَيْر ذَلِكَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَشَارِبُ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَلْبَانهَا ; وَلَمْ يَنْصَرِفَا لِأَنَّهُمَا مِنْ الْجُمُوع الَّتِي لَا نَظِير لَهَا فِي الْوَاحِد .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا يَشْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>اللَّه عَلَى نِعَمه .</p></td></tr></table></body></html>
