<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ</font></td></tr><tr><td align=right dir=rtl><p>قَرَأَ الْكِسَائِيّ " فَيَكُون " بِالنَّصْبِ عَطْفًا عَلَى " يَقُول " أَيْ إِذَا أَرَادَ خَلْق شَيْء لَا يَحْتَاج إِلَى تَعَب وَمُعَالَجَةٍ . وَقَدْ مَضَى هَذَا فِي غَيْر مَوْضِع .</p></td></tr></table></body></html>
