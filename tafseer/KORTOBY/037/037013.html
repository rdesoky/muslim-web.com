<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا ذُكِّرُوا لَا يَذْكُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>" وَإِذَا ذُكِّرُوا " أَيْ وُعِظُوا بِالْقُرْآنِ فِي قَوْل قَتَادَة : " لَا يَذْكُرُونَ " لَا يَنْتَفِعُونَ بِهِ . وَقَالَ سَعِيد بْن جُبَيْر : أَيْ إِذَا ذُكِرَ لَهُمْ مَا حَلَّ بِالْمُكَذِّبِينَ مِنْ قَبْلهمْ أَعْرَضُوا عَنْهُ وَلَمْ يَتَدَبَّرُوا .</p></td></tr></table></body></html>
