<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَئِذَا مِتْنَا وَكُنَّا تُرَابًا وَعِظَامًا أَئِنَّا لَمَبْعُوثُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنُبْعَث إِذَا مِتْنَا ؟ . فَهُوَ اِسْتِفْهَام إِنْكَار مِنْهُمْ وَسُخْرِيَة .</p></td></tr></table></body></html>
