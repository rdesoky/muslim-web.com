<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ هُمُ الْيَوْمَ مُسْتَسْلِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة : مُسْتَسْلِمُونَ فِي عَذَاب اللَّه عَزَّ وَجَلَّ . اِبْن عَبَّاس : خَاضِعُونَ ذَلِيلُونَ . الْحَسَن : مُنْقَادُونَ . الْأَخْفَش : مُلْقُونَ بِأَيْدِيهِمْ . وَالْمَعْنَى مُتَقَارِب .</p></td></tr></table></body></html>
