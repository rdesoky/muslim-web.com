<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا كَانَ لَنَا عَلَيْكُمْ مِنْ سُلْطَانٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ حُجَّة فِي تَرْك الْحَقّ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بَلْ كُنْتُمْ قَوْمًا طَاغِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ضَالِّينَ مُتَجَاوِزِينَ الْحَدّ .</p></td></tr></table></body></html>
