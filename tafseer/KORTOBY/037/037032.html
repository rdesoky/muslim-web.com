<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَغْوَيْنَاكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ زَيَّنَّا لَكُمْ مَا كُنْتُمْ عَلَيْهِ مِنْ الْكُفْر</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كُنَّا غَاوِينَ</font></td></tr><tr><td align=right dir=rtl><p>بِالْوَسْوَسَةِ وَالِاسْتِدْعَاء .</p></td></tr></table></body></html>
