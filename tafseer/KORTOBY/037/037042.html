<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَوَاكِهُ</font></td></tr><tr><td align=right dir=rtl><p>جَمْع فَاكِهَة ; قَالَ اللَّه تَعَالَى : " وَأَمْدَدْنَاهُمْ بِفَاكِهَةٍ " [ الطُّور : 22 ] وَهِيَ الثِّمَار كُلُّهَا رَطْبُهَا وَيَابِسُهَا ; قَالَهُ اِبْن عَبَّاس .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُمْ مُكْرَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَلَهُمْ إِكْرَام مِنْ اللَّه جَلَّ وَعَزَّ بِرَفْعِ الدَّرَجَات وَسَمَاع كَلَامه وَلِقَائِهِ .</p></td></tr></table></body></html>
