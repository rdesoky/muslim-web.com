<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي جَنَّاتِ النَّعِيمِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي بَسَاتِين يَتَنَعَّمُونَ فِيهَا . وَقَدْ تَقَدَّمَ أَنَّ الْجِنَان سَبْع فِي سُورَة [ يُونُس ] مِنْهَا النَّعِيم .</p></td></tr></table></body></html>
