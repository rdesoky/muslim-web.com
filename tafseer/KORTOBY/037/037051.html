<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ قَائِلٌ مِنْهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ أَهْل الْجَنَّة</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي كَانَ لِي قَرِينٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ صَدِيق مُلَازِم , وَقِيلَ : أَرَادَ بِالْقَرِينِ قَرِينَهُ مِنْ الشَّيْطَان كَانَ يُوَسْوِس إِلَيْهِ بِإِنْكَارِ الْبَعْث .</p></td></tr></table></body></html>
