<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَ اللَّهِ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّذِينَ اِسْتَخْلَصَهُمْ اللَّه مِنْ الْكُفْر . وَقَدْ تَقَدَّمَ . ثُمَّ قِيلَ : هُوَ اِسْتِثْنَاء مِنْ " الْمُنْذَرِينَ " . وَقِيلَ هُوَ مِنْ قَوْله تَعَالَى : " وَلَقَدْ ضَلَّ قَبْلهمْ أَكْثَر الْأَوَّلِينَ " .</p></td></tr></table></body></html>
