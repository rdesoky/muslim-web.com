<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ نَادَانَا نُوحٌ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ النِّدَاء الَّذِي هُوَ الِاسْتِغَاثَة ; وَدَعَا قِيلَ بِمَسْأَلَةِ هَلَاك قَوْمه فَقَالَ : " رَبّ لَا تَذَرْ عَلَى الْأَرْض مِنْ الْكَافِرِينَ دَيَّارًا " [ نُوح : 26 ] .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَلَنِعْمَ الْمُجِيبُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ الْكِسَائِيّ : أَيْ " فَلَنِعْمَ الْمُجِيبُونَ " لَهُ كُنَّا .</p></td></tr></table></body></html>
