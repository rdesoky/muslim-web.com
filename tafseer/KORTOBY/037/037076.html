<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنَجَّيْنَاهُ وَأَهْلَهُ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَهْل دِينه , وَهُمْ مَنْ آمَنَ مَعَهُ وَكَانُوا ثَمَانِينَ عَلَى مَا تَقَدَّمَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِنَ الْكَرْبِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ الْغَرَق .</p></td></tr></table></body></html>
