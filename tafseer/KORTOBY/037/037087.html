<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا ظَنُّكُمْ بِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا ظَنُّكُمْ بِهِ إِذَا لَقِيتُمُوهُ وَقَدْ عَبَدْتُمْ غَيْره ؟ فَهُوَ تَحْذِير , مِثْل قَوْله : " مَا غَرَّك بِرَبِّك الْكَرِيم " [ الِانْفِطَار : 6 ] . وَقِيلَ : أَيّ شَيْء أُوهِمْتُمُوهُ حَتَّى أَشْرَكْتُمْ بِهِ غَيْره .</p></td></tr></table></body></html>
