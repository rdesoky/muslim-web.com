<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرَادُوا بِهِ كَيْدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِإِبْرَاهِيم . وَالْكَيْد الْمَكْر ; أَيْ اِحْتَالُوا لِإِهْلَاكِهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَجَعَلْنَاهُمُ الْأَسْفَلِينَ</font></td></tr><tr><td align=right dir=rtl><p>الْمَقْهُورِينَ الْمَغْلُوبِينَ إِذْ نَفَذَتْ حُجَّتُهُ مِنْ حَيْثُ لَمْ يُمْكِنْهُمْ دَفْعُهَا , وَلَمْ يَنْفُذْ فِيهِ مَكْرُهُمْ وَلَا كَيْدُهُمْ .</p></td></tr></table></body></html>
