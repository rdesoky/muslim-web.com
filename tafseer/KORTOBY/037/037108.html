<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَرَكْنَا عَلَيْهِ فِي الْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَلَى إِبْرَاهِيم ثَنَاء جَمِيلًا فِي الْأُمَم بَعْده ; فَمَا مِنْ أُمَّة إِلَّا تُصَلِّي عَلَيْهِ وَتُحِبُّهُ .</p></td></tr></table></body></html>
