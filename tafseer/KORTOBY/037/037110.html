<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نُبْقِي عَلَيْهِمْ الثَّنَاء الْحَسَن . وَالْكَاف فِي مَوْضِع نَصْب ; أَيْ جَزَاء كَذَلِكَ . أَوْ نَجْزِيهِمْ بِالْخَلَاصِ مِنْ الشَّدَائِد فِي الدُّنْيَا وَالْآخِرَة .</p></td></tr></table></body></html>
