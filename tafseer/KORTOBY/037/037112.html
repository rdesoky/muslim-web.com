<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَشَّرْنَاهُ بِإِسْحَاقَ نَبِيًّا مِنَ الصَّالِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : بُشِّرَ بِنُبُوَّتِهِ وَذَهَبَ إِلَى أَنَّ الْبِشَارَة كَانَتْ مَرَّتَيْنِ ; فَعَلَى هَذَا الذَّبِيح هُوَ إِسْحَاق بُشِّرَ بِنُبُوَّتِهِ جَزَاء عَلَى صَبْره وَرِضَاهُ بِأَمْرِ رَبّه وَاسْتِسْلَامه لَهُ .</p></td></tr></table></body></html>
