<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ مَنَنَّا عَلَى مُوسَى وَهَارُونَ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ إِنْجَاء إِسْحَاق مِنْ الذَّبْح , وَمَا مَنَّ بِهِ عَلَيْهِ بَعْد النُّبُوَّة , ذَكَرَ مَا مَنَّ بِهِ أَيْضًا عَلَى مُوسَى وَهَارُون مِنْ ذَلِكَ .</p></td></tr></table></body></html>
