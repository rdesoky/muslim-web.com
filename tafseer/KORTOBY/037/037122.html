<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمَا مِنْ عِبَادِنَا الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ الَّذِينَ أَعْطَوْا الْعُبُودِيَّة حَقّهَا حَتَّى اِسْتَحَقُّوا الْإِضَافَة إِلَى اللَّه تَعَالَى .</p></td></tr></table></body></html>
