<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَ اللَّهِ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ قَوْمه فَإِنَّهُمْ نَجَوْا مِنْ الْعَذَاب . وَقُرِئَ " الْمُخْلِصِينَ " بِكَسْرِ اللَّام وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
