<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِمْ مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>خَاطَبَ الْعَرَب : أَيْ تَمُرُّونَ عَلَى مَنَازِلهمْ وَآثَارهمْ " مُصْبِحِينَ " وَقْت الصَّبَاح</p></td></tr></table></body></html>
