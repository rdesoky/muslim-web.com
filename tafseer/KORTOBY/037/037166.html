<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّا لَنَحْنُ الْمُسَبِّحُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمُصَلُّونَ ; قَالَهُ قَتَادَة . وَقِيلَ : أَيْ الْمُنَزِّهُونَ اللَّهَ عَمَّا أَضَافَهُ إِلَيْهِ الْمُشْرِكُونَ . وَالْمُرَاد أَنَّهُمْ يُخْبِرُونَ أَنَّهُمْ يَعْبُدُونَ اللَّه بِالتَّسْبِيحِ وَالصَّلَاة وَلَيْسُوا مَعْبُودِينَ وَلَا بَنَات اللَّه .</p></td></tr></table></body></html>
