<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنْ كَانُوا لَيَقُولُونَ</font></td></tr><tr><td align=right dir=rtl><p>عَادَ إِلَى الْإِخْبَار عَنْ قَوْل الْمُشْرِكِينَ , أَيْ كَانُوا قَبْل بَعْثَة مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ إِذَا عُيِّرُوا بِالْجَهْلِ قَالُوا : " لَوْ أَنَّ عِنْدَنَا ذِكْرًا مِنْ الْأَوَّلِينَ "</p></td></tr></table></body></html>
