<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ جُنْدَنَا لَهُمُ الْغَالِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>عَلَى الْمَعْنَى وَلَوْ كَانَ عَلَى اللَّفْظ لَكَانَ هُوَ الْغَالِب مِثْل " جُنْدٌ مَا هُنَالِكَ مَهْزُوم مِنْ الْأَحْزَاب " [ ص : 11 ] . وَقَالَ الشَّيْبَانِيّ : جَاءَ هَاهُنَا عَلَى الْجَمْع مِنْ أَجْل أَنَّهُ رَأْس آيَة .</p></td></tr></table></body></html>
