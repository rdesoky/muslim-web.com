<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذَا ذِكْرٌ</font></td></tr><tr><td align=right dir=rtl><p>بِمَعْنَى هَذَا ذِكْر جَمِيل فِي الدُّنْيَا وَشَرَف يَذْكُرُونَ بِهِ فِي الدُّنْيَا أَبَدًا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ لِلْمُتَّقِينَ لَحُسْنَ مَآبٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَهُمْ مَعَ هَذَا الذِّكْر الْجَمِيل فِي الدُّنْيَا حُسْن الْمَرْجِع فِي الْقِيَامَة .</p></td></tr></table></body></html>
