<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا لَرِزْقُنَا مَا لَهُ مِنْ نَفَادٍ</font></td></tr><tr><td align=right dir=rtl><p>دَلِيل عَلَى أَنَّ نَعِيم الْجَنَّة دَائِم لَا يَنْقَطِع ; كَمَا قَالَ : " عَطَاء غَيْر مَجْذُوذ " [ هُود : 108 ] وَقَالَ : " لَهُمْ أَجْر غَيْر مَمْنُون " [ التِّين : 6 ] .</p></td></tr></table></body></html>
