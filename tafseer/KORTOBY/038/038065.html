<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ إِنَّمَا أَنَا مُنْذِرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُخَوِّفٌ عِقَابَ اللَّه لِمَنْ عَصَاهُ وَقَدْ تَقَدَّمَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا مِنْ إِلَهٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَعْبُود</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا اللَّهُ الْوَاحِدُ الْقَهَّارُ</font></td></tr><tr><td align=right dir=rtl><p>الَّذِي لَا شَرِيك لَهُ</p></td></tr></table></body></html>
