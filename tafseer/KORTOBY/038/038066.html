<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا</font></td></tr><tr><td align=right dir=rtl><p>بِالرَّفْعِ عَلَى النَّعْت وَإِنْ نَصَبْت الْأَوَّل نَصَبْته . وَيَجُوز رَفْع الْأَوَّل وَنَصْب مَا بَعْده عَلَى الْمَدْح .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْعَزِيزُ</font></td></tr><tr><td align=right dir=rtl><p>مَعْنَاهُ الْمَنِيع الَّذِي لَا مِثْل لَهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْغَفَّارُ</font></td></tr><tr><td align=right dir=rtl><p>السَّتَّار لِذُنُوبِ خَلْقه .</p></td></tr></table></body></html>
