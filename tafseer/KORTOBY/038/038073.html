<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَجَدَ الْمَلَائِكَةُ كُلُّهُمْ أَجْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اِمْتَثَلُوا الْأَمْر وَسَجَدُوا لَهُ خُضُوعًا لَهُ وَتَعْظِيمًا لِلَّهِ بِتَعْظِيمِهِ</p></td></tr></table></body></html>
