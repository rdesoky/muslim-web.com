<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ عَلَيْكَ لَعْنَتِي</font></td></tr><tr><td align=right dir=rtl><p>أَيْ طَرْدِي وَإِبْعَادِي مِنْ رَحْمَتِي</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِلَى يَوْمِ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p>تَعْرِيف بِإِصْرَارِهِ عَلَى الْكُفْر ; لِأَنَّ اللَّعْن مُنْقَطِع حِينَئِذٍ , ثُمَّ بِدُخُولِهِ النَّار يَظْهَر تَحْقِيق اللَّعْن</p></td></tr></table></body></html>
