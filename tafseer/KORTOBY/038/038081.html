<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى يَوْمِ الْوَقْتِ الْمَعْلُومِ</font></td></tr><tr><td align=right dir=rtl><p>أُخِّرَ إِلَى وَقْت مَعْلُوم , وَهُوَ يَوْم يَمُوت الْخَلْق فِيهِ</p></td></tr></table></body></html>
