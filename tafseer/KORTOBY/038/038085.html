<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَأَمْلَأَنَّ جَهَنَّمَ مِنْكَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ نَفْسك وَذُرِّيَّتك</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ بَنِي آدَم " أَجْمَعِينَ " .</p></td></tr></table></body></html>
