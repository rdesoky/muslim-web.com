<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَهُ دِينِي</font></td></tr><tr><td align=right dir=rtl><p>" اللَّه " نَصْب بِـ " أَعْبُدُ " , " مُخْلِصًا لَهُ دِينِي " طَاعَتِي وَعِبَادَتِي .</p></td></tr></table></body></html>
