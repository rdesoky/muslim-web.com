<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَذَّبَ قَبْلهمْ أَقْوَام كَانُوا أَشَدّ مِنْ هَؤُلَاءِ بَطْشًا وَأَكْثَر أَمْوَالًا وَأَوْلَادًا وَأَوْسَعَ عَيْشًا , فَأَهْلَكْتهمْ كَثَمُودَ وَعَادٍ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَأَتَاهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ حَيْثُ ظَنُّوا أَنَّهُمْ فِي أَمَان</p></td></tr></table></body></html>
