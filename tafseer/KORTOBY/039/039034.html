<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُمْ مَا يَشَاءُونَ عِنْدَ رَبِّهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ النَّعِيم فِي الْجَنَّة , كَمَا يُقَال : لَك إِكْرَامٌ عِنْدِي ; أَيْ يَنَالُك مِنِّي ذَلِكَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ جَزَاءُ الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>الثَّنَاء فِي الدُّنْيَا وَالثَّوَاب فِي الْآخِرَة .</p></td></tr></table></body></html>
