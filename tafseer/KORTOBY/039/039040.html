<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُهِينُهُ وَيُذِلُّهُ أَيْ فِي الدُّنْيَا وَذَلِكَ بِالْجُوعِ وَالسَّيْف .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَيَحِلُّ عَلَيْهِ عَذَابٌ مُقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي الْآخِرَة</p></td></tr></table></body></html>
