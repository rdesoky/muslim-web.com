<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَوُفِّيَتْ كُلُّ نَفْسٍ مَا عَمِلَتْ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ خَيْر أَوْ شَرّ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ أَعْلَمُ بِمَا يَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فِي الدُّنْيَا وَلَا حَاجَة بِهِ عَزَّ وَجَلَّ إِلَى كِتَاب وَلَا إِلَى شَاهِد , وَمَعَ ذَلِكَ فَتَشْهَد الْكُتُب وَالشُّهُود إِلْزَامًا لِلْحُجَّةِ .</p></td></tr></table></body></html>
