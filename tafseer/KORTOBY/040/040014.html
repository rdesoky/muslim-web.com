<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَادْعُوا اللَّهَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ اُعْبُدُوهُ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مُخْلِصِينَ لَهُ الدِّينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْعِبَادَة . وَقِيلَ : الطَّاعَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ كَرِهَ الْكَافِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>عِبَادَة اللَّه فَلَا تَعْبُدُوا أَنْتُمْ غَيْره .</p></td></tr></table></body></html>
