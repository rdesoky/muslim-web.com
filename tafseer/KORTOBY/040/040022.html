<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ بِأَنَّهُمْ كَانَتْ تَأْتِيهِمْ رُسُلُهُمْ بِالْبَيِّنَاتِ فَكَفَرُوا فَأَخَذَهُمُ اللَّهُ إِنَّهُ قَوِيٌّ شَدِيدُ الْعِقَابِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هَذَا الْعَذَاب لَهُمْ بِكُفْرِهِمْ بِالرُّسُلِ تَأْتِيهِمْ " بِالْبَيِّنَاتِ " أَيْ بِالدَّلَائِلِ الْوَاضِحَة . فَكَفَرُوا بِهَا</p></td></tr></table></body></html>
