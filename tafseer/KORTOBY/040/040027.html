<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى إِنِّي عُذْتُ بِرَبِّي وَرَبِّكُمْ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا هَدَّدَهُ فِرْعَوْن بِالْقَتْلِ اِسْتَعَاذَ مُوسَى بِاَللَّهِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِنْ كُلِّ مُتَكَبِّرٍ لَا يُؤْمِنُ بِيَوْمِ الْحِسَابِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُتَعَظِّم عَنْ الْإِيمَان بِاَللَّهِ , وَصِفَتُهُ أَنَّهُ " لَا يُؤْمِن بِيَوْمِ الْحِسَاب " .</p></td></tr></table></body></html>
