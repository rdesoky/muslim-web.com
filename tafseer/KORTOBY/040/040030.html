<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ الَّذِي آمَنَ يَا</font></td></tr><tr><td align=right dir=rtl><p>زَادَهُمْ فِي الْوَعْظ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قَوْمِ إِنِّي أَخَافُ عَلَيْكُمْ مِثْلَ يَوْمِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَيَّام الْعَذَاب الَّتِي عُذِّبَ فِيهَا الْمُتَحَزِّبُونَ عَلَى الْأَنْبِيَاء الْمَذْكُورِينَ فِيمَا بَعْد .</p></td></tr></table></body></html>
