<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَدْعُونَنِي لِأَكْفُرَ بِاللَّهِ وَأُشْرِكَ بِهِ مَا لَيْسَ لِي بِهِ عِلْمٌ</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ فِرْعَوْن</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَا أَدْعُوكُمْ إِلَى الْعَزِيزِ</font></td></tr><tr><td align=right dir=rtl><p>الْمَنِيع الَّذِي لَا مِثْل لَهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْغَفَّارِ</font></td></tr><tr><td align=right dir=rtl><p>السَّتَّار لِذُنُوبِ خَلْقه .</p></td></tr></table></body></html>
