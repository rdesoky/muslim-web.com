<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هُدًى</font></td></tr><tr><td align=right dir=rtl><p>بَدَل مِنْ الْكِتَاب وَيَجُوز بِمَعْنَى هُوَ هُدًى ; يَعْنِي ذَلِكَ الْكِتَاب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَذِكْرَى لِأُولِي الْأَلْبَابِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَوْعِظَة لِأَصْحَابِ الْعُقُول .</p></td></tr></table></body></html>
