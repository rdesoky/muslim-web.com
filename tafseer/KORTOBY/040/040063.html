<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ يُؤْفَكُ الَّذِينَ كَانُوا بِآيَاتِ اللَّهِ يَجْحَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>" كَذَلِكَ يُؤْفَك " يُصْرَف عَنْ الْحَقّ الَّذِينَ كَانُوا بِآيَاتِ اللَّه يَجْحَدُونَ .</p></td></tr></table></body></html>
