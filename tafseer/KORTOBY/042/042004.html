<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَهُوَ الْعَلِيُّ الْعَظِيمُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْمُلْكِ فَهُوَ مَالِك الْجَمِيع وَرَبّه</p></td></tr></table></body></html>
