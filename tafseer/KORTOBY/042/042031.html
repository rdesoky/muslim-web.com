<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتُمْ بِمُعْجِزِينَ فِي الْأَرْضِ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِفَائِتِينَ اللَّه ; أَيْ لَنْ تَعْجِزُوهُ وَلَنْ تَفُوتُوهُ " وَمَا لَكُمْ مِنْ دُون اللَّه مِنْ وَلِيّ وَلَا نَصِير " تَقَدَّمَ فِي غَيْر مَوْضِع .</p></td></tr></table></body></html>
