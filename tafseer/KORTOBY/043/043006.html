<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَمْ أَرْسَلْنَا مِنْ نَبِيٍّ فِي الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>" كَمْ " هُنَا خَبَرِيَّة وَالْمُرَاد بِهَا التَّكْثِير ; وَالْمَعْنَى مَا أَكْثَر مَا أَرْسَلْنَا مِنْ الْأَنْبِيَاء . كَمَا قَالَ : " كَمْ تَرَكُوا مِنْ جَنَّات وَعُيُون " [ الدُّخَان : 25 ] أَيْ مَا أَكْثَر مَا تَرَكُوا .</p></td></tr></table></body></html>
