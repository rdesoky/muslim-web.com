<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَانْتَقَمْنَا مِنْهُمْ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>" فَانْتَقَمْنَا مِنْهُمْ " بِالْقَحْطِ وَالْقَتْل وَالسَّبْي</p><p>" فَانْظُرْ كَيْف كَانَ عَاقِبَة الْمُكَذِّبِينَ " آخِر أَمْر مَنْ كَذَّبَ الرُّسُل .</p></td></tr></table></body></html>
