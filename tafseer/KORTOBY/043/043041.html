<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِمَّا نَذْهَبَنَّ بِكَ فَإِنَّا مِنْهُمْ مُنْتَقِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " فَإِمَّا نَذْهَبَن بِك " يُرِيد أُخْرِجَنك مِنْ مَكَّة مِنْ أَذَى قُرَيْش .</p><p>" فَإِنَّا مِنْهُمْ مُنْتَقِمُونَ .</p></td></tr></table></body></html>
