<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاسْتَمْسِكْ بِالَّذِي أُوحِيَ إِلَيْكَ إِنَّكَ عَلَى صِرَاطٍ مُسْتَقِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى " فَاسْتَمْسِكْ بِاَلَّذِي أُوحِيَ إِلَيْك " يُرِيد الْقُرْآن , يُرِيد الْقُرْآن , وَإِنْ كَذَّبَ بِهِ مَنْ كَذَّبَ ; ف " إِنَّك عَلَى صِرَاط مُسْتَقِيم " يُوصِلك إِلَى اللَّه وَرِضَاهُ وَثَوَابه .</p></td></tr></table></body></html>
