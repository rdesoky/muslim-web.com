<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَهُمْ بِآيَاتِنَا إِذَا هُمْ مِنْهَا يَضْحَكُونَ</font></td></tr><tr><td align=right dir=rtl><p>اِسْتِهْزَاء وَسُخْرِيَة ; يُوهِمُونَ أَتْبَاعهمْ أَنَّ تِلْكَ الْآيَات سِحْر وَتَخْيِيل , وَأَنَّهُمْ قَادِرُونَ عَلَيْهَا .</p></td></tr></table></body></html>
