<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ هُوَ رَبِّي وَرَبُّكُمْ فَاعْبُدُوهُ هَذَا صِرَاطٌ مُسْتَقِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عِبَادَة اللَّه صِرَاط مُسْتَقِيم , وَمَا سِوَاهُ مُعْوَجّ لَا يُؤَدِّي سَالِكه إِلَى الْحَقّ .</p></td></tr></table></body></html>
