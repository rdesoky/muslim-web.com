<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُجْرِمِينَ فِي عَذَابِ جَهَنَّمَ خَالِدُونَ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ أَحْوَال أَهْل الْجَنَّة ذَكَرَ أَحْوَال أَهْل النَّار أَيْضًا لِيُبَيِّن فَضْل الْمُطِيع عَلَى الْعَاصِي .</p></td></tr></table></body></html>
