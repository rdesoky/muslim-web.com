<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنَّى لَهُمُ الذِّكْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ أَيْنَ يَكُون لَهُمْ التَّذَكُّر وَالِاتِّعَاظ عِنْد حُلُول الْعَذَاب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَقَدْ جَاءَهُمْ رَسُولٌ مُبِينٌ</font></td></tr><tr><td align=right dir=rtl><p>يُبَيِّن لَهُمْ الْحَقّ , وَالذِّكْرَى وَالذِّكْر وَاحِد ; قَالَهُ الْبُخَارِيّ .</p></td></tr></table></body></html>
