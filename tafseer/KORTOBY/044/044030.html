<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ الْمُهِينِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي مَا كَانَتْ الْقِبْط تَفْعَل بِهِمْ بِأَمْرِ فِرْعَوْن , مِنْ قَتْل الْأَبْنَاء وَاسْتِخْدَام النِّسَاء , وَاسْتِعْبَادهمْ إِيَّاهُمْ وَتَكَلُّفهمْ الْأَعْمَال الشَّاقَّة .</p></td></tr></table></body></html>
