<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا لَاعِبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ غَافِلِينَ , قَالَهُ مُقَاتِل . وَقِيلَ : لَاهِينَ ; وَهُوَ قَوْل الْكَلْبِيّ .</p></td></tr></table></body></html>
