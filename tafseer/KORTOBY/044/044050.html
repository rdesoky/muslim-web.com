<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ هَذَا مَا كُنْتُمْ بِهِ تَمْتَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَقُول لَهُمْ الْمَلَائِكَة : إِنَّ هَذَا مَا كُنْتُمْ تَشُكُّونَ فِيهِ فِي الدُّنْيَا .</p></td></tr></table></body></html>
