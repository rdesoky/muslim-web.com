<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَدْعُونَ فِيهَا بِكُلِّ فَاكِهَةٍ آمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ قَتَادَة : " آمِنِينَ " مِنْ الْمَوْت وَالْوَصَب وَالشَّيْطَان . وَقِيلَ : آمِنِينَ مِنْ اِنْقِطَاع مَا هُمْ فِيهِ مِنْ النَّعِيم , أَوْ مِنْ أَنْ يَنَالهُمْ مِنْ أَكْلهَا أَذًى أَوْ مَكْرُوه .</p></td></tr></table></body></html>
