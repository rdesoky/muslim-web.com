<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ</font></td></tr><tr><td align=right dir=rtl><p>" حم " مُبْتَدَأ و " تَنْزِيل " خَبَره .</p><p>وَقَالَ بَعْضهمْ : " حم " اِسْم السُّورَة . و " تَنْزِيل الْكِتَاب " مُبْتَدَأ . وَخَبَره " مِنْ اللَّه " . وَالْكِتَاب الْقُرْآن .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْعَزِيزِ</font></td></tr><tr><td align=right dir=rtl><p>الْمَنِيع .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>الْحَكِيم فِي فِعْله</p></td></tr></table></body></html>
