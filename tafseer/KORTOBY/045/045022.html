<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَخَلَقَ اللَّهُ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْأَمْرِ الْحَقّ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلِتُجْزَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَلِكَيْ تُجْزَى .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كُلُّ نَفْسٍ بِمَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي الْآخِرَة .</p></td></tr></table></body></html>
