<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبَدَا لَهُمْ سَيِّئَاتُ مَا عَمِلُوا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ظَهَرَ لَهُمْ جَزَاء سَيِّئَات مَا عَمِلُوا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَحَاقَ بِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نَزَلَ بِهِمْ وَأَحَاطَ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مَا كَانُوا بِهِ يَسْتَهْزِئُونَ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ عَذَاب اللَّه .</p></td></tr></table></body></html>
