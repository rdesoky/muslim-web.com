<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقِيلَ الْيَوْمَ نَنْسَاكُمْ كَمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَذَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نَتْرُككُمْ فِي النَّار كَمَا تَرَكْتُمْ لِقَاء يَوْمكُمْ هَذَا أَيْ تَرَكْتُمْ الْعَمَل لَهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَأْوَاكُمُ النَّارُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَسْكَنكُمْ وَمُسْتَقَرّكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا لَكُمْ مِنْ نَاصِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>مَنْ يَنْصُركُمْ .</p></td></tr></table></body></html>
