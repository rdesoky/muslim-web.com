<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلِلَّهِ الْحَمْدُ رَبِّ السَّمَاوَاتِ وَرَبِّ الْأَرْضِ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَرَأَ مُجَاهِد وَحُمَيْد وَابْن مُحَيْصِن " رَبّ السَّمَوَات وَرَبّ الْأَرْض رَبّ الْعَالَمِينَ " بِالرَّفْعِ فِيهَا كُلّهَا عَلَى مَعْنَى هُوَ رَبّ .</p></td></tr></table></body></html>
