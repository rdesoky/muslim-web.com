<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَهُ الْكِبْرِيَاءُ فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْعَظَمَة وَالْجَلَال وَالْبَقَاء وَالسُّلْطَان وَالْقُدْرَة وَالْكَمَال . " فِي السَّمَوَات وَالْأَرْض وَهُوَ الْعَزِيز الْحَكِيم " وَاَللَّه أَعْلَم . خَتْم تَفْسِير سُورَة الْجَاثِيَة , وَالْحَمْد لِلَّهِ .</p></td></tr></table></body></html>
