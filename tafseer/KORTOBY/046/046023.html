<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنَّمَا الْعِلْمُ</font></td></tr><tr><td align=right dir=rtl><p>بِوَقْتِ مَجِيء الْعَذَاب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>عِنْدَ اللَّهِ</font></td></tr><tr><td align=right dir=rtl><p>لَا عِنْدِي</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأُبَلِّغُكُمْ مَا أُرْسِلْتُ بِهِ</font></td></tr><tr><td align=right dir=rtl><p>عَنْ رَبّكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَكِنِّي أَرَاكُمْ قَوْمًا تَجْهَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>فِي سُؤَالكُمْ اِسْتِعْجَال الْعَذَاب .</p></td></tr></table></body></html>
