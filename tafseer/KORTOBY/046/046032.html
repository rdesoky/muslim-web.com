<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَنْ لَا يُجِبْ دَاعِيَ اللَّهِ فَلَيْسَ بِمُعْجِزٍ فِي الْأَرْضِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَفُوت اللَّه وَلَا يَسْبِقهُ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَيْسَ لَهُ مِنْ دُونِهِ أَوْلِيَاءُ أُولَئِكَ فِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَنْصَار يَمْنَعُونَهُ مِنْ عَذَاب اللَّه . " أُولَئِكَ فِي ضَلَال مُبِين " .</p></td></tr></table></body></html>
