<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ وَكَانَ اللَّهُ غَفُورًا رَحِيمًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هُوَ غَنِيّ عَنْ عِبَاده , وَإِنَّمَا اِبْتَلَاهُمْ بِالتَّكْلِيفِ لِيُثِيبَ مَنْ آمَنَ وَيُعَاقِب مَنْ كَفَرَ وَعَصَى .</p></td></tr></table></body></html>
