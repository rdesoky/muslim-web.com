<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَضْلًا مِنَ اللَّهِ وَنِعْمَةً</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَعَلَ اللَّه ذَلِكَ بِكُمْ فَضْلًا , أَيْ الْفَضْل وَالنِّعْمَة , فَهُوَ مَفْعُول لَهُ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ عَلِيمٌ حَكِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>" عَلِيم " بِمَا يُصْلِحكُمْ " حَكِيم " فِي تَدْبِيركُمْ .</p></td></tr></table></body></html>
