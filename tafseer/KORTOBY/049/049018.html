<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ اللَّهَ يَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ بَصِيرٌ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَرَأَ اِبْن كَثِير وَابْن مُحَيْصِن وَأَبُو عَمْرو بِالْيَاءِ عَلَى الْخَبَر , رَدًّا عَلَى قَوْله : " قَالَتْ الْأَعْرَاب " . الْبَاقُونَ بِالتَّاء عَلَى الْخِطَاب</p></td></tr></table></body></html>
