<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَسْمَعُونَ الصَّيْحَةَ بِالْحَقِّ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي صَيْحَة الْبَعْث . وَمَعْنَى " الْخُرُوج " الِاجْتِمَاع إِلَى الْحِسَاب .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>ذَلِكَ يَوْمُ الْخُرُوجِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَوْم الْخُرُوج مِنْ الْقُبُور .</p></td></tr></table></body></html>
