<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا تُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّذِي تُوعَدُونَهُ مِنْ الْخَيْر وَالشَّرّ وَالثَّوَاب وَالْعِقَاب</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَصَادِقٌ</font></td></tr><tr><td align=right dir=rtl><p>لَا كَذِب فِيهِ ; وَمَعْنَى " لَصَادِق " لَصِدْق ; وَقَعَ الِاسْم مَوْقِع الْمَصْدَر .</p></td></tr></table></body></html>
