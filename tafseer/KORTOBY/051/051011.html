<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ هُمْ فِي غَمْرَةٍ سَاهُونَ</font></td></tr><tr><td align=right dir=rtl><p>الْغَمْرَة مَا سَتَرَ الشَّيْء وَغَطَّاهُ . وَمِنْهُ نَهَر غَمْر أَيْ يَغْمُر مَنْ دَخَلَهُ , وَمِنْهُ غَمَرَات الْمَوْت . " سَاهُونَ " أَيْ لَاهُونَ غَافِلُونَ عَنْ أَمْر الْآخِرَة .</p></td></tr></table></body></html>
