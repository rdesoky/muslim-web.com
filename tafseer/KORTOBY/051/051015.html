<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ مَآل الْكُفَّار ذَكَرَ مَآل الْمُؤْمِنِينَ أَيْ هُمْ فِي بَسَاتِين فِيهَا عُيُون جَارِيَة عَلَى نِهَايَة مَا يُتَنَزَّه بِهِ .</p></td></tr></table></body></html>
