<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخْرَجْنَا مَنْ كَانَ فِيهَا مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَمَّا أَرَدْنَا إِهْلَاك قَوْم لُوط أَخْرَجْنَا مَنْ كَانَ فِي قَوْمه مِنْ الْمُؤْمِنِينَ ; لِئَلَّا يُهْلَك الْمُؤْمِنُونَ , وَذَلِكَ قَوْله تَعَالَى : " فَأَسْرِ بِأَهْلِك " [ هُود : 81 ] .</p></td></tr></table></body></html>
