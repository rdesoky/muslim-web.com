<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذْنَاهُ وَجُنُودَهُ</font></td></tr><tr><td align=right dir=rtl><p>لِكُفْرِهِمْ وَتَوَلِّيهمْ عَنْ الْإِيمَان .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَنَبَذْنَاهُمْ فِي الْيَمِّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ طَرَحْنَاهُمْ فِي الْبَحْر</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ مُلِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي فِرْعَوْن , لِأَنَّهُ أَتَى مَا يُلَام عَلَيْهِ .</p></td></tr></table></body></html>
