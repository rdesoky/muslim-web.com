<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمْدَدْنَاهُمْ بِفَاكِهَةٍ وَلَحْمٍ مِمَّا يَشْتَهُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَكْثَرْنَا لَهُمْ مِنْ ذَلِكَ زِيَادَة مِنْ اللَّه , أَمَدَّهُمْ بِهَا غَيْر الَّذِي كَانَ لَهُمْ .</p></td></tr></table></body></html>
