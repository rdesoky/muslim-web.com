<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّا كُنَّا قَبْلُ فِي أَهْلِنَا مُشْفِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ قَالَ كُلّ مَسْئُول مِنْهُمْ لِسَائِلِهِ : " إِنَّا كُنَّا قَبْل " أَيْ فِي الدُّنْيَا خَائِفِينَ وَجِلِينَ مِنْ عَذَاب اللَّه .</p></td></tr></table></body></html>
