<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ خَلَقُوا السَّمَاوَاتِ وَالْأَرْضَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَيْسَ الْأَمْر كَذَلِكَ فَإِنَّهُمْ لَمْ يَخْلُقُوا شَيْئًا</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بَل لَا يُوقِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>بِالْحَقِّ</p></td></tr></table></body></html>
