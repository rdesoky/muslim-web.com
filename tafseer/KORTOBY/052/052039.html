<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَهُ الْبَنَاتُ وَلَكُمُ الْبَنُونَ</font></td></tr><tr><td align=right dir=rtl><p>سَفَّهُ أَحْلَامهمْ تَوْبِيخًا لَهُمْ وَتَقْرِيعًا . أَيْ أَتُضِيفُونَ إِلَى اللَّه الْبَنَات مَعَ أَنَفَتكُمْ مِنْهُنَّ , وَمَنْ كَانَ عَقْله هَكَذَا فَلَا يُسْتَبْعَد مِنْهُ إِنْكَار الْبَعْث .</p></td></tr></table></body></html>
