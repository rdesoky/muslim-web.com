<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ تَسْأَلُهُمْ أَجْرًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَلَى تَبْلِيغ الرِّسَالَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَهُمْ مِنْ مَغْرَمٍ مُثْقَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَهُمْ مِنْ الْمَغْرَم الَّذِي تَطْلُبهُمْ بِهِ " مُثْقَلُونَ " مُجْهَدُونَ لِمَا كَلَّفْتهمْ بِهِ .</p></td></tr></table></body></html>
