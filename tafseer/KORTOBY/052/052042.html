<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ يُرِيدُونَ كَيْدًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَكْرًا بِك فِي دَار النَّدْوَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَالَّذِينَ كَفَرُوا هُمُ الْمَكِيدُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمَمْكُور بِهِمْ " وَلَا يَحِيق الْمَكْر السَّيِّئ إِلَّا بِأَهْلِهِ " [ فَاطِر : 43 ] وَذَلِكَ أَنَّهُمْ قُتِلُوا بِبَدْرٍ .</p></td></tr></table></body></html>
