<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَّمَهُ شَدِيدُ الْقُوَى</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي جِبْرِيل عَلَيْهِ السَّلَام فِي قَوْل سَائِر الْمُفَسِّرِينَ ; سِوَى الْحَسَن فَإِنَّهُ قَالَ : هُوَ اللَّه عَزَّ وَجَلَّ , وَيَكُون قَوْله تَعَالَى :</p></td></tr></table></body></html>
