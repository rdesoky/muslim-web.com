<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَكُمُ الذَّكَرُ وَلَهُ الْأُنْثَى</font></td></tr><tr><td align=right dir=rtl><p>قَالَ عَلَى جِهَة التَّقْرِيع وَالتَّوْبِيخ : " أَلَكُمْ الذَّكَر وَلَهُ الْأُنْثَى " رَدًّا عَلَيْهِمْ قَوْلهمْ : الْمَلَائِكَة بَنَات اللَّه , وَالْأَصْنَام بَنَات اللَّه .</p></td></tr></table></body></html>
