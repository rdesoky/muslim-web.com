<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَعْرِضْ عَنْ مَنْ تَوَلَّى عَنْ ذِكْرِنَا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن وَالْإِيمَان . وَهَذَا مَنْسُوخ بِآيَةِ السَّيْف .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَمْ يُرِدْ إِلَّا الْحَيَاةَ الدُّنْيَا</font></td></tr><tr><td align=right dir=rtl><p>نَزَلَتْ فِي النَّضْر . وَقِيلَ : فِي الْوَلِيد .</p></td></tr></table></body></html>
