<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّهُ خَلَقَ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنْثَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ أَوْلَاد آدَم وَلَمْ يُرِدْ آدَم وَحَوَّاء بِأَنَّهُمَا خُلِقَا مِنْ نُطْفَة .</p></td></tr></table></body></html>
