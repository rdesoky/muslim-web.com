<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَنَّ عَلَيْهِ النَّشْأَةَ الْأُخْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِعَادَة الْأَرْوَاح فِي الْأَشْبَاح لِلْبَعْثِ . وَقَرَأَ اِبْن كَثِير وَأَبُو عَمْرو " النَّشَاءَة " بِفَتْحِ الشِّين وَالْمَدّ ; أَيْ وَعَدَ ذَلِكَ وَوَعْده صِدْق .</p></td></tr></table></body></html>
