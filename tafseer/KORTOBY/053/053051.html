<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَثَمُودَ فَمَا أَبْقَى</font></td></tr><tr><td align=right dir=rtl><p>ثَمُود هُمْ قَوْم صَالِح أُهْلِكُوا بِالصَّيْحَةِ . قُرِئَ " ثَمُودًا " [ التَّوْبَة : 70 ] وَقَدْ تَقَدَّمَ . وَانْتَصَبَ عَلَى الْعَطْف عَلَى عَاد .</p></td></tr></table></body></html>
