<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنْذَارِي ; قَالَ الْفَرَّاء : إِنْذَارِي ; قَالَ مَصْدَرَانِ . وَقِيلَ : " نُذُرِ " جَمْع نَذِير وَنَذِير بِمَعْنَى الْإِنْذَار كَنَكِيرٍ بِمَعْنَى الْإِنْكَار .</p></td></tr></table></body></html>
