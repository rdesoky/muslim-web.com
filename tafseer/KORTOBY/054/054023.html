<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ ثَمُودُ بِالنُّذُرِ</font></td></tr><tr><td align=right dir=rtl><p>هُمْ قَوْم صَالِح كَذَّبُوا الرُّسُل وَنَبِيّهمْ , أَوْ كَذَّبُوا بِالْآيَاتِ الَّتِي هِيَ النُّذُر</p></td></tr></table></body></html>
