<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نِعْمَةً مِنْ عِنْدِنَا</font></td></tr><tr><td align=right dir=rtl><p>إِنْعَامًا مِنَّا عَلَى لُوط وَابْنَتَيْهِ ; فَهُوَ نُصِبَ لِأَنَّهُ مَفْعُول بِهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ نَجْزِي مَنْ شَكَرَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَنْ آمَنَ بِاَللَّهِ وَأَطَاعَهُ .</p></td></tr></table></body></html>
