<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ صَبَّحَهُمْ بُكْرَةً عَذَابٌ مُسْتَقِرٌّ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ دَائِم عَامّ اِسْتَقَرَّ فِيهِمْ حَتَّى يُفْضِي بِهِمْ إِلَى عَذَاب الْآخِرَة . وَذَلِكَ الْعَذَاب قَلْب قَرْيَتهمْ عَلَيْهِمْ وَجَعْل أَعْلَاهَا أَسْفَلهَا . و " بُكْرَة " هُنَا نَكِرَة فَلِذَلِكَ صُرِفَتْ .</p></td></tr></table></body></html>
