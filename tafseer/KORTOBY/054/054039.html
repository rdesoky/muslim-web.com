<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذُوقُوا عَذَابِي وَنُذُرِ</font></td></tr><tr><td align=right dir=rtl><p>الْعَذَاب الَّذِي نَزَلَ , بِهِمْ مِنْ طَمْس الْأَعْيُن غَيْر الْعَذَاب الَّذِي أُهْلِكُوا بِهِ فَلِذَلِكَ حَسُنَ التَّكْرِير .</p></td></tr></table></body></html>
