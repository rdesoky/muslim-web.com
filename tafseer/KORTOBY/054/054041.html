<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَقَدْ جَاءَ آلَ فِرْعَوْنَ النُّذُرُ</font></td></tr><tr><td align=right dir=rtl><p>" آل فِرْعَوْن " يَعْنِي الْقِبْط و " النُّذُر " مُوسَى وَهَارُون . وَقَدْ يُطْلَق لَفْظ الْجَمْع عَلَى الِاثْنَيْنِ .</p></td></tr></table></body></html>
