<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُجْرِمِينَ فِي ضَلَالٍ وَسُعُرٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي حَيْدَة عَنْ الْحَقّ و " سُعُر " أَيْ اِحْتِرَاق . وَقِيلَ : جُنُون عَلَى مَا تَقَدَّمَ فِي هَذِهِ السُّورَة .</p></td></tr></table></body></html>
