<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُّ صَغِيرٍ وَكَبِيرٍ مُسْتَطَرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كُلّ ذَنْب كَبِير وَصَغِير مَكْتُوب عَلَى عَامِله قَبْل أَنْ يَفْعَلهُ لِيُجَازَى بِهِ , وَمَكْتُوب إِذَا فَعَلَهُ ; سَطَرَ يَسْطُر سَطْرًا كَتَبَ ; وَاسْتَطَرَ مِثْله .</p></td></tr></table></body></html>
