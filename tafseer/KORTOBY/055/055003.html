<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خَلَقَ الْإِنْسَانَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس وَقَتَادَة وَالْحَسَن يَعْنِي آدَم عَلَيْهِ السَّلَام .</p></td></tr></table></body></html>
