<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ</font></td></tr><tr><td align=right dir=rtl><p>الْأَنَام النَّاس , عَنْ اِبْن عَبَّاس . الْحَسَن : الْجِنّ وَالْإِنْس . الضَّحَّاك : كُلّ مَا دَبَّ عَلَى وَجْه الْأَرْض , وَهَذَا عَامّ .</p></td></tr></table></body></html>
