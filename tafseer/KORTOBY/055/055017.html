<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هُوَ رَبّ الْمَشْرِقَيْنِ . وَفِي الصَّافَّات " وَرَبّ الْمَشَارِق " [ الصَّافَّات : 5 ] وَقَدْ مَضَى الْكَلَام فِي ذَلِكَ هُنَالِكَ .</p></td></tr></table></body></html>
