<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>هَذِهِ جَهَنَّمُ الَّتِي يُكَذِّبُ بِهَا الْمُجْرِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُقَال لَهُمْ هَذِهِ النَّار الَّتِي أُخْبِرْتُمْ بِهَا فَكَذَّبْتُمْ .</p></td></tr></table></body></html>
