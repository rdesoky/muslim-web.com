<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُنْتُمْ أَزْوَاجًا ثَلَاثَةً</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَصْنَافًا ثَلَاثَة كُلّ صِنْف يُشَاكِل مَا هُوَ مِنْهُ , كَمَا يُشَاكِل الزَّوْج الزَّوْجَة , ثُمَّ بَيَّنَ مَنْ هُمْ فَقَالَ : " فَأَصْحَاب الْمَيْمَنَة " " وَأَصْحَاب الْمَشْأَمَة " و " السَّابِقُونَ ".</p></td></tr></table></body></html>
