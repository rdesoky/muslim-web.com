<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَصْحَابُ الْمَيْمَنَةِ مَا أَصْحَابُ الْمَيْمَنَةِ</font></td></tr><tr><td align=right dir=rtl><p>فَأَصْحَاب الْمَيْمَنَة هُمْ الَّذِينَ يُؤْخَذ بِهِمْ ذَات الْيَمِين إِلَى الْجَنَّة</p></td></tr></table></body></html>
