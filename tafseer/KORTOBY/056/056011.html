<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ الْمُقَرَّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ صِفَتهمْ . وَقِيلَ : إِذَا خَرَجَ رَجُل مِنْ السَّابِقِينَ الْمُقَرَّبِينَ مِنْ مَنْزِله فِي الْجَنَّة كَانَ لَهُ ضَوْء يَعْرِفهُ بِهِ مَنْ دُونه .</p></td></tr></table></body></html>
