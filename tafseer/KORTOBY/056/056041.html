<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَصْحَابُ الشِّمَالِ مَا أَصْحَابُ الشِّمَالِ</font></td></tr><tr><td align=right dir=rtl><p>ذَكَرَ مَنَازِل أَهْل النَّار وَسَمَّاهُمْ أَصْحَاب الشِّمَال , لِأَنَّهُمْ يَأْخُذُونَ كُتُبهمْ بِشَمَائِلِهِمْ , ثُمَّ عَظَّمَ ذِكْرهمْ فِي الْبَلَاء وَالْعَذَاب فَقَالَ : " مَا أَصْحَاب الشِّمَال .</p></td></tr></table></body></html>
