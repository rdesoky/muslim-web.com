<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ كَانُوا قَبْلَ ذَلِكَ مُتْرَفِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّمَا اِسْتَحَقُّوا هَذِهِ الْعُقُوبَة لِأَنَّهُمْ كَانُوا فِي الدُّنْيَا مُتَنَعِّمِينَ بِالْحَرَامِ . وَالْمُتْرَف الْمُنَعَّم , عَنْ اِبْن عَبَّاس وَغَيْره . وَقَالَ السُّدِّيّ : " مُتْرَفِينَ " أَيْ مُشْرِكِينَ .</p></td></tr></table></body></html>
