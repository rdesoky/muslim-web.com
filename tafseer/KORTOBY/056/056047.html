<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَانُوا يَقُولُونَ أَئِذَا مِتْنَا وَكُنَّا تُرَابًا وَعِظَامًا أَئِنَّا لَمَبْعُوثُونَ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا اِسْتِبْعَاد مِنْهُمْ لِأَمْرِ الْبَعْث وَتَكْذِيب لَهُ .</p></td></tr></table></body></html>
