<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَمَجْمُوعُونَ إِلَى مِيقَاتِ يَوْمٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد يَوْم الْقِيَامَة . وَمَعْنَى الْكَلَام الْقَسَم وَدُخُول اللَّام فِي قَوْله تَعَالَى : " لَمَجْمُوعُونَ " هُوَ دَلِيل الْقَسَم فِي الْمَعْنَى , أَيْ إِنَّكُمْ لَمَجْمُوعُونَ قَسَمًا حَقًّا خِلَاف قَسَمكُمْ الْبَاطِل</p></td></tr></table></body></html>
