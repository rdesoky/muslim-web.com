<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَآكِلُونَ مِنْ شَجَرٍ مِنْ زَقُّومٍ</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ شَجَر كَرِيه الْمَنْظَر , كَرِيه الطَّعْم , وَهِيَ الَّتِي ذُكِرَتْ فِي سُورَة " وَالصَّافَّات " .</p></td></tr></table></body></html>
