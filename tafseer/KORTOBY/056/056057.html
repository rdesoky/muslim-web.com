<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَحْنُ خَلَقْنَاكُمْ فَلَوْلَا تُصَدِّقُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَهَلَّا تُصَدِّقُونَ بِالْبَعْثِ ؟ لِأَنَّ الْإِعَادَة كَالِابْتِدَاءِ . وَقِيلَ : الْمَعْنَى نَحْنُ خَلَقْنَا رِزْقكُمْ فَهَلَّا تُصَدِّقُونَ أَنَّ هَذَا طَعَامكُمْ إِنْ لَمْ تُؤْمِنُوا ؟</p></td></tr></table></body></html>
