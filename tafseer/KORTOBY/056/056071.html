<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَخْبِرُونِي عَنْ النَّار الَّتِي تُظْهِرُونَهَا بِالْقَدْحِ مِنْ الشَّجَر الرُّطَب</p></td></tr></table></body></html>
