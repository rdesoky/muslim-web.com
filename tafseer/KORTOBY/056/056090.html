<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا إِنْ كَانَ مِنْ أَصْحَابِ الْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنْ كَانَ هَذَا الْمُتَوَفَّى مِنْ أَصْحَاب الْيَمِين</p></td></tr></table></body></html>
