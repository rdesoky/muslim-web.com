<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَصْلِيَةُ جَحِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>بِكَسْرِ التَّاء أَيْ وَنُزُل مِنْ تَصْلِيَة جَحِيم . ثُمَّ أَدْغَمَ أَبُو عَمْرو التَّاء فِي الْجِيم وَهُوَ بَعِيد .</p></td></tr></table></body></html>
