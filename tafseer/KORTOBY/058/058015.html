<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَعَدَّ اللَّهُ لَهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لِهَؤُلَاءِ الْمُنَافِقِينَ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>عَذَابًا شَدِيدًا</font></td></tr><tr><td align=right dir=rtl><p>فِي جَهَنَّم وَهُوَ الدَّرْك الْأَسْفَل .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِئْسَ الْأَعْمَال أَعْمَالهمْ</p></td></tr></table></body></html>
