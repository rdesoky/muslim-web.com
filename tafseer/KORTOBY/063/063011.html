<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَنْ يُؤَخِّرَ اللَّهُ نَفْسًا إِذَا جَاءَ أَجَلُهَا وَاللَّهُ خَبِيرٌ بِمَا تَعْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>مِنْ خَيْر وَشَرّ . وَقِرَاءَة الْعَامَّة بِالتَّاءِ عَلَى الْخِطَاب . وَقَرَأَ أَبُو بَكْر عَنْ عَاصِم وَالسُّلَمِيّ بِالْيَاءِ ; عَلَى</p></td></tr></table></body></html>
