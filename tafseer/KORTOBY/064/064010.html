<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>أُولَئِكَ أَصْحَابُ النَّارِ خَالِدِينَ فِيهَا وَبِئْسَ الْمَصِيرُ</font></td></tr><tr><td align=right dir=rtl><p>لَمَّا ذَكَرَ مَا لِلْمُؤْمِنِينَ ذَكَرَ مَا لِلْكَافِرِينَ كَمَا تَقَدَّمَ فِي غَيْر مَوْضِع</p></td></tr></table></body></html>
