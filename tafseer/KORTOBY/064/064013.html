<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>اللَّهُ لَا إِلَهَ إِلَّا هُوَ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا مَعْبُود سِوَاهُ , وَلَا خَالِق غَيْره ; فَعَلَيْهِ تَوَكَّلُوا .</p></td></tr></table></body></html>
