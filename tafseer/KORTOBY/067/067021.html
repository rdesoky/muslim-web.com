<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ مَنْ هَذَا الَّذِي</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُعْطِيكُمْ مَنَافِع الدُّنْيَا . وَقِيلَ الْمَطَر مِنْ آلِهَتكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>يَرْزُقُكُمْ إِنْ أَمْسَكَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي اللَّه تَعَالَى رِزْقه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>رِزْقَهُ بَلْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَمَادَوْا وَأَصَرُّوا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَجُّوا فِي</font></td></tr><tr><td align=right dir=rtl><p>طُغْيَان</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>عُتُوٍّ</font></td></tr><tr><td align=right dir=rtl><p>عَنْ الْحَقّ .</p></td></tr></table></body></html>
