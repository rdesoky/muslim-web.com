<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ خَلَقَكُمْ فِي الْأَرْض ; قَالَهُ اِبْن عَبَّاس . وَقِيلَ : نَشَرَكُمْ فِيهَا وَفَرَّقَكُمْ عَلَى ظَهْرهَا ; قَالَهُ اِبْن شَجَرَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَيْهِ تُحْشَرُونَ</font></td></tr><tr><td align=right dir=rtl><p>حَتَّى يُجَازِيَ كُلًّا بِعَمَلِهِ .</p></td></tr></table></body></html>
