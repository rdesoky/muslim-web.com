<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَقُولُونَ مَتَى هَذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَتَى يَوْم الْقِيَامَة وَمَتَى هَذَا الْعَذَاب الَّذِي تَعِدُونَنَا بِهِ وَهَذَا اِسْتِهْزَاء مِنْهُمْ . وَقَدْ تَقَدَّمَ .</p></td></tr></table></body></html>
