<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَتُبْصِرُ وَيُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : مَعْنَاهُ فَسَتَعْلَمُ وَيَعْلَمُونَ يَوْم الْقِيَامَة . وَقِيلَ : فَسَتَرَى وَيَرَوْنَ يَوْم الْقِيَامَة حِين يَتَبَيَّن الْحَقّ وَالْبَاطِل .</p></td></tr></table></body></html>
