<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِنَّ اللَّه هُوَ الْعَالِم بِمَنْ حَادَ عَنْ دِينه .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّذِينَ هُمْ عَلَى الْهُدَى فَيُجَازِي كُلًّا غَدًا بِعَمَلِهِ .</p></td></tr></table></body></html>
