<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَنَادَوْا مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>" فَتَنَادَوْا مُصْبِحِينَ " يُنَادِي بَعْضهمْ بَعْضًا لَيَقْطَعُنَّ ثَمَرَ نَخِيلهمْ إِذَا أَصْبَحُوا بِسَدْفَةٍ مِنْ اللَّيْل لِئَلَّا يَنْتَبِه الْمَسَاكِين</p></td></tr></table></body></html>
