<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا سُبْحَانَ رَبِّنَا</font></td></tr><tr><td align=right dir=rtl><p>اِعْتَرَفُوا بِالْمَعْصِيَةِ وَنَزَّهُوا اللَّه عَنْ أَنْ يَكُونَ ظَالِمًا فِيمَا فَعَلَ . قَالَ اِبْن عَبَّاس فِي قَوْلهمْ : " سُبْحَانَ رَبّنَا " أَيْ نَسْتَغْفِر اللَّهَ مِنْ ذَنْبنَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كُنَّا ظَالِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>لِأَنْفُسِنَا فِي مَنْعنَا الْمَسَاكِين .</p></td></tr></table></body></html>
