<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَقْبَلَ بَعْضُهُمْ عَلَى بَعْضٍ يَتَلَاوَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَلُوم هَذَا هَذَا فِي الْقَسَم وَمَنْع الْمَسَاكِين , وَيَقُول : بَلْ أَنْتَ أَشَرْت عَلَيْنَا بِهَذَا .</p></td></tr></table></body></html>
