<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا يَا وَيْلَنَا إِنَّا كُنَّا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَاصِينَ بِمَنْعِ حَقّ الْفُقَرَاء وَتَرْك الِاسْتِثْنَاء . وَقَالَ اِبْن كَيْسَان : طَغَيْنَا نِعَم اللَّه فَلَمْ نَشْكُرهَا كَمَا شَكَرَهَا آبَاؤُنَا مِنْ قَبْل .</p></td></tr></table></body></html>
