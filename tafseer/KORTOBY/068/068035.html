<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَنَجْعَلُ الْمُسْلِمِينَ كَالْمُجْرِمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَالْكَفَّارِ . وَقَالَ اِبْن عَبَّاس وَغَيْره : قَالَتْ كُفَّار مَكَّة : إِنَّا نُعْطَى فِي الْآخِرَة خَيْرًا مِمَّا تُعْطَوْنَ ; فَنَزَلَتْ " أَفَنَجْعَل الْمُسْلِمِينَ كَالْمُجْرِمِينَ " .</p></td></tr></table></body></html>
