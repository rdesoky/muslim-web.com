<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا لَكُمْ كَيْفَ تَحْكُمُونَ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا الْحُكْم الْأَعْوَج ; كَأَنَّ أَمْر الْجَزَاء مُفَوَّض إِلَيْكُمْ حَتَّى تُحْكَمُوا فِيهِ بِمَا شِئْتُمْ أَنَّ لَكُمْ مِنْ الْخَيْر مَا لِلْمُسْلِمِينَ .</p></td></tr></table></body></html>
