<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خُذُوهُ فَغُلُّوهُ</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ : يَبْتَدِرهُ مِائَة أَلْف مَلَك ثُمَّ تُجْمَع يَده إِلَى عُنُقه وَهُوَ قَوْله عَزَّ وَجَلَّ : " فَغُلُّوهُ " أَيْ شُدُّوهُ بِالْأَغْلَالِ</p></td></tr></table></body></html>
