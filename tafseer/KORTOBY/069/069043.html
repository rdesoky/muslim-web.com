<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ هُوَ تَنْزِيل .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>مِنْ رَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ عَطْف عَلَى قَوْله : " إِنَّهُ لَقَوْل رَسُول كَرِيم " [ الْحَاقَّة : 40 ] , أَيْ إِنَّهُ لَقَوْل رَسُول كَرِيم , وَهُوَ تَنْزِيل مِنْ رَبّ الْعَالَمِينَ .</p></td></tr></table></body></html>
