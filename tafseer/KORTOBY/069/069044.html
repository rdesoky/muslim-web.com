<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ الْأَقَاوِيلِ</font></td></tr><tr><td align=right dir=rtl><p>"تَقُول " أَيْ تَكَلَّفَ وَأَتَى بِقَوْلٍ مِنْ قِبَل نَفْسه . وَقُرِئَ " وَلَوْ تَقَوَّلَ " عَلَى الْبِنَاء لِلْمَفْعُولِ .</p></td></tr></table></body></html>
