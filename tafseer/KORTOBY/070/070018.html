<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَمَعَ فَأَوْعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جَمَعَ الْمَالَ فَجَعَلَهُ فِي وِعَائِهِ وَمَنَعَ مِنْهُ حَقَّ اللَّه تَعَالَى ; فَكَانَ جَمُوعًا مَنُوعًا . قَالَ الْحَكَم : كَانَ عَبْد اللَّه بْن عُكَيْم لَا يَرْبِط كِيسَهُ وَيَقُول سَمِعْت اللَّهَ يَقُول : " وَجَمَعَ فَأَوْعَى " .</p></td></tr></table></body></html>
