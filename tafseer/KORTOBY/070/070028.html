<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اِبْن عَبَّاس : لِمَنْ أَشْرَكَ أَوْ كَذَّبَ أَنْبِيَاءَهُ . وَقِيلَ : لَا يَأْمَنهُ أَحَد , بَلْ الْوَاجِب عَلَى كُلّ أَحَد أَنْ يَخَافَهُ وَيُشْفِق مِنْهُ .</p></td></tr></table></body></html>
