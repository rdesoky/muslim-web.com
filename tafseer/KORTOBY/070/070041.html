<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى أَنْ نُبَدِّلَ خَيْرًا مِنْهُمْ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : نَقْدِر عَلَى إِهْلَاكهمْ وَالذَّهَاب بِهِمْ وَالْمَجِيء بِخَيْرٍ مِنْهُمْ فِي الْفَضْل وَالطَّوْع وَالْمَال .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَمَا نَحْنُ بِمَسْبُوقِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا يَفُوتنَا شَيْءٌ وَلَا يُعْجِزنَا أَمْر نُرِيدهُ .</p></td></tr></table></body></html>
