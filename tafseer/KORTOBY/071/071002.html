<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ يَا قَوْمِ إِنِّي لَكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُخَوِّف .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>نَذِيرٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُظْهِر لَكُمْ بِلِسَانِكُمْ الَّذِي تَعْرِفُونَهُ .</p></td></tr></table></body></html>
