<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ</font></td></tr><tr><td align=right dir=rtl><p>و " أَنْ " الْمُفَسِّرَة عَلَى مَا تَقَدَّمَ فِي " أَنْ أَنْذِرْ " . " اُعْبُدُوا " أَيْ وَحِّدُوا . وَاتَّقُوا : خَافُوا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِيمَا آمُركُمْ بِهِ , فَإِنِّي رَسُول اللَّه إِلَيْكُمْ .</p></td></tr></table></body></html>
