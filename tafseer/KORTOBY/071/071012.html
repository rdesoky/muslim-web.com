<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَلْ لَكُمْ جَنَّاتٍ وَيَجْعَلْ لَكُمْ أَنْهَارًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَدْ مَضَى فِي سُورَة " آل عِمْرَان " كَيْفِيَّة الِاسْتِغْفَار , وَإِنَّ ذَلِكَ يَكُون عَنْ إِخْلَاص وَإِقْلَاع مِنْ الذُّنُوب . وَهُوَ الْأَصْل فِي الْإِجَابَة .</p></td></tr></table></body></html>
