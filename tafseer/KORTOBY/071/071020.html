<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِتَسْلُكُوا مِنْهَا سُبُلًا فِجَاجًا</font></td></tr><tr><td align=right dir=rtl><p>السُّبُل : الطُّرُق . وَالْفِجَاج جَمْع فَجّ , وَهُوَ الطَّرِيق الْوَاسِعَة ; قَالَهُ الْفَرَّاء . وَقِيلَ : الْفَجّ الْمَسْلَك بَيْنَ الْجَبَلَيْنِ . وَقَدْ مَضَى فِي سُورَة " الْأَنْبِيَاء وَالْحَجّ " .</p></td></tr></table></body></html>
