<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الْقَاسِطُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْجَائِرُونَ عَنْ طَرِيق الْحَقّ وَالْإِيمَان</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَكَانُوا لِجَهَنَّمَ حَطَبًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَقُودًا . وَقَوْله : " فَكَانُوا " أَيْ فِي عِلْم اللَّه تَعَالَى .</p></td></tr></table></body></html>
