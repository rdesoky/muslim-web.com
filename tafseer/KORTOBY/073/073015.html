<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا أَرْسَلْنَا إِلَيْكُمْ رَسُولًا شَاهِدًا عَلَيْكُمْ</font></td></tr><tr><td align=right dir=rtl><p>يُرِيد النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَرْسَلَهُ إِلَى قُرَيْش</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>كَمَا أَرْسَلْنَا إِلَى فِرْعَوْنَ رَسُولًا</font></td></tr><tr><td align=right dir=rtl><p>وَهُوَ مُوسَى</p></td></tr></table></body></html>
