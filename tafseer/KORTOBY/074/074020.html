<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ قُتِلَ كَيْفَ قَدَّرَ</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ قُتِلَ " أَيْ لُعِنَ لَعْنًا بَعْدَ لَعْن . وَقِيلَ : فَقُتِلَ بِضَرْبٍ مِنْ الْعُقُوبَة , ثُمَّ قُتِلَ بِضَرْبٍ آخَر مِنْ الْعُقُوبَة</p><p>" كَيْفَ قَدَّرَ " أَيْ عَلَى أَيّ حَال قَدَّرَ .</p></td></tr></table></body></html>
