<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ أَدْبَرَ " أَيْ وَلَّى وَأَعْرَض ذَاهِبًا إِلَى أَهْله .</p><p>" وَاسْتَكْبَرَ " أَيْ تَعَظَّمَ عَنْ أَنْ يُؤْمِنَ . وَقِيلَ : أَدْبَرَ عَنْ الْإِيمَان وَاسْتَكْبَرَ حِينَ دُعِيَ إِلَيْهِ .</p></td></tr></table></body></html>
