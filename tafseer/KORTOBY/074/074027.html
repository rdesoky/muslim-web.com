<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا سَقَرُ</font></td></tr><tr><td align=right dir=rtl><p>هَذِهِ مُبَالَغَة فِي وَصْفهَا ; أَيْ وَمَا أَعْلَمَك أَيّ شَيْء هِيَ ؟ وَهِيَ كَلِمَة تَعْظِيم</p><p>وَكَرَّرَ اللَّفْظَ تَأْكِيدًا .</p></td></tr></table></body></html>
