<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَمْ نَكُ مِنَ الْمُصَلِّينَ</font></td></tr><tr><td align=right dir=rtl><p>" قَالُوا " يَعْنِي أَهْل النَّار " لَمْ نَكُ مِنْ الْمُصَلِّينَ " أَيْ الْمُؤْمِنِينَ الَّذِينَ يُصَلُّونَ .</p></td></tr></table></body></html>
