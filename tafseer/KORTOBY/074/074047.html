<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>حَتَّى أَتَانَا الْيَقِينُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ جَاءَنَا وَنَزَلَ بِنَا الْمَوْت ; وَمِنْهُ قَوْله تَعَالَى : " وَاعْبُدْ رَبَّك حَتَّى يَأْتِيَك الْيَقِين " [ الْحِجْر : 99 ] .</p></td></tr></table></body></html>
