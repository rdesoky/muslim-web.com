<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَظَنَّ أَنَّهُ الْفِرَاقُ</font></td></tr><tr><td align=right dir=rtl><p>" وَظَنَّ " أَيْ أَيْقَنَ الْإِنْسَان " أَنَّهُ الْفِرَاق " أَيْ فِرَاق الدُّنْيَا وَالْأَهْل وَالْمَال وَالْوَلَد , وَذَلِكَ حِينَ عَايَنَ الْمَلَائِكَة . قَالَ الشَّاعِر : <poem type=2><part>فِرَاق لَيْسَ يُشْبِههُ فِرَاق </part><part>قَدْ اِنْقَطَعَ الرَّجَاء عَنْ التَّلَاق</part></poem></p></td></tr></table></body></html>
