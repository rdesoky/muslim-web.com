<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّى</font></td></tr><tr><td align=right dir=rtl><p>" ثُمَّ كَانَ عَلَقَة " أَيْ دَمًا بَعْدَ النُّطْفَة , أَيْ قَدْ رَتَّبَهُ تَعَالَى بِهَذَا كُلّه عَلَى خِسَّة قَدْره .</p><p>ثُمَّ قَالَ : " فَخَلَقَ " أَيْ فَقَدَّرَ " فَسَوَّى " أَيْ فَسَوَّاهُ تَسْوِيَةً , وَعَدَّلَهُ تَعْدِيلًا , بِجَعْلِ الرُّوح فِيهِ</p></td></tr></table></body></html>
