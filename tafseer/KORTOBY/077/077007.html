<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّمَا تُوعَدُونَ لَوَاقِعٌ</font></td></tr><tr><td align=right dir=rtl><p>هَذَا جَوَاب مَا تَقَدَّمَ مِنْ الْقَسَم ; أَيْ مَا تُوعَدُونَ مِنْ أَمْر الْقِيَامَة لَوَاقِع بِكُمْ وَنَازِل عَلَيْكُمْ .</p></td></tr></table></body></html>
