<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا السَّمَاءُ فُرِجَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فُتِحَتْ وَشُقَّتْ ; وَمِنْهُ قَوْلُهُ تَعَالَى : " وَفُتِحَتْ السَّمَاء فَكَانَتْ أَبْوَابًا " [ النَّبَأ : 19 ] . وَرَوَى الضَّحَّاك عَنْ اِبْن عَبَّاس قَالَ : فُرِجَتْ لِلطَّيِّ .</p></td></tr></table></body></html>
