<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِأَيِّ يَوْمٍ أُجِّلَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أُخِّرَتْ , وَهَذَا تَعْظِيم لِذَلِكَ الْيَوْم فَهُوَ اِسْتِفْهَام عَلَى التَّعْظِيم .</p></td></tr></table></body></html>
