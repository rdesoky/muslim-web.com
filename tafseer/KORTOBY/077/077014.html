<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا يَوْمُ الْفَصْلِ</font></td></tr><tr><td align=right dir=rtl><p>أَتْبَعَ التَّعْظِيم تَعْظِيمًا ; أَيْ وَمَا أَعْلَمك مَا يَوْم الْفَصْل ؟</p></td></tr></table></body></html>
