<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نُهْلِكِ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَخْبَرَ عَنْ إِهْلَاك الْكُفَّار مِنْ الْأُمَم الْمَاضِينَ مِنْ لَدُنْ آدَم إِلَى مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ .</p></td></tr></table></body></html>
