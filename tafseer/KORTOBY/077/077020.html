<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نَخْلُقْكُمْ مِنْ مَاءٍ مَهِينٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ضَعِيف حَقِير وَهُوَ النُّطْفَة قَالَ الزَّجَّاج : " مِنْ مَاء مَهِين " ضَعِيف . وَقَالَ غَيْره : " مَهِين " لَا خَطَر لَهُ عِنْد النَّاس . وَهَذِهِ الْآيَة أَصْل لِمَنْ قَالَ : إِنَّ خَلْق الْجَنِين إِنَّمَا هُوَ مِنْ مَاء الرَّجُل وَحْده .</p></td></tr></table></body></html>
