<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>انْطَلِقُوا إِلَى مَا كُنْتُمْ بِهِ تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يُقَال لِلْكُفَّارِ سِيرُوا " إِلَى مَا كُنْتُمْ بِهِ تُكَذِّبُونَ " مِنْ الْعَذَاب يَعْنِي النَّار , فَقَدْ شَاهَدْتُمُوهَا عِيَانًا .</p></td></tr></table></body></html>
