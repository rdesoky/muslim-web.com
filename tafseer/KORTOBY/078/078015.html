<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا</font></td></tr><tr><td align=right dir=rtl><p>" لِنُخْرِج بِهِ " أَيْ بِذَلِكَ الْمَاء " حَبًّا " كَالْحِنْطَةِ وَالشَّعِير وَغَيْر ذَلِكَ " وَنَبَاتًا " مِنْ الْأَبِّ , وَهُوَ مَا تَأْكُلُهُ الدَّوَابُّ مِنْ الْحَشِيش .</p></td></tr></table></body></html>
