<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَقْتًا وَمَجْمَعًا وَمِيعَادًا لِلْأَوَّلِينَ وَالْآخِرِينَ , لِمَا وَعَدَ اللَّه مِنْ الْجَزَاء وَالثَّوَاب . وَسُمِّيَ يَوْم الْفَصْل لِأَنَّ اللَّه تَعَالَى يَفْصِل فِيهِ بَيْن خَلْقه .</p></td></tr></table></body></html>
