<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَا شَيْء كَمَا أَنَّ السَّرَاب كَذَلِكَ : يَظُنُّهُ الرَّائِي مَاء وَلَيْسَ بِمَاءٍ . وَقِيلَ : " سُيِّرَتْ " نُسِفَتْ مِنْ أُصُولهَا . وَقِيلَ : أُزِيلَتْ عَنْ مَوَاضِعِهَا .</p></td></tr></table></body></html>
