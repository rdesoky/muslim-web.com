<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ</font></td></tr><tr><td align=right dir=rtl><p>ذَكَرَ جَلَّ ثَنَاؤُهُ سُهُولَة الْبَعْث عَلَيْهِ فَقَالَ : " فَإِنَّمَا هِيَ زَجْرَة وَاحِدَة " . وَرَوَى الضَّحَّاك عَنْ اِبْن عَبَّاس قَالَ : نَفْخَة وَاحِدَة</p></td></tr></table></body></html>
