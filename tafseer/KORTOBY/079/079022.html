<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَدْبَرَ يَسْعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَلَّى مُدْبِرًا مُعْرِضًا عَنْ الْإِيمَان " يَسْعَى " أَيْ يَعْمَل بِالْفَسَادِ فِي الْأَرْض . وَقِيلَ : يَعْمَل فِي نِكَايَة مُوسَى . وَقِيلَ : " أَدْبَرَ يَسْعَى " هَارِبًا مِنْ الْحَيَّة .</p></td></tr></table></body></html>
