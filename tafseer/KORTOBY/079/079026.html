<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ فِي ذَلِكَ لَعِبْرَةً لِمَنْ يَخْشَى</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّ فِي ذَلِكَ لَعِبْرَة " أَيْ اِعْتِبَارًا وَعِظَة . " لِمَنْ يَخْشَى " أَيْ يَخَاف اللَّه عَزَّ وَجَلَّ .</p></td></tr></table></body></html>
