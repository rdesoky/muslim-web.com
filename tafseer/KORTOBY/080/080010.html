<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْتَ عَنْهُ تَلَهَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تُعْرِض عَنْهُ بِوَجْهِك وَتُشْغَل بِغَيْرِهِ . وَأَصْله تَتَلَهَّى ; يُقَال : لَهِيت عَنْ الشَّيْء أَلْهَى : أَيْ تَشَاغَلْت عَنْهُ . وَالتَّلَهِّي : التَّغَافُل . وَلَهِيت عَنْهُ وَتَلِيت : بِمَعْنًى .</p></td></tr></table></body></html>
