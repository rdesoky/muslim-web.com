<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ أَيِّ شَيْءٍ خَلَقَهُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مِنْ أَيّ شَيْء خَلَقَ اللَّه هَذَا الْكَافِر فَيَتَكَبَّر ؟ أَيْ اِعْجَبُوا لِخَلْقِهِ .</p></td></tr></table></body></html>
