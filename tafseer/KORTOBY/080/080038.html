<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ مُسْفِرَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُشْرِقَة مُضِيئَة , قَدْ عَلِمَتْ مَالهَا مِنْ الْفَوْز وَالنَّعِيم , وَهِيَ وُجُوه الْمُؤْمِنِينَ .</p></td></tr></table></body></html>
