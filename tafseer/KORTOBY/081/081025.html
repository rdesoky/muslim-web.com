<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُوَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>بِقَوْلِ شَيْطَانٍ رَجِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَرْجُوم مَلْعُون , كَمَا قَالَتْ قُرَيْش . قَالَ عَطَاء : يُرِيد بِالشَّيْطَانِ الْأَبْيَض الَّذِي كَانَ يَأْتِي النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ فِي صُورَة جِبْرِيل يُرِيد أَنْ يَفْتِنَهُ .</p></td></tr></table></body></html>
