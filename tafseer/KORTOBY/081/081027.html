<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنْ هُوَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْقُرْآن</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا ذِكْرٌ لِلْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَوْعِظَة وَزَجْر . وَ " إِنْ " بِمَعْنَى " مَا " . وَقِيلَ : مَا مُحَمَّد إِلَّا ذِكْر .</p></td></tr></table></body></html>
