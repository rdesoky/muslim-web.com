<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا الْكَوَاكِبُ انْتَثَرَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تَسَاقَطَتْ ; نَثَرْت الشَّيْء أَنْثُرهُ نَثْرًا , فَانْتَثَرَ , وَالِاسْم النِّثَار . وَالنُّثَار بِالضَّمِّ : مَا تَنَاثَرَ مِنْ الشَّيْء , وَدُرّ مُنَثَّر , شُدِّدَ لِلْكَثْرَةِ .</p></td></tr></table></body></html>
