<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُونَ مَا تَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَعَنْ الْحَسَن : يَعْلَمُونَ لَا يَخْفَى عَلَيْهِمْ شَيْء مِنْ أَعْمَالكُمْ . وَقِيلَ : يَعْلَمُونَ مَا ظَهَرَ مِنْكُمْ دُون مَا حَدَّثْتُمْ بِهِ أَنْفُسكُمْ . وَاَللَّه أَعْلَم .</p></td></tr></table></body></html>
