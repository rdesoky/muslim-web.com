<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فِي نَعِيم الْجَنَّة وَهُوَ مِثْل قَوْله تَعَالَى : " فَرِيق فِي الْجَنَّة وَفَرِيق فِي السَّعِير " [ الشُّورَى : 7 ]</p></td></tr></table></body></html>
