<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>تَقْسِيم مِثْل قَوْله : " فَرِيق فِي الْجَنَّة وَفَرِيق فِي السَّعِير " [ الشُّورَى : 7 ] وَقَالَ : " يَوْمئِذٍ يَصَّدَّعُونَ " [ الرُّوم : 43 ] الْآيَتَيْنِ .</p></td></tr></table></body></html>
