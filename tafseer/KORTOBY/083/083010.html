<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ شِدَّة وَعَذَاب يَوْم الْقِيَامَة لِلْمُكَذِّبِينَ . ثُمَّ بَيَّنَ تَعَالَى أَمْرهمْ فَقَالَ : " الَّذِينَ يُكَذِّبُونَ بِيَوْمِ الدِّين "</p></td></tr></table></body></html>
