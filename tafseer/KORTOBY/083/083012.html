<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا يُكَذِّبُ بِهِ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ فَاجِر جَائِز عَنْ الْحَقّ , مُعْتَدٍ عَلَى الْخَلْق فِي مُعَامَلَته إِيَّاهُمْ وَعَلَى نَفْسه , وَهُوَ أَثِيم فِي تَرْك أَمْر اللَّه . وَقِيلَ هَذَا فِي الْوَلِيد بْن الْمُغِيرَة وَأَبِي جَهْل وَنُظَرَائِهِمَا</p></td></tr></table></body></html>
