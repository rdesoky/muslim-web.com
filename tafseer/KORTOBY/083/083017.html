<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يُقَالُ</font></td></tr><tr><td align=right dir=rtl><p>لَهُمْ أَيْ تَقُول لَهُمْ خَزَنَة جَهَنَّم</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>هَذَا الَّذِي كُنْتُمْ بِهِ تُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>رُسُل اللَّه فِي الدُّنْيَا .</p></td></tr></table></body></html>
