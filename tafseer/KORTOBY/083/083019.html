<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا عِلِّيُّونَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَا الَّذِي أَعْلَمَك يَا مُحَمَّد أَيّ شَيْء عِلِّيُّونَ ؟ عَلَى جِهَة التَّفْخِيم وَالتَّعْظِيم لَهُ فِي الْمَنْزِلَة الرَّفِيعَة . ثُمَّ فَسَّرَهُ لَهُ فَقَالَ : " كِتَاب مَرْقُوم يَشْهَدُهُ الْمُقَرَّبُونَ " .</p></td></tr></table></body></html>
