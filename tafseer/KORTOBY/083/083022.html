<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْأَبْرَارَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَهْل الصِّدْق وَالطَّاعَة .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>لَفِي نَعِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ نِعْمَة , وَالنَّعْمَة بِالْفَتْحِ : التَّنْعِيم ; يُقَال : نَعَّمَهُ اللَّه وَنَاعَمَهُ فَتَنَعَّمَ وَامْرَأَة مُنَعَّمَة وَمُنَاعَمَة بِمَعْنًى . أَيْ إِنَّ الْأَبْرَار فِي الْجَنَّات يَتَنَعَّمُونَ .</p></td></tr></table></body></html>
