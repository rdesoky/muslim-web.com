<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْهُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ إِذَا رَأَى هَؤُلَاءِ الْكُفَّار أَصْحَاب مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّ هَؤُلَاءِ لَضَالُّونَ</font></td></tr><tr><td align=right dir=rtl><p>فِي اِتِّبَاعهمْ مُحَمَّدًا صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ</p></td></tr></table></body></html>
