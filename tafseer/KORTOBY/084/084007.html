<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ</font></td></tr><tr><td align=right dir=rtl><p>قَوْله تَعَالَى : " فَأَمَّا مَنْ أُوتِيَ كِتَابه بِيَمِينِهِ " وَهُوَ الْمُؤْمِن</p></td></tr></table></body></html>
