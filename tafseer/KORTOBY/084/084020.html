<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا لَهُمْ لَا يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي أَيّ شَيْء يَمْنَعهُمْ مِنْ الْإِيمَان بَعْدَمَا وَضَحَتْ لَهُمْ الْآيَات وَقَامَتْ الدَّلَالَات . وَهَذَا اِسْتِفْهَام إِنْكَار . وَقِيلَ : تَعَجُّب أَيْ اِعْجَبُوا مِنْهُمْ فِي تَرْك الْإِيمَان مَعَ هَذِهِ الْآيَات .</p></td></tr></table></body></html>
