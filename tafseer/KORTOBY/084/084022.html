<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ</font></td></tr><tr><td align=right dir=rtl><p>مُحَمَّدًا صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَمَا جَاءَ بِهِ . وَقَالَ مُقَاتِل : نَزَلْت فِي بَنِي عَمْرو بْن عُمَيْر وَكَانُوا أَرْبَعَة , فَأَسْلَمَ آثْنَانِ مِنْهُمْ . وَقِيلَ : هِيَ فِي جَمِيع الْكُفَّار .</p></td></tr></table></body></html>
