<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبَشِّرْهُمْ بِعَذَابٍ أَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُوجِع فِي جَهَنَّم عَلَى تَكْذِيبهمْ . أَيْ أَجْعَل ذَلِكَ بِمَنْزِلَةِ الْبِشَارَة .</p></td></tr></table></body></html>
