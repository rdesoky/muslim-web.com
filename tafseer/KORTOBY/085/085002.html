<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْيَوْمِ الْمَوْعُودِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمَوْعُود بِهِ . وَهُوَ قَسَم آخَر , وَهُوَ يَوْم الْقِيَامَة ; مِنْ غَيْر اِخْتِلَاف بَيْن أَهْل التَّأْوِيل . قَالَ اِبْن عَبَّاس : وَعَدَ أَهْل السَّمَاء وَأَهْل الْأَرْض أَنْ يَجْتَمِعُوا فِيهِ .</p></td></tr></table></body></html>
