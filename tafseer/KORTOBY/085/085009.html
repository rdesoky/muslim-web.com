<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ</font></td></tr><tr><td align=right dir=rtl><p>لَا شَرِيك لَهُ وَلَا نَدِيد</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ عَلَى كُلِّ شَيْءٍ شَهِيدٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَالِم بِأَعْمَالِ خَلْقه لَا تَخْفَى عَلَيْهِ خَافِيَة .</p></td></tr></table></body></html>
