<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِرْعَوْنَ وَثَمُودَ</font></td></tr><tr><td align=right dir=rtl><p>وَهُمَا فِي مَوْضِع جَرّ عَلَى الْبَدَل مِنْ " الْجُنُود " . الْمَعْنَى : إِنَّك قَدْ عَرَفْت مَا فَعَلَ اللَّه بِهِمْ حِين كَذَّبُوا أَنْبِيَاءَهُ وَرُسُله .</p></td></tr></table></body></html>
