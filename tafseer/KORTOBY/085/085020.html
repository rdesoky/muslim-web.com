<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ مِنْ وَرَائِهِمْ مُحِيطٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَقْدِر عَلَى أَنْ يُنْزِل بِهِمْ مَا أَنْزَلَ بِفِرْعَوْن . وَالْمُحَاط بِهِ كَالْمَحْصُورِ . وَقِيلَ : أَيْ وَاَللَّه عَالِم بِهِمْ فَهُوَ يُجَازِيهِمْ .</p></td></tr></table></body></html>
