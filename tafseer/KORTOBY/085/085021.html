<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>بَلْ هُوَ قُرْآنٌ مَجِيدٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُتَنَاهٍ فِي الشَّرَف وَالْكَرَم وَالْبَرَكَة , وَهُوَ بَيَان مَا بِالنَّاسِ الْحَاجَة إِلَيْهِ مِنْ أَحْكَام الدِّين وَالدُّنْيَا , لَا كَمَا زَعَمَ الْمُشْرِكُونَ . وَقِيلَ " مَجِيد " : أَيْ غَيْر مَخْلُوق .</p></td></tr></table></body></html>
