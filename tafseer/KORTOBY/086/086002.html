<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا الطَّارِقُ</font></td></tr><tr><td align=right dir=rtl><p>تَفْخِيمًا لِشَأْنِ هَذَا الْمُقْسَمِ بِهِ . وَقَالَ سُفْيَان : كُلّ مَا فِي الْقُرْآن " وَمَا أَدْرَاك " ؟ فَقَدْ أَخْبَرَهُ بِهِ . وَكُلّ شَيْء قَالَ فِيهِ " وَمَا يُدْرِيك " : لَمْ يُخْبِرهُ بِهِ .</p></td></tr></table></body></html>
