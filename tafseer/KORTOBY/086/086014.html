<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُوَ بِالْهَزْلِ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ لَيْسَ الْقُرْآن بِالْبَاطِلِ وَاللَّعِب . وَالْهَزْل : ضِدّ الْجِدّ , وَقَدْ هَزَلَ يَهْزِل . قَالَ الْكُمَيْت . <poem type=1><part>يَجِدُّ بِنَا فِي كُلّ يَوْم وَنَهْزِل</part></poem></p></td></tr></table></body></html>
