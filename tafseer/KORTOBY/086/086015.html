<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ يَكِيدُونَ كَيْدًا</font></td></tr><tr><td align=right dir=rtl><p>" إِنَّهُمْ " أَيْ إِنَّ أَعْدَاء اللَّه " يَكِيدُونَ كَيْدًا " أَيْ يَمْكُرُونَ بِمُحَمَّدٍ - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ - وَأَصْحَابه مَكْرًا .</p></td></tr></table></body></html>
