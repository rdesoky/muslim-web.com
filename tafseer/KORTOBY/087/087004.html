<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي أَخْرَجَ الْمَرْعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ النَّبَات وَالْكَلَأ الْأَخْضَر . قَالَ الشَّاعِر : <poem type=2><part>وَقَدْ يَنْبُتُ الْمَرْعَى عَلَى دِمَنِ الثَّرَى </part><part>وَتَبْقَى حَزَّازَاتُ النُّفُوسِ كَمَا هِيَا</part></poem></p></td></tr></table></body></html>
