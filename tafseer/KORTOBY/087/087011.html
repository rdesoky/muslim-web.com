<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَتَجَنَّبُهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ وَيَتَجَنَّب الذِّكْرَى وَيَبْعُد عَنْهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْأَشْقَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الشَّقِيّ فِي عِلْم اللَّه . وَقِيلَ : نَزَلَتْ فِي الْوَلِيد بْن الْمُغِيرَة وَعُتْبَة بْن رَبِيعَة .</p></td></tr></table></body></html>
