<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي يَصْلَى النَّارَ الْكُبْرَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْعُظْمَى , وَهِيَ السُّفْلَى مِنْ أَطْبَاق النَّار قَالَهُ الْفَرَّاء . وَعَنْ الْحَسَن : الْكُبْرَى نَار جَهَنَّم , وَالصُّغْرَى نَار الدُّنْيَا وَقَالَهُ يَحْيَى بْن سَلَّام .</p></td></tr></table></body></html>
