<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ نَاعِمَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ ذَات نِعْمَة . وَهِيَ وُجُوه الْمُؤْمِنِينَ نِعْمَتْ بِمَا عَايَنَتْ مِنْ عَاقِبَة أَمْرهَا وَعَمَلِهَا الصَّالِح .</p></td></tr></table></body></html>
