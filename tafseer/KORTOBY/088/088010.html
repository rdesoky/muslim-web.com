<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي جَنَّةٍ عَالِيَةٍ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مُرْتَفِعَة ; لِأَنَّهَا فَوْق السَّمَوَات حَسَبَ مَا تَقَدَّمَ . وَقِيلَ : عَالِيَة الْقَدْر ; لِأَنَّ فِيهَا مَا تَشْتَهِيهِ الْأَنْفُس وَتَلَذّ الْأَعْيُن . وَهُمْ فِيهَا خَالِدُونَ .</p></td></tr></table></body></html>
