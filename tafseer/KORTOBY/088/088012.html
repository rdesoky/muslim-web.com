<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا عَيْنٌ جَارِيَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِمَاءٍ مُنْدَفِق , وَأَنْوَاع الْأَشْرِبَة اللَّذِيذَة عَلَى وَجْه الْأَرْض مِنْ غَيْر أُخْدُود . وَقَدْ تَقَدَّمَ فِي سُورَة " الْإِنْسَان " أَنَّ فِيهَا عُيُونًا . فَ " عَيْن " : بِمَعْنَى عُيُون . وَاَللَّه أَعْلَم .</p></td></tr></table></body></html>
