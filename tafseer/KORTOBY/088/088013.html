<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا سُرُرٌ مَرْفُوعَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ عَالِيَة . وَرُوِيَ أَنَّهُ كَانَ اِرْتِفَاعهَا قَدْر مَا بَيْن السَّمَاء وَالْأَرْض , لِيَرَى وَلِيُّ اللَّه مُلْكه حَوْله .</p></td></tr></table></body></html>
