<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَكْوَابٌ مَوْضُوعَةٌ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَبَارِيق وَأَوَان . وَالْإِبْرِيق : هُوَ مَا لَهُ عُرْوَة وَخُرْطُوم . وَالْكُوب : إِنَاء لَيْسَ لَهُ عُرْوَة وَلَا خُرْطُوم . وَقَدْ تَقَدَّمَ هَذَا فِي سُورَة " الزُّخْرُف " وَغَيْرهَا .</p></td></tr></table></body></html>
