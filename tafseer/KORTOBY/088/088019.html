<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ كَيْف نُصِبَتْ عَلَى الْأَرْض , بِحَيْثُ لَا تَزُول وَذَلِكَ أَنَّ الْأَرْض لَمَّا دُحِيَتْ مَادَتْ , فَأَرْسَاهَا بِالْجِبَالِ . كَمَا قَالَ : " وَجَعَلْنَا فِي الْأَرْض رَوَاسِيَ أَنْ تَمِيدَ بِهِمْ " [ الْأَنْبِيَاء : 31 ] .</p></td></tr></table></body></html>
