<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَذَكِّرْ إِنَّمَا أَنْتَ مُذَكِّرٌ</font></td></tr><tr><td align=right dir=rtl><p>" فَذَكِّرْ " أَيْ فَعِظْهُمْ يَا مُحَمَّد وَخَوِّفْهُمْ . " إِنَّمَا أَنْتَ مُذَكِّر " أَيْ وَاعِظ .</p></td></tr></table></body></html>
