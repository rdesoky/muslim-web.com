<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ طَغَوْا فِي الْبِلَادِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي عَادًا وَثَمُودَ وَفِرْعَوْن " طَغَوْا " أَيْ تَمْرُدُوا وَعَتَوْا وَتَجَاوَزُوا الْقَدْر فِي الظُّلْم وَالْعُدْوَان .</p></td></tr></table></body></html>
