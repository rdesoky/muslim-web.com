<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَكْثَرُوا فِيهَا الْفَسَادَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْجَوْر وَالْأَذَى . و " الَّذِينَ طَغَوْا " أَحْسَن الْوُجُوه فِيهِ أَنْ يَكُون فِي مَحِلّ النَّصْب عَلَى الذَّمّ . وَيَجُوز أَنْ يَكُون مَرْفُوعًا عَلَى : هُمْ الَّذِينَ طَغَوْا , أَوْ مَجْرُورًا عَلَى وَصْف الْمَذْكُورِينَ : عَاد , وَثَمُود , وَفِرْعَوْن .</p></td></tr></table></body></html>
