<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نَجْعَلْ لَهُ عَيْنَيْنِ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ عَدَّدَ عَلَيْهِ نِعَمَهُ فَقَالَ : " أَلَمْ نَجْعَل لَهُ عَيْنَيْنِ " يُبْصِر بِهِمَا .</p></td></tr></table></body></html>
