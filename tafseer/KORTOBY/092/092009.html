<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكَذَّبَ بِالْحُسْنَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ بِالْخُلْفِ . وَرَوَى اِبْن أَبِي نَجِيح عَنْ مُجَاهِد : " وَكَذَّبَ بِالْحُسْنَى " قَالَ : بِالْجَنَّةِ . وَبِإِسْنَادٍ عَنْهُ آخَر قَالَ " بِالْحُسْنَى " أَيْ بِلَا إِلَه إِلَّا اللَّه .</p></td></tr></table></body></html>
