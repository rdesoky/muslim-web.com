<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْذَرْتُكُمْ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ حَذَّرْتُكُمْ وَخَوَّفْتُكُمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>نَارًا تَلَظَّى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ تُلْهَب وَتَتَوَقَّد وَأَصْله تَتَلَظَّى . وَهِيَ قِرَاءَة عُبَيْد بْن عُمَيْر , وَيَحْيَى بْن يَعْمَرَ , وَطَلْحَة بْن مُصَرِّف .</p></td></tr></table></body></html>
