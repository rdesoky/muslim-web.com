<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَسَيُجَنَّبُهَا</font></td></tr><tr><td align=right dir=rtl><p>أَيْ يَكُون بَعِيدًا مِنْهَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>الْأَتْقَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الْمُتَّقِي الْخَائِف . قَالَ اِبْن عَبَّاس : هُوَ أَبُو بَكْر - رَضِيَ اللَّهُ عَنْهُ - يُزَحْزَح عَنْ دُخُول النَّار .</p></td></tr></table></body></html>
