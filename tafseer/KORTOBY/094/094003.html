<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي أَنْقَضَ ظَهْرَكَ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَثْقَلَهُ وَأَوْهَنَهُ . قَالَ : وَإِنَّمَا وُصِفَتْ ذُنُوب , الْأَنْبِيَاء بِهَذَا الثِّقَل , مَعَ كَوْنهَا مَغْفُورَة , لِشِدَّةِ اِهْتِمَامهمْ بِهَا , وَنَدِمَهُمْ مِنْهَا , وَتَحَسُّرهمْ عَلَيْهَا .</p></td></tr></table></body></html>
