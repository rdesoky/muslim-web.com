<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِلَى رَبِّكَ الرُّجْعَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ مَرْجِع مَنْ هَذَا وَصْفه , فَنُجَازِيه . وَالرُّجْعَى وَالْمَرْجِع وَالرُّجُوع : مَصَادِر ; يُقَال : رَجَعَ إِلَيْهِ رُجُوعًا وَمَرْجِعًا وَرُجْعَى عَلَى وَزْن فُعْلَى .</p></td></tr></table></body></html>
