<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَرَأَيْتَ إِنْ كَانَ عَلَى الْهُدَى</font></td></tr><tr><td align=right dir=rtl><p>أَيْ أَرَأَيْت يَا أَبَا جَهْل إِنْ كَانَ مُحَمَّد عَلَى هَذِهِ الصِّفَة , أَلَيْسَ نَاهِيه عَنْ التَّقْوَى وَالصَّلَاة هَالِكًا ؟</p></td></tr></table></body></html>
