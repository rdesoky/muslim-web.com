<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَى</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ يَقُول : وَيْله أَلَمْ يَعْلَم أَبُو جَهْل بِأَنَّ اللَّه يَرَى ; أَيْ يَرَاهُ وَيَعْلَم فِعْله ; فَهُوَ تَقْرِير وَتَوْبِيخ . وَقِيلَ : كُلّ وَاحِد مِنْ " أَرَأَيْت " بَدَل مِنْ الْأَوَّل . وَ " أَلَمْ يَعْلَم بِأَنَّ اللَّه يَرَى " الْخَبَر .</p></td></tr></table></body></html>
