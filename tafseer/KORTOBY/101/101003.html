<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا الْقَارِعَةُ</font></td></tr><tr><td align=right dir=rtl><p>كَلِمَة اِسْتِفْهَام عَلَى جِهَة التَّعْظِيم وَالتَّفْخِيم لِشَأْنِهَا , كَمَا قَالَ : " الْحَاقَّة . مَا الْحَاقَّة . وَمَا أَدْرَاك مَا الْحَاقَّة " [ الْحَاقَّة : 1 ] عَلَى مَا تَقَدَّمَ .</p></td></tr></table></body></html>
