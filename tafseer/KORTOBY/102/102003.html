<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَلَّا سَوْفَ تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>( كَلَّا ) قَالَ الْفَرَّاء : أَيْ لَيْسَ الْأَمْر عَلَى مَا أَنْتُمْ عَلَيْهِ مِنْ التَّفَاخُر وَالتَّكَاثُر وَالتَّمَام عَلَى هَذَا " كَلَّا سَوْفَ تَعْلَمُونَ " أَيْ سَوْفَ تَعْلَمُونَ عَاقِبَة هَذَا .</p></td></tr></table></body></html>
