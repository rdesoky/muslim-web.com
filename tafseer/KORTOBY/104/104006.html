<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَارُ اللَّهِ الْمُوقَدَةُ</font></td></tr><tr><td align=right dir=rtl><p>أَيْ الَّتِي أُوقِدَ عَلَيْهَا أَلْف عَام , وَأَلْف عَام , وَأَلْف عَام ; فَهِيَ غَيْر خَامِدَة ; أَعَدَّهَا اللَّه لِلْعُصَاةِ .</p></td></tr></table></body></html>
