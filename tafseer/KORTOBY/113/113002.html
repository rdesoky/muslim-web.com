<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ شَرِّ مَا خَلَقَ</font></td></tr><tr><td align=right dir=rtl><p>قِيلَ : هُوَ إِبْلِيس وَذُرِّيَّته . وَقِيلَ جَهَنَّم . وَقِيلَ : هُوَ عَامّ ; أَيْ مِنْ شَرّ كُلّ ذِي شَرّ خَلَقَهُ اللَّه عَزَّ وَجَلَّ .</p></td></tr></table></body></html>
