<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير القرطبي</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَهِ النَّاسِ</font></td></tr><tr><td align=right dir=rtl><p>إِنَّمَا قَالَ : " مَلِك النَّاس إِلَه النَّاس " لِأَنَّ فِي النَّاس مُلُوكًا يَذْكُر أَنَّهُ مَلِكهمْ . وَفِي النَّاس مَنْ يَعْبُد غَيْره , فَذَكَرَ أَنَّهُ إِلَههمْ وَمَعْبُودهمْ , وَأَنَّهُ الَّذِي يَجِب أَنْ يُسْتَعَاذ بِهِ وَيُلْجَأ إِلَيْهِ , دُون الْمُلُوك وَالْعُظَمَاء .</p></td></tr></table></body></html>
