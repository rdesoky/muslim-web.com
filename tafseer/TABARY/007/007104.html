<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ مُوسَى يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِنْ رَبِّ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَقَالَ مُوسَى يَا فِرْعَوْن إِنِّي رَسُول مِنْ رَبّ الْعَالَمِينَ } </quran></subtitle>يَقُول جَلَّ ثَنَاؤُهُ : وَقَالَ مُوسَى لِفِرْعَوْن : يَا فِرْعَوْن إِنِّي رَسُول مِنْ رَبّ الْعَالَمِينَ .</p></td></tr></table></body></html>
