<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنْ كُنْتَ جِئْتَ بِآيَةٍ فَأْتِ بِهَا إِنْ كُنْتَ مِنَ الصَّادِقِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ لَهُ فِرْعَوْن : إِنْ كُنْت جِئْت بِآيَةٍ , يَقُول : بِحُجَّةٍ وَعَلَامَة شَاهِدَة عَلَى صِدْق مَا تَقُول . فَأْتِ بِهَا إِنْ كُنْت مِنْ الصَّادِقِينَ .</p></td></tr></table></body></html>
