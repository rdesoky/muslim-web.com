<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَأْتُوكَ بِكُلِّ سَاحِرٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ يَأْتُوك بِكُلِّ سَاحِر عَلِيم } </quran></subtitle>وَهَذَا خَبَر مِنْ اللَّه جَلَّ ثَنَاؤُهُ عَنْ مَشُورَة الْمَلَأ مِنْ قَوْم فِرْعَوْن عَلَى فِرْعَوْن , أَنْ يُرْسِل فِي الْمَدَائِن حَاشِرِينَ , يَحْشُرُونَ كُلّ سَاحِر عَلِيم .</p></td></tr></table></body></html>
