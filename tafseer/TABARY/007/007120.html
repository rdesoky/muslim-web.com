<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَأُلْقِيَ السَّحَرَة سَاجِدِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : وَأُلْقِيَ السَّحَرَة عِنْدَمَا عَايَنُوا مِنْ عَظِيم قُدْرَة اللَّه , سَاقِطِينَ عَلَى وُجُوههمْ , سُجَّدًا لِرَبِّهِمْ .</p></td></tr></table></body></html>
