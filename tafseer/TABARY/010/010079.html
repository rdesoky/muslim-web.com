<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقَالَ فِرْعَوْنُ ائْتُونِي بِكُلِّ سَاحِرٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَقَالَ فِرْعَوْن اِئْتُونِي بِكُلِّ سَاحِر عَلِيم } </quran></subtitle>يَقُول تَعَالَى ذِكْره : وَقَالَ فِرْعَوْن لِقَوْمِهِ : اِئْتُونِي بِكُلِّ مَنْ يَسْحَر مِنْ السَّحَرَة , عَلِيم بِالسِّحْرِ .</p></td></tr></table></body></html>
