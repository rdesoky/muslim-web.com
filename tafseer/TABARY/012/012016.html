<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجَاءُوا أَبَاهُمْ عِشَاءً يَبْكُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَجَاءُو أَبَاهُمْ عِشَاء يَبْكُونَ } </quran></subtitle>يَقُول جَلَّ ثَنَاؤُهُ : وَجَاءَ إِخْوَة يُوسُف أَبَاهُمْ بَعْد مَا أَلْقَوْا يُوسُف فِي غَيَابَة الْجُبّ <quran>{ عِشَاء يَبْكُونَ } </quran>.</p></td></tr></table></body></html>
