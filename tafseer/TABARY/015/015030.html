<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَجَدَ الْمَلَائِكَةُ كُلُّهُمْ أَجْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَسَجَدَ الْمَلَائِكَة كُلّهمْ أَجْمَعُونَ } </quran></subtitle>يَقُول ـ تَعَالَى ذِكْره ـ : فَلَمَّا خَلَقَ اللَّه ذَلِكَ الْبَشَر وَنَفَخَ فِيهِ الرُّوح بَعْد أَنْ سَوَّاهُ , سَجَدَ الْمَلَائِكَة كُلّهمْ جَمِيعًا .</p></td></tr></table></body></html>
