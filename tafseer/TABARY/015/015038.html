<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى يَوْمِ الْوَقْتِ الْمَعْلُومِ</font></td></tr><tr><td align=right dir=rtl><p>قَالَ اللَّه لَهُ : فَإِنَّك مِمَّنْ أُخِّرَ هَلَاكه إِلَى يَوْم الْوَقْت الْمَعْلُوم لِهَلَاكِ جَمِيع خَلْقِي , وَذَلِكَ حِين لَا يَبْقَى عَلَى الْأَرْض مِنْ بَنِي آدَم دَيَّار .</p></td></tr></table></body></html>
