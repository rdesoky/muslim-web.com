<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ جَهَنَّمَ لَمَوْعِدُهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَإِنَّ جَهَنَّم لَمَوْعِدهمْ أَجْمَعِينَ } </quran></subtitle>يَقُول ـ تَعَالَى ذِكْره ـ لِإِبْلِيس : وَإِنَّ جَهَنَّم لَمَوْعِد مَنْ تَبِعَك أَجْمَعِينَ .</p></td></tr></table></body></html>
