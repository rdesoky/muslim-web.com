<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ إِنَّ الْمُتَّقِينَ فِي جَنَّات وَعُيُون } </quran></subtitle>يَقُول ـ تَعَالَى ذِكْره ـ : إِنَّ الَّذِينَ اِتَّقَوْا اللَّه بِطَاعَتِهِ وَخَافُوهُ , فَتَجَنَّبُوا مَعَاصِيه <quran>{ فِي جَنَّات وَعُيُون }</quran></p></td></tr></table></body></html>
