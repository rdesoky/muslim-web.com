<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَا تَوْجَلْ إِنَّا نُبَشِّرُكَ بِغُلَامٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قَالُوا لَا تَوْجَل } </quran>يَقُول : قَالَ الضَّيْف لِإِبْرَاهِيم : لَا تَوْجَل <quran>{ لَا تَخَفْ إِنَّا نُبَشِّرك بِغُلَامٍ عَلِيم }</quran></p></td></tr></table></body></html>
