<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَمَا خَطْبُكُمْ أَيُّهَا الْمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ قَالَ فَمَا خَطْبكُمْ أَيّهَا الْمُرْسَلُونَ } </quran></subtitle>يَقُول ـ تَعَالَى ذِكْره ـ : قَالَ إِبْرَاهِيم لِلْمَلَائِكَةِ : فَمَا شَأْنكُمْ ؟ مَا أَمْركُمْ أَيّهَا الْمُرْسَلُونَ ؟</p></td></tr></table></body></html>
