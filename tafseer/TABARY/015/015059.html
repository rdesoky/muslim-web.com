<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا آلَ لُوطٍ إِنَّا لَمُنَجُّوهُمْ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ إِلَّا آل لُوط } </quran>يَقُول : إِلَّا اِتِّبَاع لُوط عَلَى مَا هُوَ عَلَيْهِ مِنْ الدِّين , فَإِنَّا لَنْ نُهْلِكهُمْ بَلْ نُنْجِيهِمْ مِنْ الْعَذَاب الَّذِي أُمِرْنَا أَنْ نُعَذِّب بِهِ قَوْم لُوط .</p></td></tr></table></body></html>
