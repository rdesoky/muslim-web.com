<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا امْرَأَتَهُ قَدَّرْنَا إِنَّهَا لَمِنَ الْغَابِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>سِوَى اِمْرَأَة لُوط <quran>{ قَدَّرْنَا أَنَّهَا مِنْ الْغَابِرِينَ } </quran>يَقُول : قَضَى اللَّه فِيهَا أَنَّهَا لَمِنْ الْبَاقِينَ ثُمَّ هِيَ مُهْلَكَة بَعْد . وَقَدْ بَيَّنَّا الْغَابِر فِيمَا مَضَى بِشَوَاهِدِهِ .</p></td></tr></table></body></html>
