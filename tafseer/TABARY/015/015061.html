<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَمَّا جَاءَ آلَ لُوطٍ الْمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَلَمَّا جَاءَ آلَ لُوط الْمُرْسَلُونَ } </quran></subtitle>يَقُول ـ تَعَالَى ذِكْره ـ : فَلَمَّا أَتَى رُسُلُ اللَّه آلَ لُوط .</p></td></tr></table></body></html>
