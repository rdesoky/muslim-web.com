<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّقُوا اللَّهَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَاتَّقُوا اللَّه } </quran>يَقُول : وَخَافُوا اللَّه فِيَّ وَفِي أَنْفُسكُمْ أَنْ يَحِلّ بِكُمْ عِقَابه.</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَا تُخْزُونِ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَلَا تُخْزُونِ } </quran>يَقُول : وَلَا تُذِلُّونِي وَلَا تُهِينُونِي فِيهِمْ بِالتَّعَرُّضِ لَهُمْ بِالْمَكْرُوهِ .</p></td></tr></table></body></html>
