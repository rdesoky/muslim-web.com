<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخَذَتْهُمُ الصَّيْحَةُ مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَأَخَذَتْهُمْ الصَّيْحَة مُصْبِحِينَ } </quran>يَقُول : فَأَخَذَتْهُمْ صَيْحَة الْهَلَاك حِين أَصْبَحُوا مِنْ الْيَوْم الرَّابِع مِنْ الْيَوْم الَّذِي وُعِدُوا الْعَذَاب , وَقِيلَ لَهُمْ : تَمَتَّعُوا فِي دَاركُمْ ثَلَاثَة أَيَّام .</p></td></tr></table></body></html>
