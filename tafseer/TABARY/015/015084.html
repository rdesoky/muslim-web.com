<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَا أَغْنَى عَنْهُمْ مَا كَانُوا يَكْسِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَمَا أَغْنَى عَنْهُمْ مَا كَانُوا يَكْسِبُونَ } </quran>يَقُول : فَمَا دَفَعَ عَنْهُمْ عَذَاب اللَّه مَا كَانُوا يَجْتَرِحُونَ مِنْ الْأَعْمَال الْخَبِيثَة قَبْل ذَلِكَ .</p></td></tr></table></body></html>
