<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ رَبَّكَ هُوَ الْخَلَّاقُ الْعَلِيمُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ رَبّك هُوَ الْخَلَّاق الْعَلِيم } </quran>يَقُول ـ تَعَالَى ذِكْره ـ : إِنَّ رَبّك هُوَ الَّذِي خَلَقَهُمْ وَخَلَقَ كُلّ شَيْء , وَهُوَ عَالِم بِهِمْ وَبِتَدْبِيرِهِمْ وَمَا يَأْتُونَ مِنْ الْأَفْعَال .</p></td></tr></table></body></html>
