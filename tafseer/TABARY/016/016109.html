<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا جَرَمَ أَنَّهُمْ فِي الْآخِرَةِ هُمُ الْخَاسِرُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لَا جَرَمَ أَنَّهُمْ فِي الْآخِرَة هُمْ الْخَاسِرُونَ } </quran>الْهَالِكُونَ , الَّذِينَ غَبَنُوا أَنْفُسهمْ حُظُوظهَا مِنْ كَرَامَة اللَّه تَعَالَى .</p></td></tr></table></body></html>
