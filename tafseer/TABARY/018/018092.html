<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَتْبَعَ سَبَبًا</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ ثُمَّ أَتْبَعَ سَبَبًا } </quran></subtitle>يَقُول تَعَالَى ذِكْره : ثُمَّ سَارَ طُرُقًا وَمَنَازِل , وَسَلَكَ سُبُلًا .</p></td></tr></table></body></html>
