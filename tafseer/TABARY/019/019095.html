<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُلُّهُمْ آتِيهِ يَوْمَ الْقِيَامَةِ فَرْدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَكُلّهمْ آتِيه يَوْم الْقِيَامَة فَرْدًا } </quran>يَقُول : وَجَمِيع خَلْقه سَوْفَ يُرَدّ عَلَيْهِ يَوْم تَقُوم السَّاعَة وَحِيدًا لَا نَاصِر لَهُ مِنْ اللَّه , وَلَا دَافِع عَنْهُ , فَيَقْضِي اللَّه فِيهِ مَا هُوَ قَاضٍ , وَيَصْنَع بِهِ مَا هُوَ صَانِع .</p></td></tr></table></body></html>
