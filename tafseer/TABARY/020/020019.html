<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ أَلْقِهَا يَا</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل في تَأْويل قَوْله تَعَالَى : <quran>{ قَالَ أَلْقهَا يَا مُوسَى } </quran></subtitle>يَقُول تَعَالَى ذكْره : قَالَ اللَّه لمُوسَى : أَلْق عَصَاك الَّتي بيَمينك يَا مُوسَى .</p></td></tr></table></body></html>
