<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ اشْرَحْ لِي صَدْرِي</font></td></tr><tr><td align=right dir=rtl><p><quran>{ قَالَ رَبّ اشْرَحْ لي صَدْري } </quran>يَقُول : رَبّ اشْرَحْ لي صَدْري , لأَعيَ عَنْك مَا تُودعهُ منْ وَحْيك , وَأَجْتَرئ به عَلَى خطَاب فرْعَوْن .</p></td></tr></table></body></html>
