<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَفْقَهُوا قَوْلِي</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ يَفْقَهُوا قَوْلي } </quran>يَقُول : يَفْقَهُوا عَنّي مَا أُخَاطبهُمْ وَأُرَاجعهُمْ به منْ الْكَلَام .</p></td></tr></table></body></html>
