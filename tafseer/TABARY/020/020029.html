<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاجْعَلْ لِي وَزِيرًا مِنْ أَهْلِي</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَاجْعَلْ لي وَزيرًا منْ أَهْلي } </quran>يَقُول : وَاجْعَلْ لي عَوْنًا منْ أَهْل بَيْتي <quran>{ هَارُون أَخي } .</quran></p></td></tr></table></body></html>
