<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّكَ كُنْتَ بِنَا بَصِيرًا</font></td></tr><tr><td align=right dir=rtl><p><quran>{ إنَّك كُنْت بنَا بَصيرًا } </quran>يَقُول : إنَّك كُنْت ذَا بَصَر بنَا لَا يَخْفَى عَلَيْك منْ أَفْعَالنَا شَيْء .</p></td></tr></table></body></html>
