<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَى</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل في تَأْويل قَوْله تَعَالَى : <quran>{ فَأَوْجَسَ في نَفْسه خيفَة مُوسَى } </quran></subtitle>يَعْني تَعَالَى ذكْره بقَوْله : فَأَوْجَسَ في نَفْسه خَوْفًا مُوسَى فَوَجَدَهُ .</p></td></tr></table></body></html>
