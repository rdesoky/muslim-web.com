<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْنَا لَا تَخَفْ إِنَّكَ أَنْتَ الْأَعْلَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قُلْنَا لَا تَخَفْ إنَّك أَنْتَ الْأَعْلَى } </quran>يَقُول تَعَالَى ذكْره : قُلْنَا لمُوسَى إذْ أَوْجَسَ في نَفْسه خيفَة : <quran>{ لَا تَخَفْ إنَّك أَنْتَ الْأَعْلَى } </quran>عَلَى هَؤُلَاء السَّحَرَة , وَعَلَى فرْعَوْن وَجُنْده , وَالْقَاهر لَهُمْ .</p></td></tr></table></body></html>
