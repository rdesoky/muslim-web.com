<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَنْ نَبْرَحَ عَلَيْهِ عَاكِفِينَ حَتَّى يَرْجِعَ إِلَيْنَا مُوسَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قَالُوا لَنْ نَبْرَح عَلَيْه عَاكفينَ } </quran>يَقُول : قَالَ عَبَدَة الْعجْل منْ قَوْم مُوسَى : لَنْ نَزَال عَلَى الْعجْل مُقيمينَ نَعْبُدهُ , حَتَّى يَرْجع إلَيْنَا مُوسَى .</p></td></tr></table></body></html>
