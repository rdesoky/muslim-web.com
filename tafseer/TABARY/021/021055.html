<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا أَجِئْتَنَا بِالْحَقِّ أَمْ أَنْتَ مِنَ اللَّاعِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ قَالُوا أَجِئْتنَا بِالْحَقِّ } ؟ </quran>يَقُول : قَالَ أَبُوهُ وَقَوْمه لَهُ : أَجِئْتنَا بِالْحَقِّ فِيمَا تَقُول <quran>{ أَمْ أَنْتَ } </quran>هَازِل لَاعِب <quran>{ مِنْ اللَّاعِبِينَ } .</quran></p></td></tr></table></body></html>
