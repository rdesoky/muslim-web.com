<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ لِفُرُوجِهِمْ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَالَّذِينَ هُمْ لِفُرُوجِ أَنْفُسهمْ , وَعَنَى بِالْفُرُوجِ فِي هَذَا الْمَوْضِع : فُرُوج الرِّجَال , وَذَلِكَ أَقْبَالهمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>حَافِظُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَحْفَظُونَهَا مِنْ أَعْمَالهَا فِي شَيْء مِنَ الْفُرُوج .</p></td></tr></table></body></html>
