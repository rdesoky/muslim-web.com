<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَعَلَيْهَا وَعَلَى الْفُلْكِ تُحْمَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَعَلَيْهَا وَعَلَى الْفُلْك تُحْمَلُونَ } </quran>يَقُول : وَعَلَى الْأَنْعَام وَعَلَى السُّفُن تُحْمَلُونَ , عَلَى هَذِهِ فِي الْبَرّ وَعَلَى هَذِهِ فِي الْبَحْر .</p></td></tr></table></body></html>
