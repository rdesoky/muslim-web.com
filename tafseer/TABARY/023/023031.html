<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ قَرْنًا آخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ ثُمَّ أَنْشَأْنَا مِنْ بَعْدهمْ قَرْنًا آخَرِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : ثُمَّ أَحْدَثْنَا مِنْ بَعْد مَهْلِك قَوْم نُوح قَرْنًا آخَرِينَ فَأَوْجَدْنَاهُمْ .</p></td></tr></table></body></html>
