<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَذَّبُوهُمَا فَكَانُوا مِنَ الْمُهْلَكِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَكَذَّبُوهُمَا فَكَانُوا مِنَ الْمُهْلَكِينَ } </quran>يَقُول : فَكَذَّبَ فِرْعَوْن وَمَلَؤُهُ مُوسَى وَهَارُون , فَكَانُوا مِمَّنْ أَهْلَكَهُمْ اللَّه كَمَا أَهْلَكَ مَنْ قَبْلهمْ مِنَ الْأُمَم بِتَكْذِيبِهَا رُسُلهَا .</p></td></tr></table></body></html>
