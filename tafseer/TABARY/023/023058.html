<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ بِآيَاتِ رَبِّهِمْ يُؤْمِنُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَالَّذِينَ هُمْ بِآيَاتِ كِتَابه وَحُجَجه مُصَدِّقُونَ .</p></td></tr></table></body></html>
