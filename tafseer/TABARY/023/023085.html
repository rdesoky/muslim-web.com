<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَيَقُولُونَ لِلَّهِ قُلْ أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : فَقُلْ لَهُمْ إِذَا أَجَابُوك بِذَلِكَ كَذَلِكَ : أَفَلَا تَذَكَّرُونَ فَتَعْلَمُونَ أَنَّ مَنْ قَدَرَ عَلَى خَلْق ذَلِكَ ابْتِدَاء فَهُوَ قَادِر عَلَى إِحْيَائِهِمْ بَعْد مَمَاتهمْ وَإِعَادَتهمْ خَلْقًا سَوِيًّا بَعْد فَنَائِهِمْ ؟</p></td></tr></table></body></html>
