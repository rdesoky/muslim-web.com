<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ ثَقُلَتْ مَوَازِينُهُ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَمَنْ ثَقُلَتْ مَوَازِينه } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ فَمَنْ ثَقُلَتْ مَوَازِينه } </quran>مَوَازِين حَسَنَاته وَخَفَّتْ مَوَازِين سَيِّئَاته .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَأُولَئِكَ هُمُ الْمُفْلِحُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي الْخَالِدُونَ فِي جَنَّات النَّعِيم .</p></td></tr></table></body></html>
