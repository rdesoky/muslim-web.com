<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فِرْعَوْنُ وَمَا رَبُّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْل <quran>{ قَالَ فِرْعَوْن وَمَا رَبّ الْعَالَمِينَ } </quran>يَقُول : وَأَيّ شَيْء رَبّ الْعَالَمِينَ ؟</p></td></tr></table></body></html>
