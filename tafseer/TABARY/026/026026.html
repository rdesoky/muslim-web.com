<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>فَقَالَ لَهُمْ الَّذِي دَعَوْته إِلَيْهِ وَإِلَى عِبَادَته <quran>{ رَبّكُمْ } </quran>الَّذِي خَلَقَكُمْ <quran>{ وَرَبّ آبَائِكُمْ الْأَوَّلِينَ }</quran></p></td></tr></table></body></html>
