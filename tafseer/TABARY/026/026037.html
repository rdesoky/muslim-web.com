<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَأْتُوكَ بِكُلِّ سَحَّارٍ عَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : فَأَجَابَ فِرْعَوْن الْمَلَأ حَوْله بِأَنْ قَالُوا لَهُ : أَخِّرْ مُوسَى وَأَخَاهُ وَأَنْظِرْهُ , وَابْعَثْ فِي بِلَادك وَأَمْصَار مِصْر حَاشِرِينَ يَحْشِرُونَ إِلَيْك كُلّ سَحَّار عَلِيم بِالسِّحْرِ .</p></td></tr></table></body></html>
