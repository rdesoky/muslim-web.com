<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ نَعَمْ وَإِنَّكُمْ إِذًا لَمِنَ الْمُقَرَّبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ قَالَ } </quran>فِرْعَوْن لَهُمْ <quran>{ نَعَمْ } </quran>لَكُمْ الْأَجْر عَلَى ذَلِكَ <quran>{ وَإِنَّكُمْ إِذًا لَمِنْ الْمُقَرَّبِينَ } </quran>مِنَّا .</p></td></tr></table></body></html>
