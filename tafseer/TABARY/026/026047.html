<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>قَائِلِينَ : <quran>{ آمَنَّا بِرَبِّ الْعَالَمِينَ } </quran>الَّذِي دَعَانَا مُوسَى إِلَى عِبَادَته دُون فِرْعَوْن وَمَلَئِهِ.</p></td></tr></table></body></html>
