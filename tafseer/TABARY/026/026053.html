<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَرْسَلَ فِرْعَوْنُ فِي الْمَدَائِنِ حَاشِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَأَرْسَلَ فِرْعَوْن فِي الْمَدَائِن حَاشِرِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : فَأَرْسَلَ فِرْعَوْن فِي الْمَدَائِن يَحْشُر لَهُ جُنْده وَقَوْمه .</p></td></tr></table></body></html>
