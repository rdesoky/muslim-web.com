<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَخْرَجْنَاهُمْ مِنْ جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَأَخْرَجْنَاهُمْ مِنْ جَنَّات وَعُيُون } </quran></subtitle>يَقُول تَعَالَى ذِكْره : فَأَخْرَجْنَا فِرْعَوْن وَقَوْمه مِنْ بَسَاتِين وَعُيُون مَاء ,</p></td></tr></table></body></html>
