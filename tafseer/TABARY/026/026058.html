<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَكُنُوزٍ وَمَقَامٍ كَرِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَكُنُوز ذَهَب وَفِضَّة , وَمَقَام كَرِيم . قِيلَ : إِنَّ ذَلِكَ الْمَقَام الْكَرِيم : الْمَنَابِر.</p></td></tr></table></body></html>
