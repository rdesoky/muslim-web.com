<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَغْرَقْنَا الْآخَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ أَغْرَقْنَا الْآخَرِينَ } </quran>يَقُول : ثُمَّ أَغْرَقْنَا فِرْعَوْن وَقَوْمه مِنْ الْقِبْط فِي الْبَحْر بَعْد أَنْ أَنْجَيْنَا مُوسَى مِنْهُ وَمَنْ مَعَهُ .</p></td></tr></table></body></html>
