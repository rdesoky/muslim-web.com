<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ } </quran></subtitle>يَقُول : فَإِنَّهُمْ عَدُوّ لِي إِلَّا رَبّ الْعَالَمِينَ <quran>{ الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ } </quran>لِلصَّوَابِ مِنْ الْقَوْل وَالْعَمَل , وَيُسَدِّدنِي لِلرَّشَادِ .</p></td></tr></table></body></html>
