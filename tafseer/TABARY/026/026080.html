<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَإِذَا سَقِمَ جِسْمِي وَاعْتَلَّ , فَهُوَ يُبْرِئهُ وَيُعَافِيه.</p></td></tr></table></body></html>
