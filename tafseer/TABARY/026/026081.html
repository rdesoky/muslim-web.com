<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِي يُمِيتُنِي ثُمَّ يُحْيِينِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَاَلَّذِي يُمِيتنِي ثُمَّ يُحْيِينِ } </quran></subtitle>يَقُول : وَاَلَّذِي يُمِيتنِي إِذَا شَاءَ ثُمَّ يُحْيِينِي إِذَا أَرَادَ بَعْد مَمَاتِي.</p></td></tr></table></body></html>
