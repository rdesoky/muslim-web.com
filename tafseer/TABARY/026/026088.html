<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : لَا تُخْزِنِي يَوْم لَا يَنْفَع مَنْ كَفَرَ بِك وَعَصَاك فِي الدُّنْيَا مَال كَانَ لَهُ فِي الدُّنْيَا , وَلَا بَنُوهُ الَّذِينَ كَانُوا لَهُ فِيهَا , فَيَدْفَع ذَلِكَ عَنْهُ عِقَاب اللَّه إِذَا عَاقَبَهُ , وَلَا يُنْجِيه مِنْهُ .</p></td></tr></table></body></html>
