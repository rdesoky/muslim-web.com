<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَقِيلَ لَهُمْ أَيْنَ مَا كُنْتُمْ تَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَقِيلَ } </quran>لِلْغَاوِينَ <quran>{ أَيْنَ مَا كُنْتُمْ تَعْبُدُونَ مِنْ دُون اللَّه }</quran></p></td></tr></table></body></html>
