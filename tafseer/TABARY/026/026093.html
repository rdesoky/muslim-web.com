<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ دُونِ اللَّهِ هَلْ يَنْصُرُونَكُمْ أَوْ يَنْتَصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ مِنْ دُون اللَّه } </quran>مِنْ الْأَنْدَاد <quran>{ هَلْ يَنْصُرُونَكُمْ } </quran>الْيَوْم مِنْ اللَّه , فَيُنْقِذُونَكُمْ مِنْ عَذَابه <quran>{ أَوْ يَنْتَصِرُونَ } </quran>لِأَنْفُسِهِمْ , فَيَنْجُونَهَا مِمَّا يُرَاد بِهَا ؟</p></td></tr></table></body></html>
