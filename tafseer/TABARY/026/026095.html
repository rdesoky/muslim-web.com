<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَجُنُودُ إِبْلِيسَ أَجْمَعُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَجُنُود إِبْلِيس أَجْمَعُونَ } </quran>يَقُول : وَكُبْكِبَ فِيهَا مَعَ الْأَنْدَاد وَالْغَاوِينَ جُنُود إِبْلِيس أَجْمَعُونَ . وَجُنُوده : كُلّ مَنْ كَانَ مِنْ أَتْبَاعه , مِنْ ذُرِّيَّته كَانَ أَوْ مِنْ ذُرِّيَّة آدَم .</p></td></tr></table></body></html>
