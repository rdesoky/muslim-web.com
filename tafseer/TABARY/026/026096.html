<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا وَهُمْ فِيهَا يَخْتَصِمُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ قَالُوا وَهُمْ فِيهَا يَخْتَصِمُونَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : قَالَ هَؤُلَاءِ الْغَاوُونَ وَالْأَنْدَاد الَّتِي كَانُوا يَعْبُدُونَهَا مِنْ دُون اللَّه وَجُنُود إِبْلِيس , وَهُمْ فِي الْجَحِيم يَخْتَصِمُونَ .</p></td></tr></table></body></html>
