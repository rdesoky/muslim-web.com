<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَاللَّهِ إِنْ كُنَّا لَفِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : تَاللَّهِ لَقَدْ كُنَّا فِي ذَهَاب عَنْ الْحَقّ , إِنْ كُنَّا لَفِي ضَلَال مُبِين , يُبَيِّن ذَهَابنَا ذَلِكَ عَنْهُ عَنْ نَفْسه , لِمَنْ تَأَمَّلَهُ وَتَدَبَّرَهُ , أَنَّهُ ضَلَال وَبَاطِل .</p></td></tr></table></body></html>
