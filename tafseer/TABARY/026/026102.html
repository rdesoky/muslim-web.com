<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله <quran>{ فَلَوْ أَنَّ لَنَا كَرَّة فَنَكُون مِنْ الْمُؤْمِنِينَ } </quran>يَقُول : فَلَوْ أَنَّ لَنَا رَجْعَة إِلَى الدُّنْيَا فَنُؤْمِن بِاَللَّهِ فَنَكُون بِإِيمَانِنَا بِهِ مِنْ الْمُؤْمِنِينَ .</p></td></tr></table></body></html>
