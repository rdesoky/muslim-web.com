<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ</font></td></tr><tr><td align=right dir=rtl><p>وَإِنَّ رَبّك يَا مُحَمَّد لَهُوَ الشَّدِيد الِانْتِقَام مِمَّنْ عَبَدَ دُونه , ثُمَّ لَمْ يَتُبْ مِنْ كُفْره حَتَّى هَلَكَ , الرَّحِيم بِمَنْ تَابَ مِنْهُمْ أَنْ يُعَاقِبهُ عَلَى مَا كَانَ سَلَفَ مِنْهُ قَبْل تَوْبَته مِنْ إِثْم وَجُرْم .</p></td></tr></table></body></html>
