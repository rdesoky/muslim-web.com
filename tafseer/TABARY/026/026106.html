<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُمْ أَخُوهُمْ نُوحٌ أَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ قَالَ لَهُمْ أَخُوهُمْ نُوح أَلَا تَتَّقُونَ } </quran>فَتَحْذَرُوا عِقَابه عَلَى كُفْركُمْ بِهِ , وَتَكْذِيبكُمْ رُسُله .</p></td></tr></table></body></html>
