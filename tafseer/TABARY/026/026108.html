<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّقُوا اللَّهَ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَاتَّقُوا اللَّه وَأَطِيعُونِ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : فَاتَّقُوا عِقَاب اللَّه أَيّهَا الْقَوْم عَلَى كُفْركُمْ بِهِ , وَأَطِيعُونِي فِي نَصِيحَتِي لَكُمْ , وَأَمْرِي إِيَّاكُمْ بِاتِّقَائِهِ .</p></td></tr></table></body></html>
