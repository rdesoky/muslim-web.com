<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا نُوحُ لَتَكُونَنَّ مِنَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : قَالَ لِنُوحٍ قَوْمه : لَئِنْ لَمْ تَنْتَهِ يَا نُوح عَمَّا تَقُول , وَتَدْعُو إِلَيْهِ , وَتَعِيب بِهِ آلِهَتنَا , لَتَكُونَن مِنْ الْمَشْتُومِينَ , يَقُول : لَنَشْتُمك .</p></td></tr></table></body></html>
