<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ رَبِّ إِنَّ قَوْمِي كَذَّبُونِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ قَالَ رَبّ إِنَّ قَوْمِي كَذَّبُونِ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : قَالَ نُوح : <quran>{ رَبّ إِنَّ قَوْمِي كَذَّبُونِ } </quran>فِيمَا أَتَيْتهمْ بِهِ مِنْ الْحَقّ مِنْ عِنْدك , وَرَدُّوا عَلَيَّ نَصِيحَتِي لَهُمْ .</p></td></tr></table></body></html>
