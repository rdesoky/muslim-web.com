<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَغْرَقْنَا بَعْدُ الْبَاقِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ أَغْرَقْنَا بَعْد الْبَاقِينَ } </quran>مِنْ قَوْمه الَّذِينَ كَذَّبُوهُ , وَرَدُّوا عَلَيْهِ النَّصِيحَة .</p></td></tr></table></body></html>
