<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّقُوا اللَّهَ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>بِطَاعَتِهِ وَالِانْتِهَاء إِلَى مَا يَأْمُركُمْ وَيَنْهَاكُمْ <quran>{ وَأَطِيعُونِ } </quran>فِيمَا آمُركُمْ بِهِ مِنْ اِتِّقَاء اللَّه وَتَحْذِيركُمْ سَطْوَته .</p></td></tr></table></body></html>
