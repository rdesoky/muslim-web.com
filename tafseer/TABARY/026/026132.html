<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاتَّقُوا الَّذِي أَمَدَّكُمْ بِمَا تَعْلَمُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَاحْذَرُوا سُخْط الَّذِي أَعْطَاكُمْ مِنْ عِنْده مَا تَعْلَمُونَ.</p></td></tr></table></body></html>
