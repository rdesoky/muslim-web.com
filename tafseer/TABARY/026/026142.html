<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُمْ أَخُوهُمْ صَالِحٌ أَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p>إِذْ دَعَاهُمْ صَالِح أَخُوهُمْ إِلَى اللَّه , فَقَالَ لَهُمْ : أَلَا تَتَّقُونَ عِقَاب اللَّه يَا قَوْم عَلَى مَعْصِيَتكُمْ إِيَّاهُ , وَخِلَافكُمْ أَمْره , بِطَاعَتِكُمْ أَمْر الْمُفْسِدِينَ فِي أَرْض اللَّه .</p></td></tr></table></body></html>
