<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَاتَّقُوا اللَّهَ وَأَطِيعُونِ</font></td></tr><tr><td align=right dir=rtl><p>أَيّهَا الْقَوْم , وَاحْذَرُوا عِقَابه <quran>{ وَأَطِيعُونِ } </quran>فِي تَحْذِيرِي إِيَّاكُمْ , وَأَمْر رَبّكُمْ بِاتِّبَاعِ طَاعَته.</p></td></tr></table></body></html>
