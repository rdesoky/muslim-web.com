<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتُتْرَكُونَ فِي مَا هَا هُنَا</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ أَتُتْرَكُونَ فِي مَا هَاهُنَا آمِنِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره مُخْبِرًا عَنْ قِيل صَالِح لِقَوْمِهِ مِنْ ثَمُود : أَيَتْرُكُكُمْ يَا قَوْم رَبّكُمْ فِي هَذِهِ الدُّنْيَا آمِنِينَ , لَا تَخَافُونَ شَيْئًا .</p></td></tr></table></body></html>
