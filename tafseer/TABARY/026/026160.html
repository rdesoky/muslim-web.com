<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ قَوْمُ لُوطٍ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ كَذَّبَتْ قَوْم لُوط الْمُرْسَلِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ كَذَّبَتْ قَوْم لُوط } </quran>مَنْ أَرْسَلَهُ اللَّه إِلَيْهِمْ مِنْ الرُّسُل حِين</p></td></tr></table></body></html>
