<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَتَأْتُونَ الذُّكْرَانَ مِنَ الْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ أَتَأْتُونَ الذُّكْرَان مِنْ الْعَالَمِينَ } </quran></subtitle>يَعْنِي بِقَوْلِهِ : <quran>{ أَتَأْتُونَ الذُّكْرَان مِنْ الْعَالَمِينَ } </quran>: أَتَنْكِحُونَ الذُّكْرَان مِنْ بَنِي آدَم فِي أَدْبَارهمْ.</p></td></tr></table></body></html>
