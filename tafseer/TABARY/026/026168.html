<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول لَهُمْ لُوط : إِنِّي لِعَمَلِكُمْ الَّذِي تَعْمَلُونَهُ مِنْ إِتْيَان الذُّكْرَان فِي أَدْبَارهمْ مِنْ الْقَالِينَ , يَعْنِي مِنْ الْمُبْغِضِينَ , الْمُنْكِرِينَ فِعْله .</p></td></tr></table></body></html>
