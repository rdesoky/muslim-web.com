<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا</font></td></tr><tr><td align=right dir=rtl><p>وَذَلِكَ إِرْسَال اللَّه عَلَيْهِمْ حِجَارَة مِنْ سِجِّيل مِنْ السَّمَاء .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَسَاءَ مَطَرُ الْمُنْذَرِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : فَبِئْسَ ذَلِكَ الْمَطَر مَطَر الْقَوْم الَّذِينَ أَنْذَرَهُمْ نَبِيّهمْ فَكَذَّبُوهُ .</p></td></tr></table></body></html>
