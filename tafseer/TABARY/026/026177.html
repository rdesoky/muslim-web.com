<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لَهُمْ شُعَيْبٌ أَلَا تَتَّقُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله <quran>{ إِذْ قَالَ لَهُمْ شُعَيْب أَلَا تَتَّقُونَ } </quran>يَقُول تَعَالَى ذِكْره : قَالَ لَهُمْ شُعَيْب : أَلَا تَتَّقُونَ عِقَاب اللَّه عَلَى مَعْصِيَتكُمْ رَبّكُمْ .</p></td></tr></table></body></html>
