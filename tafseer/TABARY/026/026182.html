<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيم } </quran></subtitle>يَعْنِي بِقَوْلِهِ <quran>{ وَزِنُوا بِالْقِسْطَاسِ } </quran>وَزِنُوا بِالْمِيزَانِ <quran>{ الْمُسْتَقِيم } </quran>الَّذِي لَا بَخْس فِيهِ عَلَى مَنْ وَزَنْتُمْ لَهُ .</p></td></tr></table></body></html>
