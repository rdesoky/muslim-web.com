<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا إِنَّمَا أَنْتَ مِنَ الْمُسَحَّرِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قَالُوا إِنَّمَا أَنْتَ مِنْ الْمُسَحَّرِينَ } </quran>يَقُول : قَالُوا : إِنَّمَا أَنْتَ يَا شُعَيْب مُعَلَّل تُعَلَّل بِالطَّعَامِ وَالشَّرَاب , كَمَا نُعَلَّل بِهِمَا , وَلَسْت مَلَكًا .</p></td></tr></table></body></html>
