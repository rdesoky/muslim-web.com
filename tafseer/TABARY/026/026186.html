<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا وَإِنْ نَظُنُّكَ لَمِنَ الْكَاذِبِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَمَا أَنْتَ إِلَّا بَشَر مِثْلنَا } </quran>تَأْكُل وَتَشْرَب <quran>{ وَإِنْ نَظُنّك لَمِنْ الْكَاذِبِينَ } . </quran>يَقُول : وَمَا نَحْسِبك فِيمَا تُخْبِرنَا وَتَدْعُونَا إِلَيْهِ , إِلَّا مِمَّنْ يَكْذِب فِيمَا يَقُول .</p></td></tr></table></body></html>
