<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ جَاءَهُمْ مَا كَانُوا يُوعَدُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : ثُمَّ جَاءَهُمْ الْعَذَاب الَّذِي كَانُوا يُوعَدُونَ عَلَى كُفْرهمْ بِآيَاتِنَا , وَتَكْذِيبهمْ رَسُولنَا .</p></td></tr></table></body></html>
