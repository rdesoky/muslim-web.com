<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَهُدًى</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : إِنَّ هَذَا الْقُرْآن لَهُدًى , يَقُول : لَبَيَان مِنْ اللَّه , بَيَّنَ بِهِ الْحَقّ فِيمَا اِخْتَلَفَ فِيهِ خَلْقه مِنْ أُمُور دِينهمْ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَرَحْمَةٌ لِلْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَرَحْمَة لِمَنْ صَدَّقَ بِهِ وَعَمِلَ بِمَا فِيهِ .</p></td></tr></table></body></html>
