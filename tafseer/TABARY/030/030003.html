<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي أَدْنَى الْأَرْضِ وَهُمْ مِنْ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ فِي أَدْنَى الْأَرْض } </quran>مِنْ أَرْض الشَّام إِلَى أَرْض فَارِس <quran>{ وَهُمْ مِنْ بَعْد غَلَبهمْ } </quran>يَقُول : وَالرُّوم مِنْ بَعْد غَلَبَة فَارِس إِيَّاهُمْ <quran>{ سَيَغْلِبُونَ } </quran>فَارِس</p></td></tr></table></body></html>
