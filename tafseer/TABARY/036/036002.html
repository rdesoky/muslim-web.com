<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْقُرْآنِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَالْقُرْآن الْحَكِيم } </quran>يَقُول : وَالْقُرْآن الْمُحْكَم بِمَا فِيهِ مِنْ أَحْكَامه , وَبَيِّنَات حُجَجه</p></td></tr></table></body></html>
