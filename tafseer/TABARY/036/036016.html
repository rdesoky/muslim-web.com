<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ قَالُوا رَبّنَا يَعْلَم إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ } </quran>يَقُول : قَالَ الرُّسُل : رَبّنَا يَعْلَم إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ فِيمَا دَعَوْنَاكُمْ إِلَيْهِ , وَإِنَّا لَصَادِقُونَ</p></td></tr></table></body></html>
