<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنِّي إِذًا لَفِي ضَلَالٍ مُبِينٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنِّي إِذًا لَفِي ضَلَال مُبِين } </quran>يَقُول : <quran>{ إِنِّي } </quran>إِنْ اِتَّخَذْت مِنْ دُون اللَّه آلِهَة هَذِهِ صِفَتهَا <quran>{ إِذَنْ لَفِي ضَلَال مُبِين } </quran>لِمَنْ تَأَمَّلَهُ , جَوْره عَنْ سَبِيل الْحَقّ .</p></td></tr></table></body></html>
