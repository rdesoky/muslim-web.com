<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالُوا بَلْ لَمْ تَكُونُوا مُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قَالُوا بَلْ لَمْ يَكُونُوا مُؤْمِنِينَ } </quran>يَقُول تَعَالَى ذِكْره : قَالَتْ الْجِنّ لِلْإِنْسِ مُجِيبَة لَهُمْ : بَلْ لَمْ تَكُونُوا بِتَوْحِيدِ اللَّه مُقِرِّينَ , وَكُنْتُمْ لِلْأَصْنَامِ عَابِدِينَ</p></td></tr></table></body></html>
