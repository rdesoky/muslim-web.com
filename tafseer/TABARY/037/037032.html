<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَغْوَيْنَاكُمْ إِنَّا كُنَّا غَاوِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَأَغْوَيْنَاكُمْ إِنَّا كُنَّا غَاوِينَ } </quran>يَقُول : فَأَضْلَلْنَاكُمْ عَنْ سَبِيل اللَّه وَالْإِيمَان بِهِ إِنَّا كُنَّا ضَالِّينَ ; وَهَذَا أَيْضًا خَبَر مِنْ اللَّه عَنْ قِيل الْجِنّ وَالْإِنْس ,</p></td></tr></table></body></html>
