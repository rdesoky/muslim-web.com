<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَلَى سُرُرٍ مُتَقَابِلِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ عَلَى سُرُر مُتَقَابِلِينَ } </quran>يَعْنِي : أَنَّ بَعْضهمْ يُقَابِل بَعْضًا , وَلَا يَنْظُر بَعْضهمْ فِي قَفَا بَعْض .</p></td></tr></table></body></html>
