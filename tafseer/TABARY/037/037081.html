<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ مِنْ عِبَادِنَا الْمُؤْمِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّهُ مِنْ عِبَادنَا الْمُؤْمِنِينَ } </quran>يَقُول : إِنَّ نُوحًا مِنْ عِبَادنَا الَّذِينَ آمَنُوا بِنَا , فَوَحَّدُونَا , وَأَخْلَصُوا لَنَا الْعِبَادَة , وَأَفْرَدُونَا بِالْأُلُوهَةِ.</p></td></tr></table></body></html>
