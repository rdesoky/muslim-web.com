<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَاذَا تَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِذْ قَالَ لِأَبِيهِ وَقَوْمه مَاذَا تَعْبُدُونَ } </quran>يَقُول حِين قَالَ : يَعْنِي إِبْرَاهِيم لِأَبِيهِ وَقَوْمه : أَيّ شَيْء تَعْبُدُونَ .</p></td></tr></table></body></html>
