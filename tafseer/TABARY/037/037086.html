<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَئِفْكًا آلِهَةً دُونَ اللَّهِ تُرِيدُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَإِفْكًا آلِهَة دُون اللَّه تُرِيدُونَ } </quran>يَقُول : أَكَذِبًا مَعْبُودًا غَيْر اللَّه تُرِيدُونَ .</p></td></tr></table></body></html>
