<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلَامٌ عَلَى إِبْرَاهِيمَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ سَلَام عَلَى إِبْرَاهِيم } </quran>يَقُول تَعَالَى ذِكْره : أَمَنَة مِنْ اللَّه فِي الْأَرْض لِإِبْرَاهِيم أَنْ لَا يَذْكُر مِنْ بَعْده إِلَّا بِالْجَمِيلِ مِنْ الذِّكْر .</p></td></tr></table></body></html>
