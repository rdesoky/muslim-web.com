<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ كَذَلِكَ نَجْزِي الْمُحْسِنِينَ } </quran>يَقُول : كَمَا جَزَيْنَا إِبْرَاهِيم عَلَى طَاعَته إِيَّانَا وَإِحْسَانه فِي الِانْتِهَاء إِلَى أَمْرنَا , كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</p></td></tr></table></body></html>
