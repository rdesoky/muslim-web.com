<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَلَامٌ عَلَى مُوسَى وَهَارُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ سَلَام عَلَى مُوسَى وَهَارُون } </quran>يَقُول : وَذَلِكَ أَنْ يُقَال : سَلَام عَلَى مُوسَى وَهَارُون .</p></td></tr></table></body></html>
