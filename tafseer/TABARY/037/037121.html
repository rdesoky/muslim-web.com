<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ } </quran>يَقُول : هَكَذَا نَجْزِي أَهْل طَاعَتنَا , وَالْعَامِلِينَ بِمَا يُرْضِينَا عَنْهُمْ</p></td></tr></table></body></html>
