<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَ اللَّهِ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ إِلَّا عِبَاد اللَّه الْمُخْلَصِينَ } </quran>يَقُول : فَإِنَّهُمْ يَحْضُرُونَ فِي عَذَاب اللَّه , إِلَّا عِبَاد اللَّه الَّذِينَ أَخْلَصَهُمْ مِنْ الْعَذَاب</p></td></tr></table></body></html>
