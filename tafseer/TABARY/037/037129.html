<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَرَكْنَا عَلَيْهِ فِي الْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَتَرَكْنَا عَلَيْهِ فِي الْآخِرِينَ } </quran>يَقُول : وَأَبْقَيْنَا عَلَيْهِ الثَّنَاء الْحَسَن فِي الْآخِرِينَ مِنْ الْأُمَم بَعْده.</p></td></tr></table></body></html>
