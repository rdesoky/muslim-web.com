<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذْ نَجَّيْنَاهُ وَأَهْلَهُ أَجْمَعِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ إِذْ نَجَّيْنَاهُ وَأَهْله أَجْمَعِينَ } </quran>يَقُول : إِذْ نَجَّيْنَا لُوطًا وَأَهْله أَجْمَعِينَ مِنْ الْعَذَاب الَّذِي أَحْلَلْنَاهُ بِقَوْمِهِ , فَأَهْلَكْنَاهُمْ بِهِ.</p></td></tr></table></body></html>
