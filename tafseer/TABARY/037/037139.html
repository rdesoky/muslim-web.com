<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ يُونُسَ لَمِنَ الْمُرْسَلِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَإِنَّ يُونُس لَمِنْ الْمُرْسَلِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : وَإِنَّ يُونُس لَمُرْسَل مِنْ الْمُرْسَلِينَ إِلَى أَقْوَامهمْ</p></td></tr></table></body></html>
