<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَلَا تَذَكَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَفَلَا تَذَكَّرُونَ } </quran>يَقُول : أَفَلَا تَتَدَبَّرُونَ مَا تَقُولُونَ ؟ فَتَعْرِفُوا خَطَأَهُ فَتَنْتَهُوا عَنْ قِيله .</p></td></tr></table></body></html>
