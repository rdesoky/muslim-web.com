<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَ اللَّهِ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِلَّا عِبَاد اللَّه الْمُخْلَصِينَ } </quran>يَقُول : وَلَقَدْ عَلِمَتْ الْجِنَّة أَنَّ الَّذِينَ قَالُوا : إِنَّ الْمَلَائِكَة بَنَات اللَّه لَمُحْضَرُونَ الْعَذَاب , إِلَّا عِبَاد اللَّه الَّذِينَ أَخْلَصَهُمْ لِرَحْمَتِهِ , وَخَلَقَهُمْ لِجَنَّتِهِ .</p></td></tr></table></body></html>
