<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنَّكُمْ وَمَا تَعْبُدُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَإِنَّكُمْ وَمَا تَعْبُدُونَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ فَإِنَّكُمْ } </quran>أَيّهَا الْمُشْرِكُونَ بِاَللَّهِ <quran>{ وَمَا تَعْبُدُونَ } </quran>مِنْ الْآلِهَة وَالْأَوْثَان</p></td></tr></table></body></html>
