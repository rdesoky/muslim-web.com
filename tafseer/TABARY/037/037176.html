<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ } </quran>يَقُول : فَبِنُزُولِ عَذَابنَا بِهِمْ يَسْتَعْجِلُونَك يَا مُحَمَّد , وَذَلِكَ قَوْلهمْ لِلنَّبِيِّ <quran>{ مَتَى هَذَا الْوَعْد إِنْ كُنْتُمْ صَادِقِينَ }</quran></p></td></tr></table></body></html>
