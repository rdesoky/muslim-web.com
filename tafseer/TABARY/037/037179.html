<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَبْصِرْ فَسَوْفَ يُبْصِرُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَأَبْصِرْ فَسَوْفَ يُبْصِرُونَ } </quran>يَقُول : وَأَنْظِرْهُمْ فَسَوْفَ يَرَوْنَ مَا يَحِلّ بِهِمْ مِنْ عِقَابنَا فِي حِين لَا تَنْفَعهُمْ التَّوْبَة , وَذَلِكَ عِنْد نُزُول بَأْس اللَّه بِهِمْ .</p></td></tr></table></body></html>
