<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنْتُمْ عَنْهُ مُعْرِضُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَنْتُمْ عَنْهُ مُعْرِضُونَ } </quran>يَقُول : أَنْتُمْ عَنْهُ مُنْصَرِفُونَ لَا تَعْمَلُونَ بِهِ , وَلَا تُصَدِّقُونَ بِمَا فِيهِ مِنْ حِجَج اللَّه وَآيَاته.</p></td></tr></table></body></html>
