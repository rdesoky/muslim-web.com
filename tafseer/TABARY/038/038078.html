<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ عَلَيْكَ لَعْنَتِي إِلَى يَوْمِ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَإِنَّ عَلَيْك لَعْنَتِي } </quran>يَقُول : وَإِنَّ لَك طَرْدِي مِنْ الْجَنَّة <quran>{ إِلَى يَوْم الدِّين } </quran>يَعْنِي : إِلَى يَوْم مُجَازَاة الْعِبَاد وَمُحَاسَبَتهمْ</p></td></tr></table></body></html>
