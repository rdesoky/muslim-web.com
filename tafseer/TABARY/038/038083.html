<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَّا عِبَادَكَ مِنْهُمُ الْمُخْلَصِينَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ إِلَّا عِبَادك مِنْهُمْ الْمُخْلَصِينَ } </quran>يَقُول : إِلَّا مَنْ أَخْلَصْته مِنْهُمْ لِعِبَادَتِك , وَعَصَمْته مِنْ إِضْلَالِي , فَلَمْ تَجْعَل لِي عَلَيْهِ سَبِيلًا , فَإِنِّي لَا أَقْدِر عَلَى إِضْلَاله وَإِغْوَائِهِ.</p></td></tr></table></body></html>
