<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَإِنَّا إِلَى رَبّنَا لَمُنْقَلِبُونَ } </quran>يَقُول جَلَّ ثَنَاؤُهُ : وَلِيَقُولُوا أَيْضًا : وَإِنَّا إِلَى رَبّنَا مِنْ بَعْد مَمَاتنَا لَصَائِرُونَ إِلَيْهِ رَاجِعُونَ .</p></td></tr></table></body></html>
