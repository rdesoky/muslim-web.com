<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَكُمْ فِيهَا فَاكِهَةٌ كَثِيرَةٌ مِنْهَا تَأْكُلُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ لَكُمْ فِيهَا } </quran>يَقُول : لَكُمْ فِي الْجَنَّة فَاكِهَة كَثِيرَة مِنْ كُلّ نَوْع <quran>{ مِنْهَا تَأْكُلُونَ } </quran>يَقُول : مِنَ الْفَاكِهَة تَأْكُلُونَ مَا اشْتَهَيْتُمْ.</p></td></tr></table></body></html>
