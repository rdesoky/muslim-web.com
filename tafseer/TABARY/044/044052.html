<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِي جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فِي جَنَّات وَعُيُون } </quran>الْجَنَّات وَالْعُيُون تَرْجَمَة عَنِ الْمَقَام الْأَمِين , وَالْمَقَام الْأَمِين : هُوَ الْجَنَّات وَالْعُيُون , وَالْجَنَّات : الْبَسَاتِين , وَالْعُيُون : عُيُون الْمَاء الْمُطَّرِد فِي أُصُول أَشْجَار الْجَنَّات .</p></td></tr></table></body></html>
