<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>تَنْزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْحَكِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَأَمَّا قَوْله : <quran>{ تَنْزِيل الْكِتَاب مِنَ اللَّه } </quran>فَإِنَّ مَعْنَاهُ : هَذَا تَنْزِيل الْقُرْآن مِنْ عِنْد اللَّه <quran>{ الْعَزِيز } </quran>فِي انْتِقَامه مِنْ أَعْدَائِهِ <quran>{ الْحَكِيم } </quran>فِي تَدْبِيره أَمْر خَلْقه .</p></td></tr></table></body></html>
