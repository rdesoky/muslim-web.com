<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيْلٌ لِكُلِّ أَفَّاكٍ أَثِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَيْل لِكُلِّ أَفَّاك أَثِيم } </quran></subtitle>يَقُول تَعَالَى ذِكْره : الْوَادِي السَّائِل مِنْ صَدِيد أَهْل جَهَنَّم , لِكُلِّ كَذَّاب ذِي إِثْم بِرَبِّهِ , مُفْتَرٍ عَلَيْهِ .</p></td></tr></table></body></html>
