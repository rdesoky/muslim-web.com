<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيَنْصُرَكَ اللَّهُ نَصْرًا عَزِيزًا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَيَنْصُرك عَلَى سَائِر أَعْدَائِك , وَمَنْ نَاوَأَك نَصْرًا , لَا يَغْلِبهُ غَالِب , وَلَا يَدْفَعهُ دَافِع , لِلْبَأْسِ الَّذِي يُؤَيِّدك اللَّه بِهِ , وَبِالظَّفَرِ الَّذِي يَمُدّك بِهِ.</p></td></tr></table></body></html>
