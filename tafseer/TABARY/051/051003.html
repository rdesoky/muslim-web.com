<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَالْجَارِيَاتِ يُسْرًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَالْجَارِيَات يُسْرًا } </quran>يَقُول : فَالسُّفُن الَّتِي تَجْرِي فِي الْبِحَار سَهْلًا يَسِيرًا</p></td></tr></table></body></html>
