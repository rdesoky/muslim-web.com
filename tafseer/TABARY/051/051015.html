<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَعُيُونٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ الْمُتَّقِينَ فِي جَنَّات وَعُيُون } </quran>يَقُول تَعَالَى ذِكْرُهُ : إِنَّ الَّذِينَ اتَّقَوْا اللَّهَ بِطَاعَتِهِ , وَاجْتِنَاب مَعَاصِيه فِي الدُّنْيَا فِي بَسَاتِينَ وَعُيُونِ مَاءٍ فِي الْآخِرَة .</p></td></tr></table></body></html>
