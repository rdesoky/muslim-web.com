<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قَالَ فَمَا خَطْبُكُمْ أَيُّهَا الْمُرْسَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قَالَ فَمَا خَطْبُكُمْ أَيّهَا الْمُرْسَلُونَ } </quran>يَقُول : قَالَ إِبْرَاهِيم لِضَيْفِهِ : فَمَا شَأْنُكُمْ أَيُّهَا الْمُرْسَلُونَ</p></td></tr></table></body></html>
