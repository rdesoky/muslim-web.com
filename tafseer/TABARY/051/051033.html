<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِنُرْسِلَ عَلَيْهِمْ حِجَارَةً مِنْ طِينٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ لِنُرْسِلَ عَلَيْهِمْ حِجَارَة مِنْ طِين } </quran>يَقُول : لِنُمْطِرَ عَلَيْهِمْ مِنْ السَّمَاء حِجَارَة مِنْ طِين .</p></td></tr></table></body></html>
