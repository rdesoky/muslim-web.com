<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالْأَرْضَ فَرَشْنَاهَا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَالْأَرْضَ فَرَشْنَاهَا } </quran>يَقُول تَعَالَى ذِكْرُهُ : وَالْأَرْضَ جَعَلْنَاهَا فِرَاشًا لِلْخَلْقِ</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَنِعْمَ الْمَاهِدُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ فَنِعْمَ الْمَاهِدُونَ } </quran>يَقُول : فَنِعْمَ الْمَاهِدُونَ لَهُمْ نَحْنُ.</p></td></tr></table></body></html>
