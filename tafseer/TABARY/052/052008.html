<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَا لَهُ مِنْ دَافِعٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ مَا لَهُ مِنْ دَافِع } </quran>يَقُول : مَا لِذَلِكَ الْعَذَاب الْوَاقِع بِالْكَافِرِينَ مِنْ دَافِع يَدْفَعهُ عَنْهُمْ , فَيُنْقِذُهُمْ مِنْهُ إِذَا وَقَعَ .</p></td></tr></table></body></html>
