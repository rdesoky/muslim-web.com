<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَسِيرُ الْجِبَالُ سَيْرًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَتَسِير الْجِبَال سَيْرًا } </quran>يَقُول : وَتَسِير الْجِبَال عَنْ أَمَاكِنهَا مِنَ الْأَرْض سَيْرًا , فَتَصِير هَبَاء مُنْبَثًّا .</p></td></tr></table></body></html>
