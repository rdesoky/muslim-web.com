<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِينَ هُمْ فِي خَوْضٍ يَلْعَبُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ الَّذِينَ هُمْ فِي خَوْض يَلْعَبُونَ } </quran>يَقُول : الَّذِينَ هُمْ فِي فِتْنَة وَاخْتِلَاط فِي الدُّنْيَا يَلْعَبُونَ , غَافِلِينَ عَمَّا هُمْ صَائِرُونَ إِلَيْهِ مِنْ عَذَاب اللَّه فِي الْآخِرَة .</p></td></tr></table></body></html>
