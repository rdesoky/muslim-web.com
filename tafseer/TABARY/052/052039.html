<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَهُ الْبَنَاتُ وَلَكُمُ الْبَنُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ أَمْ لَهُ الْبَنَات وَلَكُمُ الْبَنُونَ } </quran></subtitle>يَقُول تَعَالَى ذِكْرُهُ لِلْمُشْرِكِينَ بِهِ مِنْ قُرَيْش : أَلِرَبِّكُمْ أَيّهَا الْقَوْم الْبَنَات وَلَكُمْ الْبَنُونَ ؟ ذَلِكَ إِذَنْ قِسْمَةٌ ضِيزَى ,</p></td></tr></table></body></html>
