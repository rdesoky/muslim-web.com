<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ عِنْدَهُمُ الْغَيْبُ فَهُمْ يَكْتُبُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَمْ عِنْدهمُ الْغَيْب فَهُمْ يَكْتُبُونَ } </quran>يَقُول تَعَالَى ذِكْرُهُ : أَمْ عِنْدهمْ عِلْم الْغَيْب , فَهُمْ يَكْتُبُونَ ذَلِكَ لِلنَّاسِ , فَيُنَبِّئُونَهُمْ بِمَا شَاءُوا , وَيُخْبِرُونَهُمْ بِمَا أَرَادُوا .</p></td></tr></table></body></html>
