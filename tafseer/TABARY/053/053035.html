<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَعِنْدَهُ عِلْمُ الْغَيْبِ فَهُوَ يَرَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَعِنْدَهُ عِلْم الْغَيْب فَهُوَ يَرَى } </quran>يَقُول تَعَالَى ذِكْره : أَعِنْدَ هَذَا الَّذِي ضَمِنَ لَهُ صَاحِبه أَنْ يَتَحَمَّل عَنْهُ عَذَاب اللَّه فِي الْآخِرَة عِلْمُ الْغَيْب , فَهُوَ يَرَى حَقِيقَة قَوْله , وَوَفَائِهِ بِمَا وَعَدَ .</p></td></tr></table></body></html>
