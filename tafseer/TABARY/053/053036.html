<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَمْ لَمْ يُنَبَّأْ بِمَا فِي صُحُفِ مُوسَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَمْ لَمْ يُنَبَّأْ بِمَا فِي صُحُف مُوسَى } </quran>يَقُول تَعَالَى ذِكْرُهُ : أَمْ لَمْ يُخْبِر هَذَا الْمَضْمُون لَهُ , أَنْ يَتَحَمَّل عَنْهُ عَذَاب اللَّه فِي الْآخِرَة , بِالَّذِي فِي صُحُف مُوسَى بْن عِمْرَان عَلَيْهِ السَّلَام .</p></td></tr></table></body></html>
