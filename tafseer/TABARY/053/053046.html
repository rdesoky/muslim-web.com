<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ نُطْفَةٍ إِذَا تُمْنَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ مِنْ نُطْفَة إِذَا تُمْنَى } </quran>و " مِنْ " مِنْ صِلَة خَلَقَ يَقُول تَعَالَى ذِكْرُهُ : خَلَقَ ذَلِكَ مِنْ نُطْفَة إِذَا أَمْنَاهُ الرَّجُل وَالْمَرْأَة .</p></td></tr></table></body></html>
