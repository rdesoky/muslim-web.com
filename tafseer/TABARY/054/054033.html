<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَذَّبَتْ قَوْمُ لُوطٍ بِالنُّذُرِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ كَذَّبَتْ قَوْم لُوط بِالنُّذُرِ } </quran>يَقُول تَعَالَى ذِكْره : كَذَّبَتْ قَوْم لُوط بِآيَاتِ اللَّه الَّتِي أَنْذَرَهُمْ وَذَكَّرَهُمْ بِهَا .</p></td></tr></table></body></html>
