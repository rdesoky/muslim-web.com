<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَبِأَيِّ آلَاء رَبّكُمَا تُكَذِّبَانِ } </quran>يَقُول تَعَالَى ذِكْرُهُ : فَبِأَيِّ نِعَم رَبّكُمَا أَيّهَا الثَّقَلَان الَّتِي أَنْعَمَ عَلَيْكُمْ بِإِثَابَتِهِ الْمُحْسِنَ مِنْكُمْ مَا وَصَفَ جَلَّ ثَنَاؤُهُ فِي هَذِهِ الْآيَات تُكَذِّبَانِ.</p></td></tr></table></body></html>
