<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهِمَا عَيْنَانِ تَجْرِيَانِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فِيهِمَا عَيْنَانِ تَجْرِيَانِ } </quran></subtitle>يَقُول تَعَالَى ذِكْرُهُ فِي هَاتَيْنِ الْجَنَّتَيْنِ عَيْنَا مَاء تَجْرِيَانِ خِلَالَهُمَا</p></td></tr></table></body></html>
