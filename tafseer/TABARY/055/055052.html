<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهِمَا مِنْ كُلِّ فَاكِهَةٍ زَوْجَانِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فِيهِمَا مِنْ كُلّ فَاكِهَة زَوْجَانِ } </quran>يَقُول تَعَالَى ذِكْرُهُ : فِيهِمَا مِنْ كُلّ نَوْع مِنَ الْفَاكِهَة ضَرْبَانِ</p></td></tr></table></body></html>
