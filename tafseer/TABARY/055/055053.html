<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ</font></td></tr><tr><td align=right dir=rtl><p>فَبِأَيِّ آلَاء رَبّكُمَا الَّتِي أَنْعَمَ بِهَا عَلَى أَهْل طَاعَته مِنْ ذَلِكَ تُكَذِّبَانِ .</p></td></tr></table></body></html>
