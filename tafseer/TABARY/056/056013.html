<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُلَّةٌ مِنَ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ ثُلَّة مِنْ الْأَوَّلِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : جَمَاعَة مِنْ الْأُمَم الْمَاضِيَة , وَقَلِيل مِنْ أُمَّة مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ , وَهُمْ الْآخَرُونَ وَقِيلَ لَهُمْ الْآخَرُونَ : لِأَنَّهُمْ آخِر الْأُمَم</p></td></tr></table></body></html>
