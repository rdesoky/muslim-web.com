<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَفَاكِهَةٍ مِمَّا يَتَخَيَّرُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَفَاكِهَة مِمَّا يَتَخَيَّرُونَ } </quran>يَقُول تَعَالَى ذِكْره : وَيَطُوف هَؤُلَاءِ الْوِلْدَان الْمُخَلَّدُونَ عَلَى هَؤُلَاءِ السَّابِقِينَ بِفَاكِهَةٍ مِنْ الْفَوَاكِه الَّتِي يَتَخَيَّرُونَهَا مِنْ الْجَنَّة لِأَنْفُسِهِمْ , وَتَشْتَهِيهَا نُفُوسهمْ</p></td></tr></table></body></html>
