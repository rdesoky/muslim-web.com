<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَحْمِ طَيْرٍ مِمَّا يَشْتَهُونَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَلَحْم طَيْر مِمَّا يَشْتَهُونَ } </quran>يَقُول : وَيَطُوفُونَ أَيْضًا عَلَيْهِمْ بِلَحْمِ طَيْر مِمَّا يَشْتَهُونَ مِنْ الطَّيْر الَّذِي تَشْتَهِيه نُفُوسهمْ .</p></td></tr></table></body></html>
