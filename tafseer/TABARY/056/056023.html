<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>كَأَمْثَالِ اللُّؤْلُؤِ الْمَكْنُونِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ كَأَمْثَالِ اللُّؤْلُؤ الْمَكْنُون } </quran>يَقُول : هُنَّ فِي صَفَاء بَيَاضهنَّ وَحُسْنهنَّ , كَاللُّؤْلُؤِ الْمَكْنُون الَّذِي قَدْ صِين فِي كِنّ .</p></td></tr></table></body></html>
