<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَاءٍ مَسْكُوبٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَمَاء مَسْكُوب } </quran>يَقُول تَعَالَى ذِكْره وَفِيهِ أَيْضًا مَاء مَسْكُوب , يَعْنِي مَصْبُوب سَائِل فِي غَيْر أُخْدُود . كَمَا : 25843 - حَدَّثَنَا اِبْن حُمَيْد , قَالَ : ثَنَا مِهْرَان , عَنْ سُفْيَان <quran>{ وَمَاء مَسْكُوب } </quran>قَالَ : يَجْرِي فِي غَيْر أُخْدُود .</p></td></tr></table></body></html>
