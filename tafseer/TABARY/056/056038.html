<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِأَصْحَابِ الْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لِأَصْحَابِ الْيَمِين } </quran>يَقُول تَعَالَى ذِكْره : أَنْشَأْنَا هَؤُلَاءِ اللَّوَاتِي وَصَفَ صِفَتهنَّ مِنْ الْأَبْكَار لِلَّذِينَ يُؤْخَذ بِهِمْ ذَات الْيَمِين مِنْ مَوْقِف الْحِسَاب إِلَى الْجَنَّة .</p></td></tr></table></body></html>
