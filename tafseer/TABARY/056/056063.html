<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتُمْ مَا تَحْرُثُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَفَرَأَيْتُمْ مَا تَحْرُثُونَ } </quran>يَقُول تَعَالَى ذِكْره : أَفَرَأَيْتُمْ أَيّهَا النَّاس الْحَرْث الَّذِي تَحْرُثُونَهُ</p></td></tr></table></body></html>
