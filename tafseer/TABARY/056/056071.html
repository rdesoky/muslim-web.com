<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ أَفَرَأَيْتُمْ النَّار الَّتِي تُورُونَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : أَفَرَأَيْتُمْ أَيّهَا النَّاس النَّار الَّتِي تَسْتَخْرِجُونَ مِنْ زَنْدكُمْ</p></td></tr></table></body></html>
