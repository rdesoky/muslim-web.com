<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَسَبِّحْ بِاسْمِ رَبّك الْعَظِيم } </quran></subtitle>يَقُولهُ تَعَالَى ذِكْره لِنَبِيِّهِ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : فَسَبِّحْ يَا مُحَمَّد بِذِكْرِ رَبّك الْعَظِيم , وَتَسْمِيَته .</p></td></tr></table></body></html>
