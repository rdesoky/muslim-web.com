<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ لَقُرْآنٌ كَرِيمٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّهُ لَقُرْآن كَرِيم } </quran>يَقُول تَعَالَى ذِكْره : فَلَا أُقْسِم بِمَوَاقِع النُّجُوم أَنَّ هَذَا الْقُرْآن لَقُرْآن كَرِيم , وَالْهَاء فِي قَوْله : " إِنَّهُ " مِنْ ذِكْر الْقُرْآن .</p></td></tr></table></body></html>
