<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَوْلَا إِذَا بَلَغَتِ الْحُلْقُومَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَلَوْلَا إِذَا بَلَغَتْ الْحُلْقُوم } </quran>يَقُول تَعَالَى ذِكْره : فَهَلَّا إِذَا بَلَغَتْ النُّفُوس عِنْد خُرُوجهَا مِنْ أَجْسَادكُمْ أَيّهَا النَّاس حَلَاقِيمكُمْ</p></td></tr></table></body></html>
