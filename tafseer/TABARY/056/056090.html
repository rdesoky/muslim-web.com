<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا إِنْ كَانَ مِنْ أَصْحَابِ الْيَمِينِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَأَمَّا إِنْ كَانَ مِنْ أَصْحَاب الْيَمِين } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ وَأَمَّا إِنْ كَانَ } </quran>الْمَيِّت <quran>{ مِنْ أَصْحَاب الْيَمِين } </quran>الَّذِينَ يُؤْخَذ بِهِمْ إِلَى الْجَنَّة مِنْ ذَات أَيْمَانهمْ</p></td></tr></table></body></html>
