<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَتَصْلِيَةُ جَحِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَتَصْلِيَة جَحِيم } </quran>يَقُول : وَحَرِيق النَّار يُحْرَق بِهَا ; وَالتَّصْلِيَة : التَّفْعِلَة مِنْ صَلَّاهُ اللَّه النَّار فَهُوَ يُصَلِّيه تَصْلِيَة , وَذَلِكَ إِذَا أَحْرَقَهُ بِهَا .</p></td></tr></table></body></html>
