<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَلَا تُطِعِ الْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَلَا تُطِعِ الْمُكَذِّبِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره لِنَبِيِّهِ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : <quran>{ فَلَا تُطِعِ } </quran>يَا مُحَمَّد <quran>{ الْمُكَذِّبِينَ } </quran>بِآيَاتِ اللَّه وَرَسُوله .</p></td></tr></table></body></html>
