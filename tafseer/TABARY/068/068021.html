<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَتَنَادَوْا مُصْبِحِينَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَتَنَادَوْا مُصْبِحِينَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : فَتَنَادَى هَؤُلَاءِ الْقَوْم وَهُمْ أَصْحَاب الْجَنَّة . يَقُول : نَادَى بَعْضهمْ بَعْضًا <quran>{ مُصْبِحِينَ } </quran>يَقُول : بَعْد أَنْ أَصْبَحُوا .</p></td></tr></table></body></html>
