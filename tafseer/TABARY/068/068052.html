<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُوَ إِلَّا ذِكْرٌ لِلْعَالَمِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَمَا مُحَمَّد إِلَّا ذِكْر ذَكَّرَ اللَّه بِهِ الْعَالَمِينَ الثَّقَلَيْنِ الْجِنّ وَالْإِنْس . آخِر تَفْسِير سُورَة ن وَالْقَلَم .</p></td></tr></table></body></html>
