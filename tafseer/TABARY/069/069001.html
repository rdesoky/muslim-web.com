<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الْحَاقَّةُ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ الْحَاقَّة } </quran></subtitle>يَقُول تَعَالَى ذِكْره : السَّاعَة <quran>{ الْحَاقَّة } </quran>الَّتِي تَحِقّ فِيهَا الْأُمُور , وَيَجِب فِيهَا الْجَزَاء عَلَى الْأَعْمَال .</p></td></tr></table></body></html>
