<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا نُفِخَ فِي الصُّورِ نَفْخَةٌ وَاحِدَةٌ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَإِذَا نُفِخَ فِي الصُّور نَفْخَة وَاحِدَة } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ فَإِذَا نُفِخَ فِي الصُّور } </quran>إِسْرَافِيل <quran>{ نَفْخَة وَاحِدَة } </quran>وَهِيَ النَّفْخَة الْأُولَى ,</p></td></tr></table></body></html>
