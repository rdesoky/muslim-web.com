<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>خُذُوهُ فَغُلُّوهُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ خُذُوهُ فَغُلُّوهُ } </quran>يَقُول تَعَالَى ذِكْره لِمَلَائِكَتِهِ مِنْ خُزَّان جَهَنَّم : <quran>{ خُذُوهُ فَغُلُّوهُ }</quran></p></td></tr></table></body></html>
