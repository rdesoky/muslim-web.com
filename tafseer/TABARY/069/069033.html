<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ كَانَ لَا يُؤْمِنُ بِاللَّهِ الْعَظِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّهُ كَانَ لَا يُؤْمِن بِاللَّهِ الْعَظِيم } </quran>يَقُول : افْعَلُوا ذَلِكَ بِهِ جَزَاء لَهُ عَلَى كُفْره بِاللَّهِ فِي الدُّنْيَا , إِنَّهُ كَانَ لَا يُصَدِّق بِوَحْدَانِيَّةِ اللَّه الْعَظِيم .</p></td></tr></table></body></html>
