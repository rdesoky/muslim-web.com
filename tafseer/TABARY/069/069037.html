<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَأْكُلُهُ إِلَّا الْخَاطِئُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لَا يَأْكُلهُ إِلَّا الْخَاطِئُونَ } </quran>يَقُول : لَا يَأْكُل الطَّعَام الَّذِي مِنْ غِسْلِين إِلَّا الْخَاطِئُونَ , وَهُمْ الْمُذْنِبُونَ الَّذِينَ ذُنُوبهمْ كُفْر بِاللَّهِ .</p></td></tr></table></body></html>
