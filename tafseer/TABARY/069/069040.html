<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّهُ لَقَوْل رَسُول كَرِيم } </quran>يَقُول تَعَالَى ذِكْره : إِنَّ هَذَا الْقُرْآن لَقَوْل رَسُول كَرِيم , وَهُوَ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ يَتْلُوهُ عَلَيْهِمْ .</p></td></tr></table></body></html>
