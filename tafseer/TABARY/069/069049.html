<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّا لَنَعْلَمُ أَنَّ مِنْكُمْ مُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَإِنَّا لَنَعْلَم أَنَّ مِنْكُمْ مُكَذِّبِينَ } </quran>يَقُول تَعَالَى ذِكْره : وَإِنَّا لَنَعْلَم أَنَّ مِنْكُمْ مُكَذِّبِينَ أَيّهَا النَّاس بِهَذَا الْقُرْآن .</p></td></tr></table></body></html>
