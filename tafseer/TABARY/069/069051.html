<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّهُ لَحَقُّ الْيَقِينِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَإِنَّهُ لَلْحَقّ الْيَقِين الَّذِينَ لَا شَكّ فِيهِ أَنَّهُ مِنْ عِنْد اللَّه , لَمْ يَتَقَوَّلهُ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ .</p></td></tr></table></body></html>
