<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِذَا مَسَّهُ الشَّرُّ جَزُوعًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِذَا مَسَّهُ الشَّرّ جَزُوعًا } </quran>يَقُول : إِذَا قَلَّ مَاله وَنَالَهُ الْفَقْر وَالْعُدْم فَهُوَ جَزُوع مِنْ ذَلِكَ لَا صَبْر لَهُ عَلَيْهِ .</p></td></tr></table></body></html>
