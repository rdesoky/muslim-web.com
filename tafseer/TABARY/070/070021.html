<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا مَسَّهُ الْخَيْرُ مَنُوعًا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَإِذَا كَثُرَ مَاله , وَنَالَ الْغِنَى فَهُوَ مَنُوع لِمَا فِي يَده , بَخِيل بِهِ , لَا يُنْفِقهُ فِي طَاعَة اللَّه , وَلَا يُؤَدِّي حَقّ اللَّه مِنْهُ.</p></td></tr></table></body></html>
