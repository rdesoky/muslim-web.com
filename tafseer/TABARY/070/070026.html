<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ يُصَدِّقُونَ بِيَوْمِ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَالَّذِينَ يُصَدِّقُونَ بِيَوْمِ الدِّين } </quran>يَقُول : وَإِلَّا الَّذِينَ يُقِرُّونَ بِالْبَعْثِ يَوْم الْبَعْث وَالْمُجَازَاة .</p></td></tr></table></body></html>
