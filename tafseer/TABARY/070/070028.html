<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ عَذَاب رَبّهمْ غَيْر مَأْمُون } </quran>أَنْ يَنَال مَنْ عَصَاهُ وَخَالَفَ أَمْره .</p></td></tr></table></body></html>
