<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ } </quran>يَعْنِي أَقْبَالهمْ حَافِظُونَ عَنْ كُلّ مَا حَرَّمَ اللَّه عَلَيْهِمْ وَضْعهَا فِيهِ</p></td></tr></table></body></html>
