<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَالَّذِينَ هُمْ بِشَهَادَاتِهِمْ قَائِمُونَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَالَّذِينَ لَا يَكْتُمُونَ مَا اسْتُشْهِدُوا عَلَيْهِ , وَلَكِنَّهُمْ يَقُومُونَ بِأَدَائِهَا , حَيْثُ يَلْزَمهُمْ أَدَاؤُهَا غَيْر مُغَيَّرَة وَلَا مُبَدَّلَة.</p></td></tr></table></body></html>
