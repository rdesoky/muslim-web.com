<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَهْدِي إِلَى الرُّشْدِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : يَدُلّ عَلَى الْحَقّ وَسَبِيل الصَّوَاب.</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>فَآمَنَّا بِهِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : فَصَدَّقْنَاهُ.</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَنْ نُشْرِكَ بِرَبِّنَا أَحَدًا</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَلَنْ نُشْرِك بِرَبِّنَا أَحَدًا } </quran>مِنْ خَلْقه .</p></td></tr></table></body></html>
