<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَأَمَّا الْقَاسِطُونَ فَكَانُوا لِجَهَنَّمَ حَطَبًا</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَأَمَّا الْقَاسِطُونَ } </quran>يَقُول : الْجَائِرُونَ عَنِ الْإِسْلَام , <quran>{ فَكَانُوا لِجَهَنَّم حَطَبًا } </quran>تُوقَد بِهِمْ .</p></td></tr></table></body></html>
