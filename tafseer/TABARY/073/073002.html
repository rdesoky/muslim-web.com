<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُمِ اللَّيْلَ إِلَّا قَلِيلًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ قُمِ اللَّيْل إِلَّا قَلِيلًا } </quran>يَقُول لِنَبِيِّهِ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : <quran>{ قُمِ اللَّيْل } </quran>يَا مُحَمَّد كُلّه <quran>{ إِلَّا قَلِيلًا } </quran>مِنْهُ.</p></td></tr></table></body></html>
