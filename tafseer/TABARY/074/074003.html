<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَرَبَّكَ فَكَبِّرْ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَرَبّك فَكَبِّرْ } </quran>يَقُول تَعَالَى ذِكْره : وَرَبّك يَا مُحَمَّد فَعَظِّمْ بِعِبَادَتِهِ , وَالرَّغْبَة إِلَيْهِ فِي حَاجَاتك دُون غَيْره مِنَ الْآلِهَة وَالْأَنْدَاد .</p></td></tr></table></body></html>
