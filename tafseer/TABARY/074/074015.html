<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ يَطْمَعُ أَنْ أَزِيدَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ يَطْمَع أَنْ أَزِيد } </quran>يَقُول تَعَالَى ذِكْره : ثُمَّ يَأْمُل وَيَرْجُو أَنْ أَزِيدهُ مِنَ الْمَال وَالْوَلَد عَلَى مَا أَعْطَيْته .</p></td></tr></table></body></html>
