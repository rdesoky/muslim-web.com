<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ عَبَسَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : ثُمَّ قَبَضَ مَا بَيْن عَيْنَيْهِ .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَبَسَرَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : كَلَحَ وَجْهه ; وَمِنْهُ قَوْل تَوْبَة بْن الْحُمَيِّر : <poem type=2><part>وَقَدْ رَابَنِي مِنْهَا صُدُود رَأَيْته </part><part>وَإِعْرَاضهَا عَنْ حَاجَتِي وَبُسُورهَا</part></poem></p></td></tr></table></body></html>
