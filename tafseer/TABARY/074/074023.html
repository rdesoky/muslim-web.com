<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ } </quran>يَقُول تَعَالَى ذِكْره : ثُمَّ وَلَّى عَنِ الْإِيمَان وَالتَّصْدِيق بِمَا أَنْزَلَ اللَّه مِنْ كِتَابه , وَاسْتَكْبَرَ عَنْ الْإِقْرَار بِالْحَقِّ .</p></td></tr></table></body></html>
