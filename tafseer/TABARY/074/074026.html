<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>سَأُصْلِيهِ سَقَرَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ سَأُصْلِيهِ سَقَر } </quran></subtitle>يَعْنِي تَعَالَى ذِكْره بِقَوْلِهِ : <quran>{ سَأُصْلِيهِ سَقَر } </quran>سَأُورِدُهُ بَابًا مِنْ أَبْوَاب جَهَنَّم اسْمه سَقَر ; وَلَمْ يُجَرّ سَقَر لِأَنَّهُ اسْم مِنْ أَسْمَاء جَهَنَّم .</p></td></tr></table></body></html>
