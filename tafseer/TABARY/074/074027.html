<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا سَقَرُ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : وَأَيّ شَيْء أَدْرَاك يَا مُحَمَّد أَيّ شَيْء سَقَر .</p></td></tr></table></body></html>
