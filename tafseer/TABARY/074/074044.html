<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَمْ نَكُ نُطْعِمُ الْمِسْكِينَ</font></td></tr><tr><td align=right dir=rtl><p>بُخْلًا بِمَا خَوَّلَهُمْ اللَّه , وَمَنْعًا لَهُ مِنْ حَقّه .</p></td></tr></table></body></html>
