<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ شَاءَ ذَكَرَهُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَمَنْ شَاءَ } </quran>يَقُول تَعَالَى ذِكْره : فَمَنْ شَاءَ مِنْ عِبَاد اللَّه الَّذِينَ ذَكَّرَهُمْ اللَّه بِهَذَا الْقُرْآن ذَكَرَهُ , فَاتَّعَظَ فَاسْتَعْمَلَ مَا فِيهِ مِنْ أَمْر اللَّه وَنَهْيه .</p></td></tr></table></body></html>
