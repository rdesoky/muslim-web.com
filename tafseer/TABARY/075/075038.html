<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ كَانَ عَلَقَة } </quran>يَقُول تَعَالَى ذِكْره : ثُمَّ كَانَ دَمًا مِنْ بَعْد مَا كَانَ نُطْفَة , ثُمَّ عَلَقَة , ثُمَّ سَوَّاهُ بَشَرًا سَوِيًّا , نَاطِقًا سَمِيعًا بَصِيرًا</p></td></tr></table></body></html>
