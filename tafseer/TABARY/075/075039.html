<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنْثَى</font></td></tr><tr><td align=right dir=rtl><p><quran>{ فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَر وَالْأُنْثَى } </quran>يَقُول تَعَالَى ذِكْره : فَجَعَلَ مِنْ هَذَا الْإِنْسَان بَعْد مَا سَوَّاهُ خَلْقًا سَوِيًّا أَوْلَادًا لَهُ , ذُكُورًا وَإِنَاثًا</p></td></tr></table></body></html>
