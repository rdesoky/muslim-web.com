<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : <quran>{ وَاذْكُرْ } </quran>يَا مُحَمَّد <quran>{ اِسْم رَبّك } </quran>فَادْعُهُ بِهِ بُكْرَة فِي صَلَاة الصُّبْح , وَعَشِيًّا فِي صَلَاة الظُّهْر وَالْعَصْر .</p></td></tr></table></body></html>
