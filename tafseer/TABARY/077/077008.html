<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِذَا النُّجُومُ طُمِسَتْ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَإِذَا النُّجُوم طُمِسَتْ } </quran>يَقُول : فَإِذَا النُّجُوم ذَهَبَ ضِيَاؤُهَا , فَلَمْ يَكُنْ لَهَا نُور وَلَا ضَوْء .</p></td></tr></table></body></html>
