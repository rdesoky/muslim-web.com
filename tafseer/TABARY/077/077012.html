<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِأَيِّ يَوْمٍ أُجِّلَتْ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لِأَيِّ يَوْم أُجِّلَتْ } </quran>يَقُول تَعَالَى ذِكْره مُعَجِّبًا عِبَاده مِنْ هَوْل ذَلِكَ الْيَوْم وَشِدَّته : لِأَيِّ يَوْم أُجِّلَتْ الرُّسُل وَوُقِّتَتْ , مَا أَعْظَمه وَأَهْوَله .</p></td></tr></table></body></html>
