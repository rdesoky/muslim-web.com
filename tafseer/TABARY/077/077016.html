<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نُهْلِكِ الْأَوَّلِينَ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول تَعَالَى ذِكْره : أَلَمْ نُهْلِك الْأُمَم الْمَاضِينَ الَّذِينَ كَذَّبُوا رُسُلِي , وَجَحَدُوا آيَاتِي مِنْ قَوْم نُوح وَعَاد وَثَمُود .</p></td></tr></table></body></html>
