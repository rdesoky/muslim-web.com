<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ نُتْبِعُهُمُ الْآخِرِينَ</font></td></tr><tr><td align=right dir=rtl><p>ثُمَّ نُتْبِعهُمْ الْآخِرِينَ بَعْدهمْ , مِمَّنْ سَلَكَ سَبِيلهمْ فِي الْكُفْر بِي وَبِرَسُولِي , كَقَوْمِ إِبْرَاهِيم وَقَوْم لُوط , وَأَصْحَاب مَدْيَن , فَنُهْلِكهُمْ كَمَا أَهْلَكْنَا الْأَوَّلِينَ قَبْلهمْ .</p></td></tr></table></body></html>
