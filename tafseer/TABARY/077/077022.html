<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى قَدَرٍ مَعْلُومٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِلَى قَدَر مَعْلُوم } </quran>يَقُول : إِلَى وَقْت مَعْلُوم لِخُرُوجِهِ مِنْ الرَّحِم عِنْد اللَّه .</p></td></tr></table></body></html>
