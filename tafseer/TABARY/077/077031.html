<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا ظَلِيلٍ وَلَا يُغْنِي مِنَ اللَّهَبِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لَا ظَلِيل } </quran>يَقُول : لَا هُوَ يُظِلّهُمْ مِنْ حَرّهَا <quran>{ وَلَا يُغْنِي مِنْ اللَّهَب } </quran>وَلَا يُكِنُّهُمْ مِنْ لَهَبهَا .</p></td></tr></table></body></html>
