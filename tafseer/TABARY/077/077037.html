<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله <quran>{ وَيْل يَوْمئِذٍ لِلْمُكَذِّبِينَ } </quran>يَقُول تَعَالَى ذِكْره : وَيْل يَوْمئِذٍ لِلْمُكَذِّبِينَ بِخَبَرِ اللَّه عَنْ هَؤُلَاءِ الْقَوْم , وَمَا هُوَ فَاعِل بِهِمْ يَوْم الْقِيَامَة .</p></td></tr></table></body></html>
