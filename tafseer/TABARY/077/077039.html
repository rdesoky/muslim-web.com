<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَإِنْ كَانَ لَكُمْ كَيْدٌ فَكِيدُونِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَاَللَّه مُنْجِز لَكُمْ مَا وَعَدَكُمْ فِي الدُّنْيَا مِنْ الْعِقَاب عَلَى تَكْذِيبكُمْ إِيَّاهُ بِأَنَّكُمْ مَبْعُوثُونَ لِهَذَا الْيَوْم إِنْ كَانَتْ لَكُمْ حِيلَة تَحْتَالُونَهَا فِي التَّخَلُّص مِنْ عِقَابه الْيَوْم فَاحْتَالُوا .</p></td></tr></table></body></html>
