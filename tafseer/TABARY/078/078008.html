<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَخَلَقْنَاكُمْ أَزْوَاجًا</font></td></tr><tr><td align=right dir=rtl><p>ذُكْرَانًا وَإِنَاثًا , وَطِوَالًا وَقِصَارًا , أَوْ ذَوِي دَمَامَة وَجَمَال , مِثْل قَوْله : <quran>{ الَّذِينَ ظَلَمُوا وَأَزْوَاجهمْ } </quran><sourainfo>37 22 </sourainfo>. يَعْنِي بِهِ : صَيَّرْنَاهُمْ .</p></td></tr></table></body></html>
