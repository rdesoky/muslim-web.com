<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَكَذَّبَ وَعَصَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَكَذَّبَ وَعَصَى } </quran>يَقُول : فَكَذَّبَ فِرْعَوْن مُوسَى فِيمَا أَتَاهُ مِنْ الْآيَات الْمُعْجِزَة , وَعَصَاهُ فِيمَا أَمَرَهُ بِهِ مِنْ طَاعَته رَبّه , وَخَشْيَته إِيَّاهُ .</p></td></tr></table></body></html>
