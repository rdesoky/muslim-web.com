<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَوْمَ يَتَذَكَّرُ الْإِنْسَانُ مَا سَعَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ يَوْم يَتَذَكَّر الْإِنْسَان مَا سَعَى } </quran>يَقُول : إِذَا جَاءَتْ الطَّامَّة يَوْم يَتَذَكَّر الْإِنْسَان مَا عَمِلَ فِي الدُّنْيَا مِنْ خَيْر وَشَرّ , وَذَلِكَ سَعْيه .</p></td></tr></table></body></html>
