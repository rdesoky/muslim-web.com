<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَبُرِّزَتِ الْجَحِيمُ لِمَنْ يَرَى</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَبُرِّزَتْ الْجَحِيم } </quran>يَقُول : وَأُظْهِرَتْ الْجَحِيم , وَهِيَ نَار اللَّه لِمَنْ يَرَاهَا . يَقُول : لِأَبْصَارِ النَّاظِرِينَ .</p></td></tr></table></body></html>
