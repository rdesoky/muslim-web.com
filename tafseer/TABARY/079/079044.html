<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِلَى رَبِّكَ مُنْتَهَاهَا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِلَى رَبّك مُنْتَهَاهَا } </quran>يَقُول : إِلَى رَبّك مُنْتَهَى عِلْمهَا , أَيْ إِلَيْهِ يَنْتَهِي عِلْم السَّاعَة , لَا يَعْلَم وَقْت قِيَامهَا غَيْره .</p></td></tr></table></body></html>
