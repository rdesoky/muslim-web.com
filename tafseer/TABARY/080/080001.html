<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>عَبَسَ وَتَوَلَّى</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ عَبَسَ وَتَوَلَّى } </quran></subtitle>يَعْنِي تَعَالَى ذِكْره بِقَوْلِهِ : <quran>{ عَبَسَ } </quran>: قَبَضَ وَجْهه تَكَرُّهًا , <quran>{ وَتَوَلَّى } </quran>يَقُول : وَأَعْرَضَ</p></td></tr></table></body></html>
