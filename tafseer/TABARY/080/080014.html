<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مَرْفُوعَةٍ مُطَهَّرَةٍ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي فِي اللَّوْح الْمَحْفُوظ , وَهُوَ الْمَرْفُوع الْمُطَهَّر عِنْد اللَّه .</p></td></tr></table></body></html>
