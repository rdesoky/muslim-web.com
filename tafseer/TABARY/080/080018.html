<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ أَيِّ شَيْءٍ خَلَقَهُ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ مِنْ أَيّ شَيْء خَلَقَهُ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : مِنْ أَيّ شَيْء خَلَقَ الْإِنْسَان الْكَافِر رَبّه حَتَّى يَتَكَبَّر . وَيَتَعَظَّم عَنْ طَاعَة رَبّه , وَالْإِقْرَار بِتَوْحِيدِهِ .</p></td></tr></table></body></html>
