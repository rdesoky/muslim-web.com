<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَنَّا صَبَبْنَا الْمَاءَ صَبًّا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَنَّا صَبَبْنَا الْمَاء صَبًّا } </quran>يَقُول : أَنَّا أَنْزَلْنَا الْغَيْث مِنْ السَّمَاء إِنْزَالًا , وَصَبَبْنَاهُ عَلَيْهَا صَبًّا .</p></td></tr></table></body></html>
