<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَنْبَتْنَا فِيهَا حَبًّا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي حَبّ الزَّرْع , وَهُوَ كُلّ مَا أَخْرَجَتْهُ الْأَرْض مِنْ الْحُبُوب , كَالْحِنْطَةِ وَالشَّعِير وَغَيْر ذَلِكَ .</p></td></tr></table></body></html>
