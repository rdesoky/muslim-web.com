<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَصَاحِبَتِهِ</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي زَوْجَته الَّتِي كَانَتْ زَوْجَته فِي الدُّنْيَا .</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَبَنِيهِ</font></td></tr><tr><td align=right dir=rtl><p>حَذَرًا مِنْ مُطَالَبَتهمْ إِيَّاهُ , بِمَا بَيْنه وَبَيْنهمْ مِنْ التَّبِعَات وَالْمَظَالِم .</p></td></tr></table></body></html>
