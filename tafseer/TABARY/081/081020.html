<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ذِي قُوَّةٍ عِنْدَ ذِي الْعَرْشِ مَكِينٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ذِي قُوَّة عِنْد ذِي الْعَرْش مَكِين } </quran>يَقُول تَعَالَى ذِكْره : ذِي قُوَّة , يَعْنِي جِبْرَائِيل عَلَى مَا كُلِّفَ مِنْ أَمْر غَيْر عَاجِز <quran>{ عِنْد ذِي الْعَرْش مَكِين } </quran>يَقُول : هُوَ مَكِين عِنْد رَبّ الْعَرْش الْعَظِيم .</p></td></tr></table></body></html>
