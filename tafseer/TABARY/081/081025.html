<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا هُوَ بِقَوْلِ شَيْطَانٍ رَجِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَمَا هُوَ بِقَوْلِ شَيْطَان رَجِيم } </quran>يَقُول تَعَالَى ذِكْره : وَمَا هَذَا الْقُرْآن بِقَوْلِ شَيْطَان مَلْعُون مَطْرُود , وَلَكِنَّهُ كَلَام اللَّه وَوَحْيه .</p></td></tr></table></body></html>
