<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ } </quran>يَقُول : وَإِنَّ عَلَيْكُمْ رُقَبَاء حَافِظِينَ يَحْفَظُونَ أَعْمَالكُمْ , وَيَخُصُّونَهَا عَلَيْكُمْ</p></td></tr></table></body></html>
