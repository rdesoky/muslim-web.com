<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>يَعْلَمُونَ مَا تَفْعَلُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ يَعْلَمُونَ مَا تَفْعَلُونَ } </quran>يَقُول : يَعْلَم هَؤُلَاءِ الْحَافِظُونَ مَا تَفْعَلُونَ مِنْ خَيْر أَوْ شَرّ , يُحْصُونَ ذَلِكَ عَلَيْكُمْ .</p></td></tr></table></body></html>
