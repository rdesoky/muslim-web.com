<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ الْأَبْرَار لَفِي نَعِيم } </quran>يَقُول جَلَّ ثَنَاؤُهُ : إِنَّ الَّذِينَ بَرُّوا بِأَدَاءِ فَرَائِض اللَّه , وَاجْتِنَاب مَعَاصِيه لَفِي نَعِيم الْجِنَان يَنْعَمُونَ فِيهَا .</p></td></tr></table></body></html>
