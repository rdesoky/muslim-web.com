<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَإِنَّ الْفُجَّار لَفِي جَحِيم } </quran></subtitle>يَقُول تَعَالَى ذِكْره : <quran>{ وَإِنَّ الْفُجَّار } </quran>الَّذِينَ كَفَرُوا بِرَبِّهِمْ <quran>{ لَفِي جَحِيم } .</quran></p></td></tr></table></body></html>
