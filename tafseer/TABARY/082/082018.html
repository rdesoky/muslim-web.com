<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ مَا أَدْرَاك مَا يَوْم الدِّين } </quran>يَقُول : ثُمَّ أَيّ شَيْء أَشْعَرَك أَيّ شَيْء يَوْم الْمُجَازَاة وَالْحِسَاب يَا مُحَمَّد , تَعْظِيمًا لِأَمْرِهِ .</p></td></tr></table></body></html>
