<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَا يَظُنُّ أُولَئِكَ أَنَّهُمْ مَبْعُوثُونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ أَلَا يَظُنّ أُولَئِكَ أَنَّهُمْ مَبْعُوثُونَ } </quran>يَقُول تَعَالَى ذِكْره : أَلَا يَظُنّ هَؤُلَاءِ الْمُطَفِّفُونَ النَّاس فِي مَكَايِيلهمْ وَمَوَازِينهمْ , أَنَّهُمْ مَبْعُوثُونَ مِنْ قُبُورهمْ بَعْد مَمَاتهمْ ,</p></td></tr></table></body></html>
