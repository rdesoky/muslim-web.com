<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>ثُمَّ إِنَّهُمْ لَصَالُو الْجَحِيمِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ ثُمَّ إِنَّهُمْ لَصَالُوا الْجَحِيم } </quran>يَقُول تَعَالَى ذِكْره : ثُمَّ إِنَّهُمْ لَوَارِدُو الْجَحِيم , فَمَشْوِيُّونَ فِيهَا .</p></td></tr></table></body></html>
