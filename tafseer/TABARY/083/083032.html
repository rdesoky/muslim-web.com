<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَؤُلَاءِ لَضَالُّونَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَؤُلَاءِ لَضَالُّونَ } </quran>يَقُول تَعَالَى ذِكْره : وَإِذَا رَأَى الْمُجْرِمُونَ الْمُؤْمِنِينَ قَالُوا لَهُمْ : إِنَّ هَؤُلَاءِ لَضَالُّونَ , عَنْ مَحَجَّة الْحَقّ , وَسَبِيل الْقَصْد</p></td></tr></table></body></html>
