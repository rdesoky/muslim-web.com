<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَبَشِّرْهُمْ بِعَذَابٍ أَلِيمٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَبَشِّرْهُمْ بِعَذَابٍ أَلِيم } </quran>يَقُول جَلَّ ثَنَاؤُهُ : فَبَشِّرْ يَا مُحَمَّد هَؤُلَاءِ الْمُكَذِّبِينَ بِآيَاتِ اللَّه , بِعَذَابٍ أَلِيم لَهُمْ عِنْد اللَّه مُوجِع</p></td></tr></table></body></html>
