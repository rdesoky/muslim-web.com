<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّهُ مِنْ وَرَائِهِمْ مُحِيطٌ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَاَللَّه مِنْ وَرَائِهِمْ مُحِيط } </quran>بِأَعْمَالِهِمْ , مُحْصٍ لَهَا , لَا يَخْفَى عَلَيْهِ مِنْهَا شَيْء , وَهُوَ مُجَازِيهمْ عَلَى جَمِيعهَا .</p></td></tr></table></body></html>
