<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّهُمْ يَكِيدُونَ كَيْدًا</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّهُمْ يَكِيدُونَ كَيْدًا } </quran>يَقُول تَعَالَى ذِكْره : إِنَّ هَؤُلَاءِ الْمُكَذِّبِينَ بِاَللَّهِ وَرَسُوله وَالْوَعْد وَالْوَعِيد يَمْكُرُونَ مَكْرًا .</p></td></tr></table></body></html>
