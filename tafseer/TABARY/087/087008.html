<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَنُيَسِّرُكَ لِلْيُسْرَى</font></td></tr><tr><td align=right dir=rtl><p>الْقَوْلِ فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَنُيَسِّرُك لِلْيُسْرَى } </quran>يَقُول تَعَالَى ذِكْره : وَنُسَهِّلك يَا مُحَمَّد لِعَمَلِ الْخَيْر , وَهُوَ الْيُسْرَى ; وَالْيُسْرَى : هُوَ الْفُعْلَى مِنْ الْيُسْر .</p></td></tr></table></body></html>
