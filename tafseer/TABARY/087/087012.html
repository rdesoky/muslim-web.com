<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي يَصْلَى النَّارَ الْكُبْرَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ الَّذِي يَصْلَى النَّار الْكُبْرَى } </quran>يَقُول : الَّذِي يَرِد نَار جَهَنَّم , وَهِيَ النَّار الْكُبْرَى , وَيَعْنِي بِالْكُبْرَى لِشِدَّةِ الْحَرّ وَالْأَلَم .</p></td></tr></table></body></html>
