<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يُسْمِنُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لَا يُسْمِن } </quran>يَقُول : لَا يُسْمِن هَذَا الضَّرِيع يَوْم الْقِيَامَة أَكَلَته مِنْ أَهْل النَّار ,</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يُغْنِي مِنْ جُوعٍ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : وَلَا يُشْبِعهُمْ مِنْ جُوع يُصِيبهُمْ .</p></td></tr></table></body></html>
