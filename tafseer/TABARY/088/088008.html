<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وُجُوهٌ يَوْمَئِذٍ نَاعِمَةٌ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وُجُوه يَوْمئِذٍ نَاعِمَة } </quran></subtitle>يُقَوَّل تَعَالَى ذِكْره : <quran>{ وُجُوه يَوْمئِذٍ } </quran>يَعْنِي : يَوْم الْقِيَامَة <quran>{ نَاعِمَة } </quran>يَقُول : هِيَ نَاعِمَة بِتَنْعِيمِ اللَّه أَهْلهَا فِي جَنَّاته , وَهُمْ أَهْل الْإِيمَان بِاَللَّهِ .</p></td></tr></table></body></html>
