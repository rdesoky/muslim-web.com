<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لِسَعْيِهَا رَاضِيَةٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لِسَعْيِهَا رَاضِيَة } </quran>يَقُول : لِعَمَلِهَا الَّذِي عَمِلَتْ فِي الدُّنْيَا مِنْ طَاعَة رَبّهَا رَاضِيَة . وَقِيلَ : <quran>{ لِسَعْيِهَا رَاضِيَة } </quran>وَالْمَعْنَى : لِثَوَابِ سَعْيهَا فِي الْآخِرَة رَاضِيَة .</p></td></tr></table></body></html>
