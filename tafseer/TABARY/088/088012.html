<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فِيهَا عَيْنٌ جَارِيَةٌ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فِيهَا عَيْن جَارِيَة } </quran>يَقُول : فِي الْجَنَّة الْعَالِيَة عَيْن جَارِيَة فِي غَيْر أُخْدُود .</p></td></tr></table></body></html>
