<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَيُعَذِّبهُ اللَّه الْعَذَاب الْأَكْبَر } </quran>: هُوَ عَذَاب جَهَنَّم , يَقُول : فَيُعَذِّبهُ اللَّه الْعَذَاب الْأَكْبَر عَلَى كُفْره فِي الدُّنْيَا , وَعَذَاب جَهَنَّم فِي الْآخِرَة .</p></td></tr></table></body></html>
