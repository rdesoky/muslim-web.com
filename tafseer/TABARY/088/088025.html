<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِلَيْنَا إِيَابَهُمْ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ إِلَيْنَا إِيَابهمْ } </quran>يَقُول : إِنَّ إِلَيْنَا رُجُوع مَنْ كَفَرَ وَمَعَادهمْ .</p></td></tr></table></body></html>
