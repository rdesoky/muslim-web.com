<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَأَكْثَرُوا فِيهَا الْفَسَادَ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ فَأَكْثَرُوا فِيهَا الْفَسَاد } </quran></subtitle>يَقُول تَعَالَى ذِكْره : فَأَكْثَرُوا فِي الْبِلَاد الْمَعَاصِي , وَرُكُوب مَا حَرَّمَ اللَّه عَلَيْهِمْ</p></td></tr></table></body></html>
