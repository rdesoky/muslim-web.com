<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>أَلَمْ نَجْعَلْ لَهُ عَيْنَيْنِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ أَلَمْ نَجْعَل لَهُ عَيْنَيْنِ } </quran></subtitle>يَقُول تَعَالَى ذِكْره : أَلَمْ نَجْعَل لِهَذَا الْقَائِل <quran>{ أَهْلَكْت مَالًا لُبَدًا } </quran>عَيْنَيْنِ يُبْصِر بِهِمَا حُجَج اللَّه عَلَيْهِ.</p></td></tr></table></body></html>
