<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَاللَّيْلِ إِذَا يَغْشَى</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ وَاللَّيْل إِذَا يَغْشَى } </quran></subtitle>يَقُول تَعَالَى ذِكْره مُقْسِمًا بِاللَّيْلِ إِذَا غَشَّى النَّهَار بِظُلْمَتِهِ , فَأَذْهَبَ ضَوْءَهُ , وَجَاءَتْ ظُلْمَته : <quran>{ وَاللَّيْل إِذَا يَغْشَى } </quran>النَّهَار</p></td></tr></table></body></html>
