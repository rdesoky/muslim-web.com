<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَسَنُيَسِّرُهُ لِلْيُسْرَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَسَنُيَسِّرُهُ لِلْيُسْرَى } </quran>يَقُول : فَسَنُهَيِّئُهُ لِلْخَلَّةِ الْيُسْرَى , وَهِيَ الْعَمَل بِمَا يَرْضَاهُ اللَّه مِنْهُ فِي الدُّنْيَا , لِيُوجِب لَهُ بِهِ فِي الْآخِرَة الْجَنَّة .</p></td></tr></table></body></html>
