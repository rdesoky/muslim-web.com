<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>لَا يَصْلَاهَا إِلَّا الْأَشْقَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ لَا يَصْلَاهَا إِلَّا الْأَشْقَى } </quran>يَقُول جَلَّ ثَنَاؤُهُ : لَا يَدْخُلهَا فَيَصْلَى بِسَعِيرِهَا إِلَّا الْأَشْقَى ,</p></td></tr></table></body></html>
