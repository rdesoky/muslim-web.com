<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ الَّذِي يُؤْتِي مَاله يَتَزَكَّى } </quran>يَقُول : الَّذِي يُعْطِي مَاله فِي الدُّنْيَا فِي حُقُوق اللَّه الَّتِي أَلْزَمَهُ إِيَّاهَا , <quran>{ يَتَزَكَّى } </quran>: يَعْنِي : يَتَطَهَّر بِإِعْطَائِهِ ذَلِكَ مِنْ ذُنُوبه .</p></td></tr></table></body></html>
