<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>الَّذِي عَلَّمَ بِالْقَلَمِ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ الَّذِي عَلَّمَ بِالْقَلَمِ } </quran>: خَلْقَهُ الْكِتَاب وَالْخَطّ , كَمَا : أَنَّ الْحَدِيث تَقَدَّمَ بَيَانه</p></td></tr></table></body></html>
