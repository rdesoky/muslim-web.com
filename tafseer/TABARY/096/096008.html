<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>إِنَّ إِلَى رَبِّكَ الرُّجْعَى</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ إِنَّ إِلَى رَبّك الرُّجْعَى } </quran>: يَقُول : إِنَّ إِلَى رَبّك يَا مُحَمَّد مَرْجِعه , فَذَائِق مِنْ أَلِيم عِقَابه مَا لَا قِبَل لَهُ بِهِ .</p></td></tr></table></body></html>
