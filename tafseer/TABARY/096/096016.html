<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ نَاصِيَة كَاذِبَة خَاطِئَة } </quran>فَخَفَضَ نَاصِيَة رَدًّا عَلَى النَّاصِيَة الْأُولَى بِالتَّكْرِيرِ , وَوَصَفَ النَّاصِيَة بِالْكَذِبِ وَالْخَطِيئَة , وَالْمَعْنَى لِصَاحِبِهَا .</p></td></tr></table></body></html>
