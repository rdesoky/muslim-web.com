<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ فَمَنْ يَعْمَل مِثْقَال ذَرَّة خَيْرًا يَرَهُ } </quran>يَقُول : فَمَنْ عَمِلَ فِي الدُّنْيَا وَزْن ذَرَّة مِنْ خَيْر , يَرَى ثَوَابه هُنَالِكَ</p></td></tr></table></body></html>
