<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَمَا أَدْرَاكَ مَا الْقَارِعَةُ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ و مَا أَدْرَاك مَا الْقَارِعَة } </quran>يَقُول تَعَالَى ذِكْره لِنَبِيِّهِ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : وَمَا أَشْعَرَك يَا مُحَمَّد أَيّ شَيْء الْقَارِعَة .</p></td></tr></table></body></html>
