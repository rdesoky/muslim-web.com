<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>فَهُوَ فِي عِيشَةٍ رَاضِيَةٍ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول فِي عِيشَة قَدْ رَضِيَهَا فِي الْجَنَّة , كَمَا : 29303 - حَدَّثَنَا بِشْر , قَالَ : ثنا يَزِيد , قَالَ : ثنا سَعِيد , عَنْ قَتَادَة <ather><quran>{ فَهُوَ فِي عِيشَة رَاضِيَة } </quran>يَعْنِي : فِي الْجَنَّة .</ather></p></td></tr></table></body></html>
