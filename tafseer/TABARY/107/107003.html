<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ</font></td></tr><tr><td align=right dir=rtl><p>وَقَوْله : <quran>{ وَلَا يَحُضّ عَلَى طَعَام الْمِسْكِين } </quran>يَقُول تَعَالَى ذِكْره : وَلَا يَحُثّ غَيْره عَلَى إِطْعَام الْمُحْتَاج مِنْ الطَّعَام .</p></td></tr></table></body></html>
