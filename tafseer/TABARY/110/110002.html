<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>وَرَأَيْتَ النَّاسَ</font></td></tr><tr><td align=right dir=rtl><p><quran>{ وَرَأَيْت النَّاس } </quran>مِنْ صُنُوف الْعَرَب وَقَبَائِلهَا أَهْل الْيَمَن مِنْهُمْ , وَقَبَائِل نِزَار</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>يَدْخُلُونَ فِي دِينِ اللَّهِ</font></td></tr><tr><td align=right dir=rtl><p>يَقُول : فِي دِين اللَّه الَّذِي ابْتَعَثَكَ بِهِ , وَطَاعَتك الَّتِي دَعَاهُمْ إِلَيْهَا</p></td></tr><tr><td align=right dir=rtl><font color=#0000FF>أَفْوَاجًا</font></td></tr><tr><td align=right dir=rtl><p>يَعْنِي : زُمَرًا , فَوْجًا فَوْجًا .</p></td></tr></table></body></html>
