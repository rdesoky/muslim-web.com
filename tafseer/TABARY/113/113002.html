<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>مِنْ شَرِّ مَا خَلَقَ</font></td></tr><tr><td align=right dir=rtl><p>وَقَالَ جَلَّ ثَنَاؤُهُ : <quran>{ مِنْ شَرّ مَا خَلَقَ } </quran>لِأَنَّهُ أَمَرَ نَبِيّه أَنْ يَسْتَعِيذ مِنْ شَرّ كُلّ شَيْء , إِذْ كَانَ كُلّ مَا سِوَاهُ , فَهُوَ مَا خَلَقَ .</p></td></tr></table></body></html>
