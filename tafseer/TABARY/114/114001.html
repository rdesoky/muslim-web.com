<html><head><meta http-equiv=Content-Type content="text/html; charset=utf-8"><title>القرآن الكريم - تفسير الطبري</title></head><body><table border=1 width=100%><tr><td align=right dir=rtl><font color=#0000FF>قُلْ أَعُوذُ بِرَبِّ النَّاسِ</font></td></tr><tr><td align=right dir=rtl><p><subtitle>الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : <quran>{ قُلْ أَعُوذ بِرَبِّ النَّاس } </quran></subtitle>يَقُول تَعَالَى ذِكْره لِنَبِيِّهِ مُحَمَّد صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ : قُلْ يَا مُحَمَّد أَسْتَجِير <quran>{ بِرَبِّ النَّاس }</quran></p></td></tr></table></body></html>
